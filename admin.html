<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Yönetici Paneli</title>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    padding:15px;
    background:#eceff1;
    font-family:Arial,sans-serif;
    color:#263238;
}
.header{
    background:linear-gradient(135deg,#263238,#455a64);
    color:white;
    padding:20px;
    text-align:center;
    border-radius:16px;
    margin-bottom:15px;
}
.box{
    background:white;
    padding:15px;
    border-radius:14px;
    margin-bottom:15px;
    box-shadow:0 2px 10px #00000012;
}
input,select{
    width:100%;
    padding:11px;
    margin:5px 0 10px;
    border:1px solid #ccc;
    border-radius:8px;
}
button{
    width:100%;
    padding:12px;
    border:0;
    border-radius:8px;
    font-weight:bold;
}
.green{background:#2e7d32;color:white}
.blue{background:#1565c0;color:white}
.red{background:#d32f2f;color:white}
.orange{background:#ef6c00;color:white}
.menu-tabs{
    display:flex;
    gap:6px;
    margin-bottom:15px;
}
.menu-tabs button{
    background:#cfd8dc;
    color:#263238;
}
.menu-tabs button.active{
    background:#37474f;
    color:white;
}
.panel{display:none}
.panel.active{display:block}
.product{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#fafafa;
    border:1px solid #ddd;
    padding:10px;
    border-radius:9px;
    margin-bottom:7px;
}
.masacard{
    border-left:6px solid #ff9800;
    background:#fff;
    padding:13px;
    border-radius:10px;
    margin-bottom:10px;
    box-shadow:0 2px 7px #0001;
}
.masacard h3{
    margin:0 0 8px;
}
.stat{
    display:flex;
    justify-content:space-between;
    padding:9px;
    background:#f5f5f5;
    margin-bottom:5px;
    border-radius:7px;
}
.bigstat{
    text-align:center;
    background:#263238;
    color:white;
    padding:18px;
    border-radius:12px;
    margin-bottom:10px;
}
.bigstat strong{
    display:block;
    font-size:28px;
    color:#ffca28;
}
</style>
</head>

<body>

<div class="header">
    <h2>⚙️ YÖNETİCİ PANELİ</h2>
    <small>Menü • Masalar • Hesaplar • Günlük İstatistik</small>
</div>

<div id="loginBox" class="box" style="max-width:400px;margin:40px auto;text-align:center">
    <h3>🔐 Yönetici Girişi</h3>
    <input type="password" id="passInput" placeholder="Yönetici Şifresi">
    <button class="blue" onclick="girisYap()">Giriş Yap</button>
</div>

<div id="adminContent" style="display:none">

<div class="menu-tabs">
    <button id="tabMenu" class="active" onclick="panelAc('menu')">
        ☕ Ürünler
    </button>
    <button id="tabHesap" onclick="panelAc('hesap')">
        🧾 Masa Hesapları
    </button>
    <button id="tabIstatistik" onclick="panelAc('istatistik')">
        📊 İstatistik
    </button>
</div>

<!-- ÜRÜN -->
<div id="panel-menu" class="panel active">

<div class="box">
<h3>➕ Ürün / Fiyat Ekle</h3>

<input id="yeniAd" placeholder="Ürün adı">
<input id="yeniFiyat" type="number" placeholder="Fiyat">

<select id="yeniKategori">
<option>Sıcak İçecekler</option>
<option>Soğuk İçecekler</option>
<option>Tatlılar</option>
<option>Atıştırmalıklar</option>
<option>Diğer</option>
</select>

<button class="green" onclick="urunEkle()">Ürünü Ekle</button>
</div>

<div class="box">
<h3>📋 Menü</h3>
<div id="adminUrunListesi"></div>
</div>

</div>

<!-- HESAPLAR -->
<div id="panel-hesap" class="panel">

<div class="box">
<h3>🧾 Aktif Masa Hesapları</h3>
<div id="masaListesi">Yükleniyor...</div>
</div>

</div>

<!-- İSTATİSTİK -->
<div id="panel-istatistik" class="panel">

<div class="box">
<h3>📊 Bugünkü İstatistik</h3>

<div class="bigstat">
    <small>TOPLAM HASILAT</small>
    <strong id="gunlukHasılat">0 TL</strong>
</div>

<div class="bigstat">
    <small>TOPLAM SİPARİŞ</small>
    <strong id="gunlukSiparis">0</strong>
</div>

<h3>🥤 Ürün Satışları</h3>
<div id="urunIstatistik"></div>

<hr>

<button class="red" onclick="istatistikSifirla()">
    ⚠️ BUGÜNKÜ İSTATİSTİKLERİ SIFIRLA
</button>

</div>
</div>

</div>

<script>
const firebaseConfig={
    databaseURL:"https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId:"dijitalkahve-67f0a",
    storageBucket:"dijitalkahve-67f0a.appspot.com",
    messagingSenderId:"326476599239"
};

if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);

const db=firebase.app().database(
    "https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app"
);

const ADMIN_SIFRE="1234";

function girisYap(){
    const p=document.getElementById("passInput").value;

    if(p===ADMIN_SIFRE){
        document.getElementById("loginBox").style.display="none";
        document.getElementById("adminContent").style.display="block";

        urunleriYukle();
        siparisleriYukle();
    }else{
        alert("❌ Hatalı şifre!");
    }
}

function panelAc(panel){
    document.querySelectorAll(".panel")
        .forEach(x=>x.classList.remove("active"));

    document.querySelectorAll(".menu-tabs button")
        .forEach(x=>x.classList.remove("active"));

    document.getElementById("panel-"+panel)
        .classList.add("active");

    if(panel==="menu")
        document.getElementById("tabMenu").classList.add("active");

    if(panel==="hesap")
        document.getElementById("tabHesap").classList.add("active");

    if(panel==="istatistik"){
        document.getElementById("tabIstatistik").classList.add("active");
        istatistikHesapla();
    }
}

/* ÜRÜNLER */
function urunleriYukle(){
    db.ref("urunler").on("value",snap=>{
        const data=snap.val()||{};
        const box=document.getElementById("adminUrunListesi");

        box.innerHTML="";

        if(!Object.keys(data).length){
            box.innerHTML="<p>Ürün bulunmuyor.</p>";
            return;
        }

        Object.keys(data).forEach(key=>{
            const x=data[key];

            box.innerHTML+=`
            <div class="product">
                <div>
                    <b>${x.ad}</b><br>
                    ${x.fiyat} TL
                    <small>(${x.kategori||"Diğer"})</small>
                </div>

                <button class="red"
                    style="width:auto"
                    onclick="urunSil('${key}')">
                    Sil
                </button>
            </div>`;
        });
    });
}

function urunEkle(){
    const ad=document.getElementById("yeniAd").value.trim();
    const fiyat=document.getElementById("yeniFiyat").value;
    const kategori=document.getElementById("yeniKategori").value;

    if(!ad||!fiyat){
        alert("Ürün adı ve fiyat girin.");
        return;
    }

    db.ref("urunler").push({
        ad:ad,
        fiyat:fiyat,
        kategori:kategori
    }).then(()=>{
        document.getElementById("yeniAd").value="";
        document.getElementById("yeniFiyat").value="";
    });
}

function urunSil(id){
    if(!confirm("Bu ürünü silmek istediğine emin misin?"))return;

    db.ref("urunler/"+id).remove();
}

/* SİPARİŞLER */
let siparisler={};

function siparisleriYukle(){
    db.ref("siparisler").on("value",snap=>{
        siparisler=snap.val()||{};
        masaHesaplariniGoster();
        istatistikHesapla();
    });
}

/* MASA HESAPLARI */
function masaHesaplariniGoster(){
    const box=document.getElementById("masaListesi");

    const masalar={};

    Object.keys(siparisler).forEach(key=>{
        const s=siparisler[key];

        if(s.durum!=="onaylandi")return;

        if(!masalar[s.masa])
            masalar[s.masa]=[];

        masalar[s.masa].push({
            key:key,
            sip:s
        });
    });

    box.innerHTML="";

    if(!Object.keys(masalar).length){
        box.innerHTML="<p style='text-align:center'>Aktif hesap bulunmuyor.</p>";
        return;
    }

    Object.keys(masalar)
    .sort((a,b)=>parseInt(a)-parseInt(b))
    .forEach(masa=>{

        let toplam=0;
        let urunHtml="";

        masalar[masa].forEach(o=>{
            const s=o.sip;

            Object.values(s.urunler||{}).forEach(u=>{
                const tutar=(parseFloat(u.fiyat)||0)*u.adet;
                toplam+=tutar;

                urunHtml+=`
                <div class="stat">
                    <span>${u.ad} x${u.adet}</span>
                    <b>${tutar} TL</b>
                </div>`;
            });
        });

        box.innerHTML+=`
        <div class="masacard">
            <h3>🪑 MASA ${masa}</h3>

            ${urunHtml}

            <div style="text-align:right;font-size:20px;font-weight:bold;margin:10px 0">
                TOPLAM: ${toplam} TL
            </div>

            <button class="green"
                onclick="hesapOde('${masa}')">
                💰 HESAP ÖDENDİ / MASAYI SIFIRLA
            </button>
        </div>`;
    });
}

/* HESAP ÖDENDİ */
function hesapOde(masa){

    if(!confirm(
        "Masa "+masa+
        " hesabı ödendi mi?\n\n"+
        "Ödendiğinde bu masanın mevcut onaylı siparişleri silinecek."
    ))return;

    const updates={};

    Object.keys(siparisler).forEach(key=>{
        const s=siparisler[key];

        if(String(s.masa)===String(masa)){
            updates["siparisler/"+key]=null;
        }
    });

    db.ref().update(updates).then(()=>{
        alert("✅ Masa "+masa+" hesabı ödendi ve sıfırlandı.");
    });
}

/* İSTATİSTİK */
function bugun(){
    const d=new Date();

    return d.getFullYear()+"-"+
        String(d.getMonth()+1).padStart(2,"0")+"-"+
        String(d.getDate()).padStart(2,"0");
}

function istatistikHesapla(){

    const tarih=bugun();

    let hasılat=0;
    let siparisSayisi=0;
    const urunler={};

    Object.keys(siparisler).forEach(key=>{
        const s=siparisler[key];

        if(s.durum!=="onaylandi")return;
        if(s.tarih && s.tarih!==tarih)return;

        siparisSayisi++;

        Object.values(s.urunler||{}).forEach(u=>{
            const adet=parseInt(u.adet)||0;
            const fiyat=parseFloat(u.fiyat)||0;

            hasılat+=adet*fiyat;

            if(!urunler[u.ad])
                urunler[u.ad]=0;

            urunler[u.ad]+=adet;
        });
    });

    document.getElementById("gunlukHasılat").innerText=
        hasılat.toFixed(2)+" TL";

    document.getElementById("gunlukSiparis").innerText=
        siparisSayisi;

    const box=document.getElementById("urunIstatistik");

    box.innerHTML="";

    Object.keys(urunler)
    .sort((a,b)=>urunler[b]-urunler[a])
    .forEach(ad=>{
        box.innerHTML+=`
        <div class="stat">
            <span>🥤 ${ad}</span>
            <b>${urunler[ad]} adet</b>
        </div>`;
    });

    if(!Object.keys(urunler).length){
        box.innerHTML="<p>Bugün henüz satış yok.</p>";
    }
}

/* İSTATİSTİK SIFIRLAMA
   Siparişleri silmiyoruz.
   Sadece istatistik başlangıç zamanını kaydediyoruz.
*/
function istatistikSifirla(){

    if(!confirm(
        "Bugünkü istatistikleri sıfırlamak istediğine emin misin?"
    ))return;

    db.ref("ayarlar/istatistikBaslangic").set(
        new Date().toISOString()
    ).then(()=>{
        alert("✅ İstatistikler sıfırlandı.");
        istatistikHesapla();
    });
}
</script>

</body>
</html>
