<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dijital Kahvem - Yönetici</title>
  <style>
    :root{--kahve:#4e342e;--krem:#f6f1ec;--altin:#c58b3a;--yesil:#2e7d32;--kirmizi:#c62828;--gri:#6b625e}
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--krem);color:#302724}
    header{background:linear-gradient(135deg,#3e2723,#6d4c41);color:#fff;padding:22px}
    header>div,.container{max-width:1200px;margin:auto}h1{margin:0 0 5px}.alt{opacity:.85}
    .container{padding:18px}.istatistik{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
    .kart,.panel{background:#fff;border-radius:16px;box-shadow:0 5px 18px #3e272318}.kart{padding:18px}.kart b{display:block;font-size:26px;margin-top:7px;color:var(--kahve)}
    .panel{padding:18px;margin-bottom:18px}.panel-baslik{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}h2{margin:0;font-size:21px}
    button{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.ana{background:var(--kahve);color:#fff}.yesil{background:var(--yesil);color:#fff}.sil{background:#ffebee;color:var(--kirmizi)}.duzenle{background:#fff3e0;color:#8b5300}
    .filtre{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.filtre input,.filtre select,input,select{padding:11px;border:1px solid #d7cec8;border-radius:10px;background:#fff}
    .filtre input{flex:1;min-width:190px}.urunler{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.urun{border:1px solid #eadfd8;border-radius:14px;padding:13px;display:flex;gap:12px;align-items:center}
    .urun img{width:76px;height:76px;border-radius:11px;object-fit:cover;background:#eee}.urun-bilgi{min-width:0;flex:1}.urun-bilgi h3{margin:0 0 5px;font-size:17px}.etiket{font-size:12px;color:var(--gri)}.fiyat{font-weight:800;color:var(--kahve);margin-top:7px}.islemler{display:flex;gap:6px;margin-top:9px}.islemler button{padding:7px 9px;font-size:12px}
    dialog{border:0;border-radius:18px;padding:0;width:min(92%,520px);box-shadow:0 18px 60px #0005}dialog::backdrop{background:#0008}.form{padding:20px}.form h2{margin-bottom:15px}.alan{display:grid;gap:6px;margin-bottom:12px}.alan input,.alan select{width:100%}.form-buton{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.bos{text-align:center;color:var(--gri);padding:35px;grid-column:1/-1}
    @media(max-width:850px){.istatistik{grid-template-columns:repeat(2,1fr)}.urunler{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:560px){.urunler{grid-template-columns:1fr}.panel-baslik{align-items:flex-start;flex-direction:column}.istatistik{grid-template-columns:1fr 1fr}.kart{padding:13px}.kart b{font-size:21px}}
  </style>
</head>
<body>
<header><div><h1>☕ Dijital Kahvem</h1><div class="alt">Yönetici Paneli</div></div></header>
<main class="container">
  <section class="istatistik">
    <div class="kart">Toplam ürün<b id="toplamUrun">0</b></div>
    <div class="kart">Aktif ürün<b id="aktifUrun">0</b></div>
    <div class="kart">Bugünkü sipariş<b id="siparis">0</b></div>
    <div class="kart">Bugünkü ciro<b id="ciro">₺0</b></div>
  </section>
  <section class="panel">
    <div class="panel-baslik"><h2>Menü Yönetimi</h2><button class="yesil" onclick="yeniUrun()">＋ Yeni ürün</button></div>
    <div class="filtre"><input id="arama" placeholder="Ürün ara…" oninput="listele()"><select id="kategoriFiltre" onchange="listele()"><option value="">Tüm kategoriler</option><option>Sıcak İçecekler</option><option>Soğuk İçecekler</option><option>Atıştırmalıklar</option></select></div>
    <div id="urunler" class="urunler"></div>
  </section>
</main>
<dialog id="pencere"><form class="form" onsubmit="kaydet(event)"><h2 id="formBaslik">Yeni ürün</h2><input type="hidden" id="urunId">
  <label class="alan">Ürün adı<input id="ad" required maxlength="60"></label>
  <label class="alan">Kategori<select id="kategori" required><option>Sıcak İçecekler</option><option>Soğuk İçecekler</option><option>Atıştırmalıklar</option></select></label>
  <label class="alan">Fiyat (TL)<input id="fiyat" type="number" min="0" step="0.01" required></label>
  <label class="alan">Görsel adresi<input id="gorsel" type="url" placeholder="https://..."></label>
  <label class="alan">Durum<select id="aktif"><option value="true">Aktif</option><option value="false">Pasif</option></select></label>
  <div class="form-buton"><button type="button" onclick="pencere.close()">Vazgeç</button><button class="ana" type="submit">Kaydet</button></div>
</form></dialog>
<script>
const VARSAYILAN=[
 {id:'1',ad:'Türk Kahvesi',kategori:'Sıcak İçecekler',fiyat:70,gorsel:'https://images.unsplash.com/photo-1578374173705-969cbe6f2d6b?w=300',aktif:true},
 {id:'2',ad:'Latte',kategori:'Sıcak İçecekler',fiyat:95,gorsel:'https://images.unsplash.com/photo-1561882468-9110e03e0f78?w=300',aktif:true},
 {id:'3',ad:'Limonata',kategori:'Soğuk İçecekler',fiyat:80,gorsel:'https://images.unsplash.com/photo-1523371054106-bbf80586c38c?w=300',aktif:true},
 {id:'4',ad:'Cheesecake',kategori:'Atıştırmalıklar',fiyat:120,gorsel:'https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=300',aktif:true}
];
let urunler=JSON.parse(localStorage.getItem('dk_urunler')||'null')||VARSAYILAN;
const $=id=>document.getElementById(id), pencere=$('pencere');
function sakla(){localStorage.setItem('dk_urunler',JSON.stringify(urunler));listele();}
function para(n){return new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:2}).format(n)}
function listele(){const ara=$('arama').value.toLocaleLowerCase('tr-TR'),kat=$('kategoriFiltre').value;const sonuc=urunler.filter(u=>(!kat||u.kategori===kat)&&u.ad.toLocaleLowerCase('tr-TR').includes(ara));$('urunler').innerHTML=sonuc.length?sonuc.map(u=>`<article class="urun"><img src="${u.gorsel||'https://placehold.co/160x160?text=Ürün'}" alt=""><div class="urun-bilgi"><h3>${temiz(u.ad)}</h3><div class="etiket">${temiz(u.kategori)} · ${u.aktif?'Aktif':'Pasif'}</div><div class="fiyat">${para(u.fiyat)}</div><div class="islemler"><button class="duzenle" onclick="duzenle('${u.id}')">Düzenle</button><button class="sil" onclick="sil('${u.id}')">Sil</button></div></div></article>`).join(''):'<div class="bos">Bu filtreye uygun ürün yok.</div>';$('toplamUrun').textContent=urunler.length;$('aktifUrun').textContent=urunler.filter(x=>x.aktif).length;$('siparis').textContent=localStorage.getItem('dk_bugun_siparis')||0;$('ciro').textContent=para(Number(localStorage.getItem('dk_bugun_ciro')||0));}
function temiz(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function yeniUrun(){$('formBaslik').textContent='Yeni ürün';$('urunId').value='';$('ad').value='';$('fiyat').value='';$('gorsel').value='';$('kategori').value='Sıcak İçecekler';$('aktif').value='true';pencere.showModal();}
function duzenle(id){const u=urunler.find(x=>x.id===id);$('formBaslik').textContent='Ürünü düzenle';$('urunId').value=u.id;$('ad').value=u.ad;$('kategori').value=u.kategori;$('fiyat').value=u.fiyat;$('gorsel').value=u.gorsel||'';$('aktif').value=String(u.aktif);pencere.showModal();}
function kaydet(e){e.preventDefault();const id=$('urunId').value,veri={id:id||String(Date.now()),ad:$('ad').value.trim(),kategori:$('kategori').value,fiyat:Number($('fiyat').value),gorsel:$('gorsel').value.trim(),aktif:$('aktif').value==='true'};if(id)urunler=urunler.map(x=>x.id===id?veri:x);else urunler.push(veri);sakla();pencere.close();}
function sil(id){const u=urunler.find(x=>x.id===id);if(confirm(`“${u.ad}” ürünü silinsin mi?`)){urunler=urunler.filter(x=>x.id!==id);sakla();}}
listele();
</script>
</body>
</html>
