<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dijital Kahvem - Yönetici</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f1ee;
    color:#33231e;
}

header{
    background:#4e342e;
    color:white;
    padding:20px;
    text-align:center;
}

header h1{margin:0}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.panel{
    background:white;
    padding:20px;
    border-radius:14px;
    margin-bottom:20px;
    box-shadow:0 3px 12px #0001;
}

h2{
    margin-top:0;
}

.form{
    display:grid;
    grid-template-columns:1fr auto;
    gap:10px;
}

input,select{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:15px;
}

button{
    border:0;
    border-radius:8px;
    padding:11px 16px;
    font-weight:bold;
    cursor:pointer;
}

.ekle{
    background:#2e7d32;
    color:white;
}

.sil{
    background:#ffebee;
    color:#c62828;
}

.duzenle{
    background:#fff3e0;
    color:#ef6c00;
}

.kategori{
    border:1px solid #ddd;
    border-radius:12px;
    padding:15px;
    margin-top:12px;
}

.kategori-baslik{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.kategori-baslik h3{
    margin:0;
}

.urun{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-top:1px solid #eee;
    padding:12px 0;
    gap:10px;
}

.urun-bilgi{
    flex:1;
}

.urun-adi{
    font-weight:bold;
}

.fiyat{
    color:#2e7d32;
    font-weight:bold;
}

.islemler{
    display:flex;
    gap:5px;
}

.bos{
    color:#777;
    padding:15px 0;
}

@media(max-width:600px){
    .form{
        grid-template-columns:1fr;
    }

    .kategori-baslik,
    .urun{
        flex-direction:column;
        align-items:stretch;
    }

    .islemler{
        display:grid;
        grid-template-columns:1fr 1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>☕ DİJİTAL KAHVEM</h1>
    <p>Yönetici Paneli</p>
</header>

<div class="container">

    <!-- KATEGORİ EKLE -->

    <div class="panel">

        <h2>📂 Kategori Yönetimi</h2>

        <div class="form">

            <input
                id="kategoriAdi"
                placeholder="Kategori adı örn: Kahveler">

            <button
                class="ekle"
                onclick="kategoriEkle()">

                ➕ Kategori Ekle

            </button>

        </div>

    </div>


    <!-- ÜRÜN EKLE -->

    <div class="panel">

        <h2>☕ Ürün Ekle</h2>

        <div style="display:grid;gap:10px">

            <select id="urunKategori">
                <option value="">
                    Önce kategori oluşturun
                </option>
            </select>

            <input
                id="urunAdi"
                placeholder="Ürün adı">

            <input
                id="urunFiyat"
                type="number"
                step="0.01"
                placeholder="Fiyat">

            <button
                class="ekle"
                onclick="urunEkle()">

                ➕ Ürün Ekle

            </button>

        </div>

    </div>


    <!-- LİSTE -->

    <div class="panel">

        <h2>📋 Menü Yönetimi</h2>

        <div id="menuListesi">
            <div class="bos">
                Yükleniyor...
            </div>
        </div>

    </div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    deleteDoc,
    updateDoc,
    doc,
    onSnapshot,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {
    apiKey: "AIzaSyC05yXQzAlF2AYzzeaJrDdMUYKwohKOsWM",
    authDomain: "dijitalkahve-67f0a.firebaseapp.com",
    databaseURL: "https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "dijitalkahve-67f0a",
    storageBucket: "dijitalkahve-67f0a.firebasestorage.app",
    messagingSenderId: "326476599239",
    appId: "1:326476599239:web:143f39583a3478118853e2",
    measurementId: "G-WM65PC4648"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


/* =====================================================
   VERİLER
===================================================== */

let kategoriler = [];
let urunler = [];


/* =====================================================
   KATEGORİ EKLE
===================================================== */

window.kategoriEkle = async function(){

    const input =
        document.getElementById("kategoriAdi");

    const ad =
        input.value.trim();

    if(!ad){

        alert("Kategori adı girin.");
        return;

    }

    try{

        await addDoc(
            collection(db,"kategoriler"),
            {
                ad:ad,
                aktif:true,
                sira:Date.now(),
                olusturmaZamani:serverTimestamp()
            }
        );

        input.value="";

    }
    catch(e){

        alert(
            "Kategori eklenemedi:\n" +
            e.message
        );

    }

};


/* =====================================================
   ÜRÜN EKLE
===================================================== */

window.urunEkle = async function(){

    const kategori =
        document.getElementById(
            "urunKategori"
        ).value;

    const ad =
        document.getElementById(
            "urunAdi"
        ).value.trim();

    const fiyat =
        Number(
            document.getElementById(
                "urunFiyat"
            ).value
        );


    if(!kategori){

        alert("Kategori seçin.");
        return;

    }

    if(!ad){

        alert("Ürün adı girin.");
        return;

    }

    if(isNaN(fiyat) || fiyat < 0){

        alert("Geçerli bir fiyat girin.");
        return;

    }


    try{

        await addDoc(
            collection(db,"urunler"),
            {
                kategoriId:kategori,
                ad:ad,
                fiyat:fiyat,
                aktif:true,
                sira:Date.now(),
                olusturmaZamani:serverTimestamp()
            }
        );


        document.getElementById(
            "urunAdi"
        ).value="";

        document.getElementById(
            "urunFiyat"
        ).value="";

    }
    catch(e){

        alert(
            "Ürün eklenemedi:\n" +
            e.message
        );

    }

};


/* =====================================================
   KATEGORİ SİL
===================================================== */

window.kategoriSil = async function(id){

    const kategori =
        kategoriler.find(
            x=>x.id===id
        );

    if(!kategori) return;


    const kategoriUrunleri =
        urunler.filter(
            u=>u.kategoriId===id
        );


    let mesaj =
        '"' +
        kategori.ad +
        '" kategorisi silinsin mi?";


    if(kategoriUrunleri.length){

        mesaj +=
            "\n\nBu kategoriye ait " +
            kategoriUrunleri.length +
            " ürün de bulunuyor.";

    }


    if(!confirm(mesaj)) return;


    try{

        /*
           Önce ürünleri siliyoruz.
        */

        for(
            const urun of kategoriUrunleri
        ){

            await deleteDoc(
                doc(
                    db,
                    "urunler",
                    urun.id
                )
            );

        }


        await deleteDoc(
            doc(
                db,
                "kategoriler",
                id
            )
        );

    }
    catch(e){

        alert(
            "Silme başarısız:\n" +
            e.message
        );

    }

};


/* =====================================================
   KATEGORİ ADI DEĞİŞTİR
===================================================== */

window.kategoriDuzenle = async function(id){

    const kategori =
        kategoriler.find(
            x=>x.id===id
        );

    if(!kategori) return;


    const yeniAd =
        prompt(
            "Yeni kategori adı:",
            kategori.ad
        );


    if(
        yeniAd === null ||
        !yeniAd.trim()
    ){

        return;

    }


    try{

        await updateDoc(
            doc(
                db,
                "kategoriler",
                id
            ),
            {
                ad:yeniAd.trim()
            }
        );

    }
    catch(e){

        alert(
            "Kategori güncellenemedi:\n" +
            e.message
        );

    }

};


/* =====================================================
   ÜRÜN SİL
===================================================== */

window.urunSil = async function(id){

    if(
        !confirm(
            "Bu ürün silinsin mi?"
        )
    ){

        return;

    }


    try{

        await deleteDoc(
            doc(
                db,
                "urunler",
                id
            )
        );

    }
    catch(e){

        alert(
            "Ürün silinemedi:\n" +
            e.message
        );

    }

};


/* =====================================================
   ÜRÜN DÜZENLE
===================================================== */

window.urunDuzenle = async function(id){

    const urun =
        urunler.find(
            x=>x.id===id
        );

    if(!urun) return;


    const yeniAd =
        prompt(
            "Ürün adı:",
            urun.ad
        );


    if(
        yeniAd === null ||
        !yeniAd.trim()
    ){

        return;

    }


    const yeniFiyat =
        prompt(
            "Fiyat:",
            urun.fiyat
        );


    if(yeniFiyat === null){

        return;

    }


    const fiyat =
        Number(yeniFiyat);


    if(isNaN(fiyat) || fiyat < 0){

        alert("Geçerli fiyat girin.");
        return;

    }


    try{

        await updateDoc(
            doc(
                db,
                "urunler",
                id
            ),
            {
                ad:yeniAd.trim(),
                fiyat:fiyat
            }
        );

    }
    catch(e){

        alert(
            "Ürün güncellenemedi:\n" +
            e.message
        );

    }

};


/* =====================================================
   KATEGORİ SELECT
===================================================== */

function kategoriSelectGuncelle(){

    const select =
        document.getElementById(
            "urunKategori"
        );


    select.innerHTML =
        `<option value="">
            Kategori seçin
         </option>`;


    kategoriler
        .sort(
            (a,b)=>
                Number(a.sira || 0) -
                Number(b.sira || 0)
        )
        .forEach(k=>{

            const option =
                document.createElement(
                    "option"
                );

            option.value=k.id;
            option.textContent=k.ad;

            select.appendChild(option);

        });

}


/* =====================================================
   MENÜYÜ GÖSTER
===================================================== */

function menuGoster(){

    const alan =
        document.getElementById(
            "menuListesi"
        );


    alan.innerHTML="";


    if(!kategoriler.length){

        alan.innerHTML=
            `<div class="bos">
                Henüz kategori oluşturulmadı.
             </div>`;

        return;

    }


    const sirali =
        [...kategoriler].sort(
            (a,b)=>
                Number(a.sira || 0) -
                Number(b.sira || 0)
        );


    sirali.forEach(k=>{

        const div =
            document.createElement(
                "div"
            );

        div.className="kategori";


        const kategoriUrunleri =
            urunler
                .filter(
                    u=>
                        u.kategoriId === k.id
                )
                .sort(
                    (a,b)=>
                        Number(a.sira || 0) -
                        Number(b.sira || 0)
                );


        let urunHTML="";


        kategoriUrunleri.forEach(u=>{

            urunHTML += `

                <div class="urun">

                    <div class="urun-bilgi">

                        <div class="urun-adi">
                            ${escapeHTML(u.ad)}
                        </div>

                        <div class="fiyat">
                            ${para(u.fiyat)}
                        </div>

                    </div>

                    <div class="islemler">

                        <button
                            class="duzenle"
                            onclick="urunDuzenle('${u.id}')">

                            ✏️ Düzenle

                        </button>

                        <button
                            class="sil"
                            onclick="urunSil('${u.id}')">

                            🗑️ Sil

                        </button>

                    </div>

                </div>

            `;

        });


        if(!urunHTML){

            urunHTML =
                `<div class="bos">
                    Bu kategoride ürün yok.
                 </div>`;

        }


        div.innerHTML=`

            <div class="kategori-baslik">

                <h3>
                    📂 ${escapeHTML(k.ad)}
                </h3>

                <div class="islemler">

                    <button
                        class="duzenle"
                        onclick="kategoriDuzenle('${k.id}')">

                        ✏️ Düzenle

                    </button>

                    <button
                        class="sil"
                        onclick="kategoriSil('${k.id}')">

                        🗑️ Sil

                    </button>

                </div>

            </div>

            <div style="margin-top:10px">
                ${urunHTML}
            </div>

        `;


        alan.appendChild(div);

    });

}


/* =====================================================
   FIREBASE KATEGORİLER
===================================================== */

onSnapshot(
    collection(db,"kategoriler"),
    snap=>{

        kategoriler =
            snap.docs.map(
                x=>({
                    id:x.id,
                    ...x.data()
                })
            );


        kategoriSelectGuncelle();
        menuGoster();

    },
    error=>{

        console.error(error);

        alert(
            "Kategoriler okunamadı:\n" +
            error.message
        );

    }
);


/* =====================================================
   FIREBASE ÜRÜNLER
===================================================== */

onSnapshot(
    collection(db,"urunler"),
    snap=>{

        urunler =
            snap.docs.map(
                x=>({
                    id:x.id,
                    ...x.data()
                })
            );


        menuGoster();

    },
    error=>{

        console.error(error);

    }
);


/* =====================================================
   PARA
===================================================== */

function para(n){

    return Number(n || 0)
        .toLocaleString("tr-TR") +
        " ₺";

}


/* =====================================================
   HTML GÜVENLİĞİ
===================================================== */

function escapeHTML(str){

    return String(str || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}

</script>

</body>
</html>
