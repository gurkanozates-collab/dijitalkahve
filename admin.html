<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dijital Kahvem - Yönetici</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f1ee;color:#33231e}header{background:#4e342e;color:#fff;padding:20px;text-align:center}header h1{margin:0}.container{max-width:1400px;margin:auto;padding:15px}.bilgi{background:#fff;padding:15px;border-radius:12px;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.masa{background:#fff;border:2px solid #ddd;border-radius:14px;padding:15px;box-shadow:0 2px 8px #0001}.masa.acik{border-color:#2e7d32}.baslik{display:flex;justify-content:space-between;align-items:center}.baslik h2{margin:0}.durum{font-weight:bold;color:#2e7d32}.toplam{font-size:25px;font-weight:bold;margin:18px 0}.buton{width:100%;border:0;border-radius:10px;padding:14px;font-size:16px;font-weight:bold;cursor:pointer}.odendi{background:#2e7d32;color:#fff}.detay{margin-top:12px;border-top:1px solid #ddd;padding-top:10px}.sip{display:flex;justify-content:space-between;padding:5px 0}.kaynak{font-size:12px;font-weight:bold}.garson{color:#ef6c00}.musteri{color:#1565c0}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>☕ DİJİTAL KAHVEM</h1><p>Yönetici Paneli</p></header>
<div class="container"><div class="bilgi"><b>💳 Hesap Yönetimi</b><br>“Hesap Ödendi” ile masanın aktif oturumunu kapatabilirsiniz. Kapanan oturumdaki eski müşteri sayfası yeni sipariş gönderemez.</div><div id="grid" class="grid"></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getFirestore,collection,onSnapshot,query,where,updateDoc,doc,serverTimestamp,getDocs} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC05yXQzAlF2AYzzeaJrDdMUYKwohKOsWM",
  authDomain: "dijitalkahve-67f0a.firebaseapp.com",
  databaseURL: "https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "dijitalkahve-67f0a",
  storageBucket: "dijitalkahve-67f0a.firebasestorage.app",
  messagingSenderId: "326476599239",
  appId: "1:326476599239:web:143f39583a3478118853e2",
  measurementId: "G-WM65PC4648"
};

const db=getFirestore(initializeApp(firebaseConfig));let oturumlar=[],siparisler=[];
function para(n){return Number(n||0).toLocaleString("tr-TR")+" ₺"}
function render(){const g=document.getElementById("grid");g.innerHTML="";for(let masa=1;masa<=50;masa++){const o=oturumlar.find(x=>Number(x.masa)===masa&&x.durum==="acik");const ss=o?siparisler.filter(s=>s.oturumId===o.id):[];const toplam=ss.reduce((a,s)=>a+Number(s.toplam||0),0);const d=document.createElement("div");d.className="masa"+(o?" acik":"");d.innerHTML=`<div class="baslik"><h2>🪑 Masa ${masa}</h2><span class="durum">${o?"🟢 Açık":"⚪ Kapalı"}</span></div>${o?`<div class="toplam">${para(toplam)}</div><div class="detay">${ss.length?ss.map(s=>`<div class="sip"><span>${s.kaynak==="garson"?'<span class="kaynak garson">👨‍🍳 Garson</span>':'<span class="kaynak musteri">👤 Müşteri</span>'}</span><b>${para(s.toplam)}</b></div>`).join(""):"Henüz sipariş yok."}</div><br><button class="buton odendi" onclick="hesapOdendi('${o.id}',${masa})">💳 HESAP ÖDENDİ</button>`:"<p>Aktif oturum yok.</p>"}`;g.appendChild(d)}}
window.hesapOdendi=async(id,masa)=>{if(!confirm("Masa "+masa+" hesabı ödendi olarak işaretlensin ve oturum kapatılsın mı?"))return;try{await updateDoc(doc(db,"oturumlar",id),{durum:"kapali",odemeDurumu:"odendi",kapanisZamani:serverTimestamp()});alert("✅ Masa "+masa+" oturumu kapatıldı.")}catch(e){alert("❌ İşlem başarısız:\n"+e.message)}};
onSnapshot(query(collection(db,"oturumlar")),s=>{oturumlar=s.docs.map(x=>({id:x.id,...x.data()}));render()});
onSnapshot(query(collection(db,"siparisler")),s=>{siparisler=s.docs.map(x=>({id:x.id,...x.data()}));render()});
</script>
</body>
</html>
