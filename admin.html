<head>

<title>Dijital Kahvem - Yönetici</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f1ee;
    color:#33231e;
}

header{
    background:#4e342e;
    color:white;
    padding:20px;
    text-align:center;
}

header h1{
    margin:0;
}

header p{
    margin:7px 0 0;
}

.topbar{
    position:sticky;
    top:0;
    z-index:100;
    background:white;
    padding:12px 15px;
    box-shadow:0 2px 8px #0002;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.connection{
    font-weight:bold;
}

.refresh{
    border:0;
    background:#1565c0;

    padding:10px 15px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.container{
    max-width:1500px;
    margin:auto;
    padding:15px;
}

.ozet{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:20px;
}

.ozet-kutu{
    background:white;
    padding:18px;
    border-radius:12px;
    box-shadow:0 2px 8px #0001;
}

.ozet-kutu small{

}

.ozet-kutu strong{
    display:block;
    font-size:25px;
    margin-top:5px;
}

.masa-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:14px;
}

.masa{
    background:white;
    border:2px solid #ddd;
    border-radius:14px;
    padding:14px;
    box-shadow:0 2px 8px #0001;
}

.masa.acik{
    border-color:#2e7d32;
}

.masa.bekleyen{
    border-color:#ef6c00;
    box-shadow:0 0 0 3px #ef6c0020;
}

.masa-baslik{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
}

.masa-baslik h3{
    margin:0;
    font-size:21px;
}

.durum{
    padding:6px 9px;
    border-radius:15px;
    background:#eee;
    color:#777;
    font-size:12px;
    font-weight:bold;
}

.durum.acik{
    background:#e8f5e9;
    color:#2e7d32;
}

.durum.bekleyen{
    background:#fff3cd;
    color:#ef6c00;
}

.siparis{
    margin-top:12px;
    padding:11px;
    border-radius:9px;
    border:1px solid #ddd;
}

.siparis.bekleyen{
    border-left:5px solid #ef6c00;
    background:#fff8ef;
}

.siparis.onaylandi{
    border-left:5px solid #2e7d32;
    background:#f4fff5;
}

.siparis-baslik{
    display:flex;
    justify-content:space-between;
    margin-bottom:8px;
}

.kaynak{
    display:block;
    text-align:center;
    padding:7px;
    border-radius:7px;
    font-size:12px;
    font-weight:bold;
    margin-bottom:8px;
}

.kaynak.garson{
    background:#fff3e0;
    color:#e65100;
}

.kaynak.musteri{
    background:#e3f2fd;
    color:#1565c0;
}

.zaman{
    font-size:12px;
    color:#777;
    margin-bottom:7px;
}

.urun{
    display:flex;
    justify-content:space-between;
    padding:5px 0;
    border-bottom:1px solid #eee;
}

.toplam{
    text-align:right;
    font-size:17px;
    font-weight:bold;
    margin-top:9px;
}

.hesaba-dahil{
    margin-top:7px;
    padding:7px;
    border-radius:7px;
    background:#e8f5e9;
    color:#2e7d32;
    text-align:center;
    font-size:12px;
    font-weight:bold;
}

.hesaba-dahil-degil{
    margin-top:7px;
    padding:7px;
    border-radius:7px;
    background:#fff3cd;
    color:#ef6c00;
    text-align:center;
    font-size:12px;
    font-weight:bold;
}

.butons{
    display:grid;
    gap:7px;
    margin-top:10px;
}

.btn{
    border:0;
    padding:10px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.onayla{
    background:#2e7d32;
    color:white;
}

.onayla:hover{
    background:#1b5e20;
}

.duzenle{
    background:#ffb300;
}

.hesap{
    margin-top:15px;
    padding:14px;
    background:#faf8f6;
    border-top:2px solid #ddd;
    border-radius:10px;
}

.hesap-baslik{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.hesap-baslik span{
    font-size:13px;
    color:#777;
}

.hesap-toplam{
    font-size:25px;
    font-weight:bold;
    color:#2e7d32;
    margin-top:4px;
}

.odendi{
    width:100%;
    border:0;
    background:#1565c0;
    color:white;
    padding:13px;
    border-radius:9px;
    font-weight:bold;
    margin-top:10px;
    cursor:pointer;
}

.odendi:hover{
    background:#0d47a1;
}

.bos{
    background:white;
    padding:30px;
    border-radius:12px;
    text-align:center;
    color:#777;
}

@media(max-width:1100px){

    .masa-grid{
        grid-template-columns:repeat(3,1fr);
    }

    .ozet{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:750px){

    .masa-grid{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:520px){

    .masa-grid{
        grid-template-columns:1fr;
    }

    .ozet{
        grid-template-columns:1fr 1fr;
    }

}

</style>
</head>

<body>

<header>

<h1>☕ DİJİTAL KAHVEM</h1>

<p>Yönetici Paneli</p>

</header>


<div class="topbar">

<div
id="baglanti"
class="connection">

🟡 Firebase bağlanıyor...

</div>

<button
class="refresh"
onclick="location.reload()">

🔄 Yenile

</button>

</div>


<div class="container">


<div class="ozet">

<div class="ozet-kutu">

<small>Açık Masa</small>

<strong id="acikMasaSayisi">
0
</strong>

</div>


<div class="ozet-kutu">

<small>Bekleyen Sipariş</small>

<strong id="bekleyenSayisi">
0
</strong>

</div>


<div class="ozet-kutu">

<small>Onaylanan Sipariş</small>

<strong id="onaylananSayisi">
0
</strong>

</div>


<div class="ozet-kutu">

<small>Toplam Hesap</small>

<strong id="genelToplam">
0 ₺
</strong>

</div>

</div>


<h2>🪑 Masalar</h2>

<p id="bilgi">
Masalar yükleniyor...
</p>


<div
id="masaGrid"
class="masa-grid">
</div>


</div>


<script type="module">


import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getFirestore,
    collection,
    query,
    where,
    onSnapshot,
    updateDoc,
    doc,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyC05yXQzAlF2AYzzeaJrDdMUYKwohKOsWM",

    authDomain:
    "dijitalkahve-67f0a.firebaseapp.com",

    databaseURL:
    "https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
    "dijitalkahve-67f0a",

    storageBucket:
    "dijitalkahve-67f0a.firebasestorage.app",

    messagingSenderId:
    "326476599239",

    appId:
    "1:326476599239:web:143f39583a3478118853e2",

    measurementId:
    "G-WM65PC4648"

};


const app =
initializeApp(firebaseConfig);


const db =
getFirestore(app);


/* =========================
   VERİLER
========================= */

let siparisler = [];

let oturumlar = [];


/* =========================
   ZAMAN
========================= */

function zaman(s){

    if(
        s.olusturmaZamani &&
        typeof s.olusturmaZamani.toMillis ===
        "function"
    ){

        return s.olusturmaZamani.toMillis();

    }

    return 0;

}


function saat(s){

    if(
        s.olusturmaZamani &&
        typeof s.olusturmaZamani.toDate ===
        "function"
    ){

        return s.olusturmaZamani
        .toDate()
        .toLocaleTimeString(
            "tr-TR",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    }

    return "--:--";

}


/* =========================
   SİPARİŞ HTML
========================= */

function siparisHTML(s){

    let html = "";


    (s.urunler || []).forEach(
        u => {

            const adet =
            Number(u.adet || 0);

            const fiyat =
            Number(u.fiyat || 0);

            html += `

            <div class="urun">

                <span>
                    ${u.urun} × ${adet}
                </span>

                <b>
                    ${fiyat * adet} ₺
                </b>

            </div>

            `;

        }
    );


    const garson =
    s.kaynak === "garson" ||
    s.garsonSiparisi === true;


    return `

    <div class="
        siparis
        ${
            s.durum === "Onaylandı"
            ?
            "onaylandi"
            :
            "bekleyen"
        }
    ">


        <div class="siparis-baslik">

            <strong>
                ${garson ? "👨‍🍳" : "👤"}
                ${garson ? "Garson" : "Müşteri"} Siparişi
            </strong>

            <span>

                ${
                    s.durum === "Onaylandı"
                    ?
                    "🟢 Onaylandı"
                    :
                    "🟡 Bekleyen"
                }

            </span>

        </div>


        <div class="
            kaynak
            ${garson ? "garson" : "musteri"}
        ">

            ${
                garson
                ?
                "👨‍🍳 GARSON SİPARİŞİ"
                :
                "👤 MÜŞTERİ SİPARİŞİ"
            }

        </div>


        <div class="zaman">

            🕐 ${saat(s)}

        </div>


        ${html}


        <div class="toplam">

            Toplam:
            ${Number(s.toplam || 0)}
            ₺

        </div>


        ${
            s.durum === "Onaylandı"

            ?

            `

            <div class="hesaba-dahil">

                🟢 HESABA DAHİL

            </div>

            `

            :

            `

            <div class="hesaba-dahil-degil">

                🟡 BEKLİYOR — HESABA DAHİL DEĞİL

            </div>

            `

        }


        ${
            s.durum === "Bekleyen"

            ?

            `

            <div class="butons">

                <button
                    class="btn onayla"
                    onclick="
                        siparisOnayla('${s.id}')
                    ">

                    🟢 Siparişi Onayla

                </button>

            </div>

            `

            :

            ""

        }


    </div>

    `;

}


/* =========================
   HESAP HESAPLA
========================= */

function masaHesabi(masa,oturumId){

    let toplam = 0;


    siparisler.forEach(
        s => {

            /*
             * SADECE BU MASA
             */

            if(
                Number(s.masa) !==
                Number(masa)
            ){

                return;

            }


            /*
             * SADECE BU OTURUM
             */

            if(
                oturumId &&
                s.oturumId &&
                s.oturumId !== oturumId
            ){

                return;

            }


            /*
             * EN ÖNEMLİ KURAL:
             *
             * SADECE ONAYLANAN
             * SİPARİŞLER HESABA GİRER
             */

            if(
                s.durum !==
                "Onaylandı"
            ){

                return;

            }


            toplam +=
            Number(s.toplam || 0);

        }
    );


    return toplam;

}


/* =========================
   SİPARİŞ ONAYLA
========================= */

window.siparisOnayla =
async function(id){

    const s =
    siparisler.find(
        x => x.id === id
    );


    if(!s){

        alert(
            "❌ Sipariş bulunamadı."
        );

        return;

    }


    if(
        s.durum !==
        "Bekleyen"
    ){

        return;

    }


    const onay =
    confirm(

        "Sipariş onaylansın mı?\n\n" +

        "Masa: " +
        s.masa +
        "\n" +

        "Tutar: " +
        Number(s.toplam || 0) +
        " ₺\n\n" +

        "Onaylandıktan sonra tutar " +
        "hesaba dahil edilecektir."

    );


    if(!onay){

        return;

    }


    try{

        await updateDoc(

            doc(
                db,
                "siparisler",
                id
            ),

            {

                durum:
                "Onaylandı",

                onaylanmaZamani:
                serverTimestamp()

            }

        );


        /*
         * Firebase snapshot otomatik
         * olarak ekranı güncelleyecek.
         */

    }
    catch(error){

        console.error(error);

        alert(
            "❌ Sipariş onaylanamadı:\n\n" +
            error.message
        );

    }

};


/* =========================
   HESAP ÖDENDİ
   MASAYI OTOMATİK KAPAT
========================= */

window.hesapOdendi =
async function(
    masa,
    oturumId,
    toplam
){

    if(
        !oturumId
    ){

        alert(
            "❌ Bu masanın aktif oturumu bulunamadı."
        );

        return;

    }


    /*
     * ÖNCE BEKLEYEN SİPARİŞ KONTROLÜ
     */

    const bekleyen =
    siparisler.filter(
        s =>

        Number(s.masa) ===
        Number(masa)

        &&

        s.oturumId ===
        oturumId

        &&

        s.durum ===
        "Bekleyen"

    );


    if(
        bekleyen.length > 0
    ){

        alert(

            "⚠️ Bu masada hâlâ " +
            bekleyen.length +
            " adet bekleyen sipariş var.\n\n" +

            "Bekleyen siparişler hesaba dahil değildir.\n\n" +

            "Önce siparişleri onaylamalısın."

        );

        return;

    }


    const onay =
    confirm(

        "💰 HESAP ÖDENDİ\n\n" +

        "Masa: " +
        masa +
        "\n" +

        "Ödenecek: " +
        toplam +
        " ₺\n\n" +

        "Hesap ödendi olarak işaretlenecek\n" +

        "ve masa OTOMATİK OLARAK KAPATILACAK.\n\n" +

        "Devam edilsin mi?"

    );


    if(!onay){

        return;

    }


    try{

        /*
         * OTURUMU KAPAT
         *
         * Garson paneli de bu değişikliği
         * anında görecek.
         */

        await updateDoc(

            doc(
                db,
                "oturumlar",
                oturumId
            ),

            {

                durum:
                "kapali",

                hesapOdendi:
                true,

                odemeTutari:
                Number(toplam),

                kapanmaZamani:
                serverTimestamp(),

                hesapOdemeZamani:
                serverTimestamp()

            }

        );


        /*
         * BU OTURUMA AİT
         * ONAYLANMIŞ SİPARİŞLERİ
         * "Tamamlandı" YAPMIYORUZ.
         *
         * Çünkü geçmiş kayıt olarak
         * Firebase'de kalması gerekiyor.
         *
         * Sadece oturum kapanıyor.
         */


        alert(

            "✅ HESAP ÖDENDİ\n\n" +

            "Masa " +
            masa +
            " otomatik olarak kapatıldı."

        );

    }
    catch(error){

        console.error(
            "HESAP KAPATMA HATASI:",
            error
        );


        alert(

            "❌ Hesap kapatılamadı:\n\n" +

            error.message

        );

    }

};


/* =========================
   MASALARI OLUŞTUR
========================= */

function masalariGoster(){

    const grid =
    document.getElementById(
        "masaGrid"
    );


    grid.innerHTML = "";


    let acikMasa = 0;

    let bekleyenToplam = 0;

    let onaylananToplam = 0;

    let genelToplam = 0;


    for(
        let masa = 1;
        masa <= 50;
        masa++
    ){

        /*
         * AKTİF OTURUM
         */

        const oturum =
        oturumlar.find(
            o =>

            Number(o.masa) ===
            Number(masa)

            &&

            o.durum ===
            "acik"

        );


        const masaAcik =
        !!oturum;


        if(masaAcik){

            acikMasa++;

        }


        /*
         * BU MASANIN SİPARİŞLERİ
         */

        const masaSiparisleri =
        siparisler
        .filter(
            s => {

                if(
                    Number(s.masa) !==
                    Number(masa)
                ){

                    return false;

                }


                /*
                 * Aktif oturum varsa
                 * sadece o oturum.
                 */

                if(
                    oturum &&
                    s.oturumId
                ){

                    return (
                        s.oturumId ===
                        oturum.id
                    );

                }


                return true;

            }
        )
        .sort(
            (a,b) =>
            zaman(a)-zaman(b)
        );


        const bekleyen =
        masaSiparisleri.filter(
            s =>
            s.durum ===
            "Bekleyen"
        );


        const onaylanan =
        masaSiparisleri.filter(
            s =>
            s.durum ===
            "Onaylandı"
        );


        bekleyenToplam +=
        bekleyen.length;


        onaylananToplam +=
        onaylanan.length;


        /*
         * SADECE ONAYLANANLAR
         * HESABA GİRER
         */

        let hesap =
        masaHesabi(
            masa,
            oturum ?
            oturum.id :
            null
        );


        genelToplam +=
        hesap;


        const div =
        document.createElement(
            "div"
        );


        div.className =
        "masa";


        if(masaAcik){

            div.classList.add(
                "acik"
            );

        }


        if(
            bekleyen.length
        ){

            div.classList.add(
                "bekleyen"
            );

        }


        let html = `

        <div class="masa-baslik">

            <h3>
                🪑 Masa ${masa}
            </h3>

            <span
                class="
                durum
                ${
                    bekleyen.length
                    ?
                    "bekleyen"
                    :
                    masaAcik
                    ?
                    "acik"
                    :
                    ""
                }
                ">

                ${
                    bekleyen.length
                    ?
                    "🟡 " +
                    bekleyen.length +
                    " Bekleyen"

                    :

                    masaAcik
                    ?
                    "🟢 Açık"
                    :
                    "⚪ Kapalı"
                }

            </span>

        </div>

        `;


        /*
         * MASA AÇIKSA
         */

        if(masaAcik){

            html += `

            <div style="
                background:#e8f5e9;
                color:#2e7d32;
                padding:9px;
                border-radius:8px;
                text-align:center;
                font-weight:bold;
                margin-bottom:10px;
            ">

                🟢 Masa Oturumu Açık

            </div>

            `;

        }


        /*
         * SİPARİŞLER
         */

        if(
            masaSiparisleri.length === 0
        ){

            html += `

            <div
                style="
                padding:15px;
                text-align:center;
                color:#999;
                ">

                ${
                    masaAcik
                    ?
                    "Henüz sipariş yok."
                    :
                    "Masa kapalı."
                }

            </div>

            `;

        }


        masaSiparisleri.forEach(
            s => {

                html +=
                siparisHTML(s);

            }
        );


        /*
         * HESAP
         *
         * SADECE AÇIK MASADA
         */

        if(masaAcik){

            html += `

            <div class="hesap">

                <div class="hesap-baslik">

                    <div>

                        <strong>
                            💰 Hesap
                        </strong>

                        <br>

                        <span>
                            Sadece onaylanan siparişler
                        </span>

                    </div>

                </div>


                <div class="hesap-toplam">

                    ${hesap} ₺

                </div>


                ${
                    bekleyen.length > 0

                    ?

                    `

                    <div class="hesap-bekleyen"
                        style="
                        margin-top:8px;
                        padding:7px;
                        background:#fff3cd;
                        color:#ef6c00;
                        border-radius:7px;
                        font-size:12px;
                        text-align:center;
                        font-weight:bold;
                        ">

                        ⚠️ ${bekleyen.length}
                        bekleyen sipariş
                        hesaba dahil değil

                    </div>

                    `

                    :

                    ""

                }


                <button
                    class="odendi"
                    onclick="
                        hesapOdendi(
                            ${masa},
                            '${oturum.id}',
                            ${hesap}
                        )
                    ">

                    💰 HESAP ÖDENDİ
                    <br>
                    <small>
                        Masayı otomatik kapat
                    </small>

                </button>

            </div>

            `;

        }


        div.innerHTML =
        html;


        grid.appendChild(
            div
        );

    }


    /*
     * ÜST ÖZET
     */

    document.getElementById(
        "acikMasaSayisi"
    ).textContent =
    acikMasa;


    document.getElementById(
        "bekleyenSayisi"
    ).textContent =
    bekleyenToplam;


    document.getElementById(
        "onaylananSayisi"
    ).textContent =
    onaylananToplam;


    document.getElementById(
        "genelToplam"
    ).textContent =
    genelToplam +

}

========================= */

const oturumQuery =
query(
    collection(
        db,
        "oturumlar"
    )
);


onSnapshot(

    oturumQuery,

    snapshot => {

        oturumlar = [];


        snapshot.forEach(
            item => {

                oturumlar.push({

                    id:
                    item.id,

                    ...item.data()

                });

            }
        );

);
