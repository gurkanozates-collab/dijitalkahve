<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dijital Kahvem - Yönetici</title><style>:root{--k:#4e342e;--bg:#f4f1ee;--y:#2e7d32;--r:#c62828}*{box-sizing:border-box}body{margin:0;font-family:Arial;background:var(--bg);color:#33231e}header{background:var(--k);color:#fff;padding:20px}header>div,main{max-width:1200px;margin:auto}h1{margin:0}.alt{opacity:.8;margin-top:5px}main{padding:15px}.ozet{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.ozet div{background:#fff;border-radius:13px;padding:15px}.ozet b{display:block;font-size:25px;margin-top:5px}h2{margin:24px 0 11px}.masalar{display:grid;grid-template-columns:repeat(5,1fr);gap:11px}.masa{background:#fff;border:2px solid #ddd;border-radius:15px;padding:14px;text-align:center;box-shadow:0 4px 14px #0001}.masa.acik{border-color:var(--y);background:#f1f8f2}.no{font-size:22px;font-weight:800}.durum{font-weight:bold;margin:8px 0}.acik .durum{color:var(--y)}.kapali .durum{color:var(--r)}.tutar{font-size:19px;font-weight:bold;margin:10px 0}.masa button{width:100%;border:0;border-radius:9px;padding:11px;font-weight:bold;color:#fff;background:var(--y);cursor:pointer}.masa button:disabled{background:#aaa;cursor:not-allowed}.toast{position:fixed;top:15px;left:50%;transform:translate(-50%,-100px);background:#263238;color:#fff;padding:12px 18px;border-radius:10px;transition:.25s}.toast.goster{transform:translate(-50%,0)}@media(max-width:850px){.masalar{grid-template-columns:repeat(3,1fr)}}@media(max-width:520px){.masalar{grid-template-columns:repeat(2,1fr)}.ozet{grid-template-columns:1fr}}</style></head><body><div id="toast" class="toast"></div><header><div><h1>☕ DİJİTAL KAHVEM</h1><div class="alt">Yönetici Paneli</div></div></header><main><section class="ozet"><div>Açık masa<b id="acik">0</b></div><div>Onaylı hesap toplamı<b id="toplam">₺0</b></div><div>Bekleyen sipariş<b id="bekleyen">0</b></div></section><h2>🪑 Masa ve Hesap Yönetimi</h2><section id="masalar" class="masalar"></section></main>
<script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";import{getFirestore,collection,onSnapshot,serverTimestamp,doc,writeBatch,query,where,getDocs}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";const cfg={apiKey:"AIzaSyC05yXQzAlF2AYzzeaJrDdMUYKwohKOsWM",authDomain:"dijitalkahve-67f0a.firebaseapp.com",projectId:"dijitalkahve-67f0a",storageBucket:"dijitalkahve-67f0a.firebasestorage.app",messagingSenderId:"326476599239",appId:"1:326476599239:web:143f39583a3478118853e2"},db=getFirestore(initializeApp(cfg));let oturumlar={},siparisler=[];const para=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:2}).format(Number(n||0));function mesaj(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('goster');setTimeout(()=>e.classList.remove('goster'),2200)}function ciz(){const hesap={};siparisler.filter(s=>s.durum==='Onaylandı').forEach(s=>hesap[s.oturumId]=(hesap[s.oturumId]||0)+Number(s.toplam||0));document.getElementById('masalar').innerHTML=Array.from({length:10},(_,i)=>i+1).map(no=>{const o=oturumlar[no],t=o?hesap[o.id]||0:0;return `<article class="masa ${o?'acik':'kapali'}"><div class="no">Masa ${no}</div><div class="durum">${o?'🟢 AÇIK':'🔴 KAPALI'}</div><div class="tutar">${para(t)}</div><button ${o?'':'disabled'} onclick="hesapOdendi(${no})">Hesap Ödendi</button></article>`}).join('');document.getElementById('acik').textContent=Object.keys(oturumlar).length;document.getElementById('toplam').textContent=para(Object.values(hesap).reduce((a,b)=>a+b,0));document.getElementById('bekleyen').textContent=siparisler.filter(s=>s.durum==='Bekleyen').length}onSnapshot(collection(db,'oturumlar'),s=>{oturumlar={};s.docs.forEach(d=>{const x=d.data(),n=Number(x.masa);if(x.durum==='acik')oturumlar[n]={id:d.id,...x}});ciz()});onSnapshot(collection(db,'siparisler'),s=>{siparisler=s.docs.map(d=>({id:d.id,...d.data()}));ciz()});window.hesapOdendi=async no=>{const o=oturumlar[no];if(!o||!confirm(`Masa ${no} hesabı ödendi ve masa kapatılsın mı?`))return;try{const batch=writeBatch(db),sq=await getDocs(query(collection(db,'siparisler'),where('oturumId','==',o.id))),cq=await getDocs(query(collection(db,'garsonCagrilari'),where('oturumId','==',o.id)));sq.docs.forEach(x=>batch.update(x.ref,{durum:'Tamamlandı',odendi:true,odemeZamani:serverTimestamp()}));cq.docs.forEach(x=>batch.update(x.ref,{durum:'tamamlandi',tamamlanmaZamani:serverTimestamp()}));batch.update(doc(db,'oturumlar',o.id),{durum:'kapali',odendi:true,kapanisZamani:serverTimestamp()});await batch.commit();mesaj(`Masa ${no} sıfırlandı ve kapandı`)}catch(e){alert('Hesap kapatılamadı: '+e.message)}};ciz();</script></body></html>
