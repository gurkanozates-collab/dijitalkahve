<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Dijital Kahvem - Yönetici</title>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
      import {
        getAuth,
        onAuthStateChanged,
        signInWithEmailAndPassword,
        sendPasswordResetEmail,
        EmailAuthProvider,
        reauthenticateWithCredential,
        updatePassword,
        signOut,
      } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
      import {
        getFirestore,
        doc,
        setDoc,
      } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
      const c = {
          apiKey: "AIzaSyC05yXQzAlF2AYzzeaJrDdMUYKwohKOsWM",
          authDomain: "dijitalkahve-67f0a.firebaseapp.com",
          projectId: "dijitalkahve-67f0a",
          appId: "1:326476599239:web:143f39583a3478118853e2",
        },
        a = initializeApp(c, "yoneticiAuth"),
        auth = getAuth(a),
        dbs = getFirestore(a);
      function gorunur(v) {
        document.querySelector("header").style.display = v ? "block" : "none";
        document.querySelector("nav").style.display = v ? "block" : "none";
        document.querySelector("main").style.display = v ? "block" : "none";
        document.getElementById("yoneticiGiris").style.display = v
          ? "none"
          : "flex";
      }
      function arayuz() {
        const s = document.createElement("style");
        s.textContent =
          ".giris-ekrani{position:fixed;inset:0;background:#f4f1ee;z-index:9999;display:flex;align-items:center;justify-content:center;padding:18px}.giris-kart{background:#fff;width:min(94%,420px);padding:24px;border-radius:18px;box-shadow:0 12px 40px #0003}.giris-kart input{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:9px}.giris-kart button{width:100%;padding:12px;margin-top:8px;border:0;border-radius:9px;background:#4e342e;color:#fff;font-weight:bold}.sifre-kutu{background:#fff;padding:18px;border-radius:14px;margin-bottom:14px}.sifre-kutu input{width:100%;padding:11px;margin:5px 0;border:1px solid #ccc;border-radius:9px}";
        document.head.appendChild(s);
        document.body.insertAdjacentHTML(
          "afterbegin",
          '<div id="yoneticiGiris" class="giris-ekrani"><div class="giris-kart"><h2>🔐 Yönetici Girişi</h2><input id="yEmail" type="email" placeholder="E-posta adresi"><input id="ySifre" type="password" placeholder="Şifre"><button onclick="yoneticiGiris()">Giriş Yap</button><button onclick="sifremiUnuttum()" style="background:#1565c0">Şifremi Unuttum</button></div></div>',
        );
        const n = document.querySelector("nav>div");
        n.style.gridTemplateColumns = "repeat(5,1fr)";
        n.insertAdjacentHTML(
          "beforeend",
          '<button onclick="panelAc(\'sifrePanel\',this)" style="border:0;border-radius:10px;padding:13px;background:#eee;font-weight:bold">🔐 Şifre Yönetimi</button>',
        );
        document
          .querySelector("main")
          .insertAdjacentHTML(
            "beforeend",
            '<section id="sifrePanel" class="yonetim-panel" style="display:none"><h2>🔐 Şifre Yönetimi</h2><div class="sifre-kutu"><h3>Yönetici Şifresi</h3><input id="mevcutSifre" type="password" placeholder="Mevcut şifre"><input id="yeniSifre" type="password" placeholder="Yeni şifre (en az 6 karakter)"><button class="ana" onclick="yoneticiSifreDegistir()">Yönetici Şifresini Değiştir</button></div><div class="sifre-kutu"><h3>Ortak Garson PIN’i</h3><input id="garsonPin" inputmode="numeric" maxlength="6" placeholder="6 haneli yeni PIN"><button class="ana" onclick="garsonPinDegistir()">Garson PIN’ini Değiştir</button></div><button class="ana" style="background:#c62828" onclick="yoneticiCikis()">Çıkış Yap</button></section>',
          );
      }
      async function hash(x) {
        const b = await crypto.subtle.digest(
          "SHA-256",
          new TextEncoder().encode(x),
        );
        return [...new Uint8Array(b)]
          .map((v) => v.toString(16).padStart(2, "0"))
          .join("");
      }
      window.yoneticiGiris = async () => {
        try {
          await signInWithEmailAndPassword(
            auth,
            yEmail.value.trim(),
            ySifre.value,
          );
        } catch (e) {
          alert("Giriş başarısız: " + e.message);
        }
      };
      window.sifremiUnuttum = async () => {
        if (!yEmail.value.trim()) return alert("Önce e-posta adresini yazın.");
        try {
          await sendPasswordResetEmail(auth, yEmail.value.trim());
          alert("Şifre yenileme bağlantısı e-postanıza gönderildi.");
        } catch (e) {
          alert(e.message);
        }
      };
      window.yoneticiSifreDegistir = async () => {
        try {
          const u = auth.currentUser,
            c = EmailAuthProvider.credential(u.email, mevcutSifre.value);
          await reauthenticateWithCredential(u, c);
          await updatePassword(u, yeniSifre.value);
          mevcutSifre.value = yeniSifre.value = "";
          alert("Yönetici şifresi değiştirildi.");
        } catch (e) {
          alert(e.message);
        }
      };
      window.garsonPinDegistir = async () => {
        const p = garsonPin.value.trim();
        if (!/^\d{6}$/.test(p)) return alert("PIN 6 haneli olmalıdır.");
        await setDoc(
          doc(dbs, "ayarlar", "guvenlik"),
          {
            garsonPinHash: await hash(p),
            guncelleyen: auth.currentUser.email,
            guncellemeZamani: new Date().toISOString(),
          },
          { merge: true },
        );
        garsonPin.value = "";
        alert("Garson PIN’i değiştirildi.");
      };
      window.yoneticiCikis = () => signOut(auth);
      arayuz();
      gorunur(false);
      onAuthStateChanged(auth, (u) => gorunur(!!u));
    </script>
    <style>
      .masa {
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
        position: relative;
      }
      .masa:hover {
        transform: scale(1.08);
        box-shadow: 0 12px 28px #0003;
        z-index: 3;
      }
    </style>
    <style>
      :root {
        --k: #4e342e;
        --bg: #f4f1ee;
        --y: #2e7d32;
        --r: #c62828;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Arial;
        background: var(--bg);
        color: #33231e;
      }
      header {
        background: var(--k);
        color: #fff;
        padding: 20px;
      }
      header > div,
      main {
        max-width: 1200px;
        margin: auto;
      }
      h1 {
        margin: 0;
      }
      .alt {
        opacity: 0.8;
        margin-top: 5px;
      }
      main {
        padding: 15px;
      }
      .ozet {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .ozet div,
      .panel {
        background: #fff;
        border-radius: 14px;
        padding: 15px;
      }
      .ozet b {
        display: block;
        font-size: 25px;
        margin-top: 5px;
      }
      h2 {
        margin: 24px 0 11px;
      }
      .masalar {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 11px;
      }
      .masa {
        background: #fff;
        border: 2px solid #ddd;
        border-radius: 15px;
        padding: 14px;
        text-align: center;
      }
      .masa.acik {
        border-color: var(--y);
        background: #f1f8f2;
      }
      .no {
        font-size: 22px;
        font-weight: 800;
      }
      .durum {
        font-weight: bold;
        margin: 8px 0;
      }
      .acik .durum {
        color: var(--y);
      }
      .kapali .durum {
        color: var(--r);
      }
      .tutar {
        font-size: 18px;
        font-weight: bold;
        margin: 10px;
      }
      .masa button,
      .ana {
        width: 100%;
        border: 0;
        border-radius: 9px;
        padding: 10px;
        background: var(--y);
        color: #fff;
        font-weight: bold;
        cursor: pointer;
      }
      .masa button:disabled {
        background: #aaa;
      }
      .panel-ust {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }
      .panel-ust .ana {
        width: auto;
      }
      .filtre {
        display: flex;
        gap: 8px;
        margin: 13px 0;
      }
      .filtre input,
      .filtre select,
      input,
      select {
        padding: 10px;
        border: 1px solid #d4cac5;
        border-radius: 9px;
      }
      .filtre input {
        flex: 1;
      }
      .urunler {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .urun {
        border: 1px solid #e5ddd8;
        border-radius: 12px;
        padding: 12px;
      }
      .urun h3 {
        margin: 0 0 5px;
      }
      .etiket {
        font-size: 12px;
        color: #746a65;
      }
      .fiyat {
        font-size: 18px;
        font-weight: bold;
        margin: 8px 0;
      }
      .islem {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      .islem button {
        border: 0;
        border-radius: 8px;
        padding: 8px;
        font-weight: bold;
        cursor: pointer;
      }
      .duz {
        background: #fff3e0;
      }
      .sil {
        background: #ffebee;
        color: var(--r);
      }
      dialog {
        border: 0;
        border-radius: 16px;
        padding: 0;
        width: min(94%, 500px);
      }
      dialog::backdrop {
        background: #0008;
      }
      .form {
        padding: 19px;
      }
      .alan {
        display: grid;
        gap: 5px;
        margin-bottom: 11px;
      }
      .alan input,
      .alan select {
        width: 100%;
      }
      .form-alt {
        display: flex;
        justify-content: flex-end;
        gap: 7px;
      }
      .form-alt button {
        border: 0;
        border-radius: 9px;
        padding: 10px;
        font-weight: bold;
      }
      .toast {
        position: fixed;
        top: 15px;
        left: 50%;
        transform: translate(-50%, -100px);
        background: #263238;
        color: #fff;
        padding: 12px 18px;
        border-radius: 10px;
        transition: 0.25s;
      }
      .toast.goster {
        transform: translate(-50%, 0);
      }
      @media (max-width: 850px) {
        .masalar,
        .urunler {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 520px) {
        .ozet,
        .urunler {
          grid-template-columns: 1fr;
        }
        .masalar {
          grid-template-columns: repeat(2, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <div id="toast" class="toast"></div>
    <header>
      <div>
        <h1>☕ DİJİTAL KAHVEM</h1>
        <div class="alt">Yönetici Paneli</div>
      </div>
    </header>
    <nav
      style="
        position: sticky;
        top: 0;
        z-index: 10;
        background: #fff;
        box-shadow: 0 3px 12px #0002;
        padding: 9px;
      "
    >
      <div
        style="
          max-width: 1200px;
          margin: auto;
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 8px;
        "
      >
        <button
          id="btnMasalar"
          onclick="panelAc('masalarPanel',this)"
          style="
            border: 0;
            border-radius: 10px;
            padding: 13px;
            background: #4e342e;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
          "
        >
          🪑 Masalar</button
        ><button
          id="btnGarson"
          onclick="panelAc('garsonPanel',this)"
          style="
            border: 0;
            border-radius: 10px;
            padding: 13px;

            font-weight: bold;

          "

          🔔 Garson Paneli</button
        ><button

            border-radius: 10px;

            font-weight: bold;
            cursor: pointer;
          "
        >
          ☕ Menü Yönetimi</button
        ><button
          id="btnIstatistik"
          onclick="panelAc('istatistikPanel',this)"
          style="
            border: 0;
            border-radius: 10px;
            padding: 13px;
            background: #eee;
            color: #33231e;
            font-weight: bold;
            cursor: pointer;
          "
        >
          📊 İstatistikler
        </button>
      </div>
    </nav>
    <main>
      <section id="masalarPanel" class="yonetim-panel">
        <section class="ozet">
          <div>Açık masa<b id="acik">0</b></div>
          <div>Günlük onaylı hasılat<b id="toplam">₺0</b></div>
          <div>Bekleyen sipariş<b id="bekleyen">0</b></div>
        </section>
        <h2>🪑 Masa ve Hesap Yönetimi</h2>
        <div
          style="
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;

          "
        >
          <button

            style="background: #263238"

            🌙 Gün Sonu Yap

          <button

          >
            ↩ Son Hesap Ödemeyi Geri Al
          </button>
        </div>
        <section id="masalar" class="masalar"></section>
      </section>
      <section id="garsonPanel" class="yonetim-panel" style="display: none">
        <iframe

      </section>
      <section id="menuPanel" class="yonetim-panel" style="display: none">
        <h2>☕ Menü Yönetimi</h2>
        <section class="panel">
          <div class="panel-ust">
            <b>Ürün ekle, düzenle veya sil</b
            ><button class="ana" onclick="yeniUrun()">＋ Yeni Ürün</button>
          </div>
          <div class="filtre">
            <input
              id="arama"
              placeholder="Ürün ara…"
              oninput="urunleriCiz()"

        </section>
      </section>

    <dialog id="urunPencere">
      <form class="form" onsubmit="urunKaydet(event)">
        <h2 id="formBaslik">Yeni Ürün</h2>
        <input type="hidden" id="urunId" /><label class="alan"
          >Ürün adı<input id="urunAd" required /></label
        ><label class="alan"
          >Kategori<select id="urunKat">
            <option>Sıcak İçecekler</option>

        ><label class="alan"
          >Fiyat<input
            id="urunFiyat"
            type="number"
            min="0"
            step="0.01"
            required /></label

          >Görsel adresi<input id="urunGorsel" type="url" /></label

          >Durum<select id="urunAktif">
            <option value="true">Aktif</option>
            <option value="false">Pasif</option>
          </select></label

          <button type="button" onclick="urunPencere.close()">Vazgeç</button
          ><button class="ana">Kaydet</button>

    </dialog>
    <script>
      window.panelAc = function (id, buton) {
        document
          .querySelectorAll(".yonetim-panel")
          .forEach((p) => (p.style.display = "none"));
        document.getElementById(id).style.display = "block";
        document.querySelectorAll("nav button").forEach((b) => {
          b.style.background = "#eee";
          b.style.color = "#33231e";
        });
        buton.style.background = "#4e342e";
        buton.style.color = "#fff";
        if (id === "garsonPanel") {
          const f = document.querySelector("#garsonPanel iframe");
          if (!f.dataset.guncel) {
            f.src = "garson.html?v=" + Date.now();
            f.dataset.guncel = "1";
          }
        }
      };
    </script>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
      import {
        getFirestore,
        collection,
        onSnapshot,
        serverTimestamp,
        doc,
        writeBatch,
        query,
        where,
        getDocs,
        addDoc,
        updateDoc,
        deleteDoc,
        setDoc,
        getDoc,
      } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
      const cfg = {
          apiKey: "AIzaSyC05yXQzAlF2AYzzeaJrDdMUYKwohKOsWM",
          authDomain: "dijitalkahve-67f0a.firebaseapp.com",
          projectId: "dijitalkahve-67f0a",
          storageBucket: "dijitalkahve-67f0a.firebasestorage.app",
          messagingSenderId: "326476599239",
          appId: "1:326476599239:web:143f39583a3478118853e2",
        },
        db = getFirestore(initializeApp(cfg));
      let oturumlar = {},
        siparisler = [],
        menu = [],
        gunSonlari = [];
      let gunBaslangic = new Date();
      gunBaslangic.setHours(0, 0, 0, 0);
      const para = (n) =>
        new Intl.NumberFormat("tr-TR", {
          style: "currency",
          currency: "TRY",
          maximumFractionDigits: 2,
        }).format(Number(n || 0));
      function mesaj(m) {
        const e = document.getElementById("toast");
        e.textContent = m;
        e.classList.add("goster");
        setTimeout(() => e.classList.remove("goster"), 2200);
      }
      function ciz() {
        const hesap = {};
        siparisler
          .filter((s) => s.durum === "Onaylandı")
          .forEach(
            (s) =>
              (hesap[s.oturumId] =
                (hesap[s.oturumId] || 0) + Number(s.toplam || 0)),
          );
        document.getElementById("masalar").innerHTML = Array.from(
          { length: 10 },
          (_, i) => i + 1,
        )
          .map((no) => {
            const o = oturumlar[no],
              t = o ? hesap[o.id] || 0 : 0;
            return `<article class="masa ${o ? "acik" : "kapali"}"><div class="no">Masa ${no}</div><div class="durum">${o ? "🟢 AÇIK" : "🔴 KAPALI"}</div><div class="tutar">${para(t)}</div><button ${o ? "" : "disabled"} onclick="hesapOdendi(${no})">Hesap Ödendi</button></article>`;
          })
          .join("");
        document.getElementById("acik").textContent =
          Object.keys(oturumlar).length;
        const gunluk = siparisler.filter(
          (s) => s.onayZamani?.toMillis?.() >= gunBaslangic.getTime(),
        );
        document.getElementById("toplam").textContent = para(
          gunluk.reduce((t, s) => t + Number(s.toplam || 0), 0),
        );
        document.getElementById("bekleyen").textContent = siparisler.filter(
          (s) => s.durum === "Bekleyen",
        ).length;
      }
      onSnapshot(collection(db, "oturumlar"), (s) => {
        oturumlar = {};
        s.docs.forEach((d) => {
          const x = d.data();
          if (x.durum === "acik")
            oturumlar[Number(x.masa)] = { id: d.id, ...x };
        });
        ciz();
      });
      onSnapshot(collection(db, "siparisler"), (s) => {
        siparisler = s.docs.map((d) => ({ id: d.id, ...d.data() }));
        ciz();
      });
      onSnapshot(collection(db, "menu"), (s) => {
        menu = s.docs.map((d) => ({ id: d.id, ...d.data() }));
        urunleriCiz();
      });
      onSnapshot(doc(db, "ayarlar", "gunluk"), (s) => {
        if (s.exists() && s.data().gunBaslangic?.toDate)
          gunBaslangic = s.data().gunBaslangic.toDate();
        ciz();
      });
      onSnapshot(collection(db, "gunSonlari"), (s) => {
        gunSonlari = s.docs
          .map((d) => ({ id: d.id, ...d.data() }))
          .sort(
            (a, b) =>
              (b.kapanisZamani?.toMillis?.() || 0) -
              (a.kapanisZamani?.toMillis?.() || 0),
          );
        istatistikleriCiz();
      });

      function istatistikleriCiz() {
        const a = document.getElementById("istatistikler");
        if (!a) return;
        a.innerHTML = gunSonlari.length
          ? gunSonlari
              .map(
                (g) =>
                  `<article class="urun" style="margin-bottom:10px"><h3>${g.tarih || "Gün sonu"}</h3><div class="fiyat">${para(g.toplam)}</div><div class="etiket">${g.siparisSayisi || 0} sipariş</div><hr>${Object.entries(
                    g.urunOzet || {},
                  )
                    .sort((x, y) => y[1].adet - x[1].adet)
                    .map(
                      ([ad, v]) =>
                        `<div style="display:flex;justify-content:space-between;padding:5px"><span>${ad}: <b>${v.adet} adet</b></span><span>${para(v.tutar)}</span></div>`,
                    )
                    .join("")}</article>`,
              )
              .join("")
          : "Henüz gün sonu kaydı yok.";
      }

      window.gunSonuYap = async () => {
        if (
          Object.keys(oturumlar).length &&
          !confirm("Açık masalar var. Yine de gün sonu yapılsın mı?")
        )
          return;
        if (
          !confirm(
            "Günlük hasılat istatistiklere kaydedilecek ve sayaç sıfırlanacak. Onaylıyor musunuz?",
          )
        )
          return;
        const liste = siparisler.filter(
            (s) => s.onayZamani?.toMillis?.() >= gunBaslangic.getTime(),
          ),
          urunOzet = {};
        liste.forEach((s) =>
          (s.urunler || []).forEach((u) => {
            const x =
              urunOzet[u.urun] || (urunOzet[u.urun] = { adet: 0, tutar: 0 });
            x.adet += Number(u.adet || 0);
            x.tutar += Number(u.tutar || 0);
          }),
        );
        try {
          const onceki = gunBaslangic;
          await addDoc(collection(db, "gunSonlari"), {
            tarih: new Date().toLocaleDateString("tr-TR"),
            toplam: liste.reduce((t, s) => t + Number(s.toplam || 0), 0),
            siparisSayisi: liste.length,
            urunOzet,
            oncekiBaslangic: onceki,
            kapanisZamani: serverTimestamp(),
          });
          await setDoc(
            doc(db, "ayarlar", "gunluk"),
            { gunBaslangic: serverTimestamp() },
            { merge: true },
          );
          mesaj("Gün sonu tamamlandı");
        } catch (e) {
          alert(e.message);
        }
      };

      window.sonGunSonunuGeriAl = async () => {
        const g = gunSonlari[0];
        if (!g) return alert("Geri alınacak gün sonu yok.");
        if (!confirm(`${g.tarih} gün sonu geri alınsın mı?`)) return;
        try {
          await setDoc(
            doc(db, "ayarlar", "gunluk"),
            { gunBaslangic: g.oncekiBaslangic },
            { merge: true },
          );
          await deleteDoc(doc(db, "gunSonlari", g.id));
          mesaj("Gün sonu geri alındı");
        } catch (e) {
          alert(e.message);
        }
      };
      window.urunleriCiz = () => {
        const a = document
            .getElementById("arama")
            .value.toLocaleLowerCase("tr-TR"),
          k = document.getElementById("katFiltre").value,
          l = menu.filter(
            (u) =>
              (!k || u.kategori === k) &&
              (u.ad || "").toLocaleLowerCase("tr-TR").includes(a),
          );
        document.getElementById("urunler").innerHTML = l.length
          ? l
              .map(
                (u) =>
                  `<article class="urun"><h3>${u.ad}</h3><div class="etiket">${u.kategori} · ${u.aktif === false ? "Pasif" : "Aktif"}</div><div class="fiyat">${para(u.fiyat)}</div><div class="islem"><button class="duz" onclick="urunDuzenle('${u.id}')">Düzenle</button><button class="sil" onclick="urunSil('${u.id}')">Sil</button></div></article>`,
              )
              .join("")
          : "Henüz ürün eklenmedi.";
      };
      window.yeniUrun = () => {
        formBaslik.textContent = "Yeni Ürün";
        urunId.value = "";
        urunAd.value = "";
        urunFiyat.value = "";
        urunGorsel.value = "";
        urunKat.value = "Sıcak İçecekler";
        urunAktif.value = "true";
        urunPencere.showModal();
      };
      window.urunDuzenle = (id) => {
        const u = menu.find((x) => x.id === id);
        formBaslik.textContent = "Ürünü Düzenle";
        urunId.value = id;
        urunAd.value = u.ad;
        urunKat.value = u.kategori;
        urunFiyat.value = u.fiyat;
        urunGorsel.value = u.gorsel || "";
        urunAktif.value = String(u.aktif !== false);
        urunPencere.showModal();
      };
      window.urunKaydet = async (e) => {
        e.preventDefault();
        const id = urunId.value,
          v = {
            ad: urunAd.value.trim(),
            kategori: urunKat.value,
            fiyat: Number(urunFiyat.value),
            gorsel: urunGorsel.value.trim(),
            aktif: urunAktif.value === "true",
            guncellemeZamani: serverTimestamp(),
          };
        try {
          id
            ? await updateDoc(doc(db, "menu", id), v)
            : await addDoc(collection(db, "menu"), {
                ...v,
                olusturmaZamani: serverTimestamp(),
              });
          urunPencere.close();
          mesaj("Ürün kaydedildi");
        } catch (x) {
          alert(x.message);
        }
      };
      window.urunSil = async (id) => {
        const u = menu.find((x) => x.id === id);
        if (confirm(`“${u.ad}” silinsin mi?`)) {
          await deleteDoc(doc(db, "menu", id));
          mesaj("Ürün silindi");
        }
      };
      window.hesapOdendi = async (no) => {
        const o = oturumlar[no];
        if (!o || !confirm(`Masa ${no} hesabı ödendi ve masa kapatılsın mı?`))
          return;
        try {
          const b = writeBatch(db),
            sq = await getDocs(
              query(
                collection(db, "siparisler"),
                where("oturumId", "==", o.id),
              ),
            ),
            cq = await getDocs(
              query(
                collection(db, "garsonCagrilari"),
                where("oturumId", "==", o.id),
              ),
            );
          await setDoc(doc(db, "ayarlar", "sonOdeme"), {
            masa: no,
            oturumId: o.id,
            oturum: o,
            siparisler: sq.docs.map((x) => ({
              id: x.id,
              durum: x.data().durum,
              odendi: x.data().odendi || false,
            })),
            geriAlindi: false,
            zaman: serverTimestamp(),
          });
          sq.docs.forEach((x) =>
            b.update(x.ref, {
              durum: "Tamamlandı",
              odendi: true,
              odemeZamani: serverTimestamp(),
            }),
          );
          cq.docs.forEach((x) => b.update(x.ref, { durum: "tamamlandi" }));
          b.update(doc(db, "oturumlar", o.id), {
            durum: "kapali",
            odendi: true,
            kapanisZamani: serverTimestamp(),
          });
          await b.commit();
          mesaj(`Masa ${no} sıfırlandı ve kapandı`);
        } catch (e) {
          alert(e.message);
        }
      };
      window.sonIslemiGeriAl = async () => {
        try {
          const s = await getDoc(doc(db, "ayarlar", "sonOdeme"));
          if (!s.exists() || s.data().geriAlindi)
            return alert("Geri alınacak hesap ödeme işlemi yok.");
          const x = s.data();
          if (!confirm(`Masa ${x.masa} hesap ödeme işlemi geri alınsın mı?`))
            return;
          const b = writeBatch(db);
          b.update(doc(db, "oturumlar", x.oturumId), {
            durum: "acik",
            odendi: false,
            kapanisZamani: null,
          });
          (x.siparisler || []).forEach((k) =>
            b.update(doc(db, "siparisler", k.id), {
              durum: k.durum,
              odendi: k.odendi,
              odemeZamani: null,
            }),
          );
          b.update(doc(db, "ayarlar", "sonOdeme"), {
            geriAlindi: true,
            geriAlmaZamani: serverTimestamp(),
          });
          await b.commit();
          mesaj(`Masa ${x.masa} yeniden açıldı`);
        } catch (e) {
          alert(e.message);
        }
      };
      ciz();
    </script>
  </body>
</html>
