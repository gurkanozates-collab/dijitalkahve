<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Dijital Kahvem - Yönetici</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f1ee;
    color:#33231e;
}

header{
    background:#4e342e;
    color:white;
    padding:20px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:28px;
}

header p{
    margin:6px 0 0;
}

.topbar{
    position:sticky;
    top:0;
    z-index:100;
    background:white;
    padding:12px 15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 2px 8px #0002;
}

.baglanti{
    font-weight:bold;
}

.yenile{
    border:0;
    background:#1565c0;
    color:white;
    padding:10px 15px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.container{
    max-width:1500px;
    margin:auto;
    padding:15px;
}

.istatistikler{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:20px;
}

.istatistik{
    background:white;
    padding:18px;
    border-radius:12px;
    box-shadow:0 2px 8px #0001;
}

.istatistik span{
    display:block;
    color:#777;
    font-size:13px;
    margin-bottom:7px;
}

.istatistik b{
    font-size:25px;
}

.masa-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.masa{
    background:white;
    border:2px solid #ddd;
    border-radius:14px;
    padding:15px;
    box-shadow:0 2px 8px #0001;
}

.masa.acik{
    border-color:#2e7d32;
}

.masa.bekleyen{
    border-color:#ef6c00;
    box-shadow:0 0 0 3px #ef6c0020;
}

.masa-baslik{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
}

.masa-baslik h3{
    margin:0;
    font-size:21px;
}

.durum{
    padding:6px 9px;
    border-radius:15px;
    font-size:12px;
    font-weight:bold;
    background:#eee;
    color:#777;
}

.durum.acik{
    background:#e8f5e9;
    color:#2e7d32;
}

.durum.bekleyen{
    background:#fff3cd;
    color:#ef6c00;
}

.oturum{
    background:#f7f7f7;
    padding:10px;
    border-radius:8px;
    margin-bottom:10px;
    font-size:13px;
}

.siparis{
    background:#fffaf5;
    border:1px solid #ddd;
    border-left:5px solid #1565c0;
    border-radius:9px;
    padding:10px;
    margin-top:10px;
}

.siparis.garson{
    border-left-color:#ef6c00;
    background:#fff8ef;
}

.siparis.bekleyen{
    box-shadow:0 0 0 2px #ef6c0020;
}

.siparis-baslik{
    display:flex;
    justify-content:space-between;
    gap:8px;
    margin-bottom:8px;
}

.kaynak{
    display:block;
    text-align:center;
    padding:7px;
    border-radius:7px;
    font-size:12px;
    font-weight:bold;
    margin-bottom:8px;
}

.kaynak.musteri{
    background:#e3f2fd;
    color:#1565c0;
}

.kaynak.garson{
    background:#fff3e0;
    color:#e65100;
}

.zaman{
    color:#777;
    font-size:12px;
    margin-bottom:7px;
}

.urun{
    display:flex;
    justify-content:space-between;
    padding:5px 0;
    border-bottom:1px solid #eee;
}

.siparis-toplam{
    text-align:right;
    font-weight:bold;
    margin-top:8px;
}

.bekleyen-yazi{
    color:#ef6c00;
    font-weight:bold;
}

.onayli-yazi{
    color:#2e7d32;
    font-weight:bold;
}

.masa-toplam{
    margin-top:15px;
    padding:14px;
    background:#4e342e;
    color:white;
    border-radius:10px;
}

.masa-toplam-satir{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.masa-toplam strong{
    font-size:24px;
}

.butons{
    display:grid;
    grid-template-columns:1fr;
    gap:8px;
    margin-top:10px;
}

.btn{
    border:0;
    border-radius:9px;
    padding:12px;
    font-weight:bold;
    cursor:pointer;
}

.onay{
    background:#2e7d32;
    color:white;
}

.odeme{
    background:#1565c0;
    color:white;
}

.kapat{
    background:#c62828;
    color:white;
}

.bos{
    text-align:center;
    padding:40px 15px;
    color:#777;
    background:white;
    border-radius:14px;
}

@media(max-width:1100px){

    .masa-grid{
        grid-template-columns:repeat(3,1fr);
    }

    .istatistikler{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:750px){

    .masa-grid{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:520px){

    .masa-grid{
        grid-template-columns:1fr;
    }

    .istatistikler{
        grid-template-columns:1fr 1fr;
    }

    .istatistik b{
        font-size:20px;
    }

}

</style>
</head>

<body>

<header>

    <h1>☕ DİJİTAL KAHVEM</h1>

    <p>Yönetici Paneli</p>

</header>


<div class="topbar">

    <div
        id="baglanti"
        class="baglanti">

        🟡 Firebase bağlanıyor...

    </div>


    <button
        class="yenile"
        onclick="location.reload()">

        🔄 Yenile

    </button>

</div>


<div class="container">


    <div class="istatistikler">

        <div class="istatistik">

            <span>
                🪑 Açık Masa
            </span>

            <b id="acikMasaSayisi">
                0
            </b>

        </div>


        <div class="istatistik">

            <span>
                🟡 Bekleyen Sipariş
            </span>

            <b id="bekleyenSayisi">
                0
            </b>

        </div>


        <div class="istatistik">

            <span>
                📦 Toplam Sipariş
            </span>

            <b id="siparisSayisi">
                0
            </b>

        </div>


        <div class="istatistik">

            <span>
                💰 Açık Hesap
            </span>

            <b id="acikHesap">
                0 ₺
            </b>

        </div>

    </div>


    <div
        id="masaGrid"
        class="masa-grid">

    </div>

</div>


<script type="module">


import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getFirestore,
    collection,
    query,
    onSnapshot,
    updateDoc,
    doc,
    serverTimestamp,
    where,
    getDocs
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyC05yXQzAlF2AYzzeaJrDdMUYKwohKOsWM",

    authDomain:
    "dijitalkahve-67f0a.firebaseapp.com",

    databaseURL:
    "https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
    "dijitalkahve-67f0a",

    storageBucket:
    "dijitalkahve-67f0a.firebasestorage.app",

    messagingSenderId:
    "326476599239",

    appId:
    "1:326476599239:web:143f39583a3478118853e2",

    measurementId:
    "G-WM65PC4648"

};


const app =
initializeApp(firebaseConfig);


const db =
getFirestore(app);


/* =========================
   VERİLER
========================= */

let oturumlar = [];

let siparisler = [];


/* =========================
   ZAMAN
========================= */

function zaman(veri){

    if(
        veri &&
        veri.olusturmaZamani &&
        typeof veri.olusturmaZamani.toMillis ===
        "function"
    ){

        return veri.olusturmaZamani.toMillis();

    }

    if(
        veri &&
        veri.acilisZamani &&
        typeof veri.acilisZamani.toMillis ===
        "function"
    ){

        return veri.acilisZamani.toMillis();

    }

    return 0;

}


function saat(veri){

    const tarih =
    veri?.olusturmaZamani?.toDate?.() ||
    veri?.acilisZamani?.toDate?.();


    if(!tarih){

        return "--:--";

    }


    return tarih.toLocaleTimeString(
        "tr-TR",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =========================
   SİPARİŞ KAYNAĞI
========================= */

function garsonMu(s){

    return (
        s.kaynak === "garson" ||
        s.garsonSiparisi === true
    );

}


/* =========================
   SİPARİŞ HTML
========================= */

function siparisHTML(s){

    let html = "";


    (s.urunler || []).forEach(u => {

        const adet =
        Number(u.adet || 0);


        const fiyat =
        Number(u.fiyat || 0);


        html += `

            <div class="urun">

                <span>
                    ${u.urun} × ${adet}
                </span>

                <b>
                    ${adet * fiyat} ₺
                </b>

            </div>

        `;

    });


    const garson =
    garsonMu(s);


    return `

        <div class="
            siparis
            ${garson ? "garson" : ""}
            ${s.durum === "Bekleyen" ? "bekleyen" : ""}
        ">

            <div class="siparis-baslik">

                <strong>
                    ${garson ? "👨‍🍳 Garson" : "👤 Müşteri"}
                </strong>

                <span class="
                    ${
                        s.durum === "Bekleyen"
                        ?
                        "bekleyen-yazi"
                        :
                        "onayli-yazi"
                    }
                ">

                    ${
                        s.durum === "Bekleyen"
                        ?
                        "🟡 Bekleyen"
                        :
                        "🟢 Onaylandı"
                    }

                </span>

            </div>


            <div class="
                kaynak
                ${garson ? "garson" : "musteri"}
            ">

                ${
                    garson
                    ?
                    "👨‍🍳 GARSON SİPARİŞİ"
                    :
                    "👤 MÜŞTERİ SİPARİŞİ"
                }

            </div>


            <div class="zaman">

                🕐 ${saat(s)}

            </div>


            ${html}


            <div class="siparis-toplam">

                ${Number(s.toplam || 0)} ₺

            </div>


            ${
                s.durum === "Bekleyen"
                ?

                `

                <button
                    class="btn onay"
                    style="width:100%;margin-top:8px"
                    onclick="
                        siparisOnayla('${s.id}')
                    ">

                    🟢 Siparişi Onayla

                </button>

                `

                :

                ""

            }

        </div>

    `;

}


/* =========================
   MASA HESABI
========================= */

function masaHesapla(oturumId){

    return siparisler
        .filter(
            s =>
            s.oturumId === oturumId
        )
        .reduce(
            (toplam,s) =>
            toplam +
            Number(s.toplam || 0),
            0
        );

}


/* =========================
   MASA SİPARİŞLERİ
========================= */

function masaSiparisleri(oturumId){

    return siparisler
        .filter(
            s =>
            s.oturumId === oturumId
        )
        .sort(
            (a,b) =>
            zaman(a)-zaman(b)
        );

}


/* =========================
   SİPARİŞ ONAY
========================= */

window.siparisOnayla =
async function(id){

    const s =
    siparisler.find(
        x => x.id === id
    );


    if(!s){

        return;

    }


    if(
        !confirm(
            "Masa " +
            s.masa +
            " siparişi onaylansın mı?"
        )
    ){

        return;

    }


    try{

        await updateDoc(

            doc(
                db,
                "siparisler",
                id
            ),

            {

                durum:
                "Onaylandı",

                onaylanmaZamani:
                serverTimestamp()

            }

        );

    }
    catch(error){

        console.error(error);

        alert(
            "❌ Sipariş onaylanamadı:\n\n" +
            error.message
        );

    }

};


/* =========================
   HESAP ÖDENDİ
========================= */

window.hesapOdendi =
async function(oturumId){

    const oturum =
    oturumlar.find(
        x => x.id === oturumId
    );


    if(!oturum){

        alert(
            "❌ Oturum bulunamadı."
        );

        return;

    }


    const toplam =
    masaHesapla(oturumId);


    if(
        !confirm(
            "💰 HESAP ÖDENDİ olarak işaretlensin mi?\n\n" +
            "Masa: " +
            oturum.masa +
            "\n" +
            "Toplam: " +
            toplam +
            " ₺"
        )
    ){

        return;

    }


    try{

        /*
         * OTURUMU ÖDENDİ YAP
         */

        await updateDoc(

            doc(
                db,
                "oturumlar",
                oturumId
            ),

            {

                hesapOdendi:
                true,

                odemeZamani:
                serverTimestamp()

            }

        );


        /*
         * BU OTURUMA AİT SİPARİŞLERİ
         * DEĞİŞTİRMEK ZORUNDA DEĞİLİZ.
         *
         * Oturum bilgisi ödeme bilgisinin
         * ana kaynağıdır.
         */


        alert(
            "✅ HESAP ÖDENDİ!\n\n" +
            "Masa " +
            oturum.masa +
            "\n" +
            toplam +
            " ₺"
        );

    }
    catch(error){

        console.error(error);

        alert(
            "❌ Ödeme kaydedilemedi:\n\n" +
            error.message
        );

    }

};


/* =========================
   MASA KAPAT
========================= */

window.masaKapat =
async function(oturumId){

    const oturum =
    oturumlar.find(
        x => x.id === oturumId
    );


    if(!oturum){

        return;

    }


    /*
     * ÖDEME YAPILMADAN MASA KAPATILAMAZ
     */

    if(
        oturum.hesapOdendi !== true
    ){

        alert(
            "⚠️ Önce hesabı 'Hesap Ödendi' olarak işaretlemelisin."
        );

        return;

    }


    const toplam =
    masaHesapla(oturumId);


    if(
        !confirm(
            "🔒 Masa " +
            oturum.masa +
            " kapatılsın mı?\n\n" +
            "Ödenen hesap: " +
            toplam +
            " ₺"
        )
    ){

        return;

    }


    try{

        await updateDoc(

            doc(
                db,
                "oturumlar",
                oturumId
            ),

            {

                durum:
                "kapali",

                kapanisZamani:
                serverTimestamp()

            }

        );


        alert(
            "✅ Masa " +
            oturum.masa +
            " kapatıldı."
        );

    }
    catch(error){

        console.error(error);

        alert(
            "❌ Masa kapatılamadı:\n\n" +
            error.message
        );

    }

};


/* =========================
   MASALARI GÖSTER
========================= */

function masalariGoster(){

    const grid =
    document.getElementById(
        "masaGrid"
    );


    grid.innerHTML = "";


    /*
     * SADECE AÇIK OTURUMLAR
     */

    const acikOturumlar =
    oturumlar.filter(
        o =>
        o.durum === "acik"
    );


    document.getElementById(
        "acikMasaSayisi"
    ).textContent =
    acikOturumlar.length;


    const bekleyen =
    siparisler.filter(
        s =>
        s.durum === "Bekleyen"
    );


    document.getElementById(
        "bekleyenSayisi"
    ).textContent =
    bekleyen.length;


    document.getElementById(
        "siparisSayisi"
    ).textContent =
    siparisler.length;


    let genelToplam = 0;


    acikOturumlar.forEach(
        oturum => {

            const liste =
            masaSiparisleri(
                oturum.id
            );


            const toplam =
            masaHesapla(
                oturum.id
            );


            genelToplam += toplam;


            const bekleyenSayisi =
            liste.filter(
                s =>
                s.durum ===
                "Bekleyen"
            ).length;


            const div =
            document.createElement(
                "div"
            );


            div.className =
            "masa acik";


            if(
                bekleyenSayisi > 0
            ){

                div.classList.add(
                    "bekleyen"
                );

            }


            let html = `

                <div class="masa-baslik">

                    <h3>
                        🪑 Masa ${oturum.masa}
                    </h3>

                    <span class="
                        durum
                        ${
                            bekleyenSayisi
                            ?
                            "bekleyen"
                            :
                            "acik"
                        }
                    ">

                        ${
                            bekleyenSayisi
                            ?
                            "🟡 " +
                            bekleyenSayisi +
                            " Bekleyen"
                            :
                            "🟢 Açık"
                        }

                    </span>

                </div>


                <div class="oturum">

                    <b>
                        🟢 Aktif Masa Oturumu
                    </b>

                    <br>

                    Oturum ID:
                    <small>
                        ${oturum.id}
                    </small>

                    ${
                        oturum.hesapOdendi === true
                        ?

                        `
                        <br>
                        <strong style="color:#2e7d32">
                            ✅ Hesap Ödendi
                        </strong>
                        `

                        :

                        `
                        <br>
                        <strong style="color:#ef6c00">
                            💰 Hesap Açık
                        </strong>
                        `
                    }

                </div>

            `;


            if(
                liste.length === 0
            ){

                html += `

                    <div style="
                        text-align:center;
                        color:#999;
                        padding:15px;
                    ">

                        Henüz sipariş yok.

                    </div>

                `;

            }


            liste.forEach(
                s => {

                    html +=
                    siparisHTML(s);

                }
            );


            html += `

                <div class="masa-toplam">

                    <div class="masa-toplam-satir">

                        <span>
                            💰 MASA HESABI
                        </span>

                        <strong>
                            ${toplam} ₺
                        </strong>

                    </div>

                </div>

            `;


            /*
             * ÖDEME BUTONU
             */

            if(
                oturum.hesapOdendi !== true
            ){

                html += `

                    <div class="butons">

                        <button
                            class="btn odeme"
                            onclick="
                                hesapOdendi(
                                    '${oturum.id}'
                                )
                            ">

                            💰 HESAP ÖDENDİ

                        </button>

                    </div>

                `;

            }
            else{

                html += `

                    <div class="butons">

                        <button
                            class="btn kapat"
                            onclick="
                                masaKapat(
                                    '${oturum.id}'
                                )
                            ">

                            🔒 MASA OTURUMUNU KAPAT

                        </button>

                    </div>

                `;

            }


            div.innerHTML =
            html;


            grid.appendChild(
                div
            );

        }
    );


    document.getElementById(
        "acikHesap"
    ).textContent =
    genelToplam +
    " ₺";


    if(
        acikOturumlar.length === 0
    ){

        grid.innerHTML = `

            <div
                class="bos"
                style="
                    grid-column:1/-1;
                ">

                <div style="font-size:45px">
                    🪑
                </div>

                <h2>
                    Açık masa yok
                </h2>

                <p>
                    Garson panelinden bir masa
                    oturumu açıldığında burada
                    görünecektir.
                </p>

            </div>

        `;

    }

}


/* =========================
   OTURUMLARI DİNLE
========================= */

const oturumQuery =
query(
    collection(
        db,
        "oturumlar"
    )
);


onSnapshot(

    oturumQuery,

    snapshot => {

        oturumlar = [];


        snapshot.forEach(
            item => {

                oturumlar.push({

                    id:
                    item.id,

                    ...item.data()

                });

            }
        );


        masalariGoster();


        document.getElementById(
            "baglanti"
        ).textContent =
        "🟢 Firebase bağlantısı aktif";

    },

    error => {

        console.error(
            "OTURUM HATASI:",
            error
        );


        document.getElementById(
            "baglanti"
        ).textContent =
        "🔴 Firebase bağlantı hatası: " +
        error.message;

    }

);


/* =========================
   SİPARİŞLERİ DİNLE
========================= */

const siparisQuery =
query(
    collection(
        db,
        "siparisler"
    )
);


onSnapshot(

    siparisQuery,

    snapshot => {

        siparisler = [];


        snapshot.forEach(
            item => {

                siparisler.push({

                    id:
                    item.id,

                    ...item.data()

                });

            }
        );


        /*
         * TÜM SİPARİŞLERİ TUTUYORUZ.
         *
         * Bekleyen + Onaylandı
         *
         * Böylece hesap toplamı kaybolmaz.
         */

        siparisler.sort(
            (a,b) =>
            zaman(a)-zaman(b)
        );


        masalariGoster();

    },

    error => {

        console.error(
            "SİPARİŞ HATASI:",
            error
        );


        document.getElementById(
            "baglanti"
        ).textContent =
        "🔴 Sipariş bağlantı hatası";

    }

);


</script>

</body>
</html>
