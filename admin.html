<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dijital Kahve - Yönetici</title>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f4f6f8;
 color:#263238
}
.header{
 background:linear-gradient(135deg,#3e2723,#795548);
 color:white;text-align:center;padding:22px
}
.header h1{margin:0}
.login{
 max-width:400px;margin:70px auto;padding:20px
}
.login-box,.box{
 background:white;padding:25px;border-radius:16px;
 box-shadow:0 5px 20px #0001
}
input,select{
 width:100%;padding:12px;border:1px solid #ddd;
 border-radius:9px;margin:7px 0
}
button{
 border:0;padding:12px;border-radius:9px;
 font-weight:bold;cursor:pointer
}
.login-btn{width:100%;background:#5d4037;color:white}
#adminContent{display:none}
.container{max-width:1200px;margin:auto;padding:15px}
.nav{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:8px;margin-bottom:15px
}
.nav button{background:white;color:#5d4037}
.nav button.active{background:#5d4037;color:white}
.section{display:none}
.section.active{display:block}

/* MASALAR */
.ayar{
 background:white;padding:12px;border-radius:12px;
 margin-bottom:12px;display:flex;gap:10px;align-items:center
}
.ayar input{
 width:100px;margin:0
}

.masa-grid{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:8px;
 align-items:start
}

.masa{
 background:white;
 height:125px;
 border-radius:12px;
 padding:10px;
 border-top:4px solid #43a047;
 box-shadow:0 2px 7px #0001;
 cursor:pointer;
 transition:.25s;
 overflow:hidden
}

.masa.dolu{border-top-color:#e53935}

.masa.acik{
 grid-column:span 2;
 grid-row:span 2;
 height:270px;
 padding:17px;
 box-shadow:0 8px 25px #0002;
 z-index:5
}

.masa-head{
 display:flex;
 justify-content:space-between;
 align-items:center
}
.masa-no{
 font-size:17px;
 font-weight:bold
}
.durum{
 font-size:10px;
 padding:5px 7px;
 border-radius:15px
}
.bos{background:#e8f5e9;color:#2e7d32}
.dolu{background:#ffebee;color:#c62828}

.masa-detay{
 display:none;
 margin-top:12px
}
.masa.acik .masa-detay{display:block}

.urun{
 display:flex;
 justify-content:space-between;
 padding:7px 0;
 border-bottom:1px dashed #ddd;
 font-size:13px
}
.toplam{
 text-align:right;
 font-size:18px;
 font-weight:bold;
 color:#e65100;
 margin-top:10px
}
.odendi{
 width:100%;
 background:#2e7d32;
 color:white;
 margin-top:10px
}

/* ÜRÜNLER */
.form{
 display:grid;
 grid-template-columns:2fr 1fr 1fr auto;
 gap:8px
}
.urun-card{
 display:flex;
 justify-content:space-between;
 align-items:center;
 background:#fafafa;
 padding:12px;
 border-radius:9px;
 margin-top:8px
}
.duzen{background:#1565c0;color:white}
.sil{background:#d32f2f;color:white}

/* İSTATİSTİK */
.stats{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:10px
}
.stat{
 background:white;padding:20px;border-radius:14px
}
.stat b{
 display:block;
 font-size:25px;
 margin-top:8px
}
.satis{
 background:white;padding:15px;border-radius:14px;margin-top:15px
}
.satis-row{
 display:flex;justify-content:space-between;
 padding:10px 0;border-bottom:1px solid #eee
}
.reset{
 margin-top:15px;background:#fff5f5;
 border:1px solid #ffcdd2;
 padding:15px;border-radius:12px
}
.reset button{background:#c62828;color:white}

@media(max-width:900px){
 .masa-grid{grid-template-columns:repeat(4,1fr)}
}
@media(max-width:600px){
 .masa-grid{grid-template-columns:repeat(3,1fr)}
 .masa{height:105px}
 .masa.acik{grid-column:span 3;height:270px}
 .nav{grid-template-columns:1fr}
 .stats{grid-template-columns:1fr}
 .form{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="header">
<h1>☕ DİJİTAL KAHVE</h1>
<p>Yönetici Kontrol Paneli</p>
</div>

<div id="login" class="login">
<div class="login-box">
<h2>🔐 Yönetici Girişi</h2>
<input id="password" type="password" placeholder="Yönetici şifresi"
 onkeydown="if(event.key==='Enter')giris()">
<button class="login-btn" onclick="giris()">GİRİŞ YAP</button>
</div>
</div>

<div id="adminContent">
<div class="container">

<div class="nav">
<button class="active" onclick="sekme('masalar',this)">🪑 MASALAR</button>
<button onclick="sekme('urunler',this)">☕ ÜRÜNLER</button>
<button onclick="sekme('istatistik',this)">📊 İSTATİSTİK</button>
</div>

<div id="masalar" class="section active">

<div class="ayar">
<b>Masa Sayısı:</b>
<input id="masaSayisi" type="number" min="1" max="50" value="10">
<button onclick="masaSayisiniKaydet()">UYGULA</button>
</div>

<div id="masaGrid" class="masa-grid"></div>

</div>

<div id="urunler" class="section">

<div class="box">

<h2>➕ Yeni Ürün</h2>

<div class="form">
<input id="ad" placeholder="Ürün adı">
<input id="fiyat" type="number" placeholder="Fiyat">
<select id="kategori">
<option>Sıcak İçecekler</option>
<option>Soğuk İçecekler</option>
<option>Atıştırmalıklar</option>
<option>Tatlılar</option>
<option>Diğer</option>
</select>
<button onclick="urunEkle()">EKLE</button>
</div>

</div>

<div class="box">
<h2>📋 Menü</h2>
<div id="urunListesi"></div>
</div>

</div>

<div id="istatistik" class="section">

<div class="stats">

<div class="stat">
💰 Günlük Hasılat
<b id="hasilat">0 TL</b>
</div>

<div class="stat">
🧾 Ödenen Masa
<b id="odenen">0</b>
</div>

<div class="stat">
☕ Toplam Ürün
<b id="urunSayisi">0</b>
</div>

</div>

<div class="satis">
<h3>📦 Ürün Satışları</h3>
<div id="satisListesi"></div>
</div>

<div class="reset">
<h3>⚠️ İstatistikleri Sıfırla</h3>
<button onclick="istatistikSifirla()">SIFIRLA</button>
</div>

</div>

</div>
</div>

<script>
const firebaseConfig={
 databaseURL:"https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app",
 projectId:"dijitalkahve-67f0a",
 storageBucket:"dijitalkahve-67f0a.appspot.com",
 messagingSenderId:"326476599239"
};

if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);

const db=firebase.app().database(
 "https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app"
);

const SIFRE="1234";

let masaSayisi=parseInt(localStorage.getItem("masaSayisi")||"10");
let acikMasa=null;

document.getElementById("masaSayisi").value=masaSayisi;

function giris(){
 if(document.getElementById("password").value!==SIFRE){
  alert("❌ Hatalı şifre!");
  return;
 }

 document.getElementById("login").style.display="none";
 document.getElementById("adminContent").style.display="block";

 masalariDinle();
 urunleriDinle();
 istatistikDinle();
}

function sekme(id,btn){
 document.querySelectorAll(".section")
 .forEach(x=>x.classList.remove("active"));

 document.querySelectorAll(".nav button")
 .forEach(x=>x.classList.remove("active"));

 document.getElementById(id).classList.add("active");
 btn.classList.add("active");
}

function masaSayisiniKaydet(){
 const yeni=parseInt(document.getElementById("masaSayisi").value);

 if(!yeni||yeni<1||yeni>50){
  alert("1-50 arasında masa sayısı girin.");
  return;
 }

 masaSayisi=yeni;
 localStorage.setItem("masaSayisi",masaSayisi);
 acikMasa=null;
 masalariDinle();
}

/*
 SADECE ONAYLANAN SİPARİŞLER
 HESABA GİRER.
*/
function masalariDinle(){

 db.ref("siparisler").on("value",snap=>{

  const data=snap.val()||{};
  const masalar={};

  for(let i=1;i<=masaSayisi;i++){
   masalar[i]={
    urunler:{},
    toplam:0,
    dolu:false
   };
  }

  Object.values(data).forEach(s=>{

   if(!s)return;

   if(s.durum!=="onaylandi")return;

   const masa=parseInt(s.masa);

   if(!masalar[masa])return;

   masalar[masa].dolu=true;

   Object.values(s.urunler||{}).forEach(u=>{

    const key=String(u.ad).toLowerCase();

    if(!masalar[masa].urunler[key]){
     masalar[masa].urunler[key]={
      ad:u.ad,
      adet:0,
      fiyat:parseFloat(u.fiyat)||0
     };
    }

    masalar[masa].urunler[key].adet+=
     parseInt(u.adet)||0;

    masalar[masa].toplam+=
     (parseFloat(u.fiyat)||0)*
     (parseInt(u.adet)||0);
   });
  });

  masaGoster(masalar);
 });
}

function masaGoster(masalar){

 const grid=document.getElementById("masaGrid");
 grid.innerHTML="";

 for(let i=1;i<=masaSayisi;i++){

  const m=masalar[i];

  let html="";

  if(m.dolu){

   Object.values(m.urunler).forEach(u=>{
    html+=`
    <div class="urun">
     <span>${u.ad} × ${u.adet}</span>
     <b>${(u.adet*u.fiyat).toFixed(2)} TL</b>
    </div>`;
   });

  }else{
   html='<div style="color:#999;margin-top:15px">Masa boş</div>';
  }

  const acik=acikMasa===i;

  grid.innerHTML+=`
  <div class="masa
   ${m.dolu?'dolu':''}
   ${acik?'acik':''}"
   onclick="masaAc(${i})">

   <div class="masa-head">
    <span class="masa-no">M${i}</span>
    <span class="durum ${m.dolu?'dolu':'bos'}">
     ${m.dolu?'🔴 DOLU':'🟢 BOŞ'}
    </span>
   </div>

   <div class="masa-detay">

    ${html}

    ${m.dolu?`
    <div class="toplam">
     ${m.toplam.toFixed(2)} TL
    </div>

    <button class="odendi"
     onclick="event.stopPropagation();hesapOdendi(${i})">
     💳 HESAP ÖDENDİ
    </button>
    `:''}

   </div>

  </div>`;
 }
}

function masaAc(no){
 acikMasa=acikMasa===no?null:no;

 db.ref("siparisler").once("value").then(snap=>{
  const data=snap.val()||{};
  const masalar={};

  for(let i=1;i<=masaSayisi;i++){
   masalar[i]={urunler:{},toplam:0,dolu:false};
  }

  Object.values(data).forEach(s=>{
   if(!s||s.durum!=="onaylandi")return;

   const masa=parseInt(s.masa);
   if(!masalar[masa])return;

   masalar[masa].dolu=true;

   Object.values(s.urunler||{}).forEach(u=>{
    const key=String(u.ad).toLowerCase();

    if(!masalar[masa].urunler[key]){
     masalar[masa].urunler[key]={
      ad:u.ad,
      adet:0,
      fiyat:parseFloat(u.fiyat)||0
     };
    }

    masalar[masa].urunler[key].adet+=parseInt(u.adet)||0;

    masalar[masa].toplam+=
     (parseFloat(u.fiyat)||0)*
     (parseInt(u.adet)||0);
   });
  });

  masaGoster(masalar);
 });
}

function hesapOdendi(masa){

 if(!confirm(
  "Masa "+masa+" hesabı ödendi mi?\n\nMasa temizlenecek."
 ))return;

 db.ref("siparisler").once("value").then(snap=>{

  const data=snap.val()||{};
  const updates={};

  Object.keys(data).forEach(id=>{
   const s=data[id];

   if(
    s &&
    parseInt(s.masa)===masa &&
    s.durum==="onaylandi"
   ){
    updates[id]=null;
   }
  });

  if(!Object.keys(updates).length){
   alert("Ödenebilir hesap bulunamadı.");
   return;
  }

  istatistikKaydet(data,updates).then(()=>{
   return db.ref("siparisler").update(updates);
  }).then(()=>{
   acikMasa=null;
   alert("✅ Hesap ödendi. Masa temizlendi.");
  });
 });
}

async function istatistikKaydet(data,updates){

 const ref=db.ref("istatistikler");
 const snap=await ref.once("value");

 let stats=snap.val();

 const bugun=new Date().toLocaleDateString("tr-TR");

 if(!stats||stats.tarih!==bugun){
  stats={
   tarih:bugun,
   hasılat:0,
   odenenMasa:0,
   toplamUrun:0,
   urunler:{}
  };
 }

 Object.keys(updates).forEach(id=>{

  const s=data[id];
  if(!s)return;

  Object.values(s.urunler||{}).forEach(u=>{

   const adet=parseInt(u.adet)||0;
   const fiyat=parseFloat(u.fiyat)||0;
   const tutar=adet*fiyat;

   stats.hasılat+=tutar;
   stats.toplamUrun+=adet;

   const key=String(u.ad||"Ürün").toLowerCase();

   if(!stats.urunler[key]){
    stats.urunler[key]={
     ad:u.ad,
     adet:0,
     hasılat:0
    };
   }

   stats.urunler[key].adet+=adet;
   stats.urunler[key].hasılat+=tutar;
  });
 });

 stats.odenenMasa++;

 await ref.set(stats);
}

function urunleriDinle(){

 db.ref("urunler").on("value",snap=>{

  const data=snap.val()||{};
  const liste=document.getElementById("urunListesi");

  liste.innerHTML="";

  if(!Object.keys(data).length){
   liste.innerHTML="Henüz ürün yok.";
   return;
  }

  Object.keys(data).forEach(id=>{

   const u=data[id];

   liste.innerHTML+=`
   <div class="urun-card">

    <div>
     <b>${u.ad}</b><br>
     <small>${u.kategori||"Diğer"} • ${u.fiyat} TL</small>
    </div>

    <div>
     <button class="duzen"
      onclick="urunDuzenle('${id}','${String(u.ad).replace(/'/g,"\\'")}','${u.fiyat}')">
      ✏️
     </button>

     <button class="sil"
      onclick="urunSil('${id}')">
      🗑️
     </button>
    </div>

   </div>`;
  });
 });
}

function urunEkle(){

 const ad=document.getElementById("ad").value.trim();
 const fiyat=document.getElementById("fiyat").value;
 const kategori=document.getElementById("kategori").value;

 if(!ad||!fiyat){
  alert("Ürün adı ve fiyat girin.");
  return;
 }

 db.ref("urunler").push({
  ad:ad,
  fiyat:parseFloat(fiyat),
  kategori:kategori
 });

 document.getElementById("ad").value="";
 document.getElementById("fiyat").value="";
}

function urunDuzenle(id,ad,fiyat){

 const yeniAd=prompt("Ürün adı:",ad);
 if(yeniAd===null)return;

 const yeniFiyat=prompt("Fiyat:",fiyat);
 if(yeniFiyat===null)return;

 db.ref("urunler/"+id).update({
  ad:yeniAd.trim(),
  fiyat:parseFloat(yeniFiyat)
 });
}

function urunSil(id){
 if(confirm("Ürün silinsin mi?"))
  db.ref("urunler/"+id).remove();
}

function istatistikDinle(){

 db.ref("istatistikler").on("value",snap=>{

  const s=snap.val();
  const bugun=new Date().toLocaleDateString("tr-TR");

  if(!s||s.tarih!==bugun){
   document.getElementById("hasilat").innerText="0 TL";
   document.getElementById("odenen").innerText="0";
   document.getElementById("urunSayisi").innerText="0";
   document.getElementById("satisListesi").innerHTML="Bugün satış yok.";
   return;
  }

  document.getElementById("hasilat").innerText=
   (parseFloat(s.hasılat)||0).toFixed(2)+" TL";

  document.getElementById("odenen").innerText=
   parseInt(s.odenenMasa)||0;

  document.getElementById("urunSayisi").innerText=
   parseInt(s.toplamUrun)||0;

  let html="";

  Object.values(s.urunler||{})
  .sort((a,b)=>b.adet-a.adet)
  .forEach(u=>{
   html+=`
   <div class="satis-row">
    <span>${u.ad}</span>
    <b>${u.adet} adet • ${(parseFloat(u.hasılat)||0).toFixed(2)} TL</b>
   </div>`;
  });

  document.getElementById("satisListesi").innerHTML=
   html||"Bugün satış yok.";
 });
}

function istatistikSifirla(){

 if(prompt("Yönetici şifresi:")!==SIFRE){
  alert("❌ Hatalı şifre!");
  return;
 }

 if(!confirm("Bugünkü istatistikler sıfırlansın mı?"))return;

 db.ref("istatistikler").set({
  tarih:new Date().toLocaleDateString("tr-TR"),
  hasılat:0,
  odenenMasa:0,
  toplamUrun:0,
  urunler:{}
 });
}
</script>

</body>
</html>
