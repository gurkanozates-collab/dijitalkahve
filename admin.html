<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Dijital Kahvem</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f1ee;
color:#33231e;
padding-bottom:80px;
}

header{
background:#4e342e;
color:white;
padding:18px;
text-align:center;
position:sticky;
top:0;
z-index:1000;
box-shadow:0 2px 10px #0003;
}

header h1{
margin:0;
font-size:25px;
}

header p{
margin:6px 0 0;
font-size:14px;
opacity:.9;
}

.container{
max-width:900px;
margin:auto;
padding:12px;
}

/* =========================
DURUM
========================= */

.durum-kutu{
background:white;
border-radius:14px;
padding:15px;
margin-bottom:12px;
box-shadow:0 2px 8px #0001;
text-align:center;
}

.durum-kutu.acik{
border:2px solid #2e7d32;
}

.durum-kutu.kapali{
border:2px solid #c62828;
}

.durum-baslik{
font-size:20px;
font-weight:bold;
margin-bottom:5px;
}

.durum-acik{
color:#2e7d32;
}

.durum-kapali{
color:#c62828;
}

/* =========================
ANA MENÜ
========================= */

.nav{
position:sticky;
top:76px;
z-index:900;

display:grid;
grid-template-columns:repeat(3,1fr);

gap:6px;
padding:8px;

background:white;
box-shadow:0 2px 8px #0001;

margin-bottom:12px;
}

.nav button{
border:0;
border-radius:10px;
padding:13px 5px;
font-weight:bold;
font-size:14px;
background:#eee;
color:#333;
cursor:pointer;
}

.nav button.aktif{
background:#4e342e;
color:white;
}

/* =========================
PANELLER
========================= */

.panel{
display:none;
}

.panel.aktif{
display:block;
}

/* =========================
KATEGORİLER
========================= */

.kategori-bar{
display:flex;
gap:8px;
overflow-x:auto;
padding:4px 1px 12px;
scrollbar-width:none;
}

.kategori-bar::-webkit-scrollbar{
display:none;
}

.kategori-btn{
border:0;
background:white;
border-radius:20px;
padding:10px 16px;
white-space:nowrap;
font-weight:bold;
box-shadow:0 2px 6px #0001;
cursor:pointer;
}

.kategori-btn.aktif{
background:#4e342e;
color:white;
}

/* =========================
ÜRÜNLER
========================= */

.urun-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.urun{
background:white;
border-radius:14px;
padding:15px;
box-shadow:0 2px 8px #0001;
}

.urun h3{
margin:0 0 7px;
font-size:18px;
}

.urun-kategori{
font-size:12px;
color:#888;
margin-bottom:12px;
}

.urun-alt{
display:flex;
justify-content:space-between;
align-items:center;
gap:8px;
}

.fiyat{
font-size:19px;
font-weight:bold;
color:#4e342e;
}

.adet{
display:flex;
align-items:center;
gap:7px;
}

.adet button{
width:34px;
height:34px;
border:0;
border-radius:50%;
font-size:20px;
font-weight:bold;
cursor:pointer;
background:#4e342e;
color:white;
}

.adet span{
min-width:22px;
text-align:center;
font-weight:bold;
}

/* =========================
SEPET
========================= */

.sepet-kutu{
background:white;
border-radius:14px;
padding:15px;
margin-top:14px;
box-shadow:0 2px 8px #0001;
}

.sepet-satir{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
padding:10px 0;
border-bottom:1px solid #eee;
}

.sepet-urun{
font-weight:bold;
}

.sepet-detay{
font-size:13px;
color:#777;
margin-top:4px;
}

.sepet-sil{
border:0;
background:#ffebee;
color:#c62828;
border-radius:8px;
padding:7px;
cursor:pointer;
}

.sepet-toplam{
display:flex;
justify-content:space-between;
font-size:21px;
font-weight:bold;
padding-top:15px;
}

.siparis-btn{
width:100%;
margin-top:15px;
border:0;
background:#2e7d32;
color:white;
padding:15px;
border-radius:10px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.siparis-btn:disabled{
background:#aaa;
cursor:not-allowed;
}

/* =========================
HESAP
========================= */

.hesap-kutu{
background:white;
border-radius:14px;
padding:16px;
box-shadow:0 2px 8px #0001;
}

.hesap-baslik{
font-size:20px;
font-weight:bold;
margin-bottom:12px;
}

.hesap-satir{
padding:11px 0;
border-bottom:1px solid #eee;
}

.hesap-urun{
display:flex;
justify-content:space-between;
gap:10px;
}

.hesap-durum{
font-size:12px;
margin-top:5px;
}

.hesap-durum.onayli{
color:#2e7d32;
}

.hesap-durum.bekleyen{
color:#ef6c00;
}

.hesap-toplam{
margin-top:15px;
padding-top:15px;
border-top:2px solid #ddd;
font-size:24px;
font-weight:bold;
display:flex;
justify-content:space-between;
}

.bekleyen-bilgi{
margin-top:12px;
background:#fff8e1;
color:#ef6c00;
border-radius:10px;
padding:12px;
font-size:13px;
}

/* =========================
YAZ BOZ
========================= */

.yazboz-kutu{
background:white;
border-radius:14px;
padding:16px;
box-shadow:0 2px 8px #0001;
}

.yazboz-aciklama{
color:#777;
font-size:14px;
margin-bottom:10px;
}

textarea{
width:100%;
min-height:400px;
resize:vertical;
border:1px solid #ccc;
border-radius:10px;
padding:15px;
font-size:16px;
font-family:Arial,sans-serif;
outline:none;
}

textarea:focus{
border-color:#4e342e;
}

.yazboz-temizle{
margin-top:10px;
border:0;
background:#eee;
padding:11px 15px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

/* =========================
BOŞ
========================= */

.bos{
background:white;
border-radius:14px;
padding:35px 20px;
text-align:center;
color:#777;
box-shadow:0 2px 8px #0001;
}

/* =========================
YÜKLENİYOR
========================= */

.yukleniyor{
padding:35px;
text-align:center;
color:#777;
}

/* =========================
ALT SEPET
========================= */

.alt-sepet{
position:fixed;
bottom:0;
left:0;
right:0;
background:white;
padding:10px;
box-shadow:0 -2px 10px #0002;
z-index:1200;
}

.alt-sepet-icerik{
max-width:900px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.alt-sepet-bilgi{
font-weight:bold;
}

.alt-sepet button{
border:0;
background:#4e342e;
color:white;
padding:12px 18px;
border-radius:9px;
font-weight:bold;
cursor:pointer;
}

/* =========================
MOBİL
========================= */

@media(max-width:600px){

header h1{
font-size:22px;
}

.nav{
top:70px;
}

.urun-grid{
grid-template-columns:1fr;
}

.urun h3{
font-size:17px;
}

.alt-sepet-icerik{
font-size:14px;
}

}

</style>

</head>

<body>

<header>

<h1>☕ DİJİTAL KAHVEM</h1>

<p id="masaBaslik">
Masa kontrol ediliyor...
</p>

</header>


<div class="container">


<!-- =========================
MASA DURUMU
========================= -->

<div
id="durumKutu"
class="durum-kutu">

<div
id="durumBaslik"
class="durum-baslik">

⏳ Masa kontrol ediliyor...

</div>

<div
id="durumAciklama">

Lütfen bekleyin.

</div>

</div>


<!-- =========================
ANA NAV
========================= -->

<div class="nav">

<button
class="aktif"
onclick="panelAc('menuPanel',this)">

☕ Menü

</button>

<button
onclick="panelAc('hesapPanel',this)">

🧾 Hesap

</button>

<button
onclick="panelAc('yazbozPanel',this)">

📝 Yaz-Boz

</button>

</div>


<!-- =========================
MENÜ PANELİ
========================= -->

<section
id="menuPanel"
class="panel aktif">


<div
id="kategoriBar"
class="kategori-bar">

</div>


<div
id="menuAlan"
class="urun-grid">

<div class="yukleniyor">

☕ Menü yükleniyor...

</div>

</div>


<!-- SEPET -->

<div
id="sepetKutu"
class="sepet-kutu">

<h3>
🛒 Siparişiniz
</h3>

<div
id="sepetAlan">

<div class="bos">

Henüz ürün eklenmedi.

</div>

</div>

</div>

</section>


<!-- =========================
HESAP
========================= -->

<section
id="hesapPanel"
class="panel">

<div
id="hesapAlan"
class="hesap-kutu">

<div class="yukleniyor">

🧾 Hesap yükleniyor...

</div>

</div>

</section>


<!-- =========================
YAZ BOZ
========================= -->

<section
id="yazbozPanel"
class="panel">

<div class="yazboz-kutu">

<h2>
📝 Yaz-Boz
</h2>

<div class="yazboz-aciklama">

Buraya notlarınızı yazabilirsiniz.
Bu bölüm sipariş ve hesap sisteminden bağımsızdır.

</div>

<textarea
id="yazboz"
placeholder="Notunuzu buraya yazın..."></textarea>

<button
class="yazboz-temizle"
onclick="yazbozTemizle()">

🗑️ Yaz-Bozu Temizle

</button>

</div>

</section>

</div>


<!-- =========================
ALT SEPET
========================= -->

<div class="alt-sepet">

<div class="alt-sepet-icerik">

<div
id="altSepetBilgi"
class="alt-sepet-bilgi">

🛒 Sepet boş

</div>

<button
onclick="menuPanelineGit()">

Siparişe Git →

</button>

</div>

</div>


<script type="module">


/* =====================================================
FIREBASE
===================================================== */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
getFirestore,
collection,
doc,
addDoc,
onSnapshot,
query,
where,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

apiKey:
"AIzaSyC05yXQzAlF2AYzzeaJrDdMUYKwohKOsWM",

authDomain:
"dijitalkahve-67f0a.firebaseapp.com",

databaseURL:
"https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app",

projectId:
"dijitalkahve-67f0a",

storageBucket:
"dijitalkahve-67f0a.firebasestorage.app",

messagingSenderId:
"326476599239",

appId:
"1:326476599239:web:143f39583a3478118853e2",

measurementId:
"G-WM65PC4648"

};


const app =
initializeApp(firebaseConfig);


const db =
getFirestore(app);


/* =====================================================
DEĞİŞKENLER
===================================================== */

let menu = [];

let kategoriler = [];

let seciliKategori = "Tümü";

let sepet = [];

let siparisler = [];

let oturumlar = [];

let aktifOturum = null;


/* =====================================================
MASA NUMARASI
===================================================== */

const urlParams =
new URLSearchParams(
window.location.search
);


let masa =
Number(
urlParams.get("masa")
);


/*
QR adresi şöyle olabilir:

index.html?masa=1

index.html?masa=12

index.html?masa=25
*/


if(!masa || masa < 1){

masa = 0;

}


document.getElementById(
"masaBaslik"
).textContent =
masa
?
"🪑 Masa " + masa
:
"🪑 Masa bilgisi yok";


/* =====================================================
LOCAL YAZ-BOZ
===================================================== */

const yazboz =
document.getElementById("yazboz");


const kayitliNot =
localStorage.getItem(
"dijitalKahvem_yazboz"
);


if(yazboz && kayitliNot){

yazboz.value =
kayitliNot;

}


if(yazboz){

yazboz.addEventListener(
"input",
function(){

localStorage.setItem(
"dijitalKahvem_yazboz",
yazboz.value
);

}
);

}


window.yazbozTemizle =
function(){

if(
confirm(
"Yaz-Boz temizlensin mi?"
)
){

yazboz.value = "";

localStorage.removeItem(
"dijitalKahvem_yazboz"
);

}

};


/* =====================================================
PANEL
===================================================== */

window.panelAc =
function(id,button){

document
.querySelectorAll(".panel")
.forEach(
function(panel){

panel.classList.remove(
"aktif"
);

}
);


const hedef =
document.getElementById(id);


if(hedef){

hedef.classList.add(
"aktif"
);

}


document
.querySelectorAll(".nav button")
.forEach(
function(btn){

btn.classList.remove(
"aktif"
);

}
);


if(button){

button.classList.add(
"aktif"
);

}


if(id === "hesapPanel"){

hesapGoster();

}

};


/* =====================================================
PARA
===================================================== */

function para(sayi){

return Number(
sayi || 0
).toLocaleString(
"tr-TR"
) + " ₺";

}


/* =====================================================
MASA OTURUMU KONTROL
===================================================== */

function oturumKontrol(){

if(!masa){

aktifOturum = null;

durumGoster();

return;

}


aktifOturum =
oturumlar.find(
function(o){

return Number(o.masa) === masa &&
o.durum === "acik";

}
)
|| null;


durumGoster();

menuGoster();

sepetGoster();

hesapGoster();

}


/* =====================================================
DURUM GÖSTER
===================================================== */

function durumGoster(){

const kutu =
document.getElementById(
"durumKutu"
);

const baslik =
document.getElementById(
"durumBaslik"
);

const aciklama =
document.getElementById(
"durumAciklama"
);


if(!masa){

kutu.className =
"durum-kutu kapali";

baslik.className =
"durum-baslik durum-kapali";

baslik.textContent =
"❌ Masa bilgisi bulunamadı";

aciklama.textContent =
"QR kodu masa bilgisi içermiyor.";

return;

}


if(!aktifOturum){

kutu.className =
"durum-kutu kapali";

baslik.className =
"durum-baslik durum-kapali";

baslik.textContent =
"🔴 Masa şu anda kapalı";

aciklama.textContent =
"Garson masa oturumunu açtığında sipariş verebilirsiniz.";

return;

}


kutu.className =
"durum-kutu acik";

baslik.className =
"durum-baslik durum-acik";

baslik.textContent =
"🟢 Masa açık";

aciklama.textContent =
"Masa " +
masa +
" için sipariş verebilirsiniz.";

}


/* =====================================================
KATEGORİLER
===================================================== */

function kategoriGoster(){

const alan =
document.getElementById(
"kategoriBar"
);


alan.innerHTML = "";


const tum =
document.createElement(
"button"
);


tum.className =
"kategori-btn" +
(
seciliKategori === "Tümü"
?
" aktif"
:
""
);


tum.textContent =
"☕ Tümü";


tum.onclick =
function(){

seciliKategori =
"Tümü";

kategoriGoster();

menuGoster();

};


alan.appendChild(tum);


kategoriler
.slice()
.sort(
function(a,b){

return String(
a.ad || ""
).localeCompare(
String(b.ad || ""),
"tr"
);

}
)
.forEach(
function(k){

const btn =
document.createElement(
"button"
);


btn.className =
"kategori-btn" +
(
seciliKategori === k.ad
?
" aktif"
:
""
);


btn.textContent =
k.ad;


btn.onclick =
function(){

seciliKategori =
k.ad;

kategoriGoster();

menuGoster();

};


alan.appendChild(btn);

}
);

}


/* =====================================================
MENÜ
===================================================== */

function menuGoster(){

const alan =
document.getElementById(
"menuAlan"
);


alan.innerHTML = "";


if(!aktifOturum){

alan.innerHTML = `

<div class="bos">

🔴 Masa henüz açılmadı.

<br><br>

Garson masa oturumunu açtığında
menüden sipariş verebilirsiniz.

</div>

`;

return;

}


let liste =
menu.filter(
function(u){

return u.aktif !== false;

}
);


if(seciliKategori !== "Tümü"){

liste =
liste.filter(
function(u){

return String(
u.kategori || ""
) ===
String(
seciliKategori
);

}
);

}


if(!liste.length){

alan.innerHTML = `

<div class="bos">

☕ Bu kategoride ürün bulunmuyor.

</div>

`;

return;

}


liste.forEach(
function(u){

const adet =
sepetAdet(u.id);


const kart =
document.createElement(
"div"
);


kart.className =
"urun";


kart.innerHTML = `

<h3>
${escapeHTML(u.ad || "")}
</h3>

<div class="urun-kategori">

${escapeHTML(
u.kategori || "Kategorisiz"
)}

</div>

<div class="urun-alt">

<div class="fiyat">

${para(u.fiyat)}

</div>

<div class="adet">

<button
onclick="adetAzalt('${u.id}')">

−

</button>

<span
id="adet-${u.id}">

${adet}

</span>

<button
onclick="adetArtir('${u.id}')">

+

</button>

</div>

</div>

`;


alan.appendChild(kart);

}
);

}


/* =====================================================
HTML GÜVENLİK
===================================================== */

function escapeHTML(value){

return String(
value || ""
)
.replace(
/&/g,
"&amp;"
)
.replace(
/</g,
"&lt;"
)
.replace(
/>/g,
"&gt;"
)
.replace(
/"/g,
"&quot;"
)
.replace(
/'/g,
"&#039;"
);

}


/* =====================================================
SEPET ADET
===================================================== */

function sepetAdet(id){

const item =
sepet.find(
function(x){

return x.id === id;

}
);


return item
?
item.adet
:
0;

}


/* =====================================================
ÜRÜN ARTIR
===================================================== */

window.adetArtir =
function(id){

if(!aktifOturum){

alert(
"🔴 Önce garsonun masa oturumunu açması gerekiyor."
);

return;

}


const urun =
menu.find(
function(u){

return u.id === id;

}
);


if(!urun){

return;

}


const mevcut =
sepet.find(
function(x){

return x.id === id;

}
);


if(mevcut){

mevcut.adet++;

}
else{

sepet.push({

id:urun.id,

urun:urun.ad,

fiyat:Number(
urun.fiyat || 0
),

adet:1

});

}


sepetGoster();

menuGoster();

};


/* =====================================================
ÜRÜN AZALT
===================================================== */

window.adetAzalt =
function(id){

const item =
sepet.find(
function(x){

return x.id === id;

}
);


if(!item){

return;

}


item.adet--;


if(item.adet <= 0){

sepet =
sepet.filter(
function(x){

return x.id !== id;

}
);

}


sepetGoster();

menuGoster();

};


/* =====================================================
SEPET
===================================================== */

function sepetGoster(){

const alan =
document.getElementById(
"sepetAlan"
);


const altBilgi =
document.getElementById(
"altSepetBilgi"
);


if(!sepet.length){

alan.innerHTML = `

<div class="bos">

Henüz ürün eklenmedi.

</div>

`;

altBilgi.textContent =
"🛒 Sepet boş";

return;

}


let toplam = 0;

let adetToplam = 0;


alan.innerHTML = "";


sepet.forEach(
function(item){

const satirToplam =
Number(item.fiyat) *
Number(item.adet);


toplam +=
satirToplam;


adetToplam +=
Number(item.adet);


const div =
document.createElement(
"div"
);


div.className =
"sepet-satir";


div.innerHTML = `

<div>

<div class="sepet-urun">

${escapeHTML(item.urun)}

</div>

<div class="sepet-detay">

${item.adet} adet ×
${para(item.fiyat)}

</div>

</div>

<div>

<b>
${para(satirToplam)}
</b>

<button
class="sepet-sil"
onclick="sepettenSil('${item.id}')">

🗑️

</button>

</div>

`;


alan.appendChild(div);

}
);


const toplamDiv =
document.createElement(
"div"
);


toplamDiv.className =
"sepet-toplam";


toplamDiv.innerHTML = `

<span>
Toplam
</span>

<span>
${para(toplam)}
</span>

`;


alan.appendChild(
toplamDiv
);


const btn =
document.createElement(
"button"
);


btn.className =
"siparis-btn";


btn.textContent =
"📤 Siparişi Garsona Gönder";


btn.onclick =
siparisGonder;


alan.appendChild(btn);


altBilgi.textContent =
"🛒 " +
adetToplam +
" ürün • " +
para(toplam);

}


/* =====================================================
SEPETTEN SİL
===================================================== */

window.sepettenSil =
function(id){

sepet =
sepet.filter(
function(x){

return x.id !== id;

}
);


sepetGoster();

menuGoster();

};


/* =====================================================
SİPARİŞ GÖNDER
===================================================== */

async function siparisGonder(){

if(!aktifOturum){

alert(
"🔴 Masa oturumu açık değil."
);

return;

}


if(!sepet.length){

alert(
"Sepet boş."
);

return;

}


const toplam =
sepet.reduce(
function(a,item){

return a +
Number(item.fiyat || 0) *
Number(item.adet || 0);

},
0
);


const urunler =
sepet.map(
function(item){

return {

urun:item.urun,

fiyat:Number(
item.fiyat || 0
),

adet:Number(
item.adet || 0
),

toplam:
Number(item.fiyat || 0) *
Number(item.adet || 0)

};

}
);


const onay =
confirm(
"Sipariş garsona gönderilsin mi?\n\n" +
"Toplam: " +
para(toplam)
);


if(!onay){

return;

}


try{

await addDoc(
collection(
db,
"siparisler"
),
{

masa:masa,

oturumId:
aktifOturum.id,

urunler:
urunler,

toplam:
toplam,

durum:
"Bekleyen",

zaman:
serverTimestamp(),

olusturmaZamani:
serverTimestamp()

}
);


sepet = [];


sepetGoster();

menuGoster();

hesapGoster();


alert(
"✅ Sipariş garsona gönderildi.\n\n" +
"Garson onayladığında hesaba eklenecektir."
);

}
catch(error){

console.error(error);


alert(
"❌ Sipariş gönderilemedi:\n\n" +
error.message
);

}

}


/* =====================================================
HESAP
===================================================== */

function hesapGoster(){

const alan =
document.getElementById(
"hesapAlan"
);


if(!aktifOturum){

alan.innerHTML = `

<div class="bos">

🔴 Masa kapalı.

<br><br>

Garson masa oturumunu açtığında
hesap burada görünecektir.

</div>

`;

return;

}


const liste =
siparisler.filter(
function(s){

return s.oturumId ===
aktifOturum.id;

}
);


if(!liste.length){

alan.innerHTML = `

<div class="hesap-baslik">

🧾 Hesabınız

</div>

<div class="bos">

Henüz sipariş bulunmuyor.

</div>

`;

return;

}


let onayliToplam = 0;

let bekleyenToplam = 0;


let html = `

<div class="hesap-baslik">

🧾 Masa ${masa} Hesabı

</div>

`;


liste.forEach(
function(s){

const urunler =
s.urunler || [];


urunler.forEach(
function(u){

const satirToplam =
Number(
u.toplam ||
(
Number(u.fiyat || 0) *
Number(u.adet || 0)
)
);


if(
s.durum ===
"Onaylandı"
){

onayliToplam +=
satirToplam;

}
else if(
s.durum ===
"Bekleyen"
){

bekleyenToplam +=
satirToplam;

}


const onayli =
s.durum ===
"Onaylandı";


html += `

<div class="hesap-satir">

<div class="hesap-urun">

<span>

${escapeHTML(
u.urun || ""
)}

 × ${Number(
u.adet || 0
)}

</span>

<b>

${para(
satirToplam
)}

</b>

</div>

<div class="
hesap-durum
${onayli ? "onayli" : "bekleyen"}
">

${
onayli
?
"🟢 Onaylandı — Hesaba dahil"
:
"🟡 Bekliyor — Garson onayı bekleniyor"
}

</div>

</div>

`;

}
);

}
);


html += `

<div class="hesap-toplam">

<span>
Hesap
</span>

<span>
${para(onayliToplam)}
</span>

</div>

`;


if(bekleyenToplam > 0){

html += `

<div class="bekleyen-bilgi">

🟡 Bekleyen siparişler:
<b>
${para(bekleyenToplam)}
</b>

<br><br>

Garson siparişi onayladığında
hesaba dahil edilecektir.

</div>

`;

}


alan.innerHTML =
html;

}
