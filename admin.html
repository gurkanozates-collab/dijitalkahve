<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Dijital Kahvem - Garson Paneli</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f1ee;
    color:#33231e;
}

header{
    background:#4e342e;
    color:#fff;
    padding:18px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:28px;
}

header p{
    margin:6px 0 0;
}

.topbar{
    position:sticky;
    top:0;
    z-index:100;
    background:#fff;
    padding:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 2px 8px #0002;
}

.connection{
    font-weight:bold;
}

.refresh{
    border:0;
    background:#1565c0;
    color:#fff;
    padding:10px 15px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.container{
    max-width:1500px;
    margin:auto;
    padding:15px;
}

.title{
    margin-bottom:15px;
}

.title h2{
    margin:0 0 5px;
}

.title p{
    margin:0;
    color:#777;
}

.masa-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:14px;
}

.masa{
    background:#fff;
    border:2px solid #ddd;
    border-radius:14px;
    padding:14px;
    box-shadow:0 2px 8px #0001;
}

.masa.bekleyen{
    border-color:#ef6c00;
    box-shadow:0 0 0 3px #ef6c0020;
}

.masa.acik{
    border-color:#2e7d32;
}

.masa.yeni{
    order:-1;
}

.masa-baslik{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
}

.masa-baslik h3{
    margin:0;
    font-size:21px;
}

.durum{
    padding:6px 9px;
    border-radius:15px;
    background:#eee;
    color:#777;
    font-size:12px;
    font-weight:bold;
}

.durum.bekleyen{
    background:#fff3cd;
    color:#ef6c00;
}

.durum.acik{
    background:#e8f5e9;
    color:#2e7d32;
}

.durum.kapali{
    background:#eee;
    color:#777;
}

.masa-butonlari{
    display:grid;
    grid-template-columns:1fr;
    gap:7px;
}

.garson-btn,
.ac-btn,
.kapat-btn{
    width:100%;
    border:0;
    color:#fff;
    padding:12px 10px;
    border-radius:9px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

.garson-btn{
    background:#6d4c41;
}

.garson-btn:hover{
    background:#4e342e;
}

.ac-btn{
    background:#2e7d32;
}

.kapat-btn{
    background:#c62828;
}

.oturum-bilgi{
    background:#e8f5e9;
    color:#2e7d32;
    padding:9px;
    border-radius:8px;
    margin-bottom:9px;
    text-align:center;
    font-size:13px;
    font-weight:bold;
}

.oturum-kapali{
    background:#ffebee;
    color:#c62828;
    padding:10px;
    border-radius:8px;
    margin-top:10px;
    text-align:center;
    font-size:13px;
    font-weight:bold;
}

.siparis{
    margin-top:12px;
    padding:11px;
    background:#fffaf5;
    border:1px solid #ddd;
    border-left:5px solid #ef6c00;
    border-radius:9px;
}

.siparis.garson{
    border-left-color:#1565c0;
    background:#f5f9ff;
}

.siparis-baslik{
    display:flex;
    justify-content:space-between;
    gap:5px;
    margin-bottom:7px;
}

.siparis-no{
    font-weight:bold;
}

.siparis-durum{
    color:#ef6c00;
    font-size:12px;
    font-weight:bold;
}

.kaynak{
    display:inline-block;
    padding:5px 8px;
    border-radius:12px;
    background:#e3f2fd;
    color:#1565c0;
    font-size:11px;
    font-weight:bold;
    margin-bottom:6px;
}

.kaynak.musteri{
    background:#f3e5f5;
    color:#7b1fa2;
}

.zaman{
    color:#777;
    font-size:12px;
    margin-bottom:7px;
}

.urun{
    display:flex;
    justify-content:space-between;
    padding:5px 0;
    border-bottom:1px solid #eee;
}

.toplam{
    text-align:right;
    margin-top:8px;
    font-weight:bold;
    font-size:17px;
}

.butons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    margin-top:10px;
}

.btn{
    border:0;
    border-radius:8px;
    padding:10px;
    font-weight:bold;
    cursor:pointer;
}

.duzenle{
    background:#ffb300;
}

.onayla{
    background:#2e7d32;
    color:#fff;
}

.iptal{
    background:#c62828;
    color:#fff;
}

.duzenleme{
    display:none;
    margin-top:10px;
    padding:10px;
    background:#f8f8f8;
    border-radius:8px;
}

.duzenleme.acik{
    display:block;
}

.duzen-satir{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 0;
    border-bottom:1px solid #ddd;
}

.duzen-adet{
    display:flex;
    align-items:center;
    gap:7px;
}

.duzen-adet button{
    width:36px;
    height:36px;
    border:0;
    border-radius:8px;
    background:#ddd;
    font-size:21px;
    font-weight:bold;
    cursor:pointer;
}

.duzen-adet span{
    width:30px;
    text-align:center;
    font-size:18px;
    font-weight:bold;
}

.kaydet{
    width:100%;
    margin-top:10px;
    border:0;
    padding:11px;
    border-radius:8px;
    background:#1565c0;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}


/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:1000;
    background:#0008;
    overflow-y:auto;
    padding:20px;
}

.modal.acik{
    display:block;
}

.modal-kutu{
    max-width:650px;
    margin:20px auto;
    background:white;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 20px 60px #0007;
}

.modal-header{
    background:#4e342e;
    color:white;
    padding:16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.modal-header h2{
    margin:0;
}

.kapat{
    background:transparent;
    color:white;
    border:0;
    font-size:28px;
    cursor:pointer;
}

.menu{
    padding:15px;
}

.menu-urun{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:13px 4px;
    border-bottom:1px solid #e5e0dc;
}

.menu-bilgi{
    flex:1;
}

.menu-ad{
    font-size:18px;
    font-weight:bold;
}

.menu-fiyat{
    margin-top:4px;
    color:#777;
}

.adet{
    display:flex;
    align-items:center;
    gap:8px;
}

.adet button{
    width:42px;
    height:42px;
    border:0;
    border-radius:9px;
    background:#ddd;
    font-size:24px;
    font-weight:bold;
    cursor:pointer;
}

.adet span{
    width:32px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
}

.menu-alt{
    padding:15px;
    border-top:1px solid #ddd;
    background:#faf8f6;
}

.menu-toplam{
    display:flex;
    justify-content:space-between;
    font-size:22px;
    font-weight:bold;
    margin-bottom:12px;
}

.gonder{
    width:100%;
    border:0;
    border-radius:10px;
    background:#2e7d32;
    color:white;
    padding:15px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

@media(max-width:1100px){
    .masa-grid{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:750px){
    .masa-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:520px){
    .masa-grid{
        grid-template-columns:1fr;
    }

    .modal{
        padding:8px;
    }

    .modal-kutu{
        margin:5px auto;
    }
}
</style>
</head>

<body>

<header>
    <h1>☕ DİJİTAL KAHVEM</h1>
    <p>Garson Paneli</p>
</header>

<div class="topbar">

    <div id="baglanti" class="connection">
        🟡 Firebase bağlanıyor...
    </div>

    <button
        class="refresh"
        onclick="location.reload()">
        🔄 Yenile
    </button>

</div>

<div class="container">

    <div class="title">

        <h2>🪑 Masalar</h2>

        <p id="bilgi">
            Masalar yükleniyor...
        </p>

    </div>

    <div id="masaGrid" class="masa-grid"></div>

</div>


<!-- GARSON MENÜ -->

<div id="menuModal" class="modal">

    <div class="modal-kutu">

        <div class="modal-header">

            <h2 id="modalBaslik">
                👨‍🍳 Garson Siparişi
            </h2>

            <button
                class="kapat"
                onclick="menuKapat()">
                ×
            </button>

        </div>

        <div id="menu" class="menu"></div>

        <div class="menu-alt">

            <div class="menu-toplam">

                <span>Toplam</span>

                <span id="menuToplam">
                    0 ₺
                </span>

            </div>

            <button
                id="gonderBtn"
                class="gonder"
                onclick="garsonSiparisGonder()">

                🛎️ Garson Siparişini Gönder

            </button>

        </div>

    </div>

</div>


<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getFirestore,
    collection,
    query,
    onSnapshot,
    addDoc,
    updateDoc,
    doc,
    serverTimestamp,
    where,
    getDocs
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyC05yXQzAlF2AYzzeaJrDdMUYKwohKOsWM",

    authDomain:
    "dijitalkahve-67f0a.firebaseapp.com",

    databaseURL:
    "https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
    "dijitalkahve-67f0a",

    storageBucket:
    "dijitalkahve-67f0a.firebasestorage.app",

    messagingSenderId:
    "326476599239",

    appId:
    "1:326476599239:web:143f39583a3478118853e2",

    measurementId:
    "G-WM65PC4648"

};


const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);


/* =========================
   MENÜ
========================= */

const urunler = [

    {
        ad:"Çay",
        fiyat:25
    },

    {
        ad:"Nescafe",
        fiyat:60
    },

    {
        ad:"Türk Kahvesi",
        fiyat:70
    },

    {
        ad:"Su",
        fiyat:15
    },

    {
        ad:"Kola",
        fiyat:50
    },

    {
        ad:"Fanta",
        fiyat:50
    },

    {
        ad:"Tost",
        fiyat:100
    }

];


let seciliMasa = null;
let seciliOturumId = null;

let sepet = {};

let siparisler = [];

let oturumlar = {};

let duzenSepet = {};


/* =========================
   SEPET SIFIRLA
========================= */

function sepetSifirla(){

    sepet = {};

    urunler.forEach(
        urun => {

            sepet[urun.ad] = 0;

        }
    );

}


/* =========================
   AÇIK OTURUM BUL
========================= */

function acikOturumBul(masa){

    const masaNo =
        String(masa);

    const bulunan =
        Object.entries(oturumlar)
        .find(
            ([id,oturum]) => {

                return (
                    String(oturum.masa) === masaNo &&
                    oturum.durum === "acik"
                );

            }
        );

    if(!bulunan){

        return null;

    }

    return {

        id:bulunan[0],

        ...bulunan[1]

    };

}


/* =========================
   MASA OTURUMU AÇ
========================= */

window.masaOturumuAc =
async function(masa){

    const mevcut =
        acikOturumBul(masa);

    if(mevcut){

        alert(
            "🟢 Masa " +
            masa +
            " zaten açık."
        );

        return;

    }

    try{

        await addDoc(

            collection(
                db,
                "oturumlar"
            ),

            {

                masa:
                    Number(masa),

                durum:
                    "acik",

                odemeDurumu:
                    "bekliyor",

                acilisZamani:
                    serverTimestamp()

            }

        );

        alert(
            "✅ Masa " +
            masa +
            " açıldı.\n\n" +
            "Artık müşteri QR kodunu okutabilir."
        );

    }
    catch(error){

        console.error(error);

        alert(
            "❌ Masa açılamadı.\n\n" +
            error.message
        );

    }

};


/* =========================
   MASA OTURUMU KAPAT
========================= */

window.masaOturumuKapat =
async function(id,masa){

    if(
        !confirm(
            "Masa " +
            masa +
            " oturumu kapatılsın mı?"
        )
    ){

        return;

    }

    try{

        await updateDoc(

            doc(
                db,
                "oturumlar",
                id
            ),

            {

                durum:
                    "kapali",

                kapanisZamani:
                    serverTimestamp()

            }

        );

        alert(
            "✅ Masa " +
            masa +
            " oturumu kapatıldı."
        );

    }
    catch(error){

        console.error(error);

        alert(
            "❌ Oturum kapatılamadı.\n\n" +
            error.message
        );

    }

};


/* =========================
   GARSON MENÜSÜ
========================= */

window.garsonMenusuAc =
function(masa){

    const oturum =
        acikOturumBul(masa);


    if(!oturum){

        alert(
            "⚠️ Önce bu masanın oturumunu açmalısın."
        );

        return;

    }


    seciliMasa =
        masa;

    seciliOturumId =
        oturum.id;


    sepetSifirla();


    document.getElementById(
        "modalBaslik"
    ).textContent =
        "👨‍🍳 Garson Siparişi - Masa " +
        masa;


    menuOlustur();


    document.getElementById(
        "menuModal"
    ).classList.add("acik");

};


/* =========================
   MENÜ KAPAT
========================= */

window.menuKapat =
function(){

    document.getElementById(
        "menuModal"
    ).classList.remove("acik");

    seciliMasa = null;

    seciliOturumId = null;

};


/* =========================
   MENÜ OLUŞTUR
========================= */

function menuOlustur(){

    const menu =
        document.getElementById("menu");

    menu.innerHTML = "";

    urunler.forEach(
        (urun,index) => {

            menu.innerHTML += `

                <div class="menu-urun">

                    <div class="menu-bilgi">

                        <div class="menu-ad">
                            ${urun.ad}
                        </div>

                        <div class="menu-fiyat">
                            ${urun.fiyat} ₺
                        </div>

                    </div>

                    <div class="adet">

                        <button
                            onclick="
                                adetDegistir(
                                    ${index},
                                    -1
                                )
                            ">
                            −
                        </button>

                        <span id="adet-${index}">
                            0
                        </span>

                        <button
                            onclick="
                                adetDegistir(
                                    ${index},
                                    1
                                )
                            ">
                            +
                        </button>

                    </div>

                </div>

            `;

        }
    );

    toplamGuncelle();

}


/* =========================
   ADET
========================= */

window.adetDegistir =
function(index,miktar){

    const urun =
        urunler[index];

    sepet[urun.ad] =
        Math.max(
            0,
            (sepet[urun.ad] || 0) +
            miktar
        );

    const el =
        document.getElementById(
            "adet-"+index
        );

    if(el){

        el.textContent =
            sepet[urun.ad];

    }

    toplamGuncelle();

};


/* =========================
   TOPLAM
========================= */

function toplamHesapla(){

    let toplam = 0;

    urunler.forEach(
        urun => {

            toplam +=
                (sepet[urun.ad] || 0) *
                urun.fiyat;

        }
    );

    return toplam;

}


function toplamGuncelle(){

    document.getElementById(
        "menuToplam"
    ).textContent =
        toplamHesapla() +
        " ₺";

}


/* =========================
   GARSON SİPARİŞİ GÖNDER
========================= */

window.garsonSiparisGonder =
async function(){

    if(!seciliMasa){

        return;

    }


    const oturum =
        acikOturumBul(
            seciliMasa
        );


    if(
        !oturum ||
        oturum.id !== seciliOturumId
    ){

        alert(
            "❌ Masa oturumu kapanmış."
        );

        menuKapat();

        return;

    }


    const secilenUrunler = [];


    urunler.forEach(
        urun => {

            const adet =
                Number(
                    sepet[urun.ad] || 0
                );

            if(adet > 0){

                secilenUrunler.push({

                    urun:
                        urun.ad,

                    adet:
                        adet,

                    fiyat:
                        urun.fiyat,

                    tutar:
                        adet * urun.fiyat

                });

            }

        }
    );


    if(
        secilenUrunler.length === 0
    ){

        alert(
            "⚠️ Önce ürün seçmelisin."
        );

        return;

    }


    const toplam =
        secilenUrunler.reduce(
            (a,b) =>
                a + b.tutar,
            0
        );


    const buton =
        document.getElementById(
            "gonderBtn"
        );


    buton.disabled = true;

    buton.textContent =
        "⏳ Gönderiliyor...";


    try{

        await addDoc(

            collection(
                db,
                "siparisler"
            ),

            {

                masa:
                    String(seciliMasa),

                oturumId:
                    seciliOturumId,

                urunler:
                    secilenUrunler,

                toplam:
                    toplam,

                durum:
                    "Bekleyen",

                kaynak:
                    "garson",

                garsonSiparisi:
                    true,

                olusturmaZamani:
                    serverTimestamp()

            }

        );


        alert(
            "✅ Masa " +
            seciliMasa +
            " siparişi gönderildi."
        );


        menuKapat();

    }
    catch(error){

        console.error(error);

        alert(
            "❌ Sipariş gönderilemedi.\n\n" +
            error.message
        );

    }
    finally{

        buton.disabled = false;

        buton.textContent =
            "🛎️ Garson Siparişini Gönder";

    }

};


/* =========================
   ZAMAN
========================= */

function zaman(s){

    if(
        s.olusturmaZamani &&
        typeof
        s.olusturmaZamani.toMillis ===
        "function"
    ){

        return s.olusturmaZamani.toMillis();

    }

    return 0;

}


function saat(s){

    if(
        s.olusturmaZamani &&
        typeof
        s.olusturmaZamani.toDate ===
        "function"
    ){

        return s.olusturmaZamani
            .toDate()
            .toLocaleTimeString(
                "tr-TR",
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            );

    }

    return "--:--";

}


/* =========================
   SİPARİŞ HTML
========================= */

function siparisHTML(s,index){

    let html = "";


    (s.urunler || [])
    .forEach(
        u => {

            html += `

                <div class="urun">

                    <span>
                        ${u.urun}
                        × ${u.adet}
                    </span>

                    <b>
                        ${
                            Number(u.fiyat || 0) *
                            Number(u.adet || 0)
                        } ₺
                    </b>

                </div>

            `;

        }
    );


    const garson =
        s.kaynak === "garson" ||
        s.garsonSiparisi === true;


    const kaynak =
        garson
        ?
        "👨‍🍳 GARSON SİPARİŞİ"
        :
        "👤 MÜŞTERİ SİPARİŞİ";


    return `

        <div class="siparis ${garson ? "garson" : ""}">

            <div class="siparis-baslik">

                <span class="siparis-no">
                    Sipariş #${index+1}
                </span>

                <span class="siparis-durum">
                    🟡 Bekleyen
                </span>

            </div>

            <div class="
                kaynak
                ${garson ? "" : "musteri"}
            ">

                ${kaynak}

            </div>

            <div class="zaman">

                🕐 ${saat(s)}

            </div>

            ${html}

            <div class="toplam">

                Toplam:
                ${Number(s.toplam || 0)} ₺

            </div>

            <div class="butons">

                <button
                    class="btn duzenle"
                    onclick="
                        duzenle('${s.id}')
                    ">

                    ✏️ Düzenle

                </button>

                <button
                    class="btn onayla"
                    onclick="
                        onayla('${s.id}')
                    ">

                    🟢 Onayla

                </button>

            </div>

            <div
                id="duzen-${s.id}"
                class="duzenleme">

                ${duzenHTML(s)}

            </div>

        </div>

    `;

}


/* =========================
   DÜZENLEME HTML
========================= */

function duzenHTML(s){

    let html = "";

    (s.urunler || [])
    .forEach(
        (u,i) => {

            html += `

                <div class="duzen-satir">

                    <span>
                        ${u.urun}
                    </span>

                    <div class="duzen-adet">

                        <button
                            onclick="
                                duzenAdet(
                                    '${s.id}',
                                    ${i},
                                    -1
                                )
                            ">
                            −
                        </button>

                        <span
                            id="
                                duzen-${s.id}-${i}
                            ">

                            ${u.adet}

                        </span>

                        <button
                            onclick="
                                duzenAdet(
                                    '${s.id}',
                                    ${i},
                                    1
                                )
                            ">
                            +
                        </button>

                    </div>

                </div>

            `;

        }
    );


    return `

        <button
            class="kaydet"
            onclick="
                duzenKaydet(
                    '${s.id}'
                )
            ">

            💾 Değişiklikleri Kaydet

        </button>

    `;

}


/* =========================
   DÜZENLE
========================= */

window.duzenle =
function(id){

    const s =
        siparisler.find(
            x =>
                x.id === id
        );

    if(!s)
        return;


    duzenSepet[id] =
        JSON.parse(
            JSON.stringify(
                s.urunler || []
            )
        );


    const el =
        document.getElementById(
            "duzen-"+id
        );


    if(el){

        el.classList.toggle(
            "acik"
        );

    }

};


/* =========================
   DÜZEN ADET
========================= */

window.duzenAdet =
function(id,index,miktar){

    if(!duzenSepet[id])
        return;


    const u =
        duzenSepet[id][index];


    if(!u)
        return;


    u.adet =
        Math.max(
            0,
            Number(u.adet || 0) +
            miktar
        );


    const el =
        document.getElementById(
            `duzen-${id}-${index}`
        );


    if(el){

        el.textContent =
            u.adet;

    }

};


/* =========================
   DÜZEN KAYDET
========================= */

window.duzenKaydet =
async function(id){

    const liste =
        (duzenSepet[id] || [])
        .filter(
            u =>
                Number(u.adet || 0) > 0
        );


    let toplam = 0;


    liste.forEach(
        u => {

            u.tutar =
                Number(u.fiyat || 0) *
                Number(u.adet || 0);

            toplam +=
                u.tutar;

        }
    );


    try{

        await updateDoc(

            doc(
                db,
                "siparisler",
                id
            ),

            {

                urunler:
                    liste,

                toplam:
                    toplam,

                duzenlendi:
                    true,

                duzenlenmeZamani:
                    serverTimestamp()

            }

        );


        alert(
            "✅ Sipariş güncellendi."
        );


        const el =
            document.getElementById(
                "duzen-"+id
            );

        if(el){

            el.classList.remove(
                "acik"
            );

        }

    }
    catch(error){

        console.error(error);

        alert(
            "❌ Sipariş düzenlenemedi.\n\n" +
            error.message
        );

    }

};


/* =========================
   ONAYLA
========================= */

window.onayla =
async function(id){

    const s =
        siparisler.find(
            x =>
                x.id === id
        );


    if(!s)
        return;


    if(
        !confirm(
            "Masa " +
            s.masa +
            " siparişi onaylansın mı?"
        )
    ){

        return;

    }


    try{

        await updateDoc(

            doc(
                db,
                "siparisler",
                id
            ),

            {

                durum:
                    "Onaylandı",

                onaylanmaZamani:
                    serverTimestamp()

            }

        );

    }
    catch(error){

        console.error(error);

        alert(
            "❌ Onaylama başarısız.\n\n" +
            error.message
        );

    }

};


/* =========================
   MASALARI GÖSTER
========================= */

function masalariGoster(){

    const grid =
        document.getElementById(
            "masaGrid"
        );

    grid.innerHTML = "";


    const bekleyen =
        siparisler.filter(
            s =>
                s.durum === "Bekleyen"
        );


    document.getElementById(
        "bilgi"
    ).textContent =
        bekleyen.length +
        " bekleyen sipariş";


    const masaSonSiparis = {};


    bekleyen.forEach(
        s => {

            const masa =
                Number(s.masa);

            const z =
                zaman(s);

            if(
                !masaSonSiparis[masa] ||
                z > masaSonSiparis[masa]
            ){

                masaSonSiparis[masa] =
                    z;

            }

        }
    );


    const masalar =
        Array.from(
            {length:50},
            (_,i) =>
                i+1
        );


    masalar.sort(
        (a,b) => {

            const aZ =
                masaSonSiparis[a] || 0;

            const bZ =
                masaSonSiparis[b] || 0;

            if(
                aZ === 0 &&
                bZ === 0
            )
                return a-b;

            if(aZ === 0)
                return 1;

            if(bZ === 0)
                return -1;

            return bZ-aZ;

        }
    );


    masalar.forEach(
        (masa,index) => {

            const siparislerMasa =
                bekleyen.filter(
                    s =>
                        Number(s.masa) ===
                        masa
                );


            const oturum =
                acikOturumBul(masa);


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "masa";


            if(oturum){

                div.classList.add(
                    "acik"
                );

            }


            if(
                siparislerMasa.length
            ){

                div.classList.add(
                    "bekleyen"
                );

            }


            if(
                index === 0 &&
                siparislerMasa.length
            ){

                div.classList.add(
                    "yeni"
                );

            }


            let durumClass =
                siparislerMasa.length
                ?
                "bekleyen"
                :
                oturum
                ?
                "acik"
                :
                "kapali";


            let durumText =
                siparislerMasa.length
                ?
                "🟡 " +
                siparislerMasa.length +
                " Bekleyen"
                :
                oturum
                ?
                "🟢 Açık"
                :
                "⚪ Kapalı";


            let html = `

                <div class="masa-baslik">

                    <h3>
                        🪑 Masa ${masa}
                    </h3>

                    <span class="
                        durum
                        ${durumClass}
                    ">

                        ${durumText}

                    </span>

                </div>

            `;


            if(oturum){

                html += `

                    <div class="oturum-bilgi">

                        🟢 Müşteri oturumu açık

                    </div>

                    <div class="masa-butonlari">

                        <button
                            class="garson-btn"
                            onclick="
                                garsonMenusuAc(
                                    ${masa}
                                )
                            ">

                            👨‍🍳 Garson Siparişi

                        </button>

                        <button
                            class="kapat-btn"
                            onclick="
                                masaOturumuKapat(
                                    '${oturum.id}',
                                    ${masa}
                                )
                            ">

                            🔴 Oturumu Kapat

                        </button>

                    </div>

                `;

            }
            else{

                html += `

                    <div class="masa-butonlari">

                        <button
                            class="ac-btn"
                            onclick="
                                masaOturumuAc(
                                    ${masa}
                                )
                            ">

                            🟢 MASA OTURUMUNU AÇ

                        </button>

                    </div>

                    <div class="oturum-kapali">

                        🔴 Müşteri bu masadan sipariş veremez.
                        <br>
                        Garson masayı açmalı.

                    </div>

                `;

            }


            siparislerMasa.forEach(
                (s,i) => {

                    html +=
                        siparisHTML(
                            s,
                            i
                        );

                }
            );


            div.innerHTML =
                html;


            grid.appendChild(
                div
            );

        }
    );

}


/* =========================
   OTURUMLARI DİNLE
========================= */

onSnapshot(

    collection(
        db,
        "oturumlar"
    ),

    snapshot => {

        oturumlar = {};


        snapshot.forEach(
            item => {

                oturumlar[item.id] =
                    item.data();

            }
        );


        masalariGoster();

    },

    error => {

        console.error(error);

        document.getElementById(
            "baglanti"
        ).textContent =
            "🔴 Oturum okuma hatası";

    }

);


/* =========================
   SİPARİŞLERİ DİNLE
========================= */

onSnapshot(

    collection(
        db,
        "siparisler"
    ),

    snapshot => {

        siparisler = [];


        snapshot.forEach(
            item => {

                const data =
                    item.data();


                if(
                    data.durum ===
                    "Bekleyen"
                ){

                    siparisler.push({

                        id:
                            item.id,

                        ...data

                    });

                }

            }
        );


        siparisler.sort(
            (a,b) =>
                zaman(a) -
                zaman(b)
        );


        document.getElementById(
            "baglanti"
        ).textContent =
            "🟢 Firebase bağlantısı aktif";


        masalariGoster();

    },

    error => {

        console.error(error);

        document.getElementById(
            "baglanti"
        ).textContent =
            "🔴 Firebase bağlantı hatası";

    }

);
