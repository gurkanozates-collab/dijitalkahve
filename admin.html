<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Dijital Kahvem - Yönetici</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f1ee;
    color:#33231e;
}

header{
    background:#4e342e;
    color:white;
    padding:20px;
    text-align:center;
}

header h1{
    margin:0;
}

header p{
    margin:6px 0 0;
}

.container{
    max-width:1500px;
    margin:auto;
    padding:15px;
}

.ust-bilgi{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:15px;
}

.bilgi-kart{
    background:white;
    border-radius:12px;
    padding:15px;
    box-shadow:0 2px 8px #0001;
}

.bilgi-kart h3{
    margin:0 0 8px;
    font-size:16px;
}

.bilgi-sayi{
    font-size:26px;
    font-weight:bold;
}

.bekleyen-sayi{
    color:#ef6c00;
}

.onaylanan-sayi{
    color:#2e7d32;
}

.genel-sayi{
    color:#1565c0;
}

.aciklama{
    background:#fff;
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
    box-shadow:0 2px 8px #0001;
}

.aciklama b{
    color:#4e342e;
}

.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
}

.masa{
    background:white;
    border:2px solid #ddd;
    border-radius:14px;
    padding:15px;
    box-shadow:0 2px 8px #0001;
}

.masa.acik{
    border-color:#2e7d32;
}

.masa.bekleyen{
    border-color:#ef6c00;
}

.baslik{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.baslik h2{
    margin:0;
    font-size:20px;
}

.durum{
    padding:6px 9px;
    border-radius:15px;
    font-size:12px;
    font-weight:bold;
    background:#eee;
    color:#777;
}

.durum.acik{
    background:#e8f5e9;
    color:#2e7d32;
}

.durum.bekleyen{
    background:#fff3cd;
    color:#ef6c00;
}

.durum.bos{
    background:#eee;
    color:#777;
}

.toplam{
    font-size:25px;
    font-weight:bold;
    margin:18px 0;
    color:#2e7d32;
}

.siparisler{
    margin-top:10px;
}

.siparis{
    border:1px solid #ddd;
    border-radius:10px;
    padding:10px;
    margin-bottom:9px;
    background:#fafafa;
}

.siparis.bekleyen{
    border-left:5px solid #ef6c00;
    background:#fffaf2;
}

.siparis.onaylandi{
    border-left:5px solid #2e7d32;
}

.siparis-baslik{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:7px;
    font-weight:bold;
}

.bekleyen-yazi{
    color:#ef6c00;
    font-size:12px;
}

.onaylandi-yazi{
    color:#2e7d32;
    font-size:12px;
}

.kaynak{
    display:inline-block;
    padding:4px 7px;
    border-radius:10px;
    font-size:11px;
    font-weight:bold;
    margin-bottom:6px;
}

.kaynak.garson{
    background:#fff3e0;
    color:#ef6c00;
}

.kaynak.musteri{
    background:#e3f2fd;
    color:#1565c0;
}

.urun{
    display:flex;
    justify-content:space-between;
    padding:5px 0;
    border-bottom:1px solid #eee;
    font-size:13px;
}

.siparis-toplam{
    text-align:right;
    font-weight:bold;
    margin-top:8px;
}

.bekleyen-uyari{
    margin-top:8px;
    background:#fff3cd;
    color:#795548;
    padding:8px;
    border-radius:7px;
    font-size:12px;
    font-weight:bold;
}

.bos-siparis{
    color:#777;
    font-size:13px;
    padding:10px 0;
}

.buton{
    width:100%;
    border:0;
    border-radius:10px;
    padding:14px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:8px;
}

.odendi{
    background:#2e7d32;
    color:white;
}

.odendi:hover{
    background:#1b5e20;
}

.oturum-yok{
    color:#777;
    padding:15px 0;
    text-align:center;
}

@media(max-width:1100px){

    .grid{
        grid-template-columns:repeat(3,1fr);
    }

}

@media(max-width:800px){

    .grid{
        grid-template-columns:repeat(2,1fr);
    }

    .ust-bilgi{
        grid-template-columns:1fr;
    }

}

@media(max-width:500px){

    .grid{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<header>

    <h1>☕ DİJİTAL KAHVEM</h1>

    <p>Yönetici Paneli</p>

</header>


<div class="container">


    <div class="ust-bilgi">

        <div class="bilgi-kart">

            <h3>🟡 Bekleyen Sipariş</h3>

            <div
                id="bekleyenSayi"
                class="bilgi-sayi bekleyen-sayi">

                0

            </div>

        </div>


        <div class="bilgi-kart">

            <h3>🟢 Onaylanan Sipariş</h3>

            <div
                id="onaylananSayi"
                class="bilgi-sayi onaylanan-sayi">

                0

            </div>

        </div>


        <div class="bilgi-kart">

            <h3>💳 Aktif Hesap</h3>

            <div
                id="genelToplam"
                class="bilgi-sayi genel-sayi">

                0 ₺

            </div>

        </div>

    </div>


    <div class="aciklama">

        <b>💳 Hesap Yönetimi</b>

        <br><br>

        🟡 <b>Bekleyen sipariş:</b>
        Hesaba dahil edilmez.

        <br>

        🟢 <b>Onaylanan sipariş:</b>
        Hesaba dahil edilir.

        <br><br>

        💳 <b>Hesap Ödendi</b> butonuna basıldığında
        masanın aktif oturumu kapatılır.

    </div>


    <div
        id="grid"
        class="grid">

    </div>

</div>


<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getFirestore,
    collection,
    onSnapshot,
    updateDoc,
    doc,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyC05yXQzAlF2AYzzeaJrDdMUYKwohKOsWM",

    authDomain:
    "dijitalkahve-67f0a.firebaseapp.com",

    databaseURL:
    "https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
    "dijitalkahve-67f0a",

    storageBucket:
    "dijitalkahve-67f0a.firebasestorage.app",

    messagingSenderId:
    "326476599239",

    appId:
    "1:326476599239:web:143f39583a3478118853e2",

    measurementId:
    "G-WM65PC4648"

};


const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);


/* =========================
   VERİLER
========================= */

let oturumlar = [];

let siparisler = [];


/* =========================
   PARA
========================= */

function para(n){

    return Number(n || 0)
        .toLocaleString(
            "tr-TR"
        ) + " ₺";

}


/* =========================
   PANEL
========================= */

function render(){

    const grid =
        document.getElementById(
            "grid"
        );

    grid.innerHTML = "";


    let bekleyenSayisi = 0;

    let onaylananSayisi = 0;

    let genelToplam = 0;


    /*
       TÜM MASALAR
    */

    for(
        let masa = 1;
        masa <= 50;
        masa++
    ){

        /*
           AKTİF OTURUM
        */

        const oturum =
            oturumlar.find(
                x =>
                    Number(x.masa) === masa &&
                    x.durum === "acik"
            );


        /*
           MASANIN SİPARİŞLERİ
        */

        const ss =
            oturum
            ?
            siparisler.filter(
                s =>
                    s.oturumId ===
                    oturum.id
            )
            :
            [];


        /*
           BEKLEYEN
        */

        const bekleyenler =
            ss.filter(
                s =>
                    s.durum ===
                    "Bekleyen"
            );


        /*
           ONAYLANAN
        */

        const onaylananlar =
            ss.filter(
                s =>
                    s.durum ===
                    "Onaylandı"
            );


        /*
           BEKLEYEN SAYISI
        */

        bekleyenSayisi +=
            bekleyenler.length;


        /*
           ONAYLANAN SAYISI
        */

        onaylananSayisi +=
            onaylananlar.length;


        /*
           HESABA SADECE
           ONAYLANANLAR GİRER
        */

        const toplam =
            onaylananlar.reduce(
                (a,s) =>
                    a +
                    Number(
                        s.toplam || 0
                    ),
                0
            );


        genelToplam += toplam;


        const div =
            document.createElement(
                "div"
            );


        div.className =
            "masa";


        if(oturum){

            div.classList.add(
                "acik"
            );

        }


        if(
            bekleyenler.length
        ){

            div.classList.add(
                "bekleyen"
            );

        }


        /*
           DURUM
        */

        let durumHTML = "";


        if(
            bekleyenler.length
        ){

            durumHTML = `

                <span class="durum bekleyen">

                    🟡
                    ${bekleyenler.length}
                    Bekleyen

                </span>

            `;

        }
        else if(oturum){

            durumHTML = `

                <span class="durum acik">

                    🟢 Açık

                </span>

            `;

        }
        else{

            durumHTML = `

                <span class="durum bos">

                    ⚪ Kapalı

                </span>

            `;

        }


        /*
           SİPARİŞ HTML
        */

        let siparisHTML = "";


        if(!ss.length){

            siparisHTML = `

                <div class="bos-siparis">

                    Henüz sipariş yok.

                </div>

            `;

        }
        else{

            /*
               Önce bekleyenler
               sonra onaylananlar
            */

            const sirali = [

                ...bekleyenler,

                ...onaylananlar

            ];


            sirali.forEach(
                (s,index) => {

                    const bekleyen =
                        s.durum ===
                        "Bekleyen";


                    const kaynak =
                        s.kaynak ===
                        "garson";


                    let urunHTML = "";


                    (
                        s.urunler || []
                    ).forEach(
                        u => {

                            urunHTML += `

                                <div class="urun">

                                    <span>

                                        ${u.adet}
                                        ×
                                        ${u.urun}

                                    </span>

                                    <b>

                                        ${para(
                                            u.tutar
                                        )}

                                    </b>

                                </div>

                            `;

                        }
                    );


                    siparisHTML += `

                        <div class="
                            siparis
                            ${
                                bekleyen
                                ?
                                "bekleyen"
                                :
                                "onaylandi"
                            }
                        ">

                            <div
                                class="siparis-baslik">

                                <span>

                                    Sipariş #${index + 1}

                                </span>


                                <span class="
                                    ${
                                        bekleyen
                                        ?
                                        "bekleyen-yazi"
                                        :
                                        "onaylandi-yazi"
                                    }
                                ">

                                    ${
                                        bekleyen
                                        ?
                                        "🟡 Bekleyen"
                                        :
                                        "🟢 Onaylandı"
                                    }

                                </span>

                            </div>


                            <span class="
                                kaynak
                                ${
                                    kaynak
                                    ?
                                    "garson"
                                    :
                                    "musteri"
                                }
                            ">

                                ${
                                    kaynak
                                    ?
                                    "👨‍🍳 GARSON"
                                    :
                                    "👤 MÜŞTERİ"
                                }

                            </span>


                            ${urunHTML}


                            <div class="siparis-toplam">

                                Toplam:
                                ${para(s.toplam)}

                            </div>


                            ${
                                bekleyen
                                ?
                                `

                                <div
                                    class="bekleyen-uyari">

                                    🟡 Bu sipariş
                                    henüz onaylanmadı.
                                    <br>
                                    💳 Hesaba dahil değil.

                                </div>

                                `
                                :
                                ""
                            }

                        </div>

                    `;

                }
            );

        }


        /*
           MASA KARTI
        */

        div.innerHTML = `

            <div class="baslik">

                <h2>

                    🪑 Masa ${masa}

                </h2>

                ${durumHTML}

            </div>


            ${
                oturum
                ?
                `

                <div class="toplam">

                    💳 ${para(toplam)}

                </div>

                <div class="siparisler">

                    ${siparisHTML}

                </div>


                <button
                    class="buton odendi"
                    onclick="
                        hesapOdendi(
                            '${oturum.id}',
                            ${masa}
                        )
                    ">

                    💳 HESAP ÖDENDİ

                </button>

                `
                :
                `

                <div class="oturum-yok">

                    ⚪ Aktif oturum yok.

                </div>

                ${siparisHTML}

                `
            }

        `;


        grid.appendChild(
            div
        );

    }


    /*
       ÜST BİLGİ
    */

    document.getElementById(
        "bekleyenSayi"
    ).textContent =
        bekleyenSayisi;


    document.getElementById(
        "onaylananSayi"
    ).textContent =
        onaylananSayisi;


    document.getElementById(
        "genelToplam"
    ).textContent =
        para(genelToplam);

}


/* =========================
   HESAP ÖDENDİ
========================= */

window.hesapOdendi =
async function(
    id,
    masa
){

    if(
        !confirm(

            "Masa " +
            masa +
            " hesabı ödendi olarak " +
            "işaretlensin mi?\n\n" +

            "Bu işlem masanın aktif " +
            "oturumunu kapatacaktır."

        )
    ){

        return;

    }


    try{

        await updateDoc(

            doc(
                db,
                "oturumlar",
                id
            ),

            {

                durum:
                    "kapali",

                odemeDurumu:
                    "odendi",

                kapanisZamani:
                    serverTimestamp()

            }

        );


        alert(

            "✅ Masa " +
            masa +
            " oturumu kapatıldı."

        );

    }
    catch(error){

        console.error(
            error
        );


        alert(

            "❌ İşlem başarısız.\n\n" +
            error.message

        );

    }

};


/* =========================
   OTURUMLARI DİNLE
========================= */

onSnapshot(

    collection(
        db,
        "oturumlar"
    ),

    snapshot => {

        oturumlar =
            snapshot.docs.map(
                x => ({

                    id:
                        x.id,

                    ...x.data()

                })
            );


        render();

    },

    error => {

        console.error(
            "OTURUM HATASI:",
            error
        );

    }

);


/* =========================
   SİPARİŞLERİ DİNLE
========================= */

onSnapshot(

    collection(
        db,
        "siparisler"
    ),

    snapshot => {

        siparisler =
            snapshot.docs.map(
                x => ({

                    id:
                        x.id,

                    ...x.data()

                })
            );


        render();

    },

    error => {

        console.error(
            "SİPARİŞ HATASI:",
            error
        );

    }

);

</script>

</body>
</html>
