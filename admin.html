<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0">

<title>Dijital Kahvem - Yönetici</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f1ee;
    color:#33231e;
}

header{
    background:#4e342e;
    color:#fff;
    padding:20px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:28px;
}

header p{
    margin:6px 0 0;
}

.topbar{
    background:#fff;
    padding:12px 15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 2px 8px #0002;
    position:sticky;
    top:0;
    z-index:100;
}

.baglanti{
    font-weight:bold;
}

.yenile{
    border:0;
    background:#1565c0;
    color:#fff;
    padding:10px 15px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.container{
    max-width:1500px;
    margin:auto;
    padding:15px;
}

.bilgi{
    background:#fff;
    padding:16px;
    border-radius:12px;
    margin-bottom:15px;
    box-shadow:0 2px 8px #0001;
}

.bilgi h2{
    margin:0 0 6px;
}

.istatistik{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:12px;
}

.istatistik-kutu{
    background:#f8f5f2;
    border-radius:10px;
    padding:10px 14px;
    font-weight:bold;
}

.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
}

.masa{
    background:#fff;
    border:2px solid #ddd;
    border-radius:14px;
    padding:15px;
    box-shadow:0 2px 8px #0001;
}

.masa.acik{
    border-color:#2e7d32;
}

.masa.kapali{
    border-color:#ddd;
}

.baslik{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
}

.baslik h2{
    margin:0;
    font-size:21px;
}

.durum{
    padding:6px 9px;
    border-radius:15px;
    background:#eee;
    color:#777;
    font-size:12px;
    font-weight:bold;
    white-space:nowrap;
}

.durum.acik{
    background:#e8f5e9;
    color:#2e7d32;
}

.durum.kapali{
    background:#eee;
    color:#777;
}

.toplam{
    font-size:25px;
    font-weight:bold;
    margin:18px 0;
    color:#4e342e;
}

.detay{
    margin-top:12px;
    border-top:1px solid #ddd;
    padding-top:10px;
}

.siparis{
    border:1px solid #ddd;
    border-radius:10px;
    padding:10px;
    margin-bottom:10px;
    background:#fafafa;
}

.siparis.garson{
    border-left:5px solid #ef6c00;
    background:#fff8ef;
}

.siparis.musteri{
    border-left:5px solid #1565c0;
    background:#f4f9ff;
}

.siparis-ust{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:5px;
    margin-bottom:8px;
}

.siparis-no{
    font-weight:bold;
}

.kaynak{
    font-size:11px;
    font-weight:bold;
    padding:5px 7px;
    border-radius:7px;
}

.kaynak.garson{
    background:#fff3e0;
    color:#e65100;
}

.kaynak.musteri{
    background:#e3f2fd;
    color:#1565c0;
}

.siparis-durum{
    font-size:12px;
    font-weight:bold;
    margin-bottom:7px;
}

.urun{
    display:flex;
    justify-content:space-between;
    padding:5px 0;
    border-bottom:1px solid #eee;
    font-size:14px;
}

.siparis-toplam{
    text-align:right;
    margin-top:8px;
    font-size:16px;
    font-weight:bold;
}

.zaman{
    color:#777;
    font-size:11px;
    margin-top:7px;
}

.odendi{
    width:100%;
    border:0;
    border-radius:10px;
    padding:14px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    background:#2e7d32;
    color:#fff;
    margin-top:10px;
}

.odendi:hover{
    background:#1b5e20;
}

.bos{
    color:#777;
    text-align:center;
    padding:20px 5px;
}

.uyari{
    background:#fff3cd;
    color:#856404;
    padding:9px;
    border-radius:8px;
    margin-top:8px;
    font-size:12px;
    font-weight:bold;
}

@media(max-width:1100px){

    .grid{
        grid-template-columns:repeat(3,1fr);
    }

}

@media(max-width:800px){

    .grid{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:520px){

    .grid{
        grid-template-columns:1fr;
    }

    header h1{
        font-size:23px;
    }

}

</style>

</head>

<body>

<header>

    <h1>☕ DİJİTAL KAHVEM</h1>

    <p>Yönetici Paneli</p>

</header>


<div class="topbar">

    <div
        id="baglanti"
        class="baglanti">

        🟡 Firebase bağlanıyor...

    </div>

    <button
        class="yenile"
        onclick="location.reload()">

        🔄 Yenile

    </button>

</div>


<div class="container">


    <div class="bilgi">

        <h2>💳 Hesap Yönetimi</h2>

        <div>

            Garson tarafından açılan aktif masalar
            ve bu masalara ait müşteri/garson siparişleri
            burada görünür.

        </div>


        <div class="istatistik">

            <div class="istatistik-kutu">

                🟢 Açık Masa:
                <span id="acikMasaSayisi">
                    0
                </span>

            </div>


            <div class="istatistik-kutu">

                🧾 Sipariş:
                <span id="siparisSayisi">
                    0
                </span>

            </div>


            <div class="istatistik-kutu">

                💰 Toplam:
                <span id="genelToplam">
                    0 ₺
                </span>

            </div>

        </div>

    </div>


    <div
        id="grid"
        class="grid">

    </div>


</div>


<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {

    initializeApp

}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {

    getFirestore,
    collection,
    onSnapshot,
    query,
    where,
    updateDoc,
    doc,
    serverTimestamp

}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
    "AIzaSyC05yXQzAlF2AYzzeaJrDdMUYKwohKOsWM",

    authDomain:
    "dijitalkahve-67f0a.firebaseapp.com",

    databaseURL:
    "https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
    "dijitalkahve-67f0a",

    storageBucket:
    "dijitalkahve-67f0a.firebasestorage.app",

    messagingSenderId:
    "326476599239",

    appId:
    "1:326476599239:web:143f39583a3478118853e2",

    measurementId:
    "G-WM65PC4648"

};


const app =
initializeApp(firebaseConfig);


const db =
getFirestore(app);


/* =====================================================
   DEĞİŞKENLER
===================================================== */

let oturumlar = [];

let siparisler = [];


/* =====================================================
   PARA
===================================================== */

function para(n){

    return Number(n || 0)
        .toLocaleString(
            "tr-TR"
        ) + " ₺";

}


/* =====================================================
   ZAMAN
===================================================== */

function saat(veri){

    if(
        veri &&
        veri.toDate &&
        typeof veri.toDate === "function"
    ){

        return veri
            .toDate()
            .toLocaleTimeString(
                "tr-TR",
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            );

    }

    return "--:--";

}


/* =====================================================
   SİPARİŞİ OTURUMA BAĞLA
===================================================== */

function siparisBuOturumaAit(
    siparis,
    oturum,
    masa
){

    /*
     * Normal sistem:
     * Siparişin oturumId'si varsa
     * doğrudan kontrol edilir.
     */

    if(
        siparis.oturumId &&
        oturum &&
        siparis.oturumId === oturum.id
    ){

        return true;

    }


    /*
     * Eski kayıtlar için:
     * oturumId yoksa masa numarasına bak.
     */

    if(
        !siparis.oturumId &&
        Number(siparis.masa) === Number(masa)
    ){

        return true;

    }


    return false;

}


/* =====================================================
   SİPARİŞ HTML
===================================================== */

function siparisHTML(s){

    const garson =
        s.kaynak === "garson" ||
        s.garsonSiparisi === true;


    let urunHTML = "";


    (s.urunler || []).forEach(
        u => {

            const adet =
                Number(u.adet || 0);


            const fiyat =
                Number(u.fiyat || 0);


            const tutar =
                adet * fiyat;


            urunHTML += `

                <div class="urun">

                    <span>

                        ${u.urun || u.ad || "Ürün"}

                        × ${adet}

                    </span>

                    <b>

                        ${para(tutar)}

                    </b>

                </div>

            `;

        }
    );


    const durum =
        s.durum || "Bekleyen";


    return `

        <div class="
            siparis
            ${garson ? "garson" : "musteri"}
        ">


            <div class="siparis-ust">

                <span class="siparis-no">

                    🧾 Sipariş

                </span>


                <span class="
                    kaynak
                    ${garson ? "garson" : "musteri"}
                ">

                    ${
                        garson
                        ?
                        "👨‍🍳 GARSON"
                        :
                        "👤 MÜŞTERİ"
                    }

                </span>

            </div>


            <div class="siparis-durum">

                ${
                    durum === "Onaylandı"
                    ?
                    "🟢 Onaylandı"
                    :
                    "🟡 Bekleyen"
                }

            </div>


            ${urunHTML}


            <div class="siparis-toplam">

                Toplam:
                ${para(s.toplam)}

            </div>


            <div class="zaman">

                🕐 ${saat(s.olusturmaZamani)}

            </div>


        </div>

    `;

}


/* =====================================================
   MASALARI GÖSTER
===================================================== */

function render(){

    const grid =
        document.getElementById("grid");


    grid.innerHTML = "";


    let acikMasa = 0;

    let toplamSiparis = 0;

    let genelToplam = 0;


    for(
        let masa = 1;
        masa <= 50;
        masa++
    ){

        /*
         * BU MASANIN AKTİF OTURUMU
         */

        const oturum =
            oturumlar.find(
                x =>
                    Number(x.masa) === Number(masa) &&
                    x.durum === "acik"
            );


        /*
         * AKTİF OTURUM VARSA
         */

        if(oturum){

            acikMasa++;

        }


        /*
         * BU MASANIN SİPARİŞLERİ
         */

        let masaSiparisleri = [];


        if(oturum){

            masaSiparisleri =
                siparisler.filter(
                    s =>
                        siparisBuOturumaAit(
                            s,
                            oturum,
                            masa
                        ) &&
                        s.oturumKapandi !== true
                );

        }


        /*
         * TOPLAM
         */

        const masaToplam =
            masaSiparisleri.reduce(
                (
                    toplam,
                    s
                ) =>
                    toplam +
                    Number(
                        s.toplam || 0
                    ),
                0
            );


        toplamSiparis +=
            masaSiparisleri.length;


        genelToplam +=
            masaToplam;


        /*
         * KART
         */

        const div =
            document.createElement(
                "div"
            );


        div.className =
            "masa " +
            (
                oturum
                ?
                "acik"
                :
                "kapali"
            );


        let html = `

            <div class="baslik">

                <h2>
                    🪑 Masa ${masa}
                </h2>

                <span class="
                    durum
                    ${
                        oturum
                        ?
                        "acik"
                        :
                        "kapali"
                    }
                ">

                    ${
                        oturum
                        ?
                        "🟢 Açık"
                        :
                        "⚪ Kapalı"
                    }

                </span>

            </div>

        `;


        /*
         * AÇIK MASA
         */

        if(oturum){

            html += `

                <div class="toplam">

                    ${para(masaToplam)}

                </div>

            `;


            /*
             * SİPARİŞLER
             */

            html += `

                <div class="detay">

            `;


            if(
                masaSiparisleri.length === 0
            ){

                html += `

                    <div class="bos">

                        Henüz sipariş yok.

                    </div>

                `;

            }
            else{

                masaSiparisleri.forEach(
                    s => {

                        html +=
                            siparisHTML(s);

                    }
                );

            }


            html += `

                </div>

            `;


            /*
             * HESAP ÖDENDİ
             */

            html += `

                <button
                    class="buton odendi"
                    onclick="
                        hesapOdendi(
                            '${oturum.id}',
                            ${masa}
                        )
                    ">

                    💳 HESAP ÖDENDİ

                </button>

            `;

        }
        else{

            html += `

                <div class="bos">

                    Aktif oturum yok.

                    <div class="uyari">

                        🪑 Masayı garson açabilir.

                    </div>

                </div>

            `;

        }


        div.innerHTML =
            html;


        grid.appendChild(
            div
        );

    }


    /*
     * İSTATİSTİKLER
     */

    document.getElementById(
        "acikMasaSayisi"
    ).textContent =
        acikMasa;


    document.getElementById(
        "siparisSayisi"
    ).textContent =
        toplamSiparis;


    document.getElementById(
        "genelToplam"
    ).textContent =
        para(genelToplam);

}


/* =====================================================
   HESAP ÖDENDİ
   MASA OTOMATİK KAPANIR
===================================================== */

window.hesapOdendi =
async function(
    oturumId,
    masa
){

    const onay =
        confirm(

            "💳 MASA " +
            masa +
            "\n\n" +

            "Hesap ödendi mi?\n\n" +

            "Onayladığında:\n" +

            "• Hesap ödendi olarak işaretlenecek\n" +

            "• Masa oturumu kapanacak\n" +

            "• Müşteri yeni sipariş veremeyecek\n" +

            "• Garson panelinde masa tekrar açılabilir olacak"

        );


    if(!onay){

        return;

    }


    try{

        /*
         * 1
         * OTURUMU KAPAT
         */

        await updateDoc(

            doc(
                db,
                "oturumlar",
                oturumId
            ),

            {

                durum:
                    "kapali",

                odemeDurumu:
                    "odendi",

                hesapOdendi:
                    true,

                kapanisZamani:
                    serverTimestamp()

            }

        );


        /*
         * 2
         * BU OTURUMA AİT SİPARİŞLERİ
         * KAPANMIŞ OTURUM OLARAK İŞARETLE
         *
         * SİPARİŞLER SİLİNMİYOR.
         */

        const ilgiliSiparisler =
            siparisler.filter(
                s =>
                    s.oturumId ===
                    oturumId
            );


        for(
            const siparis
            of ilgiliSiparisler
        ){

            try{

                await updateDoc(

                    doc(
                        db,
                        "siparisler",
                        siparis.id
                    ),

                    {

                        oturumKapandi:
                            true,

                        hesapOdendi:
                            true,

                        masaKapanisZamani:
                            serverTimestamp()

                    }

                );

            }
            catch(
                siparisHatasi
            ){

                console.error(
                    "Sipariş güncelleme hatası:",
                    siparisHatasi
                );

            }

        }


        /*
         * 3
         * YEREL EKRANI HEMEN GÜNCELLE
         */

        oturumlar =
            oturumlar.map(
                o => {

                    if(
                        o.id ===
                        oturumId
                    ){

                        return {

                            ...o,

                            durum:
                                "kapali",

                            odemeDurumu:
                                "odendi",

                            hesapOdendi:
                                true

                        };

                    }

                    return o;

                }
            );


        render();


        alert(

            "✅ HESAP ÖDENDİ\n\n" +

            "Masa " +
            masa +
            " kapatıldı.\n\n" +

            "Garson panelinde masa tekrar açılabilir."

        );

    }
    catch(error){

        console.error(
            "HESAP KAPATMA HATASI:",
            error
        );


        alert(

            "❌ MASA KAPATILAMADI\n\n" +

            error.message

        );

    }

};


/* =====================================================
   OTURUMLARI DİNLE
===================================================== */

const oturumQuery =
    query(
        collection(
            db,
            "oturumlar"
        )
    );


onSnapshot(

    oturumQuery,

    snapshot => {

        oturumlar = [];


        snapshot.forEach(
            item => {

                oturumlar.push({

                    id:
                        item.id,

                    ...item.data()

                });

            }
        );


        document.getElementById(
            "baglanti"
        ).textContent =
            "🟢 Firebase bağlantısı aktif";


        render();

    },

    error => {

        console.error(
            "OTURUMLAR HATASI:",
            error
        );


        document.getElementById(
            "baglanti"
        ).textContent =
            "🔴 Firebase bağlantı hatası";

    }

);


/* =====================================================
   SİPARİŞLERİ DİNLE
===================================================== */

const siparisQuery =
    query(
        collection(
            db,
            "siparisler"
        )
    );


onSnapshot(

    siparisQuery,

    snapshot => {

        siparisler = [];


        snapshot.forEach(
            item => {

                siparisler.push({

                    id:
                        item.id,

                    ...item.data()

                });

            }
        );


        /*
         * BURADA ARTIK SADECE
         * "Bekleyen" SİPARİŞLERİ ALMIYORUZ.
         *
         * Bekleyen + Onaylandı
         * hepsi yönetici panelinde görünür.
         */

        render();

    },

    error => {

        console.error(
            "SİPARİŞLER HATASI:",
            error
        );


        document.getElementById(
            "baglanti"
        ).textContent =
            "🔴 Sipariş bağlantı hatası";

    }

);


/* =====================================================
   BAŞLANGIÇ
===================================================== */

render();

</script>

</body>

</html>
