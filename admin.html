<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dijital Kahvehane - Yönetim</title>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f1ed;
    color:#33231d;
}

/* HEADER */

.header{
    background:linear-gradient(135deg,#3e2723,#6d4c41);
    color:white;
    padding:22px 15px;
    text-align:center;
    box-shadow:0 3px 12px rgba(0,0,0,.2);
}

.header h1{
    margin:0;
    font-size:24px;
}

.header small{
    opacity:.8;
}

/* LOGIN */

.login-box{
    width:100%;
    max-width:400px;
    margin:60px auto;
    background:white;
    padding:30px;
    border-radius:18px;
    box-shadow:0 8px 30px rgba(0,0,0,.12);
    text-align:center;
}

.login-icon{
    font-size:50px;
    margin-bottom:10px;
}

input,
select{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:9px;
    margin-bottom:10px;
    font-size:15px;
    outline:none;
}

input:focus,
select:focus{
    border-color:#6d4c41;
}

/* BUTTONS */

button{
    border:0;
    border-radius:9px;
    padding:12px 15px;
    font-weight:bold;
    cursor:pointer;
    font-size:14px;
}

.btn-primary{
    background:#5d4037;
    color:white;
}

.btn-green{
    background:#2e7d32;
    color:white;
}

.btn-red{
    background:#d32f2f;
    color:white;
}

.btn-blue{
    background:#1565c0;
    color:white;
}

.btn-orange{
    background:#ef6c00;
    color:white;
}

/* CONTENT */

#adminContent{
    display:none;
    max-width:1100px;
    margin:auto;
    padding:15px;
}

/* NAV */

.admin-nav{
    display:flex;
    gap:8px;
    margin-bottom:18px;
    position:sticky;
    top:0;
    z-index:20;
    background:#f4f1ed;
    padding:10px 0;
}

.admin-nav button{
    flex:1;
    background:#ddd2cc;
    color:#4e342e;
}

.admin-nav button.active{
    background:#5d4037;
    color:white;
}

/* PAGE */

.admin-page{
    display:none;
}

.admin-page.active{
    display:block;
}

/* BOX */

.box{
    background:white;
    border-radius:14px;
    padding:18px;
    margin-bottom:18px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.box-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.box-title h2{
    margin:0;
    font-size:19px;
}

/* PRODUCT */

.product-card{
    background:#fafafa;
    border:1px solid #e3ded9;
    border-radius:12px;
    padding:13px;
    margin-bottom:9px;
}

.product-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.product-name{
    font-weight:bold;
    font-size:16px;
}

.product-price{
    color:#2e7d32;
    font-weight:bold;
}

.product-category{
    color:#888;
    font-size:12px;
    margin-top:5px;
}

.product-actions{
    display:flex;
    gap:6px;
    margin-top:10px;
}

.product-actions button{
    flex:1;
}

/* EDIT */

.edit-area{
    display:none;
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid #ddd;
}

/* MASA */

.masa-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:15px;
}

.masa-card{
    background:white;
    border-radius:16px;
    padding:17px;
    box-shadow:0 3px 12px rgba(0,0,0,.09);
    border-top:6px solid #bdbdbd;
}

.masa-card.dolu{
    border-top-color:#ef6c00;
}

.masa-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
}

.masa-title{
    font-size:21px;
    font-weight:bold;
    color:#4e342e;
}

.masa-status{
    font-size:12px;
    padding:5px 8px;
    border-radius:20px;
    background:#eee;
}

.masa-status.dolu{
    background:#fff3e0;
    color:#e65100;
}

.masa-empty{
    text-align:center;
    padding:25px 10px;
    color:#999;
}

.urun-satir{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:9px 0;
    border-bottom:1px dashed #ddd;
}

.urun-ad{
    font-weight:bold;
}

.urun-adet{
    color:#666;
    font-size:14px;
}

.urun-tutar{
    font-weight:bold;
}

.bekleyen{
    color:#ef6c00;
}

.onayli{
    color:#2e7d32;
}

.masa-toplam{
    display:flex;
    justify-content:space-between;
    margin-top:15px;
    padding-top:12px;
    border-top:2px solid #eee;
    font-size:20px;
    font-weight:bold;
}

.odeme-btn{
    width:100%;
    margin-top:14px;
    background:#2e7d32;
    color:white;
    padding:15px;
    font-size:16px;
}

.odeme-btn:hover{
    background:#1b5e20;
}

/* SUMMARY */

.summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:18px;
}

.summary-box{
    background:white;
    padding:15px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.07);
}

.summary-number{
    font-size:24px;
    font-weight:bold;
    color:#5d4037;
}

.summary-label{
    font-size:12px;
    color:#777;
}

/* RESPONSIVE */

@media(max-width:600px){

    .summary{
        grid-template-columns:1fr 1fr 1fr;
    }

    .summary-number{
        font-size:19px;
    }

    .summary-label{
        font-size:10px;
    }

    .admin-nav button{
        font-size:12px;
        padding:11px 5px;
    }

    .masa-grid{
        grid-template-columns:1fr;
    }
}

</style>
</head>

<body>

<!-- HEADER -->

<div class="header">

    <h1>☕ DİJİTAL KAHVEHANE</h1>

    <small>Yönetim ve Kasa Paneli</small>

</div>


<!-- LOGIN -->

<div id="loginBox" class="login-box">

    <div class="login-icon">🔐</div>

    <h2>Yönetici Girişi</h2>

    <p style="color:#777;font-size:14px;">
        Yönetim paneline devam etmek için şifrenizi girin.
    </p>

    <input
        type="password"
        id="passInput"
        placeholder="Yönetici Şifresi"
        onkeydown="if(event.key==='Enter') girisYap()"
    >

    <button
        class="btn-primary"
        style="width:100%;"
        onclick="girisYap()"
    >
        Giriş Yap
    </button>

</div>


<!-- ADMIN -->

<div id="adminContent">

    <!-- NAV -->

    <div class="admin-nav">

        <button
            id="nav-urun"
            class="active"
            onclick="sayfaAc('urun')"
        >
            🍽️ Ürün & Fiyat
        </button>

        <button
            id="nav-masa"
            onclick="sayfaAc('masa')"
        >
            🧾 Masa Hesapları
        </button>

    </div>


    <!-- ============================= -->
    <!-- ÜRÜN SAYFASI -->
    <!-- ============================= -->

    <div
        id="page-urun"
        class="admin-page active"
    >

        <div class="box">

            <div class="box-title">

                <h2>➕ Yeni Ürün Ekle</h2>

            </div>

            <input
                type="text"
                id="yeniAd"
                placeholder="Ürün adı"
            >

            <input
                type="number"
                id="yeniFiyat"
                placeholder="Fiyat (TL)"
                min="0"
                step="0.01"
            >

            <select id="yeniKategori">

                <option value="Sıcak İçecekler">
                    ☕ Sıcak İçecekler
                </option>

                <option value="Soğuk İçecekler">
                    🧊 Soğuk İçecekler
                </option>

                <option value="Tatlılar">
                    🍰 Tatlılar
                </option>

                <option value="Atıştırmalıklar">
                    🥪 Atıştırmalıklar
                </option>

                <option value="Diğer">
                    🍹 Diğer
                </option>

            </select>

            <button
                class="btn-green"
                style="width:100%;"
                onclick="urunEkle()"
            >
                ➕ Ürünü Menüye Ekle
            </button>

        </div>


        <div class="box">

            <div class="box-title">

                <h2>📋 Menü & Fiyatlar</h2>

                <span
                    id="urunSayisi"
                    style="color:#777;font-size:13px;"
                ></span>

            </div>

            <div id="adminUrunListesi">
                Yükleniyor...
            </div>

        </div>

    </div>


    <!-- ============================= -->
    <!-- MASA SAYFASI -->
    <!-- ============================= -->

    <div
        id="page-masa"
        class="admin-page"
    >

        <div class="summary">

            <div class="summary-box">

                <div
                    class="summary-number"
                    id="doluMasaSayisi"
                >
                    0
                </div>

                <div class="summary-label">
                    Dolu Masa
                </div>

            </div>


            <div class="summary-box">

                <div
                    class="summary-number"
                    id="bekleyenSayisi"
                >
                    0
                </div>

                <div class="summary-label">
                    Bekleyen Sipariş
                </div>

            </div>


            <div class="summary-box">

                <div
                    class="summary-number"
                    id="genelCiro"
                >
                    0 TL
                </div>

                <div class="summary-label">
                    Masa Toplamı
                </div>

            </div>

        </div>


        <div class="box">

            <div class="box-title">

                <h2>🧾 Masa Hesapları</h2>

                <span style="color:#777;font-size:12px;">
                    Canlı
                </span>

            </div>

            <div
                id="masaListesi"
                class="masa-grid"
            >
                Masalar yükleniyor...
            </div>

        </div>

    </div>

</div>


<script>

/* ==========================================
   FIREBASE
========================================== */

const firebaseConfig = {

    databaseURL:
    "https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
    "dijitalkahve-67f0a",

    storageBucket:
    "dijitalkahve-67f0a.appspot.com",

    messagingSenderId:
    "326476599239"

};


if(!firebase.apps.length){

    firebase.initializeApp(firebaseConfig);

}


const db =
firebase.app().database(
    "https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app"
);


/* ==========================================
   GİRİŞ
========================================== */

function girisYap(){

    const pass =
    document.getElementById('passInput').value;

    if(pass === '1234'){

        document.getElementById('loginBox').style.display='none';

        document.getElementById('adminContent').style.display='block';

        urunleriDinle();

        siparisleriDinle();

    }

    else{

        alert('❌ Hatalı şifre!');

    }

}


/* ==========================================
   SAYFA DEĞİŞTİR
========================================== */

function sayfaAc(sayfa){

    document
    .querySelectorAll('.admin-page')
    .forEach(el=>{
        el.classList.remove('active');
    });


    document
    .querySelectorAll('.admin-nav button')
    .forEach(el=>{
        el.classList.remove('active');
    });


    document
    .getElementById('page-'+sayfa)
    .classList.add('active');


    document
    .getElementById('nav-'+sayfa)
    .classList.add('active');

}


/* ==========================================
   ÜRÜNLER
========================================== */

function urunleriDinle(){

    db.ref('urunler').on('value',(snapshot)=>{

        const data =
        snapshot.val() || {};

        const container =
        document.getElementById(
            'adminUrunListesi'
        );

        container.innerHTML='';

        const keys =
        Object.keys(data);

        document.getElementById(
            'urunSayisi'
        ).innerText =
        keys.length + ' ürün';


        if(keys.length === 0){

            container.innerHTML =
            '<p style="text-align:center;color:#999;">Henüz ürün yok.</p>';

            return;

        }


        keys.forEach(key=>{

            const item=data[key];

            container.innerHTML += `

            <div class="product-card">

                <div class="product-top">

                    <div>

                        <div class="product-name">
                            ${guvenliMetin(item.ad)}
                        </div>

                        <div class="product-category">
                            ${guvenliMetin(item.kategori || 'Diğer')}
                        </div>

                    </div>

                    <div class="product-price">
                        ${item.fiyat} TL
                    </div>

                </div>


                <div class="product-actions">

                    <button
                        class="btn-blue"
                        onclick="duzenleAc('${key}')"
                    >
                        ✏️ Düzenle
                    </button>

                    <button
                        class="btn-red"
                        onclick="urunSil('${key}')"
                    >
                        🗑️ Sil
                    </button>

                </div>


                <div
                    id="edit-${key}"
                    class="edit-area"
                >

                    <input
                        type="text"
                        id="edit-ad-${key}"
                        value="${guvenliAttr(item.ad)}"
                    >

                    <input
                        type="number"
                        id="edit-fiyat-${key}"
                        value="${item.fiyat}"
                        min="0"
                        step="0.01"
                    >

                    <select id="edit-kategori-${key}">

                        <option value="Sıcak İçecekler"
                        ${item.kategori==='Sıcak İçecekler'?'selected':''}>
                        ☕ Sıcak İçecekler
                        </option>

                        <option value="Soğuk İçecekler"
                        ${item.kategori==='Soğuk İçecekler'?'selected':''}>
                        🧊 Soğuk İçecekler
                        </option>

                        <option value="Tatlılar"
                        ${item.kategori==='Tatlılar'?'selected':''}>
                        🍰 Tatlılar
                        </option>

                        <option value="Atıştırmalıklar"
                        ${item.kategori==='Atıştırmalıklar'?'selected':''}>
                        🥪 Atıştırmalıklar
                        </option>

                        <option value="Diğer"
                        ${item.kategori==='Diğer'?'selected':''}>
                        🍹 Diğer
                        </option>

                    </select>

                    <button
                        class="btn-green"
                        style="width:100%;"
                        onclick="urunGuncelle('${key}')"
                    >
                        💾 Değişiklikleri Kaydet
                    </button>

                </div>

            </div>

            `;

        });

    });

}


/* ==========================================
   ÜRÜN EKLE
========================================== */

function urunEkle(){

    const ad =
    document.getElementById('yeniAd').value.trim();

    const fiyat =
    document.getElementById('yeniFiyat').value;

    const kategori =
    document.getElementById('yeniKategori').value;


    if(!ad || !fiyat){

        alert('Ürün adı ve fiyat girin.');

        return;

    }


    db.ref('urunler').push({

        ad:ad,

        fiyat:parseFloat(fiyat),

        kategori:kategori

    })
    .then(()=>{

        document.getElementById('yeniAd').value='';

        document.getElementById('yeniFiyat').value='';

        alert('✅ Ürün eklendi.');

    })
    .catch(err=>{

        alert('Hata: '+err.message);

    });

}


/* ==========================================
   ÜRÜN DÜZENLE
========================================== */

function duzenleAc(key){

    const area =
    document.getElementById('edit-'+key);

    area.style.display =
    area.style.display === 'block'
    ? 'none'
    : 'block';

}


function urunGuncelle(key){

    const ad =
    document.getElementById('edit-ad-'+key).value.trim();

    const fiyat =
    document.getElementById('edit-fiyat-'+key).value;

    const kategori =
    document.getElementById('edit-kategori-'+key).value;


    if(!ad || fiyat === ''){

        alert('Bilgileri eksiksiz girin.');

        return;

    }


    db.ref('urunler/'+key)
    .update({

        ad:ad,

        fiyat:parseFloat(fiyat),

        kategori:kategori

    })
    .then(()=>{

        alert('✅ Ürün güncellendi.');

    })
    .catch(err=>{

        alert('Hata: '+err.message);

    });

}


/* ==========================================
   ÜRÜN SİL
========================================== */

function urunSil(key){

    if(!confirm(
        'Bu ürünü menüden silmek istediğinize emin misiniz?'
    )) return;


    db.ref('urunler/'+key)
    .remove();

}


/* ==========================================
   SİPARİŞLER
========================================== */

let tumSiparisler = {};


function siparisleriDinle(){

    db.ref('siparisler').on('value',(snapshot)=>{

        tumSiparisler =
        snapshot.val() || {};

        masaHesaplariniOlustur();

    });

}


/* ==========================================
   MASA HESAPLARI
========================================== */

function masaHesaplariniOlustur(){

    const masaListesi =
    document.getElementById('masaListesi');

    masaListesi.innerHTML='';


    let doluMasa=0;

    let bekleyen=0;

    let genelToplam=0;


    /*
       1-10 arası masalar
    */

    for(let masa=1; masa<=10; masa++){

        const siparisler =
        Object.entries(tumSiparisler)
        .filter(([key,siparis])=>
            String(siparis.masa) === String(masa)
        );


        const urunToplam={};

        let masaToplam=0;

        let bekleyenMasa=0;


        siparisler.forEach(([key,siparis])=>{

            if(siparis.durum !== 'onaylandi'){

                bekleyen++;

                bekleyenMasa++;

            }


            const urunler =
            siparis.urunler || {};


            Object.values(urunler)
            .forEach(u=>{

                const ad=u.ad;

                const adet=
                parseInt(u.adet)||0;

                const fiyat=
                parseFloat(u.fiyat)||0;


                if(!urunToplam[ad]){

                    urunToplam[ad]={
                        adet:0,
                        toplam:0,
                        fiyat:fiyat
                    };

                }


                urunToplam[ad].adet += adet;

                urunToplam[ad].toplam +=
                fiyat * adet;

                masaToplam +=
                fiyat * adet;

            });

        });


        if(siparisler.length>0){

            doluMasa++;

            genelToplam += masaToplam;

        }


        const dolu =
        siparisler.length > 0;


        let urunHtml='';


        if(dolu){

            Object.keys(urunToplam)
            .forEach(ad=>{

                const u=urunToplam[ad];

                urunHtml += `

                <div class="urun-satir">

                    <div>

                        <div class="urun-ad">
                            ${guvenliMetin(ad)}
                        </div>

                        <div class="urun-adet">
                            ${u.adet} adet
                        </div>

                    </div>

                    <div class="urun-tutar">
                        ${u.toplam.toFixed(2)} TL
                    </div>

                </div>

                `;

            });

        }


        if(!dolu){

            urunHtml=`

            <div class="masa-empty">

                ☕<br>

                <strong>Masa Boş</strong>

                <br>

                <small>Henüz sipariş yok.</small>

            </div>

            `;

        }


        masaListesi.innerHTML += `

        <div class="masa-card ${dolu?'dolu':''}">

            <div class="masa-header">

                <div class="masa-title">
                    🪑 MASA ${masa}
                </div>

                <div class="masa-status ${dolu?'dolu':''}">

                    ${
                        !dolu
                        ? 'Boş'
                        : bekleyenMasa>0
                        ? '⏳ Bekleyen'
                        : '🟢 Dolu'
                    }

                </div>

            </div>


            ${urunHtml}


            ${
                dolu
                ? `

                <div class="masa-toplam">

                    <span>TOPLAM</span>

                    <span>
                        ${masaToplam.toFixed(2)} TL
                    </span>

                </div>

                <button
                    class="odeme-btn"
                    onclick="hesapOdendi('${masa}')"
                >
                    💰 HESAP ÖDENDİ
                </button>

                `
                : ''
            }

        </div>

        `;

    }


    document.getElementById(
        'doluMasaSayisi'
    ).innerText=doluMasa;


    document.getElementById(
        'bekleyenSayisi'
    ).innerText=bekleyen;


    document.getElementById(
        'genelCiro'
    ).innerText=
    genelToplam.toFixed(2)+' TL';

}


/* ==========================================
   HESAP ÖDENDİ
========================================== */

function hesapOdendi(masa){

    const siparisler =
    Object.entries(tumSiparisler)
    .filter(([key,siparis])=>
        String(siparis.masa) === String(masa)
    );


    if(siparisler.length===0){

        alert(
            'Bu masada silinecek sipariş bulunamadı.'
        );

        return;

    }


    let toplam=0;


    siparisler.forEach(([key,siparis])=>{

        toplam +=
        parseFloat(siparis.toplam)||0;

    });


    const onay =
    confirm(
        'MASA '+masa+
        '\n\nToplam: '+toplam.toFixed(2)+' TL'+
        '\n\nHesap ödendi olarak işaretlenip masa sıfırlanacak.'+
        '\n\nDevam etmek istiyor musunuz?'
    );


    if(!onay) return;


    const updates={};


    siparisler.forEach(([key])=>{

        updates[
            'siparisler/'+key
        ]=null;

    });


    db.ref().update(updates)

    .then(()=>{

        alert(
            '✅ Masa '+masa+
            ' hesabı ödendi ve sıfırlandı.'
        );

    })

    .catch(err=>{

        alert(
            '❌ İşlem başarısız: '+
            err.message
        );

    });

}


/* ==========================================
   GÜVENLİ METİN
========================================== */

function guvenliMetin(text){

    return String(text ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}


function guvenliAttr(text){

    return guvenliMetin(text);

}
