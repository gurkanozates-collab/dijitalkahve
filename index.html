```html
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dijital Kahvem - Garson</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f4f1ee;
 color:#33231e
}

header{
 background:#4e342e;
 color:#fff;
 padding:18px;
 text-align:center
}

header h1{
 margin:0;
 font-size:25px
}

.container{
 max-width:900px;
 margin:auto;
 padding:15px
}

.baslik{
 background:#fff;
 padding:15px;
 border-radius:12px;
 margin-bottom:15px;
 box-shadow:0 2px 8px #0001;
 text-align:center
}

.siparis{
 background:#fff;
 border-radius:14px;
 padding:15px;
 margin-bottom:15px;
 box-shadow:0 2px 10px #0001;
 border-left:6px solid #ef6c00
}

.siparis.onayli{
 border-left-color:#2e7d32
}

.ustbilgi{
 display:flex;
 justify-content:space-between;
 align-items:center;
 flex-wrap:wrap;
 gap:8px;
 margin-bottom:10px
}

.masa{
 font-size:20px;
 font-weight:bold
}

.saat{
 color:#666;
 font-size:13px
}

.durum{
 font-weight:bold;
 color:#ef6c00
}

.onayli .durum{
 color:#2e7d32
}

.urun{
 display:flex;
 justify-content:space-between;
 padding:8px 0;
 border-bottom:1px solid #eee
}

.toplam{
 text-align:right;
 font-size:18px;
 font-weight:bold;
 margin-top:10px
}

button{
 width:100%;
 padding:13px;
 margin-top:12px;
 border:0;
 border-radius:9px;
 background:#2e7d32;
 color:#fff;
 font-size:16px;
 font-weight:bold;
 cursor:pointer
}

.bekleyen-sayisi{
 background:#fff3cd;
 padding:10px;
 border-radius:8px;
 margin-bottom:15px;
 text-align:center;
 font-weight:bold
}

.bos{
 background:#fff;
 border-radius:12px;
 padding:30px;
 text-align:center;
 color:#777
}
</style>
</head>

<body>

<header>
<h1>🧑‍🍳 DİJİTAL KAHVEM - GARSON</h1>
</header>

<div class="container">

<div class="baslik">
<h2>📋 Siparişler</h2>

<div id="bekleyenSayisi">
Bekleyen sipariş: 0
</div>
</div>

<div id="siparisler"></div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
 getFirestore,
 collection,
 query,
 orderBy,
 onSnapshot,
 updateDoc,
 doc
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   AYNI FIREBASE CONFIG
===================================================== */

const firebaseConfig={

 apiKey:"BURAYA_API_KEY",
 authDomain:"BURAYA.firebaseapp.com",
 projectId:"BURAYA_PROJECT_ID",
 storageBucket:"BURAYA.firebasestorage.app",
 messagingSenderId:"BURAYA_MESSAGING_SENDER_ID",
 appId:"BURAYA_APP_ID"

};


const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);


/* =====================================================
   TÜM SİPARİŞLER
===================================================== */

const siparisQuery=
query(
 collection(db,"siparisler"),
 orderBy("olusturmaZamani","desc")
);


onSnapshot(
 siparisQuery,
 snapshot=>{

  const alan=
   document.getElementById(
    "siparisler"
   );

  alan.innerHTML="";

  let bekleyen=0;


  if(snapshot.empty){

   alan.innerHTML=`
    <div class="bos">
     Henüz sipariş yok.
    </div>
   `;

   return;

  }


  snapshot.forEach(
   item=>{

    const siparis={
     id:item.id,
     ...item.data()
    };


    const onayli=
     siparis.durum==="Onaylandı";


    if(!onayli)
     bekleyen++;


    let zaman=
     "Saat bilgisi bekleniyor";


    if(
     siparis.olusturmaZamani
    ){

     const tarih=
      siparis.olusturmaZamani
      .toDate();

     zaman=
      tarih.toLocaleString(
       "tr-TR",
       {
        day:"2-digit",
        month:"2-digit",
        year:"numeric",
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit"
       }
      );

    }


    let urunler="";


    (siparis.urunler||[])
    .forEach(
     u=>{

      urunler+=`

       <div class="urun">

        <span>
         ${u.adet} × ${u.urun}
        </span>

        <b>
         ${u.tutar} ₺
        </b>

       </div>

      `;

     }
    );


    alan.innerHTML+=`

     <div class="siparis ${
      onayli?"onayli":""
     }">

      <div class="ustbilgi">

       <div>

        <div class="masa">
         MASA ${siparis.masa}
        </div>

        <div class="saat">
         🕐 ${zaman}
        </div>

       </div>

       <div class="durum">

        ${
         onayli
         ?"🟢 ONAYLANDI"
         :"🟡 BEKLİYOR"
        }

       </div>

      </div>

      ${urunler}

      <div class="toplam">

       Toplam:
       ${siparis.toplam} ₺

      </div>

      ${
       !onayli
       ?`

        <button
         onclick="siparisOnayla('${siparis.id}')">

         ✅ SİPARİŞİ ONAYLA

        </button>

       `
       :""
      }

     </div>

    `;

   }
  );


  document.getElementById(
   "bekleyenSayisi"
  ).textContent=
   "Bekleyen sipariş: "+
   bekleyen;

 }
);


/* =====================================================
   ONAYLA
===================================================== */

window.siparisOnayla=
async function(id){

 if(
  !confirm(
   "Bu siparişi onaylamak istiyor musunuz?"
  )
 )
 return;


 try{

  await updateDoc(
   doc(
    db,
    "siparisler",
    id
   ),
   {
    durum:"Onaylandı",
    onayZamani:
     new Date()
   }
  );

 }
 catch(hata){

  console.error(hata);

  alert(
   "Sipariş onaylanamadı."
  );

 }

};

</script>

</body>
</html>
