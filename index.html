<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dijital Kahvehane</title>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    padding:0;
    padding-bottom:90px;
    font-family:Arial,sans-serif;
    background:#f4f1ee;
    color:#29211d;
}

.header{
    background:linear-gradient(135deg,#3e2723,#6d4033);
    color:white;
    padding:22px 15px;
    text-align:center;
    border-radius:0 0 20px 20px;
    box-shadow:0 4px 15px rgba(0,0,0,.18);
}

.header h2{
    margin:0;
    font-size:23px;
}

.header small{
    display:block;
    margin-top:7px;
    opacity:.85;
}

.nav-btns{
    display:flex;
    gap:8px;
    padding:14px 12px;
    position:sticky;
    top:0;
    z-index:20;
    background:#f4f1ee;
}

.nav-btns button{
    flex:1;
    border:0;
    padding:13px 5px;
    border-radius:12px;
    background:#dfd6d0;
    color:#4e342e;
    font-weight:bold;
    cursor:pointer;
}

.nav-btns button.active{
    background:#5d4037;
    color:white;
}

.page{
    display:none;
    padding:0 12px;
}

.page.active{
    display:block;
}

/* MENÜ */

.kategori-baslik{
    color:#5d4037;
    border-bottom:2px solid #d7ccc8;
    padding-bottom:7px;
    margin:16px 0 10px;
}

.card{
    background:white;
    padding:14px;
    margin-bottom:9px;
    border-radius:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 2px 8px rgba(0,0,0,.07);
}

.qty-box{
    display:flex;
    align-items:center;
    gap:9px;
}

.qty-box button{
    width:36px;
    height:36px;
    border:0;
    border-radius:50%;
    background:#5d4037;
    color:white;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
}

.qty-box span{
    min-width:22px;
    text-align:center;
    font-weight:bold;
}

.btn-red{
    width:100%;
    border:0;
    background:#c62828;
    color:white;
    padding:16px;
    border-radius:13px;
    font-size:17px;
    font-weight:bold;
    margin-top:15px;
    cursor:pointer;
}

.btn-red:disabled{
    background:#888;
}

/* SEPET */

.sepet-bar{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:50;
    display:none;
    justify-content:space-between;
    align-items:center;
    padding:13px 15px;
    background:#29211d;
    color:white;
    box-shadow:0 -4px 15px rgba(0,0,0,.25);
}

.sepet-bar button{
    border:0;
    background:#43a047;
    color:white;
    padding:11px 20px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

/* HESAP */

.hesap-card{
    background:white;
    padding:15px;
    margin-bottom:12px;
    border-radius:14px;
    border-left:6px solid #ff9800;
    box-shadow:0 2px 8px rgba(0,0,0,.07);
}

.hesap-card.onayli{
    border-left-color:#43a047;
}

.hesap-baslik{
    display:flex;
    justify-content:space-between;
    font-weight:bold;
    color:#5d4037;
    margin-bottom:8px;
}

.siparis-urun-satir{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:6px 0;
    border-bottom:1px dashed #ddd;
}

/* YAZ BOZ */

.mod-btns{
    display:flex;
    gap:8px;
    margin-bottom:14px;
}

.mod-btns button{
    flex:1;
    border:0;
    padding:13px 5px;
    border-radius:12px;
    background:#e0d7d2;
    color:#4e342e;
    font-weight:bold;
    cursor:pointer;
}

.mod-btns button.active{
    background:#3e2723;
    color:white;
}

.yazboz-kart{
    background:white;
    padding:14px;
    border-radius:16px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    margin-bottom:14px;
}

.kurulum input,
.kurulum select{
    width:100%;
    padding:13px;
    margin:7px 0 12px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

.baslat-btn{
    width:100%;
    border:0;
    padding:14px;
    background:#388e3c;
    color:white;
    border-radius:11px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

/* EL KARTI */

.el-card{
    background:white;
    border-radius:14px;
    margin-bottom:14px;
    padding:12px;
    border:2px solid #ddd;
    box-shadow:0 2px 8px rgba(0,0,0,.07);
}

.el-card.aktif{
    border-color:#ff9800;
}

.el-card.kilitli{
    border-color:#43a047;
    background:#f8fff8;
}

.el-card.bekliyor{
    opacity:.65;
}

.el-baslik{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
    font-weight:bold;
}

.el-no{
    font-size:18px;
    color:#5d4037;
}

.durum{
    padding:6px 9px;
    border-radius:8px;
    font-size:12px;
}

.durum-aktif{
    background:#fff3cd;
    color:#e65100;
}

.durum-bekliyor{
    background:#eeeeee;
    color:#777;
}

.durum-kilitli{
    background:#e8f5e9;
    color:#2e7d32;
}

.skor-table{
    width:100%;
    border-collapse:collapse;
}

.skor-table th,
.skor-table td{
    border:1px solid #ddd;
    padding:7px;
    text-align:center;
}

.skor-table th{
    background:#5d4037;
    color:white;
}

.skor-table input{
    width:100%;
    min-width:50px;
    padding:9px 3px;
    border:1px solid #ccc;
    border-radius:7px;
    text-align:center;
    font-size:16px;
}

.skor-table input:disabled{
    background:#eeeeee;
    color:#777;
}

.oyuncu-adi{
    background:#5d4037 !important;
    color:white !important;
    border:none !important;
    font-weight:bold;
}

.el-sayac{
    text-align:center;
    background:#fff3e0;
    color:#e65100;
    border-radius:10px;
    padding:10px;
    margin-top:10px;
    font-weight:bold;
}

.el-kilit{
    text-align:center;
    background:#e8f5e9;
    color:#2e7d32;
    border-radius:10px;
    padding:10px;
    margin-top:10px;
    font-weight:bold;
}

.el-bekle{
    text-align:center;
    background:#eeeeee;
    color:#777;
    border-radius:10px;
    padding:10px;
    margin-top:10px;
}

.toplam-table{
    width:100%;
    border-collapse:collapse;
    margin-top:8px;
}

.toplam-table td{
    border:1px solid #ddd;
    padding:7px;
    text-align:center;
    font-weight:bold;
}

.fark-row td{
    background:#ffebee;
    color:#c62828;
}

.oyun-tamam{
    text-align:center;
    background:#e8f5e9;
    color:#2e7d32;
    padding:15px;
    border-radius:12px;
    font-weight:bold;
}

.yeni-oyun{
    width:100%;
    border:0;
    background:#c62828;
    color:white;
    padding:13px;
    border-radius:10px;
    font-weight:bold;
    margin-top:12px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="header">
    <h2>☕ DİJİTAL KAHVEHANE</h2>
    <small id="masaEtiket">MASA 1</small>
</div>

<div class="nav-btns">
    <button id="btn-menu" class="active" onclick="sayfaAc('menu')">
        ☕ Menü
    </button>

    <button id="btn-hesap" onclick="sayfaAc('hesap')">
        🧾 Hesap
    </button>

    <button id="btn-yazboz" onclick="sayfaAc('yazboz')">
        📝 Yaz-Boz
    </button>
</div>


<!-- ================= MENÜ ================= -->

<div id="page-menu" class="page active">

    <div id="urunListesi">
        Menü yükleniyor...
    </div>

    <button id="garsonBtn"
            class="btn-red"
            onclick="garsonCagir()">

        🔔 GARSON / OCAKÇI ÇAĞIR

    </button>

</div>


<!-- ================= HESAP ================= -->

<div id="page-hesap" class="page">

    <h3>Masa Hesabı</h3>

    <div id="hesapListesi">
        Yükleniyor...
    </div>

    <div id="hesapGenelToplam"
         style="text-align:right;font-weight:bold;font-size:19px;margin-top:12px;">
    </div>

</div>


<!-- ================= YAZ BOZ ================= -->

<div id="page-yazboz" class="page">

    <h3>📝 Dijital Yaz-Boz</h3>

    <div class="mod-btns">

        <button id="mod-tekli"
                class="active"
                onclick="modSec('tekli')">

            👤 Tekli Oyun

        </button>

        <button id="mod-esli"
                onclick="modSec('esli')">

            👥 Eşli Oyun

        </button>

    </div>

    <div id="yazbozAlan"></div>

</div>


<!-- ================= SEPET ================= -->

<div class="sepet-bar" id="sepetBar">

    <strong id="sepetToplam">
        0 TL
    </strong>

    <button onclick="siparisVer()">
        Sipariş Ver
    </button>

</div>


<script>

/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {
    databaseURL:
    "https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
    "dijitalkahve-67f0a",

    storageBucket:
    "dijitalkahve-67f0a.appspot.com",

    messagingSenderId:
    "326476599239"
};

if(!firebase.apps.length){
    firebase.initializeApp(firebaseConfig);
}

const db = firebase.app().database(
    "https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app"
);

const urlParams =
    new URLSearchParams(window.location.search);

const masa =
    urlParams.get('masa') || '1';

document.getElementById('masaEtiket').innerText =
    "MASA " + masa;


/* =========================================================
   MENÜ
========================================================= */

let urunlerData = {};
let sepet = {};

const kategoriIkon = {
    'Sıcak İçecekler':'☕',
    'Soğuk İçecekler':'🧊',
    'Tatlılar':'🍰',
    'Atıştırmalıklar':'🥪',
    'Diğer':'🍹'
};

const kategoriSirasi = [
    'Sıcak İçecekler',
    'Soğuk İçecekler',
    'Tatlılar',
    'Atıştırmalıklar',
    'Diğer'
];

db.ref('urunler').on('value', snapshot => {

    urunlerData =
        snapshot.val() || {};

    renderMenu();

});


function renderMenu(){

    const menu =
        document.getElementById('urunListesi');

    menu.innerHTML = '';

    const keys =
        Object.keys(urunlerData);

    if(keys.length === 0){

        menu.innerHTML =
            '<p style="text-align:center;">Henüz ürün eklenmemiş.</p>';

        return;
    }

    const gruplar = {};

    keys.forEach(key => {

        const kat =
            urunlerData[key].kategori || 'Diğer';

        if(!gruplar[kat])
            gruplar[kat] = [];

        gruplar[kat].push(key);

    });

    const kategoriler = [
        ...kategoriSirasi.filter(k => gruplar[k]),
        ...Object.keys(gruplar)
            .filter(k => !kategoriSirasi.includes(k))
    ];

    kategoriler.forEach(kat => {

        menu.innerHTML += `
            <h3 class="kategori-baslik">
                ${kategoriIkon[kat] || '🍽️'} ${kat}
            </h3>
        `;

        gruplar[kat].forEach(key => {

            const item =
                urunlerData[key];

            const adet =
                sepet[key]
                ? sepet[key].adet
                : 0;

            menu.innerHTML += `

                <div class="card">

                    <span>
                        <strong>${item.ad}</strong><br>
                        <small>${item.fiyat} TL</small>
                    </span>

                    <div class="qty-box">

                        <button onclick="adetDegistir('${key}',-1)">
                            −
                        </button>

                        <span id="adet-${key}">
                            ${adet}
                        </span>

                        <button onclick="adetDegistir('${key}',1)">
                            +
                        </button>

                    </div>

                </div>
            `;
        });
    });
}


function adetDegistir(key, delta){

    const item =
        urunlerData[key];

    if(!item)
        return;

    const mevcut =
        sepet[key]
        ? sepet[key].adet
        : 0;

    const yeni =
        Math.max(0, mevcut + delta);

    if(yeni === 0){

        delete sepet[key];

    }else{

        sepet[key] = {
            ad:item.ad,
            fiyat:item.fiyat,
            adet:yeni
        };

    }

    document.getElementById(
        `adet-${key}`
    ).innerText = yeni;

    sepetGuncelle();
}


function sepetGuncelle(){

    let toplam = 0;

    Object.values(sepet).forEach(i => {

        toplam +=
            (parseFloat(i.fiyat) || 0) *
            i.adet;

    });

    const bar =
        document.getElementById('sepetBar');

    if(toplam > 0){

        bar.style.display = 'flex';

        document.getElementById(
            'sepetToplam'
        ).innerText =
            toplam + ' TL';

    }else{

        bar.style.display = 'none';

    }
}


function siparisVer(){

    if(Object.keys(sepet).length === 0)
        return;

    const toplam =
        Object.values(sepet).reduce(
            (s,i) =>
                s +
                (parseFloat(i.fiyat) || 0) *
                i.adet,
            0
        );

    const saat =
        new Date().toLocaleTimeString(
            'tr-TR',
            {
                hour:'2-digit',
                minute:'2-digit'
            }
        );

    db.ref('siparisler').push({

        masa:masa,

        urunler:sepet,

        toplam:toplam,

        zaman:saat,

        durum:'bekliyor'

    }).then(() => {

        alert('Siparişiniz alındı.');

        sepet = {};

        renderMenu();

        sepetGuncelle();

    });
}


/* =========================================================
   HESAP
========================================================= */

db.ref('siparisler')
.orderByChild('masa')
.equalTo(masa)
.on('value', snapshot => {

    renderHesap(snapshot.val());

});


function renderHesap(data){

    const container =
        document.getElementById('hesapListesi');

    container.innerHTML = '';

    let genelToplam = 0;

    if(!data){

        container.innerHTML =
            '<p style="text-align:center;">Henüz sipariş verilmedi.</p>';

        document.getElementById(
            'hesapGenelToplam'
        ).innerText = '';

        return;
    }

    Object.keys(data).forEach(orderKey => {

        const siparis =
            data[orderKey];

        const urunler =
            siparis.urunler || {};

        const onaylandi =
            siparis.durum === 'onaylandi';

        let html = '';

        let toplam = 0;

        Object.keys(urunler).forEach(pKey => {

            const u =
                urunler[pKey];

            const tutar =
                (parseFloat(u.fiyat) || 0) *
                u.adet;

            toplam += tutar;

            html += `

                <div class="siparis-urun-satir">

                    <span>
                        ${u.ad} x${u.adet}
                    </span>

                    <span>
                        ${tutar} TL
                    </span>

                </div>

            `;

        });

        genelToplam += toplam;

        container.innerHTML += `

            <div class="hesap-card ${onaylandi?'onayli':''}">

                <div class="hesap-baslik">

                    <span>
                        ${onaylandi
                            ? '✅ Onaylandı'
                            : '⏳ Bekliyor'}
                    </span>

                    <span>
                        ${toplam} TL
                    </span>

                </div>

                ${html}

            </div>

        `;

    });

    document.getElementById(
        'hesapGenelToplam'
    ).innerText =
        'GENEL TOPLAM: ' +
        genelToplam +
        ' TL';
}


/* =========================================================
   GARSON ÇAĞIR
========================================================= */

let cagriBekleniyor = false;

db.ref('bildirimler')
.orderByChild('masa')
.equalTo(masa)
.on('value', snapshot => {

    cagriBekleniyor =
        snapshot.exists();

    const btn =
        document.getElementById(
            'garsonBtn'
        );

    if(cagriBekleniyor){

        btn.disabled = true;

        btn.innerText =
            '⏳ GARSON ÇAĞRILDI...';

    }else{

        btn.disabled = false;

        btn.innerText =
            '🔔 GARSON / OCAKÇI ÇAĞIR';

    }

});


function garsonCagir(){

    if(cagriBekleniyor)
        return;

    const saat =
        new Date().toLocaleTimeString(
            'tr-TR',
            {
                hour:'2-digit',
                minute:'2-digit'
            }
        );

    db.ref('bildirimler').push({

        masa:masa,

        zaman:saat

    });

}


/* =========================================================
   SAYFA
========================================================= */

function sayfaAc(sayfa){

    document
        .querySelectorAll('.page')
        .forEach(el =>
            el.classList.remove('active')
        );

    document
        .querySelectorAll('.nav-btns button')
        .forEach(el =>
            el.classList.remove('active')
        );

    document
        .getElementById('page-'+sayfa)
        .classList.add('active');

    document
        .getElementById('btn-'+sayfa)
        .classList.add('active');

}


/* =========================================================
   YAZ BOZ
========================================================= */

let mod = 'tekli';

let playerCount = 2;

let elSayisi = 7;

let yazbozOyunId = null;

let oyunDinlemeAktif = false;


/* =========================================================
   MOD SEÇ
========================================================= */

function modSec(secilen){

    mod = secilen;

    document.getElementById(
        'mod-tekli'
    ).classList.toggle(
        'active',
        secilen === 'tekli'
    );

    document.getElementById(
        'mod-esli'
    ).classList.toggle(
        'active',
        secilen === 'esli'
    );

    renderKurulum();
}


/* =========================================================
   KURULUM
========================================================= */

function renderKurulum(){

    document.getElementById(
        'yazbozAlan'
    ).innerHTML = `

        <div class="yazboz-kart kurulum">

            <h3>
                ${
                    mod === 'tekli'
                    ? '👤 Tekli Oyun'
                    : '👥 Eşli Oyun'
                }
            </h3>

            ${
                mod === 'tekli'

                ?

                `
                    <label>
                        Oyuncu Sayısı
                    </label>

                    <select id="oyuncuSayisi">

                        <option value="2">
                            2 Oyuncu
                        </option>

                        <option value="3">
                            3 Oyuncu
                        </option>

                        <option value="4">
                            4 Oyuncu
                        </option>

                    </select>
                `

                :

                `
                    <p>
                        Eşli oyunda 2 takım bulunur.
                    </p>
                `
            }

            <label>
                El Sayısı
            </label>

            <input
                type="number"
                id="elSayisiInput"
                min="1"
                max="50"
                value="7"
            >

            <button
                class="baslat-btn"
                onclick="oyunuBaslat()">

                🎮 Oyunu Başlat

            </button>

        </div>

    `;
}


/* =========================================================
   OYUN BAŞLAT
========================================================= */

function oyunuBaslat(){

    if(mod === 'tekli'){

        playerCount =
            parseInt(
                document.getElementById(
                    'oyuncuSayisi'
                ).value
            );

    }else{

        playerCount = 2;

    }

    elSayisi =
        parseInt(
            document.getElementById(
                'elSayisiInput'
            ).value
        ) || 7;

    if(elSayisi < 1)
        elSayisi = 1;

    yazbozOyunId =
        db.ref(
            'yazboz/' + masa
        ).push().key;

    const oyuncular = [];

    for(
        let i = 0;
        i < playerCount;
        i++
    ){

        oyuncular.push(
            mod === 'esli'
            ? 'Takım ' + (i+1)
            : 'Oyuncu ' + (i+1)
        );

    }

    /*
       TÜM ELLERİ BAŞTAN OLUŞTURUYORUZ.
    */

    const eller = {};

    for(
        let el = 1;
        el <= elSayisi;
        el++
    ){

        const skorlar = {};

        for(
            let i = 0;
            i < playerCount;
            i++
        ){

            skorlar[i] = '';

        }

        eller[el] = {

            skorlar:skorlar,

            baslangicZamani:null,

            kilitli:false

        };

    }

    const oyun = {

        id:yazbozOyunId,

        mod:mod,

        playerCount:playerCount,

        elSayisi:elSayisi,

        currentEl:1,

        oyuncular:oyuncular,

        eller:eller

    };

    db.ref(
        'yazboz/' +
        masa +
        '/' +
        yazbozOyunId
    ).set(oyun);

    oyunDinle(
        yazbozOyunId
    );
}


/* =========================================================
   OYUN DİNLE
========================================================= */

function oyunDinle(id){

    yazbozOyunId = id;

    db.ref(
        'yazboz/' +
        masa +
        '/' +
        id
    ).off();

    db.ref(
        'yazboz/' +
        masa +
        '/' +
        id
    ).on(
        'value',
        snapshot => {

            const oyun =
                snapshot.val();

            if(!oyun)
                return;

            oyunKontrol(oyun);

        }
    );
}


/* =========================================================
   OYUN KONTROL
========================================================= */

function oyunKontrol(oyun){

    const current =
        oyun.currentEl || 1;

    const eller =
        oyun.eller || {};

    const el =
        eller[current];

    if(!el)
        return;

    /*
       EL ZATEN KİLİTLİYSE
       BİR ŞEY YAPMA
    */

    if(el.kilitli){

        renderTumEller(oyun);

        return;
    }

    /*
       TÜM OYUNCULARIN SKORU GİRİLDİ Mİ?
    */

    let tumSkorlarGirildi = true;

    for(
        let i = 0;
        i < oyun.playerCount;
        i++
    ){

        const skor =
            el.skorlar
            ? el.skorlar[i]
            : '';

        if(
            skor === '' ||
            skor === null ||
            skor === undefined
        ){

            tumSkorlarGirildi = false;

            break;

        }

    }


    /*
       TÜM SKORLAR GİRİLDİYSE
       VE SAYAÇ HENÜZ BAŞLAMADIYSA
    */

    if(
        tumSkorlarGirildi &&
        !el.baslangicZamani
    ){

        db.ref(
            'yazboz/' +
            masa +
            '/' +
            oyun.id +
            '/eller/' +
            current +
            '/baslangicZamani'
        ).set(
            firebase.database.ServerValue.TIMESTAMP
        );

        return;

    }


    /*
       SAYAÇ BAŞLADIYSA
       60 SANİYEYİ KONTROL ET
    */

    if(
        el.baslangicZamani &&
        !el.kilitli
    ){

        const gecen =
            Date.now() -
            el.baslangicZamani;

        if(gecen >= 60000){

            eliKilitla(
                oyun.id,
                current,
                oyun.elSayisi
            );

            return;
        }

    }

    renderTumEller(oyun);
}


/* =========================================================
   EL KİLİTLE
========================================================= */

function eliKilitla(
    oyunId,
    elNo,
    toplamEl
){

    const updates = {};

    updates[
        'yazboz/' +
        masa +
        '/' +
        oyunId +
        '/eller/' +
        elNo +
        '/kilitli'
    ] = true;

    if(elNo < toplamEl){

        updates[
            'yazboz/' +
            masa +
            '/' +
            oyunId +
            '/currentEl'
        ] = elNo + 1;

    }

    db.ref().update(updates);
}


/* =========================================================
   TÜM ELLERİ RENDER
========================================================= */

function renderTumEller(oyun){

    const alan =
        document.getElementById(
            'yazbozAlan'
        );

    let html = '';

    html += `

        <div style="
            background:#5d4037;
            color:white;
            padding:14px;
            border-radius:12px;
            margin-bottom:14px;
            text-align:center;
            font-weight:bold;
        ">

            ${
                oyun.mod === 'tekli'
                ? '👤 Tekli Oyun'
                : '👥 Eşli Oyun'
            }

            <br>

            ${oyun.playerCount} Oyuncu /
            ${oyun.elSayisi} El

        </div>

    `;


    for(
        let elNo = 1;
        elNo <= oyun.elSayisi;
        elNo++
    ){

        const el =
            oyun.eller &&
            oyun.eller[elNo]
            ? oyun.eller[elNo]
            : {
                skorlar:{},
                kilitli:false
            };

        const aktif =
            elNo === oyun.currentEl &&
            !el.kilitli;

        const kilitli =
            !!el.kilitli;

        const bekliyor =
            elNo > oyun.currentEl;


        let durumText = '';

        let durumClass = '';

        if(kilitli){

            durumText = '🔒 Kilitli';

            durumClass =
                'durum-kilitli';

        }else if(aktif){

            durumText = '🟢 Aktif';

            durumClass =
                'durum-aktif';

        }else{

            durumText =
                '⏳ Bekliyor';

            durumClass =
                'durum-bekliyor';

        }


        html += `

            <div class="
                el-card
                ${aktif?'aktif':''}
                ${kilitli?'kilitli':''}
                ${bekliyor?'bekliyor':''}
            ">

                <div class="el-baslik">

                    <span class="el-no">
                        EL ${elNo}
                    </span>

                    <span class="durum ${durumClass}">
                        ${durumText}
                    </span>

                </div>

                <table class="skor-table">

                    <thead>

                        <tr>

        `;


        /*
           OYUNCU İSİMLERİ
        */

        for(
            let i = 0;
            i < oyun.playerCount;
            i++
        ){

            html += `

                <th>

                    <input
                        class="oyuncu-adi"
                        type="text"
                        value="${escapeHtml(
                            oyun.oyuncular[i] ||
                            'Oyuncu '+(i+1)
                        )}"
                        ${
                            !aktif
                            ? 'disabled'
                            : ''
                        }
                        onchange="
                            oyuncuAdiDegistir(
                                ${i},
                                this.value
                            )
                        "
                    >

                </th>

            `;

        }


        html += `

                        </tr>

                    </thead>

                    <tbody>

                        <tr>

        `;


        /*
           SKORLAR
        */

        for(
            let i = 0;
            i < oyun.playerCount;
            i++
        ){

            let value = '';

            if(
                el.skorlar &&
                el.skorlar[i] !== undefined
            ){

                value =
                    el.skorlar[i];

            }

            html += `

                <td>

                    <input
                        type="number"
                        value="${value}"
                        ${
                            !aktif
                            ? 'disabled'
                            : ''
                        }
                        oninput="
                            skorDegistir(
                                ${elNo},
                                ${i},
                                this.value
                            )
                        "
                    >

                </td>

            `;

        }


        html += `

                        </tr>

                    </tbody>

                </table>

        `;


        /*
           TOPLAMLAR
        */

        html += `

            <table class="toplam-table">

                <tr>

        `;

        const toplamlar = [];

        for(
            let i = 0;
            i < oyun.playerCount;
            i++
        ){

            toplamlar.push(
                toplamOyuncu(
                    oyun,
                    i,
                    elNo
                )
            );

        }

        const min =
            Math.min(...toplamlar);

        for(
            let i = 0;
            i < oyun.playerCount;
            i++
        ){

            html += `

                <td>
                    ${toplamlar[i]}
                </td>

            `;

        }

        html += `

                </tr>

                <tr class="fark-row">

        `;

        for(
            let i = 0;
            i < oyun.playerCount;
            i++
        ){

            const fark =
                toplamlar[i] - min;

            html += `

                <td>
                    ${
                        fark === 0
                        ? 'ÖNDE'
                        : '+' + fark
                    }
                </td>

            `;

        }

        html += `

                </tr>

            </table>

        `;


        /*
           AKTİF ELDE SAYAÇ
        */

        if(
            aktif &&
            el.baslangicZamani
        ){

            html += `

                <div
                    class="el-sayac"
                    id="sayac-${elNo}"
                >

                    ⏱️
                    Süre:
                    <strong>
                        ${kalanSure(
                            el.baslangicZamani
                        )}
                    </strong>

                </div>

            `;

        }


        /*
           KİLİTLİ
        */

        if(kilitli){

            html += `

                <div class="el-kilit">

                    🔒 Bu el kilitlendi.
                    Skorlar artık değiştirilemez.

                </div>

            `;

        }


        /*
           AKTİF AMA SKORLAR TAM DEĞİL
        */

        if(
            aktif &&
            !el.baslangicZamani
        ){

            html += `

                <div class="el-bekle">

                    👆 Bu elin
                    <strong>
                    tüm oyuncu skorlarını
                    </strong>
                    girin.

                    <br>

                    Tüm skorlar girilince
                    60 saniyelik süre başlayacak.

                </div>

            `;

        }


        /*
           SAYAÇ BAŞLAMIŞ
        */

        if(
            aktif &&
            el.baslangicZamani
        ){

            html += `

                <div class="el-sayac">

                    ⏱️
                    İki / tüm oyuncu skorları girildi.
                    Kilitlenmeye kalan süre:

                    <strong>
                        ${kalanSure(
                            el.baslangicZamani
                        )}
                    </strong>

                </div>

            `;

        }


        html += `

            </div>

        `;

    }


    /*
       OYUN BİTTİ
    */

    const sonEl =
        oyun.eller &&
        oyun.eller[oyun.elSayisi];

    if(
        sonEl &&
        sonEl.kilitli
    ){

        html += `

            <div class="oyun-tamam">

                🏆 OYUN TAMAMLANDI

                <br>

                Tüm ${oyun.elSayisi} el tamamlandı.

            </div>

            <button
                class="yeni-oyun"
                onclick="renderKurulum()"
            >

                🔄 Yeni Oyun

            </button>

        `;

    }


    alan.innerHTML = html;

}


/* =========================================================
   KALAN SÜRE
========================================================= */

function kalanSure(baslangic){

    const gecen =
        Date.now() - baslangic;

    const kalan =
        Math.max(
            0,
            60000 - gecen
        );

    return Math.ceil(
        kalan / 1000
    ) + ' saniye';

}


/* =========================================================
   SAYAÇ EKRANINI CANLI TUT
========================================================= */

setInterval(() => {

    if(!yazbozOyunId)
        return;

    db.ref(
        'yazboz/' +
        masa +
        '/' +
        yazbozOyunId
    ).once('value').then(snapshot => {

        const oyun =
            snapshot.val();

        if(!oyun)
            return;

        const current =
            oyun.currentEl;

        const el =
            oyun.eller &&
            oyun.eller[current];

        if(
            el &&
            el.baslangicZamani &&
            !el.kilitli
        ){

            const gecen =
                Date.now() -
                el.baslangicZamani;

            if(gecen >= 60000){

                eliKilitla(
                    oyun.id,
                    current,
                    oyun.elSayisi
                );

            }else{

                /*
                   Sadece sayacı güncelle.
                */

                const sayac =
                    document.getElementById(
                        'sayac-' + current
                    );

                if(sayac){

                    sayac.innerHTML = `

                        ⏱️
                        Kilitlenmeye kalan:

                        <strong>
                            ${kalanSure(
                                el.baslangicZamani
                            )}
                        </strong>

                    `;

                }

            }

        }

    });

},1000);


/* =========================================================
   SKOR DEĞİŞTİR
========================================================= */

function skorDegistir(
    elNo,
    oyuncu,
    value
){

    if(!yazbozOyunId)
        return;

    db.ref(
        'yazboz/' +
        masa +
        '/' +
        yazbozOyunId +
        '/eller/' +
        elNo +
        '/skorlar/' +
        oyuncu
    ).set(
        value === ''
        ? ''
        : parseInt(value) || 0
    );

}


/* =========================================================
   OYUNCU ADI
========================================================= */

function oyuncuAdiDegistir(
    index,
    value
){

    if(!yazbozOyunId)
        return;

    db.ref(
        'yazboz/' +
        masa +
        '/' +
        yazbozOyunId +
        '/oyuncular/' +
        index
    ).set(value);

}


/* =========================================================
   TOPLAM
========================================================= */

function toplamOyuncu(
    oyun,
    index,
    sonEl
){

    let toplam = 0;

    const eller =
        oyun.eller || {};

    for(
        let elNo = 1;
        elNo <= sonEl;
        elNo++
    ){

        const el =
            eller[elNo];

        if(
            el &&
            el.skorlar &&
            el.skorlar[index] !== undefined &&
            el.skorlar[index] !== ''
        ){

            toplam +=
                parseInt(
                    el.skorlar[index]
                ) || 0;

        }

    }

    return toplam;
}


/* =========================================================
   HTML GÜVENLİĞİ
========================================================= */

function escapeHtml(text){

    return String(text)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;');

}


/* =========================================================
   SON OYUNU BUL
========================================================= */

db.ref(
    'yazboz/' + masa
).on('value',snapshot => {

    const data =
        snapshot.val();

    if(!data)
        return;

    const keys =
        Object.keys(data);

    if(keys.length === 0)
        return;

    /*
       Son oluşturulan oyun
    */

    const sonId =
        keys[keys.length - 1];

    if(
        yazbozOyunId !== sonId
    ){

        oyunDinle(sonId);

    }

});


/* =========================================================
   BAŞLANGIÇ
========================================================= */

renderKurulum();

</script>
