<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dijital Kahvehane</title>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    padding:0;
    padding-bottom:85px;
    font-family:Arial,sans-serif;
    background:#f4f1ed;
    color:#30241f;
}

.header{
    background:linear-gradient(135deg,#3e2723,#6d4c41);
    color:white;
    padding:20px 15px;
    text-align:center;
    box-shadow:0 3px 10px rgba(0,0,0,.2);
}

.header h2{
    margin:0;
    font-size:23px;
    letter-spacing:.5px;
}

.header small{
    display:block;
    margin-top:6px;
    opacity:.85;
}

.nav-btns{
    display:flex;
    gap:7px;
    padding:12px;
    background:white;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.nav-btns button{
    flex:1;
    border:0;
    padding:11px 4px;
    border-radius:10px;
    background:#eee8e3;
    color:#5d4037;
    font-weight:bold;
    font-size:13px;
}

.nav-btns button.active{
    background:#5d4037;
    color:white;
}

.page{
    display:none;
    padding:10px 13px;
}

.page.active{
    display:block;
}

.kategori-baslik{
    color:#5d4037;
    font-size:17px;
    margin:18px 2px 9px;
    padding-bottom:6px;
    border-bottom:2px solid #d7ccc8;
}

.card{
    background:white;
    padding:12px;
    margin-bottom:8px;
    border-radius:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 2px 7px rgba(0,0,0,.07);
}

.urun-ad{
    font-weight:bold;
    font-size:15px;
}

.urun-fiyat{
    color:#8d6e63;
    font-size:13px;
    margin-top:3px;
}

.qty-box{
    display:flex;
    align-items:center;
    gap:7px;
}

.qty-box button{
    width:31px;
    height:31px;
    border-radius:50%;
    border:0;
    background:#5d4037;
    color:white;
    font-size:18px;
    font-weight:bold;
}

.qty-box span{
    min-width:18px;
    text-align:center;
    font-weight:bold;
}

.btn-red{
    width:100%;
    padding:15px;
    margin-top:12px;
    border:0;
    border-radius:11px;
    background:#c62828;
    color:white;
    font-size:16px;
    font-weight:bold;
    box-shadow:0 3px 8px rgba(198,40,40,.25);
}

.btn-red:disabled{
    background:#9e9e9e;
}

.sepet-bar{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:#263238;
    color:white;
    padding:11px 13px;
    display:none;
    justify-content:space-between;
    align-items:center;
    z-index:50;
    box-shadow:0 -3px 10px rgba(0,0,0,.25);
}

.sepet-bar button{
    border:0;
    background:#388e3c;
    color:white;
    padding:10px 18px;
    border-radius:9px;
    font-weight:bold;
}

.hesap-card{
    background:white;
    padding:13px;
    margin-bottom:10px;
    border-radius:12px;
    border-left:5px solid #ff9800;
    box-shadow:0 2px 7px rgba(0,0,0,.07);
}

.hesap-card.onayli{
    border-left-color:#388e3c;
}

.hesap-card.bekleyen{
    background:#fffaf2;
}

.hesap-baslik{
    display:flex;
    justify-content:space-between;
    gap:8px;
    font-weight:bold;
    margin-bottom:7px;
    color:#5d4037;
}

.durum-bekliyor{
    color:#ef6c00;
}

.durum-onayli{
    color:#2e7d32;
}

.siparis-urun-satir{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:6px 0;
    border-bottom:1px dashed #ddd;
    font-size:14px;
}

.bekleyen-bilgi{
    background:#fff3e0;
    color:#e65100;
    padding:8px;
    border-radius:8px;
    margin-top:8px;
    font-size:13px;
    text-align:center;
}

.toplam-kutu{
    margin-top:12px;
    padding:14px;
    background:#3e2723;
    color:white;
    border-radius:12px;
    text-align:right;
    font-size:18px;
    font-weight:bold;
}

/* YAZ BOZ */

.yazboz-wrapper{
    width:100%;
    max-width:430px;
    margin:0 auto;
}

.yazboz-box{
    background:white;
    border-radius:12px;
    padding:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.mod-btns{
    display:flex;
    gap:5px;
    margin-bottom:8px;
}

.mod-btns button{
    flex:1;
    padding:8px 3px;
    border:0;
    border-radius:7px;
    background:#eee8e3;
    color:#5d4037;
    font-size:12px;
    font-weight:bold;
}

.mod-btns button.active{
    background:#3e2723;
    color:white;
}

.yazboz-table{
    width:100%;
    border-collapse:collapse;
    font-size:11px;
}

.yazboz-table th,
.yazboz-table td{
    border:1px solid #ddd;
    padding:4px;
    text-align:center;
}

.yazboz-table th{
    background:#5d4037;
    color:white;
}

.yazboz-table input{
    width:100%;
    border:0;
    text-align:center;
    font-size:11px;
    padding:3px;
    background:transparent;
}

.yazboz-table input:disabled{
    color:#777;
    background:#eee;
}

.fark-row td{
    background:#fff3e0;
    color:#d32f2f;
    font-weight:bold;
}

.el-kilitli{
    background:#e8f5e9!important;
}

.sayac{
    text-align:center;
    font-size:11px;
    color:#d32f2f;
    font-weight:bold;
    margin:5px 0;
}

.oyun-kurulum{
    background:white;
    padding:12px;
    border-radius:10px;
}

.oyun-kurulum input,
.oyun-kurulum select{
    width:100%;
    padding:9px;
    margin:5px 0 8px;
    border:1px solid #ccc;
    border-radius:7px;
}

.baslat-btn{
    width:100%;
    border:0;
    background:#388e3c;
    color:white;
    padding:10px;
    border-radius:8px;
    font-weight:bold;
}

.yeni-oyun-btn{
    width:100%;
    margin-top:8px;
    padding:8px;
    border:0;
    border-radius:7px;
    background:#d32f2f;
    color:white;
    font-weight:bold;
}

.bos-mesaj{
    text-align:center;
    padding:20px;
    color:#888;
}
</style>
</head>

<body>

<div class="header">
    <h2>☕ DİJİTAL KAHVEHANE</h2>
    <small id="masaEtiket">MASA</small>
</div>

<div class="nav-btns">
    <button id="btn-menu" class="active" onclick="sayfaAc('menu')">☕ Menü</button>
    <button id="btn-hesap" onclick="sayfaAc('hesap')">🧾 Hesap</button>
    <button id="btn-yazboz" onclick="sayfaAc('yazboz')">📝 Yaz-Boz</button>
</div>

<!-- MENÜ -->
<div id="page-menu" class="page active">
    <div id="urunListesi">Menü yükleniyor...</div>

    <button class="btn-red" id="garsonBtn" onclick="garsonCagir()">
        🔔 GARSON / OCAKÇI ÇAĞIR
    </button>
</div>

<!-- HESAP -->
<div id="page-hesap" class="page">
    <h3>🧾 Masa Hesabı</h3>

    <div id="hesapListesi">
        <div class="bos-mesaj">Hesap yükleniyor...</div>
    </div>

    <div id="hesapGenelToplam"></div>
</div>

<!-- YAZ BOZ -->
<div id="page-yazboz" class="page">

    <div class="yazboz-wrapper">

        <div class="yazboz-box">

            <div class="mod-btns">
                <button id="mod-tekli"
                        class="active"
                        onclick="modSec('tekli')">
                    Tekli Oyun
                </button>

                <button id="mod-esli"
                        onclick="modSec('esli')">
                    Eşli Oyun
                </button>
            </div>

            <div id="yazbozAlan"></div>

        </div>

    </div>

</div>

<!-- SEPET -->
<div class="sepet-bar" id="sepetBar">
    <span id="sepetToplam">0 TL</span>
    <button onclick="siparisVer()">Sipariş Ver</button>
</div>

<script>

const firebaseConfig = {
    databaseURL:"https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId:"dijitalkahve-67f0a",
    storageBucket:"dijitalkahve-67f0a.appspot.com",
    messagingSenderId:"326476599239"
};

if(!firebase.apps.length){
    firebase.initializeApp(firebaseConfig);
}

const db = firebase.app().database(
    "https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app"
);

const urlParams = new URLSearchParams(window.location.search);
const masa = urlParams.get("masa") || "1";

document.getElementById("masaEtiket").innerText =
    "MASA " + masa;


/* =========================
   MENÜ
========================= */

let urunlerData = {};
let sepet = {};

const kategoriIkon = {
    "Sıcak İçecekler":"☕",
    "Soğuk İçecekler":"🧊",
    "Tatlılar":"🍰",
    "Atıştırmalıklar":"🥪",
    "Diğer":"🍹"
};

const kategoriSirasi = [
    "Sıcak İçecekler",
    "Soğuk İçecekler",
    "Tatlılar",
    "Atıştırmalıklar",
    "Diğer"
];

db.ref("urunler").on("value",snapshot=>{
    urunlerData = snapshot.val() || {};
    renderMenu();
});

function renderMenu(){

    const menu = document.getElementById("urunListesi");

    menu.innerHTML="";

    if(Object.keys(urunlerData).length===0){
        menu.innerHTML='<div class="bos-mesaj">Henüz ürün eklenmemiş.</div>';
        return;
    }

    const gruplar={};

    Object.keys(urunlerData).forEach(key=>{

        const kat =
            urunlerData[key].kategori || "Diğer";

        if(!gruplar[kat])
            gruplar[kat]=[];

        gruplar[kat].push(key);
    });

    const sirali=[
        ...kategoriSirasi.filter(k=>gruplar[k]),
        ...Object.keys(gruplar)
            .filter(k=>!kategoriSirasi.includes(k))
    ];

    sirali.forEach(kat=>{

        menu.innerHTML += `
        <h3 class="kategori-baslik">
            ${kategoriIkon[kat] || "🍽️"} ${kat}
        </h3>
        `;

        gruplar[kat].forEach(key=>{

            const item=urunlerData[key];

            const adet =
                sepet[key] ? sepet[key].adet : 0;

            menu.innerHTML += `
            <div class="card">

                <div>
                    <div class="urun-ad">
                        ${item.ad}
                    </div>

                    <div class="urun-fiyat">
                        ${item.fiyat} TL
                    </div>
                </div>

                <div class="qty-box">

                    <button onclick="adetDegistir('${key}',-1)">
                        −
                    </button>

                    <span id="adet-${key}">
                        ${adet}
                    </span>

                    <button onclick="adetDegistir('${key}',1)">
                        +
                    </button>

                </div>

            </div>
            `;
        });
    });
}

function adetDegistir(key,delta){

    const item=urunlerData[key];

    if(!item) return;

    const mevcut =
        sepet[key] ? sepet[key].adet : 0;

    const yeni=Math.max(0,mevcut+delta);

    if(yeni===0){

        delete sepet[key];

    }else{

        sepet[key]={
            ad:item.ad,
            fiyat:item.fiyat,
            adet:yeni
        };
    }

    const span=document.getElementById(
        "adet-"+key
    );

    if(span)
        span.innerText=yeni;

    sepetGuncelle();
}

function sepetGuncelle(){

    let toplam=0;

    Object.values(sepet).forEach(i=>{
        toplam +=
            (parseFloat(i.fiyat)||0)*i.adet;
    });

    const bar=
        document.getElementById("sepetBar");

    if(toplam>0){

        bar.style.display="flex";

        document.getElementById(
            "sepetToplam"
        ).innerText=toplam+" TL";

    }else{

        bar.style.display="none";
    }
}

function siparisVer(){

    if(Object.keys(sepet).length===0)
        return;

    const toplam=
        Object.values(sepet).reduce(
            (s,i)=>
                s+(parseFloat(i.fiyat)||0)*i.adet,
            0
        );

    const saat=
        new Date().toLocaleTimeString(
            "tr-TR",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    db.ref("siparisler").push({

        masa:masa,

        urunler:sepet,

        toplam:toplam,

        zaman:saat,

        durum:"bekliyor"

    }).then(()=>{

        alert("Siparişiniz garsona gönderildi.");

        sepet={};

        renderMenu();

        sepetGuncelle();

    }).catch(err=>{

        alert("Hata: "+err.message);

    });
}


/* =========================
   HESAP
========================= */

db.ref("siparisler")
.orderByChild("masa")
.equalTo(masa)
.on("value",snapshot=>{

    renderHesap(snapshot.val());

});

function renderHesap(data){

    const container=
        document.getElementById(
            "hesapListesi"
        );

    container.innerHTML="";

    let genelToplam=0;

    let bekleyenToplam=0;

    if(!data){

        container.innerHTML=
            '<div class="bos-mesaj">Henüz sipariş verilmedi.</div>';

        document.getElementById(
            "hesapGenelToplam"
        ).innerHTML="";

        return;
    }

    Object.keys(data).forEach(orderKey=>{

        const siparis=data[orderKey];

        const urunler=
            siparis.urunler || {};

        const onaylandi=
            siparis.durum==="onaylandi";

        let orderToplam=0;

        let urunHtml="";

        Object.keys(urunler).forEach(pKey=>{

            const u=urunler[pKey];

            const tutar=
                (parseFloat(u.fiyat)||0)*u.adet;

            orderToplam+=tutar;

            if(onaylandi){

                urunHtml += `
                <div class="siparis-urun-satir">
                    <span>
                        ${u.ad} × ${u.adet}
                    </span>

                    <span>
                        ${tutar} TL
                    </span>
                </div>
                `;

            }else{

                urunHtml += `
                <div class="siparis-urun-satir">

                    <span>
                        ${u.ad}
                    </span>

                    <div class="qty-box">

                        <button
                        onclick="siparisAdetDegistir(
                        '${orderKey}',
                        '${pKey}',
                        -1)">
                        −
                        </button>

                        <span>
                            ${u.adet}
                        </span>

                        <button
                        onclick="siparisAdetDegistir(
                        '${orderKey}',
                        '${pKey}',
                        1)">
                        +
                        </button>

                    </div>

                    <span>
                        ${tutar} TL
                    </span>

                </div>
                `;
            }
        });

        if(onaylandi){

            genelToplam+=orderToplam;

            container.innerHTML += `
            <div class="hesap-card onayli">

                <div class="hesap-baslik">

                    <span class="durum-onayli">
                        ✅ Onaylandı
                    </span>

                    <span>
                        ${orderToplam} TL
                    </span>

                </div>

                <small>
                    Saat: ${siparis.zaman}
                </small>

                <div>
                    ${urunHtml}
                </div>

            </div>
            `;

        }else{

            bekleyenToplam+=orderToplam;

            container.innerHTML += `
            <div class="hesap-card bekleyen">

                <div class="hesap-baslik">

                    <span class="durum-bekliyor">
                        ⏳ Onay Bekliyor
                    </span>

                    <span>
                        ${orderToplam} TL
                    </span>

                </div>

                <small>
                    Saat: ${siparis.zaman}
                </small>

                <div>
                    ${urunHtml}
                </div>

                <div class="bekleyen-bilgi">
                    Siparişiniz garson tarafından
                    onaylandığında hesaba eklenecek.
                </div>

            </div>
            `;
        }

    });

    let html="";

    if(genelToplam>0){

        html += `
        <div class="toplam-kutu">
            ÖDENECEK HESAP:
            ${genelToplam} TL
        </div>
        `;
    }

    if(bekleyenToplam>0){

        html += `
        <div style="
            margin-top:8px;
            text-align:right;
            color:#e65100;
            font-size:13px;
        ">
            ⏳ Onay bekleyen:
            ${bekleyenToplam} TL
        </div>
        `;
    }

    document.getElementById(
        "hesapGenelToplam"
    ).innerHTML=html;
}

function siparisAdetDegistir(
    orderKey,
    productKey,
    delta
){

    db.ref(
        "siparisler/"+orderKey+"/durum"
    ).once("value").then(statusSnap=>{

        if(statusSnap.val()==="onaylandi"){

            alert(
                "Bu sipariş artık onaylandı ve değiştirilemez."
            );

            return;
        }

        const ref=
            db.ref(
                "siparisler/"
                +orderKey+
                "/urunler/"
                +productKey
            );

        ref.once("value").then(snap=>{

            const u=snap.val();

            if(!u) return;

            const yeni=
                Math.max(0,u.adet+delta);

            if(yeni===0){

                ref.remove().then(()=>{
                    siparisToplamGuncelle(orderKey);
                });

            }else{

                ref.update({
                    adet:yeni
                }).then(()=>{
                    siparisToplamGuncelle(orderKey);
                });
            }
        });
    });
}

function siparisToplamGuncelle(orderKey){

    db.ref(
        "siparisler/"
        +orderKey+
        "/urunler"
    ).once("value").then(snap=>{

        const urunler=snap.val()||{};

        if(Object.keys(urunler).length===0){

            db.ref(
                "siparisler/"+orderKey
            ).remove();

            return;
        }

        let toplam=0;

        Object.values(urunler).forEach(u=>{

            toplam +=
                (parseFloat(u.fiyat)||0)
                *u.adet;

        });

        db.ref(
            "siparisler/"
            +orderKey+
            "/toplam"
        ).set(toplam);
    });
}


/* =========================
   GARSON ÇAĞRI
========================= */

let cagriBekleniyor=false;

db.ref("bildirimler")
.orderByChild("masa")
.equalTo(masa)
.on("value",snapshot=>{

    cagriBekleniyor=
        snapshot.exists();

    const btn=
        document.getElementById(
            "garsonBtn"
        );

    if(cagriBekleniyor){

        btn.disabled=true;

        btn.innerText=
            "⏳ GARSON ÇAĞRILDI";

    }else{

        btn.disabled=false;

        btn.innerText=
            "🔔 GARSON / OCAKÇI ÇAĞIR";
    }
});

function garsonCagir(){

    if(cagriBekleniyor)
        return;

    const saat=
        new Date().toLocaleTimeString(
            "tr-TR",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    db.ref("bildirimler").push({

        masa:masa,

        zaman:saat

    });
}


/* =========================
   SAYFALAR
========================= */

function sayfaAc(sayfa){

    document
        .querySelectorAll(".page")
        .forEach(el=>
            el.classList.remove("active")
        );

    document
        .querySelectorAll(".nav-btns button")
        .forEach(el=>
            el.classList.remove("active")
        );

    document
        .getElementById("page-"+sayfa)
        .classList.add("active");

    document
        .getElementById("btn-"+sayfa)
        .classList.add("active");
}


/* =========================
   YAZ BOZ
========================= */

let mod="tekli";

let playerCount=2;

let elSayisi=7;

let oyunBasladi=false;

let oyuncuIsimleri=[];


/* MOD */

function modSec(secilen){

    mod=secilen;

    document
        .getElementById("mod-tekli")
        .classList.toggle(
            "active",
            secilen==="tekli"
        );

    document
        .getElementById("mod-esli")
        .classList.toggle(
            "active",
            secilen==="esli"
        );

    renderKurulum();
}


/* KURULUM */

function renderKurulum(){

    document.getElementById(
        "yazbozAlan"
    ).innerHTML=`

        <div class="oyun-kurulum">

            <label>
                <b>El Sayısı</b>
            </label>

            <input
                type="number"
                id="elSayisiInput"
                min="1"
                value="7"
            >

            ${
                mod==="tekli"
                ?
                `
                <label>
                    <b>Oyuncu Sayısı</b>
                </label>

                <select id="oyuncuSayisi">

                    <option value="2">
                        2 Oyuncu
                    </option>

                    <option value="3">
                        3 Oyuncu
                    </option>

                    <option value="4">
                        4 Oyuncu
                    </option>

                </select>
                `
                :
                `
                <div style="
                    background:#f4f1ed;
                    padding:8px;
                    border-radius:7px;
                    margin-bottom:8px;
                    font-size:12px;
                ">
                    Eşli Oyun:
                    <b>2 Takım</b>
                </div>
                `
            }

            <button
                class="baslat-btn"
                onclick="oyunuBaslat()">
                Oyunu Başlat
            </button>

        </div>
    `;
}


/* OYUN BAŞLAT */

function oyunuBaslat(){

    elSayisi=
        parseInt(
            document.getElementById(
                "elSayisiInput"
            ).value
        ) || 7;

    if(elSayisi<1)
        elSayisi=1;

    if(mod==="tekli"){

        playerCount=
            parseInt(
                document.getElementById(
                    "oyuncuSayisi"
                ).value
            );

    }else{

        playerCount=2;
    }

    oyunBasladi=true;

    renderYazbozTable();
}


/* TABLO */

function renderYazbozTable(){

    oyuncuIsimleri=[];

    for(let i=0;i<playerCount;i++){

        oyuncuIsimleri.push(
            mod==="esli"
            ?
            "Takım "+(i+1)
            :
            "Oyuncu "+(i+1)
        );
    }

    let headHtml="";

    for(let i=0;i<playerCount;i++){

        headHtml+=`
        <th>
            <input
                type="text"
                value="${oyuncuIsimleri[i]}"
                onchange="
                    oyuncuIsimleri[${i}]=this.value
                "
            >
        </th>
        `;
    }

    let totalHtml="";

    let farkHtml="";

    for(let i=0;i<playerCount;i++){

        totalHtml+=`
            <td id="tot${i}">
                0
            </td>
        `;

        farkHtml+=`
            <td id="fark${i}">
                -
            </td>
        `;
    }

    let rows="";

    for(let el=0;el<elSayisi;el++){

        rows+=`

        <tr id="el-row-${el}">

            ${
                Array.from(
                    {length:playerCount},
                    (_,i)=>`

                    <td>

                        <input
                            type="number"
                            id="skor-${el}-${i}"
                            value=""
                            placeholder="0"
                            oninput="
                                skorDegisti(${el})
                            "
                        >

                    </td>

                    `
                ).join("")
            }

        </tr>

        <tr
            id="timer-row-${el}"
            style="display:none"
        >

            <td
                colspan="${playerCount}"
                class="sayac"
                id="timer-${el}"
            >
                ⏱️ 01:00
            </td>

        </tr>

        `;
    }

    document.getElementById(
        "yazbozAlan"
    ).innerHTML=`

        <div
            style="
            text-align:center;
            font-size:11px;
            margin-bottom:5px;
            color:#666;
            "
        >
            ${elSayisi} el •
            ${
                mod==="esli"
                ?
                "Eşli Oyun"
                :
                playerCount+" Oyuncu"
            }
        </div>

        <table class="yazboz-table">

            <thead>
                <tr>
                    ${headHtml}
                </tr>
            </thead>

            <tbody id="yazbozBody">
                ${rows}
            </tbody>

            <tfoot>

                <tr style="
                    font-weight:bold;
                    background:#eee;
                ">
                    ${totalHtml}
                </tr>

                <tr class="fark-row">
                    ${farkHtml}
                </tr>

            </tfoot>

        </table>

        <div style="
            font-size:9px;
            color:#777;
            margin-top:4px;
        ">
            Her iki oyuncunun skoru girilince
            1 dakikalık süre başlar.
        </div>

        <button
            class="yeni-oyun-btn"
            onclick="renderKurulum()">
            Yeni Oyun
        </button>

    `;
}


/* SKOR DEĞİŞTİ */

function skorDegisti(el){

    const row=
        document.getElementById(
            "el-row-"+el
        );

    const inputs=
        row.querySelectorAll("input");

    let hepsiDolu=true;

    inputs.forEach(input=>{

        if(input.value===""){
            hepsiDolu=false;
        }
    });

    /*
       Birinci el dolmadan ikinci el
       için zaten kullanıcıya alan
       görünür ama aktif değildir.
    */

    if(!hepsiDolu)
        return;

    /* TÜM SKORLAR GİRİLDİ */

    inputs.forEach(input=>{
        input.disabled=true;
    });

    const timerRow=
        document.getElementById(
            "timer-row-"+el
        );

    timerRow.style.display="table-row";

    let kalan=60;

    const timer=
        document.getElementById(
            "timer-"+el
        );

    timer.innerText=
        "⏱️ 01:00";

    const interval=
        setInterval(()=>{

            kalan--;

            const dakika=
                String(
                    Math.floor(kalan/60)
                ).padStart(2,"0");

            const saniye=
                String(
                    kalan%60
                ).padStart(2,"0");

            timer.innerText=
                "⏱️ "+dakika+":"+saniye;

            if(kalan<=0){

                clearInterval(interval);

                timer.innerText=
                    "🔒 EL KİLİTLENDİ";

                timer.style.color=
                    "#2e7d32";

                row.classList.add(
                    "el-kilitli"
                );

                skorDegistiToplam();
            }

        },1000);

    skorDegistiToplam();
}


/* TOPLAM */

function skorDegistiToplam(){

    let totals=
        new Array(playerCount).fill(0);

    for(
        let el=0;
        el<elSayisi;
        el++
    ){

        for(
            let oyuncu=0;
            oyuncu<playerCount;
            oyuncu++
        ){

            const input=
                document.getElementById(
                    `skor-${el}-${oyuncu}`
                );

            if(input){

                totals[oyuncu]+=
                    parseInt(input.value)||0;
            }
        }
    }

    const minTotal=
        Math.min(...totals);

    for(
        let i=0;
        i<playerCount;
        i++
    ){

        const total=
            document.getElementById(
                "tot"+i
            );

        const fark=
            document.getElementById(
                "fark"+i
            );

        if(total)
            total.innerText=
                totals[i];

        if(fark){

            const farkDegeri=
                totals[i]-minTotal;

            fark.innerText=
                farkDegeri===0
                ?
                "ÖNDE"
                :
                "+"+farkDegeri;
        }
    }
}


/* İLK AÇILIŞ */

renderKurulum();

</script>
