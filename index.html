<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dijital Kahvehane</title>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f1ed;
    color:#292321;
    padding-bottom:90px;
}

.header{
    background:linear-gradient(135deg,#2d1b16,#5d4037);
    color:white;
    padding:22px 18px;
    text-align:center;
    border-radius:0 0 20px 20px;
    box-shadow:0 4px 15px rgba(0,0,0,.18);
}

.header h2{
    margin:0;
    font-size:23px;
    letter-spacing:.5px;
}

.header small{
    display:block;
    margin-top:6px;
    opacity:.8;
    font-size:13px;
}

.nav-btns{
    display:flex;
    gap:8px;
    padding:12px;
    position:sticky;
    top:0;
    z-index:20;
    background:#f5f1ed;
}

.nav-btns button{
    flex:1;
    border:0;
    padding:13px 5px;
    border-radius:12px;
    background:#e6ddd8;
    color:#5d4037;
    font-weight:bold;
    font-size:13px;
    cursor:pointer;
    transition:.2s;
}

.nav-btns button.active{
    background:#5d4037;
    color:white;
    box-shadow:0 3px 8px rgba(93,64,55,.3);
}

.page{
    display:none;
    padding:0 12px;
}

.page.active{
    display:block;
}

.section-title{
    font-size:20px;
    margin:10px 0 15px;
    color:#3e2723;
}

.kategori-baslik{
    color:#5d4037;
    font-size:17px;
    margin:20px 0 10px;
    display:flex;
    align-items:center;
    gap:7px;
}

.kategori-baslik:first-child{
    margin-top:4px;
}

.card{
    background:white;
    padding:14px;
    margin-bottom:9px;
    border-radius:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 2px 8px rgba(0,0,0,.07);
    border:1px solid #eee;
}

.urun-ad{
    font-size:16px;
    font-weight:bold;
    color:#302825;
}

.urun-fiyat{
    display:block;
    margin-top:4px;
    color:#8d6e63;
    font-size:13px;
}

.qty-box{
    display:flex;
    align-items:center;
    gap:8px;
}

.qty-box button{
    width:36px;
    height:36px;
    border-radius:50%;
    border:none;
    background:#5d4037;
    color:white;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
}

.qty-box span{
    min-width:22px;
    text-align:center;
    font-weight:bold;
}

.btn-red{
    background:linear-gradient(135deg,#c62828,#e53935);
    color:white;
    border:none;
    width:100%;
    padding:16px;
    border-radius:13px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:15px;
    box-shadow:0 4px 10px rgba(198,40,40,.25);
}

.btn-red:disabled{
    background:#999;
}

.sepet-bar{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:#292321;
    color:white;
    padding:12px 15px;
    display:none;
    justify-content:space-between;
    align-items:center;
    z-index:100;
    box-shadow:0 -4px 15px rgba(0,0,0,.2);
}

.sepet-bar strong{
    font-size:18px;
}

.sepet-bar button{
    background:#388e3c;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

/* HESAP */

.hesap-card{
    background:white;
    padding:15px;
    margin-bottom:10px;
    border-radius:14px;
    border-left:5px solid #ff9800;
    box-shadow:0 2px 8px rgba(0,0,0,.07);
}

.hesap-card.onayli{
    border-left-color:#388e3c;
}

.hesap-baslik{
    display:flex;
    justify-content:space-between;
    font-weight:bold;
    margin-bottom:8px;
    color:#5d4037;
}

.siparis-urun-satir{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:7px 0;
    border-bottom:1px dashed #ddd;
    font-size:14px;
    gap:5px;
}

.toplam-box{
    background:#3e2723;
    color:white;
    padding:15px;
    border-radius:14px;
    margin-top:15px;
    text-align:right;
    font-size:19px;
    font-weight:bold;
}

/* YAZ BOZ */

.mod-btns{
    display:flex;
    gap:8px;
    margin-bottom:15px;
}

.mod-btns button{
    flex:1;
    border:none;
    padding:13px 5px;
    border-radius:11px;
    background:#e5ddd9;
    color:#5d4037;
    font-weight:bold;
    cursor:pointer;
}

.mod-btns button.active{
    background:#5d4037;
    color:white;
}

.kurulum-card{
    background:white;
    padding:18px;
    border-radius:16px;
    box-shadow:0 2px 10px rgba(0,0,0,.07);
}

.kurulum-card label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
    color:#5d4037;
}

.kurulum-card input,
.isim-input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:9px;
    font-size:15px;
    outline:none;
}

.baslat-btn{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:0;
    border-radius:10px;
    background:#388e3c;
    color:white;
    font-weight:bold;
    font-size:16px;
}

.yazboz-wrapper{
    background:white;
    padding:10px;
    border-radius:15px;
    box-shadow:0 2px 10px rgba(0,0,0,.07);
    overflow-x:auto;
}

.yazboz-table{
    width:100%;
    min-width:500px;
    border-collapse:collapse;
}

.yazboz-table th,
.yazboz-table td{
    border:1px solid #ddd;
    padding:7px;
    text-align:center;
}

.yazboz-table th{
    background:#5d4037;
    color:white;
}

.yazboz-table td{
    background:#fff;
}

.yazboz-table input{
    width:100%;
    min-width:55px;
    padding:8px 3px;
    text-align:center;
    border:1px solid #ddd;
    border-radius:6px;
    font-size:15px;
}

.yazboz-table input:disabled{
    background:#eee;
    color:#777;
}

.toplam-satiri td{
    background:#eee;
    font-weight:bold;
}

.fark-row td{
    font-weight:bold;
    color:#c62828;
    background:#ffebee;
}

.kilitli-row td{
    background:#f0f0f0 !important;
}

.el-baslik{
    text-align:center;
    font-weight:bold;
    color:#5d4037;
    margin-bottom:10px;
}

.kilit-sure{
    font-size:12px;
    color:#c62828;
    margin-top:3px;
}

.kilit-sure.kilitli{
    color:#777;
}

.yazboz-buttons{
    display:flex;
    gap:7px;
    margin-top:12px;
}

.yazboz-buttons button{
    flex:1;
    padding:11px 5px;
    border:none;
    border-radius:9px;
    font-weight:bold;
    cursor:pointer;
}

.btn-el{
    background:#5d4037;
    color:white;
}

.btn-yeni{
    background:#d32f2f;
    color:white;
}

.bilgi{
    margin-top:10px;
    padding:10px;
    border-radius:9px;
    background:#fff8e1;
    color:#795548;
    font-size:12px;
    text-align:center;
}

.empty{
    text-align:center;
    background:white;
    padding:25px 15px;
    border-radius:14px;
    color:#888;
}

@media(max-width:500px){
    .header h2{
        font-size:20px;
    }

    .nav-btns button{
        font-size:12px;
    }

    .card{
        padding:12px;
    }

    .qty-box button{
        width:34px;
        height:34px;
    }
}
</style>
</head>

<body>

<div class="header">
    <h2>☕ DİJİTAL KAHVEHANE</h2>
    <small id="masaEtiket">MASA 1</small>
</div>

<div class="nav-btns">
    <button onclick="sayfaAc('menu')" id="btn-menu" class="active">☕ Menü</button>
    <button onclick="sayfaAc('hesap')" id="btn-hesap">🧾 Hesap</button>
    <button onclick="sayfaAc('yazboz')" id="btn-yazboz">📝 Yaz-Boz</button>
</div>


<!-- ================= MENÜ ================= -->

<div id="page-menu" class="page active">

    <div class="section-title">Menü</div>

    <div id="urunListesi">
        <div class="empty">Menü yükleniyor...</div>
    </div>

    <button class="btn-red" id="garsonBtn" onclick="garsonCagir()">
        🔔 GARSON / OCAKÇI ÇAĞIR
    </button>

</div>


<!-- ================= HESAP ================= -->

<div id="page-hesap" class="page">

    <div class="section-title">🧾 Masa Hesabı</div>

    <div id="hesapListesi">
        <div class="empty">Yükleniyor...</div>
    </div>

    <div id="hesapGenelToplam"></div>

</div>


<!-- ================= YAZ BOZ ================= -->

<div id="page-yazboz" class="page">

    <div class="section-title">📝 Yaz-Boz</div>

    <div class="mod-btns">
        <button onclick="modSec('tekli')" id="mod-tekli" class="active">
            👤 Tekli Oyun
        </button>

        <button onclick="modSec('esli')" id="mod-esli">
            👥 Eşli Oyun
        </button>
    </div>

    <div id="yazbozAlan"></div>

</div>


<!-- ================= SEPET ================= -->

<div class="sepet-bar" id="sepetBar">
    <div>
        <small>Sepet Toplamı</small><br>
        <strong id="sepetToplam">0 TL</strong>
    </div>

    <button onclick="siparisVer()">
        Sipariş Ver
    </button>
</div>


<script>

/* ================= FIREBASE ================= */

const firebaseConfig = {
    databaseURL:"https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId:"dijitalkahve-67f0a",
    storageBucket:"dijitalkahve-67f0a.appspot.com",
    messagingSenderId:"326476599239"
};

if(!firebase.apps.length){
    firebase.initializeApp(firebaseConfig);
}

const db = firebase.app().database(
    "https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app"
);


/* ================= MASA ================= */

const urlParams = new URLSearchParams(window.location.search);

const masa = urlParams.get('masa') || '1';

document.getElementById('masaEtiket').innerText =
    "MASA " + masa;


/* ================= MENÜ ================= */

let urunlerData = {};

let sepet = {};

const kategoriIkon = {
    'Sıcak İçecekler':'☕',
    'Soğuk İçecekler':'🧊',
    'Tatlılar':'🍰',
    'Atıştırmalıklar':'🥪',
    'Diğer':'🍹'
};

const kategoriSirasi = [
    'Sıcak İçecekler',
    'Soğuk İçecekler',
    'Tatlılar',
    'Atıştırmalıklar',
    'Diğer'
];


db.ref('urunler').on('value',(snapshot)=>{

    urunlerData = snapshot.val() || {};

    renderMenu();

});


function renderMenu(){

    const menuList =
        document.getElementById('urunListesi');

    menuList.innerHTML = '';

    const keys = Object.keys(urunlerData);

    if(keys.length === 0){

        menuList.innerHTML =
            '<div class="empty">Henüz ürün eklenmemiş.</div>';

        return;
    }

    const gruplar = {};

    keys.forEach(key=>{

        const kat =
            urunlerData[key].kategori || 'Diğer';

        if(!gruplar[kat])
            gruplar[kat] = [];

        gruplar[kat].push(key);

    });


    const siraliKategoriler = [

        ...kategoriSirasi.filter(
            k=>gruplar[k]
        ),

        ...Object.keys(gruplar).filter(
            k=>!kategoriSirasi.includes(k)
        )

    ];


    siraliKategoriler.forEach(kat=>{

        let html = `
        <h3 class="kategori-baslik">
            ${kategoriIkon[kat] || '🍽️'}
            ${kat}
        </h3>
        `;


        gruplar[kat].forEach(key=>{

            const item = urunlerData[key];

            const adet =
                sepet[key]
                ? sepet[key].adet
                : 0;


            html += `

            <div class="card">

                <div>
                    <div class="urun-ad">
                        ${item.ad}
                    </div>

                    <span class="urun-fiyat">
                        ${item.fiyat} TL
                    </span>
                </div>

                <div class="qty-box">

                    <button onclick="adetDegistir('${key}',-1)">
                        −
                    </button>

                    <span id="adet-${key}">
                        ${adet}
                    </span>

                    <button onclick="adetDegistir('${key}',1)">
                        +
                    </button>

                </div>

            </div>

            `;

        });


        menuList.innerHTML += html;

    });

}


function adetDegistir(key,delta){

    const item = urunlerData[key];

    if(!item) return;


    const mevcut =
        sepet[key]
        ? sepet[key].adet
        : 0;


    const yeni =
        Math.max(0,mevcut + delta);


    if(yeni === 0){

        delete sepet[key];

    }else{

        sepet[key] = {

            ad:item.ad,

            fiyat:item.fiyat,

            adet:yeni

        };

    }


    const element =
        document.getElementById(
            `adet-${key}`
        );

    if(element)
        element.innerText = yeni;


    sepetGuncelle();

}


function sepetGuncelle(){

    let toplam = 0;


    Object.values(sepet).forEach(i=>{

        toplam +=
            (parseFloat(i.fiyat) || 0)
            * i.adet;

    });


    const bar =
        document.getElementById('sepetBar');


    if(toplam > 0){

        bar.style.display = 'flex';

        document.getElementById(
            'sepetToplam'
        ).innerText =
            toplam + ' TL';

    }else{

        bar.style.display = 'none';

    }

}


/* ================= SİPARİŞ ================= */

function siparisVer(){

    if(Object.keys(sepet).length === 0)
        return;


    const kalemler = sepet;


    const toplam =
        Object.values(kalemler)
        .reduce(
            (s,i)=>
                s +
                (parseFloat(i.fiyat)||0)
                * i.adet,
            0
        );


    const saat =
        new Date().toLocaleTimeString(
            'tr-TR',
            {
                hour:'2-digit',
                minute:'2-digit'
            }
        );


    db.ref('siparisler').push({

        masa:masa,

        urunler:kalemler,

        toplam:toplam,

        zaman:saat,

        durum:'bekliyor'

    }).then(()=>{

        alert('Siparişiniz alındı!');

        sepet = {};

        renderMenu();

        sepetGuncelle();

    }).catch(err=>{

        alert(
            'Hata Oluştu: ' +
            err.message
        );

    });

}


/* ================= HESAP ================= */

db.ref('siparisler')
.orderByChild('masa')
.equalTo(masa)
.on('value',(snapshot)=>{

    renderHesap(snapshot.val());

});


function renderHesap(data){

    const container =
        document.getElementById(
            'hesapListesi'
        );

    container.innerHTML = '';

    let genelToplam = 0;


    if(!data){

        container.innerHTML =
            '<div class="empty">Henüz sipariş verilmedi.</div>';

        document.getElementById(
            'hesapGenelToplam'
        ).innerHTML = '';

        return;

    }


    Object.keys(data).forEach(orderKey=>{

        const siparis =
            data[orderKey];


        const urunler =
            siparis.urunler || {};


        const onaylandi =
            siparis.durum === 'onaylandi';


        let urunHtml = '';

        let orderToplam = 0;


        Object.keys(urunler)
        .forEach(pKey=>{

            const u =
                urunler[pKey];


            const tutar =
                (parseFloat(u.fiyat)||0)
                * u.adet;


            orderToplam += tutar;


            if(onaylandi){

                urunHtml += `

                <div class="siparis-urun-satir">

                    <span>
                        ${u.ad} ×${u.adet}
                    </span>

                    <span>
                        ${tutar} TL
                    </span>

                </div>

                `;

            }else{

                urunHtml += `

                <div class="siparis-urun-satir">

                    <span>
                        ${u.ad}
                    </span>

                    <div class="qty-box">

                        <button onclick="
                            siparisAdetDegistir(
                                '${orderKey}',
                                '${pKey}',
                                -1
                            )
                        ">
                            −
                        </button>

                        <span>
                            ${u.adet}
                        </span>

                        <button onclick="
                            siparisAdetDegistir(
                                '${orderKey}',
                                '${pKey}',
                                1
                            )
                        ">
                            +
                        </button>

                    </div>

                    <span>
                        ${tutar} TL
                    </span>

                </div>

                `;

            }

        });


        genelToplam += orderToplam;


        container.innerHTML += `

        <div class="hesap-card
            ${onaylandi ? 'onayli' : ''}">

            <div class="hesap-baslik">

                <span>
                    ${onaylandi
                        ? '✅ Onaylandı'
                        : '⏳ Bekliyor'}
                    · ${siparis.zaman}
                </span>

                <span>
                    ${orderToplam} TL
                </span>

            </div>

            ${urunHtml}

        </div>

        `;

    });


    document.getElementById(
        'hesapGenelToplam'
    ).innerHTML = `

        <div class="toplam-box">
            GENEL TOPLAM
            <br>
            ${genelToplam} TL
        </div>

    `;

}


function siparisAdetDegistir(
    orderKey,
    productKey,
    delta
){

    const ref =
        db.ref(
            'siparisler/' +
            orderKey +
            '/urunler/' +
            productKey
        );


    ref.once('value')
    .then(snap=>{

        const u = snap.val();

        if(!u) return;


        const yeniAdet =
            Math.max(
                0,
                u.adet + delta
            );


        if(yeniAdet === 0){

            ref.remove()
            .then(()=>
                siparisToplamGuncelle(orderKey)
            );

        }else{

            ref.update({
                adet:yeniAdet
            })
            .then(()=>
                siparisToplamGuncelle(orderKey)
            );

        }

    });

}


function siparisToplamGuncelle(orderKey){

    db.ref(
        'siparisler/' +
        orderKey +
        '/urunler'
    )
    .once('value')
    .then(snap=>{

        const urunler =
            snap.val() || {};


        if(Object.keys(urunler).length === 0){

            db.ref(
                'siparisler/' +
                orderKey
            ).remove();

            return;
        }


        let toplam = 0;


        Object.values(urunler)
        .forEach(u=>{

            toplam +=
                (parseFloat(u.fiyat)||0)
                * u.adet;

        });


        db.ref(
            'siparisler/' +
            orderKey +
            '/toplam'
        ).set(toplam);

    });

}


/* ================= GARSON ================= */

let cagriBekleniyor = false;


db.ref('bildirimler')
.orderByChild('masa')
.equalTo(masa)
.on('value',(snapshot)=>{

    cagriBekleniyor =
        snapshot.exists();


    const btn =
        document.getElementById(
            'garsonBtn'
        );


    if(cagriBekleniyor){

        btn.disabled = true;

        btn.innerText =
            '⏳ GARSON ÇAĞRILDI';

    }else{

        btn.disabled = false;

        btn.innerText =
            '🔔 GARSON / OCAKÇI ÇAĞIR';

    }

});


function garsonCagir(){

    if(cagriBekleniyor)
        return;


    const saat =
        new Date().toLocaleTimeString(
            'tr-TR',
            {
                hour:'2-digit',
                minute:'2-digit'
            }
        );


    db.ref('bildirimler')
    .push({

        masa:masa,

        zaman:saat

    })
    .catch(err=>{

        alert(
            'Hata Oluştu: ' +
            err.message
        );

    });

}


/* ================= SAYFA ================= */

function sayfaAc(sayfa){

    document
    .querySelectorAll('.page')
    .forEach(el=>
        el.classList.remove('active')
    );


    document
    .querySelectorAll('.nav-btns button')
    .forEach(el=>
        el.classList.remove('active')
    );


    document
    .getElementById(
        'page-' + sayfa
    )
    .classList.add('active');


    document
    .getElementById(
        'btn-' + sayfa
    )
    .classList.add('active');

}


/* =====================================================
   YAZ-BOZ
   ===================================================== */

let mod = 'tekli';

let playerCount = 4;

let elSayisi = 8;


/* ================= MOD SEÇ ================= */

function modSec(secilen){

    mod = secilen;


    document
    .getElementById('mod-tekli')
    .classList.toggle(
        'active',
        secilen === 'tekli'
    );


    document
    .getElementById('mod-esli')
    .classList.toggle(
        'active',
        secilen === 'esli'
    );


    renderKurulum();

}


/* ================= KURULUM ================= */

function renderKurulum(){

    let oyuncuSecimi = '';


    if(mod === 'tekli'){

        oyuncuSecimi = `

            <label>
                Kaç Oyuncu?
            </label>

            <select
                id="oyuncuSayisi"
                style="
                    width:100%;
                    padding:12px;
                    border:1px solid #ddd;
                    border-radius:9px;
                    font-size:15px;
                    margin-bottom:10px;
                "
            >

                <option value="2">2 Oyuncu</option>
                <option value="3">3 Oyuncu</option>
                <option value="4" selected>4 Oyuncu</option>
                <option value="5">5 Oyuncu</option>
                <option value="6">6 Oyuncu</option>
                <option value="7">7 Oyuncu</option>
                <option value="8">8 Oyuncu</option>

            </select>

        `;

    }else{

        oyuncuSecimi = `

            <div class="bilgi">
                👥 Eşli oyun 2 takım olarak oynanır.
            </div>

        `;

    }


    document.getElementById(
        'yazbozAlan'
    ).innerHTML = `

        <div class="kurulum-card">

            ${oyuncuSecimi}

            <label>
                Kaç El Oynanacak?
            </label>

            <input
                type="number"
                id="elSayisiInput"
                min="1"
                max="100"
                value="8"
            >

            <button
                class="baslat-btn"
                onclick="oyunuBaslat()"
            >
                ▶️ OYUNU BAŞLAT
            </button>

        </div>

    `;

}


/* ================= OYUN BAŞLAT ================= */

function oyunuBaslat(){

    const elInput =
        document.getElementById(
            'elSayisiInput'
        );


    elSayisi =
        parseInt(elInput.value) || 1;


    if(elSayisi < 1)
        elSayisi = 1;


    if(mod === 'tekli'){

        playerCount =
            parseInt(
                document.getElementById(
                    'oyuncuSayisi'
                ).value
            ) || 4;

    }else{

        playerCount = 2;

    }


    renderYazbozTable();

}


/* =====================================================
   YAZ-BOZ VERİLERİ
   ===================================================== */

let yazbozRows = [];


/* ================= TABLO ================= */

function renderYazbozTable(){

    yazbozRows = [];


    let isimler = [];


    if(mod === 'esli'){

        isimler = [
            'Takım 1',
            'Takım 2'
        ];

    }else{

        for(
            let i=0;
            i<playerCount;
            i++
        ){

            isimler.push(
                'Oyuncu ' + (i+1)
            );

        }

    }


    let headHtml = '';


    for(let i=0;i<playerCount;i++){

        headHtml += `

            <th>

                <input
                    class="isim-input"
                    type="text"
                    value="${isimler[i]}"
                    onchange="isimleriKaydet()"
                >

            </th>

        `;

    }


    let toplamHtml = '';

    let farkHtml = '';


    for(let i=0;i<playerCount;i++){

        toplamHtml += `
            <td id="tot${i}">
                0
            </td>
        `;


        farkHtml += `
            <td id="fark${i}">
                -
            </td>
        `;

    }


    document.getElementById(
        'yazbozAlan'
    ).innerHTML = `

        <div class="el-baslik" id="elDurumu">
            El 0 / ${elSayisi}
        </div>

        <div class="yazboz-wrapper">

            <table
                class="yazboz-table"
                id="yazbozTable"
            >

                <thead>
                    <tr>
                        ${headHtml}
                    </tr>
                </thead>

                <tbody
                    id="yazbozBody"
                ></tbody>

                <tfoot>

                    <tr class="toplam-satiri">
                        ${toplamHtml}
                    </tr>

                    <tr class="fark-row">
                        ${farkHtml}
                    </tr>

                </tfoot>

            </table>

        </div>

        <div class="bilgi">
            ⏱️ Her el girildikten sonra
            <strong>60 saniye</strong>
            içinde değiştirilebilir.
            Süre dolunca el kilitlenir.
        </div>

        <div class="yazboz-buttons">

            <button
                class="btn-el"
                id="elEkleBtn"
                onclick="satirEkle()"
            >
                + EL EKLE
            </button>

            <button
                class="btn-yeni"
                onclick="renderKurulum()"
            >
                YENİ OYUN
            </button>

        </div>

    `;


    /* İlk el otomatik oluşturulmaz.
       Kullanıcı + EL EKLE butonuna basar. */

    elDurumGuncelle();

}


/* ================= İSİMLER ================= */

function isimleriKaydet(){

    /* İsimler anlık olarak tabloda kalır.
       Sayfa yenilenmediği sürece korunur. */

}


/* =====================================================
   EL EKLE
   ===================================================== */

function satirEkle(){

    const tbody =
        document.getElementById(
            'yazbozBody'
        );


    if(!tbody)
        return;


    const mevcutEl =
        tbody.querySelectorAll('tr').length;


    if(mevcutEl >= elSayisi){

        const devam =
            confirm(
                'Belirlenen ' +
                elSayisi +
                ' el tamamlandı.\n\n' +
                'Yine de yeni el eklemek istiyor musun?'
            );


        if(!devam)
            return;

    }


    const tr =
        document.createElement('tr');


    const rowIndex =
        mevcutEl;


    tr.dataset.row =
        rowIndex;


    for(
        let i=0;
        i<playerCount;
        i++
    ){

        tr.innerHTML += `

            <td>

                <input
                    type="number"
                    value="0"
                    min="0"
                    data-player="${i}"
                    onchange="puanDegisti(${rowIndex})"
                >

            </td>

        `;

    }


    tbody.appendChild(tr);


    /* Satır için 60 saniyelik kilit */

    const rowData = {

        index:rowIndex,

        createdAt:Date.now(),

        locked:false

    };


    yazbozRows.push(rowData);


    elDurumGuncelle();

    toplamHesapla();


    /* 60 saniye sonra kilitle */

    setTimeout(()=>{

        kilitleEl(rowIndex);

    },60000);


    /* Geri sayımı başlat */

    geriSayimBaslat(
        rowIndex,
        tr
    );

}


/* =====================================================
   PUAN DEĞİŞTİ
   ===================================================== */

function puanDegisti(rowIndex){

    const row =
        document.querySelector(
            `#yazbozBody tr[data-row="${rowIndex}"]`
        );


    if(!row)
        return;


    const data =
        yazbozRows.find(
            r=>r.index === rowIndex
        );


    if(data && data.locked){

        alert(
            '🔒 Bu elin düzenleme süresi doldu.'
        );

        toplamHesapla();

        return;

    }


    toplamHesapla();

}


/* =====================================================
   EL KİLİTLE
   ===================================================== */

function kilitleEl(rowIndex){

    const data =
        yazbozRows.find(
            r=>r.index === rowIndex
        );


    if(!data)
        return;


    data.locked = true;


    const row =
        document.querySelector(
            `#yazbozBody tr[data-row="${rowIndex}"]`
        );


    if(!row)
        return;


    row.classList.add(
        'kilitli-row'
    );


    row.querySelectorAll(
        'input[type="number"]'
    ).forEach(input=>{

        input.disabled = true;

    });


    const timer =
        row.querySelector(
            '.kilit-sure'
        );


    if(timer){

        timer.innerText =
            '🔒 Kilitlendi';

        timer.classList.add(
            'kilitli'
        );

    }

}


/* =====================================================
   GERİ SAYIM
   ===================================================== */

function geriSayimBaslat(
    rowIndex,
    row
){

    const td =
        document.createElement(
            'td'
        );


    td.colSpan =
        playerCount;


    /* Bu hücre tablo yapısını bozmasın diye
       ilk input satırının altına küçük bilgi koyuyoruz. */

    const mevcut =
        row.querySelectorAll(
            'td'
        );


    if(mevcut.length > 0){

        const ilk =
            mevcut[0];


        const timer =
            document.createElement(
                'div'
            );


        timer.className =
            'kilit-sure';


        ilk.appendChild(
            timer
        );


        const bitis =
            Date.now() + 60000;


        function guncelle(){

            const kalan =
                Math.max(
                    0,
                    bitis - Date.now()
                );


            const saniye =
                Math.ceil(
                    kalan / 1000
                );


            const data =
                yazbozRows.find(
                    r=>r.index === rowIndex
                );


            if(
                !data ||
                data.locked
            ){

                return;

            }


            timer.innerText =
                '⏱️ ' +
                saniye +
                ' sn';


            if(kalan <= 0){

                kilitleEl(
                    rowIndex
                );

                return;

            }


            setTimeout(
                guncelle,
                500
            );

        }


        guncelle();

    }

}


/* =====================================================
   TOPLAM
   ===================================================== */

function toplamHesapla(){

    const totals =
        new Array(
            playerCount
        ).fill(0);


    document
    .querySelectorAll(
        '#yazbozBody tr'
    )
    .forEach(row=>{

        row
        .querySelectorAll(
            'input[type="number"]'
        )
        .forEach(
            (input,index)=>{

                totals[index] +=
                    parseInt(
                        input.value
                    ) || 0;

            }
        );

    });


    const minTotal =
        Math.min(...totals);


    for(
        let i=0;
        i<playerCount;
        i++
    ){

        const toplam =
            document.getElementById(
                `tot${i}`
            );


        const fark =
            document.getElementById(
                `fark${i}`
            );


        if(toplam)
            toplam.innerText =
                totals[i];


        if(fark){

            const farkDegeri =
                totals[i] - minTotal;


            fark.innerText =
                farkDegeri === 0
                ? 'ÖNDE'
                : '+' + farkDegeri;

        }

    }


    elDurumGuncelle();

}


/* =====================================================
   EL DURUM
   ===================================================== */

function elDurumGuncelle(){

    const tbody =
        document.getElementById(
            'yazbozBody'
        );


    const durum =
        document.getElementById(
            'elDurumu'
        );


    if(!tbody || !durum)
        return;


    const mevcutEl =
        tbody.querySelectorAll(
            'tr'
        ).length;


    const kilitli =
        yazbozRows.filter(
            r=>r.locked
        ).length;


    durum.innerHTML =
        `
        El ${mevcutEl} / ${elSayisi}
        <br>
        <small style="font-weight:normal;color:#777;">
            ${kilitli} el kilitli
        </small>
        `;

}


/* ================= BAŞLANGIÇ ================= */

renderKurulum();

</script>

</body>
</html>
