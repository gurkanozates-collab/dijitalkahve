<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Dijital Kahve</title>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f1ed;
    color:#30251f;
}

button{
    font-family:inherit;
}

.header{
    background:linear-gradient(135deg,#3e2723,#795548);
    color:white;
    padding:18px 15px 20px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,.18);
}

.header h1{
    margin:0;
    font-size:23px;
}

.header p{
    margin:5px 0 0;
    font-size:12px;
    opacity:.9;
}

.masa-bilgi{
    margin-top:10px;
    display:inline-block;
    padding:6px 13px;
    border-radius:20px;
    background:rgba(255,255,255,.15);
    font-size:12px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:12px;
}

/* ================= ÜST BUTONLAR ================= */

.ust-butonlar{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:12px;
}

.ust-btn{
    border:0;
    padding:15px 10px;
    border-radius:13px;
    color:white;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 3px 10px rgba(0,0,0,.12);
}

.garson-btn{
    background:#f9a825;
    color:#222;
}

.siparis-btn{
    background:#2e7d32;
}

/* ================= SEKME ================= */

.tabs{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
    margin-bottom:12px;
}

.tab{
    border:0;
    background:white;
    color:#795548;
    padding:12px 5px;
    border-radius:11px;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.tab.active{
    background:#5d4037;
    color:white;
}

.panel{
    display:none;
}

.panel.active{
    display:block;
}

/* ================= MENÜ ================= */

.kategori{
    margin-bottom:16px;
}

.kategori-baslik{
    color:#5d4037;
    font-size:17px;
    font-weight:bold;
    margin-bottom:8px;
}

.urun{
    background:white;
    padding:13px;
    border-radius:13px;
    margin-bottom:8px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.urun-bilgi{
    flex:1;
}

.urun-ad{
    font-weight:bold;
    color:#4e342e;
    font-size:15px;
}

.urun-fiyat{
    margin-top:4px;
    color:#e65100;
    font-weight:bold;
    font-size:14px;
}

.adet{
    display:flex;
    align-items:center;
    gap:8px;
}

.adet button{
    width:32px;
    height:32px;
    border:0;
    border-radius:50%;
    background:#eee;
    font-size:19px;
    cursor:pointer;
}

.adet span{
    min-width:22px;
    text-align:center;
    font-weight:bold;
}

/* ================= ALT SİPARİŞ ÖZET ================= */

.sepet{
    background:white;
    padding:15px;
    border-radius:14px;
    margin-top:14px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.sepet h3{
    margin:0 0 10px;
}

.sepet-row{
    display:flex;
    justify-content:space-between;
    padding:8px 0;
    border-bottom:1px dashed #ddd;
}

.sepet-row:last-child{
    border-bottom:0;
}

.sepet-toplam{
    text-align:right;
    margin-top:12px;
    padding-top:10px;
    border-top:1px solid #eee;
    font-size:19px;
    font-weight:bold;
    color:#e65100;
}

.bos-sepet{
    color:#999;
    text-align:center;
    padding:10px;
}

/* ================= HESAP ================= */

.hesap-box{
    background:white;
    border-radius:15px;
    padding:17px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.hesap-baslik{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
}

.hesap-baslik h2{
    margin:0;
    font-size:19px;
    color:#4e342e;
}

.hesap-durum{
    font-size:11px;
    padding:6px 9px;
    border-radius:15px;
    background:#fff3e0;
    color:#e65100;
    font-weight:bold;
}

.hesap-urun{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px dashed #ddd;
}

.hesap-urun:last-child{
    border-bottom:0;
}

.hesap-toplam{
    margin-top:14px;
    padding-top:13px;
    border-top:2px solid #eee;
    text-align:right;
    font-size:21px;
    font-weight:bold;
    color:#2e7d32;
}

/* ================= YAZ BOZ ================= */

.yazboz{
    background:white;
    border-radius:16px;
    padding:14px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

/*
   YAZ-BOZ KÜÇÜK TUTULUYOR
   PANELİN YAKLAŞIK 1/4'Ü
*/

.yazboz-baslik{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.yazboz-baslik h2{
    margin:0;
    color:#4e342e;
    font-size:18px;
}

.yazboz-badge{
    background:#5d4037;
    color:white;
    padding:5px 9px;
    border-radius:15px;
    font-size:10px;
}

.yazboz-kurulum{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:7px;
    margin-bottom:10px;
}

.yazboz-kurulum select{
    width:100%;
    border:1px solid #ddd;
    border-radius:8px;
    padding:9px 5px;
    background:white;
    font-size:12px;
}

.yazboz-baslat{
    width:100%;
    border:0;
    background:#795548;
    color:white;
    padding:10px;
    border-radius:9px;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:10px;
}

.yazboz-oyunlar{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:6px;
}

.oyun-kart{
    border:1px solid #ddd;
    border-radius:9px;
    padding:7px;
    text-align:center;
    background:#fafafa;
    min-width:0;
}

.oyun-kart.aktif{
    border:2px solid #795548;
    background:#fff8f4;
}

.oyun-kart.kilitli{
    background:#e8f5e9;
    border-color:#81c784;
}

.oyun-no{
    font-size:10px;
    color:#777;
    margin-bottom:5px;
}

.oyun-durum{
    font-size:9px;
    font-weight:bold;
    margin-bottom:5px;
}

.oyuncu-skor{
    display:flex;
    flex-direction:column;
    gap:4px;
    margin-bottom:4px;
}

.oyuncu-skor input{
    width:100%;
    min-width:0;
    padding:6px 3px;
    text-align:center;
    border:1px solid #ddd;
    border-radius:6px;
    font-size:11px;
}

.skor-toplam{
    font-size:10px;
    font-weight:bold;
    color:#5d4037;
    margin-top:5px;
}

.skor-kilit{
    color:#2e7d32;
    font-size:9px;
    font-weight:bold;
}

.oyun-kilit-btn{
    width:100%;
    border:0;
    background:#2e7d32;
    color:white;
    padding:5px;
    border-radius:6px;
    font-size:9px;
    font-weight:bold;
    cursor:pointer;
    margin-top:4px;
}

.yazboz-sonuc{
    margin-top:10px;
    background:#f5f5f5;
    padding:9px;
    border-radius:9px;
}

.yazboz-sonuc h3{
    margin:0 0 6px;
    font-size:12px;
}

.skor-satir{
    display:flex;
    justify-content:space-between;
    padding:4px 0;
    font-size:11px;
}

/* ================= BİLDİRİM ================= */

.bildirim{
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translateX(-50%);
    background:#323232;
    color:white;
    padding:12px 18px;
    border-radius:25px;
    font-size:13px;
    z-index:9999;
    display:none;
    box-shadow:0 4px 15px rgba(0,0,0,.25);
}

/* ================= MODAL ================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:999;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-box{
    width:100%;
    max-width:390px;
    background:white;
    border-radius:16px;
    padding:22px;
}

.modal-box h3{
    margin-top:0;
    color:#4e342e;
}

.modal-box input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:9px;
    margin:8px 0;
}

.modal-btnlar{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.modal-btnlar button{
    flex:1;
    border:0;
    padding:11px;
    border-radius:8px;
    font-weight:bold;
}

/* ================= MOBİL ================= */

@media(max-width:600px){

    .container{
        padding:9px;
    }

    .header{
        padding:15px 10px;
    }

    .header h1{
        font-size:21px;
    }

    .ust-butonlar{
        gap:7px;
    }

    .ust-btn{
        padding:13px 6px;
        font-size:12px;
    }

    .tabs{
        gap:5px;
    }

    .tab{
        padding:10px 3px;
        font-size:11px;
    }

    .yazboz{
        padding:10px;
    }

    .yazboz-kurulum{
        grid-template-columns:1fr 1fr;
    }

    .yazboz-kurulum select:last-child{
        grid-column:1/-1;
    }

    .yazboz-oyunlar{
        grid-template-columns:repeat(2,1fr);
    }

}

</style>
</head>

<body>

<div class="header">

    <h1>☕ DİJİTAL KAHVE</h1>

    <p>QR Menü • Sipariş • Hesap • Yaz-Boz</p>

    <div class="masa-bilgi" id="masaBilgi">
        MASA BELİRLENİYOR...
    </div>

</div>


<div class="container">


<!-- ================= ÜST BUTONLAR ================= -->

<div class="ust-butonlar">

    <button
        class="ust-btn garson-btn"
        onclick="garsonCagir()">

        🔔 GARSON ÇAĞIR

    </button>

    <button
        class="ust-btn siparis-btn"
        onclick="siparisGonder()">

        🛒 SİPARİŞ GÖNDER

    </button>

</div>


<!-- ================= SEKME ================= -->

<div class="tabs">

    <button
        class="tab active"
        onclick="sekmeAc('menu',this)">

        ☕ MENÜ

    </button>

    <button
        class="tab"
        onclick="sekmeAc('hesap',this)">

        🧾 HESAP

    </button>

    <button
        class="tab"
        onclick="sekmeAc('yazboz',this)">

        🎲 YAZ-BOZ

    </button>

</div>


<!-- =====================================================
     MENÜ
===================================================== -->

<div
    id="menu"
    class="panel active">

    <div id="menuListesi">

        <div class="bos-sepet">
            Menü yükleniyor...
        </div>

    </div>


    <div class="sepet">

        <h3>🛒 Sipariş Özeti</h3>

        <div id="sepetListesi">

            <div class="bos-sepet">
                Henüz ürün seçilmedi.
            </div>

        </div>

        <div
            class="sepet-toplam"
            id="sepetToplam">

            0.00 TL

        </div>

    </div>

</div>


<!-- =====================================================
     HESAP
===================================================== -->

<div
    id="hesap"
    class="panel">

    <div class="hesap-box">

        <div class="hesap-baslik">

            <h2>🧾 Masa Hesabı</h2>

            <span
                class="hesap-durum"
                id="hesapDurum">

                Güncel

            </span>

        </div>

        <div id="hesapListesi">

            <div class="bos-sepet">
                Hesap yükleniyor...
            </div>

        </div>

        <div
            class="hesap-toplam"
            id="hesapToplam">

            0.00 TL

        </div>

    </div>

</div>


<!-- =====================================================
     YAZ BOZ
===================================================== -->

<div
    id="yazboz"
    class="panel">

    <div class="yazboz">

        <div class="yazboz-baslik">

            <h2>🎲 Yaz-Boz</h2>

            <span
                class="yazboz-badge">

                SKOR

            </span>

        </div>


        <!-- KURULUM -->

        <div id="yazbozKurulum">

            <div class="yazboz-kurulum">

                <select id="oyunTipi">

                    <option value="tekli">
                        Tekli
                    </option>

                    <option value="esli">
                        Eşli
                    </option>

                </select>


                <select id="oyuncuSayisi">

                    <option value="2">
                        2 Oyuncu
                    </option>

                    <option value="3">
                        3 Oyuncu
                    </option>

                    <option value="4">
                        4 Oyuncu
                    </option>

                    <option value="5">
                        5 Oyuncu
                    </option>

                    <option value="6">
                        6 Oyuncu
                    </option>

                </select>


                <select id="oyunSayisi">

                    <option value="2">
                        2 Oyun
                    </option>

                    <option value="3">
                        3 Oyun
                    </option>

                    <option value="4">
                        4 Oyun
                    </option>

                    <option value="5">
                        5 Oyun
                    </option>

                    <option value="6">
                        6 Oyun
                    </option>

                    <option value="8">
                        8 Oyun
                    </option>

                    <option value="10">
                        10 Oyun
                    </option>

                </select>

            </div>


            <button
                class="yazboz-baslat"
                onclick="yazbozBaslat()">

                🎮 OYUNU BAŞLAT

            </button>

        </div>


        <div
            id="yazbozOyunlar"
            class="yazboz-oyunlar">

        </div>


        <div
            id="yazbozSonuc"
            class="yazboz-sonuc"
            style="display:none;">

        </div>

    </div>

</div>

</div>


<div
    id="bildirim"
    class="bildirim">

</div>


<!-- ================= SİPARİŞ MODALI ================= -->

<div
    id="siparisModal"
    class="modal">

    <div class="modal-box">

        <h3>🛒 Sipariş Gönder</h3>

        <p style="font-size:13px;color:#777;">

            Siparişiniz garson paneline
            gönderilecek.

        </p>

        <div
            id="modalSiparisOzet">

        </div>

        <div class="modal-btnlar">

            <button
                style="background:#ddd;"
                onclick="modalKapat()">

                İPTAL

            </button>

            <button
                style="background:#2e7d32;color:white;"
                onclick="siparisiOnaylaVeGonder()">

                GÖNDER

            </button>

        </div>

    </div>

</div>


<script>

/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig={

    databaseURL:
    "https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
    "dijitalkahve-67f0a",

    storageBucket:
    "dijitalkahve-67f0a.appspot.com",

    messagingSenderId:
    "326476599239"

};


if(!firebase.apps.length){

    firebase.initializeApp(
        firebaseConfig
    );

}


const db=firebase.app().database(
    "https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app"
);


/* =====================================================
   MASA
   QR ÖRNEĞİ:
   index.html?masa=15
===================================================== */

const urlParams=
    new URLSearchParams(
        window.location.search
    );


let masa=
    parseInt(
        urlParams.get("masa")
    );


if(!masa || masa<1 || masa>50){

    masa=1;

}


document.getElementById(
    "masaBilgi"
).innerText=
    "MASA "+masa;


/* =====================================================
   SEPET
===================================================== */

let sepet={};


/* =====================================================
   SEKME
===================================================== */

function sekmeAc(id,button){

    document
        .querySelectorAll(".panel")
        .forEach(x=>{
            x.classList.remove("active");
        });

    document
        .querySelectorAll(".tab")
        .forEach(x=>{
            x.classList.remove("active");
        });

    document
        .getElementById(id)
        .classList.add("active");

    button.classList.add("active");

}


/* =====================================================
   MENÜ
===================================================== */

db.ref("urunler")
.on("value",snapshot=>{

    const data=
        snapshot.val() || {};

    const liste=
        document.getElementById(
            "menuListesi"
        );

    liste.innerHTML="";


    if(Object.keys(data).length===0){

        liste.innerHTML=`

            <div class="bos-sepet">

                Menüde henüz ürün bulunmuyor.

            </div>

        `;

        return;

    }


    const kategoriler={};


    Object.keys(data)
    .forEach(id=>{

        const urun=data[id];

        const kategori=
            urun.kategori || "Diğer";


        if(!kategoriler[kategori]){

            kategoriler[kategori]=[];

        }


        kategoriler[kategori].push({

            id:id,

            ad:urun.ad,

            fiyat:
            parseFloat(urun.fiyat)||0

        });

    });


    Object.keys(kategoriler)
    .forEach(kategori=>{

        let html="";


        kategoriler[kategori]
        .forEach(urun=>{

            const adet=
                sepet[urun.id]
                ?
                sepet[urun.id].adet
                :
                0;


            html+=`

                <div class="urun">

                    <div class="urun-bilgi">

                        <div class="urun-ad">

                            ${escapeHtml(urun.ad)}

                        </div>

                        <div class="urun-fiyat">

                            ${urun.fiyat.toFixed(2)}
                            TL

                        </div>

                    </div>


                    <div class="adet">

                        <button
                            onclick="
                            sepetDegistir(
                            '${urun.id}',
                            '${escapeHtml(urun.ad)}',
                            ${urun.fiyat},
                            -1
                            )">

                            −

                        </button>

                        <span
                            id="adet-${urun.id}">

                            ${adet}

                        </span>

                        <button
                            onclick="
                            sepetDegistir(
                            '${urun.id}',
                            '${escapeHtml(urun.ad)}',
                            ${urun.fiyat},
                            1
                            )">

                            +

                        </button>

                    </div>

                </div>

            `;

        });


        liste.innerHTML+=`

            <div class="kategori">

                <div class="kategori-baslik">

                    ${kategori}

                </div>

                ${html}

            </div>

        `;

    });

});


/* =====================================================
   SEPET DEĞİŞTİR
===================================================== */

function sepetDegistir(
    id,
    ad,
    fiyat,
    fark
){

    if(!sepet[id]){

        sepet[id]={

            ad:ad,

            fiyat:fiyat,

            adet:0

        };

    }


    sepet[id].adet += fark;


    if(sepet[id].adet<=0){

        delete sepet[id];

    }


    sepetGoster();

}


/* =====================================================
   SEPET GÖSTER
===================================================== */

function sepetGoster(){

    const liste=
        document.getElementById(
            "sepetListesi"
        );


    liste.innerHTML="";


    let toplam=0;


    Object.keys(sepet)
    .forEach(id=>{

        const u=sepet[id];

        const tutar=
            u.adet*u.fiyat;

        toplam+=tutar;


        liste.innerHTML+=`

            <div class="sepet-row">

                <span>

                    ${escapeHtml(u.ad)}
                    ×${u.adet}

                </span>

                <strong>

                    ${tutar.toFixed(2)}
                    TL

                </strong>

            </div>

        `;

    });


    if(Object.keys(sepet).length===0){

        liste.innerHTML=`

            <div class="bos-sepet">

                Henüz ürün seçilmedi.

            </div>

        `;

    }


    document.getElementById(
        "sepetToplam"
    ).innerText=
        toplam.toFixed(2)
        +" TL";

}


/* =====================================================
   SİPARİŞ GÖNDER
===================================================== */

function siparisGonder(){

    if(
        Object.keys(sepet).length===0
    ){

        bildirimGoster(
            "Önce menüden ürün seçin."
        );

        return;

    }


    let html="";


    let toplam=0;


    Object.values(sepet)
    .forEach(u=>{

        const tutar=
            u.adet*u.fiyat;

        toplam+=tutar;


        html+=`

            <div class="sepet-row">

                <span>
                    ${escapeHtml(u.ad)}
                    ×${u.adet}
                </span>

                <strong>
                    ${tutar.toFixed(2)} TL
                </strong>

            </div>

        `;

    });


    html+=`

        <div class="sepet-toplam">

            ${toplam.toFixed(2)} TL

        </div>

    `;


    document.getElementById(
        "modalSiparisOzet"
    ).innerHTML=html;


    document.getElementById(
        "siparisModal"
    ).style.display="flex";

}


/* =====================================================
   SİPARİŞİ GERÇEKTEN GÖNDER
===================================================== */

function siparisiOnaylaVeGonder(){

    const urunler={};

    let toplam=0;


    Object.keys(sepet)
    .forEach(id=>{

        const u=sepet[id];


        urunler[id]={

            ad:u.ad,

            fiyat:u.fiyat,

            adet:u.adet

        };


        toplam+=
            u.adet*u.fiyat;

    });


    const zaman=
        new Date().toLocaleTimeString(
            "tr-TR",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );


    db.ref("siparisler")
    .push({

        masa:masa,

        urunler:urunler,

        toplam:toplam,

        zaman:zaman,

        durum:"bekliyor"

    })
    .then(()=>{

        sepet={};

        sepetGoster();

        modalKapat();

        bildirimGoster(
            "✅ Siparişiniz garsona gönderildi."
        );

    })
    .catch(error=>{

        alert(
            "Sipariş gönderilemedi:\n"
            +error.message
        );

    });

}


/* =====================================================
   MODAL
===================================================== */

function modalKapat(){

    document.getElementById(
        "siparisModal"
    ).style.display="none";

}


/* =====================================================
   GARSON ÇAĞIR
===================================================== */

function garsonCagir(){

    if(
        !confirm(
            "Garson masanıza çağrılsın mı?"
        )
    ){

        return;

    }


    const zaman=
        new Date().toLocaleTimeString(
            "tr-TR",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );


    db.ref("bildirimler")
    .push({

        masa:masa,

        zaman:zaman

    })
    .then(()=>{

        bildirimGoster(
            "🔔 Garson çağrınız gönderildi."
        );

    })
    .catch(error=>{

        alert(
            "Garson çağrısı gönderilemedi:\n"
            +error.message
        );

    });

}


/* =====================================================
   HESAP
   SADECE ONAYLANMIŞ SİPARİŞLER
===================================================== */

db.ref("siparisler")
.on("value",snapshot=>{

    const data=
        snapshot.val() || {};

    const liste=
        document.getElementById(
            "hesapListesi"
        );

    const toplamEl=
        document.getElementById(
            "hesapToplam"
        );


    const urunler={};

    let toplam=0;


    Object.values(data)
    .forEach(siparis=>{

        if(!siparis)
            return;


        if(
            parseInt(siparis.masa)!==
            masa
        )
            return;


        /*
           BEKLEYEN SİPARİŞ
           HESABA GİRMEZ
        */

        if(
            siparis.durum!=="onaylandi"
        )
            return;


        const listeUrun=
            siparis.urunler || {};


        Object.values(listeUrun)
        .forEach(u=>{

            const ad=
                String(
                    u.ad || "Ürün"
                ).trim();

            const key=
                ad.toLowerCase();

            const adet=
                parseInt(u.adet)||0;

            const fiyat=
                parseFloat(u.fiyat)||0;


            if(!urunler[key]){

                urunler[key]={

                    ad:ad,

                    adet:0,

                    fiyat:fiyat

                };

            }


            urunler[key].adet+=adet;


            toplam+=
                adet*fiyat;

        });

    });


    liste.innerHTML="";


    if(
        Object.keys(urunler).length===0
    ){

        liste.innerHTML=`

            <div class="bos-sepet">

                Henüz onaylanmış sipariş
                bulunmuyor.

                <br><br>

                Bekleyen siparişler burada
                görünmez.

            </div>

        `;

    }else{

        Object.values(urunler)
        .forEach(u=>{

            const tutar=
                u.adet*u.fiyat;


            liste.innerHTML+=`

                <div class="hesap-urun">

                    <span>

                        ${escapeHtml(u.ad)}
                        ×${u.adet}

                    </span>

                    <strong>

                        ${tutar.toFixed(2)}
                        TL

                    </strong>

                </div>

            `;

        });

    }


    toplamEl.innerText=
        toplam.toFixed(2)
        +" TL";

});


/* =====================================================
   YAZ BOZ
===================================================== */

let yazboz={

    basladi:false,

    tip:"tekli",

    oyuncuSayisi:2,

    oyunSayisi:2,

    oyunlar:[],

    aktifOyun:1

};


/* =====================================================
   OYUN BAŞLAT
===================================================== */

function yazbozBaslat(){

    const tip=
        document.getElementById(
            "oyunTipi"
        ).value;


    const oyuncuSayisi=
        parseInt(
            document.getElementById(
                "oyuncuSayisi"
            ).value
        );


    const oyunSayisi=
        parseInt(
            document.getElementById(
                "oyunSayisi"
            ).value
        );


    yazboz={

        basladi:true,

        tip:tip,

        oyuncuSayisi:oyuncuSayisi,

        oyunSayisi:oyunSayisi,

        oyunlar:[],

        aktifOyun:1

    };


    for(
        let i=1;
        i<=oyunSayisi;
        i++
    ){

        yazboz.oyunlar.push({

            no:i,

            kilitli:false,

            baslangic:
            i===1
            ?
            Date.now()
            :
            null,

            skorlar:
            Array(
                oyuncuSayisi
            ).fill(null)

        });

    }


    document.getElementById(
        "yazbozKurulum"
    ).style.display="none";


    yazbozGoster();

}


/* =====================================================
   YAZ BOZ GÖSTER
===================================================== */

function yazbozGoster(){

    const alan=
        document.getElementById(
            "yazbozOyunlar"
        );


    alan.innerHTML="";


    yazboz.oyunlar
    .forEach(oyun=>{

        let aktif=false;


        if(
            oyun.no===
            yazboz.aktifOyun
            &&
            !oyun.kilitli
        ){

            aktif=true;

        }


        let skorHtml="";


        for(
            let i=0;
            i<yazboz.oyuncuSayisi;
            i++
        ){

            const deger=
                oyun.skorlar[i]===null
                ?
                ""
                :
                oyun.skorlar[i];


            skorHtml+=`

                <div class="oyuncu-skor">

                    <input
                        type="number"
                        min="0"
                        value="${deger}"
                        placeholder="O${i+1}"
                        ${!aktif ? "disabled":""}
                        onchange="
                        skorDegistir(
                            ${oyun.no},
                            ${i},
                            this.value
                        )"
                    >

                </div>

            `;

        }


        let durum="Kilitli";


        if(aktif){

            durum="Aktif";

        }else if(
            oyun.no>yazboz.aktifOyun
        ){

            durum="Bekliyor";

        }


        alan.innerHTML+=`

            <div
                class="oyun-kart
                ${aktif ? "aktif":""}
                ${oyun.kilitli ? "kilitli":""}">

                <div class="oyun-no">

                    OYUN ${oyun.no}

                </div>

                <div class="oyun-durum">

                    ${
                        oyun.kilitli
                        ?
                        "🔒 KİLİTLİ"
                        :
                        aktif
                        ?
                        "🟢 AKTİF"
                        :
                        "⏳ BEKLİYOR"
                    }

                </div>


                ${skorHtml}


                <div
                    class="skor-toplam"
                    id="oyunToplam-${oyun.no}">

                    ${oyunSkorToplam(oyun)}

                </div>


                ${
                    aktif
                    ?
                    `

                    <button
                        class="oyun-kilit-btn"
                        onclick="
                        oyunuKilitle(
                        ${oyun.no}
                        )">

                        🔒 KİLİTLE

                    </button>

                    `
                    :
                    ""
                }


                ${
                    oyun.kilitli
                    ?
                    `<div class="skor-kilit">
                        ✓ Skor kilitlendi
                    </div>`
                    :
                    ""
                }

            </div>

        `;

    });


    yazbozSonuclariGoster();


    /* İlk aktif oyun için
       otomatik 1 dakika kontrolü */

    const aktif=
        yazboz.oyunlar.find(
            x=>
            x.no===
            yazboz.aktifOyun
            &&
            !x.kilitli
        );


    if(aktif){

        yazbozZamanlayici(
            aktif.no
        );

    }

}


/* =====================================================
   SKOR DEĞİŞTİR
===================================================== */

function skorDegistir(
    oyunNo,
    oyuncu,
    deger
){

    const oyun=
        yazboz.oyunlar.find(
            x=>x.no===oyunNo
        );


    if(!oyun)
        return;


    if(oyun.kilitli)
        return;


    if(
        oyunNo!==yazboz.aktifOyun
    )
        return;


    let skor=
        parseInt(deger);


    if(isNaN(skor))
        skor=0;


    if(skor<0)
        skor=0;


    oyun.skorlar[oyuncu]=skor;


    const toplamEl=
        document.getElementById(
            "oyunToplam-"+oyunNo
        );


    if(toplamEl){

        toplamEl.innerText=
            oyunSkorToplam(oyun);

    }


    yazbozSonuclariGoster();

}


/* =====================================================
   OYUN SKOR TOPLAMI
===================================================== */

function oyunSkorToplam(oyun){

    return oyun.skorlar
    .reduce(
        (toplam,x)=>
            toplam+
            (parseInt(x)||0),
        0
    )
    +" puan";

}


/* =====================================================
   OYUNU KİLİTLE
===================================================== */

function oyunuKilitle(oyunNo){

    const oyun=
        yazboz.oyunlar.find(
            x=>x.no===oyunNo
        );


    if(!oyun)
        return;


    if(
        oyunNo!==yazboz.aktifOyun
    )
        return;


    if(oyun.kilitli)
        return;


    oyun.kilitli=true;


    /*
       Sonraki oyun aktif oluyor
    */

    if(
        yazboz.aktifOyun<
        yazboz.oyunSayisi
    ){

        yazboz.aktifOyun++;

        const sonraki=
            yazboz.oyunlar.find(
                x=>
                x.no===
                yazboz.aktifOyun
            );


        if(sonraki){

            sonraki.baslangic=
                Date.now();

        }

    }


    yazbozGoster();

}


/* =====================================================
   1 DAKİKA ZAMANLAYICI
===================================================== */

function yazbozZamanlayici(oyunNo){

    const oyun=
        yazboz.oyunlar.find(
            x=>x.no===oyunNo
        );


    if(!oyun || oyun.kilitli)
        return;


    const gecen=
        Date.now()-
        oyun.baslangic;


    const kalan=
        60000-gecen;


    if(kalan<=0){

        oyunuKilitle(
            oyunNo
        );

        return;

    }


    setTimeout(()=>{

        yazbozZamanlayici(
            oyunNo
        );

    },1000);

}


/* =====================================================
   YAZ BOZ SONUÇLARI
===================================================== */

function yazbozSonuclariGoster(){

    const sonuc=
        document.getElementById(
            "yazbozSonuc"
        );


    if(!yazboz.basladi){

        sonuc.style.display="none";

        return;

    }


    sonuc.style.display="block";


    const toplamlar=
        Array(
            yazboz.oyuncuSayisi
        ).fill(0);


    yazboz.oyunlar
    .forEach(oyun=>{

        oyun.skorlar
        .forEach((skor,i)=>{

            toplamlar[i]+=
                parseInt(skor)||0;

        });

    });


    let html="<h3>🏆 Toplam Skor</h3>";


    toplamlar
    .forEach((skor,i)=>{

        html+=`

            <div class="skor-satir">

                <span>
                    Oyuncu ${i+1}
                </span>

                <strong>
                    ${skor}
                </strong>

            </div>

        `;

    });


    sonuc.innerHTML=html;

}


/* =====================================================
   BİLDİRİM
===================================================== */

function bildirimGoster(mesaj){

    const el=
        document.getElementById(
            "bildirim"
        );


    el.innerText=mesaj;

    el.style.display="block";


    setTimeout(()=>{

        el.style.display="none";

    },2500);

}


/* =====================================================
   HTML GÜVENLİK
===================================================== */

function escapeHtml(text){

    return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   BAŞLANGIÇ
===================================================== */

sepetGoster();

</script>
