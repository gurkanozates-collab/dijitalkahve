<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dijital Kahvehane</title>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f1ed;
    margin:0;
    padding:10px;
    color:#33251f;
    padding-bottom:80px;
}

/* HEADER */

.header{
    background:linear-gradient(135deg,#3e2723,#6d4c41);
    color:white;
    padding:14px;
    border-radius:12px;
    text-align:center;
    margin-bottom:10px;
    box-shadow:0 3px 10px rgba(0,0,0,.18);
}

.header h2{
    margin:0;
    font-size:21px;
}

.header small{
    opacity:.85;
}

/* NAV */

.nav-btns{
    display:flex;
    gap:6px;
    margin-bottom:10px;
}

.nav-btns button{
    flex:1;
    border:0;
    padding:11px 4px;
    border-radius:8px;
    background:#ddd3ce;
    color:#4e342e;
    font-weight:bold;
    font-size:13px;
}

.nav-btns button.active{
    background:#5d4037;
    color:white;
}

/* PAGE */

.page{
    display:none;
}

.page.active{
    display:block;
}

/* MENU */

.kategori-baslik{
    color:#5d4037;
    font-size:17px;
    border-bottom:2px solid #d7ccc8;
    padding-bottom:5px;
    margin:14px 0 8px;
}

.card{
    background:white;
    padding:10px 12px;
    margin-bottom:7px;
    border-radius:9px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 2px 6px rgba(0,0,0,.08);
}

.card strong{
    font-size:15px;
}

.card small{
    color:#777;
}

.qty-box{
    display:flex;
    align-items:center;
    gap:6px;
}

.qty-box button{
    width:31px;
    height:31px;
    border-radius:50%;
    border:0;
    background:#5d4037;
    color:white;
    font-size:17px;
    font-weight:bold;
}

.qty-box span{
    min-width:18px;
    text-align:center;
    font-weight:bold;
}

.btn-red{
    width:100%;
    border:0;
    background:#d32f2f;
    color:white;
    padding:13px;
    border-radius:9px;
    font-size:16px;
    font-weight:bold;
    margin-top:10px;
}

/* SEPET */

.sepet-bar{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    background:#263238;
    color:white;
    padding:10px 13px;
    display:none;
    justify-content:space-between;
    align-items:center;
    z-index:100;
    box-shadow:0 -3px 10px rgba(0,0,0,.25);
}

.sepet-bar button{
    border:0;
    background:#388e3c;
    color:white;
    padding:9px 16px;
    border-radius:7px;
    font-weight:bold;
}

/* HESAP */

.hesap-card{
    background:white;
    padding:11px;
    margin-bottom:8px;
    border-radius:9px;
    border-left:5px solid #ff9800;
    box-shadow:0 2px 6px rgba(0,0,0,.08);
}

.hesap-card.onayli{
    border-left-color:#388e3c;
}

.hesap-baslik{
    display:flex;
    justify-content:space-between;
    font-weight:bold;
    margin-bottom:5px;
}

.siparis-urun-satir{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:4px 0;
    border-bottom:1px dashed #ddd;
    font-size:14px;
}

/* YAZ BOZ */

.yazboz-wrapper{
    width:100%;
    max-width:480px;
    margin:0 auto;
}

/*
    KOMPAKT TASARIM
    Yaz-boz normal boyutun yaklaşık 1/4'ü
*/

.yazboz-panel{
    background:white;
    border-radius:10px;
    padding:7px;
    box-shadow:0 2px 8px rgba(0,0,0,.10);
}

.yazboz-title{
    font-size:14px;
    font-weight:bold;
    color:#5d4037;
    margin-bottom:6px;
}

.mod-btns{
    display:flex;
    gap:4px;
    margin-bottom:6px;
}

.mod-btns button{
    flex:1;
    padding:6px 3px;
    border:0;
    border-radius:5px;
    background:#eee8e4;
    color:#4e342e;
    font-size:11px;
    font-weight:bold;
}

.mod-btns button.active{
    background:#5d4037;
    color:white;
}

/* KURULUM */

.kurulum{
    background:#fafafa;
    border:1px solid #ddd;
    border-radius:7px;
    padding:7px;
    margin-bottom:7px;
}

.kurulum-row{
    display:flex;
    gap:5px;
    margin-bottom:5px;
}

.kurulum select,
.kurulum input{
    flex:1;
    min-width:0;
    padding:6px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:12px;
}

.btn-baslat{
    width:100%;
    padding:7px;
    border:0;
    border-radius:5px;
    background:#388e3c;
    color:white;
    font-weight:bold;
    font-size:12px;
}

/* OYUN DURUMU */

.oyun-durum{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#3e2723;
    color:white;
    border-radius:6px;
    padding:5px 7px;
    font-size:11px;
    margin-bottom:6px;
}

.sayac{
    font-weight:bold;
    color:#ffeb3b;
}

/* YAZ BOZ TABLO */

.yazboz-scroll{
    overflow-x:auto;
}

.yazboz-table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
    font-size:10px;
}

.yazboz-table th{
    background:#5d4037;
    color:white;
    padding:4px 2px;
    border:1px solid #ddd;
}

.yazboz-table td{
    border:1px solid #ddd;
    padding:2px;
    text-align:center;
    height:28px;
}

.yazboz-table tr.aktif-el{
    background:#fff8e1;
}

.yazboz-table tr.kilitli{
    background:#eeeeee;
    opacity:.75;
}

.yazboz-table input{
    width:100%;
    min-width:0;
    border:0;
    background:transparent;
    text-align:center;
    font-size:11px;
    padding:3px 1px;
}

.yazboz-table input[type="number"]{
    font-weight:bold;
}

.yazboz-table input:disabled{
    color:#777;
}

.el-no{
    width:27px;
    font-weight:bold;
    background:#f1ece8;
}

.kilit-icon{
    font-size:10px;
}

/* SKOR */

.toplam-row{
    background:#eee;
    font-weight:bold;
}

.fark-row{
    background:#fbe9e7;
    color:#c62828;
    font-weight:bold;
}

/* MESAJ */

.el-mesaj{
    text-align:center;
    font-size:10px;
    color:#777;
    margin:5px 0;
}

/* OYUN BUTON */

.yeni-oyun{
    width:100%;
    border:0;
    padding:6px;
    margin-top:6px;
    border-radius:5px;
    background:#d32f2f;
    color:white;
    font-size:11px;
    font-weight:bold;
}

/* MOBİL */

@media(max-width:380px){

    body{
        padding:7px;
    }

    .header h2{
        font-size:18px;
    }

    .nav-btns button{
        font-size:11px;
        padding:9px 2px;
    }

    .yazboz-panel{
        padding:5px;
    }

    .yazboz-table{
        font-size:9px;
    }

    .yazboz-table td{
        height:25px;
    }

}

</style>
</head>

<body>

<div class="header">

    <h2>☕ DİJİTAL KAHVEHANE</h2>

    <small id="masaEtiket">
        Masa Belirtilmedi
    </small>

</div>


<div class="nav-btns">

    <button
        onclick="sayfaAc('menu')"
        class="active"
        id="btn-menu">
        ☕ Menü
    </button>

    <button
        onclick="sayfaAc('hesap')"
        id="btn-hesap">
        🧾 Hesap
    </button>

    <button
        onclick="sayfaAc('yazboz')"
        id="btn-yazboz">
        📝 Yaz-Boz
    </button>

</div>


<!-- ================= MENU ================= -->

<div id="page-menu" class="page active">

    <div id="urunListesi">
        Menü Yükleniyor...
    </div>

    <button
        class="btn-red"
        id="garsonBtn"
        onclick="garsonCagir()">

        🔔 GARSON / OCAKÇI ÇAĞIR

    </button>

</div>


<!-- ================= HESAP ================= -->

<div id="page-hesap" class="page">

    <h3>Masa Hesabı</h3>

    <div id="hesapListesi">
        Yükleniyor...
    </div>

    <div
        id="hesapGenelToplam"
        style="
        text-align:right;
        font-weight:bold;
        font-size:17px;
        margin-top:8px;
        color:#3e2723;
        ">
    </div>

</div>


<!-- ================= YAZ BOZ ================= -->

<div id="page-yazboz" class="page">

    <div class="yazboz-wrapper">

        <div class="yazboz-panel">

            <div class="yazboz-title">
                📝 YAZ-BOZ
            </div>

            <div class="mod-btns">

                <button
                    id="mod-tekli"
                    class="active"
                    onclick="modSec('tekli')">

                    Tekli Oyun

                </button>

                <button
                    id="mod-esli"
                    onclick="modSec('esli')">

                    Eşli Oyun

                </button>

            </div>

            <div id="yazbozAlan"></div>

        </div>

    </div>

</div>


<!-- ================= SEPET ================= -->

<div
    class="sepet-bar"
    id="sepetBar">

    <span id="sepetToplam">
        0 TL
    </span>

    <button onclick="siparisVer()">
        Sipariş Ver
    </button>

</div>


<script>

/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {

    databaseURL:
    "https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
    "dijitalkahve-67f0a",

    storageBucket:
    "dijitalkahve-67f0a.appspot.com",

    messagingSenderId:
    "326476599239"

};

if(!firebase.apps.length){

    firebase.initializeApp(firebaseConfig);

}

const db =
firebase.app().database(
"https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app"
);


/* =========================================================
   MASA
========================================================= */

const urlParams =
new URLSearchParams(window.location.search);

const masa =
urlParams.get('masa') || '1';

document.getElementById('masaEtiket').innerText =
"MASA " + masa;


/* =========================================================
   MENÜ
========================================================= */

let urunlerData = {};

let sepet = {};


db.ref('urunler').on('value',(snapshot)=>{

    urunlerData =
    snapshot.val() || {};

    renderMenu();

});


const kategoriIkon = {

    'Sıcak İçecekler':'☕',

    'Soğuk İçecekler':'🧊',

    'Tatlılar':'🍰',

    'Atıştırmalıklar':'🥪',

    'Diğer':'🍹'

};


const kategoriSirasi = [

    'Sıcak İçecekler',

    'Soğuk İçecekler',

    'Tatlılar',

    'Atıştırmalıklar',

    'Diğer'

];


function renderMenu(){

    const menuList =
    document.getElementById('urunListesi');

    menuList.innerHTML='';

    const keys =
    Object.keys(urunlerData);

    if(keys.length===0){

        menuList.innerHTML =
        '<p style="text-align:center;">Henüz ürün eklenmemiş.</p>';

        return;

    }

    const gruplar={};

    keys.forEach(key=>{

        const kat =
        urunlerData[key].kategori || 'Diğer';

        if(!gruplar[kat])
            gruplar[kat]=[];

        gruplar[kat].push(key);

    });


    const siraliKategoriler = [

        ...kategoriSirasi.filter(
            k=>gruplar[k]
        ),

        ...Object.keys(gruplar)
        .filter(k=>!kategoriSirasi.includes(k))

    ];


    siraliKategoriler.forEach(kat=>{

        let html = `

        <h3 class="kategori-baslik">

            ${kategoriIkon[kat] || '🍽️'}
            ${kat}

        </h3>

        `;


        gruplar[kat].forEach(key=>{

            const item =
            urunlerData[key];

            const adet =
            sepet[key]
            ? sepet[key].adet
            : 0;


            html += `

            <div class="card">

                <span>

                    <strong>
                        ${item.ad}
                    </strong>

                    <br>

                    <small>
                        ${item.fiyat} TL
                    </small>

                </span>


                <div class="qty-box">

                    <button
                    onclick="adetDegistir('${key}',-1)">
                        -
                    </button>

                    <span id="adet-${key}">
                        ${adet}
                    </span>

                    <button
                    onclick="adetDegistir('${key}',1)">
                        +
                    </button>

                </div>

            </div>

            `;

        });


        menuList.innerHTML += html;

    });

}


/* =========================================================
   SEPET
========================================================= */

function adetDegistir(key,delta){

    const item =
    urunlerData[key];

    if(!item)return;

    const mevcut =
    sepet[key]
    ? sepet[key].adet
    : 0;

    const yeni =
    Math.max(0,mevcut+delta);


    if(yeni===0){

        delete sepet[key];

    }else{

        sepet[key]={

            ad:item.ad,

            fiyat:item.fiyat,

            adet:yeni

        };

    }


    const adetElement =
    document.getElementById(
        `adet-${key}`
    );

    if(adetElement)
        adetElement.innerText=yeni;


    sepetGuncelle();

}


function sepetGuncelle(){

    let toplam=0;

    Object.values(sepet).forEach(i=>{

        toplam +=
        (parseFloat(i.fiyat)||0)
        * i.adet;

    });


    const bar =
    document.getElementById(
        'sepetBar'
    );


    if(toplam>0){

        bar.style.display='flex';

        document.getElementById(
            'sepetToplam'
        ).innerText =
        toplam+' TL';

    }else{

        bar.style.display='none';

    }

}


/* =========================================================
   SİPARİŞ
========================================================= */

function siparisVer(){

    if(
        Object.keys(sepet).length===0
    )
        return;


    const toplam =
    Object.values(sepet)
    .reduce(
        (s,i)=>
        s+
        (parseFloat(i.fiyat)||0)
        *i.adet,
        0
    );


    const saat =
    new Date()
    .toLocaleTimeString(
        'tr-TR',
        {
            hour:'2-digit',
            minute:'2-digit'
        }
    );


    db.ref('siparisler')
    .push({

        masa:masa,

        urunler:sepet,

        toplam:toplam,

        zaman:saat,

        durum:'bekliyor'

    })
    .then(()=>{

        alert(
            'Siparişiniz alındı!'
        );

        sepet={};

        renderMenu();

        sepetGuncelle();

    })
    .catch(err=>{

        alert(
            'Hata Oluştu: '+
            err.message
        );

    });

}


/* =========================================================
   HESAP
========================================================= */

db.ref('siparisler')
.orderByChild('masa')
.equalTo(masa)
.on('value',(snapshot)=>{

    renderHesap(
        snapshot.val()
    );

});


function renderHesap(data){

    const container =
    document.getElementById(
        'hesapListesi'
    );

    container.innerHTML='';

    let genelToplam=0;


    if(!data){

        container.innerHTML=
        '<p style="text-align:center;">Henüz sipariş verilmedi.</p>';

        document.getElementById(
            'hesapGenelToplam'
        ).innerText='';

        return;

    }


    Object.keys(data)
    .forEach(orderKey=>{

        const siparis =
        data[orderKey];

        const urunler =
        siparis.urunler || {};

        const onaylandi =
        siparis.durum ===
        'onaylandi';

        let urunHtml='';

        let orderToplam=0;


        Object.keys(urunler)
        .forEach(pKey=>{

            const u =
            urunler[pKey];

            const tutar =
            (parseFloat(u.fiyat)||0)
            *u.adet;

            orderToplam+=tutar;


            if(onaylandi){

                urunHtml += `

                <div class="siparis-urun-satir">

                    <span>
                        ${u.ad} x${u.adet}
                    </span>

                    <span>
                        ${tutar} TL
                    </span>

                </div>

                `;

            }else{

                urunHtml += `

                <div
                class="siparis-urun-satir">

                    <span>
                        ${u.ad}
                    </span>

                    <div class="qty-box">

                        <button
                        onclick="
                        siparisAdetDegistir(
                        '${orderKey}',
                        '${pKey}',
                        -1
                        )">

                            -

                        </button>

                        <span>
                            ${u.adet}
                        </span>

                        <button
                        onclick="
                        siparisAdetDegistir(
                        '${orderKey}',
                        '${pKey}',
                        1
                        )">

                            +

                        </button>

                    </div>

                    <span>
                        ${tutar} TL
                    </span>

                </div>

                `;

            }

        });


        genelToplam +=
        orderToplam;


        container.innerHTML += `

        <div
        class="hesap-card
        ${onaylandi?'onayli':''}">

            <div
            class="hesap-baslik">

                <span>

                    ${
                    onaylandi
                    ? '✅ Onaylandı'
                    : '⏳ Bekliyor'
                    }

                    -

                    Saat ${siparis.zaman}

                </span>

                <span>
                    ${orderToplam} TL
                </span>

            </div>

            ${urunHtml}

        </div>

        `;

    });


    document.getElementById(
        'hesapGenelToplam'
    ).innerText =
    'GENEL TOPLAM: '+
    genelToplam+
    ' TL';

}


/* =========================================================
   SİPARİŞ ADET
========================================================= */

function siparisAdetDegistir(
    orderKey,
    productKey,
    delta
){

    const ref =
    db.ref(
        'siparisler/' +
        orderKey +
        '/urunler/' +
        productKey
    );


    ref.once('value')
    .then(snap=>{

        const u=snap.val();

        if(!u)return;


        const yeniAdet =
        Math.max(
            0,
            u.adet+delta
        );


        if(yeniAdet===0){

            ref.remove()
            .then(()=>
                siparisToplamGuncelle(
                    orderKey
                )
            );

        }else{

            ref.update({
                adet:yeniAdet
            })
            .then(()=>
                siparisToplamGuncelle(
                    orderKey
                )
            );

        }

    });

}


function siparisToplamGuncelle(
    orderKey
){

    db.ref(
        'siparisler/' +
        orderKey +
        '/urunler'
    )
    .once('value')
    .then(snap=>{

        const urunler =
        snap.val() || {};


        if(
            Object.keys(urunler)
            .length===0
        ){

            db.ref(
                'siparisler/'+
                orderKey
            ).remove();

            return;

        }


        let toplam=0;


        Object.values(urunler)
        .forEach(u=>{

            toplam +=
            (parseFloat(u.fiyat)||0)
            *u.adet;

        });


        db.ref(
            'siparisler/' +
            orderKey +
            '/toplam'
        )
        .set(toplam);

    });

}


/* =========================================================
   GARSON ÇAĞIR
========================================================= */

let cagriBekleniyor=false;


db.ref('bildirimler')
.orderByChild('masa')
.equalTo(masa)
.on('value',(snapshot)=>{

    cagriBekleniyor =
    snapshot.exists();

    const btn =
    document.getElementById(
        'garsonBtn'
    );


    if(cagriBekleniyor){

        btn.disabled=true;

        btn.innerText =
        '⏳ GARSON ÇAĞRILDI';

    }else{

        btn.disabled=false;

        btn.innerText =
        '🔔 GARSON / OCAKÇI ÇAĞIR';

    }

});


function garsonCagir(){

    if(cagriBekleniyor)return;


    const saat =
    new Date()
    .toLocaleTimeString(
        'tr-TR',
        {
            hour:'2-digit',
            minute:'2-digit'
        }
    );


    db.ref('bildirimler')
    .push({

        masa:masa,

        zaman:saat

    });

}


/* =========================================================
   SAYFA
========================================================= */

function sayfaAc(sayfa){

    document
    .querySelectorAll('.page')
    .forEach(el=>
        el.classList.remove(
            'active'
        )
    );


    document
    .querySelectorAll('.nav-btns button')
    .forEach(el=>
        el.classList.remove(
            'active'
        )
    );


    document
    .getElementById(
        'page-'+sayfa
    )
    .classList.add('active');


    document
    .getElementById(
        'btn-'+sayfa
    )
    .classList.add('active');

}


/* =========================================================
   YAZ BOZ
========================================================= */

let mod='tekli';

let playerCount=2;

let elSayisi=7;

let oyunBasladi=false;


/*
    HER EL İÇİN:

    {
        scores: [],
        startedAt: null,
        locked: false
    }
*/

let eller=[];

let oyuncuIsimleri=[];


/* =========================================================
   MOD SEÇ
========================================================= */

function modSec(secilen){

    mod=secilen;


    document
    .getElementById('mod-tekli')
    .classList.toggle(
        'active',
        secilen==='tekli'
    );


    document
    .getElementById('mod-esli')
    .classList.toggle(
        'active',
        secilen==='esli'
    );


    renderKurulum();

}


/* =========================================================
   KURULUM
========================================================= */

function renderKurulum(){

    document.getElementById(
        'yazbozAlan'
    ).innerHTML=`

    <div class="kurulum">

        <div class="kurulum-row">

            ${
            mod==='tekli'
            ?

            `
            <select id="oyuncuSayisi">

                <option value="2">
                    2 Oyuncu
                </option>

                <option value="3">
                    3 Oyuncu
                </option>

                <option value="4">
                    4 Oyuncu
                </option>

            </select>
            `

            :

            `
            <input
            type="text"
            value="Takım 1"
            id="takim1">

            <input
            type="text"
            value="Takım 2"
            id="takim2">
            `
            }

        </div>


        <div class="kurulum-row">

            <input
            type="number"
            id="elSayisiInput"
            min="1"
            max="30"
            value="7"
            placeholder="El sayısı">

        </div>


        <button
        class="btn-baslat"
        onclick="oyunuBaslat()">

            ▶ OYUNU BAŞLAT

        </button>

    </div>

    `;

}


/* =========================================================
   OYUNU BAŞLAT
========================================================= */

function oyunuBaslat(){

    elSayisi =
    parseInt(
        document
        .getElementById(
            'elSayisiInput'
        ).value
    ) || 7;


    if(elSayisi<1)
        elSayisi=1;


    if(elSayisi>30)
        elSayisi=30;


    if(mod==='tekli'){

        playerCount =
        parseInt(
            document
            .getElementById(
                'oyuncuSayisi'
            ).value
        );


        oyuncuIsimleri=[];


        for(
            let i=1;
            i<=playerCount;
            i++
        ){

            oyuncuIsimleri.push(
                'Oyuncu '+i
            );

        }

    }else{

        playerCount=2;


        oyuncuIsimleri=[

            document
            .getElementById(
                'takim1'
            ).value ||
            'Takım 1',

            document
            .getElementById(
                'takim2'
            ).value ||
            'Takım 2'

        ];

    }


    eller=[];


    for(
        let i=0;
        i<elSayisi;
        i++
    ){

        eller.push({

            scores:
            new Array(
                playerCount
            ).fill(''),

            startedAt:null,

            locked:false

        });

    }


    oyunBasladi=true;


    renderYazboz();

}


/* =========================================================
   YAZ BOZ RENDER
========================================================= */

function renderYazboz(){

    if(!oyunBasladi){

        renderKurulum();

        return;

    }


    let html=`

    <div class="oyun-durum">

        <span id="aktifElYazisi">
            Hazırlanıyor...
        </span>

        <span
        class="sayac"
        id="genelSayac">
        </span>

    </div>


    <div class="yazboz-scroll">

    <table class="yazboz-table">

        <thead>

            <tr>

                <th class="el-no">
                    #
                </th>
    `;


    oyuncuIsimleri
    .forEach(isim=>{

        html += `

        <th>

            <input
            type="text"
            value="${isim}"
            onchange="
            oyuncuAdiDegistir(
            this,
            ${oyuncuIsimleri.indexOf(isim)}
            )">

        </th>

        `;

    });


    html+=`

            </tr>

        </thead>

        <tbody>

    `;


    for(
        let el=0;
        el<elSayisi;
        el++
    ){

        const oyun =
        eller[el];

        const aktif =
        el===aktifElBul();


        html+=`

        <tr
        class="
        ${aktif?'aktif-el':''}
        ${oyun.locked?'kilitli':''}
        "
        id="el-${el}">

            <td class="el-no">

                ${el+1}

                ${
                oyun.locked
                ? '<br><span class="kilit-icon">🔒</span>'
                : ''
                }

            </td>

        `;


        for(
            let p=0;
            p<playerCount;
            p++
        ){

            const disabled =
            oyun.locked ||
            !aktif;


            html+=`

            <td>

                <input
                type="number"
                value="${oyun.scores[p]}"
                ${disabled?'disabled':''}
                onchange="
                skorDegisti(
                ${el},
                ${p},
                this.value
                )">

            </td>

            `;

        }


        html+=`

        </tr>

        `;

    }


    html+=`

        </tbody>

        <tfoot>

            <tr class="toplam-row">

                <td>
                    Σ
                </td>

    `;


    const toplamlar =
    hesaplaToplamlar();


    for(
        let p=0;
        p<playerCount;
        p++
    ){

        html+=`

        <td>
            ${toplamlar[p]}
        </td>

        `;

    }


    html+=`

            </tr>

            <tr class="fark-row">

                <td>
                    F
                </td>

    `;


    const min =
    Math.min(...toplamlar);


    for(
        let p=0;
        p<playerCount;
        p++
    ){

        const fark =
        toplamlar[p]-min;


        html+=`

        <td>

            ${
            fark===0
            ? 'ÖNDE'
            : '+'+fark
            }

        </td>

        `;

    }


    html+=`

            </tr>

        </tfoot>

    </table>

    </div>


    <div
    class="el-mesaj"
    id="elMesaj">
    </div>


    <button
    class="yeni-oyun"
    onclick="yeniOyun()">

        ↻ Yeni Oyun

    </button>

    `;


    document.getElementById(
        'yazbozAlan'
    ).innerHTML=html;


    durumGuncelle();

}


/* =========================================================
   AKTİF EL
========================================================= */

function aktifElBul(){

    for(
        let i=0;
        i<eller.length;
        i++
    ){

        if(!eller[i].locked)
            return i;

    }


    return -1;

}


/* =========================================================
   SKOR DEĞİŞTİ
========================================================= */

function skorDegisti(
    elIndex,
    playerIndex,
    value
){

    const el =
    eller[elIndex];


    if(el.locked)
        return;


    if(
        elIndex!==aktifElBul()
    )
        return;


    el.scores[playerIndex]=value;


    /*
        TÜM OYUNCULARIN SKORU
        GİRİLDİ Mİ?
    */

    const tamam =
    el.scores.every(
        s =>
        String(s).trim()!==''
    );


    if(tamam && !el.startedAt){

        /*
            İKİNCİ / SON OYUNCUNUN
            SKORU GİRİLDİĞİ ANDA
            SÜRE BAŞLIYOR
        */

        el.startedAt =
        Date.now();

    }


    renderYazboz();

}


/* =========================================================
   OYUNCU ADI
========================================================= */

function oyuncuAdiDegistir(
    input,
    index
){

    oyuncuIsimleri[index] =
    input.value || (
        mod==='esli'
        ? 'Takım '+(index+1)
        : 'Oyuncu '+(index+1)
    );

}


/* =========================================================
   DURUM
========================================================= */

function durumGuncelle(){

    const aktif =
    aktifElBul();


    const yazisi =
    document.getElementById(
        'aktifElYazisi'
    );


    const mesaj =
    document.getElementById(
        'elMesaj'
    );


    const sayac =
    document.getElementById(
        'genelSayac'
    );


    if(aktif===-1){

        yazisi.innerText =
        '✅ OYUN TAMAMLANDI';

        sayac.innerText='';

        mesaj.innerText =
        'Tüm eller kilitlendi.';

        return;

    }


    const el =
    eller[aktif];


    yazisi.innerText =
    'El '+(aktif+1)+' / '+elSayisi;


    const tamam =
    el.scores.every(
        s =>
        String(s).trim()!==''
    );


    if(!tamam){

        sayac.innerText='';

        mesaj.innerText =
        'Bu el için tüm oyuncuların skorunu girin.';

        return;

    }


    if(el.locked){

        sayac.innerText =
        '🔒 KİLİTLİ';

        mesaj.innerText =
        'Bu el artık değiştirilemez.';

        return;

    }


    if(el.startedAt){

        const gecen =
        Math.floor(
            (
                Date.now()
                -
                el.startedAt
            )/1000
        );


        const kalan =
        Math.max(
            0,
            60-gecen
        );


        sayac.innerText =
        '⏱ '+kalan+' sn';


        mesaj.innerText =
        'Tüm skorlar girildi. 60 saniye içinde değiştirilebilir.';


        if(kalan<=0){

            el.locked=true;

            renderYazboz();

            return;

        }

    }

}


/* =========================================================
   ARKA PLAN SAYAÇ
========================================================= */

setInterval(()=>{

    if(!oyunBasladi)
        return;


    const aktif =
    aktifElBul();


    if(aktif===-1)
        return;


    const el =
    eller[aktif];


    /*
        Sayaç yalnızca bütün
        oyuncular skor girdikten
        sonra çalışır.
    */

    const tamam =
    el.scores.every(
        s =>
        String(s).trim()!==''
    );


    if(
        tamam &&
        el.startedAt &&
        !el.locked
    ){

        const gecen =
        Math.floor(
            (
                Date.now()
                -
                el.startedAt
            )/1000
        );


        if(gecen>=60){

            el.locked=true;

            renderYazboz();

        }else{

            const sayac =
            document.getElementById(
                'genelSayac'
            );


            if(sayac){

                sayac.innerText =
                '⏱ '+
                Math.max(
                    0,
                    60-gecen
                )+
                ' sn';

            }

        }

    }

},1000);


/* =========================================================
   TOPLAMLAR
========================================================= */

function hesaplaToplamlar(){

    const totals =
    new Array(
        playerCount
    ).fill(0);


    eller.forEach(el=>{

        el.scores.forEach(
            (score,p)=>{

                totals[p] +=
                parseInt(score)||0;

            }
        );

    });


    return totals;

}


/* =========================================================
   YENİ OYUN
========================================================= */

function yeniOyun(){

    if(
        !confirm(
            'Mevcut yaz-boz silinsin ve yeni oyun başlatılsın mı?'
        )
    )
        return;


    oyunBasladi=false;

    eller=[];

    renderKurulum();

}


/* =========================================================
   BAŞLANGIÇ
========================================================= */

renderKurulum();

</script>

</body>
</html>
