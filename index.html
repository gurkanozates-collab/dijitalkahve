<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dijital Kahvehane</title>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;padding:12px 12px 80px;
 font-family:Arial,sans-serif;
 background:#f5f1ed;color:#30231f
}
.header{
 background:linear-gradient(135deg,#3e2723,#6d4c41);
 color:#fff;text-align:center;padding:16px;
 border-radius:16px;margin-bottom:12px;
 box-shadow:0 5px 15px #0002
}
.header h2{margin:0;font-size:21px}
.header small{opacity:.8}
.nav{
 display:flex;gap:6px;margin-bottom:12px
}
.nav button{
 flex:1;border:0;padding:11px 4px;border-radius:10px;
 background:#e2d7d1;color:#49352d;font-weight:bold
}
.nav button.active{background:#5d4037;color:#fff}

.page{display:none}.page.active{display:block}

.kategori{
 font-size:16px;color:#5d4037;
 border-bottom:2px solid #d7ccc8;
 padding:7px 3px;margin:16px 0 8px
}
.urun{
 background:white;border-radius:13px;padding:11px 13px;
 margin-bottom:7px;display:flex;
 justify-content:space-between;align-items:center;
 box-shadow:0 2px 8px #0000000d
}
.urun strong{font-size:15px}
.urun small{color:#777}

.qty{display:flex;align-items:center;gap:7px}
.qty button{
 width:32px;height:32px;border:0;border-radius:50%;
 background:#5d4037;color:white;font-size:18px;font-weight:bold
}
.qty span{min-width:18px;text-align:center;font-weight:bold}

.sepet{
 position:fixed;bottom:0;left:0;right:0;
 background:#29201d;color:#fff;
 padding:10px 13px;display:none;
 align-items:center;justify-content:space-between;
 z-index:20;box-shadow:0 -4px 15px #0004
}
.sepet button{
 border:0;background:#43a047;color:white;
 padding:10px 18px;border-radius:9px;font-weight:bold
}

.btn-garson{
 width:100%;padding:14px;border:0;border-radius:11px;
 background:#d32f2f;color:white;font-size:16px;font-weight:bold;
 margin-top:12px
}
.btn-garson:disabled{background:#999}

.hesap{
 background:white;border-radius:13px;padding:12px;
 margin-bottom:9px;border-left:5px solid #ff9800;
 box-shadow:0 2px 8px #0001
}
.hesap.onay{border-left-color:#43a047}
.hesap-baslik{
 display:flex;justify-content:space-between;
 font-weight:bold;color:#5d4037;margin-bottom:7px
}
.urun-satir{
 display:flex;justify-content:space-between;
 padding:5px 0;border-bottom:1px dashed #ddd;font-size:14px
}

.toplam{
 text-align:right;font-size:18px;font-weight:bold;
 margin-top:12px;color:#3e2723
}

/* YAZ BOZ */
.modlar{display:flex;gap:6px;margin-bottom:9px}
.modlar button{
 flex:1;padding:9px;border:0;border-radius:8px;
 background:#e5ddd8;font-weight:bold
}
.modlar button.active{background:#5d4037;color:white}

.kurulum{
 background:#fff;padding:12px;border-radius:12px;
 box-shadow:0 2px 8px #0001
}
.kurulum input{
 width:100%;padding:9px;border:1px solid #ccc;
 border-radius:7px;margin:7px 0
}
.baslat{
 width:100%;padding:10px;background:#388e3c;
 color:#fff;border:0;border-radius:8px;font-weight:bold
}

/* KÜÇÜK YAZBOZ */
.yazboz{
 background:#fff;border-radius:10px;padding:7px;
 max-width:430px;margin:auto;
 box-shadow:0 2px 8px #0001;
 overflow:hidden
}
.yazboz table{
 width:100%;border-collapse:collapse;font-size:11px
}
.yazboz th,.yazboz td{
 border:1px solid #ddd;text-align:center;
 padding:3px
}
.yazboz th{background:#5d4037;color:white}
.yazboz input{
 width:100%;border:0;text-align:center;
 font-size:11px;padding:3px
}
.yazboz .kilit{background:#eeeeee;color:#888}
.fark{font-weight:bold;color:#d32f2f;background:#fff0ee}
.elbaslik{
 text-align:center;font-size:11px;
 margin:5px 0;color:#5d4037;font-weight:bold
}
.sayac{font-size:10px;color:#d32f2f}
</style>
</head>

<body>

<div class="header">
<h2>☕ DİJİTAL KAHVEHANE</h2>
<small id="masaEtiket">MASA</small>
</div>

<div class="nav">
<button id="btn-menu" class="active" onclick="sayfaAc('menu')">☕ Menü</button>
<button id="btn-hesap" onclick="sayfaAc('hesap')">🧾 Hesap</button>
<button id="btn-yazboz" onclick="sayfaAc('yazboz')">📝 Yaz-Boz</button>
</div>

<div id="page-menu" class="page active">
<div id="urunListesi">Menü yükleniyor...</div>
<button id="garsonBtn" class="btn-garson" onclick="garsonCagir()">🔔 GARSON / OCAKÇI ÇAĞIR</button>
</div>

<div id="page-hesap" class="page">
<h3>🧾 Masa Hesabı</h3>
<div id="hesapListesi">Yükleniyor...</div>
<div id="hesapGenelToplam" class="toplam"></div>
</div>

<div id="page-yazboz" class="page">
<h3>📝 Yaz-Boz</h3>

<div class="modlar">
<button id="mod-tekli" class="active" onclick="modSec('tekli')">Tekli Oyun</button>
<button id="mod-esli" onclick="modSec('esli')">Eşli Oyun</button>
</div>

<div id="yazbozAlan"></div>
</div>

<div class="sepet" id="sepetBar">
<span id="sepetToplam">0 TL</span>
<button onclick="siparisVer()">Sipariş Ver</button>
</div>

<script>
const firebaseConfig={
 databaseURL:"https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app",
 projectId:"dijitalkahve-67f0a",
 storageBucket:"dijitalkahve-67f0a.appspot.com",
 messagingSenderId:"326476599239"
};

if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
const db=firebase.app().database(
 "https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app"
);

const masa=new URLSearchParams(location.search).get("masa")||"1";
document.getElementById("masaEtiket").innerText="MASA "+masa;

let urunlerData={};
let sepet={};

db.ref("urunler").on("value",s=>{
 urunlerData=s.val()||{};
 renderMenu();
});

const kategoriSirasi=[
"Sıcak İçecekler","Soğuk İçecekler",
"Tatlılar","Atıştırmalıklar","Diğer"
];

const ikon={
"Sıcak İçecekler":"☕",
"Soğuk İçecekler":"🧊",
"Tatlılar":"🍰",
"Atıştırmalıklar":"🥪",
"Diğer":"🍹"
};

function renderMenu(){
 let el=document.getElementById("urunListesi");
 el.innerHTML="";
 let gruplar={};

 Object.keys(urunlerData).forEach(k=>{
  let kat=urunlerData[k].kategori||"Diğer";
  if(!gruplar[kat])gruplar[kat]=[];
  gruplar[kat].push(k);
 });

 let kategoriler=[
  ...kategoriSirasi.filter(x=>gruplar[x]),
  ...Object.keys(gruplar).filter(x=>!kategoriSirasi.includes(x))
 ];

 kategoriler.forEach(kat=>{
  el.innerHTML+=`<div class="kategori">${ikon[kat]||"🍽️"} ${kat}</div>`;

  gruplar[kat].forEach(k=>{
   let u=urunlerData[k];
   let adet=sepet[k]?.adet||0;

   el.innerHTML+=`
   <div class="urun">
    <span><strong>${u.ad}</strong><br><small>${u.fiyat} TL</small></span>
    <div class="qty">
     <button onclick="adetDegistir('${k}',-1)">−</button>
     <span id="adet-${k}">${adet}</span>
     <button onclick="adetDegistir('${k}',1)">+</button>
    </div>
   </div>`;
  });
 });
}

function adetDegistir(k,d){
 let u=urunlerData[k];
 if(!u)return;

 let yeni=Math.max(0,(sepet[k]?.adet||0)+d);

 if(yeni===0)delete sepet[k];
 else sepet[k]={ad:u.ad,fiyat:u.fiyat,adet:yeni};

 let e=document.getElementById("adet-"+k);
 if(e)e.innerText=yeni;

 sepetGuncelle();
}

function sepetGuncelle(){
 let toplam=Object.values(sepet).reduce(
  (s,u)=>s+(parseFloat(u.fiyat)||0)*u.adet,0
 );

 document.getElementById("sepetBar").style.display=
  toplam>0?"flex":"none";

 document.getElementById("sepetToplam").innerText=toplam+" TL";
}

function siparisVer(){
 if(!Object.keys(sepet).length)return;

 let toplam=Object.values(sepet).reduce(
  (s,u)=>s+(parseFloat(u.fiyat)||0)*u.adet,0
 );

 let zaman=new Date().toLocaleTimeString("tr-TR",
 {hour:"2-digit",minute:"2-digit"});

 db.ref("siparisler").push({
  masa,
  urunler:sepet,
  toplam,
  zaman,
  tarih:new Date().toISOString().slice(0,10),
  durum:"bekliyor"
 }).then(()=>{
  alert("Siparişiniz alındı. Garson onayından sonra hesabınıza eklenecektir.");
  sepet={};
  renderMenu();
  sepetGuncelle();
 });
}

/* HESAP */
db.ref("siparisler").orderByChild("masa").equalTo(masa).on("value",s=>{
 renderHesap(s.val());
});

function renderHesap(data){
 let el=document.getElementById("hesapListesi");
 el.innerHTML="";
 let toplam=0;

 if(!data){
  el.innerHTML="<p style='text-align:center'>Henüz onaylanmış sipariş yok.</p>";
  document.getElementById("hesapGenelToplam").innerText="";
  return;
 }

 Object.keys(data).forEach(key=>{
  let sip=data[key];

  /* BEKLEYEN SİPARİŞ HESABA GİRMEZ */
  if(sip.durum!=="onaylandi")return;

  let urunHtml="";
  let araToplam=0;

  Object.values(sip.urunler||{}).forEach(u=>{
   let t=(parseFloat(u.fiyat)||0)*u.adet;
   araToplam+=t;

   urunHtml+=`
   <div class="urun-satir">
    <span>${u.ad} × ${u.adet}</span>
    <span>${t} TL</span>
   </div>`;
  });

  toplam+=araToplam;

  el.innerHTML+=`
  <div class="hesap onay">
   <div class="hesap-baslik">
    <span>✅ Onaylandı</span>
    <span>${araToplam} TL</span>
   </div>
   ${urunHtml}
  </div>`;
 });

 if(!el.innerHTML)
  el.innerHTML="<p style='text-align:center'>Henüz onaylanmış sipariş yok.</p>";

 document.getElementById("hesapGenelToplam").innerText=
  toplam>0?"GENEL TOPLAM: "+toplam+" TL":"";
}

/* GARSON */
let cagri=false;

db.ref("bildirimler").orderByChild("masa").equalTo(masa).on("value",s=>{
 cagri=s.exists();
 let b=document.getElementById("garsonBtn");

 b.disabled=cagri;
 b.innerText=cagri?
 "⏳ GARSON ÇAĞRILDI, BEKLENİYOR...":
 "🔔 GARSON / OCAKÇI ÇAĞIR";
});

function garsonCagir(){
 if(cagri)return;

 db.ref("bildirimler").push({
  masa,
  zaman:new Date().toLocaleTimeString("tr-TR",
  {hour:"2-digit",minute:"2-digit"})
 });
}

/* SAYFALAR */
function sayfaAc(s){
 document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
 document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));

 document.getElementById("page-"+s).classList.add("active");
 document.getElementById("btn-"+s).classList.add("active");
}

/* YAZ BOZ */
let mod="tekli";
let oyuncuSayisi=2;
let elSayisi=7;
let skorlar=[];
let kilitZamanlari=[];

function modSec(m){
 mod=m;
 document.getElementById("mod-tekli").classList.toggle("active",m==="tekli");
 document.getElementById("mod-esli").classList.toggle("active",m==="esli");
 renderKurulum();
}

function renderKurulum(){
 document.getElementById("yazbozAlan").innerHTML=`
 <div class="kurulum">
  <b>${mod==="tekli"?"Tekli Oyun":"Eşli Oyun"}</b>

  ${mod==="tekli"?`
  <label>Oyuncu Sayısı</label>
  <select id="oyuncuInput" style="width:100%;padding:9px">
   <option value="2">2 Oyuncu</option>
   <option value="3">3 Oyuncu</option>
   <option value="4">4 Oyuncu</option>
  </select>`:""}

  <label>El Sayısı</label>
  <input id="elInput" type="number" min="1" value="7">

  <button class="baslat" onclick="oyunuBaslat()">Oyunu Başlat</button>
 </div>`;
}

function oyunuBaslat(){
 elSayisi=Math.max(1,parseInt(document.getElementById("elInput").value)||7);

 if(mod==="tekli")
  oyuncuSayisi=parseInt(document.getElementById("oyuncuInput").value);
 else
  oyuncuSayisi=2;

 skorlar=Array.from({length:elSayisi},()=>Array(oyuncuSayisi).fill(""));
 kilitZamanlari=Array(elSayisi).fill(null);

 renderYazboz();
}

function renderYazboz(){
 let isimler=[];

 for(let i=0;i<oyuncuSayisi;i++)
  isimler.push(mod==="esli"?"Takım "+(i+1):"Oyuncu "+(i+1));

 let h="";
 isimler.forEach((x,i)=>{
  h+=`<th><input value="${x}"></th>`;
 });

 let rows="";

 for(let el=0;el<elSayisi;el++){
  let kilit=kilitZamanlari[el] &&
   Date.now()-kilitZamanlari[el]>=60000;

  rows+=`<tr><td>${el+1}</td>`;

  for(let o=0;o<oyuncuSayisi;o++){
   rows+=`
   <td class="${kilit?'kilit':''}">
    <input type="number"
     ${kilit?"disabled":""}
     value="${skorlar[el][o]}"
     onchange="skorGir(${el},${o},this.value)">
   </td>`;
  }

  rows+="</tr>";
 }

 let totals=Array(oyuncuSayisi).fill(0);

 skorlar.forEach(r=>r.forEach((v,i)=>{
  totals[i]+=parseInt(v)||0;
 }));

 let t="";
 let f="";
 let min=Math.min(...totals);

 totals.forEach((x,i)=>{
  t+=`<td>${x}</td>`;
  f+=`<td>${x===min?"ÖNDE":"+"+(x-min)}</td>`;
 });

 document.getElementById("yazbozAlan").innerHTML=`
 <div class="yazboz">
  <table>
   <thead><tr><th>El</th>${h}</tr></thead>
   <tbody>${rows}</tbody>
   <tfoot>
    <tr><th>TOP</th>${t}</tr>
    <tr class="fark"><th>FARK</th>${f}</tr>
   </tfoot>
  </table>
  <div class="elbaslik">
   Her elin iki/tüm skorları girilince o el için 1 dakika başlar.
  </div>
 </div>`;

 kontrolKilitler();
}

function skorGir(el,oyuncu,deger){
 if(kilitZamanlari[el] &&
 Date.now()-kilitZamanlari[el]>=60000){
  renderYazboz();
  return;
 }

 skorlar[el][oyuncu]=deger;

 /* TÜM OYUNCULARIN SKORU GİRİLDİ */
 let tamam=skorlar[el].every(x=>x!=="" && x!==null);

 if(tamam && !kilitZamanlari[el]){
  kilitZamanlari[el]=Date.now();
 }

 renderYazboz();
}

function kontrolKilitler(){
 let tekrar=false;

 kilitZamanlari.forEach((z,i)=>{
  if(z && Date.now()-z>=60000)tekrar=true;
 });

 if(tekrar)renderYazboz();

 setTimeout(kontrolKilitler,1000);
}

renderKurulum();
</script>
</body>
</html>
