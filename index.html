<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yaz-Boz</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f1ed;
    color:#3e2723;
}

.yazboz{
    width:100%;
    max-width:1000px;
    margin:auto;
    padding:18px;
}

/* ================= BAŞLIK ================= */

.baslik{
    text-align:center;
    font-size:30px;
    font-weight:bold;
    margin:10px 0 25px;
}

/* ================= AYARLAR ================= */

.ayarlar{
    background:white;
    border-radius:16px;
    padding:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
    margin-bottom:20px;
}

.ayar-baslik{
    font-size:18px;
    font-weight:bold;
    margin-bottom:15px;
}

.secim{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.secim button{
    border:2px solid #ddd;
    background:white;
    padding:14px;
    border-radius:10px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.secim button.aktif{
    background:#5d4037;
    color:white;
    border-color:#5d4037;
}

.oyuncu-secim{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.oyuncu-secim button{
    width:55px;
    height:45px;
    border:2px solid #ddd;
    background:white;
    border-radius:9px;
    font-weight:bold;
    cursor:pointer;
}

.oyuncu-secim button.aktif{
    background:#5d4037;
    color:white;
    border-color:#5d4037;
}

.oyun-sayisi{
    display:flex;
    align-items:center;
    gap:10px;
}

.oyun-sayisi input{
    width:100px;
    padding:12px;
    border:2px solid #ddd;
    border-radius:9px;
    font-size:17px;
    text-align:center;
}

.baslat{
    width:100%;
    margin-top:18px;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#2e7d32;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

/* ================= SKOR TABLOSU ================= */

.tablo{
    background:white;
    border-radius:16px;
    padding:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
    overflow-x:auto;
}

.tablo-grid{
    display:grid;
    gap:0;
    min-width:600px;
}

.hucre{
    min-height:55px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-right:1px solid #ddd;
    border-bottom:1px solid #ddd;
    padding:7px;
}

.baslik-hucre{
    background:#5d4037;
    color:white;
    font-weight:bold;
    min-height:55px;
}

.oyun-adi{
    justify-content:flex-start;
    padding-left:12px;
    font-weight:bold;
    background:#fafafa;
}

.skors{
    width:100%;
    height:40px;
    border:1px solid #ccc;
    border-radius:7px;
    text-align:center;
    font-size:16px;
}

.skors:disabled{
    background:#eee;
    color:#777;
}

.aktif-satir .oyun-adi{
    background:#fff8e1;
    color:#e65100;
}

.kilitli{
    background:#eeeeee !important;
}

.kilit-icon{
    margin-left:5px;
}

/* ================= KONTROLLER ================= */

.kontrol{
    margin-top:15px;
    text-align:center;
}

.kaydet{
    background:#1565c0;
    color:white;
    border:0;
    padding:13px 25px;
    border-radius:9px;
    font-weight:bold;
    cursor:pointer;
}

.sure{
    margin-top:10px;
    font-size:14px;
    color:#e65100;
    font-weight:bold;
}

/* ================= TOPLAM ================= */

.toplam{
    margin-top:20px;
    background:white;
    border-radius:16px;
    padding:18px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.toplam h3{
    margin-top:0;
}

.toplam-grid{
    display:grid;
    gap:8px;
}

.toplam-satir{
    display:flex;
    justify-content:space-between;
    padding:10px;
    background:#fafafa;
    border-radius:8px;
    font-weight:bold;
}

/* ================= MOBİL ================= */

@media(max-width:600px){

    .yazboz{
        padding:10px;
    }

    .baslik{
        font-size:25px;
    }

    .tablo{
        padding:8px;
    }

}
</style>
</head>

<body>

<div class="yazboz">

    <div class="baslik">
        📝 YAZ-BOZ
    </div>


    <!-- ================= AYARLAR ================= -->

    <div id="ayarlar" class="ayarlar">

        <div class="ayar-baslik">
            Oyun Türü
        </div>

        <div class="secim">

            <button
                id="esliBtn"
                class="aktif"
                onclick="oyunTuruSec('esli')">

                👥 EŞLİ OYUN

            </button>

            <button
                id="tekliBtn"
                onclick="oyunTuruSec('tekli')">

                👤 TEKLİ OYUN

            </button>

        </div>


        <div
            id="oyuncuSecimAlani"
            style="margin-top:20px;">

            <div class="ayar-baslik">
                Oyuncu Sayısı
            </div>

            <div class="oyuncu-secim">

                <button
                    class="aktif"
                    onclick="oyuncuSayisiSec(2,this)">

                    2

                </button>

            </div>

        </div>


        <div style="margin-top:20px;">

            <div class="ayar-baslik">
                Kaç Oyun Oynanacak?
            </div>

            <div class="oyun-sayisi">

                <input
                    type="number"
                    id="oyunSayisi"
                    value="7"
                    min="1"
                    max="100"
                >

                <span>
                    oyun
                </span>

            </div>

        </div>


        <button
            class="baslat"
            onclick="oyunuBaslat()">

            ▶ OYUNU BAŞLAT

        </button>

    </div>


    <!-- ================= TABLO ================= -->

    <div
        id="oyunAlani"
        style="display:none;">

        <div class="tablo">

            <div
                id="skorTablosu"
                class="tablo-grid">

            </div>

        </div>


        <div class="kontrol">

            <button
                id="kaydetBtn"
                class="kaydet"
                onclick="skorlariKaydet()">

                ✓ SKORLARI KAYDET

            </button>

            <div
                id="sure"
                class="sure">

            </div>

        </div>


        <div class="toplam">

            <h3>
                🏆 TOPLAM SKOR
            </h3>

            <div
                id="toplamSkor"
                class="toplam-grid">

            </div>

        </div>

    </div>

</div>


<script>

/* =====================================================
   DEĞİŞKENLER
===================================================== */

let oyunTuru="esli";

let oyuncuSayisi=2;

let oyunSayisi=7;

let aktifOyun=1;

let oyunlar=[];

let kilitZamani=null;

let zamanlayici=null;


/* =====================================================
   OYUN TÜRÜ
===================================================== */

function oyunTuruSec(tur){

    oyunTuru=tur;

    document
        .getElementById("esliBtn")
        .classList.remove("aktif");

    document
        .getElementById("tekliBtn")
        .classList.remove("aktif");


    if(tur==="esli"){

        document
            .getElementById("esliBtn")
            .classList.add("aktif");

        oyuncuSayisi=2;

        document
            .getElementById("oyuncuSecimAlani")
            .innerHTML=`

                <div class="ayar-baslik">
                    Oyuncu Sayısı
                </div>

                <div class="oyuncu-secim">

                    <button class="aktif">
                        2
                    </button>

                </div>

            `;

    }else{

        document
            .getElementById("tekliBtn")
            .classList.add("aktif");


        document
            .getElementById("oyuncuSecimAlani")
            .innerHTML=`

                <div class="ayar-baslik">
                    Oyuncu Sayısı
                </div>

                <div class="oyuncu-secim">

                    <button
                        class="aktif"
                        onclick="oyuncuSayisiSec(2,this)">
                        2
                    </button>

                    <button
                        onclick="oyuncuSayisiSec(3,this)">
                        3
                    </button>

                    <button
                        onclick="oyuncuSayisiSec(4,this)">
                        4
                    </button>

                </div>

            `;

    }

}


/* =====================================================
   OYUNCU SAYISI
===================================================== */

function oyuncuSayisiSec(sayi,button){

    oyuncuSayisi=sayi;

    document
        .querySelectorAll(
            ".oyuncu-secim button"
        )
        .forEach(btn=>{
            btn.classList.remove("aktif");
        });

    button.classList.add("aktif");

}


/* =====================================================
   OYUNU BAŞLAT
===================================================== */

function oyunuBaslat(){

    oyunSayisi=
        parseInt(
            document.getElementById(
                "oyunSayisi"
            ).value
        );


    if(!oyunSayisi || oyunSayisi<1){

        alert(
            "En az 1 oyun seçmelisiniz."
        );

        return;

    }


    if(oyunSayisi>100){

        alert(
            "En fazla 100 oyun seçebilirsiniz."
        );

        return;

    }


    aktifOyun=1;

    oyunlar=[];

    for(let i=1;i<=oyunSayisi;i++){

        oyunlar.push({

            skor:Array(
                oyuncuSayisi
            ).fill(""),

            kilitli:false,

            kayitZamani:null

        });

    }


    document
        .getElementById("ayarlar")
        .style.display="none";


    document
        .getElementById("oyunAlani")
        .style.display="block";


    tabloyuOlustur();

    toplamSkoruGoster();

}


/* =====================================================
   TABLOYU OLUŞTUR
===================================================== */

function tabloyuOlustur(){

    const tablo=
        document.getElementById(
            "skorTablosu"
        );


    tablo.innerHTML="";


    /*
       Oyun sütunu + oyuncular
    */

    tablo.style.gridTemplateColumns=
        `130px repeat(${oyuncuSayisi},1fr)`;


    /* BAŞLIK */

    tablo.innerHTML+=`

        <div class="hucre baslik-hucre">

            OYUN

        </div>

    `;


    for(let p=1;p<=oyuncuSayisi;p++){

        tablo.innerHTML+=`

            <div class="hucre baslik-hucre">

                ${p}. OYUNCU

            </div>

        `;

    }


    /* OYUNLAR */

    oyunlar.forEach((oyun,index)=>{

        const no=index+1;

        const aktif=
            no===aktifOyun;


        const kilit=
            oyun.kilitli;


        tablo.innerHTML+=`

            <div
                class="hucre oyun-adi
                ${aktif ? "aktif-satir":""}
                ${kilit ? "kilitli":""}">

                ${no}. OYUN

                ${kilit
                    ? '<span class="kilit-icon">🔒</span>'
                    : ''}

            </div>

        `;


        for(let p=0;p<oyuncuSayisi;p++){

            tablo.innerHTML+=`

                <div
                    class="hucre
                    ${kilit ? "kilitli":""}">

                    <input
                        class="skors"
                        type="number"
                        data-oyun="${index}"
                        data-oyuncu="${p}"
                        value="${oyun.skor[p]}"
                        ${!aktif || kilit
                            ? "disabled"
                            : ""}
                    >

                </div>

            `;

        }

    });


    tablo
        .querySelectorAll(".skors")
        .forEach(input=>{

            input.addEventListener(
                "input",
                function(){

                    const oyun=
                        parseInt(
                            this.dataset.oyun
                        );

                    const oyuncu=
                        parseInt(
                            this.dataset.oyuncu
                        );

                    oyunlar[oyun]
                        .skor[oyuncu]=
                        this.value;

                }
            );

        });


    butonDurumunuGuncelle();

}


/* =====================================================
   SKORLARI KAYDET
===================================================== */

function skorlariKaydet(){

    const oyun=
        oyunlar[aktifOyun-1];


    if(!oyun || oyun.kilitli)
        return;


    for(let i=0;i<oyuncuSayisi;i++){

        if(
            oyun.skor[i]==="" ||
            oyun.skor[i]===null
        ){

            alert(
                "Tüm oyuncuların skorlarını girin."
            );

            return;

        }

    }


    oyun.kayitZamani=
        Date.now();


    oyun.kilitli=false;

    kilitZamani=
        Date.now()+60000;


    document
        .getElementById("kaydetBtn")
        .disabled=true;


    tabloyuOlustur();


    sureGuncelle();


    if(zamanlayici)
        clearInterval(zamanlayici);


    zamanlayici=
        setInterval(
            sureGuncelle,
            1000
        );

}


/* =====================================================
   SÜRE
===================================================== */

function sureGuncelle(){

    if(!kilitZamani)
        return;


    const kalan=
        kilitZamani-Date.now();


    if(kalan<=0){

        clearInterval(
            zamanlayici
        );

        oyunKilitle();

        return;

    }


    const saniye=
        Math.ceil(kalan/1000);


    document
        .getElementById("sure")
        .innerText=
        "🔓 Skorlar kilitleniyor: "
        +saniye+
        " saniye";


}


/* =====================================================
   OYUNU KİLİTLE
===================================================== */

function oyunKilitle(){

    const oyun=
        oyunlar[aktifOyun-1];


    oyun.kilitli=true;

    oyun.kayitZamani=
        Date.now();


    document
        .getElementById("sure")
        .innerText=
        "🔒 Bu oyunun skorları kilitlendi.";


    if(aktifOyun<oyunSayisi){

        aktifOyun++;

        setTimeout(()=>{

            tabloyuOlustur();

            toplamSkoruGoster();

        },800);

    }else{

        tabloyuOlustur();

        toplamSkoruGoster();

        document
            .getElementById("kaydetBtn")
            .style.display="none";

        document
            .getElementById("sure")
            .innerText=
            "🏆 Tüm oyunlar tamamlandı.";

    }

}


/* =====================================================
   BUTON DURUMU
===================================================== */

function butonDurumunuGuncelle(){

    const buton=
        document.getElementById(
            "kaydetBtn"
        );


    if(!buton)
        return;


    if(aktifOyun>oyunSayisi){

        buton.style.display="none";

        return;

    }


    const oyun=
        oyunlar[aktifOyun-1];


    if(
        oyun &&
        !oyun.kilitli
    ){

        buton.style.display=
            "inline-block";

        buton.disabled=false;

    }

}


/* =====================================================
   TOPLAM SKOR
===================================================== */

function toplamSkoruGoster(){

    const alan=
        document.getElementById(
            "toplamSkor"
        );


    alan.innerHTML="";


    for(let p=0;p<oyuncuSayisi;p++){

        let toplam=0;


        oyunlar.forEach(oyun=>{

            const skor=
                parseFloat(
                    oyun.skor[p]
                );


            if(!isNaN(skor)){

                toplam+=skor;

            }

        });


        alan.innerHTML+=`

            <div class="toplam-satir">

                <span>
                    ${p+1}. OYUNCU
                </span>

                <span>
                    ${toplam}
                </span>

            </div>

        `;

    }

}

</script>

</body>
</html>
