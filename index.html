<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dijital Kahve</title>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f1ee;
    color:#3e2723;
}

.header{
    background:linear-gradient(135deg,#3e2723,#795548);
    color:white;
    padding:18px 14px;
    text-align:center;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 3px 15px rgba(0,0,0,.2);
}

.header h1{
    margin:0;
    font-size:23px;
}

.header p{
    margin:6px 0 0;
    font-size:13px;
    color:#eee;
}

.masa-badge{
    display:inline-block;
    margin-top:8px;
    background:rgba(255,255,255,.16);
    padding:6px 12px;
    border-radius:20px;
    font-size:13px;
}

.top-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    padding:12px;
    max-width:700px;
    margin:auto;
}

.top-btn{
    border:0;
    padding:14px 8px;
    border-radius:12px;
    color:white;
    font-weight:bold;
    font-size:14px;
    cursor:pointer;
    box-shadow:0 3px 9px rgba(0,0,0,.12);
}

.garson-btn{
    background:#ffb300;
    color:#3e2723;
}

.siparis-btn{
    background:#2e7d32;
}

.container{
    max-width:700px;
    margin:auto;
    padding:8px 12px 35px;
}

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:14px 2px 10px;
}

.section-title h2{
    margin:0;
    font-size:19px;
}

.category{
    margin-top:18px;
}

.category-title{
    font-size:16px;
    font-weight:bold;
    color:#5d4037;
    margin:10px 2px;
}

.menu-card{
    background:white;
    border-radius:14px;
    margin-bottom:9px;
    padding:13px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 2px 9px rgba(0,0,0,.07);
}

.menu-info{
    min-width:0;
}

.menu-name{
    font-size:16px;
    font-weight:bold;
    color:#4e342e;
}

.menu-price{
    font-size:13px;
    color:#888;
    margin-top:4px;
}

.quantity{
    display:flex;
    align-items:center;
    gap:8px;
    margin-left:8px;
}

.quantity button{
    width:34px;
    height:34px;
    border:0;
    border-radius:50%;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
}

.minus{
    background:#eeeeee;
    color:#555;
}

.plus{
    background:#795548;
    color:white;
}

.quantity-number{
    min-width:24px;
    text-align:center;
    font-size:17px;
    font-weight:bold;
}

.empty{
    background:white;
    padding:25px;
    text-align:center;
    border-radius:14px;
    color:#999;
}

.bottom-space{
    height:25px;
}

/* YAZ BOZ */

.yazboz{
    margin-top:25px;
    background:#fff;
    border-radius:16px;
    padding:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.yazboz-header{
    text-align:center;
    margin-bottom:15px;
}

.yazboz-header h2{
    margin:0;
    font-size:21px;
}

.yazboz-header p{
    margin:5px 0 0;
    color:#888;
    font-size:12px;
}

.setup{
    background:#f7f4f2;
    border-radius:12px;
    padding:12px;
}

.setup label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin:9px 0 5px;
}

.setup select,
.setup input{
    width:100%;
    padding:11px;
    border:1px solid #ddd;
    border-radius:9px;
    background:white;
}

.start-game{
    width:100%;
    border:0;
    margin-top:12px;
    padding:12px;
    border-radius:9px;
    background:#5d4037;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.game-list{
    margin-top:15px;
}

.game-card{
    background:#fafafa;
    border:1px solid #e5e5e5;
    border-radius:12px;
    margin-bottom:10px;
    padding:11px;
}

.game-card.active{
    border:2px solid #795548;
    background:white;
}

.game-card.locked{
    opacity:.75;
}

.game-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:9px;
}

.game-title strong{
    font-size:14px;
}

.status{
    font-size:11px;
    font-weight:bold;
    padding:5px 8px;
    border-radius:15px;
}

.status.active{
    background:#e8f5e9;
    color:#2e7d32;
}

.status.waiting{
    background:#eeeeee;
    color:#777;
}

.status.locked{
    background:#e0f2f1;
    color:#00695c;
}

.player-row{
    display:grid;
    grid-template-columns:1fr 90px;
    align-items:center;
    gap:8px;
    margin:7px 0;
}

.player-row span{
    font-size:13px;
    font-weight:bold;
}

.score-input{
    width:100%;
    padding:9px;
    border:1px solid #ddd;
    border-radius:8px;
    text-align:center;
    font-size:15px;
}

.score-input:disabled{
    background:#eeeeee;
}

.lock-info{
    text-align:center;
    font-size:11px;
    color:#e65100;
    margin-top:8px;
}

.save-score{
    width:100%;
    border:0;
    padding:10px;
    border-radius:8px;
    background:#795548;
    color:white;
    font-weight:bold;
    cursor:pointer;
    margin-top:7px;
}

.save-score:disabled{
    background:#bbb;
    cursor:not-allowed;
}

.hidden{
    display:none!important;
}

.toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:#323232;
    color:white;
    padding:12px 18px;
    border-radius:25px;
    z-index:9999;
    display:none;
    font-size:13px;
}

@media(max-width:500px){

    .header h1{
        font-size:20px;
    }

    .top-buttons{
        grid-template-columns:1fr 1fr;
    }

    .menu-card{
        padding:12px 10px;
    }

    .menu-name{
        font-size:15px;
    }

}

</style>
</head>

<body>

<div class="header">

    <h1>☕ DİJİTAL KAHVE</h1>

    <p>Hoş geldiniz</p>

    <div class="masa-badge" id="masaBilgi">
        Masa belirleniyor...
    </div>

</div>


<!-- ÜST BUTONLAR -->

<div class="top-buttons">

    <button
        class="top-btn garson-btn"
        onclick="garsonCagir()">

        🔔 GARSON ÇAĞIR

    </button>

    <button
        class="top-btn siparis-btn"
        onclick="siparisGonder()">

        🛒 SİPARİŞ GÖNDER

    </button>

</div>


<div class="container">

    <!-- MENÜ -->

    <div class="section-title">

        <h2>☕ Menü</h2>

    </div>

    <div id="menuListesi">

        <div class="empty">
            Menü yükleniyor...
        </div>

    </div>


    <!-- YAZ BOZ -->

    <div class="yazboz">

        <div class="yazboz-header">

            <h2>📝 YAZ BOZ</h2>

            <p>
                Oyununuzu oluşturun ve skorları girin.
            </p>

        </div>


        <!-- OYUN AYARLARI -->

        <div
            id="yazbozSetup"
            class="setup">

            <label>
                Oyun türü
            </label>

            <select id="oyunTuru">

                <option value="tekli">
                    👤 Tekli
                </option>

                <option value="esli">
                    👥 Eşli
                </option>

            </select>


            <label>
                Oyuncu sayısı
            </label>

            <select id="oyuncuSayisi">

                <option value="2">
                    2 Oyuncu
                </option>

                <option value="3">
                    3 Oyuncu
                </option>

                <option value="4">
                    4 Oyuncu
                </option>

                <option value="5">
                    5 Oyuncu
                </option>

                <option value="6">
                    6 Oyuncu
                </option>

            </select>


            <label>
                Kaç oyun oynanacak?
            </label>

            <select id="oyunSayisi">

                <option value="3">
                    3 Oyun
                </option>

                <option value="5">
                    5 Oyun
                </option>

                <option value="7">
                    7 Oyun
                </option>

                <option value="10">
                    10 Oyun
                </option>

                <option value="15">
                    15 Oyun
                </option>

            </select>


            <button
                class="start-game"
                onclick="yazbozBaslat()">

                🎮 OYUNU BAŞLAT

            </button>

        </div>


        <div
            id="oyunListesi"
            class="game-list">

        </div>

    </div>

    <div class="bottom-space"></div>

</div>


<div
    id="toast"
    class="toast">
</div>


<script>

/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig={

    databaseURL:
    "https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
    "dijitalkahve-67f0a",

    storageBucket:
    "dijitalkahve-67f0a.appspot.com",

    messagingSenderId:
    "326476599239"

};

if(!firebase.apps.length){

    firebase.initializeApp(firebaseConfig);

}

const db=firebase.app().database(
    "https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app"
);


/* =====================================================
   MASA NUMARASI
===================================================== */

const urlParams=
    new URLSearchParams(
        window.location.search
    );

let masa=
    parseInt(
        urlParams.get("masa")
    );


if(
    isNaN(masa) ||
    masa<1 ||
    masa>50
){

    masa=1;

}


document.getElementById(
    "masaBilgi"
).innerText=
    "🪑 MASA "+masa;


/* =====================================================
   SEPET
===================================================== */

let sepet={};


/* =====================================================
   TOAST
===================================================== */

function mesaj(text){

    const toast=
        document.getElementById("toast");

    toast.innerText=text;

    toast.style.display="block";

    setTimeout(()=>{

        toast.style.display="none";

    },2500);

}


/* =====================================================
   MENÜ
===================================================== */

function urunleriDinle(){

    db.ref("urunler")
    .on("value",snapshot=>{

        const data=
            snapshot.val() || {};

        const liste=
            document.getElementById(
                "menuListesi"
            );

        liste.innerHTML="";


        if(
            Object.keys(data).length===0
        ){

            /*
              Firebase'de ürün yoksa
              varsayılan ürünleri göster.
            */

            const varsayilan=[

                {
                    id:"cay",
                    ad:"Çay",
                    fiyat:15,
                    kategori:"Sıcak İçecekler"
                },

                {
                    id:"kahve",
                    ad:"Kahve",
                    fiyat:50,
                    kategori:"Sıcak İçecekler"
                },

                {
                    id:"nescafe",
                    ad:"Nescafe",
                    fiyat:55,
                    kategori:"Sıcak İçecekler"
                },

                {
                    id:"tost",
                    ad:"Tost",
                    fiyat:80,
                    kategori:"Atıştırmalıklar"
                },

                {
                    id:"soda",
                    ad:"Soda",
                    fiyat:25,
                    kategori:"Soğuk İçecekler"
                },

                {
                    id:"kola",
                    ad:"Kola",
                    fiyat:40,
                    kategori:"Soğuk İçecekler"
                },

                {
                    id:"fanta",
                    ad:"Fanta",
                    fiyat:40,
                    kategori:"Soğuk İçecekler"
                }

            ];

            urunleriGoster(
                varsayilan
            );

            return;

        }


        const urunler=
            Object.keys(data)
            .map(key=>({

                id:key,

                ...data[key]

            }));


        /*
          Çay Firebase'de yoksa
          otomatik olarak ekle.
        */

        const cayVar=
            urunler.some(
                u=>
                String(u.ad)
                .toLowerCase()
                ==="çay"
            );


        if(!cayVar){

            db.ref("urunler")
            .push({

                ad:"Çay",

                fiyat:15,

                kategori:
                "Sıcak İçecekler"

            });

        }


        urunleriGoster(
            urunler
        );

    });

}


/* =====================================================
   MENÜ GÖSTER
===================================================== */

function urunleriGoster(
    urunler
){

    const liste=
        document.getElementById(
            "menuListesi"
        );

    liste.innerHTML="";


    const kategoriler={};


    urunler.forEach(u=>{

        const kategori=
            u.kategori ||
            "Diğer";


        if(!kategoriler[kategori]){

            kategoriler[kategori]=[];

        }


        kategoriler[kategori]
        .push(u);

    });


    Object.keys(kategoriler)
    .forEach(kategori=>{

        const section=
            document.createElement(
                "div"
            );

        section.className="category";


        section.innerHTML=`

            <div class="category-title">

                ${kategori}

            </div>

        `;


        kategoriler[kategori]
        .forEach(u=>{

            const adet=
                sepet[u.id]
                ? sepet[u.id].adet
                : 0;


            const card=
                document.createElement(
                    "div"
                );

            card.className=
                "menu-card";


            card.innerHTML=`

                <div class="menu-info">

                    <div class="menu-name">

                        ${u.ad}

                    </div>

                    <div class="menu-price">

                        ${parseFloat(u.fiyat||0).toFixed(2)}
                        TL

                    </div>

                </div>


                <div class="quantity">

                    <button
                        class="quantity button minus"
                        onclick="
                        adetAzalt(
                        '${u.id}'
                        )
                        ">

                        −

                    </button>

                    <span
                        class="quantity-number"
                        id="adet-${u.id}">

                        ${adet}

                    </span>

                    <button
                        class="quantity button plus"
                        onclick="
                        adetArtir(
                        '${u.id}',
                        '${String(u.ad).replace(/'/g,"\\'")}',
                        '${u.fiyat}'
                        )
                        ">

                        +

                    </button>

                </div>

            `;


            section.appendChild(
                card
            );

        });


        liste.appendChild(
            section
        );

    });

}


/* =====================================================
   ARTIR
===================================================== */

function adetArtir(
    id,
    ad,
    fiyat
){

    if(!sepet[id]){

        sepet[id]={

            ad:ad,

            fiyat:
            parseFloat(fiyat)||0,

            adet:0

        };

    }


    sepet[id].adet++;


    ekraniGuncelle(
        id
    );

}


/* =====================================================
   AZALT
===================================================== */

function adetAzalt(id){

    if(!sepet[id])
        return;


    sepet[id].adet--;


    if(
        sepet[id].adet<=0
    ){

        delete sepet[id];

    }


    ekraniGuncelle(
        id
    );

}


/* =====================================================
   ADET GÜNCELLE
===================================================== */

function ekraniGuncelle(id){

    const el=
        document.getElementById(
            "adet-"+id
        );

    if(!el)
        return;


    el.innerText=
        sepet[id]
        ? sepet[id].adet
        : 0;

}


/* =====================================================
   SİPARİŞ GÖNDER
===================================================== */

function siparisGonder(){

    const urunler={};


    Object.keys(sepet)
    .forEach(id=>{

        const u=
            sepet[id];


        if(
            !u ||
            u.adet<=0
        )
            return;


        urunler[id]={

            ad:u.ad,

            fiyat:
            parseFloat(u.fiyat)||0,

            adet:
            parseInt(u.adet)||0

        };

    });


    if(
        Object.keys(urunler).length===0
    ){

        mesaj(
            "⚠️ Önce menüden ürün seçin."
        );

        return;

    }


    let toplam=0;


    Object.values(urunler)
    .forEach(u=>{

        toplam +=
            u.adet*u.fiyat;

    });


    const siparis={

        masa:masa,

        urunler:urunler,

        toplam:toplam,

        durum:"bekliyor",

        zaman:
        new Date()
        .toLocaleTimeString(
            "tr-TR"
        )

    };


    db.ref("siparisler")
    .push(siparis)
    .then(()=>{

        sepet={};

        urunleriDinle();

        mesaj(
            "✅ Siparişiniz gönderildi."
        );

    })
    .catch(error=>{

        alert(
            "Sipariş gönderilemedi:\n"+
            error.message
        );

    });

}


/* =====================================================
   GARSON ÇAĞIR
===================================================== */

function garsonCagir(){

    const bildirim={

        masa:masa,

        zaman:
        new Date()
        .toLocaleTimeString(
            "tr-TR"
        )

    };


    db.ref("bildirimler")
    .push(bildirim)
    .then(()=>{

        mesaj(
            "🔔 Garson çağrınız gönderildi."
        );

    })
    .catch(error=>{

        alert(
            "Garson çağrısı gönderilemedi:\n"+
            error.message
        );

    });

}


/* =====================================================
   YAZ BOZ
===================================================== */

let yazbozId=null;

let yazbozData=null;

let kilitTimer=null;


/* =====================================================
   OYUN BAŞLAT
===================================================== */

function yazbozBaslat(){

    const tur=
        document.getElementById(
            "oyunTuru"
        ).value;


    const oyuncu=
        parseInt(
            document.getElementById(
                "oyuncuSayisi"
            ).value
        );


    const oyunSayisi=
        parseInt(
            document.getElementById(
                "oyunSayisi"
            ).value
        );


    yazbozId=
        "masa_"+masa+"_"+Date.now();


    yazbozData={

        masa:masa,

        tur:tur,

        oyuncuSayisi:oyuncu,

        oyunSayisi:oyunSayisi,

        aktifOyun:1,

        oyunlar:{}

    };


    for(
        let i=1;
        i<=oyunSayisi;
        i++
    ){

        yazbozData.oyunlar[i]={

            skorlar:{},

            kilitli:false,

            kilitBaslangic:null

        };


        for(
            let p=1;
            p<=oyuncu;
            p++
        ){

            yazbozData
            .oyunlar[i]
            .skorlar[p]="";

        }

    }


    db.ref(
        "yazboz/"+yazbozId
    )
    .set(yazbozData)
    .then(()=>{

        document.getElementById(
            "yazbozSetup"
        ).classList.add(
            "hidden"
        );


        yazbozGoster();

    });

}


/* =====================================================
   YAZ BOZ GÖSTER
===================================================== */

function yazbozGoster(){

    if(!yazbozData)
        return;


    const liste=
        document.getElementById(
            "oyunListesi"
        );

    liste.innerHTML="";


    for(
        let i=1;
        i<=yazbozData.oyunSayisi;
        i++
    ){

        const oyun=
            yazbozData.oyunlar[i];


        const aktif=
            i===
            yazbozData.aktifOyun;


        const oncekiKilit=
            i<
            yazbozData.aktifOyun;


        let durum="waiting";

        let durumText=
            "🔒 BEKLİYOR";


        if(oyun.kilitli){

            durum="locked";

            durumText=
                "🔒 KİLİTLİ";

        }
        else if(aktif){

            durum="active";

            durumText=
                "🟢 AKTİF";

        }
        else if(oncekiKilit){

            durum="locked";

            durumText=
                "🔒 KİLİTLİ";

        }


        const card=
            document.createElement(
                "div"
            );


        card.className=
            "game-card "+
            (
                aktif
                ? "active"
                : ""
            )+
            (
                oyun.kilitli
                ? " locked"
                : ""
            );


        let players="";


        for(
            let p=1;
            p<=
            yazbozData
            .oyuncuSayisi;
            p++
        ){

            const skor=
                oyun.skorlar[p] || "";


            players+=`

                <div class="player-row">

                    <span>
                        Oyuncu ${p}
                    </span>

                    <input
                        class="score-input"
                        type="number"
                        id="skor-${i}-${p}"
                        value="${skor}"
                        ${!aktif || oyun.kilitli ? "disabled":""}
                        onchange="
                        skorDegisti(
                        ${i},
                        ${p},
                        this.value
                        )
                        "
                    >

                </div>

            `;

        }


        card.innerHTML=`

            <div class="game-title">

                <strong>
                    ${i}. OYUN
                </strong>

                <span
                    class="status ${durum}">

                    ${durumText}

                </span>

            </div>


            ${players}


            ${
                aktif && !oyun.kilitli
                ?
                `

                <button
                    class="save-score"
                    onclick="
                    skorKaydet(${i})
                    ">

                    ✓ SKORLARI KAYDET

                </button>

                `
                :
                ""
            }


            ${
                oyun.kilitBaslangic &&
                !oyun.kilitli
                ?
                `

                <div
                    id="timer-${i}"
                    class="lock-info">

                    ⏱️ Kilitlenmeye hazırlanıyor...

                </div>

                `
                :
                ""
            }

        `;


        liste.appendChild(
            card
        );


        if(
            oyun.kilitBaslangic &&
            !oyun.kilitli
        ){

            kilitSayaciBaslat(
                i
            );

        }

    }

}


/* =====================================================
   SKOR DEĞİŞTİ
===================================================== */

function skorDegisti(
    oyunNo,
    oyuncu,
    deger
){

    if(
        !yazbozData ||
        oyunNo !==
        yazbozData.aktifOyun
    )
        return;


    yazbozData
    .oyunlar[oyunNo]
    .skorlar[oyuncu]=
        deger;


    db.ref(
        "yazboz/"
        +yazbozId
        +"/oyunlar/"
        +oyunNo
        +"/skorlar/"
        +oyuncu
    )
    .set(deger);

}


/* =====================================================
   SKOR KAYDET
===================================================== */

function skorKaydet(
    oyunNo
){

    const oyun=
        yazbozData
        .oyunlar[oyunNo];


    let tamam=true;


    for(
        let p=1;
        p<=
        yazbozData
        .oyuncuSayisi;
        p++
    ){

        const input=
            document.getElementById(
                "skor-"+
                oyunNo+
                "-"+
                p
            );


        if(
            !input ||
            input.value.trim()===""
        ){

            tamam=false;

            break;

        }

    }


    if(!tamam){

        mesaj(
            "⚠️ Tüm oyuncuların skorlarını girin."
        );

        return;

    }


    /*
       İki veya daha fazla skor
       girildikten sonra 60 saniye
       içinde otomatik kilitlenir.
    */

    const baslangic=
        Date.now();


    oyun.kilitBaslangic=
        baslangic;


    db.ref(
        "yazboz/"
        +yazbozId
        +"/oyunlar/"
        +oyunNo
        +"/kilitBaslangic"
    )
    .set(baslangic);


    mesaj(
        "⏱️ Skorlar kaydedildi. 60 saniye sonra kilitlenecek."
    );


    yazbozGoster();


    setTimeout(()=>{

        oyunuKilitle(
            oyunNo
        );

    },60000);

}


/* =====================================================
   KİLİT SAYACI
===================================================== */

function kilitSayaciBaslat(
    oyunNo
){

    const oyun=
        yazbozData
        .oyunlar[oyunNo];


    if(
        !oyun.kilitBaslangic
    )
        return;


    const interval=
        setInterval(()=>{

            if(
                !yazbozData ||
                oyun.kilitli
            ){

                clearInterval(
                    interval
                );

                return;

            }


            const gecen=
                Date.now()
                -
                oyun.kilitBaslangic;


            const kalan=
                Math.max(
                    0,
                    60000-gecen
                );


            const saniye=
                Math.ceil(
                    kalan/1000
                );


            const el=
                document.getElementById(
                    "timer-"+oyunNo
                );


            if(el){

                el.innerText=
                    "⏱️ "+
                    saniye+
                    " saniye sonra kilitlenecek";

            }


            if(
                kalan<=0
            ){

                clearInterval(
                    interval
                );

                oyunuKilitle(
                    oyunNo
                );

            }

        },500);

}


/* =====================================================
   OYUNU KİLİTLE
===================================================== */

function oyunuKilitle(
    oyunNo
){

    if(
        !yazbozData ||
        !yazbozData.oyunlar[oyunNo]
    )
        return;


    const oyun=
        yazbozData
        .oyunlar[oyunNo];


    if(oyun.kilitli)
        return;


    oyun.kilitli=true;


    /*
       Bir sonraki oyunu aktif et.
    */

    if(
        yazbozData.aktifOyun===
        oyunNo &&
        oyunNo<
        yazbozData.oyunSayisi
    ){

        yazbozData.aktifOyun=
            oyunNo+1;

    }


    db.ref(
        "yazboz/"+yazbozId
    )
    .set(yazbozData)
    .then(()=>{

        yazbozGoster();

        mesaj(
            "🔒 "+oyunNo+
            ". oyun kilitlendi."
        );

    });

}


/* =====================================================
   BAŞLANGIÇ
===================================================== */

urunleriDinle();
