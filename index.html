<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dijital Kahvehane</title>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    padding:0;
    padding-bottom:90px;
    font-family:Arial,sans-serif;
    background:#f5f1ed;
    color:#29211d;
}

.header{
    background:linear-gradient(135deg,#3e2723,#6d4033);
    color:white;
    padding:22px 15px;
    text-align:center;
    border-radius:0 0 20px 20px;
    box-shadow:0 4px 15px rgba(0,0,0,.18);
}

.header h2{
    margin:0;
    font-size:23px;
    letter-spacing:.5px;
}

.header small{
    display:block;
    margin-top:7px;
    opacity:.85;
}

.nav-btns{
    display:flex;
    gap:8px;
    padding:14px 12px;
    position:sticky;
    top:0;
    z-index:20;
    background:#f5f1ed;
}

.nav-btns button{
    flex:1;
    border:0;
    padding:13px 5px;
    border-radius:12px;
    background:#e4d9d2;
    color:#4e342e;
    font-weight:bold;
    cursor:pointer;
}

.nav-btns button.active{
    background:#5d4037;
    color:white;
}

.page{
    display:none;
    padding:0 12px;
}

.page.active{
    display:block;
}

.kategori-baslik{
    color:#5d4037;
    border-bottom:2px solid #d7ccc8;
    padding-bottom:7px;
    margin:16px 0 10px;
}

.card{
    background:white;
    padding:14px;
    margin-bottom:9px;
    border-radius:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 2px 8px rgba(0,0,0,.07);
}

.qty-box{
    display:flex;
    align-items:center;
    gap:9px;
}

.qty-box button{
    width:36px;
    height:36px;
    border:0;
    border-radius:50%;
    background:#5d4037;
    color:white;
    font-size:20px;
    font-weight:bold;
}

.qty-box span{
    min-width:22px;
    text-align:center;
    font-weight:bold;
}

.btn-red{
    width:100%;
    border:0;
    background:#c62828;
    color:white;
    padding:16px;
    border-radius:13px;
    font-size:17px;
    font-weight:bold;
    margin-top:15px;
}

.sepet-bar{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:50;
    display:none;
    justify-content:space-between;
    align-items:center;
    padding:13px 15px;
    background:#29211d;
    color:white;
    box-shadow:0 -4px 15px rgba(0,0,0,.25);
}

.sepet-bar button{
    border:0;
    background:#43a047;
    color:white;
    padding:11px 20px;
    border-radius:10px;
    font-weight:bold;
}

/* HESAP */

.hesap-card{
    background:white;
    padding:15px;
    margin-bottom:12px;
    border-radius:14px;
    border-left:6px solid #ff9800;
    box-shadow:0 2px 8px rgba(0,0,0,.07);
}

.hesap-card.onayli{
    border-left-color:#43a047;
}

.hesap-baslik{
    display:flex;
    justify-content:space-between;
    font-weight:bold;
    color:#5d4037;
    margin-bottom:8px;
}

.siparis-urun-satir{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:6px 0;
    border-bottom:1px dashed #ddd;
}

/* YAZ BOZ */

.mod-btns{
    display:flex;
    gap:8px;
    margin-bottom:14px;
}

.mod-btns button{
    flex:1;
    border:0;
    padding:13px 5px;
    border-radius:12px;
    background:#e0d7d2;
    color:#4e342e;
    font-weight:bold;
}

.mod-btns button.active{
    background:#3e2723;
    color:white;
}

.yazboz-kart{
    background:white;
    padding:16px;
    border-radius:16px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.kurulum input,
.kurulum select{
    width:100%;
    padding:13px;
    margin:7px 0 12px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

.baslat-btn{
    width:100%;
    border:0;
    padding:14px;
    background:#388e3c;
    color:white;
    border-radius:11px;
    font-size:16px;
    font-weight:bold;
}

.yazboz-table{
    width:100%;
    border-collapse:collapse;
    margin-top:12px;
    background:white;
}

.yazboz-table th,
.yazboz-table td{
    border:1px solid #ddd;
    padding:7px;
    text-align:center;
}

.yazboz-table th{
    background:#5d4037;
    color:white;
}

.yazboz-table input{
    width:100%;
    min-width:55px;
    padding:9px 3px;
    border:1px solid #ccc;
    border-radius:7px;
    text-align:center;
    font-size:16px;
}

.yazboz-table input:disabled{
    background:#eee;
    color:#777;
}

.fark-row td{
    font-weight:bold;
    color:#c62828;
    background:#ffebee;
}

.el-bilgi{
    text-align:center;
    margin:10px 0;
    font-weight:bold;
    color:#5d4037;
}

.kilit-bilgi{
    text-align:center;
    padding:10px;
    background:#e8f5e9;
    color:#2e7d32;
    border-radius:10px;
    font-weight:bold;
    margin-bottom:10px;
}

.bekliyor-bilgi{
    text-align:center;
    padding:10px;
    background:#fff8e1;
    color:#ef6c00;
    border-radius:10px;
    font-weight:bold;
    margin-bottom:10px;
}

.oyun-tamam{
    background:#e8f5e9;
    color:#2e7d32;
    padding:15px;
    border-radius:12px;
    text-align:center;
    font-weight:bold;
    margin-bottom:10px;
}

.yeni-oyun{
    width:100%;
    border:0;
    background:#c62828;
    color:white;
    padding:13px;
    border-radius:10px;
    font-weight:bold;
    margin-top:12px;
}
</style>
</head>

<body>

<div class="header">
    <h2>☕ DİJİTAL KAHVEHANE</h2>
    <small id="masaEtiket">MASA 1</small>
</div>

<div class="nav-btns">
    <button id="btn-menu" class="active" onclick="sayfaAc('menu')">☕ Menü</button>
    <button id="btn-hesap" onclick="sayfaAc('hesap')">🧾 Hesap</button>
    <button id="btn-yazboz" onclick="sayfaAc('yazboz')">📝 Yaz-Boz</button>
</div>

<!-- MENÜ -->

<div id="page-menu" class="page active">
    <div id="urunListesi">Menü yükleniyor...</div>

    <button id="garsonBtn" class="btn-red" onclick="garsonCagir()">
        🔔 GARSON / OCAKÇI ÇAĞIR
    </button>
</div>

<!-- HESAP -->

<div id="page-hesap" class="page">
    <h3>Masa Hesabı</h3>

    <div id="hesapListesi">
        Yükleniyor...
    </div>

    <div id="hesapGenelToplam"
         style="text-align:right;font-weight:bold;font-size:19px;margin-top:12px;">
    </div>
</div>

<!-- YAZ BOZ -->

<div id="page-yazboz" class="page">

    <h3>📝 Dijital Yaz-Boz</h3>

    <div class="mod-btns">
        <button id="mod-tekli"
                class="active"
                onclick="modSec('tekli')">
            👤 Tekli Oyun
        </button>

        <button id="mod-esli"
                onclick="modSec('esli')">
            👥 Eşli Oyun
        </button>
    </div>

    <div id="yazbozAlan"></div>

</div>

<!-- SEPET -->

<div class="sepet-bar" id="sepetBar">
    <strong id="sepetToplam">0 TL</strong>
    <button onclick="siparisVer()">Sipariş Ver</button>
</div>

<script>

const firebaseConfig = {
    databaseURL:"https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId:"dijitalkahve-67f0a",
    storageBucket:"dijitalkahve-67f0a.appspot.com",
    messagingSenderId:"326476599239"
};

if(!firebase.apps.length){
    firebase.initializeApp(firebaseConfig);
}

const db=firebase.app().database(
    "https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app"
);

const urlParams=new URLSearchParams(window.location.search);

const masa=urlParams.get('masa') || '1';

document.getElementById('masaEtiket').innerText="MASA "+masa;


/* =====================================================
   MENÜ
===================================================== */

let urunlerData={};
let sepet={};

const kategoriIkon={
    'Sıcak İçecekler':'☕',
    'Soğuk İçecekler':'🧊',
    'Tatlılar':'🍰',
    'Atıştırmalıklar':'🥪',
    'Diğer':'🍹'
};

const kategoriSirasi=[
    'Sıcak İçecekler',
    'Soğuk İçecekler',
    'Tatlılar',
    'Atıştırmalıklar',
    'Diğer'
];

db.ref('urunler').on('value',snapshot=>{
    urunlerData=snapshot.val() || {};
    renderMenu();
});

function renderMenu(){

    const menu=document.getElementById('urunListesi');

    menu.innerHTML='';

    const keys=Object.keys(urunlerData);

    if(keys.length===0){
        menu.innerHTML='<p style="text-align:center;">Henüz ürün eklenmemiş.</p>';
        return;
    }

    const gruplar={};

    keys.forEach(key=>{

        const kat=urunlerData[key].kategori || 'Diğer';

        if(!gruplar[kat])
            gruplar[kat]=[];

        gruplar[kat].push(key);
    });

    const kategoriler=[
        ...kategoriSirasi.filter(k=>gruplar[k]),
        ...Object.keys(gruplar).filter(k=>!kategoriSirasi.includes(k))
    ];

    kategoriler.forEach(kat=>{

        menu.innerHTML+=`
            <h3 class="kategori-baslik">
                ${kategoriIkon[kat] || '🍽️'} ${kat}
            </h3>
        `;

        gruplar[kat].forEach(key=>{

            const item=urunlerData[key];

            const adet=sepet[key]
                ? sepet[key].adet
                : 0;

            menu.innerHTML+=`

            <div class="card">

                <span>
                    <strong>${item.ad}</strong><br>
                    <small>${item.fiyat} TL</small>
                </span>

                <div class="qty-box">

                    <button onclick="adetDegistir('${key}',-1)">
                        −
                    </button>

                    <span id="adet-${key}">
                        ${adet}
                    </span>

                    <button onclick="adetDegistir('${key}',1)">
                        +
                    </button>

                </div>

            </div>

            `;
        });
    });
}

function adetDegistir(key,delta){

    const item=urunlerData[key];

    if(!item)return;

    const mevcut=sepet[key]
        ? sepet[key].adet
        : 0;

    const yeni=Math.max(0,mevcut+delta);

    if(yeni===0)
        delete sepet[key];

    else
        sepet[key]={
            ad:item.ad,
            fiyat:item.fiyat,
            adet:yeni
        };

    document.getElementById(`adet-${key}`).innerText=yeni;

    sepetGuncelle();
}

function sepetGuncelle(){

    let toplam=0;

    Object.values(sepet).forEach(i=>{
        toplam+=(parseFloat(i.fiyat)||0)*i.adet;
    });

    const bar=document.getElementById('sepetBar');

    if(toplam>0){

        bar.style.display='flex';

        document.getElementById('sepetToplam').innerText=
            toplam+' TL';

    }else{

        bar.style.display='none';

    }
}

function siparisVer(){

    if(Object.keys(sepet).length===0)
        return;

    const toplam=Object.values(sepet)
        .reduce(
            (s,i)=>s+(parseFloat(i.fiyat)||0)*i.adet,
            0
        );

    const saat=new Date()
        .toLocaleTimeString('tr-TR',{
            hour:'2-digit',
            minute:'2-digit'
        });

    db.ref('siparisler').push({

        masa:masa,

        urunler:sepet,

        toplam:toplam,

        zaman:saat,

        durum:'bekliyor'

    }).then(()=>{

        alert('Siparişiniz alındı.');

        sepet={};

        renderMenu();

        sepetGuncelle();

    });
}


/* =====================================================
   HESAP
===================================================== */

db.ref('siparisler')
.orderByChild('masa')
.equalTo(masa)
.on('value',snapshot=>{

    renderHesap(snapshot.val());

});

function renderHesap(data){

    const container=document.getElementById('hesapListesi');

    container.innerHTML='';

    let genelToplam=0;

    if(!data){

        container.innerHTML=
            '<p style="text-align:center;">Henüz sipariş verilmedi.</p>';

        document.getElementById('hesapGenelToplam').innerText='';

        return;
    }

    Object.keys(data).forEach(orderKey=>{

        const siparis=data[orderKey];

        const urunler=siparis.urunler || {};

        const onaylandi=
            siparis.durum==='onaylandi';

        let html='';

        let toplam=0;

        Object.keys(urunler).forEach(pKey=>{

            const u=urunler[pKey];

            const tutar=
                (parseFloat(u.fiyat)||0)*u.adet;

            toplam+=tutar;

            html+=`

            <div class="siparis-urun-satir">

                <span>
                    ${u.ad} x${u.adet}
                </span>

                <span>
                    ${tutar} TL
                </span>

            </div>

            `;
        });

        genelToplam+=toplam;

        container.innerHTML+=`

        <div class="hesap-card ${onaylandi?'onayli':''}">

            <div class="hesap-baslik">

                <span>
                    ${onaylandi?'✅ Onaylandı':'⏳ Bekliyor'}
                </span>

                <span>
                    ${toplam} TL
                </span>

            </div>

            ${html}

        </div>

        `;

    });

    document.getElementById('hesapGenelToplam').innerText=
        'GENEL TOPLAM: '+genelToplam+' TL';
}


/* =====================================================
   GARSON
===================================================== */

let cagriBekleniyor=false;

db.ref('bildirimler')
.orderByChild('masa')
.equalTo(masa)
.on('value',snapshot=>{

    cagriBekleniyor=snapshot.exists();

    const btn=document.getElementById('garsonBtn');

    if(cagriBekleniyor){

        btn.disabled=true;

        btn.innerText=
            '⏳ GARSON ÇAĞRILDI...';

    }else{

        btn.disabled=false;

        btn.innerText=
            '🔔 GARSON / OCAKÇI ÇAĞIR';

    }
});

function garsonCagir(){

    if(cagriBekleniyor)
        return;

    const saat=new Date()
        .toLocaleTimeString('tr-TR',{
            hour:'2-digit',
            minute:'2-digit'
        });

    db.ref('bildirimler').push({

        masa:masa,

        zaman:saat

    });
}


/* =====================================================
   SAYFA
===================================================== */

function sayfaAc(sayfa){

    document
        .querySelectorAll('.page')
        .forEach(el=>el.classList.remove('active'));

    document
        .querySelectorAll('.nav-btns button')
        .forEach(el=>el.classList.remove('active'));

    document
        .getElementById('page-'+sayfa)
        .classList.add('active');

    document
        .getElementById('btn-'+sayfa)
        .classList.add('active');
}


/* =====================================================
   YAZ BOZ
===================================================== */

let mod='tekli';

let playerCount=4;

let elSayisi=0;

let yazbozOyunId=null;


/* -------------------------
   MOD
------------------------- */

function modSec(secilen){

    mod=secilen;

    document
        .getElementById('mod-tekli')
        .classList.toggle(
            'active',
            secilen==='tekli'
        );

    document
        .getElementById('mod-esli')
        .classList.toggle(
            'active',
            secilen==='esli'
        );

    renderKurulum();
}


/* -------------------------
   KURULUM
------------------------- */

function renderKurulum(){

    document.getElementById('yazbozAlan').innerHTML=`

        <div class="yazboz-kart kurulum">

            <h3>
                ${mod==='tekli'
                    ? '👤 Tekli Oyun'
                    : '👥 Eşli Oyun'}
            </h3>

            ${
                mod==='tekli'
                ? `
                <label>Kaç oyuncu?</label>

                <select id="oyuncuSayisi">

                    <option value="2">2 Oyuncu</option>
                    <option value="3">3 Oyuncu</option>
                    <option value="4" selected>4 Oyuncu</option>
                    <option value="5">5 Oyuncu</option>
                    <option value="6">6 Oyuncu</option>

                </select>
                `
                : `
                <p>
                    Eşli oyunda 2 takım bulunur.
                </p>
                `
            }

            <label>Kaç el oynanacak?</label>

            <input
                type="number"
                id="elSayisiInput"
                min="1"
                max="50"
                value="7"
            >

            <button
                class="baslat-btn"
                onclick="oyunuBaslat()">

                🎮 Oyunu Başlat

            </button>

        </div>

    `;
}


/* -------------------------
   OYUN BAŞLAT
------------------------- */

function oyunuBaslat(){

    elSayisi=
        parseInt(
            document.getElementById(
                'elSayisiInput'
            ).value
        ) || 7;

    if(mod==='tekli'){

        playerCount=
            parseInt(
                document.getElementById(
                    'oyuncuSayisi'
                ).value
            );

    }else{

        playerCount=2;

    }

    yazbozOyunId=
        db.ref('yazboz/'+masa).push().key;

    const oyuncular=[];

    for(let i=0;i<playerCount;i++){

        oyuncular.push(
            mod==='esli'
            ? 'Takım '+(i+1)
            : 'Oyuncu '+(i+1)
        );

    }

    const oyun={

        id:yazbozOyunId,

        mod:mod,

        playerCount:playerCount,

        elSayisi:elSayisi,

        oyuncular:oyuncular,

        currentEl:1,

        eller:{}

    };

    db.ref(
        'yazboz/'+masa+'/'+yazbozOyunId
    ).set(oyun);

    renderYazbozTable(oyun);
}


/* =====================================================
   OYUNU DİNLE
===================================================== */

function oyunDinle(id){

    yazbozOyunId=id;

    db.ref(
        'yazboz/'+masa+'/'+id
    ).on('value',snapshot=>{

        const oyun=snapshot.val();

        if(!oyun)return;

        kontrolEtVeRender(oyun);

    });
}


/* =====================================================
   RENDER
===================================================== */

function kontrolEtVeRender(oyun){

    const now=Date.now();

    let current=oyun.currentEl || 1;

    const eller=oyun.eller || {};

    const mevcut=eller[current];

    /*
       Bütün oyuncular skor girdiyse
       başlangıç zamanı oluştur.
    */

    if(
        mevcut &&
        mevcut.skorlar &&
        !mevcut.baslangicZamani
    ){

        const skorlar=mevcut.skorlar;

        let tamam=true;

        for(let i=0;i<oyun.playerCount;i++){

            if(
                skorlar[i]===undefined ||
                skorlar[i]===''
            ){

                tamam=false;
                break;

            }

        }

        if(tamam){

            db.ref(
                'yazboz/'+masa+'/'+oyun.id+
                '/eller/'+current+
                '/baslangicZamani'
            ).set(firebase.database.ServerValue.TIMESTAMP);

            return;
        }
    }

    /*
       60 saniye dolduysa eli kilitle.
    */

    if(
        mevcut &&
        mevcut.baslangicZamani &&
        !mevcut.kilitli
    ){

        if(
            now-mevcut.baslangicZamani>=60000
        ){

            db.ref(
                'yazboz/'+masa+'/'+oyun.id+
                '/eller/'+current+
                '/kilitli'
            ).set(true);

            if(current<oyun.elSayisi){

                db.ref(
                    'yazboz/'+masa+'/'+oyun.id+
                    '/currentEl'
                ).set(current+1);

            }

            return;
        }
    }

    renderYazbozTable(oyun);
}


/* =====================================================
   TABLO
===================================================== */

function renderYazbozTable(oyun){

    const alan=
        document.getElementById('yazbozAlan');

    const current=
        oyun.currentEl || 1;

    const eller=
        oyun.eller || {};

    let html='';

    html+=`

        <div class="yazboz-kart">

            <div class="el-bilgi">

                EL ${current} / ${oyun.elSayisi}

            </div>

    `;

    const mevcut=eller[current];

    if(mevcut && mevcut.baslangicZamani){

        if(!mevcut.kilitli){

            html+=`

                <div class="bekliyor-bilgi">

                    ⏱️ Bu el tamamlandı.
                    60 saniye içinde kilitlenecek.

                </div>

            `;

        }

    }

    html+=`

        <table class="yazboz-table">

            <thead>

                <tr>
    `;

    for(let i=0;i<oyun.playerCount;i++){

        html+=`

            <th>

                <input
                    type="text"
                    value="${oyun.oyuncular[i]}"
                    onchange="oyuncuAdiDegistir(${i},this.value)"
                >

            </th>

        `;

    }

    html+=`

                </tr>

            </thead>

            <tbody>

                <tr>
    `;

    for(let i=0;i<oyun.playerCount;i++){

        let value='';

        if(
            mevcut &&
            mevcut.skorlar &&
            mevcut.skorlar[i]!==undefined
        ){

            value=mevcut.skorlar[i];

        }

        const disabled=
            mevcut &&
            mevcut.kilitli;

        html+=`

            <td>

                <input
                    type="number"
                    value="${value}"
                    ${disabled?'disabled':''}
                    oninput="skorDegistir(${current},${i},this.value)"
                >

            </td>

        `;

    }

    html+=`

                </tr>

            </tbody>

        </table>

    `;


    /* TOPLAM */

    html+=`

        <table class="yazboz-table">

            <tbody>

                <tr style="font-weight:bold;background:#eee">

    `;

    for(let i=0;i<oyun.playerCount;i++){

        let toplam=
            toplamOyuncu(oyun,i);

        html+=`

            <td>
                ${toplam}
            </td>

        `;

    }

    html+=`

                </tr>

                <tr class="fark-row">

    `;

    const totals=[];

    for(let i=0;i<oyun.playerCount;i++){

        totals.push(
            toplamOyuncu(oyun,i)
        );

    }

    const min=Math.min(...totals);

    for(let i=0;i<oyun.playerCount;i++){

        const fark=
            totals[i]-min;

        html+=`

            <td>
                ${fark===0?'ÖNDE':'+'+fark}
            </td>

        `;

    }

    html+=`

                </tr>

            </tbody>

        </table>

    `;


    if(mevcut && mevcut.kilitli){

        html+=`

            <div class="kilit-bilgi">

                🔒 EL ${current} KİLİTLENDİ

            </div>

        `;

    }


    if(current>=oyun.elSayisi){

        const sonEl=eller[oyun.elSayisi];

        if(sonEl && sonEl.kilitli){

            html+=`

                <div class="oyun-tamam">

                    🏁 OYUN TAMAMLANDI

                </div>

                <button
                    class="yeni-oyun"
                    onclick="renderKurulum()">

                    🔄 Yeni Oyun

                </button>

            `;

        }

    }


    html+=`

        </div>

    `;

    alan.innerHTML=html;
}


/* =====================================================
   SKOR DEĞİŞTİR
===================================================== */

function skorDegistir(el,index,value){

    if(!yazbozOyunId)
        return;

    const ref=
        db.ref(
            'yazboz/'+masa+'/'+
            yazbozOyunId+
            '/eller/'+el+
            '/skorlar/'+index
        );

    ref.set(
        value==='' ? '' : parseInt(value)||0
    );
}


/* =====================================================
   OYUNCU ADI
===================================================== */

function oyuncuAdiDegistir(index,value){

    if(!yazbozOyunId)
        return;

    db.ref(
        'yazboz/'+masa+'/'+
        yazbozOyunId+
        '/oyuncular/'+index
    ).set(value);
}


/* =====================================================
   TOPLAM
===================================================== */

function toplamOyuncu(oyun,index){

    let toplam=0;

    const eller=
        oyun.eller || {};

    Object.values(eller).forEach(el=>{

        if(
            el.skorlar &&
            el.skorlar[index]!==undefined
        ){

            toplam+=
                parseInt(el.skorlar[index])||0;

        }

    });

    return toplam;
}


/* =====================================================
   SON OYUNU BUL
===================================================== */

db.ref('yazboz/'+masa)
.on('value',snapshot=>{

    const data=snapshot.val();

    if(!data)
        return;

    const keys=Object.keys(data);

    if(keys.length===0)
        return;

    const sonId=keys[keys.length-1];

    yazbozOyunId=sonId;

    oyunDinle(sonId);

});


/* =====================================================
   BAŞLANGIÇ
===================================================== */

renderKurulum();

</script>
