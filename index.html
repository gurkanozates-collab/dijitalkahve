<body>

<div class="header">
 <h1>☕ DİJİTAL KAHVE</h1>
 <p>Hoş geldiniz</p>
</div>

<div class="top-buttons">
 <button class="btn-garson" onclick="garsonCagir()">🔔 GARSON ÇAĞIR</button>
 <button class="btn-siparis" onclick="sekmeAc('siparis',1)">🛒 SİPARİŞ VER</button>
</div>

<div class="container">

 <div class="masa-bilgi">
  <strong id="masaText">Masa belirleniyor...</strong>
 </div>

 <div class="tabs">
  <button class="active" onclick="sekmeAc('menu',this)">☕ Menü</button>
  <button onclick="sekmeAc('hesap',this)">🧾 Hesabım</button>
  <button onclick="sekmeAc('yazboz',this)">🎲 Yaz-Boz</button>
 </div>

 <div id="menu" class="tab active">
  <div id="menuListesi">
   <div class="empty">Menü yükleniyor...</div>
  </div>
 </div>

 <div id="siparis" class="tab">
  <div class="sepet">
   <h3>🛒 Siparişiniz</h3>
   <div id="sepetListesi"></div>
   <div class="toplam" id="sepetToplam">0.00 TL</div>
   <button class="btn-gonder" onclick="siparisGonder()">✓ SİPARİŞİ GÖNDER</button>
  </div>
 </div>

 <div id="hesap" class="tab">
  <div class="hesap-card">
   <h3>🧾 Masa Hesabı</h3>
   <div id="hesapListesi">
    <div class="empty">Hesap yükleniyor...</div>
   </div>
   <div class="hesap-total" id="hesapToplam">0.00 TL</div>
  </div>
 </div>

 <div id="yazboz" class="tab">
  <div class="yazboz-wrap">
   <div class="yazboz-title">
    <h2>🎲 Yaz-Boz</h2>
    <span class="yazboz-badge">SKOR TAKİBİ</span>
   </div>
   <div id="yazbozAlan"></div>
  </div>
 </div>

</div>

<script>
const firebaseConfig={
 databaseURL:"https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app",
 projectId:"dijitalkahve-67f0a",
 storageBucket:"dijitalkahve-67f0a.appspot.com",
 messagingSenderId:"326476599239"
};

if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);

const db=firebase.app().database(
 "https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app"
);

const params=new URLSearchParams(location.search);
const masa=parseInt(params.get("masa"))||1;

let sepet={};

document.getElementById("masaText").innerText="MASA "+masa;

function sekmeAc(id,btn){
 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
 document.getElementById(id).classList.add("active");

 if(btn && btn.tagName==="BUTTON"){
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");
 }
}

function garsonCagir(){
 db.ref("bildirimler").push({
  masa:masa,
  zaman:new Date().toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"}),
  zamanMs:Date.now()
 }).then(()=>alert("🔔 Garson çağrıldı."));
}

db.ref("urunler").on("value",snap=>{
 const data=snap.val()||{};
 const groups={};

 Object.keys(data).forEach(k=>{
  const u=data[k];
  const kategori=u.kategori||"Diğer";
  if(!groups[kategori]) groups[kategori]=[];
  groups[kategori].push({...u,id:k});
 });

 let html="";

 Object.keys(groups).forEach(k=>{
  html+=`<div class="kategori"><h3>${k}</h3>`;

  groups[k].forEach(u=>{
   html+=`
   <div class="urun">
    <div>
     <span class="urun-ad">${u.ad}</span>
     <span class="urun-kat">${k}</span>
    </div>
    <div class="urun-sag">
     <span class="fiyat">${parseFloat(u.fiyat||0).toFixed(2)} TL</span>
     <button class="ekle" onclick="sepeteEkle('${u.id}')">+</button>
    </div>
   </div>`;
  });

  html+="</div>";
 });

 document.getElementById("menuListesi").innerHTML=
  html||`<div class="empty">Henüz ürün eklenmemiş.</div>`;
});

function sepeteEkle(id){
 db.ref("urunler/"+id).once("value").then(s=>{
  const u=s.val();
  if(!u)return;

  if(!sepet[id]){
   sepet[id]={
    ad:u.ad,
    fiyat:parseFloat(u.fiyat)||0,
    adet:0
   };
  }

  sepet[id].adet++;
  sepetGoster();
  sekmeAc("siparis");
 });
}

function sepetGoster(){
 const list=document.getElementById("sepetListesi");
 list.innerHTML="";
 let total=0;

 Object.keys(sepet).forEach(id=>{
  const u=sepet[id];
  const tutar=u.adet*u.fiyat;
  total+=tutar;

  list.innerHTML+=`
   <div class="sepet-row">
    <span>${u.ad} <span class="adet">× ${u.adet}</span></span>
    <strong>${tutar.toFixed(2)} TL</strong>
   </div>`;
 });

 if(!Object.keys(sepet).length)
  list.innerHTML=`<div class="empty">Sepet boş.</div>`;

 document.getElementById("sepetToplam").innerText=
  total.toFixed(2)+" TL";
}

function siparisGonder(){
 const keys=Object.keys(sepet);

 if(!keys.length){
  alert("Sepet boş.");
  return;
 }

 const urunler={};
 let toplam=0;

 keys.forEach(id=>{
  const u=sepet[id];

  urunler[id]={
   ad:u.ad,
   fiyat:u.fiyat,
   adet:u.adet
  };

  toplam+=u.adet*u.fiyat;
 });

 db.ref("siparisler").push({
  masa:masa,
  urunler:urunler,
  toplam:toplam,
  durum:"bekliyor",
  zaman:new Date().toLocaleTimeString("tr-TR"),
  zamanMs:Date.now()
 }).then(()=>{
  sepet={};
  sepetGoster();
  alert("✅ Siparişiniz garsona gönderildi.");
  sekmeAc("hesap");
 });
}

db.ref("siparisler").on("value",snap=>{
 const data=snap.val()||{};
 let html="";
 let toplam=0;
 let bekleyen=0;

 Object.values(data).forEach(s=>{
  if(!s || parseInt(s.masa)!==masa)return;

  if(s.durum!=="onaylandi"){
   bekleyen++;
   return;
  }

  const urunler=s.urunler||{};

  Object.values(urunler).forEach(u=>{
   const adet=parseInt(u.adet)||0;
   const fiyat=parseFloat(u.fiyat)||0;
   const tutar=adet*fiyat;
   toplam+=tutar;

   html+=`
   <div class="hesap-row">
    <span>${u.ad} × ${adet}</span>
    <strong>${tutar.toFixed(2)} TL</strong>
   </div>`;
  });
 });

 if(bekleyen){
  html=`
   <div class="bekleyen">
    🕐 ${bekleyen} adet bekleyen sipariş var.
    Garson onayladıktan sonra hesaba eklenecektir.
   </div>`+html;
 }

 if(!html)
  html=`<div class="empty">Henüz onaylanmış sipariş yok.</div>`;

 document.getElementById("hesapListesi").innerHTML=html;
 document.getElementById("hesapToplam").innerText=
  toplam.toFixed(2)+" TL";
});

/* ================= YAZ BOZ ================= */

let yazbozRef=null;
let yazbozData=null;

function yazbozBaslat(){
 const tur=document.getElementById("oyunTuru").value;
 const oyuncuSayisi=parseInt(document.getElementById("oyuncuSayisi").value);
 const oyunSayisi=parseInt(document.getElementById("oyunSayisi").value);

 if(!oyuncuSayisi||!oyunSayisi){
  alert("Oyuncu ve oyun sayısını seçin.");
  return;
 }

 const oyuncular=[];

 for(let i=1;i<=oyuncuSayisi;i++){
  oyuncular.push({
   id:i,
   ad:"Oyuncu "+i
  });
 }

 yazbozData={
  masa:masa,
  tur:tur,
  oyuncuSayisi:oyuncuSayisi,
  oyunSayisi:oyunSayisi,
  aktifOyun:1,
  oyuncular:oyuncular,
  skorlar:{},
  kilitZamani:0,
  oyunBaslatildi:false
 };

 yazbozRef=db.ref("yazbozlar").push();
 yazbozRef.set(yazbozData);
}

function yazbozDinle(){
 if(!yazbozRef)return;

 yazbozRef.on("value",snap=>{
  yazbozData=snap.val();
  yazbozGoster();
 });
}

function yazbozKur(){
 db.ref("yazbozlar").orderByChild("masa").equalTo(masa).limitToLast(1)
 .on("value",snap=>{
  const data=snap.val()||{};
  const keys=Object.keys(data);

  if(!keys.length){
   yazbozData=null;
   yazbozRef=null;
   yazbozGoster();
   return;
  }

  const key=keys[keys.length-1];
  yazbozRef=db.ref("yazbozlar/"+key);

  yazbozRef.on("value",s=>{
   yazbozData=s.val();
   yazbozGoster();
  });
 });
}

function yazbozGoster(){
 const alan=document.getElementById("yazbozAlan");

 if(!yazbozData){
  alan.innerHTML=`
   <div class="yazboz-start">
    <select id="oyunTuru">
     <option value="tekli">👤 Tekli</option>
     <option value="esli">👥 Eşli</option>
    </select>

    <select id="oyuncuSayisi">
     <option value="2">2 Oyuncu</option>
     <option value="3">3 Oyuncu</option>
     <option value="4">4 Oyuncu</option>
     <option value="5">5 Oyuncu</option>
     <option value="6">6 Oyuncu</option>
     <option value="8">8 Oyuncu</option>
    </select>

    <select id="oyunSayisi">
     <option value="3">3 Oyun</option>
     <option value="5">5 Oyun</option>
     <option value="10">10 Oyun</option>
     <option value="15">15 Oyun</option>
     <option value="20">20 Oyun</option>
    </select>

    <button onclick="yazbozBaslat()">🎲 OYUNU BAŞLAT</button>
   </div>`;
  return;
 }

 const aktif=yazbozData.aktifOyun;
 const oyunSayisi=yazbozData.oyunSayisi;
 const skorlar=yazbozData.skorlar||{};
 const oyunSkoru=skorlar["oyun"+aktif]||{};
 const kilitli=yazbozData.kilitZamani &&
  Date.now()>=yazbozData.kilitZamani;

 if(aktif>oyunSayisi){
  yazbozSonuc();
  return;
 }

 let html=`
 <div class="game-info">
  <strong>Oyun ${aktif} / ${oyunSayisi}</strong>
  <span class="timer" id="timer">Hazır</span>
 </div>

 <table class="score-table">
  <thead>
   <tr><th>Oyuncu</th><th>Skor</th></tr>
  </thead>
  <tbody>`;

 yazbozData.oyuncular.forEach(o=>{
  html+=`
   <tr>
    <td>${o.ad}</td>
    <td>
     <input
      class="score-input"
      id="skor-${o.id}"
      type="number"
      value="${oyunSkoru[o.id]??""}"
      ${kilitli?"disabled":""}>
    </td>
   </tr>`;
 });

 html+=`</tbody></table>`;

 if(!oyunSkoru.girildi && !kilitli){
  html+=`
   <button class="btn-score" onclick="skorlariKaydet()">
    ✓ SKORLARI KAYDET
   </button>`;
 }

 if(kilitli){
  html+=`
   <div class="locked">
    🔒 Oyun ${aktif} kilitlendi.<br>
    ${aktif<oyunSayisi
      ?"Sonraki oyun aktif oluyor..."
      :"Oyun tamamlandı."}
   </div>`;
 }

 alan.innerHTML=html;

 if(yazbozData.kilitZamani && !kilitli){
  sayacBaslat();
 }
}

function skorlariKaydet(){
 if(!yazbozRef||!yazbozData)return;

 const aktif=yazbozData.aktifOyun;
 const skor={};

 yazbozData.oyuncular.forEach(o=>{
  const value=document.getElementById("skor-"+o.id).value;
  skor[o.id]=parseInt(value)||0;
 });

 skor.girildi=true;

 yazbozRef.child("skorlar/oyun"+aktif).set(skor).then(()=>{
  const bitis=Date.now()+60000;

  yazbozRef.update({
   kilitZamani:bitis
  });
 });
}

let timerInterval=null;

function sayacBaslat(){
 clearInterval(timerInterval);

 timerInterval=setInterval(()=>{
  if(!yazbozData||!yazbozData.kilitZamani){
   clearInterval(timerInterval);
   return;
  }

  const kalan=Math.max(
   0,
   yazbozData.kilitZamani-Date.now()
  );

  const saniye=Math.ceil(kalan/1000);
  const el=document.getElementById("timer");

  if(el)el.innerText="Değiştirme: "+saniye+" sn";

  if(kalan<=0){
   clearInterval(timerInterval);
   oyunuKilitle();
  }
 },250);
}

function oyunuKilitle(){
 if(!yazbozRef||!yazbozData)return;

 const aktif=yazbozData.aktifOyun;

 yazbozRef.update({
  ["skorlar/oyun"+aktif+"/kilitli"]:true,
  aktifOyun:aktif+1,
  kilitZamani:0
 });
}

function yazbozSonuc(){
 const toplam={};

 yazbozData.oyuncular.forEach(o=>{
  toplam[o.id]={
   ad:o.ad,
   skor:0
  };
 });

 for(let i=1;i<=yazbozData.oyunSayisi;i++){
  const oyun=yazbozData.skorlar["oyun"+i]||{};

  yazbozData.oyuncular.forEach(o=>{
   toplam[o.id].skor+=parseInt(oyun[o.id])||0;
  });
 }

 const sirali=Object.values(toplam)
  .sort((a,b)=>b.skor-a.skor);

 let html=`
 <div class="winner">
  🏆 OYUN TAMAMLANDI
  <br><br>
  🥇 ${sirali[0].ad} — ${sirali[0].skor} puan
 </div>
 <br>`;

 sirali.forEach((o,i)=>{
  html+=`
   <div class="hesap-row">
    <span>${i+1}. ${o.ad}</span>
    <strong>${o.skor} puan</strong>
   </div>`;
 });

 html+=`
 <button class="btn-score" onclick="yazbozYeni()">
  🔄 YENİ OYUN
 </button>`;

 document.getElementById("yazbozAlan").innerHTML=html;
}

function yazbozYeni(){
 if(!yazbozRef)return;

 yazbozRef.remove().then(()=>{
  yazbozRef=null;
  yazbozData=null;
  yazbozGoster();
 });
}

yazbozKur();
sepetGoster();
</script>

</body>
</html>
