<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dijital Kahvehane</title>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    padding:15px;
    padding-bottom:90px;
    font-family:Arial,sans-serif;
    background:#f5f1ed;
    color:#33251f;
}

.header{
    background:linear-gradient(135deg,#3e2723,#6d4c41);
    color:white;
    padding:20px 15px;
    border-radius:16px;
    text-align:center;
    margin-bottom:14px;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.header h2{
    margin:0 0 5px;
    letter-spacing:1px;
}

.nav-btns{
    display:flex;
    gap:7px;
    margin-bottom:15px;
}

.nav-btns button{
    flex:1;
    border:0;
    padding:13px 5px;
    border-radius:10px;
    background:#e0d6d0;
    color:#4e342e;
    font-weight:bold;
    font-size:13px;
}

.nav-btns button.active{
    background:#5d4037;
    color:white;
}

.page{display:none}
.page.active{display:block}

.kategori-baslik{
    color:#5d4037;
    border-bottom:2px solid #d7ccc8;
    padding-bottom:7px;
    margin:20px 0 10px;
}

.kategori-baslik:first-child{
    margin-top:0;
}

.card{
    background:white;
    padding:14px;
    margin-bottom:9px;
    border-radius:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 2px 7px rgba(0,0,0,.07);
}

.card small{
    color:#8d6e63;
}

.qty-box{
    display:flex;
    align-items:center;
    gap:9px;
}

.qty-box button{
    width:35px;
    height:35px;
    border:0;
    border-radius:50%;
    background:#5d4037;
    color:white;
    font-size:19px;
    font-weight:bold;
}

.qty-box span{
    min-width:20px;
    text-align:center;
    font-weight:bold;
}

.btn-red{
    width:100%;
    padding:16px;
    margin-top:15px;
    border:0;
    border-radius:12px;
    background:#c62828;
    color:white;
    font-size:17px;
    font-weight:bold;
}

.btn-red:disabled{
    background:#999;
}

.sepet-bar{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    background:#29201d;
    color:white;
    padding:12px 15px;
    display:none;
    justify-content:space-between;
    align-items:center;
    z-index:100;
    box-shadow:0 -4px 15px rgba(0,0,0,.2);
}

.sepet-bar button{
    border:0;
    background:#43a047;
    color:white;
    padding:11px 18px;
    border-radius:9px;
    font-weight:bold;
}

/* HESAP */

.hesap-card{
    background:white;
    padding:14px;
    margin-bottom:10px;
    border-radius:12px;
    border-left:6px solid #ff9800;
    box-shadow:0 2px 7px rgba(0,0,0,.07);
}

.hesap-card.onayli{
    border-left-color:#43a047;
}

.hesap-baslik{
    display:flex;
    justify-content:space-between;
    font-weight:bold;
    color:#5d4037;
    margin-bottom:8px;
}

.siparis-urun-satir{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:6px;
    padding:6px 0;
    border-bottom:1px dashed #ddd;
}

/* YAZ BOZ */

.oyun-sec{
    display:flex;
    gap:8px;
    margin-bottom:12px;
}

.oyun-sec button{
    flex:1;
    padding:14px 5px;
    border:0;
    border-radius:10px;
    background:#e0d6d0;
    color:#4e342e;
    font-weight:bold;
}

.oyun-sec button.active{
    background:#5d4037;
    color:white;
}

.kurulum{
    background:white;
    padding:16px;
    border-radius:14px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.kurulum label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
}

.kurulum input,
.kurulum select{
    width:100%;
    padding:12px;
    margin-bottom:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

.baslat-btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#388e3c;
    color:white;
    font-weight:bold;
    font-size:16px;
}

.oyun-baslik{
    background:linear-gradient(135deg,#3e2723,#6d4c41);
    color:white;
    padding:15px;
    border-radius:13px;
    margin-bottom:10px;
}

.el-karti{
    background:white;
    margin-bottom:10px;
    border-radius:13px;
    padding:13px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    border-left:6px solid #bdbdbd;
}

.el-karti.aktif{
    border-left-color:#43a047;
}

.el-karti.kilitli{
    border-left-color:#757575;
    opacity:.8;
}

.el-baslik{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
    font-weight:bold;
}

.el-numara{
    color:#5d4037;
    font-size:17px;
}

.durum{
    font-size:13px;
}

.skor-grid{
    display:grid;
    gap:8px;
}

.skor-oyuncu{
    background:#f7f3f0;
    padding:10px;
    border-radius:9px;
}

.skor-oyuncu label{
    display:block;
    font-weight:bold;
    font-size:13px;
    margin-bottom:5px;
}

.skor-oyuncu input{
    width:100%;
    padding:11px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:18px;
    text-align:center;
}

.skor-oyuncu input:disabled{
    background:#e5e5e5;
    color:#555;
}

.sayac{
    text-align:center;
    margin-top:10px;
    padding:8px;
    border-radius:8px;
    background:#fff3e0;
    color:#e65100;
    font-weight:bold;
}

.kilit-bilgi{
    margin-top:8px;
    text-align:center;
    color:#666;
    font-size:13px;
}

.toplam-kart{
    background:#3e2723;
    color:white;
    padding:15px;
    border-radius:13px;
    margin-top:12px;
}

.toplam-satir{
    display:flex;
    justify-content:space-between;
    padding:6px 0;
    border-bottom:1px solid rgba(255,255,255,.2);
}

.yeni-oyun{
    width:100%;
    padding:13px;
    margin-top:10px;
    border:0;
    border-radius:10px;
    background:#d32f2f;
    color:white;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="header">
    <h2>☕ DİJİTAL KAHVEHANE</h2>
    <small id="masaEtiket">MASA 1</small>
</div>

<div class="nav-btns">
    <button id="btn-menu" class="active" onclick="sayfaAc('menu')">☕ Menü</button>
    <button id="btn-hesap" onclick="sayfaAc('hesap')">🧾 Hesap</button>
    <button id="btn-yazboz" onclick="sayfaAc('yazboz')">📝 Yaz-Boz</button>
</div>

<!-- MENÜ -->
<div id="page-menu" class="page active">
    <div id="urunListesi">Menü Yükleniyor...</div>

    <button id="garsonBtn" class="btn-red" onclick="garsonCagir()">
        🔔 GARSON / OCAKÇI ÇAĞIR
    </button>
</div>

<!-- HESAP -->
<div id="page-hesap" class="page">
    <h3>🧾 Masa Hesabı</h3>
    <div id="hesapListesi">Yükleniyor...</div>
    <div id="hesapGenelToplam"
         style="text-align:right;font-weight:bold;font-size:19px;margin-top:12px;color:#3e2723;">
    </div>
</div>

<!-- YAZ BOZ -->
<div id="page-yazboz" class="page">

    <h3>📝 Yaz-Boz</h3>

    <div class="oyun-sec">
        <button id="tekliBtn" class="active" onclick="oyunTipiSec('tekli')">
            👤 Tekli Oyun
        </button>

        <button id="esliBtn" onclick="oyunTipiSec('esli')">
            👥 Eşli Oyun
        </button>
    </div>

    <div id="yazbozAlan"></div>

</div>

<!-- SEPET -->
<div class="sepet-bar" id="sepetBar">
    <strong id="sepetToplam">0 TL</strong>
    <button onclick="siparisVer()">Sipariş Ver</button>
</div>


<script>

/* =========================
   FIREBASE
========================= */

const firebaseConfig = {
    databaseURL:"https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId:"dijitalkahve-67f0a",
    storageBucket:"dijitalkahve-67f0a.appspot.com",
    messagingSenderId:"326476599239"
};

if(!firebase.apps.length){
    firebase.initializeApp(firebaseConfig);
}

const db = firebase.app().database(
    "https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app"
);


/* =========================
   MASA
========================= */

const urlParams = new URLSearchParams(window.location.search);

const masa = urlParams.get("masa") || "1";

document.getElementById("masaEtiket").innerText =
    "MASA " + masa;


/* =========================
   MENÜ
========================= */

let urunlerData = {};
let sepet = {};

const kategoriIkon = {
    "Sıcak İçecekler":"☕",
    "Soğuk İçecekler":"🧊",
    "Tatlılar":"🍰",
    "Atıştırmalıklar":"🥪",
    "Diğer":"🍹"
};

const kategoriSirasi = [
    "Sıcak İçecekler",
    "Soğuk İçecekler",
    "Tatlılar",
    "Atıştırmalıklar",
    "Diğer"
];

db.ref("urunler").on("value",snapshot=>{

    urunlerData = snapshot.val() || {};

    renderMenu();

});


function renderMenu(){

    const menu = document.getElementById("urunListesi");

    menu.innerHTML = "";

    const keys = Object.keys(urunlerData);

    if(keys.length === 0){

        menu.innerHTML =
            "<p style='text-align:center;'>Henüz ürün eklenmemiş.</p>";

        return;
    }

    const gruplar = {};

    keys.forEach(key=>{

        const kat =
            urunlerData[key].kategori || "Diğer";

        if(!gruplar[kat])
            gruplar[kat] = [];

        gruplar[kat].push(key);

    });

    const sirali = [
        ...kategoriSirasi.filter(k=>gruplar[k]),
        ...Object.keys(gruplar)
        .filter(k=>!kategoriSirasi.includes(k))
    ];

    sirali.forEach(kat=>{

        let html =
            `<h3 class="kategori-baslik">
                ${kategoriIkon[kat] || "🍽️"} ${kat}
             </h3>`;

        gruplar[kat].forEach(key=>{

            const item = urunlerData[key];

            const adet =
                sepet[key] ? sepet[key].adet : 0;

            html += `
            <div class="card">

                <span>
                    <strong>${item.ad}</strong><br>
                    <small>${item.fiyat} TL</small>
                </span>

                <div class="qty-box">

                    <button onclick="adetDegistir('${key}',-1)">
                        −
                    </button>

                    <span id="adet-${key}">
                        ${adet}
                    </span>

                    <button onclick="adetDegistir('${key}',1)">
                        +
                    </button>

                </div>

            </div>
            `;

        });

        menu.innerHTML += html;

    });
}


function adetDegistir(key,delta){

    const item = urunlerData[key];

    if(!item) return;

    const mevcut =
        sepet[key] ? sepet[key].adet : 0;

    const yeni =
        Math.max(0,mevcut + delta);

    if(yeni === 0){

        delete sepet[key];

    }else{

        sepet[key] = {
            ad:item.ad,
            fiyat:item.fiyat,
            adet:yeni
        };

    }

    const span =
        document.getElementById("adet-"+key);

    if(span)
        span.innerText = yeni;

    sepetGuncelle();
}


function sepetGuncelle(){

    let toplam = 0;

    Object.values(sepet).forEach(i=>{

        toplam +=
            (parseFloat(i.fiyat)||0) * i.adet;

    });

    const bar =
        document.getElementById("sepetBar");

    if(toplam > 0){

        bar.style.display = "flex";

        document.getElementById("sepetToplam")
            .innerText = toplam + " TL";

    }else{

        bar.style.display = "none";

    }
}


function siparisVer(){

    if(Object.keys(sepet).length === 0)
        return;

    const toplam =
        Object.values(sepet)
        .reduce(
            (s,i)=>
            s+(parseFloat(i.fiyat)||0)*i.adet,
            0
        );

    const saat =
        new Date().toLocaleTimeString(
            "tr-TR",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    db.ref("siparisler").push({

        masa:masa,
        urunler:sepet,
        toplam:toplam,
        zaman:saat,
        durum:"bekliyor"

    }).then(()=>{

        alert("Siparişiniz alındı!");

        sepet = {};

        renderMenu();

        sepetGuncelle();

    });

}


/* =========================
   HESAP
========================= */

db.ref("siparisler")
.orderByChild("masa")
.equalTo(masa)
.on("value",snapshot=>{

    renderHesap(snapshot.val());

});


function renderHesap(data){

    const container =
        document.getElementById("hesapListesi");

    container.innerHTML = "";

    let genelToplam = 0;

    if(!data){

        container.innerHTML =
            "<p style='text-align:center;'>Henüz sipariş verilmedi.</p>";

        document.getElementById("hesapGenelToplam")
            .innerText = "";

        return;
    }

    Object.keys(data).forEach(orderKey=>{

        const siparis = data[orderKey];

        const urunler =
            siparis.urunler || {};

        const onaylandi =
            siparis.durum === "onaylandi";

        let urunHtml = "";

        let orderToplam = 0;

        Object.keys(urunler).forEach(pKey=>{

            const u = urunler[pKey];

            const tutar =
                (parseFloat(u.fiyat)||0)*u.adet;

            orderToplam += tutar;

            if(onaylandi){

                urunHtml += `
                <div class="siparis-urun-satir">
                    <span>${u.ad} x${u.adet}</span>
                    <span>${tutar} TL</span>
                </div>
                `;

            }else{

                urunHtml += `
                <div class="siparis-urun-satir">

                    <span>${u.ad}</span>

                    <div class="qty-box">

                        <button
                         onclick="siparisAdetDegistir(
                         '${orderKey}',
                         '${pKey}',
                         -1)">
                         −
                        </button>

                        <span>${u.adet}</span>

                        <button
                         onclick="siparisAdetDegistir(
                         '${orderKey}',
                         '${pKey}',
                         1)">
                         +
                        </button>

                    </div>

                    <span>${tutar} TL</span>

                </div>
                `;

            }

        });

        genelToplam += orderToplam;

        container.innerHTML += `

        <div class="hesap-card ${onaylandi?"onayli":""}">

            <div class="hesap-baslik">

                <span>
                    ${onaylandi?"✅ Onaylandı":"⏳ Bekliyor"}
                    · ${siparis.zaman}
                </span>

                <span>${orderToplam} TL</span>

            </div>

            ${urunHtml}

        </div>

        `;

    });

    document.getElementById("hesapGenelToplam")
        .innerText =
        "GENEL TOPLAM: " + genelToplam + " TL";

}


function siparisAdetDegistir(
    orderKey,
    productKey,
    delta
){

    const ref =
        db.ref(
            "siparisler/" +
            orderKey +
            "/urunler/" +
            productKey
        );

    ref.once("value").then(snap=>{

        const u = snap.val();

        if(!u) return;

        const yeni =
            Math.max(0,u.adet+delta);

        if(yeni === 0){

            ref.remove()
            .then(()=>siparisToplamGuncelle(orderKey));

        }else{

            ref.update({adet:yeni})
            .then(()=>siparisToplamGuncelle(orderKey));

        }

    });

}


function siparisToplamGuncelle(orderKey){

    db.ref(
        "siparisler/" +
        orderKey +
        "/urunler"
    ).once("value").then(snap=>{

        const urunler =
            snap.val() || {};

        if(Object.keys(urunler).length === 0){

            db.ref(
                "siparisler/"+orderKey
            ).remove();

            return;
        }

        let toplam = 0;

        Object.values(urunler).forEach(u=>{

            toplam +=
                (parseFloat(u.fiyat)||0)*u.adet;

        });

        db.ref(
            "siparisler/" +
            orderKey +
            "/toplam"
        ).set(toplam);

    });

}


/* =========================
   GARSON
========================= */

let cagriBekleniyor = false;

db.ref("bildirimler")
.orderByChild("masa")
.equalTo(masa)
.on("value",snapshot=>{

    cagriBekleniyor =
        snapshot.exists();

    const btn =
        document.getElementById("garsonBtn");

    if(cagriBekleniyor){

        btn.disabled = true;

        btn.innerText =
            "⏳ GARSON ÇAĞRILDI, BEKLENİYOR...";

    }else{

        btn.disabled = false;

        btn.innerText =
            "🔔 GARSON / OCAKÇI ÇAĞIR";

    }

});


function garsonCagir(){

    if(cagriBekleniyor)
        return;

    const saat =
        new Date().toLocaleTimeString(
            "tr-TR",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    db.ref("bildirimler").push({

        masa:masa,
        zaman:saat

    });

}


/* =========================
   SAYFA
========================= */

function sayfaAc(sayfa){

    document
    .querySelectorAll(".page")
    .forEach(el=>
        el.classList.remove("active")
    );

    document
    .querySelectorAll(".nav-btns button")
    .forEach(el=>
        el.classList.remove("active")
    );

    document
    .getElementById("page-"+sayfa)
    .classList.add("active");

    document
    .getElementById("btn-"+sayfa)
    .classList.add("active");

}


/* =====================================================
   YAZ BOZ
===================================================== */

let oyunTipi = "tekli";

let oyuncuSayisi = 2;

let elSayisi = 7;

let oyunBasladi = false;

let oyunState = [];


/* =========================
   OYUN TİPİ
========================= */

function oyunTipiSec(tip){

    oyunTipi = tip;

    document
    .getElementById("tekliBtn")
    .classList.toggle(
        "active",
        tip === "tekli"
    );

    document
    .getElementById("esliBtn")
    .classList.toggle(
        "active",
        tip === "esli"
    );

    oyunBaslangicEkrani();

}


/* =========================
   BAŞLANGIÇ
========================= */

function oyunBaslangicEkrani(){

    document.getElementById("yazbozAlan")
    .innerHTML = `

    <div class="kurulum">

        ${
            oyunTipi === "tekli"

            ? `

            <label>Oyuncu Sayısı</label>

            <select id="oyuncuSayisi">

                <option value="2">2 Oyuncu</option>
                <option value="3">3 Oyuncu</option>
                <option value="4">4 Oyuncu</option>

            </select>

            `

            : `

            <div style="
                background:#f5f1ed;
                padding:12px;
                border-radius:8px;
                margin-bottom:12px;
            ">
                <strong>👥 Eşli Oyun</strong><br>
                <small>2 takım ile oynanır.</small>
            </div>

            `
        }

        <label>El Sayısı</label>

        <input
            type="number"
            id="elSayisi"
            min="1"
            max="50"
            value="7"
        >

        <button
            class="baslat-btn"
            onclick="oyunuBaslat()">
            🎮 OYUNU BAŞLAT
        </button>

    </div>

    `;

}


function oyunuBaslat(){

    elSayisi =
        parseInt(
            document.getElementById("elSayisi").value
        ) || 7;

    if(elSayisi < 1)
        elSayisi = 1;

    if(oyunTipi === "tekli"){

        oyuncuSayisi =
            parseInt(
                document.getElementById(
                    "oyuncuSayisi"
                ).value
            );

    }else{

        oyuncuSayisi = 2;

    }

    oyunState = [];

    for(let i=0;i<elSayisi;i++){

        oyunState.push({

            skorlar:new Array(oyuncuSayisi).fill(null),

            baslangic:null,

            kilit:false

        });

    }

    oyunBasladi = true;

    renderOyun();

}


/* =========================
   OYUN EKRANI
========================= */

function renderOyun(){

    let html = `

    <div class="oyun-baslik">

        <strong>
            ${oyunTipi === "tekli"
            ? "👤 Tekli Oyun"
            : "👥 Eşli Oyun"}
        </strong>

        <div style="font-size:13px;margin-top:5px;">
            ${oyuncuSayisi} ${
                oyunTipi === "tekli"
                ? "oyuncu"
                : "takım"
            } · ${elSayisi} el
        </div>

    </div>

    `;

    for(let i=0;i<elSayisi;i++){

        const el = oyunState[i];

        const aktif =
            i === ilkAktifEl();

        html += renderEl(i,el,aktif);

    }

    html += renderToplam();

    html += `

    <button
        class="yeni-oyun"
        onclick="oyunBaslangicEkrani()">
        🔄 YENİ OYUN
    </button>

    `;

    document.getElementById("yazbozAlan")
        .innerHTML = html;

    baslatAktifKontrol();

}


/* =========================
   AKTİF EL
========================= */

function ilkAktifEl(){

    for(let i=0;i<oyunState.length;i++){

        if(!oyunState[i].kilit)
            return i;

    }

    return -1;

}


/* =========================
   EL ÇİZ
========================= */

function renderEl(index,el,aktif){

    let durum = "";

    if(el.kilit){

        durum =
            `<span style="color:#666;">
                🔒 Kilitli
             </span>`;

    }else if(aktif){

        durum =
            `<span style="color:#2e7d32;">
                🟢 Aktif
             </span>`;

    }else{

        durum =
            `<span style="color:#999;">
                🔒 Sırası Bekleniyor
             </span>`;

    }

    let inputs = "";

    for(let j=0;j<oyuncuSayisi;j++){

        const deger =
            el.skorlar[j] === null
            ? ""
            : el.skorlar[j];

        const isim =
            oyunTipi === "esli"
            ? "Takım "+(j+1)
            : "Oyuncu "+(j+1);

        inputs += `

        <div class="skor-oyuncu">

            <label>${isim}</label>

            <input
                type="number"
                value="${deger}"
                ${(!aktif || el.kilit) ? "disabled":""}
                onchange="skorGir(${index},${j},this.value)"
            >

        </div>

        `;

    }

    let sayac = "";

    if(el.baslangic && !el.kilit){

        sayac = `

        <div
            class="sayac"
            id="sayac-${index}">
            ⏱ Süre hesaplanıyor...
        </div>

        `;

    }

    if(el.kilit){

        sayac = `

        <div class="kilit-bilgi">
            🔒 Bu el 60 saniye sonunda kilitlendi.
        </div>

        `;

    }

    return `

    <div class="el-karti
        ${aktif ? "aktif":""}
        ${el.kilit ? "kilitli":""}">

        <div class="el-baslik">

            <span class="el-numara">
                ${index+1}. EL
            </span>

            <span class="durum">
                ${durum}
            </span>

        </div>

        <div
            class="skor-grid"
            style="grid-template-columns:
            repeat(${oyuncuSayisi},1fr);">

            ${inputs}

        </div>

        ${sayac}

    </div>

    `;

}


/* =========================
   SKOR GİR
========================= */

function skorGir(elIndex,oyuncuIndex,value){

    const el =
        oyunState[elIndex];

    if(!el) return;

    if(el.kilit) return;

    if(elIndex !== ilkAktifEl())
        return;

    if(value === ""){

        el.skorlar[oyuncuIndex] = null;

    }else{

        el.skorlar[oyuncuIndex] =
            parseInt(value);

    }

    const tumSkorlarGirildi =
        el.skorlar.every(
            skor => skor !== null
        );

    if(tumSkorlarGirildi && !el.baslangic){

        /*
         * İKİ / TÜM SKORLAR GİRİLDİ.
         * TAM BU ANDA 60 SANİYE BAŞLAR.
         */

        el.baslangic =
            Date.now();

        localStorage.setItem(
            "yazboz_"+masa,
            JSON.stringify(oyunState)
        );

        renderOyun();

    }else{

        localStorage.setItem(
            "yazboz_"+masa,
            JSON.stringify(oyunState)
        );

    }

}


/* =========================
   AKTİF EL KONTROLÜ
========================= */

let kontrolTimer = null;

function baslatAktifKontrol(){

    if(kontrolTimer)
        clearInterval(kontrolTimer);

    kontrolTimer =
        setInterval(()=>{

            let degisti = false;

            oyunState.forEach((el,index)=>{

                if(
                    el.baslangic &&
                    !el.kilit
                ){

                    const gecen =
                        Date.now() - el.baslangic;

                    if(gecen >= 60000){

                        el.kilit = true;

                        degisti = true;

                    }

                }

            });

            if(degisti){

                localStorage.setItem(
                    "yazboz_"+masa,
                    JSON.stringify(oyunState)
                );

                renderOyun();

            }else{

                oyunState.forEach((el,index)=>{

                    if(
                        el.baslangic &&
                        !el.kilit
                    ){

                        const sayac =
                            document.getElementById(
                                "sayac-"+index
                            );

                        if(sayac){

                            const kalan =
                                Math.max(
                                    0,
                                    60000 -
                                    (Date.now()-el.baslangic)
                                );

                            const saniye =
                                Math.ceil(kalan/1000);

                            sayac.innerText =
                                "⏱ Kilitlenmesine: "
                                + saniye +
                                " saniye";

                        }

                    }

                });

            }

        },250);

}


/* =========================
   TOPLAM
========================= */

function renderToplam(){

    let toplamlar =
        new Array(oyuncuSayisi).fill(0);

    oyunState.forEach(el=>{

        el.skorlar.forEach((skor,i)=>{

            if(skor !== null){

                toplamlar[i] +=
                    Number(skor) || 0;

            }

        });

    });

    let html = `

    <div class="toplam-kart">

        <strong>📊 TOPLAM SKORLAR</strong>

    `;

    toplamlar.forEach((toplam,i)=>{

        const isim =
            oyunTipi === "esli"
            ? "Takım "+(i+1)
            : "Oyuncu "+(i+1);

        html += `

        <div class="toplam-satir">

            <span>${isim}</span>

            <strong>${toplam}</strong>

        </div>

        `;

    });

    html += `</div>`;

    return html;

}


/* =========================
   SAYFA AÇILDIĞINDA
   KAYITLI OYUNU GERİ GETİR
========================= */

function yazbozKayitYukle(){

    const kayit =
        localStorage.getItem(
            "yazboz_"+masa
        );

    if(!kayit)
        return;

    try{

        const data =
            JSON.parse(kayit);

        if(
            Array.isArray(data) &&
            data.length > 0
        ){

            oyunState = data;

            elSayisi =
                data.length;

            oyuncuSayisi =
                data[0].skorlar.length;

            oyunBasladi = true;

            renderOyun();

        }

    }catch(e){

        console.log(e);

    }

}


/* =========================
   BAŞLANGIÇ
========================= */

oyunBaslangicEkrani();

yazbozKayitYukle();

</script>
