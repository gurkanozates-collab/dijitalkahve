<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dijital Kahve</title>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f5f2ef;
 color:#3e2723;
}
.header{
 background:linear-gradient(135deg,#3e2723,#795548);
 color:white;
 padding:20px;
 text-align:center;
}
.header h1{margin:0}
.header p{margin:6px 0 0;font-size:13px}
.container{max-width:700px;margin:auto;padding:15px}
.masa-box{
 background:white;
 padding:15px;
 border-radius:14px;
 margin-bottom:15px;
 box-shadow:0 3px 12px #0001;
}
.masa-box input{
 width:100%;
 padding:13px;
 border:1px solid #ddd;
 border-radius:9px;
 font-size:16px;
}
.tabs{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
 margin-bottom:15px;
}
.tabs button{
 padding:13px;
 border:0;
 border-radius:10px;
 background:#ddd;
 font-weight:bold;
 cursor:pointer;
}
.tabs button.active{
 background:#5d4037;
 color:white;
}
.tab{display:none}
.tab.active{display:block}
.kategori{
 margin:20px 0 10px;
 font-size:19px;
 font-weight:bold;
}
.urun{
 background:white;
 padding:14px;
 margin-bottom:9px;
 border-radius:12px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 box-shadow:0 2px 8px #0001;
}
.urun small{color:#999}
.ekle{
 background:#5d4037;
 color:white;
 border:0;
 border-radius:8px;
 padding:9px 13px;
 font-weight:bold;
}
.sepet{
 background:white;
 border-radius:14px;
 padding:15px;
 box-shadow:0 3px 12px #0001;
}
.sepet-row{
 display:flex;
 justify-content:space-between;
 padding:10px 0;
 border-bottom:1px solid #eee;
}
.adet{
 display:flex;
 gap:7px;
 align-items:center;
}
.adet button{
 width:28px;
 height:28px;
 border:0;
 border-radius:50%;
 background:#ddd;
}
.toplam{
 text-align:right;
 font-size:20px;
 font-weight:bold;
 margin-top:15px;
}
.gonder,.garson{
 width:100%;
 border:0;
 padding:14px;
 border-radius:10px;
 margin-top:10px;
 color:white;
 font-weight:bold;
}
.gonder{background:#2e7d32}
.garson{background:#ff9800;color:#222}
.yazboz{
 width:100%;
 min-height:260px;
 border:1px solid #ddd;
 border-radius:10px;
 padding:12px;
 font-size:16px;
 resize:vertical;
}
.hesap-card{
 background:white;
 padding:15px;
 border-radius:14px;
 box-shadow:0 3px 12px #0001;
 margin-bottom:10px;
}
.bos{
 text-align:center;
 color:#999;
 padding:25px;
}
</style>
</head>

<body>

<div class="header">
<h1>☕ DİJİTAL KAHVE</h1>
<p>QR Menü • Sipariş • Hesap</p>
</div>

<div class="container">

<div class="masa-box">
<b>🪑 Masa Numaranız</b>
<input id="masa" type="number" min="1" max="99" placeholder="Örn: 5">
</div>

<div class="tabs">
<button class="active" onclick="sekme('menu',this)">☕ MENÜ</button>
<button onclick="sekme('hesap',this)">🧾 HESAP</button>
</div>

<div id="menu" class="tab active">

<div id="menuListesi">Menü yükleniyor...</div>

<div class="sepet">
<h3>🛒 Siparişiniz</h3>
<div id="sepetListesi">
<div class="bos">Henüz ürün eklenmedi.</div>
</div>

<div class="toplam">
Toplam: <span id="toplam">0.00</span> TL
</div>

<button class="gonder" onclick="siparisGonder()">
✓ SİPARİŞİ GÖNDER
</button>

<button class="garson" onclick="garsonCagir()">
🔔 GARSON ÇAĞIR
</button>
</div>

<h3>📝 Yaz Boz</h3>
<textarea id="yazBoz" class="yazboz"
placeholder="Notlarınızı buraya yazabilirsiniz..."></textarea>

</div>

<div id="hesap" class="tab">

<div class="hesap-card">
<h3>🧾 Masa Hesabınız</h3>
<div id="hesapListesi">
Masa numaranızı girip hesap bölümünü açın.
</div>
</div>

</div>

</div>

<script>
const firebaseConfig={
 databaseURL:"https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app",
 projectId:"dijitalkahve-67f0a",
 storageBucket:"dijitalkahve-67f0a.appspot.com",
 messagingSenderId:"326476599239"
};

if(!firebase.apps.length){
 firebase.initializeApp(firebaseConfig);
}

const db=firebase.app().database(
 "https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app"
);

let sepet={};

function sekme(id,btn){
 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
 document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));
 document.getElementById(id).classList.add("active");
 btn.classList.add("active");

 if(id==="hesap") hesapGoster();
}

db.ref("urunler").on("value",snap=>{
 const data=snap.val()||{};
 const liste=document.getElementById("menuListesi");
 liste.innerHTML="";

 const kategoriler={};

 Object.keys(data).forEach(id=>{
  const u=data[id];
  if(!kategoriler[u.kategori]) kategoriler[u.kategori]=[];
  kategoriler[u.kategori].push({...u,id});
 });

 Object.keys(kategoriler).forEach(kat=>{
  liste.innerHTML+=`<div class="kategori">${kat}</div>`;

  kategoriler[kat].forEach(u=>{
   liste.innerHTML+=`
   <div class="urun">
    <div>
     <b>${u.ad}</b><br>
     <small>${parseFloat(u.fiyat).toFixed(2)} TL</small>
    </div>
    <button class="ekle" onclick="sepeteEkle('${u.id}')">+ EKLE</button>
   </div>`;
  });
 });
});

function sepeteEkle(id){
 db.ref("urunler/"+id).once("value").then(s=>{
  const u=s.val();
  if(!u)return;

  if(!sepet[id]){
   sepet[id]={
    ad:u.ad,
    fiyat:parseFloat(u.fiyat)||0,
    adet:0
   };
  }

  sepet[id].adet++;
  sepetGoster();
 });
}

function adetDegistir(id,fark){
 if(!sepet[id])return;

 sepet[id].adet+=fark;

 if(sepet[id].adet<=0)delete sepet[id];

 sepetGoster();
}

function sepetGoster(){
 const liste=document.getElementById("sepetListesi");
 liste.innerHTML="";

 let toplam=0;

 if(Object.keys(sepet).length===0){
  liste.innerHTML='<div class="bos">Henüz ürün eklenmedi.</div>';
 }

 Object.keys(sepet).forEach(id=>{
  const u=sepet[id];
  const tutar=u.adet*u.fiyat;
  toplam+=tutar;

  liste.innerHTML+=`
  <div class="sepet-row">
   <span>${u.ad}</span>
   <div class="adet">
    <button onclick="adetDegistir('${id}',-1)">−</button>
    <b>${u.adet}</b>
    <button onclick="adetDegistir('${id}',1)">+</button>
   </div>
   <b>${tutar.toFixed(2)} TL</b>
  </div>`;
 });

 document.getElementById("toplam").innerText=toplam.toFixed(2);
}

function siparisGonder(){

 const masa=document.getElementById("masa").value;

 if(!masa){
  alert("Önce masa numaranızı girin.");
  return;
 }

 if(Object.keys(sepet).length===0){
  alert("Sepet boş.");
  return;
 }

 let toplam=0;
 const urunler={};

 Object.keys(sepet).forEach(id=>{
  const u=sepet[id];

  urunler[id]={
   ad:u.ad,
   fiyat:u.fiyat,
   adet:u.adet
  };

  toplam+=u.fiyat*u.adet;
 });

 db.ref("siparisler").push({
  masa:parseInt(masa),
  urunler:urunler,
  toplam:toplam,
  durum:"bekliyor",
  zaman:new Date().toLocaleTimeString("tr-TR")
 }).then(()=>{
  alert("✅ Siparişiniz garsona gönderildi.");
  sepet={};
  sepetGoster();
 });
}

function garsonCagir(){

 const masa=document.getElementById("masa").value;

 if(!masa){
  alert("Önce masa numaranızı girin.");
  return;
 }

 db.ref("bildirimler").push({
  masa:parseInt(masa),
  zaman:new Date().toLocaleTimeString("tr-TR")
 }).then(()=>{
  alert("🔔 Garson çağrınız gönderildi.");
 });
}

function hesapGoster(){

 const masa=document.getElementById("masa").value;

 if(!masa){
  document.getElementById("hesapListesi").innerHTML=
   '<div class="bos">Masa numaranızı girin.</div>';
  return;
 }

 db.ref("siparisler").once("value").then(snap=>{

  const data=snap.val()||{};
  let toplam=0;
  let html="";

  Object.values(data).forEach(s=>{
   if(!s)return;

   if(parseInt(s.masa)!==parseInt(masa))return;

   /* BEKLEYEN SİPARİŞ HESABA GİRMEZ */
   if(s.durum!=="onaylandi")return;

   Object.values(s.urunler||{}).forEach(u=>{
    const tutar=(parseFloat(u.fiyat)||0)*(parseInt(u.adet)||0);
    toplam+=tutar;

    html+=`
    <div class="sepet-row">
     <span>${u.ad} × ${u.adet}</span>
     <b>${tutar.toFixed(2)} TL</b>
    </div>`;
   });
  });

  if(!html){
   html='<div class="bos">Onaylanmış hesap bulunmuyor.</div>';
  }

  document.getElementById("hesapListesi").innerHTML=
   html+
   `<div class="toplam">Toplam: ${toplam.toFixed(2)} TL</div>`;
 });
}
</script>

</body>
</html>
