<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dijital Kahvem</title>
<style>
:root{--kahve:#4e342e;--koyu:#33231e;--krem:#f6f1ec;--turuncu:#c47a35;--yesil:#2e7d32;--beyaz:#fff}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--krem);color:var(--koyu);padding-bottom:105px}
header{background:linear-gradient(135deg,#3e2723,#6d4c41);color:#fff;text-align:center;padding:20px 14px 24px;border-radius:0 0 24px 24px;box-shadow:0 5px 18px #3e27232c}
h1{margin:0;font-size:29px}.hosgeldin{margin:6px 0 12px;opacity:.88}.masa{display:inline-block;background:#fff;color:var(--kahve);font-weight:800;padding:8px 18px;border-radius:30px}
.container{max-width:1100px;margin:auto;padding:15px}.aksiyonlar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:4px 0 22px}
button{font:inherit;border:0;cursor:pointer}.aksiyon{background:#fff;color:var(--kahve);border-radius:14px;padding:14px 8px;box-shadow:0 4px 14px #3e272316;font-weight:700;min-height:70px}.aksiyon span{display:block;font-size:23px;margin-bottom:6px}
.kategori{margin:23px 0}.kategori h2{font-size:21px;margin:0 0 12px;border-left:5px solid var(--turuncu);padding-left:10px}.urunler{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.urun{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 4px 14px #3e272315;display:flex;flex-direction:column}.urun img{width:100%;height:120px;object-fit:cover;background:#e9e2dd}.urun-icerik{padding:11px;display:flex;flex-direction:column;flex:1}.urun h3{font-size:15px;margin:0 0 6px}.fiyat{font-weight:800;color:var(--kahve);margin-top:auto}.ekle{width:100%;background:var(--kahve);color:#fff;border-radius:9px;padding:9px;margin-top:9px;font-weight:700}
.alt-sepet{position:fixed;z-index:5;bottom:0;left:0;right:0;background:#fff;box-shadow:0 -5px 20px #0002;padding:11px 15px}.sepet-ic{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.toplam b{font-size:20px;display:block}.siparis{background:var(--yesil);color:#fff;border-radius:12px;padding:14px 18px;font-weight:800}.siparis:disabled{opacity:.5}
dialog{width:min(94%,540px);border:0;border-radius:18px;padding:0;box-shadow:0 20px 70px #0007}dialog::backdrop{background:#0009}.pencere{padding:20px}.pencere h2{margin:0 0 15px}.satir{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #eee}.satir-bilgi{flex:1}.adet{display:flex;align-items:center;gap:8px}.adet button{width:30px;height:30px;border-radius:8px;font-weight:800}.pencere-alt{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.kapat{padding:11px 15px;border-radius:10px}.onay{background:var(--yesil);color:#fff;padding:11px 15px;border-radius:10px;font-weight:700}
textarea{width:100%;min-height:180px;border:1px solid #d3c7c0;border-radius:12px;padding:12px;font:inherit;resize:vertical}.bildirim{position:fixed;z-index:20;top:16px;left:50%;transform:translate(-50%,-100px);background:#263238;color:#fff;padding:12px 18px;border-radius:10px;transition:.25s;box-shadow:0 5px 18px #0004}.bildirim.goster{transform:translate(-50%,0)}
@media(max-width:760px){.urunler{grid-template-columns:repeat(2,1fr)}.aksiyonlar{grid-template-columns:repeat(2,1fr)}}
@media(max-width:390px){.container{padding:11px}.urunler{gap:8px}.urun img{height:100px}.urun-icerik{padding:9px}.aksiyon{font-size:13px}}
</style>
</head>
<body>
<div id="bildirim" class="bildirim"></div>
<header><h1>☕ Dijital Kahvem</h1><div class="hosgeldin">Hoş geldiniz</div><div id="masa" class="masa">Masa 1</div></header>
<main class="container">
 <section class="aksiyonlar">
  <button class="aksiyon" onclick="istekGonder('Garson çağrıldı')"><span>🔔</span>Garsonu Çağır</button>
  <button class="aksiyon" onclick="yazboz.showModal()"><span>📝</span>Yaz‑Boz</button>
  <button class="aksiyon" onclick="istekGonder('Hesap istendi')"><span>🧾</span>Hesap İste</button>
  <button class="aksiyon" onclick="sepetiAc()"><span>🛒</span>Sepeti Gör</button>
 </section>
 <div id="menu"></div>
</main>
<div class="alt-sepet"><div class="sepet-ic"><div class="toplam"><small><span id="adetToplam">0</span> ürün</small><b id="fiyatToplam">₺0</b></div><button id="siparisBtn" class="siparis" onclick="sepetiAc()" disabled>Sipariş Gönder</button></div></div>
<dialog id="sepetPencere"><div class="pencere"><h2>Sepetim</h2><div id="sepetListe"></div><div class="pencere-alt"><button class="kapat" onclick="sepetPencere.close()">Kapat</button><button class="onay" onclick="siparisGonder()">Siparişi Onayla</button></div></div></dialog>
<dialog id="yazboz"><div class="pencere"><h2>📝 Yaz‑Boz</h2><textarea id="notMetni" placeholder="Oyun skorunu, hesabı veya notunuzu buraya yazabilirsiniz…"></textarea><div class="pencere-alt"><button class="kapat" onclick="yazboz.close()">Kapat</button><button class="onay" onclick="notuKaydet()">Kaydet</button></div></div></dialog>
<script>
const varsayilan=[
 {id:'s1',ad:'Türk Kahvesi',kategori:'Sıcak İçecekler',fiyat:70,gorsel:'https://images.unsplash.com/photo-1578374173705-969cbe6f2d6b?w=500',aktif:true},
 {id:'s2',ad:'Çay',kategori:'Sıcak İçecekler',fiyat:30,gorsel:'https://images.unsplash.com/photo-1594631252845-29fc4cc8cde9?w=500',aktif:true},
 {id:'s3',ad:'Latte',kategori:'Sıcak İçecekler',fiyat:95,gorsel:'https://images.unsplash.com/photo-1561882468-9110e03e0f78?w=500',aktif:true},
 {id:'s4',ad:'Cappuccino',kategori:'Sıcak İçecekler',fiyat:95,gorsel:'https://images.unsplash.com/photo-1572442388796-11668a67e53d?w=500',aktif:true},
 {id:'s5',ad:'Espresso',kategori:'Sıcak İçecekler',fiyat:75,gorsel:'https://images.unsplash.com/photo-1510707577719-ae7c14805e3a?w=500',aktif:true},
 {id:'s6',ad:'Americano',kategori:'Sıcak İçecekler',fiyat:85,gorsel:'https://images.unsplash.com/photo-1551030173-122aabc4489c?w=500',aktif:true},
 {id:'s7',ad:'Sıcak Çikolata',kategori:'Sıcak İçecekler',fiyat:90,gorsel:'https://images.unsplash.com/photo-1542990253-0d0f5be5f0ed?w=500',aktif:true},
 {id:'s8',ad:'Bitki Çayı',kategori:'Sıcak İçecekler',fiyat:65,gorsel:'https://images.unsplash.com/photo-1564890369478-c89ca6d9cde9?w=500',aktif:true},
 {id:'g1',ad:'Limonata',kategori:'Soğuk İçecekler',fiyat:80,gorsel:'https://images.unsplash.com/photo-1523371054106-bbf80586c38c?w=500',aktif:true},
 {id:'g2',ad:'Soğuk Kahve',kategori:'Soğuk İçecekler',fiyat:105,gorsel:'https://images.unsplash.com/photo-1517701604599-bb29b565090c?w=500',aktif:true},
 {id:'g3',ad:'Kola',kategori:'Soğuk İçecekler',fiyat:55,gorsel:'https://images.unsplash.com/photo-1629203851122-3726ecdf080e?w=500',aktif:true},
 {id:'g4',ad:'Ayran',kategori:'Soğuk İçecekler',fiyat:40,gorsel:'https://images.unsplash.com/photo-1628088062854-d1870b4553da?w=500',aktif:true},
 {id:'g5',ad:'Meyve Suyu',kategori:'Soğuk İçecekler',fiyat:60,gorsel:'https://images.unsplash.com/photo-1600271886742-f049cd451bba?w=500',aktif:true},
 {id:'g6',ad:'Maden Suyu',kategori:'Soğuk İçecekler',fiyat:35,gorsel:'https://images.unsplash.com/photo-1564419320461-6870880221ad?w=500',aktif:true},
 {id:'g7',ad:'Su',kategori:'Soğuk İçecekler',fiyat:20,gorsel:'https://images.unsplash.com/photo-1548839140-29a749e1cf4d?w=500',aktif:true},
 {id:'g8',ad:'Milkshake',kategori:'Soğuk İçecekler',fiyat:110,gorsel:'https://images.unsplash.com/photo-1572490122747-3968b75cc699?w=500',aktif:true},
 {id:'a1',ad:'Cheesecake',kategori:'Atıştırmalıklar',fiyat:120,gorsel:'https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=500',aktif:true},
 {id:'a2',ad:'San Sebastian',kategori:'Atıştırmalıklar',fiyat:135,gorsel:'https://images.unsplash.com/photo-1524351199678-941a58a3df50?w=500',aktif:true},
 {id:'a3',ad:'Tost',kategori:'Atıştırmalıklar',fiyat:100,gorsel:'https://images.unsplash.com/photo-1528735602780-2552fd46c7af?w=500',aktif:true},
 {id:'a4',ad:'Kurabiye',kategori:'Atıştırmalıklar',fiyat:55,gorsel:'https://images.unsplash.com/photo-1499636136210-6f4ee915583e?w=500',aktif:true}
];
const params=new URLSearchParams(location.search),masaNo=params.get('masa')||'1';document.getElementById('masa').textContent='Masa '+masaNo;
let urunler=JSON.parse(localStorage.getItem('dk_urunler')||'null')||varsayilan,sepet={};
const para=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:2}).format(n);
function menuCiz(){const kategoriler=['Sıcak İçecekler','Soğuk İçecekler','Atıştırmalıklar'];document.getElementById('menu').innerHTML=kategoriler.map(k=>`<section class="kategori"><h2>${k}</h2><div class="urunler">${urunler.filter(u=>u.aktif&&u.kategori===k).map(u=>`<article class="urun"><img src="${u.gorsel}" alt="${u.ad}"><div class="urun-icerik"><h3>${u.ad}</h3><div class="fiyat">${para(u.fiyat)}</div><button class="ekle" onclick="ekle('${u.id}')">Sepete Ekle</button></div></article>`).join('')}</div></section>`).join('')}
function ekle(id){sepet[id]=(sepet[id]||0)+1;ozet();bildir('Ürün sepete eklendi')}
function degistir(id,fark){sepet[id]=(sepet[id]||0)+fark;if(sepet[id]<=0)delete sepet[id];ozet();sepetiAc(false)}
function ozet(){let adet=0,toplam=0;for(const [id,n] of Object.entries(sepet)){const u=urunler.find(x=>x.id===id);if(u){adet+=n;toplam+=u.fiyat*n}}document.getElementById('adetToplam').textContent=adet;document.getElementById('fiyatToplam').textContent=para(toplam);document.getElementById('siparisBtn').disabled=!adet}
function sepetiAc(ac=true){const satirlar=Object.entries(sepet).map(([id,n])=>{const u=urunler.find(x=>x.id===id);return `<div class="satir"><div class="satir-bilgi"><b>${u.ad}</b><br><small>${para(u.fiyat*n)}</small></div><div class="adet"><button onclick="degistir('${id}',-1)">−</button><b>${n}</b><button onclick="degistir('${id}',1)">+</button></div></div>`}).join('');document.getElementById('sepetListe').innerHTML=satirlar||'<p>Sepetiniz boş.</p>';if(ac&&!sepetPencere.open)sepetPencere.showModal()}
function siparisGonder(){if(!Object.keys(sepet).length)return;const kayit={masa:masaNo,zaman:new Date().toISOString(),durum:'bekliyor',urunler:Object.entries(sepet).map(([id,adet])=>({...urunler.find(x=>x.id===id),adet}))};const liste=JSON.parse(localStorage.getItem('dk_siparisler')||'[]');liste.push(kayit);localStorage.setItem('dk_siparisler',JSON.stringify(liste));sepet={};ozet();sepetPencere.close();bildir('Siparişiniz gönderildi')}
function istekGonder(tur){const liste=JSON.parse(localStorage.getItem('dk_istekler')||'[]');liste.push({masa:masaNo,tur,zaman:new Date().toISOString()});localStorage.setItem('dk_istekler',JSON.stringify(liste));bildir(tur)}
function notuKaydet(){localStorage.setItem('dk_yazboz_masa_'+masaNo,document.getElementById('notMetni').value);yazboz.close();bildir('Not kaydedildi')}
function bildir(m){const b=document.getElementById('bildirim');b.textContent=m;b.classList.add('goster');setTimeout(()=>b.classList.remove('goster'),2200)}
document.getElementById('notMetni').value=localStorage.getItem('dk_yazboz_masa_'+masaNo)||'';menuCiz();ozet();
</script>
</body>
</html>
