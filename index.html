<style>

body{
    margin:0;

.header{

.cagri-durum{

    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

/*
   Her el ekranın yaklaşık 1/4'ünü
   kaplayacak şekilde küçük tutuluyor.
*/

.eller{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:6px;
}

.el{
    min-height:145px;
    background:#fafafa;
    border:1px solid #ddd;

}

    margin:0 0 5px;

}

.el-kilit{

}

}

.yazboz-kontrol label{

}

.yazboz-kontrol select{
    width:100%;

}

.btn-baslat{
    width:100%;

}

.btn-kaydet{
    width:100%;

    color:white;

}

.yazboz-bilgi{

    text-align:center;

}

@media(max-width:600px){

    .urun-grid{
        grid-template-columns:1fr 1fr;
    }

    .eller{
        grid-template-columns:repeat(4,1fr);
    }

    .el{
        min-height:135px;
        padding:5px;
    }

    .el h4{
        font-size:10px;
    }

</style>
</head>

<body>

<div class="header">
    <h1>☕ DİJİTAL KAHVE</h1>
    <p>Dijital Menü & Masa Yönetimi</p>
    <div class="masa-bilgi" id="masaBilgi">
        MASA BELİRLENİYOR...
    </div>
</div>

<div class="container">

    <!-- ÜST BUTONLAR -->
    <div class="ust-butonlar">

        <button
            class="ust-buton btn-garson"
            onclick="garsonCagir()">
            🔔 GARSON ÇAĞIR
        </button>

        <button
            class="ust-buton btn-siparis"
            onclick="panelAc('menuPanel')">
            🛒 SİPARİŞ VER
        </button>

    </div>

    <!-- SEKME -->
    <div class="sekmeler">

        <button
            class="sekme active"
            onclick="panelAc('menuPanel',this)">
            ☕ MENÜ
        </button>

        <button
            class="sekme"
            onclick="panelAc('hesapPanel',this)">
            🧾 HESABIM
        </button>

    </div>

    <!-- MENÜ -->
    <div id="menuPanel" class="panel active">

        <div id="menuListesi">
            Yükleniyor...
        </div>

        <div class="sepet">

            <h3>🛒 Siparişiniz</h3>

            <div id="sepetListesi">
                <div class="bos">
                    Henüz ürün seçmediniz.
                </div>
            </div>

            <div class="sepet-toplam">
                Toplam:
                <span id="sepetToplam">0.00</span> TL
            </div>

            <button
                class="btn-siparis-gonder"
                onclick="siparisGonder()">
                ✓ SİPARİŞİ GÖNDER
            </button>

        </div>

    </div>

    <!-- HESAP -->
    <div id="hesapPanel" class="panel">

        <div class="hesap-box">

            <div class="hesap-baslik">
                🧾 MASA HESABI
            </div>

            <div id="hesapListesi">
                <div class="bos">
                    Hesap yükleniyor...
                </div>
            </div>

            <div class="hesap-toplam">
                Toplam:
                <span id="hesapToplam">0.00</span> TL
            </div>

        </div>

    </div>

    <!-- GARSON -->
    <div id="garsonPanel" class="panel">

        <div class="garson-box">

            <div class="garson-icon">🔔</div>

            <h2>Garson Çağır</h2>

            <p>
                Garson masanıza gelecektir.
            </p>

            <button
                class="btn-cagir"
                onclick="garsonCagir()">
                🔔 GARSONU ÇAĞIR
            </button>

            <div
                id="cagriDurum"
                class="cagri-durum">
            </div>

        </div>

    </div>

    <!-- YAZBOZ -->
    <div id="yazbozPanel" class="panel">

        <div class="yazboz">

            <div class="yazboz-kontrol">

                <label>
                    Tekli oyunda kaç oyuncu?
                </label>

                <select id="oyuncuSayisi">

                    <option value="2">2 Oyuncu</option>
                    <option value="3">3 Oyuncu</option>
                    <option value="4">4 Oyuncu</option>

                </select>

                <label style="display:block;margin-top:8px">
                    Kaç oyun oynanacak?
                </label>

                <select id="oyunSayisi">

                    <option value="4">4 Oyun</option>
                    <option value="8">8 Oyun</option>
                    <option value="12">12 Oyun</option>
                    <option value="16">16 Oyun</option>
                    <option value="20">20 Oyun</option>

                </select>

                <button

                    onclick="yazbozBaslat()">
                    🎮 OYUNU BAŞLAT
                </button>

            </div>

            <div class="yazboz-bilgi" id="yazbozBilgi">

                id="eller"
                class="eller">
            </div>

            <button
                id="skorKaydet"
                class="btn-kaydet"
                style="display:none"
                onclick="skorlariKilitle()">
                🔒 SKORLARI KAYDET VE KİLİTLE
            </button>

</div>

<script>

/* ================= FIREBASE ================= */

const firebaseConfig={
    databaseURL:
    "https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId:"dijitalkahve-67f0a",
    storageBucket:"dijitalkahve-67f0a.appspot.com",
    messagingSenderId:"326476599239"
};

if(!firebase.apps.length){
    firebase.initializeApp(firebaseConfig);
}

const db=firebase.app().database(
    "https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app"
);


/* ================= MASA NUMARASI ================= */

/*
   QR bağlantısındaki:
   ?masa=1
   ?masa=2
   ...
   değerini otomatik alır.
*/

const params=new URLSearchParams(
    window.location.search
);

let masaNo=params.get("masa");


if(!masaNo){

    masaNo=localStorage.getItem("masaNo");

}

if(masaNo){

    localStorage.setItem(
        "masaNo",
        masaNo
    );

    document.getElementById(
        "masaBilgi"
    ).innerText=
        "MASA "+masaNo;

}else{

    document.getElementById(
        "masaBilgi"
    ).innerText=
        "MASA BELİRLENEMEDİ";

}


/* ================= SEPET ================= */

let sepet={};

function urunleriDinle(){

    db.ref("urunler").on("value",snapshot=>{

        const data=snapshot.val()||{};

        const kategoriler={};

        Object.keys(data).forEach(key=>{

            const u=data[key];

            const kategori=
                u.kategori||"Diğer";

            if(!kategoriler[kategori]){
                kategoriler[kategori]=[];
            }

            kategoriler[kategori].push({
                id:key,
                ...u
            });

        });

        let html="";

        Object.keys(kategoriler).forEach(kategori=>{

            html+=`
                <div class="kategori">

                    <div class="kategori-baslik">
                        ${kategori}
                    </div>

                    <div class="urun-grid">
            `;

            kategoriler[kategori].forEach(u=>{

                const adet=
                    sepet[u.id]
                    ? sepet[u.id].adet
                    : 0;

                html+=`

                    <div class="urun">

                        <div class="urun-ad">
                            ${u.ad}
                        </div>

                        <div class="urun-alt">

                            <span class="fiyat">
                                ${parseFloat(u.fiyat||0).toFixed(2)} TL
                            </span>

                            <div class="adet">

                                <button
                                    onclick="adetDegistir('${u.id}',-1)">
                                    −
                                </button>

                                <span>
                                    ${adet}
                                </span>

                                <button
                                    onclick="adetDegistir('${u.id}',1)">
                                    +
                                </button>

                            </div>

                        </div>

                    </div>

                `;

            });

            html+=`
                    </div>
                </div>
            `;

        });

        document.getElementById(
            "menuListesi"
        ).innerHTML=
            html ||
            `<div class="bos">Menü boş.</div>`;

    });

}


function adetDegistir(id,fark){

    db.ref("urunler/"+id)
    .once("value")
    .then(snapshot=>{

        const u=snapshot.val();

        if(!u)return;

        if(!sepet[id]){

            sepet[id]={
                ad:u.ad,
                fiyat:parseFloat(u.fiyat)||0,
                adet:0
            };

        }

        sepet[id].adet+=fark;

        if(sepet[id].adet<=0){
            delete sepet[id];
        }

        sepetGoster();

        urunleriDinle();

    });

}


function sepetGoster(){

    const liste=
        document.getElementById(
            "sepetListesi"
        );

    let toplam=0;

    if(Object.keys(sepet).length===0){

        liste.innerHTML=`
            <div class="bos">
                Henüz ürün seçmediniz.
            </div>
        `;

        document.getElementById(
            "sepetToplam"
        ).innerText="0.00";

        return;
    }

    let html="";

    Object.values(sepet).forEach(u=>{

        const tutar=
            u.adet*u.fiyat;

        toplam+=tutar;

        html+=`

            <div class="sepet-row">

                <span>
                    ${u.ad} × ${u.adet}
                </span>

                <strong>
                    ${tutar.toFixed(2)} TL
                </strong>

            </div>

        `;

    });

    liste.innerHTML=html;

    document.getElementById(
        "sepetToplam"
    ).innerText=
        toplam.toFixed(2);

}


/* ================= SİPARİŞ GÖNDER ================= */

function siparisGonder(){

    if(!masaNo){

        alert(
            "Masa numarası belirlenemedi."
        );

        return;
    }

    if(Object.keys(sepet).length===0){

        alert(
            "Lütfen ürün seçin."
        );

        return;
    }

    const urunler={};

    let toplam=0;

    Object.keys(sepet).forEach(id=>{

        const u=sepet[id];

        urunler[id]={
            ad:u.ad,
            fiyat:u.fiyat,
            adet:u.adet
        };

        toplam+=u.adet*u.fiyat;

    });

    const saat=
        new Date().toLocaleTimeString(
            "tr-TR",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    db.ref("siparisler")
    .push({

        masa:String(masaNo),

        urunler:urunler,

        toplam:toplam,

        durum:"bekliyor",

        zaman:saat

    })
    .then(()=>{

        alert(
            "✅ Siparişiniz garsona gönderildi."
        );

        sepet={};

        sepetGoster();

        panelAc("hesapPanel");

    })
    .catch(error=>{

        alert(
            "Sipariş gönderilemedi:\n"+
            error.message
        );

    });

}


/* ================= HESAP ================= */

function hesapDinle(){

    if(!masaNo)return;

    db.ref("siparisler").on("value",snapshot=>{

        const data=snapshot.val()||{};

        const hesap={};

        let toplam=0;

        Object.values(data).forEach(siparis=>{

            if(!siparis)return;

            if(
                String(siparis.masa)!==
                String(masaNo)
            )return;

            /*
              SADECE ONAYLANANLAR
              HESABA EKLENİR
            */

            if(
                siparis.durum!=="onaylandi"
            )return;

            Object.values(
                siparis.urunler||{}
            ).forEach(u=>{

                const key=
                    String(u.ad)
                    .toLowerCase();

                if(!hesap[key]){

                    hesap[key]={
                        ad:u.ad,
                        adet:0,
                        fiyat:
                        parseFloat(u.fiyat)||0
                    };

                }

                hesap[key].adet+=
                    parseInt(u.adet)||0;

                toplam+=
                    (parseFloat(u.fiyat)||0)*
                    (parseInt(u.adet)||0);

            });

        });

        const liste=
            document.getElementById(
                "hesapListesi"
            );

        if(Object.keys(hesap).length===0){

            liste.innerHTML=`
                <div class="bos">
                    Henüz onaylanmış siparişiniz yok.
                </div>
            `;

        }else{

            let html="";

            Object.values(hesap)
            .forEach(u=>{

                html+=`

                    <div class="hesap-row">

                        <span>
                            ${u.ad}
                            × ${u.adet}
                        </span>

                        <strong>
                            ${(u.adet*u.fiyat).toFixed(2)}
                            TL
                        </strong>

                    </div>

                `;

            });

            liste.innerHTML=html;

        }

        document.getElementById(
            "hesapToplam"
        ).innerText=
            toplam.toFixed(2);

    });

}


/* ================= GARSON ================= */

function garsonCagir(){

    if(!masaNo){

        alert(
            "Masa numarası belirlenemedi."
        );

        return;
    }

    const saat=
        new Date().toLocaleTimeString(
            "tr-TR",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    db.ref("bildirimler")
    .push({

        masa:String(masaNo),

        zaman:saat

    })
    .then(()=>{

        alert(
            "🔔 Garson çağrınız gönderildi."
        );

        document.getElementById(
            "cagriDurum"
        ).innerText=
            "✓ Garson çağrıldı.";

    });

}


/* ================= PANEL ================= */

function panelAc(id,button){

    document
    .querySelectorAll(".panel")
    .forEach(x=>{
        x.classList.remove("active");
    });

    document
    .getElementById(id)
    .classList.add("active");

    document
    .querySelectorAll(".sekme")
    .forEach(x=>{
        x.classList.remove("active");
    });

    if(button){
        button.classList.add("active");
    }

    if(id==="hesapPanel"){
        hesapDinle();
    }

}


/* ================= YAZBOZ ================= */

let yazbozAktif=false;
let toplamEl=0;
let oyuncuSayisi=0;

function yazbozBaslat(){

    oyuncuSayisi=
        parseInt(
            document.getElementById(
                "oyuncuSayisi"
            ).value
        );

    toplamEl=
        parseInt(
            document.getElementById(
                "oyunSayisi"
            ).value
        );

    yazbozAktif=true;

    document.getElementById(
        "yazbozBilgi"
    ).innerText=
        "Oyun başladı • "+
        toplamEl+
        " el oynanacak.";

    ellerOlustur();

}


function ellerOlustur(){

    const alan=
        document.getElementById(
            "eller"
        );

    alan.innerHTML="";

    for(let el=1;el<=toplamEl;el++){

        let oyuncular="";

        for(
            let oyuncu=1;
            oyuncu<=oyuncuSayisi;
            oyuncu++
        ){

            oyuncular+=`

                <div class="oyuncu">

                    <strong>
                        Oyuncu ${oyuncu}
                    </strong>

                    <input
                        type="number"
                        id="el${el}oyuncu${oyuncu}"
                        placeholder="Skor"
                    >

                </div>

            `;

        }

        alan.innerHTML+=`

            <div class="el">

                <h4>
                    ${el}. OYUN
                </h4>

                <div class="oyuncular">
                    ${oyuncular}
                </div>

                <div
                    id="kilit${el}"
                    class="el-kilit">
                </div>

            </div>

        `;

    }

    document.getElementById(
        "skorKaydet"
    ).style.display="block";

}


/*
   İlk oyun kilitlenmeden
   ikinci oyun aktif olmayacak.
*/

function skorlariKilitle(){

    if(!yazbozAktif)return;

    const ilkOyunSkorlari=[];

    for(
        let oyuncu=1;
        oyuncu<=oyuncuSayisi;
        oyuncu++
    ){

        const input=
            document.getElementById(
                "el1oyuncu"+oyuncu
            );

        if(
            !input ||
            input.value.trim()===""
        ){

            alert(
                "1. oyunun tüm skorlarını girin."
            );

            return;

        }

        ilkOyunSkorlari.push(
            input.value
        );

    }

    /*
       İlk oyun skorları kilitleniyor.
    */

    for(
        let oyuncu=1;
        oyuncu<=oyuncuSayisi;
        oyuncu++
    ){

        const input=
            document.getElementById(
                "el1oyuncu"+oyuncu
            );

        input.disabled=true;

    }

    document.getElementById(
        "kilit1"
    ).innerText=
        "🔒 1. OYUN KİLİTLENDİ";

    /*
       2. oyun aktif.
    */

    if(toplamEl>=2){

        for(
            let oyuncu=1;
            oyuncu<=oyuncuSayisi;
            oyuncu++
        ){

            const input=
                document.getElementById(
                    "el2oyuncu"+oyuncu
                );

            if(input){
                input.disabled=false;
            }

        }

        document.getElementById(
            "yazbozBilgi"
        ).innerText=
            "✓ 1. oyun kilitlendi. "+
            "Şimdi 2. oyunun skorlarını girin.";

    }

    /*
       Sonraki eller başlangıçta pasif.
    */

    for(
        let el=3;
        el<=toplamEl;
        el++
    ){

        for(
            let oyuncu=1;
            oyuncu<=oyuncuSayisi;
            oyuncu++
        ){

            const input=
                document.getElementById(
                    "el"+el+
                    "oyuncu"+oyuncu
                );

            if(input){
                input.disabled=true;
            }

        }

    }

    document.getElementById(
        "skorKaydet"
    ).onclick=
        sonrakiOyunuKilitle;

}


/*
   Her oyun tamamlandığında
   bir sonraki oyun açılır.
*/

function sonrakiOyunuKilitle(){

    let aktifEl=0;

    for(
        let el=1;
        el<=toplamEl;
        el++
    ){

        const input=
            document.getElementById(
                "el"+el+
                "oyuncu1"
            );

        if(!input)continue;

        if(!input.disabled){

            aktifEl=el;
            break;

        }

    }

    if(!aktifEl)return;

    for(
        let oyuncu=1;
        oyuncu<=oyuncuSayisi;
        oyuncu++
    ){

        const input=
            document.getElementById(
                "el"+
                aktifEl+
                "oyuncu"+
                oyuncu
            );

        if(
            !input ||
            input.value.trim()===""
        ){

            alert(
                aktifEl+
                ". oyunun tüm skorlarını girin."
            );

            return;

        }

    }

    /*
       1 dakika içinde değiştirme
       isteğine uygun olarak oyun
       kilitlendiğinde input kapanıyor.
    */

    for(
        let oyuncu=1;
        oyuncu<=oyuncuSayisi;
        oyuncu++
    ){

        const input=
            document.getElementById(
                "el"+
                aktifEl+
                "oyuncu"+
                oyuncu
            );

        input.disabled=true;

    }

    document.getElementById(
        "kilit"+aktifEl
    ).innerText=
        "🔒 "+
        aktifEl+
        ". OYUN KİLİTLENDİ";

    const sonraki=
        aktifEl+1;

    if(sonraki<=toplamEl){

        for(
            let oyuncu=1;
            oyuncu<=oyuncuSayisi;
            oyuncu++
        ){

            const input=
                document.getElementById(
                    "el"+
                    sonraki+
                    "oyuncu"+
                    oyuncu
                );

            if(input){
                input.disabled=false;
            }

        }

        document.getElementById(
            "yazbozBilgi"
        ).innerText=
            "✓ "+
            aktifEl+
            ". oyun kilitlendi. "+
            sonraki+
            ". oyun aktif.";

    }else{

        document.getElementById(
            "yazbozBilgi"
        ).innerText=
            "🏆 TÜM OYUNLAR TAMAMLANDI.";

        document.getElementById(
            "skorKaydet"
        ).style.display="none";

    }

}
