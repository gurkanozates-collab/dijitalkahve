<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dijital Kahvem</title>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f1ee;
    color:#33231f;
}

/* =====================================================
   HEADER
===================================================== */

.header{
    background:linear-gradient(135deg,#2b1813,#6d4032);
    color:white;
    text-align:center;
    padding:22px 15px 18px;
    box-shadow:0 4px 18px rgba(0,0,0,.18);
}

.logo{
    font-size:26px;
    font-weight:800;
}

.welcome{
    margin-top:4px;
    font-size:13px;
    opacity:.9;
}

.masa-bilgi{
    display:inline-block;
    margin-top:10px;
    padding:7px 18px;
    border-radius:30px;
    background:rgba(255,255,255,.14);
    font-size:14px;
    font-weight:bold;
}

/* =====================================================
   ÜST BUTONLAR
===================================================== */

.top-buttons{
    max-width:1200px;
    margin:14px auto;
    padding:0 12px;

    display:grid;
    grid-template-columns:
        repeat(4,1fr);

    gap:9px;
}

.top-btn{
    border:0;
    border-radius:12px;
    padding:13px 7px;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
    background:white;
    color:#5d4037;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.top-btn:active{
    transform:scale(.97);
}

.top-btn.garson{
    background:#ffb300;
    color:#222;
}

.top-btn.yazboz{
    background:#6a1b9a;
    color:white;
}

.top-btn.hesap{
    background:#1565c0;
    color:white;
}

.top-btn.siparis{
    background:#2e7d32;
    color:white;
}

/* =====================================================
   ANA
===================================================== */

.container{
    max-width:1200px;
    margin:auto;
    padding:5px 12px 35px;
}

/* =====================================================
   KATEGORİ
===================================================== */

.kategori{
    margin-top:18px;
}

.kategori-baslik{
    background:#5d4037;
    color:white;
    padding:11px 14px;
    border-radius:12px;
    margin-bottom:10px;
    font-size:16px;
    font-weight:bold;
}

.urun-grid{
    display:grid;
    grid-template-columns:
        repeat(4,1fr);
    gap:10px;
}

.urun{
    background:white;
    border-radius:14px;
    min-height:105px;
    padding:13px 9px;

    display:flex;
    flex-direction:column;
    justify-content:space-between;

    box-shadow:0 3px 12px rgba(0,0,0,.07);
    border:1px solid #eee;
}

.urun-ad{
    font-weight:bold;
    font-size:14px;
    line-height:1.25;
}

.urun-fiyat{
    color:#795548;
    font-size:13px;
    margin-top:4px;
}

.urun-alt{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:5px;
}

.adet{
    min-width:28px;
    height:28px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f1e7e2;
    color:#5d4037;
    font-weight:bold;
}

.plus{
    width:35px;
    height:35px;
    border:0;
    border-radius:50%;
    background:#5d4037;
    color:white;
    font-size:23px;
    line-height:1;
    cursor:pointer;
}

.plus:active{
    transform:scale(.9);
}

/* =====================================================
   ALT BİLGİ
===================================================== */

.bilgi{
    margin-top:20px;
    background:white;
    padding:14px;
    border-radius:12px;
    text-align:center;
    color:#777;
    font-size:12px;
}

/* =====================================================
   MODAL
===================================================== */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.58);
    z-index:1000;

    align-items:center;
    justify-content:center;

    padding:15px;
}

.modal.active{
    display:flex;
}

.modal-box{
    background:white;
    width:100%;
    max-width:600px;
    max-height:90vh;
    overflow:auto;
    border-radius:20px;
    padding:20px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.modal-header h2{
    margin:0;
    color:#4e342e;
    font-size:20px;
}

.kapat{
    width:34px;
    height:34px;
    border:0;
    border-radius:50%;
    background:#eee;
    font-size:20px;
    cursor:pointer;
}

/* =====================================================
   HESAP
===================================================== */

.hesap-row{
    display:flex;
    justify-content:space-between;
    padding:11px 0;
    border-bottom:1px solid #eee;
}

.hesap-toplam{
    margin-top:15px;
    padding-top:14px;
    border-top:2px solid #eee;
    text-align:right;
    font-size:21px;
    font-weight:bold;
    color:#2e7d32;
}

.hesap-bos{
    text-align:center;
    padding:30px 10px;
    color:#999;
}

/* =====================================================
   YAZ BOZ
===================================================== */

.yazboz-secim{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.yazboz-secim button{
    border:0;
    padding:18px 10px;
    border-radius:14px;
    background:#f0e6f4;
    color:#6a1b9a;
    font-weight:bold;
    cursor:pointer;
}

.yazboz-secim button.aktif{
    background:#6a1b9a;
    color:white;
}

.yazboz-form{
    margin-top:15px;
}

.yazboz-form label{
    display:block;
    margin-top:10px;
    margin-bottom:5px;
    font-size:13px;
    font-weight:bold;
}

.yazboz-form input,
.yazboz-form select{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:9px;
    font-size:15px;
}

.yazboz-baslat{
    width:100%;
    margin-top:15px;
    border:0;
    background:#6a1b9a;
    color:white;
    padding:13px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

/* =====================================================
   OYUN
===================================================== */

.oyun-bilgi{
    background:#f7f0fa;
    border-radius:12px;
    padding:12px;
    margin-bottom:14px;
}

.oyun-bilgi strong{
    color:#6a1b9a;
}

.eller{
    display:grid;
    grid-template-columns:
        repeat(4,1fr);
    gap:8px;
}

.el-card{
    background:#fff;
    border:1px solid #e3d7e8;
    border-radius:12px;
    padding:10px;
    min-width:0;
}

.el-card.aktif{
    border:2px solid #6a1b9a;
}

.el-card.kilitli{
    background:#f3f3f3;
    opacity:.8;
}

.el-baslik{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
    font-weight:bold;
    font-size:13px;
}

.el-durum{
    font-size:10px;
    color:#777;
}

.skor-row{
    margin-top:6px;
}

.skor-row label{
    display:block;
    font-size:11px;
    color:#777;
    margin-bottom:3px;
}

.skor-row input{
    width:100%;
    padding:8px;
    border:1px solid #ddd;
    border-radius:7px;
    text-align:center;
    font-weight:bold;
}

.el-kaydet{
    width:100%;
    border:0;
    margin-top:8px;
    padding:8px;
    border-radius:7px;
    background:#6a1b9a;
    color:white;
    font-size:11px;
    font-weight:bold;
    cursor:pointer;
}

.el-kaydet:disabled{
    background:#bbb;
    cursor:not-allowed;
}

.kilit-mesaj{
    margin-top:7px;
    color:#777;
    font-size:10px;
    text-align:center;
}

.oyun-bitti{
    margin-top:15px;
    background:#e8f5e9;
    color:#2e7d32;
    padding:12px;
    border-radius:10px;
    text-align:center;
    font-weight:bold;
}

/* =====================================================
   BİLDİRİM
===================================================== */

.toast{
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translateX(-50%) translateY(100px);

    background:#263238;
    color:white;
    padding:13px 18px;
    border-radius:10px;

    z-index:2000;
    transition:.3s;

    font-size:13px;
    box-shadow:0 5px 20px rgba(0,0,0,.25);
}

.toast.show{
    transform:translateX(-50%) translateY(0);
}

/* =====================================================
   MOBİL
===================================================== */

@media(max-width:800px){

    .top-buttons{
        grid-template-columns:
            repeat(4,1fr);
    }

    .top-btn{
        padding:11px 3px;
        font-size:10px;
    }

    .urun-grid{
        grid-template-columns:
            repeat(2,1fr);
    }

    .eller{
        grid-template-columns:
            repeat(2,1fr);
    }

}

@media(max-width:430px){

    .top-btn{
        font-size:9px;
    }

    .urun{
        min-height:100px;
    }

    .eller{
        grid-template-columns:
            repeat(2,1fr);
    }

}

</style>
</head>

<body>

<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

    <div class="logo">
        ☕ DİJİTAL KAHVEM
    </div>

    <div class="welcome">
        Hoşgeldiniz
    </div>

    <div
        class="masa-bilgi"
        id="masaBilgi">

        MASA -

    </div>

</div>


<!-- =====================================================
     ÜST BUTONLAR
===================================================== -->

<div class="top-buttons">

    <button
        class="top-btn garson"
        onclick="garsonCagir()">

        🔔<br>
        Garsonu Çağır

    </button>

    <button
        class="top-btn yazboz"
        onclick="yazbozAc()">

        📝<br>
        Yaz-Boz

    </button>

    <button
        class="top-btn hesap"
        onclick="hesapAc()">

        💳<br>
        Hesap

    </button>

    <button
        class="top-btn siparis"
        onclick="siparisGonder()">

        🛒<br>
        Sipariş Gönder

    </button>

</div>


<!-- =====================================================
     MENÜ
===================================================== -->

<div class="container">

    <div id="menu"></div>

    <div class="bilgi">
        Ürün eklemek için ürünün yanındaki <b>+</b> butonuna dokunun.
    </div>

</div>


<!-- =====================================================
     HESAP MODAL
===================================================== -->

<div
    id="hesapModal"
    class="modal">

    <div class="modal-box">

        <div class="modal-header">

            <h2>
                💳 MASA <span id="hesapMasa">-</span> HESABI
            </h2>

            <button
                class="kapat"
                onclick="modalKapat('hesapModal')">

                ×

            </button>

        </div>

        <div id="hesapIcerik">

            Yükleniyor...

        </div>

    </div>

</div>


<!-- =====================================================
     YAZ BOZ MODAL
===================================================== -->

<div
    id="yazbozModal"
    class="modal">

    <div class="modal-box">

        <div class="modal-header">

            <h2>
                📝 YAZ-BOZ
            </h2>

            <button
                class="kapat"
                onclick="modalKapat('yazbozModal')">

                ×

            </button>

        </div>

        <!-- BAŞLANGIÇ -->

        <div id="yazbozBaslangic">

            <div
                style="
                text-align:center;
                color:#777;
                margin-bottom:12px;
                ">

                Nasıl oynanacak?

            </div>

            <div class="yazboz-secim">

                <button
                    id="tekliBtn"
                    onclick="oyunTuruSec('tekli')">

                    👤 TEKLİ

                </button>

                <button
                    id="esliBtn"
                    onclick="oyunTuruSec('esli')">

                    👥 EŞLİ

                </button>

            </div>

            <div class="yazboz-form">

                <label>
                    Oyuncu Sayısı
                </label>

                <select id="oyuncuSayisi">

                    <option value="2">
                        2 Oyuncu
                    </option>

                    <option value="3">
                        3 Oyuncu
                    </option>

                    <option value="4">
                        4 Oyuncu
                    </option>

                    <option value="5">
                        5 Oyuncu
                    </option>

                    <option value="6">
                        6 Oyuncu
                    </option>

                    <option value="8">
                        8 Oyuncu
                    </option>

                </select>


                <label>
                    Kaç Oyun Oynanacak?
                </label>

                <select id="oyunSayisi">

                    <option value="4">4 Oyun</option>
                    <option value="8">8 Oyun</option>
                    <option value="10">10 Oyun</option>
                    <option value="12">12 Oyun</option>
                    <option value="16">16 Oyun</option>
                    <option value="20">20 Oyun</option>

                </select>


                <button
                    class="yazboz-baslat"
                    onclick="yazbozBaslat()">

                    ▶ OYUNU BAŞLAT

                </button>

            </div>

        </div>


        <!-- OYUN -->

        <div
            id="yazbozOyun"
            style="display:none;">

            <div
                id="oyunBilgi"
                class="oyun-bilgi">

            </div>

            <div
                id="eller"
                class="eller">

            </div>

        </div>

    </div>

</div>


<!-- TOAST -->

<div
    id="toast"
    class="toast">

</div>


<script>

/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {

    databaseURL:
    "https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
    "dijitalkahve-67f0a",

    storageBucket:
    "dijitalkahve-67f0a.appspot.com",

    messagingSenderId:
    "326476599239"

};

if(!firebase.apps.length){

    firebase.initializeApp(
        firebaseConfig
    );

}

const db =
    firebase.app().database(
        "https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app"
);


/* =====================================================
   MASA NUMARASI
   QR:
   site.com/?masa=1
===================================================== */

const urlParams =
    new URLSearchParams(
        window.location.search
    );

let masa =
    parseInt(
        urlParams.get("masa")
    );

if(
    !masa ||
    masa < 1 ||
    masa > 50
){

    masa=1;

}

document.getElementById(
    "masaBilgi"
).innerText =
    "MASA "+masa;


/* =====================================================
   SEPET
===================================================== */

let sepet={};


/* =====================================================
   MENÜ
===================================================== */

function menuYukle(){

    db.ref("urunler")
    .on("value",snapshot=>{

        const data =
            snapshot.val() || {};

        const menu =
            document.getElementById("menu");

        menu.innerHTML="";

        const kategoriler={};


        Object.keys(data)
        .forEach(key=>{

            const urun =
                data[key];

            if(!urun)
                return;

            const kategori =
                urun.kategori ||
                "Diğer";

            if(!kategoriler[kategori])
                kategoriler[kategori]=[];

            kategoriler[kategori]
                .push({

                    id:key,

                    ad:
                    urun.ad || "Ürün",

                    fiyat:
                    parseFloat(
                        urun.fiyat
                    ) || 0

                });

        });


        Object.keys(kategoriler)
        .forEach(kategori=>{

            let emoji="🍹";

            if(
                kategori
                .toLowerCase()
                .includes("sıcak")
            )
                emoji="☕";

            else if(
                kategori
                .toLowerCase()
                .includes("soğuk")
            )
                emoji="🧊";

            else if(
                kategori
                .toLowerCase()
                .includes("atıştır")
            )
                emoji="🥪";

            else if(
                kategori
                .toLowerCase()
                .includes("tatlı")
            )
                emoji="🍰";


            let html=`

                <div class="kategori">

                    <div class="kategori-baslik">

                        ${emoji}
                        ${kategori}

                    </div>

                    <div class="urun-grid">

            `;


            kategoriler[kategori]
            .forEach(u=>{

                const adet =
                    sepet[u.id]
                    ? sepet[u.id].adet
                    : 0;


                html+=`

                    <div class="urun">

                        <div>

                            <div class="urun-ad">
                                ${u.ad}
                            </div>

                            <div class="urun-fiyat">
                                ${u.fiyat.toFixed(2)} TL
                            </div>

                        </div>

                        <div class="urun-alt">

                            <span
                                class="adet"
                                id="adet-${u.id}">

                                ${adet}

                            </span>

                            <button
                                class="plus"
                                onclick="
                                urunArttir(
                                '${u.id}',
                                '${u.ad.replace(/'/g,"\\'")}',
                                ${u.fiyat}
                                )">

                                +

                            </button>

                        </div>

                    </div>

                `;

            });


            html+=`

                    </div>

                </div>

            `;


            menu.innerHTML+=html;

        });

    });

}


menuYukle();


/* =====================================================
   ÜRÜN ARTIR
===================================================== */

function urunArttir(
    id,
    ad,
    fiyat
){

    if(!sepet[id]){

        sepet[id]={

            ad:ad,

            fiyat:fiyat,

            adet:0

        };

    }

    sepet[id].adet++;

    const adetEl =
        document.getElementById(
            "adet-"+id
        );

    if(adetEl){

        adetEl.innerText =
            sepet[id].adet;

    }

}


/* =====================================================
   SİPARİŞ GÖNDER
===================================================== */

function siparisGonder(){

    const urunler={};

    let toplam=0;


    Object.keys(sepet)
    .forEach(id=>{

        const u=sepet[id];

        if(u.adet<=0)
            return;


        urunler[id]={

            ad:u.ad,

            fiyat:u.fiyat,

            adet:u.adet

        };


        toplam +=
            u.fiyat*u.adet;

    });


    if(
        Object.keys(urunler).length===0
    ){

        toastGoster(
            "Sepette ürün bulunmuyor."
        );

        return;

    }


    const siparis={

        masa:masa,

        urunler:urunler,

        toplam:toplam,

        durum:"bekliyor",

        zaman:
        new Date()
        .toLocaleTimeString(
            "tr-TR",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        )

    };


    db.ref("siparisler")
    .push(siparis)
    .then(()=>{

        sepet={};

        menuYukle();

        toastGoster(
            "✅ Sipariş garson paneline gönderildi."
        );

    })
    .catch(error=>{

        alert(
            "Sipariş gönderilemedi:\n"
            +error.message
        );

    });

}


/* =====================================================
   GARSON ÇAĞIR
===================================================== */

function garsonCagir(){

    db.ref("bildirimler")
    .push({

        masa:masa,

        zaman:
        new Date()
        .toLocaleTimeString(
            "tr-TR",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        )

    })
    .then(()=>{

        toastGoster(
            "🔔 Garson çağrınız gönderildi."
        );

    })
    .catch(error=>{

        alert(
            "Garson çağrısı gönderilemedi:\n"
            +error.message
        );

    });

}


/* =====================================================
   HESAP
===================================================== */

function hesapAc(){

    document.getElementById(
        "hesapMasa"
    ).innerText=masa;

    document.getElementById(
        "hesapModal"
    ).classList.add("active");


    db.ref("siparisler")
    .once("value")
    .then(snapshot=>{

        const data =
            snapshot.val() || {};

        const urunler={};

        let toplam=0;


        Object.values(data)
        .forEach(siparis=>{

            if(!siparis)
                return;

            if(
                parseInt(siparis.masa)!==masa
            )
                return;

            if(
                siparis.durum!=="onaylandi"
            )
                return;


            Object.values(
                siparis.urunler || {}
            )
            .forEach(u=>{

                const key =
                    String(
                        u.ad || "Ürün"
                    )
                    .toLowerCase();


                if(!urunler[key]){

                    urunler[key]={

                        ad:u.ad,

                        adet:0,

                        fiyat:
                        parseFloat(
                            u.fiyat
                        )||0

                    };

                }


                const adet =
                    parseInt(u.adet)||0;


                urunler[key].adet+=adet;


                toplam +=
                    (
                        parseFloat(
                            u.fiyat
                        )||0
                    ) * adet;

            });

        });


        const box =
            document.getElementById(
                "hesapIcerik"
            );

        box.innerHTML="";


        if(
            Object.keys(urunler).length===0
        ){

            box.innerHTML=`

                <div class="hesap-bos">

                    💳 Henüz onaylanmış
                    hesap bulunmuyor.

                </div>

            `;

            return;

        }


        Object.values(urunler)
        .forEach(u=>{

            box.innerHTML+=`

                <div class="hesap-row">

                    <span>

                        ${u.ad}
                        × ${u.adet}

                    </span>

                    <strong>

                        ${(u.adet*u.fiyat)
                        .toFixed(2)}
                        TL

                    </strong>

                </div>

            `;

        });


        box.innerHTML+=`

            <div class="hesap-toplam">

                TOPLAM:
                ${toplam.toFixed(2)}
                TL

            </div>

        `;

    });

}


/* =====================================================
   YAZ BOZ DEĞİŞKENLERİ
===================================================== */

let oyunTuru="tekli";

let oyunData=null;


/* =====================================================
   YAZ BOZ AÇ
===================================================== */

function yazbozAc(){

    document.getElementById(
        "yazbozModal"
    ).classList.add("active");


    if(!oyunData){

        document.getElementById(
            "yazbozBaslangic"
        ).style.display="block";

        document.getElementById(
            "yazbozOyun"
        ).style.display="none";

    }else{

        document.getElementById(
            "yazbozBaslangic"
        ).style.display="none";

        document.getElementById(
            "yazbozOyun"
        ).style.display="block";

        oyunGoster();

    }

}


/* =====================================================
   OYUN TÜRÜ
===================================================== */

function oyunTuruSec(tur){

    oyunTuru=tur;

    document
    .getElementById("tekliBtn")
    .classList.toggle(
        "aktif",
        tur==="tekli"
    );

    document
    .getElementById("esliBtn")
    .classList.toggle(
        "aktif",
        tur==="esli"
    );

}


/* =====================================================
   YAZ BOZ BAŞLAT
===================================================== */

function yazbozBaslat(){

    const oyuncuSayisi =
        parseInt(
            document.getElementById(
                "oyuncuSayisi"
            ).value
        );

    const oyunSayisi =
        parseInt(
            document.getElementById(
                "oyunSayisi"
            ).value
        );


    oyunData={

        tur:oyunTuru,

        oyuncuSayisi:oyuncuSayisi,

        oyunSayisi:oyunSayisi,

        eller:[]

    };


    for(
        let i=0;
        i<oyunSayisi;
        i++
    ){

        oyunData.eller.push({

            skor1:"",

            skor2:"",

            kilitli:false,

            kilitZamani:null

        });

    }


    document.getElementById(
        "yazbozBaslangic"
    ).style.display="none";

    document.getElementById(
        "yazbozOyun"
    ).style.display="block";


    oyunGoster();

}


/* =====================================================
   OYUN GÖSTER
===================================================== */

function oyunGoster(){

    if(!oyunData)
        return;


    document.getElementById(
        "oyunBilgi"
    ).innerHTML=`

        <strong>
            ${oyunData.tur==="tekli"
                ? "👤 Tekli"
                : "👥 Eşli"}
        </strong>

        &nbsp; • &nbsp;

        ${oyunData.oyuncuSayisi}
        oyuncu

        &nbsp; • &nbsp;

        ${oyunData.oyunSayisi}
        oyun

    `;


    const aktifEl =
        oyunData.eller.findIndex(
            e=>!e.kilitli
        );


    const container =
        document.getElementById(
            "eller"
        );

    container.innerHTML="";


    oyunData.eller
    .forEach((el,index)=>{

        const aktif =
            index===aktifEl;


        let kalan="";


        if(
            el.kilitZamani &&
            !el.kilitli
        ){

            const fark =
                Date.now()
                -el.kilitZamani;


            const saniye =
                Math.max(
                    0,
                    60 -
                    Math.floor(
                        fark/1000
                    )
                );


            kalan =
                saniye+" sn";

        }


        container.innerHTML+=`

            <div class="
                el-card
                ${aktif ? "aktif":""}
                ${el.kilitli ? "kilitli":""}
            ">

                <div class="el-baslik">

                    <span>
                        Oyun ${index+1}
                    </span>

                    <span class="el-durum">

                        ${
                            el.kilitli
                            ? "🔒 Kilitli"
                            : aktif
                            ? "✏️ Aktif"
                            : "⏳ Bekliyor"
                        }

                    </span>

                </div>


                <div class="skor-row">

                    <label>
                        ${oyunData.tur==="tekli"
                        ? "Oyuncu 1"
                        : "Takım 1"}
                    </label>

                    <input
                        type="number"
                        id="skor1-${index}"
                        value="${el.skor1}"
                        ${el.kilitli || !aktif
                        ? "disabled"
                        : ""}
                        oninput="
                        skorDegisti(${index})
                        "
                    >

                </div>


                <div class="skor-row">

                    <label>
                        ${oyunData.tur==="tekli"
                        ? "Oyuncu 2"
                        : "Takım 2"}
                    </label>

                    <input
                        type="number"
                        id="skor2-${index}"
                        value="${el.skor2}"
                        ${el.kilitli || !aktif
                        ? "disabled"
                        : ""}
                        oninput="
                        skorDegisti(${index})
                        "
                    >

                </div>


                <button
                    class="el-kaydet"
                    ${el.kilitli || !aktif
                    ? "disabled"
                    : ""}
                    onclick="
                    skorKaydet(${index})
                    ">

                    ${el.kilitli
                    ? "🔒 KİLİTLİ"
                    : "SKORLARI KAYDET"}

                </button>


                ${
                    el.kilitZamani &&
                    !el.kilitli
                    ?
                    `<div class="kilit-mesaj">
                        ⏱ ${kalan}
                    </div>`
                    :
                    ""
                }

            </div>

        `;

    });

}


/* =====================================================
   SKOR DEĞİŞTİ
===================================================== */

function skorDegisti(index){

    if(!oyunData)
        return;


    const el =
        oyunData.eller[index];


    if(
        el.kilitli
    )
        return;


    const s1 =
        document.getElementById(
            "skor1-"+index
        ).value;

    const s2 =
        document.getElementById(
            "skor2-"+index
        ).value;


    /*
       İKİ SKOR DA GİRİLİNCE
       1 DAKİKALIK SAYACI BAŞLAT
    */

    if(
        s1!=="" &&
        s2!==""
    ){

        if(!el.kilitZamani){

            el.kilitZamani =
                Date.now();

            oyunGoster();

            kilitSayaciBaslat();

        }

    }

}


/* =====================================================
   SKOR KAYDET
===================================================== */

function skorKaydet(index){

    const el =
        oyunData.eller[index];


    if(el.kilitli)
        return;


    const s1 =
        document.getElementById(
            "skor1-"+index
        ).value;

    const s2 =
        document.getElementById(
            "skor2-"+index
        ).value;


    if(
        s1==="" ||
        s2===""
    ){

        toastGoster(
            "İki skoru da girin."
        );

        return;

    }


    el.skor1=s1;

    el.skor2=s2;


    if(!el.kilitZamani){

        el.kilitZamani =
            Date.now();

    }


    toastGoster(
        "Skorlar kaydedildi. 1 dakika sonra kilitlenecek."
    );


    oyunGoster();

    kilitSayaciBaslat();

}


/* =====================================================
   1 DAKİKALIK KİLİT SAYACI
===================================================== */

function kilitSayaciBaslat(){

    const timer =
        setInterval(()=>{

            if(!oyunData){

                clearInterval(timer);
                return;

            }


            let degisti=false;


            oyunData.eller
            .forEach((el,index)=>{

                if(
                    el.lkitli
                )
                    return;

                if(
                    el.kilitli
                )
                    return;


                if(
                    !el.kilitZamani
                )
                    return;


                /*
                   60 SANİYE DOLDU MU?
                */

                if(
                    Date.now()
                    -el.kilitZamani
                    >=60000
                ){

                    el.kilitli=true;

                    degisti=true;

                }

            });


            if(degisti){

                oyunGoster();

            }


            if(
                oyunData.eller.every(
                    e=>e.kilitli ||
                    !e.kilitZamani
                )
            ){

                clearInterval(timer);

            }

        },1000);

}


/* =====================================================
   MODAL KAPAT
===================================================== */

function modalKapat(id){

    document
    .getElementById(id)
    .classList.remove("active");

}


/* =====================================================
   TOAST
===================================================== */

function toastGoster(mesaj){

    const toast =
        document.getElementById(
            "toast"
        );

    toast.innerText=mesaj;

    toast.classList.add("show");


    setTimeout(()=>{

        toast.classList.remove(
            "show"
        );

    },3000);

}


/* =====================================================
   MODAL DIŞINA TIKLAMA
===================================================== */

document
.querySelectorAll(".modal")
.forEach(modal=>{

    modal.addEventListener(
        "click",
        function(e){

            if(e.target===modal){

                modal.classList.remove(
                    "active"
                );

            }

        }
    );

});

</script>

</body>
</html>
