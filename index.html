<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dijital Kahvem</title>

<style>

/* =====================================================
   GENEL
===================================================== */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f1ed;
    color:#35251f;
}


/* =====================================================
   BAŞLIK
===================================================== */

header{
    background:#4e342e;
    color:white;
    padding:18px 15px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:25px;
}

header p{
    margin:5px 0 0;
    font-size:14px;
}

.masa{
    display:inline-block;
    margin-top:8px;
    background:white;
    color:#4e342e;
    padding:7px 15px;
    border-radius:20px;
    font-weight:bold;
}


/* =====================================================
   ÜST BUTONLAR
===================================================== */

.ust{
    display:grid;
    grid-template-columns:repeat(5,1fr);

    gap:8px;

    padding:10px;

    background:white;

    position:sticky;
    top:0;

    z-index:100;

    box-shadow:0 2px 8px #0002;
}

.ust button{
    border:0;
    border-radius:10px;

    min-height:48px;

    padding:10px 6px;

    color:white;

    font-size:14px;
    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}


/* MENÜ */

#menuBtn{
    background:#5d4037;
}


/* GARSON */

#garsonBtn{
    background:#ef6c00;
}


/* YAZ BOZ */

#yazbozBtn{
    background:#7b1fa2;
}


/* HESAP */

#hesapBtn{
    background:#2e7d32;
}


/* SİPARİŞ */

#siparisBtn{
    background:#1565c0;
}


/* BASILMA */

.ust button:active{
    transform:scale(.96);
}


/* AKTİF */

.ust button.aktif{
    filter:brightness(.85);
}


/* =====================================================
   CONTAINER
===================================================== */

.container{
    max-width:1000px;
    margin:auto;
    padding:12px;
}


/* =====================================================
   PANELLER
===================================================== */

.panel{
    display:none;

    background:white;

    border-radius:14px;

    padding:15px;

    margin-top:12px;

    box-shadow:0 2px 10px #0001;
}

.panel.aktif{
    display:block;
}

.panel h2{
    margin-top:0;
    text-align:center;
}


/* =====================================================
   MENÜ
===================================================== */

.kategori{
    margin:18px 0 8px;

    font-size:19px;

    font-weight:bold;
}

.menu{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:9px;
}

.urun{
    background:white;

    border-radius:12px;

    padding:11px;

    min-height:90px;

    box-shadow:0 2px 8px #0001;

    display:flex;

    flex-direction:column;

    justify-content:space-between;
}

.urun h3{
    margin:0;

    font-size:14px;
}

.fiyat{
    font-size:13px;

    color:#795548;

    margin-top:4px;
}

.adet{
    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-top:7px;
}

.adet button{
    width:30px;
    height:30px;

    border:0;

    border-radius:7px;

    background:#ddd;

    font-weight:bold;

    font-size:18px;

    cursor:pointer;
}

.adet span{
    font-weight:bold;
}


/* =====================================================
   HESAP
===================================================== */

.hesap-satir{
    display:flex;

    justify-content:space-between;

    padding:11px 5px;

    border-bottom:1px solid #eee;
}

.hesap-toplam{
    display:flex;

    justify-content:space-between;

    font-size:20px;

    font-weight:bold;

    margin-top:15px;
}

.islem{
    width:100%;

    padding:13px;

    border:0;

    border-radius:9px;

    margin-top:10px;

    color:white;

    font-weight:bold;

    cursor:pointer;
}

.hesap-btn{
    background:#2e7d32;
}

.bos{
    text-align:center;

    color:#777;

    padding:20px;
}


/* =====================================================
   YAZ BOZ AYARLARI
===================================================== */

.yz-ayar{
    display:grid;

    gap:12px;
}

.yz-secim{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:8px;
}

.yz-secim button{
    border:0;

    border-radius:9px;

    padding:12px;

    font-weight:bold;

    cursor:pointer;

    background:#eee;
}

.yz-secim button.aktif{
    background:#7b1fa2;

    color:white;
}


.yz-oyuncular{
    display:flex;

    gap:7px;
}

.yz-oyuncular button{
    width:45px;
    height:40px;

    border:2px solid #ddd;

    background:white;

    border-radius:8px;

    font-weight:bold;

    cursor:pointer;
}

.yz-oyuncular button.aktif{
    background:#7b1fa2;

    color:white;
}


#oyunSayisi{
    width:90px;

    padding:10px;

    border:1px solid #ccc;

    border-radius:8px;
}


.yz-baslat{
    border:0;

    border-radius:9px;

    padding:13px;

    background:#2e7d32;

    color:white;

    font-weight:bold;

    cursor:pointer;
}


/* =====================================================
   YAZ BOZ OYUN ALANI
   EKRANIN YAKLAŞIK 1/4'Ü
===================================================== */

#yzOyun{
    width:100%;

    max-width:700px;

    height:25vh;

    min-height:170px;

    max-height:260px;

    margin:0 auto;
}


/* =====================================================
   TABLO
===================================================== */

.yz-tablo{
    width:100%;

    height:100%;

    overflow:auto;

    margin-top:8px;
}

.yz-grid{
    display:grid;

    min-width:360px;
}


/* =====================================================
   TABLO HÜCRELERİ
===================================================== */

.yz-hucre{
    height:32px;

    min-height:32px;

    padding:2px;

    border-right:1px solid #ddd;

    border-bottom:1px solid #ddd;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:13px;

    font-weight:600;
}


/* =====================================================
   BAŞLIK
===================================================== */

.yz-baslik{
    height:32px;

    min-height:32px;

    background:#7b1fa2;

    color:white;

    font-size:13px;

    font-weight:bold;
}


/* =====================================================
   OYUN NUMARASI
===================================================== */

.yz-oyun{
    height:32px;

    min-height:32px;

    justify-content:flex-start;

    padding-left:7px;

    background:#fafafa;

    font-size:13px;

    font-weight:bold;
}


/* AKTİF OYUN */

.yz-aktif{
    background:#fff3cd;
}


/* =====================================================
   SKOR KUTUSU
===================================================== */

.yz-skor{
    width:42px;

    height:23px;

    padding:0;

    border:1px solid #aaa;

    border-radius:4px;

    text-align:center;

    font-size:13px;

    font-weight:bold;
}

.yz-skor:disabled{
    background:#eeeeee;

    color:#777;
}


/* =====================================================
   YAZ BOZ SÜRE
===================================================== */

.yz-durum{
    height:25px;

    margin-top:5px;

    text-align:center;

    font-size:12px;

    font-weight:bold;
}


/* =====================================================
   TOPLAM SKORLAR
===================================================== */

.yz-toplam{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:4px;

    margin-top:5px;
}

.yz-toplam div{
    background:#f5f5f5;

    padding:4px;

    text-align:center;

    border-radius:5px;

    font-size:11px;
}


/* =====================================================
   MOBİL
===================================================== */

@media(max-width:650px){

    .ust{
        grid-template-columns:
            repeat(5,1fr);

        gap:5px;

        padding:7px;
    }


    .ust button{
        min-height:48px;

        padding:9px 3px;

        font-size:12px;
    }


    .menu{
        grid-template-columns:
            repeat(2,1fr);
    }


    .yz-hucre{
        min-height:32px;

        height:32px;

        font-size:13px;
    }


    .yz-baslik{
        font-size:13px;
    }


    .yz-oyun{
        font-size:13px;
    }


    .yz-skor{
        width:42px;

        height:23px;

        font-size:13px;
    }


    .yz-toplam{
        grid-template-columns:
            repeat(2,1fr);
    }

}

</style>
</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <h1>
        ☕ DİJİTAL KAHVEM
    </h1>

    <p>
        Hoş Geldiniz
    </p>

    <div
        class="masa"
        id="masaNo">

        MASA -

    </div>

</header>


<!-- =====================================================
     ÜST BUTONLAR
===================================================== -->

<div class="ust">


    <button
        id="menuBtn"
        class="aktif"
        onclick="panelAc('menuPanel')">

        ☕ Menü

    </button>


    <button
        id="garsonBtn"
        onclick="garsonCagir()">

        🔔 Garson

    </button>


    <button
        id="yazbozBtn"
        onclick="panelAc('yazboz')">

        📝 Yaz-Boz

    </button>


    <button
        id="hesapBtn"
        onclick="panelAc('hesap')">

        💳 Hesap

    </button>


    <button
        id="siparisBtn"
        onclick="siparisGonder()">

        🛎 Sipariş

    </button>


</div>


<div class="container">


<!-- =====================================================
     MENÜ
===================================================== -->

<div
    id="menuPanel"
    class="panel aktif">


    <!-- SICAK -->

    <div class="kategori">

        ☕ SICAK İÇECEKLER

    </div>


    <div class="menu">


        <!-- ÇAY -->

        <div class="urun">

            <h3>
                Çay
            </h3>

            <div class="fiyat">
                25 ₺
            </div>

            <div class="adet">

                <button
                    onclick="adetAzalt('Çay')">

                    −

                </button>


                <span
                    id="adet-Çay">

                    0

                </span>


                <button
                    onclick="adetArtir('Çay')">

                    +

                </button>

            </div>

        </div>


        <!-- NESCAFE -->

        <div class="urun">

            <h3>
                Nescafe
            </h3>

            <div class="fiyat">
                60 ₺
            </div>

            <div class="adet">

                <button
                    onclick="adetAzalt('Nescafe')">

                    −

                </button>


                <span
                    id="adet-Nescafe">

                    0

                </span>


                <button
                    onclick="adetArtir('Nescafe')">

                    +

                </button>

            </div>

        </div>


        <!-- TÜRK KAHVESİ -->

        <div class="urun">

            <h3>
                Türk Kahvesi
            </h3>

            <div class="fiyat">
                70 ₺
            </div>

            <div class="adet">

                <button
                    onclick="adetAzalt('Türk Kahvesi')">

                    −

                </button>


                <span
                    id="adet-Türk Kahvesi">

                    0

                </span>


                <button
                    onclick="adetArtir('Türk Kahvesi')">

                    +

                </button>

            </div>

        </div>


        <!-- SU -->

        <div class="urun">

            <h3>
                Su
            </h3>

            <div class="fiyat">
                15 ₺
            </div>

            <div class="adet">

                <button
                    onclick="adetAzalt('Su')">

                    −

                </button>


                <span
                    id="adet-Su">

                    0

                </span>


                <button
                    onclick="adetArtir('Su')">

                    +

                </button>

            </div>

        </div>


    </div>


    <!-- SOĞUK -->

    <div class="kategori">

        🧊 SOĞUK İÇECEKLER

    </div>


    <div class="menu">


        <!-- KOLA -->

        <div class="urun">

            <h3>
                Kola
            </h3>

            <div class="fiyat">
                50 ₺
            </div>

            <div class="adet">

                <button
                    onclick="adetAzalt('Kola')">

                    −

                </button>


                <span
                    id="adet-Kola">

                    0

                </span>


                <button
                    onclick="adetArtir('Kola')">

                    +

                </button>

            </div>

        </div>


        <!-- FANTA -->

        <div class="urun">

            <h3>
                Fanta
            </h3>

            <div class="fiyat">
                50 ₺
            </div>

            <div class="adet">

                <button
                    onclick="adetAzalt('Fanta')">

                    −

                </button>


                <span
                    id="adet-Fanta">

                    0

                </span>


                <button
                    onclick="adetArtir('Fanta')">

                    +

                </button>

            </div>

        </div>


    </div>


    <!-- ATIŞTIRMALIK -->

    <div class="kategori">

        🍪 ATIŞTIRMALIKLAR

    </div>


    <div class="menu">


        <!-- TOST -->

        <div class="urun">

            <h3>
                Tost
            </h3>

            <div class="fiyat">
                100 ₺
            </div>

            <div class="adet">

                <button
                    onclick="adetAzalt('Tost')">

                    −

                </button>


                <span
                    id="adet-Tost">

                    0

                </span>


                <button
                    onclick="adetArtir('Tost')">

                    +

                </button>

            </div>

        </div>


    </div>

</div>


<!-- =====================================================
     YAZ BOZ
===================================================== -->

<div
    id="yazboz"
    class="panel">


    <h2>
        📝 YAZ-BOZ
    </h2>


    <!-- AYARLAR -->

    <div
        id="yzAyar"
        class="yz-ayar">


        <b>
            Oyun Türü
        </b>


        <div class="yz-secim">


            <button
                id="yzEsli"
                class="aktif"
                onclick="yzTur('esli')">

                👥 Eşli Oyun

            </button>


            <button
                id="yzTekli"
                onclick="yzTur('tekli')">

                👤 Tekli Oyun

            </button>


        </div>


        <b>
            Oyuncu Sayısı
        </b>


        <div class="yz-oyuncular">


            <button
                class="aktif"
                onclick="yzOyuncu(2,this)">

                2

            </button>


            <button
                onclick="yzOyuncu(3,this)">

                3

            </button>


            <button
                onclick="yzOyuncu(4,this)">

                4

            </button>


        </div>


        <b>
            Kaç oyun oynanacak?
        </b>


        <input
            id="oyunSayisi"
            type="number"
            value="7"
            min="1"
            max="100">


        <button
            class="yz-baslat"
            onclick="yzBaslat()">

            ▶ YAZ-BOZU BAŞLAT

        </button>


    </div>


    <!-- OYUN -->

    <div
        id="yzOyun"
        style="display:none;">


        <div
            id="yzTablo"
            class="yz-tablo">
        </div>


        <div
            id="yzDurum"
            class="yz-durum">
        </div>


        <div
            id="yzToplam"
            class="yz-toplam">
        </div>


    </div>

</div>


<!-- =====================================================
     HESAP
===================================================== -->

<div
    id="hesap"
    class="panel">


    <h2>
        💳 Hesabım
    </h2>


    <div
        id="hesapListe">
    </div>


    <div class="hesap-toplam">

        <span>
            Toplam
        </span>

        <span id="hesapToplam">
            0 ₺
        </span>

    </div>


    <button
        class="islem hesap-btn"
        onclick="hesapIstiyorum()">

        💳 HESAP İSTİYORUM

    </button>


</div>


</div>


<script>

/* =====================================================
   MASA
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


let masa =
    params.get("masa") ||
    params.get("table") ||
    params.get("masaNo");


if(!masa){

    masa = "1";

}


document
    .getElementById("masaNo")
    .textContent =
    "MASA " + masa;


/* =====================================================
   ÜRÜNLER
===================================================== */

const urunler = {

    "Çay":25,

    "Nescafe":60,

    "Türk Kahvesi":70,

    "Su":15,

    "Kola":50,

    "Fanta":50,

    "Tost":100

};


let sepet = {};


Object.keys(urunler)
    .forEach(
        urun => {

            sepet[urun] = 0;

        }
    );


/* =====================================================
   ADET ARTIR
===================================================== */

function adetArtir(urun){

    sepet[urun]++;


    document
        .getElementById(
            "adet-" + urun
        )
        .textContent =
        sepet[urun];

}


/* =====================================================
   ADET AZALT
===================================================== */

function adetAzalt(urun){

    if(
        sepet[urun] > 0
    ){

        sepet[urun]--;

    }


    document
        .getElementById(
            "adet-" + urun
        )
        .textContent =
        sepet[urun];

}


/* =====================================================
   PANEL
===================================================== */

function panelAc(panel){

    document
        .querySelectorAll(
            ".panel"
        )
        .forEach(
            p => {

                p.classList.remove(
                    "aktif"
                );

            }
        );


    const secilen =
        document.getElementById(
            panel
        );


    if(secilen){

        secilen.classList.add(
            "aktif"
        );

    }


    document
        .querySelectorAll(
            ".ust button"
        )
        .forEach(
            b => {

                b.classList.remove(
                    "aktif"
                );

            }
        );


    if(
        panel === "menuPanel"
    ){

        document
            .getElementById(
                "menuBtn"
            )
            .classList.add(
                "aktif"
            );

    }


    if(
        panel === "yazboz"
    ){

        document
            .getElementById(
                "yazbozBtn"
            )
            .classList.add(
                "aktif"
            );

    }


    if(
        panel === "hesap"
    ){

        document
            .getElementById(
                "hesapBtn"
            )
            .classList.add(
                "aktif"
            );


        hesapGoster();

    }

}


/* =====================================================
   GARSON
===================================================== */

function garsonCagir(){

    alert(

        "🔔 GARSON ÇAĞRILDI\n\n" +

        "Masa: " +
        masa

    );

}


/* =====================================================
   SİPARİŞ
===================================================== */

function siparisGonder(){

    let toplam = 0;

    let liste = [];


    Object.keys(sepet)
        .forEach(
            urun => {

                if(
                    sepet[urun] > 0
                ){

                    const adet =
                        sepet[urun];


                    const tutar =
                        adet *
                        urunler[urun];


                    toplam += tutar;


                    liste.push(

                        adet +
                        " × " +
                        urun

                    );

                }

            }
        );


    if(
        liste.length === 0
    ){

        alert(
            "Henüz ürün seçmediniz."
        );

        return;

    }


    alert(

        "🛎 SİPARİŞ GÖNDERİLDİ\n\n" +

        "Masa: " +
        masa +

        "\n\n" +

        liste.join("\n") +

        "\n\nToplam: " +
        toplam +
        " ₺"

    );

}


/* =====================================================
   HESAP
===================================================== */

function hesapGoster(){

    const alan =
        document.getElementById(
            "hesapListe"
        );


    let toplam = 0;

    let varMi = false;


    alan.innerHTML = "";


    Object.keys(sepet)
        .forEach(
            urun => {

                if(
                    sepet[urun] > 0
                ){

                    varMi = true;


                    const tutar =
                        sepet[urun] *
                        urunler[urun];


                    toplam += tutar;


                    alan.innerHTML += `

                        <div
                            class="hesap-satir">

                            <span>

                                ${urun}
                                ×
                                ${sepet[urun]}

                            </span>

                            <b>

                                ${tutar} ₺

                            </b>

                        </div>

                    `;

                }

            }
        );


    if(!varMi){

        alan.innerHTML = `

            <div class="bos">

                Henüz sipariş yok.

            </div>

        `;

    }


    document
        .getElementById(
            "hesapToplam"
        )
        .textContent =
        toplam + " ₺";

}


function hesapIstiyorum(){

    alert(

        "💳 HESAP İSTENDİ\n\n" +

        "Masa: " +
        masa

    );

}


/* =====================================================
   YAZ BOZ DEĞİŞKENLERİ
===================================================== */

let yzTurSec = "esli";

let yzOyuncuSayisi = 2;

let yzOyunSayisi = 7;

let yzAktifOyun = 1;

let yzOyunlar = [];

let yzTimer = null;

let yzKilitZamani = null;


/* =====================================================
   OYUN TÜRÜ
===================================================== */

function yzTur(tur){

    yzTurSec = tur;


    document
        .getElementById(
            "yzEsli"
        )
        .classList.remove(
            "aktif"
        );


    document
        .getElementById(
            "yzTekli"
        )
        .classList.remove(
            "aktif"
        );


    if(
        tur === "esli"
    ){

        document
            .getElementById(
                "yzEsli"
            )
            .classList.add(
                "aktif"
            );


        yzOyuncuSayisi = 2;


        document
            .querySelectorAll(
                ".yz-oyuncular button"
            )
            .forEach(
                b => {

                    b.classList.remove(
                        "aktif"
                    );

                }
            );


        document
            .querySelectorAll(
                ".yz-oyuncular button"
            )[0]
            .classList.add(
                "aktif"
            );

    }
    else{

        document
            .getElementById(
                "yzTekli"
            )
            .classList.add(
                "aktif"
            );

    }

}


/* =====================================================
   OYUNCU
===================================================== */

function yzOyuncu(
    sayi,
    btn
){

    if(
        yzTurSec === "esli" &&
        sayi !== 2
    ){

        return;

    }


    yzOyuncuSayisi =
        sayi;


    document
        .querySelectorAll(
            ".yz-oyuncular button"
        )
        .forEach(
            b => {

                b.classList.remove(
                    "aktif"
                );

            }
        );


    btn.classList.add(
        "aktif"
    );

}


/* =====================================================
   BAŞLAT
===================================================== */

function yzBaslat(){

    yzOyunSayisi =
        parseInt(
            document
                .getElementById(
                    "oyunSayisi"
                )
                .value
        );


    if(
        !yzOyunSayisi ||
        yzOyunSayisi < 1
    ){

        alert(
            "En az 1 oyun seçin."
        );

        return;

    }


    yzAktifOyun = 1;

    yzOyunlar = [];


    for(
        let i = 0;
        i < yzOyunSayisi;
        i++
    ){

        yzOyunlar.push({

            skor:
                Array(
                    yzOyuncuSayisi
                ).fill(""),

            kilitli:false,

            basladi:false

        });

    }


    document
        .getElementById(
            "yzAyar"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "yzOyun"
        )
        .style.display =
        "block";


    yzTabloOlustur();

    yzToplamGoster();

}


/* =====================================================
   TABLO OLUŞTUR
===================================================== */

function yzTabloOlustur(){

    const alan =
        document.getElementById(
            "yzTablo"
        );


    alan.innerHTML = "";


    const grid =
        document.createElement(
            "div"
        );


    grid.className =
        "yz-grid";


    grid.style.gridTemplateColumns =
        `70px repeat(${yzOyuncuSayisi},1fr)`;


    function hucre(
        html,
        cls = ""
    ){

        const d =
            document.createElement(
                "div"
            );


        d.className =
            "yz-hucre " +
            cls;


        d.innerHTML =
            html;


        grid.appendChild(
            d
        );

    }


    hucre(
        "OYUN",
        "yz-baslik"
    );


    for(
        let p = 1;
        p <= yzOyuncuSayisi;
        p++
    ){

        hucre(

            p +
            ". OYUNCU",

            "yz-baslik"

        );

    }


    yzOyunlar.forEach(
        (oyun,index) => {


            const aktif =
                index ===
                yzAktifOyun - 1;


            hucre(

                (index + 1) +
                ". OYUN " +

                (
                    oyun.kilitli
                    ? "🔒"
                    : ""
                ),

                "yz-oyun " +

                (
                    aktif
                    ? "yz-aktif"
                    : ""
                )

            );


            for(
                let p = 0;
                p < yzOyuncuSayisi;
                p++
            ){

                const input =
                    document.createElement(
                        "input"
                    );


                input.type =
                    "number";


                input.className =
                    "yz-skor";


                input.value =
                    oyun.skor[p];


                input.disabled =
                    !aktif ||
                    oyun.kilitli;


                input.dataset.oyun =
                    index;


                input.dataset.oyuncu =
                    p;


                input.addEventListener(
                    "input",
                    yzSkorDegisti
                );


                const d =
                    document.createElement(
                        "div"
                    );


                d.className =
                    "yz-hucre";


                d.appendChild(
                    input
                );


                grid.appendChild(
                    d
                );

            }

        }
    );


    alan.appendChild(
        grid
    );

}


/* =====================================================
   SKOR DEĞİŞTİ
===================================================== */

function yzSkorDegisti(e){

    const oyun =
        parseInt(
            e.target.dataset.oyun
        );


    const oyuncu =
        parseInt(
            e.target.dataset.oyuncu
        );


    yzOyunlar[
        oyun
    ].skor[
        oyuncu
    ] =
        e.target.value;


    yzToplamGoster();


    if(
        oyun ===
        yzAktifOyun - 1
    ){

        yzTumSkorlarGirildi();

    }

}


/* =====================================================
   TÜM SKORLAR
===================================================== */

function yzTumSkorlarGirildi(){

    const oyun =
        yzOyunlar[
            yzAktifOyun - 1
        ];


    if(!oyun)
        return;


    if(
        oyun.basladi
    )
        return;


    const tamam =
        oyun.skor.every(
            skor =>

                skor !== "" &&
                skor !== null &&
                skor !== undefined

        );


    if(!tamam)
        return;


    oyun.basladi = true;


    yzKilitZamani =
        Date.now() + 60000;


    document
        .getElementById(
            "yzDurum"
        )
        .textContent =

        "⏱️ Tüm skorlar girildi. " +
        "60 saniye sonra kilitlenecek.";


    if(yzTimer){

        clearInterval(
            yzTimer
        );

    }


    yzTimer =
        setInterval(
            yzSureKontrol,
            1000
        );


    yzSureKontrol();

}


/* =====================================================
   SÜRE
===================================================== */

function yzSureKontrol(){

    if(
        !yzKilitZamani
    )
        return;


    const kalan =
        yzKilitZamani -
        Date.now();


    if(
        kalan <= 0
    ){

        clearInterval(
            yzTimer
        );


        yzOyunKilitle();


        return;

    }


    document
        .getElementById(
            "yzDurum"
        )
        .textContent =

        "⏱️ Skorlar " +

        Math.ceil(
            kalan / 1000
        ) +

        " saniye sonra kilitlenecek.";

}


/* =====================================================
   KİLİTLE
===================================================== */

function yzOyunKilitle(){

    const oyun =
        yzOyunlar[
            yzAktifOyun - 1
        ];


    if(!oyun)
        return;


    oyun.kilitli =
        true;


    oyun.basladi =
        false;


    yzKilitZamani =
        null;


    if(
        yzAktifOyun <
        yzOyunSayisi
    ){

        document
            .getElementById(
                "yzDurum"
            )
            .textContent =

            "🔒 " +
            yzAktifOyun +
            ". oyun kilitlendi.";


        yzAktifOyun++;


        setTimeout(
            () => {

                yzTabloOlustur();

                yzToplamGoster();


                document
                    .getElementById(
                        "yzDurum"
                    )
                    .textContent =

                    "▶ " +
                    yzAktifOyun +
                    ". oyun aktif.";

            },

            700

        );

    }
    else{

        yzTabloOlustur();

        yzToplamGoster();


        document
            .getElementById(
                "yzDurum"
            )
            .textContent =

            "🏆 Tüm oyunlar tamamlandı.";

    }

}


/* =====================================================
   TOPLAM
===================================================== */

function yzToplamGoster(){

    const alan =
        document.getElementById(
            "yzToplam"
        );


    alan.innerHTML = "";


    for(
        let p = 0;
        p < yzOyuncuSayisi;
        p++
    ){

        let toplam = 0;


        yzOyunlar.forEach(
            oyun => {

                const skor =
                    parseFloat(
                        oyun.skor[p]
                    );


                if(
                    !isNaN(skor)
                ){

                    toplam += skor;

                }

            }
        );


        alan.innerHTML += `

            <div>

                ${p + 1}. Oyuncu

                <br>

                <b>
                    ${toplam}
                </b>

            </div>

        `;

    }

}

</script>
