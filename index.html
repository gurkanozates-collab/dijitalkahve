<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dijital Kahvem</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f5f1ed;
 color:#35251f;
}
header{
 background:#4e342e;
 color:#fff;
 padding:18px 15px;
 text-align:center;
}
header h1{margin:0;font-size:25px}
header p{margin:5px 0 0;font-size:14px}
.masa{
 display:inline-block;
 margin-top:8px;
 background:#fff;
 color:#4e342e;
 padding:6px 14px;
 border-radius:20px;
 font-weight:bold;
}
.ust{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:7px;
 padding:10px;
 background:#fff;
 position:sticky;
 top:0;
 z-index:10;
 box-shadow:0 2px 8px #0002;
}
.ust button{
 border:0;
 border-radius:9px;
 padding:11px 4px;
 background:#eee;
 font-weight:bold;
 cursor:pointer;
}
.ust button.aktif{
 background:#5d4037;
 color:#fff;
}
.container{
 max-width:1000px;
 margin:auto;
 padding:12px;
}
.kategori{
 margin:18px 0 8px;
 font-size:19px;
 font-weight:bold;
}
.menu{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:9px;
}
.urun{
 background:#fff;
 border-radius:12px;
 padding:11px;
 min-height:90px;
 box-shadow:0 2px 8px #0001;
 display:flex;
 flex-direction:column;
 justify-content:space-between;
}
.urun h3{
 margin:0;
 font-size:14px;
}
.fiyat{
 font-size:13px;
 color:#795548;
 margin-top:4px;
}
.ekle{
 align-self:flex-end;
 width:34px;
 height:34px;
 border:0;
 border-radius:50%;
 background:#5d4037;
 color:#fff;
 font-size:22px;
 cursor:pointer;
}
.adet{
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin-top:7px;
}
.adet button{
 width:28px;
 height:28px;
 border:0;
 border-radius:7px;
 background:#ddd;
 font-weight:bold;
}
.adet span{font-weight:bold}

/* PANELLER */
.panel{
 display:none;
 background:#fff;
 border-radius:14px;
 padding:15px;
 margin-top:12px;
 box-shadow:0 2px 10px #0001;
}
.panel.aktif{display:block}
.panel h2{
 margin-top:0;
 text-align:center;
}

/* YAZ BOZ */
.yz-ayar{
 display:grid;
 gap:12px;
}
.yz-secim{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
}
.yz-secim button,
.yz-baslat{
 border:0;
 border-radius:9px;
 padding:12px;
 font-weight:bold;
 cursor:pointer;
}
.yz-secim button.aktif{
 background:#5d4037;
 color:white;
}
.yz-oyuncular{
 display:flex;
 gap:7px;
}
.yz-oyuncular button{
 width:45px;
 height:40px;
 border:2px solid #ddd;
 background:#fff;
 border-radius:8px;
 font-weight:bold;
}
.yz-oyuncular button.aktif{
 background:#5d4037;
 color:#fff;
}
#oyunSayisi{
 width:90px;
 padding:10px;
 border:1px solid #ccc;
 border-radius:8px;
}
.yz-baslat{
 background:#2e7d32;
 color:white;
}
.yz-tablo{
 overflow-x:auto;
 margin-top:15px;
}
.yz-grid{
 display:grid;
 min-width:430px;
}
.yz-hucre{
 min-height:36px;
 border-right:1px solid #ddd;
 border-bottom:1px solid #ddd;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:3px;
 font-size:12px;
}
.yz-baslik{
 background:#5d4037;
 color:white;
 font-weight:bold;
}
.yz-oyun{
 justify-content:flex-start;
 padding-left:7px;
 background:#fafafa;
 font-weight:bold;
}
.yz-aktif{
 background:#fff3cd;
}
.yz-skor{
 width:65px;
 height:28px;
 text-align:center;
 border:1px solid #bbb;
 border-radius:6px;
}
.yz-skor:disabled{
 background:#eee;
}
.yz-durum{
 text-align:center;
 margin-top:10px;
 font-weight:bold;
 font-size:13px;
}
.yz-toplam{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:5px;
 margin-top:10px;
}
.yz-toplam div{
 background:#f5f5f5;
 padding:7px;
 text-align:center;
 border-radius:7px;
 font-size:12px;
}

/* HESAP */
.hesap-satir{
 display:flex;
 justify-content:space-between;
 padding:11px 5px;
 border-bottom:1px solid #eee;
}
.hesap-toplam{
 display:flex;
 justify-content:space-between;
 font-size:20px;
 font-weight:bold;
 margin-top:15px;
}

/* BUTONLAR */
.islem{
 width:100%;
 padding:13px;
 border:0;
 border-radius:9px;
 margin-top:10px;
 color:white;
 font-weight:bold;
 cursor:pointer;
}
.garson{background:#ef6c00}
.siparis{background:#1565c0}
.hesap-btn{background:#2e7d32}

.bos{
 text-align:center;
 color:#777;
 padding:20px;
}

@media(max-width:650px){
 .menu{grid-template-columns:repeat(2,1fr)}
 .ust button{font-size:11px;padding:10px 2px}
}
</style>
</head>

<body>

<header>
 <h1>☕ DİJİTAL KAHVEM</h1>
 <p>Hoş Geldiniz</p>
 <div class="masa" id="masaNo">MASA -</div>
</header>

<!-- ÜST BUTONLAR -->
<div class="ust">
 <button id="garsonBtn" onclick="garsonCagir()">🔔 Garson</button>
 <button id="yazbozBtn" onclick="panelAc('yazboz')">📝 Yaz-Boz</button>
 <button id="hesapBtn" onclick="panelAc('hesap')">💳 Hesap</button>
 <button id="siparisBtn" onclick="siparisGonder()">🛎 Sipariş Gönder</button>
</div>

<div class="container">

 <!-- MENÜ -->
 <div id="menuPanel" class="panel aktif">

  <div class="kategori">☕ SICAK İÇECEKLER</div>

  <div class="menu">

   <div class="urun">
    <h3>Çay</h3>
    <div class="fiyat">25 ₺</div>
    <div class="adet">
     <button onclick="adetAzalt('Çay')">−</button>
     <span id="adet-Çay">0</span>
     <button onclick="adetArtir('Çay')">+</button>
    </div>
   </div>

   <div class="urun">
    <h3>Nescafe</h3>
    <div class="fiyat">60 ₺</div>
    <div class="adet">
     <button onclick="adetAzalt('Nescafe')">−</button>
     <span id="adet-Nescafe">0</span>
     <button onclick="adetArtir('Nescafe')">+</button>
    </div>
   </div>

   <div class="urun">
    <h3>Türk Kahvesi</h3>
    <div class="fiyat">70 ₺</div>
    <div class="adet">
     <button onclick="adetAzalt('Türk Kahvesi')">−</button>
     <span id="adet-Türk Kahvesi">0</span>
     <button onclick="adetArtir('Türk Kahvesi')">+</button>
    </div>
   </div>

   <div class="urun">
    <h3>Su</h3>
    <div class="fiyat">15 ₺</div>
    <div class="adet">
     <button onclick="adetAzalt('Su')">−</button>
     <span id="adet-Su">0</span>
     <button onclick="adetArtir('Su')">+</button>
    </div>
   </div>

  </div>

  <div class="kategori">🧊 SOĞUK İÇECEKLER</div>

  <div class="menu">

   <div class="urun">
    <h3>Kola</h3>
    <div class="fiyat">50 ₺</div>
    <div class="adet">
     <button onclick="adetAzalt('Kola')">−</button>
     <span id="adet-Kola">0</span>
     <button onclick="adetArtir('Kola')">+</button>
    </div>
   </div>

   <div class="urun">
    <h3>Fanta</h3>
    <div class="fiyat">50 ₺</div>
    <div class="adet">
     <button onclick="adetAzalt('Fanta')">−</button>
     <span id="adet-Fanta">0</span>
     <button onclick="adetArtir('Fanta')">+</button>
    </div>
   </div>

  </div>

  <div class="kategori">🍪 ATIŞTIRMALIKLAR</div>

  <div class="menu">

   <div class="urun">
    <h3>Tost</h3>
    <div class="fiyat">100 ₺</div>
    <div class="adet">
     <button onclick="adetAzalt('Tost')">−</button>
     <span id="adet-Tost">0</span>
     <button onclick="adetArtir('Tost')">+</button>
    </div>
   </div>

  </div>

 </div>


 <!-- YAZ BOZ -->
 <div id="yazboz" class="panel">

  <h2>📝 YAZ-BOZ</h2>

  <div id="yzAyar">

   <b>Oyun Türü</b>

   <div class="yz-secim">
    <button class="aktif" id="yzEsli"
      onclick="yzTur('esli')">
      👥 Eşli Oyun
    </button>

    <button id="yzTekli"
      onclick="yzTur('tekli')">
      👤 Tekli Oyun
    </button>
   </div>

   <b>Oyuncu Sayısı</b>

   <div class="yz-oyuncular">
    <button class="aktif" onclick="yzOyuncu(2,this)">2</button>
    <button onclick="yzOyuncu(3,this)">3</button>
    <button onclick="yzOyuncu(4,this)">4</button>
   </div>

   <b>Kaç oyun oynanacak?</b>

   <input id="oyunSayisi" type="number" value="7" min="1" max="100">

   <button class="yz-baslat" onclick="yzBaslat()">
    ▶ YAZ-BOZU BAŞLAT
   </button>

  </div>

  <div id="yzOyun" style="display:none">

   <div id="yzTablo" class="yz-tablo"></div>

   <div id="yzDurum" class="yz-durum"></div>

   <div id="yzToplam" class="yz-toplam"></div>

  </div>

 </div>


 <!-- HESAP -->
 <div id="hesap" class="panel">

  <h2>💳 Hesabım</h2>

  <div id="hesapListe"></div>

  <div class="hesap-toplam">
   <span>Toplam</span>
   <span id="hesapToplam">0 ₺</span>
  </div>

  <button class="islem hesap-btn"
    onclick="hesapIstiyorum()">
    💳 HESAP İSTİYORUM
  </button>

 </div>

</div>


<script>

/* =====================================================
   MASA NUMARASI
===================================================== */

const params=new URLSearchParams(
 location.search
);

let masa=
 params.get("masa") ||
 params.get("table") ||
 params.get("masaNo");

if(!masa){
 masa="1";
}

document.getElementById("masaNo")
 .textContent="MASA "+masa;


/* =====================================================
   MENÜ
===================================================== */

const urunler={
 "Çay":25,
 "Nescafe":60,
 "Türk Kahvesi":70,
 "Su":15,
 "Kola":50,
 "Fanta":50,
 "Tost":100
};

let sepet={};

Object.keys(urunler).forEach(
 urun=>sepet[urun]=0
);


function adetArtir(urun){

 sepet[urun]++;

 document.getElementById(
  "adet-"+urun
 ).textContent=sepet[urun];

}


function adetAzalt(urun){

 if(sepet[urun]>0)
  sepet[urun]--;

 document.getElementById(
  "adet-"+urun
 ).textContent=sepet[urun];

}


/* =====================================================
   PANELLER
===================================================== */

function panelAc(panel){

 document.querySelectorAll(
  ".panel"
 ).forEach(p=>{
  p.classList.remove("aktif");
 });


 document.getElementById(panel)
  .classList.add("aktif");


 document.querySelectorAll(
  ".ust button"
 ).forEach(b=>{
  b.classList.remove("aktif");
 });


 if(panel==="yazboz")
  document.getElementById("yazbozBtn")
   .classList.add("aktif");

 if(panel==="hesap"){
  document.getElementById("hesapBtn")
   .classList.add("aktif");
  hesapGoster();
 }

}


/* =====================================================
   GARSON
===================================================== */

function garsonCagir(){

 alert(
  "🔔 Garson çağrıldı.\nMasa "+masa
 );

}


/* =====================================================
   SİPARİŞ
===================================================== */

function siparisGonder(){

 let toplam=0;
 let liste=[];

 Object.keys(sepet).forEach(urun=>{

  if(sepet[urun]>0){

   let tutar=
    sepet[urun]*urunler[urun];

   toplam+=tutar;

   liste.push(
    sepet[urun]+" x "+urun
   );

  }

 });


 if(!liste.length){

  alert("Henüz ürün seçmediniz.");
  return;

 }


 alert(
  "🛎 Sipariş gönderildi!\n\n"+
  "Masa: "+masa+"\n"+
  liste.join("\n")+
  "\n\nToplam: "+toplam+" ₺"
 );

}


/* =====================================================
   HESAP
===================================================== */

function hesapGoster(){

 let alan=
  document.getElementById(
   "hesapListe"
  );

 let toplam=0;

 alan.innerHTML="";

 let varMi=false;

 Object.keys(sepet).forEach(urun=>{

  if(sepet[urun]>0){

   varMi=true;

   let tutar=
    sepet[urun]*urunler[urun];

   toplam+=tutar;

   alan.innerHTML+=`
    <div class="hesap-satir">
     <span>
      ${urun} × ${sepet[urun]}
     </span>
     <b>${tutar} ₺</b>
    </div>
   `;

  }

 });


 if(!varMi){

  alan.innerHTML=
   `<div class="bos">
     Henüz sipariş yok.
   </div>`;

 }


 document.getElementById(
  "hesapToplam"
 ).textContent=
  toplam+" ₺";

}


function hesapIstiyorum(){

 alert(
  "💳 Hesap isteğiniz garsona iletildi.\n"+
  "Masa "+masa
 );

}


/* =====================================================
   YAZ BOZ
===================================================== */

let yzTurSec="esli";
let yzOyuncuSayisi=2;
let yzOyunSayisi=7;
let yzAktifOyun=1;
let yzOyunlar=[];
let yzTimer=null;
let yzKilitZamani=null;


function yzTur(tur){

 yzTurSec=tur;

 document.getElementById("yzEsli")
  .classList.remove("aktif");

 document.getElementById("yzTekli")
  .classList.remove("aktif");

 if(tur==="esli"){

  document.getElementById("yzEsli")
   .classList.add("aktif");

  yzOyuncuSayisi=2;

  document.querySelectorAll(
   ".yz-oyuncular button"
  ).forEach(b=>{
   b.classList.remove("aktif");
  });

  document.querySelectorAll(
   ".yz-oyuncular button"
  )[0].classList.add("aktif");

 }else{

  document.getElementById("yzTekli")
   .classList.add("aktif");

 }

}


function yzOyuncu(sayi,btn){

 if(yzTurSec==="esli" && sayi!==2)
  return;

 yzOyuncuSayisi=sayi;

 document.querySelectorAll(
  ".yz-oyuncular button"
 ).forEach(b=>{
  b.classList.remove("aktif");
 });

 btn.classList.add("aktif");

}


function yzBaslat(){

 yzOyunSayisi=
  parseInt(
   document.getElementById(
    "oyunSayisi"
   ).value
  );

 if(!yzOyunSayisi ||
    yzOyunSayisi<1){

  alert("En az 1 oyun seçin.");
  return;

 }

 yzAktifOyun=1;
 yzOyunlar=[];

 for(
  let i=0;
  i<yzOyunSayisi;
  i++
 ){

  yzOyunlar.push({
   skor:Array(
    yzOyuncuSayisi
   ).fill(""),
   kilitli:false,
   basladi:false
  });

 }

 document.getElementById(
  "yzAyar"
 ).style.display="none";

 document.getElementById(
  "yzOyun"
 ).style.display="block";

 yzTabloOlustur();

 yzToplamGoster();

}


function yzTabloOlustur(){

 let alan=
  document.getElementById(
   "yzTablo"
  );

 alan.innerHTML="";

 let grid=
  document.createElement("div");

 grid.className="yz-grid";

 grid.style.gridTemplateColumns=
  `70px repeat(${yzOyuncuSayisi},1fr)`;

 function hucre(html,cls=""){

  let d=
   document.createElement("div");

  d.className=
   "yz-hucre "+cls;

  d.innerHTML=html;

  grid.appendChild(d);

 }


 hucre("OYUN","yz-baslik");

 for(
  let p=1;
  p<=yzOyuncuSayisi;
  p++
 ){

  hucre(
   p+". OYUNCU",
   "yz-baslik"
  );

 }


 yzOyunlar.forEach(
  (oyun,index)=>{

   let aktif=
    index===yzAktifOyun-1;

   hucre(
    (index+1)+". OYUN "+
    (oyun.kilitli?"🔒":""),
    "yz-oyun "+
    (aktif?"yz-aktif":"")
   );


   for(
    let p=0;
    p<yzOyuncuSayisi;
    p++
   ){

    let input=
     document.createElement("input");

    input.type="number";

    input.className="yz-skor";

    input.value=
     oyun.skor[p];

    input.disabled=
     !aktif || oyun.kilitli;

    input.dataset.oyun=index;
    input.dataset.oyuncu=p;

    input.addEventListener(
     "input",
     yzSkorDegisti
    );

    let d=
     document.createElement("div");

    d.className=
     "yz-hucre "+
     (oyun.kilitli?"kilitli":"");

    d.appendChild(input);

    grid.appendChild(d);

   }

  }
 );


 alan.appendChild(grid);

}


function yzSkorDegisti(e){

 let oyun=
  parseInt(
   e.target.dataset.oyun
  );

 let oyuncu=
  parseInt(
   e.target.dataset.oyuncu
  );

 yzOyunlar[oyun].skor[oyuncu]=
  e.target.value;

 yzToplamGoster();

 if(
  oyun===
  yzAktifOyun-1
 ){

  yzTumSkorlarGirildi();

 }

}


function yzTumSkorlarGirildi(){

 let oyun=
  yzOyunlar[
   yzAktifOyun-1
  ];

 if(oyun.basladi)
  return;

 let tamam=
  oyun.skor.every(
   s=>
    s!=="" &&
    s!==null &&
    s!==undefined
  );

 if(!tamam)
  return;

 oyun.basladi=true;

 yzKilitZamani=
  Date.now()+60000;

 document.getElementById(
  "yzDurum"
 ).textContent=
  "⏱️ Tüm skorlar girildi. 60 saniye sonra kilitlenecek.";

 if(yzTimer)
  clearInterval(yzTimer);

 yzTimer=
  setInterval(
   yzSureKontrol,
   1000
  );

 yzSureKontrol();

}


function yzSureKontrol(){

 let kalan=
  yzKilitZamani-Date.now();

 if(kalan<=0){

  clearInterval(yzTimer);

  yzOyunKilitle();

  return;

 }

 document.getElementById(
  "yzDurum"
 ).textContent=
  "⏱️ Skorlar "+
  Math.ceil(kalan/1000)+
  " saniye sonra kilitlenecek.";

}


function yzOyunKilitle(){

 let oyun=
  yzOyunlar[
   yzAktifOyun-1
  ];

 oyun.kilitli=true;
 oyun.basladi=false;

 yzKilitZamani=null;

 if(
  yzAktifOyun<
  yzOyunSayisi
 ){

  document.getElementById(
   "yzDurum"
  ).textContent=
   "🔒 Oyun kilitlendi.";

  yzAktifOyun++;

  setTimeout(()=>{

   yzTabloOlustur();

   yzToplamGoster();

   document.getElementById(
    "yzDurum"
   ).textContent=
    "▶ "+yzAktifOyun+
    ". oyun aktif.";

  },700);

 }else{

  yzTabloOlustur();

  yzToplamGoster();

  document.getElementById(
   "yzDurum"
  ).textContent=
   "🏆 Tüm oyunlar tamamlandı.";

 }

}


function yzToplamGoster(){

 let alan=
  document.getElementById(
   "yzToplam"
  );

 alan.innerHTML="";

 for(
  let p=0;
  p<yzOyuncuSayisi;
  p++
 ){

  let toplam=0;

  yzOyunlar.forEach(
   oyun=>{

    let s=
     parseFloat(
      oyun.skor[p]
     );

    if(!isNaN(s))
     toplam+=s;

   }
  );

  alan.innerHTML+=`
   <div>
    ${p+1}. Oyuncu<br>
    <b>${toplam}</b>
   </div>
  `;

 }

}

</script>

</body>
</html>
