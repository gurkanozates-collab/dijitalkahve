<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dijital Kahvehane</title>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f1ed;
    color:#33251f;
    padding-bottom:90px;
}

/* HEADER */

.header{
    background:linear-gradient(135deg,#3e2723,#6d4c41);
    color:white;
    padding:24px 18px;
    text-align:center;
    border-radius:0 0 22px 22px;
    box-shadow:0 4px 15px rgba(0,0,0,.15);
}

.header h2{
    margin:0;
    font-size:23px;
    letter-spacing:.5px;
}

.header small{
    display:block;
    margin-top:7px;
    opacity:.85;
    font-size:14px;
}

/* NAV */

.nav-btns{
    display:flex;
    gap:8px;
    padding:14px 12px;
    position:sticky;
    top:0;
    z-index:10;
    background:#f5f1ed;
}

.nav-btns button{
    flex:1;
    border:none;
    padding:13px 5px;
    border-radius:12px;
    background:#e5ddd7;
    color:#5d4037;
    font-weight:bold;
    font-size:13px;
    cursor:pointer;
    transition:.2s;
}

.nav-btns button.active{
    background:#5d4037;
    color:white;
    box-shadow:0 3px 8px rgba(93,64,55,.25);
}

/* PAGES */

.page{
    display:none;
    padding:0 12px;
}

.page.active{
    display:block;
}

/* CATEGORY */

.kategori-baslik{
    color:#5d4037;
    font-size:18px;
    margin:18px 2px 10px;
    display:flex;
    align-items:center;
    gap:7px;
}

.kategori-baslik:first-child{
    margin-top:4px;
}

/* PRODUCT CARD */

.card{
    background:white;
    padding:15px;
    margin-bottom:9px;
    border-radius:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 2px 8px rgba(0,0,0,.07);
    border:1px solid #eee7e2;
}

.card-info strong{
    font-size:16px;
    color:#382820;
}

.card-info small{
    display:block;
    margin-top:5px;
    color:#8a756b;
}

/* QUANTITY */

.qty-box{
    display:flex;
    align-items:center;
    gap:9px;
}

.qty-box button{
    width:35px;
    height:35px;
    border:none;
    border-radius:50%;
    background:#5d4037;
    color:white;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
}

.qty-box span{
    min-width:22px;
    text-align:center;
    font-weight:bold;
    font-size:16px;
}

/* GARSON */

.btn-red{
    background:linear-gradient(135deg,#c62828,#e53935);
    color:white;
    border:none;
    width:100%;
    padding:17px;
    border-radius:14px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    margin-top:15px;
    box-shadow:0 4px 12px rgba(198,40,40,.25);
}

.btn-red:disabled{
    background:#999;
    box-shadow:none;
}

/* CART */

.sepet-bar{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:50;
    background:#29201c;
    color:white;
    padding:13px 15px;
    display:none;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 -4px 15px rgba(0,0,0,.25);
}

.sepet-bar span{
    font-size:17px;
    font-weight:bold;
}

.sepet-bar button{
    background:#43a047;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    font-weight:bold;
    font-size:15px;
    cursor:pointer;
}

/* HESAP */

#page-hesap h3,
#page-yazboz h3{
    color:#5d4037;
}

.hesap-card{
    background:white;
    padding:15px;
    margin-bottom:12px;
    border-radius:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.07);
    border-left:6px solid #ff9800;
}

.hesap-card.onayli{
    border-left-color:#43a047;
}

.hesap-baslik{
    display:flex;
    justify-content:space-between;
    gap:10px;
    font-weight:bold;
    margin-bottom:9px;
    color:#5d4037;
}

.siparis-urun-satir{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:7px 0;
    border-bottom:1px dashed #ddd;
    font-size:14px;
}

/* YAZ BOZ */

.mod-btns{
    display:flex;
    gap:8px;
    margin-bottom:14px;
}

.mod-btns button{
    flex:1;
    padding:14px 5px;
    border:none;
    border-radius:12px;
    background:#e7dfd9;
    color:#5d4037;
    font-weight:bold;
    font-size:14px;
    cursor:pointer;
}

.mod-btns button.active{
    background:#5d4037;
    color:white;
}

.setup-card{
    background:white;
    padding:18px;
    border-radius:16px;
    box-shadow:0 2px 10px rgba(0,0,0,.07);
}

.setup-card h3{
    margin-top:0;
}

.setup-card label{
    display:block;
    margin-top:5px;
}

.setup-card input,
.setup-card select{
    width:100%;
    padding:13px;
    margin:8px 0 14px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
    background:white;
}

.yazboz-btn{
    width:100%;
    padding:13px;
    border:none;
    border-radius:11px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    margin-top:7px;
}

.yazboz-btn.green{
    background:#388e3c;
    color:white;
}

.yazboz-btn.brown{
    background:#5d4037;
    color:white;
}

.yazboz-btn.red{
    background:#d32f2f;
    color:white;
}

/* SCORE TABLE */

.yazboz-table{
    width:100%;
    border-collapse:collapse;
    background:white;
    margin-top:8px;
    min-width:500px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.yazboz-table th,
.yazboz-table td{
    border:1px solid #ddd;
    padding:8px;
    text-align:center;
}

.yazboz-table th{
    background:#5d4037;
    color:white;
}

.yazboz-table input{
    width:90%;
    text-align:center;
    border:none;
    outline:none;
    font-size:15px;
    background:transparent;
}

.yazboz-table th input{
    color:white;
}

.fark-row td{
    font-weight:bold;
    color:#d32f2f;
    background:#fbe9e7;
}

/* EMPTY */

.empty{
    text-align:center;
    color:#888;
    padding:25px 10px;
}

/* MOBILE */

@media(max-width:500px){

    .header h2{
        font-size:20px;
    }

    .nav-btns button{
        font-size:12px;
    }

    .card{
        padding:13px;
    }

    .qty-box{
        gap:6px;
    }

    .qty-box button{
        width:32px;
        height:32px;
    }

}

</style>
</head>

<body>

<!-- HEADER -->

<div class="header">

    <h2>☕ DİJİTAL KAHVEHANE</h2>

    <small id="masaEtiket">
        MASA BELİRTİLMEDİ
    </small>

</div>


<!-- NAV -->

<div class="nav-btns">

    <button
        onclick="sayfaAc('menu')"
        class="active"
        id="btn-menu">
        ☕ Menü
    </button>

    <button
        onclick="sayfaAc('hesap')"
        id="btn-hesap">
        🧾 Hesap
    </button>

    <button
        onclick="sayfaAc('yazboz')"
        id="btn-yazboz">
        📝 Yaz-Boz
    </button>

</div>


<!-- ================= MENU ================= -->

<div
    id="page-menu"
    class="page active">

    <div id="urunListesi">
        Menü Yükleniyor...
    </div>

    <button
        class="btn-red"
        id="garsonBtn"
        onclick="garsonCagir()">

        🔔 GARSON / OCAKÇI ÇAĞIR

    </button>

</div>


<!-- ================= HESAP ================= -->

<div
    id="page-hesap"
    class="page">

    <h3>🧾 Masa Hesabı</h3>

    <div id="hesapListesi">
        Yükleniyor...
    </div>

    <div
        id="hesapGenelToplam"
        style="
            text-align:right;
            font-weight:bold;
            font-size:19px;
            margin-top:12px;
            color:#3e2723;
        ">
    </div>

</div>


<!-- ================= YAZ BOZ ================= -->

<div
    id="page-yazboz"
    class="page">

    <h3>📝 Dijital Yaz-Boz</h3>

    <div class="mod-btns">

        <button
            onclick="modSec('tekli')"
            id="mod-tekli"
            class="active">

            👤 Tekli Oyun

        </button>

        <button
            onclick="modSec('esli')"
            id="mod-esli">

            👥 Eşli Oyun

        </button>

    </div>

    <div id="yazbozAlan"></div>

</div>


<!-- ================= SEPET ================= -->

<div
    class="sepet-bar"
    id="sepetBar">

    <span id="sepetToplam">
        0 TL
    </span>

    <button onclick="siparisVer()">
        Sipariş Ver
    </button>

</div>


<script>

/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {

    databaseURL:
        "https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
        "dijitalkahve-67f0a",

    storageBucket:
        "dijitalkahve-67f0a.appspot.com",

    messagingSenderId:
        "326476599239"

};


if(!firebase.apps.length){

    firebase.initializeApp(firebaseConfig);

}


const db =
    firebase
    .app()
    .database(
        "https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app"
    );


/* =====================================================
   MASA
===================================================== */

const urlParams =
    new URLSearchParams(
        window.location.search
    );

const masa =
    urlParams.get('masa') || '1';


document.getElementById(
    'masaEtiket'
).innerText =
    "MASA " + masa;


/* =====================================================
   MENÜ
===================================================== */

let urunlerData = {};

let sepet = {};


db.ref('urunler').on(
    'value',
    snapshot => {

        urunlerData =
            snapshot.val() || {};

        renderMenu();

    }
);


const kategoriIkon = {

    'Sıcak İçecekler':'☕',

    'Soğuk İçecekler':'🧊',

    'Tatlılar':'🍰',

    'Atıştırmalıklar':'🥪',

    'Diğer':'🍹'

};


const kategoriSirasi = [

    'Sıcak İçecekler',

    'Soğuk İçecekler',

    'Tatlılar',

    'Atıştırmalıklar',

    'Diğer'

];


function renderMenu(){

    const menuList =
        document.getElementById(
            'urunListesi'
        );

    menuList.innerHTML = '';


    const keys =
        Object.keys(
            urunlerData
        );


    if(keys.length === 0){

        menuList.innerHTML =
            '<div class="empty">Henüz ürün eklenmemiş.</div>';

        return;

    }


    const gruplar = {};


    keys.forEach(key => {

        const kat =
            urunlerData[key].kategori
            || 'Diğer';


        if(!gruplar[kat])
            gruplar[kat] = [];


        gruplar[kat].push(key);

    });


    const siraliKategoriler = [

        ...kategoriSirasi.filter(
            k => gruplar[k]
        ),

        ...Object.keys(gruplar)
            .filter(
                k =>
                    !kategoriSirasi.includes(k)
            )

    ];


    siraliKategoriler.forEach(kat => {

        let html = `

            <h3 class="kategori-baslik">

                ${kategoriIkon[kat] || '🍽️'}

                ${kat}

            </h3>

        `;


        gruplar[kat].forEach(key => {

            const item =
                urunlerData[key];


            const adet =
                sepet[key]
                ? sepet[key].adet
                : 0;


            html += `

                <div class="card">

                    <div class="card-info">

                        <strong>
                            ${item.ad}
                        </strong>

                        <small>
                            ${item.fiyat} TL
                        </small>

                    </div>


                    <div class="qty-box">

                        <button
                            onclick="adetDegistir('${key}',-1)">
                            −
                        </button>

                        <span
                            id="adet-${key}">
                            ${adet}
                        </span>

                        <button
                            onclick="adetDegistir('${key}',1)">
                            +
                        </button>

                    </div>

                </div>

            `;

        });


        menuList.innerHTML += html;

    });

}


/* =====================================================
   SEPET
===================================================== */

function adetDegistir(
    key,
    delta
){

    const item =
        urunlerData[key];


    if(!item)
        return;


    const mevcut =
        sepet[key]
        ? sepet[key].adet
        : 0;


    const yeni =
        Math.max(
            0,
            mevcut + delta
        );


    if(yeni === 0){

        delete sepet[key];

    }else{

        sepet[key] = {

            ad:item.ad,

            fiyat:item.fiyat,

            adet:yeni

        };

    }


    const adetElement =
        document.getElementById(
            `adet-${key}`
        );


    if(adetElement)
        adetElement.innerText =
            yeni;


    sepetGuncelle();

}


function sepetGuncelle(){

    let toplam = 0;


    Object.values(sepet)
        .forEach(i => {

            toplam +=
                (parseFloat(i.fiyat) || 0)
                * i.adet;

        });


    const bar =
        document.getElementById(
            'sepetBar'
        );


    if(toplam > 0){

        bar.style.display =
            'flex';


        document.getElementById(
            'sepetToplam'
        ).innerText =
            toplam + ' TL';

    }else{

        bar.style.display =
            'none';

    }

}


/* =====================================================
   SİPARİŞ VER
===================================================== */

function siparisVer(){

    const kalemler =
        sepet;


    if(
        Object.keys(kalemler)
        .length === 0
    )
        return;


    const toplam =
        Object.values(
            kalemler
        ).reduce(
            (s,i) =>
                s +
                (
                    parseFloat(i.fiyat)
                    || 0
                ) *
                i.adet,
            0
        );


    const saat =
        new Date()
        .toLocaleTimeString(
            'tr-TR',
            {
                hour:'2-digit',
                minute:'2-digit'
            }
        );


    db.ref('siparisler')
        .push({

            masa:masa,

            urunler:kalemler,

            toplam:toplam,

            zaman:saat,

            durum:'bekliyor'

        })

        .then(() => {

            alert(
                '✅ Siparişiniz alındı!'
            );


            sepet = {};


            renderMenu();

            sepetGuncelle();

        })

        .catch(err => {

            alert(
                'Hata Oluştu: '
                + err.message
            );

        });

}


/* =====================================================
   HESAP
===================================================== */

db.ref('siparisler')
    .orderByChild('masa')
    .equalTo(masa)
    .on(
        'value',
        snapshot => {

            renderHesap(
                snapshot.val()
            );

        }
    );


function renderHesap(data){

    const container =
        document.getElementById(
            'hesapListesi'
        );


    container.innerHTML = '';


    let genelToplam = 0;


    if(!data){

        container.innerHTML =
            '<div class="empty">Henüz sipariş verilmedi.</div>';


        document.getElementById(
            'hesapGenelToplam'
        ).innerText = '';


        return;

    }


    Object.keys(data)
        .forEach(orderKey => {

            const siparis =
                data[orderKey];


            const urunler =
                siparis.urunler || {};


            const onaylandi =
                siparis.durum ===
                'onaylandi';


            let urunHtml = '';

            let orderToplam = 0;


            Object.keys(urunler)
                .forEach(pKey => {

                    const u =
                        urunler[pKey];


                    const tutar =
                        (
                            parseFloat(
                                u.fiyat
                            ) || 0
                        ) *
                        u.adet;


                    orderToplam +=
                        tutar;


                    if(onaylandi){

                        urunHtml += `

                            <div class="siparis-urun-satir">

                                <span>
                                    ${u.ad}
                                    x${u.adet}
                                </span>

                                <span>
                                    ${tutar} TL
                                </span>

                            </div>

                        `;

                    }else{

                        urunHtml += `

                            <div class="siparis-urun-satir">

                                <span>
                                    ${u.ad}
                                </span>


                                <div class="qty-box">

                                    <button
                                        onclick="
                                        siparisAdetDegistir(
                                            '${orderKey}',
                                            '${pKey}',
                                            -1
                                        )">
                                        −
                                    </button>


                                    <span>
                                        ${u.adet}
                                    </span>


                                    <button
                                        onclick="
                                        siparisAdetDegistir(
                                            '${orderKey}',
                                            '${pKey}',
                                            1
                                        )">
                                        +
                                    </button>

                                </div>


                                <span>
                                    ${tutar} TL
                                </span>

                            </div>

                        `;

                    }

                });


            genelToplam +=
                orderToplam;


            container.innerHTML += `

                <div class="
                    hesap-card
                    ${onaylandi
                        ? 'onayli'
                        : ''}
                ">

                    <div class="hesap-baslik">

                        <span>

                            ${
                                onaylandi
                                ? '✅ Onaylandı'
                                : '⏳ Bekliyor'
                            }

                            <br>

                            <small>
                                Saat
                                ${siparis.zaman}
                            </small>

                        </span>

                        <span>
                            ${orderToplam} TL
                        </span>

                    </div>


                    ${urunHtml}

                </div>

            `;

        });


    document.getElementById(
        'hesapGenelToplam'
    ).innerText =
        'GENEL TOPLAM: '
        + genelToplam
        + ' TL';

}


/* =====================================================
   SİPARİŞ ADET DEĞİŞTİR
===================================================== */

function siparisAdetDegistir(
    orderKey,
    productKey,
    delta
){

    const ref =
        db.ref(
            'siparisler/'
            + orderKey
            + '/urunler/'
            + productKey
        );


    ref.once('value')
        .then(snap => {

            const u =
                snap.val();


            if(!u)
                return;


            const yeniAdet =
                Math.max(
                    0,
                    u.adet + delta
                );


            if(yeniAdet === 0){

                ref.remove()
                    .then(
                        () =>
                            siparisToplamGuncelle(
                                orderKey
                            )
                    );

            }else{

                ref.update({
                    adet:yeniAdet
                })
                .then(
                    () =>
                        siparisToplamGuncelle(
                            orderKey
                        )
                );

            }

        });

}


function siparisToplamGuncelle(
    orderKey
){

    db.ref(
        'siparisler/'
        + orderKey
        + '/urunler'
    )
    .once('value')
    .then(snap => {

        const urunler =
            snap.val() || {};


        if(
            Object.keys(urunler)
            .length === 0
        ){

            db.ref(
                'siparisler/'
                + orderKey
            ).remove();

            return;

        }


        let toplam = 0;


        Object.values(urunler)
            .forEach(u => {

                toplam +=
                    (
                        parseFloat(
                            u.fiyat
                        ) || 0
                    ) *
                    u.adet;

            });


        db.ref(
            'siparisler/'
            + orderKey
            + '/toplam'
        ).set(toplam);

    });

}


/* =====================================================
   GARSON ÇAĞIR
===================================================== */

let cagriBekleniyor = false;


db.ref('bildirimler')
    .orderByChild('masa')
    .equalTo(masa)
    .on(
        'value',
        snapshot => {

            cagriBekleniyor =
                snapshot.exists();


            const btn =
                document.getElementById(
                    'garsonBtn'
                );


            if(cagriBekleniyor){

                btn.disabled =
                    true;

                btn.innerText =
                    '⏳ GARSON ÇAĞRILDI, BEKLENİYOR...';

            }else{

                btn.disabled =
                    false;

                btn.innerText =
                    '🔔 GARSON / OCAKÇI ÇAĞIR';

            }

        }
    );


function garsonCagir(){

    if(cagriBekleniyor)
        return;


    const saat =
        new Date()
        .toLocaleTimeString(
            'tr-TR',
            {
                hour:'2-digit',
                minute:'2-digit'
            }
        );


    db.ref('bildirimler')
        .push({

            masa:masa,

            zaman:saat

        })

        .catch(err => {

            alert(
                'Hata Oluştu: '
                + err.message
            );

        });

}


/* =====================================================
   SAYFA DEĞİŞTİR
===================================================== */

function sayfaAc(sayfa){

    document
        .querySelectorAll('.page')
        .forEach(el =>
            el.classList.remove(
                'active'
            )
        );


    document
        .querySelectorAll(
            '.nav-btns button'
        )
        .forEach(el =>
            el.classList.remove(
                'active'
            )
        );


    document
        .getElementById(
            'page-' + sayfa
        )
        .classList.add(
            'active'
        );


    document
        .getElementById(
            'btn-' + sayfa
        )
        .classList.add(
            'active'
        );

}


/* =====================================================
   YAZ-BOZ
===================================================== */

let mod = 'tekli';

let playerCount = 4;

let elSayisi = 0;


/* OYUN TÜRÜ */

function modSec(secilen){

    mod = secilen;


    document
        .getElementById(
            'mod-tekli'
        )
        .classList.toggle(
            'active',
            secilen === 'tekli'
        );


    document
        .getElementById(
            'mod-esli'
        )
        .classList.toggle(
            'active',
            secilen === 'esli'
        );


    renderKurulum();

}


/* KURULUM */

function renderKurulum(){

    let oyuncuSecim = '';


    if(mod === 'tekli'){

        oyuncuSecim = `

            <label>
                👤 Kaç Oyuncu?
            </label>

            <select
                id="oyuncuSayisi">

                <option value="2">
                    2 Oyuncu
                </option>

                <option value="3">
                    3 Oyuncu
                </option>

                <option
                    value="4"
                    selected>
                    4 Oyuncu
                </option>

                <option value="5">
                    5 Oyuncu
                </option>

                <option value="6">
                    6 Oyuncu
                </option>

                <option value="7">
                    7 Oyuncu
                </option>

                <option value="8">
                    8 Oyuncu
                </option>

            </select>

        `;

    }else{

        oyuncuSecim = `

            <div style="
                background:#f5efeb;
                padding:13px;
                border-radius:10px;
                margin-bottom:15px;
                color:#5d3828;
            ">

                👥 <strong>Eşli Oyun</strong>

                <br>

                <small>
                    2 takım halinde oynanacaktır.
                </small>

            </div>

        `;

    }


    document.getElementById(
        'yazbozAlan'
    ).innerHTML = `

        <div class="setup-card">

            <h3>
                🎮 Yeni Oyun
            </h3>

            ${oyuncuSecim}


            <label>
                📝 Kaç El Oynanacak?
            </label>

            <input
                type="number"
                id="elSayisiInput"
                min="1"
                value="8"
                placeholder="El sayısı"
            >


            <button
                class="yazboz-btn green"
                onclick="oyunuBaslat()">

                ▶️ Oyunu Başlat

            </button>

        </div>

    `;

}


/* OYUN BAŞLAT */

function oyunuBaslat(){

    const deger =
        parseInt(
            document.getElementById(
                'elSayisiInput'
            ).value
        );


    elSayisi =
        deger > 0
        ? deger
        : 1;


    if(mod === 'tekli'){

        playerCount =
            parseInt(
                document.getElementById(
                    'oyuncuSayisi'
                ).value
            );

    }else{

        playerCount = 2;

    }


    renderYazbozTable();

}


/* TABLO */

function renderYazbozTable(){

    let isimler;


    if(mod === 'esli'){

        isimler = [
            'Takım 1',
            'Takım 2'
        ];

    }else{

        isimler = [];

        for(
            let i = 1;
            i <= playerCount;
            i++
        ){

            isimler.push(
                'Oyuncu ' + i
            );

        }

    }


    let headHtml = '';

    let totHtml = '';

    let farkHtml = '';


    for(
        let i = 0;
        i < playerCount;
        i++
    ){

        headHtml += `

            <th>

                <input
                    type="text"
                    value="${isimler[i]}"
                >

            </th>

        `;


        totHtml += `

            <td id="tot${i+1}">
                0
            </td>

        `;


        farkHtml += `

            <td id="fark${i+1}">
                -
            </td>

        `;

    }


    document.getElementById(
        'yazbozAlan'
    ).innerHTML = `

        <div
            id="elDurumu"
            style="
                text-align:center;
                font-weight:bold;
                margin-bottom:10px;
            ">
        </div>


        <div style="overflow-x:auto;">

            <table
                class="yazboz-table">

                <thead>

                    <tr>
                        ${headHtml}
                    </tr>

                </thead>


                <tbody
                    id="yazbozBody">
                </tbody>


                <tfoot>

                    <tr>
                        ${totHtml}
                    </tr>

                    <tr class="fark-row">
                        ${farkHtml}
                    </tr>

                </tfoot>

            </table>

        </div>


        <small style="
            color:#88766d;
            display:block;
            margin-top:8px;
        ">
            Alt satır: en düşük skora göre fark
        </small>


        <button
            class="yazboz-btn brown"
            onclick="satirEkle()">

            + El Ekle

        </button>


        <button
            class="yazboz-btn red"
            onclick="renderKurulum()">

            🔄 Yeni Oyun

        </button>

    `;


    for(
        let i = 0;
        i < elSayisi;
        i++
    ){

        satirEkle();

    }


    elDurumGuncelle();

}


/* EL EKLE */

function satirEkle(){

    const tbody =
        document.getElementById(
            'yazbozBody'
        );


    const mevcutEl =
        tbody.querySelectorAll(
            'tr'
        ).length;


    if(mevcutEl >= elSayisi){

        if(
            !confirm(
                'Belirlenen '
                + elSayisi
                + ' el tamamlandı. Yeni el eklemek istiyor musun?'
            )
        )
            return;

    }


    const tr =
        document.createElement(
            'tr'
        );


    for(
        let i = 0;
        i < playerCount;
        i++
    ){

        tr.innerHTML += `

            <td>

                <input
                    type="number"
                    onchange="toplamHesapla()"
                    value="0"
                >

            </td>

        `;

    }


    tbody.appendChild(tr);

    elDurumGuncelle();

}


/* EL DURUMU */

function elDurumGuncelle(){

    const mevcutEl =
        document.querySelectorAll(
            '#yazbozBody tr'
        ).length;


    const durum =
        document.getElementById(
            'elDurumu'
        );


    if(!durum)
        return;


    if(mevcutEl >= elSayisi){

        durum.innerText =
            '✅ Oyun Tamamlandı ('
            + elSayisi
            + ' el)';

        durum.style.color =
            '#2e7d32';

    }else{

        durum.innerText =
            'El '
            + mevcutEl
            + ' / '
            + elSayisi;

        durum.style.color =
            '#5d3828';

    }

}


/* TOPLAM */

function toplamHesapla(){

    let totals =
        new Array(
            playerCount
        ).fill(0);


    document
        .querySelectorAll(
            '#yazbozBody tr'
        )
        .forEach(row => {

            row
                .querySelectorAll(
                    'input'
                )
                .forEach(
                    (input,index) => {

                        totals[index] +=
                            parseInt(
                                input.value
                            ) || 0;

                    }
                );

        });


    const minTotal =
        Math.min(...totals);


    for(
        let i = 0;
        i < playerCount;
        i++
    ){

        document.getElementById(
            `tot${i+1}`
        ).innerText =
            totals[i];


        const fark =
            totals[i] - minTotal;


        document.getElementById(
            `fark${i+1}`
        ).innerText =
            fark === 0
            ? 'ÖNDE'
            : '+' + fark;

    }


    elDurumGuncelle();

}


/* BAŞLANGIÇ */

renderKurulum();

</script>

</body>
</html>
