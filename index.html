<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dijital Kahve</title>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f6f3f0;
    color:#35231d;
    font-family:Arial,Helvetica,sans-serif;
}

.top{
    position:sticky;
    top:0;
    z-index:10;
    background:linear-gradient(135deg,#3e2723,#795548);
    color:white;
    padding:15px;
    box-shadow:0 3px 15px rgba(0,0,0,.2);
}

.top h2{
    margin:0 0 4px;
}

.top small{
    opacity:.85;
}

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:11px;
}

.actions button{
    border:0;
    border-radius:10px;
    padding:13px 8px;
    font-weight:bold;
    cursor:pointer;
}

.actions button:first-child{
    background:#ffb300;
    color:#222;
}

.actions button:last-child{
    background:white;
    color:#5d4037;
}

.wrap{
    max-width:850px;
    margin:auto;
    padding:12px;
}

.masa-badge{
    display:inline-block;
    background:#fff3cd;
    color:#5d4037;
    padding:7px 12px;
    border-radius:20px;
    margin:10px 0;
    font-weight:bold;
}

.tabs{
    display:flex;
    gap:7px;
    margin:8px 0 12px;
}

.tab{
    flex:1;
    border:0;
    border-radius:10px;
    padding:12px 5px;
    background:white;
    color:#5d4037;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.tab.active{
    background:#5d4037;
    color:white;
}

.box{
    background:white;
    border-radius:14px;
    padding:15px;
    margin:10px 0;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.kategori{
    margin:18px 0 8px;
    font-size:18px;
    font-weight:bold;
    color:#4e342e;
}

.urun{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:13px 0;
    border-bottom:1px solid #eee;
}

.urun:last-child{
    border-bottom:0;
}

.urun-ad{
    font-weight:bold;
}

.urun-fiyat{
    color:#795548;
    font-size:13px;
    margin-top:3px;
}

.btn-ekle{
    border:0;
    background:#5d4037;
    color:white;
    padding:9px 13px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.sepet-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    padding:10px 0;
    border-bottom:1px dashed #ddd;
}

.miktar{
    display:flex;
    align-items:center;
    gap:6px;
}

.miktar button{
    width:29px;
    height:29px;
    border:0;
    border-radius:50%;
    background:#ddd;
    cursor:pointer;
    font-size:17px;
}

.toplam{
    text-align:right;
    font-size:21px;
    font-weight:bold;
    color:#e65100;
    margin-top:13px;
}

.btn-gonder{
    width:100%;
    border:0;
    background:#2e7d32;
    color:white;
    padding:14px;
    border-radius:9px;
    font-weight:bold;
    margin-top:12px;
    cursor:pointer;
}

.yazboz{
    width:100%;
    min-height:160px;
    resize:vertical;
    border:1px solid #ddd;
    border-radius:10px;
    padding:12px;
    font-size:15px;
    outline:none;
}

.btn-kaydet{
    width:100%;
    border:0;
    background:#1565c0;
    color:white;
    padding:13px;
    border-radius:9px;
    font-weight:bold;
    margin-top:10px;
}

.empty{
    text-align:center;
    color:#999;
    padding:22px;
}

.bilgi{
    background:#e8f5e9;
    color:#2e7d32;
    border-radius:9px;
    padding:10px;
    font-size:13px;
    margin-bottom:10px;
}

@media(max-width:600px){

    .actions{
        grid-template-columns:1fr 1fr;
    }

    .tab{
        font-size:12px;
    }

    .urun{
        align-items:flex-start;
    }
}
</style>
</head>

<body>

<div class="top">

    <h2>☕ DİJİTAL KAHVE</h2>

    <small id="masaBilgi">
        Masa belirleniyor...
    </small>

    <div class="actions">

        <button onclick="garsonCagir()">
            🔔 GARSON ÇAĞIR
        </button>

        <button onclick="siparisSekmesine()">
            🛒 SİPARİŞ VER
        </button>

    </div>

</div>


<div class="wrap">

    <div id="masaBadge" class="masa-badge">
        Masa...
    </div>


    <div class="tabs">

        <button
            class="tab active"
            onclick="sekmeAc('menu',this)">
            ☕ MENÜ
        </button>

        <button
            class="tab"
            onclick="sekmeAc('hesap',this)">
            🧾 HESABIM
        </button>

        <button
            class="tab"
            onclick="sekmeAc('yazboz',this)">
            ✍️ YAZ-BOZ
        </button>

    </div>


    <!-- MENÜ -->

    <section id="menu">

        <div
            id="menuListesi"
            class="box">

            Yükleniyor...

        </div>

    </section>


    <!-- HESAP -->

    <section
        id="hesap"
        style="display:none;">

        <div class="box">

            <h3>
                🧾 MASA HESABI
            </h3>

            <div
                id="hesapBilgi">
            </div>

            <div
                id="hesapListesi">

                <div class="empty">
                    Henüz onaylanmış sipariş yok.
                </div>

            </div>

            <div
                id="hesapToplam"
                class="toplam">

                0.00 TL

            </div>

        </div>


        <div class="box">

            <h3>
                🛒 Yeni Sipariş
            </h3>

            <div
                id="sepetListesi">

                <div class="empty">
                    Sepet boş.
                </div>

            </div>

            <div
                id="sepetToplam"
                class="toplam">

                0.00 TL

            </div>

            <button
                id="siparisGonderBtn"
                class="btn-gonder"
                onclick="siparisGonder()"
                style="display:none;">

                ✓ SİPARİŞİ GÖNDER

            </button>

        </div>

    </section>


    <!-- YAZ BOZ -->

    <section
        id="yazboz"
        style="display:none;">

        <div class="box">

            <h3>
                ✍️ YAZ-BOZ
            </h3>

            <p style="font-size:13px;color:#888;">
                Masanız için not bırakabilirsiniz.
            </p>

            <textarea
                id="yazbozMetin"
                class="yazboz"
                placeholder="Örneğin: Şekersiz, sütlü, ekstra su...">
            </textarea>

            <button
                class="btn-kaydet"
                onclick="yazbozKaydet()">

                💾 YAZ-BOZU KAYDET

            </button>

        </div>

    </section>

</div>


<script>

/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {

    databaseURL:
    "https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
    "dijitalkahve-67f0a",

    storageBucket:
    "dijitalkahve-67f0a.appspot.com",

    messagingSenderId:
    "326476599239"

};

if(!firebase.apps.length){

    firebase.initializeApp(
        firebaseConfig
    );

}

const db = firebase.database();


/* =====================================================
   QR'DAN MASA NUMARASI
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const masa =
    parseInt(
        params.get("masa")
    );


if(masa >= 1 && masa <= 50){

    document.getElementById(
        "masaBilgi"
    ).innerText =
        "MASA " + masa;

    document.getElementById(
        "masaBadge"
    ).innerText =
        "🪑 MASA " + masa;

}else{

    document.getElementById(
        "masaBilgi"
    ).innerText =
        "Masa numarası bulunamadı.";

    document.getElementById(
        "masaBadge"
    ).innerText =
        "⚠️ QR MASA NUMARASI YOK";

}


/* =====================================================
   SEPET
===================================================== */

let sepet = {};


/* =====================================================
   SEKME
===================================================== */

function sekmeAc(id,button){

    document
    .querySelectorAll(
        "#menu,#hesap,#yazboz"
    )
    .forEach(x=>{

        x.style.display =
            "none";

    });

    document.getElementById(
        id
    ).style.display =
        "block";


    document
    .querySelectorAll(".tab")
    .forEach(x=>{

        x.classList.remove(
            "active"
        );

    });

    button.classList.add(
        "active"
    );


    if(id==="hesap"){

        hesaplariGoster();

        sepetiGoster();

    }

}


function siparisSekmesine(){

    sekmeAc(
        "hesap",
        document.querySelectorAll(".tab")[1]
    );

}


/* =====================================================
   GARSON ÇAĞIR
===================================================== */

function garsonCagir(){

    if(
        !(masa >= 1 && masa <= 50)
    ){

        alert(
            "Masa numarası bulunamadı."
        );

        return;

    }


    db.ref("bildirimler")
    .push({

        masa:masa,

        zaman:
        new Date()
        .toLocaleTimeString(
            "tr-TR"
        ),

        tip:"garson"

    })
    .then(()=>{

        alert(
            "🔔 Garson çağrınız gönderildi."
        );

    });

}


/* =====================================================
   MENÜ
===================================================== */

db.ref("urunler")
.on("value",snapshot=>{

    const data =
        snapshot.val() || {};

    const kategoriler = {};


    Object.values(data)
    .forEach(u=>{

        const kategori =
            u.kategori ||
            "Diğer";


        if(!kategoriler[kategori]){

            kategoriler[kategori]=[];

        }

        kategoriler[kategori]
        .push(u);

    });


    let html="";


    Object.keys(kategoriler)
    .forEach(kategori=>{

        html += `

            <div class="kategori">
                ${kategori}
            </div>

        `;


        kategoriler[kategori]
        .forEach(u=>{

            const id =
                encodeURIComponent(
                    u.ad
                );


            html += `

                <div class="urun">

                    <div>

                        <div class="urun-ad">
                            ${u.ad}
                        </div>

                        <div class="urun-fiyat">
                            ${Number(u.fiyat).toFixed(2)}
                            TL
                        </div>

                    </div>


                    <button
                        class="btn-ekle"
                        onclick='sepeteEkle(
                            ${JSON.stringify(id)},
                            ${JSON.stringify(u.ad)},
                            ${Number(u.fiyat)}
                        )'>

                        + EKLE

                    </button>

                </div>

            `;

        });

    });


    document.getElementById(
        "menuListesi"
    ).innerHTML =
        html ||
        `
        <div class="empty">
            Henüz menü oluşturulmamış.
        </div>
        `;

});


/* =====================================================
   SEPETE EKLE
===================================================== */

function sepeteEkle(
    id,
    ad,
    fiyat
){

    if(!sepet[id]){

        sepet[id]={

            ad:ad,

            fiyat:fiyat,

            adet:0

        };

    }


    sepet[id].adet++;

    sepetiGoster();

}


/* =====================================================
   SEPET GÖSTER
===================================================== */

function sepetiGoster(){

    const liste =
        document.getElementById(
            "sepetListesi"
        );

    let html="";

    let toplam=0;


    Object.entries(sepet)
    .forEach(([id,u])=>{

        const tutar =
            u.adet * u.fiyat;

        toplam += tutar;


        html += `

            <div class="sepet-row">

                <span>

                    <b>${u.ad}</b>

                    <br>

                    ${u.adet} adet

                </span>


                <span class="miktar">

                    <button
                        onclick="adetAzalt(
                            ${JSON.stringify(id)}
                        )">

                        −

                    </button>

                    <b>
                        ${u.adet}
                    </b>

                    <button
                        onclick="adetArtir(
                            ${JSON.stringify(id)}
                        )">

                        +

                    </button>

                    <span>

                        ${tutar.toFixed(2)}
                        TL

                    </span>

                </span>

            </div>

        `;

    });


    liste.innerHTML =
        html ||
        `
        <div class="empty">
            Sepet boş.
        </div>
        `;


    document.getElementById(
        "sepetToplam"
    ).innerText =
        toplam.toFixed(2)
        + " TL";


    document.getElementById(
        "siparisGonderBtn"
    ).style.display =
        Object.keys(sepet).length
        ? "block"
        : "none";

}


/* =====================================================
   ADET
===================================================== */

function adetArtir(id){

    sepet[id].adet++;

    sepetiGoster();

}


function adetAzalt(id){

    sepet[id].adet--;


    if(
        sepet[id].adet <= 0
    ){

        delete sepet[id];

    }


    sepetiGoster();

}


/* =====================================================
   SİPARİŞ GÖNDER
===================================================== */

function siparisGonder(){

    if(
        !(masa >= 1 && masa <= 50)
    ){

        alert(
            "Masa numarası bulunamadı."
        );

        return;

    }


    if(
        !Object.keys(sepet).length
    ){

        alert(
            "Sepet boş."
        );

        return;

    }


    let toplam=0;


    Object.values(sepet)
    .forEach(u=>{

        toplam +=
            u.adet * u.fiyat;

    });


    db.ref("siparisler")
    .push({

        masa:masa,

        urunler:sepet,

        toplam:toplam,

        zaman:
        new Date()
        .toLocaleTimeString(
            "tr-TR"
        ),

        durum:"bekliyor"

    })
    .then(()=>{

        sepet={};

        sepetiGoster();

        alert(
            "✅ Siparişiniz garsona gönderildi."
        );

    });

}


/* =====================================================
   ONAYLANMIŞ HESAP
===================================================== */

function hesaplariGoster(){

    if(
        !(masa >= 1 && masa <= 50)
    ) return;


    db.ref("siparisler")
    .on("value",snapshot=>{

        const data =
            snapshot.val() || {};

        const urunler={};

        let toplam=0;


        Object.values(data)
        .forEach(siparis=>{

            if(!siparis) return;


            if(
                parseInt(siparis.masa)!==
                masa
            ) return;


            /*
              ÇOK ÖNEMLİ:
              SADECE ONAYLANMIŞ
              SİPARİŞLER HESABA GİRER.
            */

            if(
                siparis.durum!=="onaylandi"
            ) return;


            Object.values(
                siparis.urunler || {}
            )
            .forEach(u=>{

                const key =
                    String(u.ad)
                    .toLowerCase();


                if(!urunler[key]){

                    urunler[key]={

                        ad:u.ad,

                        adet:0,

                        fiyat:
                        parseFloat(u.fiyat)||0

                    };

                }


                urunler[key].adet +=
                    parseInt(u.adet)||0;


                toplam +=
                    (
                        parseFloat(u.fiyat)||0
                    ) *
                    (
                        parseInt(u.adet)||0
                    );

            });

        });


        let html="";


        Object.values(urunler)
        .forEach(u=>{

            html += `

                <div class="sepet-row">

                    <span>
                        ${u.ad}
                        × ${u.adet}
                    </span>

                    <b>
                        ${
                            (
                                u.adet *
                                u.fiyat
                            ).toFixed(2)
                        }
                        TL
                    </b>

                </div>

            `;

        });


        document.getElementById(
            "hesapListesi"
        ).innerHTML =
            html ||
            `
            <div class="empty">
                Henüz garson tarafından
                onaylanmış sipariş yok.
            </div>
            `;


        document.getElementById(
            "hesapToplam"
        ).innerText =
            toplam.toFixed(2)
            + " TL";

    });

}


/* =====================================================
   YAZ-BOZ
===================================================== */

function yazbozKaydet(){

    if(
        !(masa >= 1 && masa <= 50)
    ){

        alert(
            "Masa numarası bulunamadı."
        );

        return;

    }


    const metin =
        document.getElementById(
            "yazbozMetin"
        ).value;


    db.ref(
        "yazboz/"+masa
    )
    .set({

        metin:metin,

        zaman:Date.now()

    })
    .then(()=>{

        alert(
            "✍️ Yaz-boz kaydedildi."
        );

    });

}


if(
    masa >= 1 &&
    masa <= 50
){

    db.ref(
        "yazboz/"+masa
    )
    .on(
        "value",
        snapshot=>{

            const data =
                snapshot.val();

            if(data){

                document.getElementById(
                    "yazbozMetin"
                ).value =
                    data.metin || "";

            }

        }
    );

}


/* =====================================================
   BAŞLANGIÇ
===================================================== */

sepetiGoster();

</script>

</body>
</html>
