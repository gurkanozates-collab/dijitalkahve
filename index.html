<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Dijital Kahvem</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f1ee;
    color:#33231e;
    padding-bottom:80px;
}

header{
    background:#4e342e;
    color:white;
    padding:18px;
    text-align:center;
}

header h1{
    margin:0;
}

header p{
    margin:5px 0 0;
}

.container{
    max-width:900px;
    margin:auto;
    padding:15px;
}


/* =====================================================
   KATEGORİLER
===================================================== */

.kategoriler{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:10px 0;
    position:sticky;
    top:0;
    background:#f4f1ee;
    z-index:10;
}

.kategori-btn{
    flex-shrink:0;
    border:0;
    background:white;
    color:#4e342e;
    padding:11px 16px;
    border-radius:20px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 2px 6px #0001;
}

.kategori-btn.aktif{
    background:#4e342e;
    color:white;
}


/* =====================================================
   ÜRÜNLER
===================================================== */

.urunler{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.urun{
    background:white;
    border-radius:14px;
    padding:15px;
    box-shadow:0 2px 8px #0001;
}

.urun h3{
    margin:0 0 8px;
}

.urun-alt{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.fiyat{
    font-size:18px;
    font-weight:bold;
    color:#2e7d32;
}

.ekle{
    background:#4e342e;
    color:white;
    border:0;
    border-radius:8px;
    padding:9px 14px;
    cursor:pointer;
    font-weight:bold;
}

.bos{
    text-align:center;
    padding:30px;
    color:#777;
}


/* =====================================================
   ALT MENÜ
===================================================== */

.alt-menu{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:white;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    box-shadow:0 -3px 12px #0002;
    z-index:50;
}

.alt-menu button{
    border:0;
    background:white;
    padding:13px 5px;
    font-weight:bold;
    cursor:pointer;
    color:#555;
}

.alt-menu button.aktif{
    color:#4e342e;
}


/* =====================================================
   SEPET
===================================================== */

.sepet{
    background:white;
    border-radius:14px;
    padding:15px;
    margin-top:15px;
    box-shadow:0 2px 8px #0001;
}

.sepet-urun{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #eee;
    padding:10px 0;
}

.kontrol{
    display:flex;
    align-items:center;
    gap:8px;
}

.kontrol button{
    width:30px;
    height:30px;
    border:0;
    border-radius:7px;
    background:#eee;
    font-weight:bold;
    cursor:pointer;
}

.toplam{
    text-align:right;
    font-size:22px;
    font-weight:bold;
    margin-top:15px;
}

.siparis-ver{
    width:100%;
    background:#2e7d32;
    color:white;
    border:0;
    padding:14px;
    border-radius:9px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:12px;
}


/* =====================================================
   YAZ-BOZ
===================================================== */

.yazboz{
    background:white;
    border-radius:14px;
    padding:15px;
    box-shadow:0 2px 8px #0001;
}

.yazboz textarea{
    width:100%;
    min-height:180px;
    border:1px solid #ddd;
    border-radius:10px;
    padding:12px;
    resize:vertical;
}


/* =====================================================
   MOBİL
===================================================== */

@media(max-width:600px){

    .urunler{
        grid-template-columns:1fr;
    }

}
</style>
</head>

<body>

<header>

    <h1>☕ DİJİTAL KAHVEM</h1>

    <p id="masaBilgisi">
        Menü
    </p>

</header>


<div class="container">

    <!-- MENÜ -->

    <section id="menuSayfasi">

        <div
            id="kategoriListesi"
            class="kategoriler">

        </div>


        <div
            id="urunListesi"
            class="urunler">

            <div class="bos">
                Menü yükleniyor...
            </div>

        </div>

    </section>


    <!-- HESAP -->

    <section
        id="hesapSayfasi"
        style="display:none">

        <div class="sepet">

            <h2>🧾 Siparişlerim</h2>

            <div id="sepetListesi">

                <div class="bos">
                    Henüz sipariş yok.
                </div>

            </div>

            <div
                id="sepetToplam"
                class="toplam">

                Toplam: 0 ₺

            </div>

            <button
                class="siparis-ver"
                onclick="siparisGonder()">

                🛎️ Siparişi Garsona Gönder

            </button>

        </div>

    </section>


    <!-- YAZ BOZ -->

    <section
        id="yazbozSayfasi"
        style="display:none">

        <div class="yazboz">

            <h2>📝 Yaz-Boz</h2>

            <textarea
                id="yazbozMetin"
                placeholder="Buraya not alabilirsiniz..."></textarea>

        </div>

    </section>

</div>


<!-- ALT MENÜ -->

<div class="alt-menu">

    <button
        id="menuBtn"
        class="aktif"
        onclick="sayfaAc('menu')">

        ☕ Menü

    </button>

    <button
        id="hesapBtn"
        onclick="sayfaAc('hesap')">

        🧾 Hesap

    </button>

    <button
        id="yazbozBtn"
        onclick="sayfaAc('yazboz')">

        📝 Yaz-Boz

    </button>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getFirestore,
    collection,
    onSnapshot,
    addDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {
    apiKey: "AIzaSyC05yXQzAlF2AYzzeaJrDdMUYKwohKOsWM",
    authDomain: "dijitalkahve-67f0a.firebaseapp.com",
    databaseURL: "https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "dijitalkahve-67f0a",
    storageBucket: "dijitalkahve-67f0a.firebasestorage.app",
    messagingSenderId: "326476599239",
    appId: "1:326476599239:web:143f39583a3478118853e2",
    measurementId: "G-WM65PC4648"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


/* =====================================================
   VERİLER
===================================================== */

let kategoriler=[];
let urunler=[];
let aktifKategori=null;
let sepet=[];


/* =====================================================
   MASA
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const masa =
    params.get("masa");


if(masa){

    document.getElementById(
        "masaBilgisi"
    ).textContent =
        "Masa " + masa;

}


/* =====================================================
   KATEGORİLER
===================================================== */

onSnapshot(
    collection(db,"kategoriler"),
    snap=>{

        kategoriler =
            snap.docs
                .map(
                    x=>({
                        id:x.id,
                        ...x.data()
                    })
                )
                .filter(
                    x=>x.aktif !== false
                )
                .sort(
                    (a,b)=>
                        Number(a.sira || 0) -
                        Number(b.sira || 0)
                );


        kategoriGoster();

    },
    error=>{

        console.error(error);

        document.getElementById(
            "kategoriListesi"
        ).innerHTML=
            `<div class="bos">
                Kategoriler yüklenemedi.
             </div>`;

    }
);


/* =====================================================
   ÜRÜNLER
===================================================== */

onSnapshot(
    collection(db,"urunler"),
    snap=>{

        urunler =
            snap.docs
                .map(
                    x=>({
                        id:x.id,
                        ...x.data()
                    })
                )
                .filter(
                    x=>x.aktif !== false
                )
                .sort(
                    (a,b)=>
                        Number(a.sira || 0) -
                        Number(b.sira || 0)
                );


        if(
            !aktifKategori &&
            kategoriler.length
        ){

            aktifKategori =
                kategoriler[0].id;

        }


        urunleriGoster();

    },
    error=>{

        console.error(error);

    }
);


/* =====================================================
   KATEGORİLERİ GÖSTER
===================================================== */

function kategoriGoster(){

    const alan =
        document.getElementById(
            "kategoriListesi"
        );


    alan.innerHTML="";


    if(!kategoriler.length){

        alan.innerHTML=
            `<div class="bos">
                Henüz menü kategorisi eklenmemiş.
             </div>`;

        document.getElementById(
            "urunListesi"
        ).innerHTML=
            `<div class="bos">
                Menü şu anda hazırlanıyor.
             </div>`;

        return;

    }


    if(
        !aktifKategori ||
        !kategoriler.some(
            k=>k.id===aktifKategori
        )
    ){

        aktifKategori =
            kategoriler[0].id;

    }


    kategoriler.forEach(k=>{

        const button =
            document.createElement("button");

        button.className =
            "kategori-btn" +
            (
                k.id===aktifKategori
                ? " aktif"
                : ""
            );


        button.textContent=k.ad;


        button.onclick=()=>{

            aktifKategori=k.id;

            kategoriGoster();
            urunleriGoster();

        };


        alan.appendChild(button);

    });

}


/* =====================================================
   ÜRÜNLERİ GÖSTER
===================================================== */

function urunleriGoster(){

    const alan =
        document.getElementById(
            "urunListesi"
        );


    alan.innerHTML="";


    if(!aktifKategori){

        alan.innerHTML=
            `<div class="bos">
                Kategori seçin.
             </div>`;

        return;

    }


    const liste =
        urunler.filter(
            u=>
                u.kategoriId===
                aktifKategori
        );


    if(!liste.length){

        const kategori =
            kategoriler.find(
                k=>k.id===aktifKategori
            );


        alan.innerHTML=
            `<div class="bos">
                ${
                    kategori
                    ? escapeHTML(kategori.ad)
                    : "Bu kategori"
                }
                içinde henüz ürün yok.
             </div>`;

        return;

    }


    liste.forEach(u=>{

        const div =
            document.createElement("div");

        div.className="urun";


        div.innerHTML=`

            <h3>
                ${escapeHTML(u.ad)}
            </h3>

            <div class="urun-alt">

                <span class="fiyat">
                    ${para(u.fiyat)}
                </span>

                <button
                    class="ekle"
                    onclick="sepeteEkle('${u.id}')">

                    ➕ Ekle

                </button>

            </div>

        `;


        alan.appendChild(div);

    });

}


/* =====================================================
   SEPETE EKLE
===================================================== */

window.sepeteEkle=function(id){

    const urun =
        urunler.find(
            x=>x.id===id
        );


    if(!urun) return;


    const mevcut =
        sepet.find(
            x=>x.id===id
        );


    if(mevcut){

        mevcut.adet++;

        mevcut.tutar =
            mevcut.adet *
            Number(mevcut.fiyat);

    }
    else{

        sepet.push({

            id:urun.id,
            urun:urun.ad,
            fiyat:Number(urun.fiyat),
            adet:1,
            tutar:Number(urun.fiyat)

        });

    }


    sepetGoster();

    sayfaAc("hesap");

};


/* =====================================================
   ADET ARTIR
===================================================== */

window.adetArtir=function(index){

    if(!sepet[index]) return;

    sepet[index].adet++;

    sepet[index].tutar =
        sepet[index].adet *
        Number(sepet[index].fiyat);

    sepetGoster();

};


/* =====================================================
   ADET AZALT
===================================================== */

window.adetAzalt=function(index){

    if(!sepet[index]) return;


    sepet[index].adet--;


    if(sepet[index].adet<=0){

        sepet.splice(index,1);

    }
    else{

        sepet[index].tutar =
            sepet[index].adet *
            Number(sepet[index].fiyat);

    }


    sepetGoster();

};


/* =====================================================
   SEPET GÖSTER
===================================================== */

function sepetGoster(){

    const alan =
        document.getElementById(
            "sepetListesi"
        );


    alan.innerHTML="";


    if(!sepet.length){

        alan.innerHTML=
            `<div class="bos">
                Henüz ürün eklenmedi.
             </div>`;

        document.getElementById(
            "sepetToplam"
        ).textContent=
            "Toplam: 0 ₺";

        return;

    }


    let toplam=0;


    sepet.forEach((u,index)=>{

        toplam +=
            Number(u.tutar || 0);


        const div =
            document.createElement("div");

        div.className="sepet-urun";


        div.innerHTML=`

            <div>

                <b>
                    ${escapeHTML(u.urun)}
                </b>

                <div>
                    ${para(u.tutar)}
                </div>

            </div>


            <div class="kontrol">

                <button
                    onclick="adetAzalt(${index})">

                    −

                </button>

                <b>${u.adet}</b>

                <button
                    onclick="adetArtir(${index})">

                    +

                </button>

            </div>

        `;


        alan.appendChild(div);

    });


    document.getElementById(
        "sepetToplam"
    ).textContent =
        "Toplam: " +
        para(toplam);

}


/* =====================================================
   SİPARİŞ GÖNDER
===================================================== */

window.siparisGonder=async function(){

    if(!sepet.length){

        alert("Sepet boş.");
        return;

    }


    if(!masa){

        alert(
            "Masa bilgisi bulunamadı."
        );

        return;

    }


    const toplam =
        sepet.reduce(
            (a,u)=>
                a +
                Number(u.tutar || 0),
            0
        );


    try{

        await addDoc(
            collection(
                db,
                "siparisler"
            ),
            {

                masa:Number(masa),

                /*
                   Garson panelindeki sistemle
                   uyumlu olması için.
                */

                oturumId:null,

                urunler:sepet.map(
                    u=>({
                        urun:u.urun,
                        fiyat:Number(u.fiyat),
                        adet:Number(u.adet),
                        tutar:Number(u.tutar)
                    })
                ),

                toplam:toplam,

                durum:"Bekleyen",

                kaynak:"musteri",

                garsonSiparisi:false,

                olusturmaZamani:
                    serverTimestamp()

            }
        );


        alert(
            "✅ Siparişiniz garsona gönderildi."
        );


        sepet=[];

        sepetGoster();

        sayfaAc("menu");

    }
    catch(e){

        alert(
            "❌ Sipariş gönderilemedi:\n" +
            e.message
        );

    }

};


/* =====================================================
   SAYFA DEĞİŞTİR
===================================================== */

window.sayfaAc=function(sayfa){

    document.getElementById(
        "menuSayfasi"
    ).style.display =
        sayfa==="menu"
        ? "block"
        : "none";


    document.getElementById(
        "hesapSayfasi"
    ).style.display =
        sayfa==="hesap"
        ? "block"
        : "none";


    document.getElementById(
        "yazbozSayfasi"
    ).style.display =
        sayfa==="yazboz"
        ? "block"
        : "none";


    document.getElementById(
        "menuBtn"
    ).classList.toggle(
        "aktif",
        sayfa==="menu"
    );


    document.getElementById(
        "hesapBtn"
    ).classList.toggle(
        "aktif",
        sayfa==="hesap"
    );


    document.getElementById(
        "yazbozBtn"
    ).classList.toggle(
        "aktif",
        sayfa==="yazboz"
    );

};


/* =====================================================
   PARA
===================================================== */

function para(n){

    return Number(n || 0)
        .toLocaleString("tr-TR") +
        " ₺";

}


/* =====================================================
   HTML GÜVENLİĞİ
===================================================== */

function escapeHTML(str){

    return String(str || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =====================================================
   İLK ÇİZİM
===================================================== */

sepetGoster();

</script>

</body>
</html>
