<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dijital Kahvem - Garson</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f1ee;
    color:#33231e;
}

header{
    background:#4e342e;
    color:#fff;
    padding:18px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:28px;
}

header p{
    margin:6px 0 0;
}

.container{
    max-width:1500px;
    margin:auto;
    padding:15px;
}

.ust-bilgi{
    background:#fff;
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
    box-shadow:0 2px 8px #0001;
}

.masa-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:14px;
}

.masa{
    background:#fff;
    border:2px solid #ddd;
    border-radius:14px;
    padding:15px;
    box-shadow:0 2px 8px #0001;
    transition:.25s;
}

.masa.acik{
    border-color:#2e7d32;
}

.masa.siparis-var{
    grid-column:span 2;
    transform:scale(1.02);
    border-color:#ef6c00;
    box-shadow:0 5px 20px #ef6c0055;
}

.masa.siparis-var .masa-baslik{
    background:#fff3cd;
    margin:-15px -15px 12px;
    padding:12px 15px;
    border-radius:12px 12px 0 0;
}

.masa-baslik{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.masa-baslik h2{
    margin:0;
}

.durum{
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.acik-durum{
    background:#e8f5e9;
    color:#2e7d32;
}

.kapali-durum{
    background:#eee;
    color:#777;
}

.bekleyen-uyari{
    background:#fff3cd;
    color:#795548;
    padding:10px;
    border-radius:8px;
    margin:10px 0;
    font-weight:bold;
}

.masa-toplam{
    font-size:24px;
    font-weight:bold;
    margin:14px 0;
}

.buton{
    width:100%;
    border:0;
    border-radius:9px;
    padding:12px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    margin-top:7px;
}

.ac{
    background:#2e7d32;
    color:#fff;
}

.siparis{
    border:1px solid #ddd;
    border-radius:10px;
    padding:10px;
    margin-top:10px;
}

.siparis.bekleyen{
    border:2px solid #ef6c00;
    background:#fffaf0;
}

.siparis-baslik{
    display:flex;
    justify-content:space-between;
    font-weight:bold;
    margin-bottom:8px;
}

.kaynak{
    display:inline-block;
    padding:5px 8px;
    border-radius:12px;
    font-size:11px;
    font-weight:bold;
    margin-bottom:8px;
}

.musteri{
    background:#e3f2fd;
    color:#1565c0;
}

.garson{
    background:#fff3e0;
    color:#ef6c00;
}

.urun{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:7px 0;
    border-bottom:1px solid #eee;
}

.urun-adi{
    font-weight:bold;
}

.urun-kontrol{
    display:flex;
    align-items:center;
    gap:5px;
}

.urun-kontrol button{
    width:32px;
    height:32px;
    border:0;
    border-radius:7px;
    background:#eee;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.urun-kontrol span{
    min-width:25px;
    text-align:center;
    font-weight:bold;
}

.siparis-toplam{
    text-align:right;
    font-weight:bold;
    font-size:18px;
    margin-top:10px;
}

.siparis-islem{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    margin-top:10px;
}

.onay{
    background:#2e7d32;
    color:white;
}

.iptal{
    background:#ffebee;
    color:#c62828;
}

.masa-ac{
    background:#1565c0;
    color:white;
}

.cagri-alani{
    background:#fff;
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
    box-shadow:0 2px 8px #0001;
}

.cagri{
    border-left:5px solid #ef6c00;
    background:#fffaf0;
    padding:12px;
    border-radius:8px;
    margin-top:8px;
}

.cagri button{
    border:0;
    background:#2e7d32;
    color:white;
    padding:9px 14px;
    border-radius:7px;
    font-weight:bold;
    cursor:pointer;
    margin-top:8px;
}

.bos{
    text-align:center;
    color:#777;
    padding:20px;
}

@media(max-width:1100px){
    .masa-grid{
        grid-template-columns:repeat(3,1fr);
    }

    .masa.siparis-var{
        grid-column:span 2;
    }
}

@media(max-width:700px){
    .masa-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .masa.siparis-var{
        grid-column:span 2;
    }
}

@media(max-width:500px){
    .masa-grid{
        grid-template-columns:1fr;
    }

    .masa.siparis-var{
        grid-column:span 1;
        transform:none;
    }
}
</style>
</head>

<body>

<header>
    <h1>☕ DİJİTAL KAHVEM</h1>
    <p>Garson Paneli</p>
</header>

<div class="container">

    <div class="cagri-alani">
        <h2>🔔 Garson Çağrıları</h2>
        <div id="cagriListesi">
            <div class="bos">Çağrı yok.</div>
        </div>
    </div>

    <div class="ust-bilgi">
        <b>🪑 Masa Yönetimi</b>
        <p>
            Müşteri QR kodu okuttuğunda masa otomatik açılmaz.
            Garson önce <b>Masa Oturumu Aç</b> butonuyla masayı açmalıdır.
        </p>
    </div>

    <div id="masaGrid" class="masa-grid"></div>

</div>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getFirestore,
    collection,
    onSnapshot,
    query,
    where,
    doc,
    getDoc,
    addDoc,
    updateDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {
    apiKey: "AIzaSyC05yXQzAlF2AYzzeaJrDdMUYKwohKOsWM",
    authDomain: "dijitalkahve-67f0a.firebaseapp.com",
    databaseURL: "https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "dijitalkahve-67f0a",
    storageBucket: "dijitalkahve-67f0a.firebasestorage.app",
    messagingSenderId: "326476599239",
    appId: "1:326476599239:web:143f39583a3478118853e2",
    measurementId: "G-WM65PC4648"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


/* =====================================================
   VERİLER
===================================================== */

let oturumlar = [];
let siparisler = [];
let cagrilar = [];


/* =====================================================
   PARA
===================================================== */

function para(n){
    return Number(n || 0).toLocaleString("tr-TR") + " ₺";
}


/* =====================================================
   MASALAR
===================================================== */

function masalariGoster(){

    const grid = document.getElementById("masaGrid");

    grid.innerHTML = "";

    /*
       Sipariş bekleyen masalar en üstte.
       Diğer masalar 1-50 sırasıyla.
    */

    const siraliMasalar = [];

    for(let masa = 1; masa <= 50; masa++){

        const oturum = oturumlar.find(
            o =>
            Number(o.masa) === masa &&
            o.durum === "acik"
        );

        const bekleyenler = oturum
            ? siparisler.filter(
                s =>
                s.oturumId === oturum.id &&
                s.durum === "Bekleyen"
            )
            : [];

        siraliMasalar.push({
            masa,
            oturum,
            bekleyenler
        });
    }


    /*
       Bekleyen sipariş olanlar önce.
    */

    siraliMasalar.sort((a,b)=>{

        const aBek = a.bekleyenler.length > 0;
        const bBek = b.bekleyenler.length > 0;

        if(aBek && !bBek) return -1;
        if(!aBek && bBek) return 1;

        return a.masa - b.masa;

    });


    siraliMasalar.forEach(veri=>{

        const masa = veri.masa;
        const o = veri.oturum;
        const bekleyenler = veri.bekleyenler;


        const onayliSiparisler = o
            ? siparisler.filter(
                s =>
                s.oturumId === o.id &&
                s.durum === "Onaylandı"
            )
            : [];


        const toplam = onayliSiparisler.reduce(
            (a,s)=>a + Number(s.toplam || 0),
            0
        );


        const div = document.createElement("div");

        div.className =
            "masa" +
            (o ? " acik" : "") +
            (bekleyenler.length ? " siparis-var" : "");


        let siparisHTML = "";


        /*
           BEKLEYEN SİPARİŞLER
        */

        bekleyenler.forEach(s=>{

            siparisHTML += siparisKart(s);

        });


        div.innerHTML = `

            <div class="masa-baslik">

                <h2>🪑 Masa ${masa}</h2>

                <span class="durum ${
                    o ? "acik-durum" : "kapali-durum"
                }">

                    ${
                        o
                        ? "🟢 Açık"
                        : "⚪ Kapalı"
                    }

                </span>

            </div>


            ${
                bekleyenler.length
                ?
                `
                <div class="bekleyen-uyari">

                    🟡 ${bekleyenler.length}
                    bekleyen sipariş

                </div>
                `
                :
                ""
            }


            <div class="masa-toplam">

                ${para(toplam)}

            </div>


            ${
                o
                ?
                `
                <div style="font-size:13px;color:#777">

                    Onaylı sipariş:
                    <b>${onayliSiparisler.length}</b>

                </div>
                `
                :
                `
                <div style="color:#777;margin:10px 0">

                    Bu masa aktif değil.

                </div>
                `
            }


            ${siparisHTML}


            ${
                !o
                ?
                `
                <button
                    class="buton masa-ac"
                    onclick="masaOturumuAc(${masa})">

                    🟢 MASA OTURUMU AÇ

                </button>
                `
                :
                ""
            }

        `;

        grid.appendChild(div);

    });

}


/* =====================================================
   SİPARİŞ KARTI
===================================================== */

function siparisKart(s){

    let urunHTML = "";

    (s.urunler || []).forEach((u,index)=>{

        urunHTML += `

            <div class="urun">

                <span class="urun-adi">
                    ${u.urun}
                </span>

                <div class="urun-kontrol">

                    <button
                        onclick="urunAzalt('${s.id}',${index})">
                        −
                    </button>

                    <span>
                        ${u.adet}
                    </span>

                    <button
                        onclick="urunArtir('${s.id}',${index})">
                        +
                    </button>

                </div>

            </div>

        `;

    });


    const garson =
        s.kaynak === "garson" ||
        s.garsonSiparisi === true;


    return `

        <div class="siparis bekleyen">

            <div class="siparis-baslik">

                <span>
                    🛎️ Sipariş
                </span>

                <span>
                    🟡 Bekleyen
                </span>

            </div>


            <span class="kaynak ${
                garson ? "garson" : "musteri"
            }">

                ${
                    garson
                    ? "👨‍🍳 GARSON SİPARİŞİ"
                    : "👤 MÜŞTERİ SİPARİŞİ"
                }

            </span>


            ${urunHTML}


            <div class="siparis-toplam">

                Toplam:
                ${para(s.toplam)}

            </div>


            <div class="siparis-islem">

                <button
                    class="buton onay"
                    onclick="siparisOnayla('${s.id}')">

                    🟢 ONAYLA

                </button>


                <button
                    class="buton iptal"
                    onclick="siparisIptal('${s.id}')">

                    ❌ İPTAL

                </button>

            </div>

        </div>

    `;

}


/* =====================================================
   ÜRÜN ARTIR
===================================================== */

window.urunArtir = async function(id,index){

    const s = siparisler.find(x=>x.id === id);

    if(!s) return;

    const urunler = [...(s.urunler || [])];

    if(!urunler[index]) return;

    urunler[index] = {
        ...urunler[index],
        adet: Number(urunler[index].adet || 0) + 1
    };

    urunler[index].tutar =
        urunler[index].adet *
        Number(urunler[index].fiyat || 0);


    const toplam = urunler.reduce(
        (a,u)=>a + Number(u.tutar || 0),
        0
    );


    try{

        await updateDoc(
            doc(db,"siparisler",id),
            {
                urunler,
                toplam
            }
        );

    }
    catch(e){

        alert("❌ Güncelleme başarısız:\n" + e.message);

    }

};


/* =====================================================
   ÜRÜN AZALT
===================================================== */

window.urunAzalt = async function(id,index){

    const s = siparisler.find(x=>x.id === id);

    if(!s) return;

    const urunler = [...(s.urunler || [])];

    if(!urunler[index]) return;


    const yeniAdet =
        Number(urunler[index].adet || 0) - 1;


    if(yeniAdet <= 0){

        if(
            !confirm(
                urunler[index].urun +
                " siparişten çıkarılsın mı?"
            )
        ){

            return;

        }

        urunler.splice(index,1);

    }
    else{

        urunler[index] = {
            ...urunler[index],
            adet:yeniAdet
        };

        urunler[index].tutar =
            yeniAdet *
            Number(urunler[index].fiyat || 0);

    }


    const toplam = urunler.reduce(
        (a,u)=>a + Number(u.tutar || 0),
        0
    );


    try{

        await updateDoc(
            doc(db,"siparisler",id),
            {
                urunler,
                toplam
            }
        );

    }
    catch(e){

        alert("❌ Güncelleme başarısız:\n" + e.message);

    }

};


/* =====================================================
   MASA OTURUMU AÇ
===================================================== */

window.masaOturumuAc = async function(masa){

    /*
       Önce mevcut açık oturum var mı?
    */

    const mevcut =
        oturumlar.find(
            o =>
            Number(o.masa) === Number(masa) &&
            o.durum === "acik"
        );


    if(mevcut){

        alert(
            "🟢 Masa " +
            masa +
            " zaten açık."
        );

        return;

    }


    if(
        !confirm(
            "Masa " +
            masa +
            " için yeni oturum açılsın mı?"
        )
    ){

        return;

    }


    try{

        await addDoc(
            collection(db,"oturumlar"),
            {
                masa:Number(masa),
                durum:"acik",
                odemeDurumu:"bekliyor",
                acilisZamani:serverTimestamp()
            }
        );


        alert(
            "✅ Masa " +
            masa +
            " oturumu açıldı."
        );

    }
    catch(e){

        alert(
            "❌ Masa açılamadı:\n" +
            e.message
        );

    }

};


/* =====================================================
   SİPARİŞ ONAYLA
===================================================== */

window.siparisOnayla = async function(id){

    try{

        await updateDoc(
            doc(db,"siparisler",id),
            {
                durum:"Onaylandı",
                onaylanmaZamani:serverTimestamp()
            }
        );


        /*
           onSnapshot otomatik olarak çalışacak.
           Bekleyen sipariş kalkacak.
           Masa tekrar normal sıraya dönecek.
        */

    }
    catch(e){

        alert(
            "❌ Sipariş onaylanamadı:\n" +
            e.message
        );

    }

};


/* =====================================================
   SİPARİŞ İPTAL
===================================================== */

window.siparisIptal = async function(id){

    if(
        !confirm(
            "Bu sipariş iptal edilsin mi?"
        )
    ){

        return;

    }


    try{

        await updateDoc(
            doc(db,"siparisler",id),
            {
                durum:"İptal",
                iptalZamani:serverTimestamp()
            }
        );

    }
    catch(e){

        alert(
            "❌ Sipariş iptal edilemedi:\n" +
            e.message
        );

    }

};


/* =====================================================
   GARSON ÇAĞRILARI
===================================================== */

function cagrilariGoster(){

    const alan =
        document.getElementById(
            "cagriListesi"
        );

    alan.innerHTML = "";


    const aktif =
        cagrilar.filter(
            c => c.durum !== "tamamlandi"
        );


    if(!aktif.length){

        alan.innerHTML =
            `<div class="bos">
                🔔 Aktif garson çağrısı yok.
             </div>`;

        return;

    }


    aktif.forEach(c=>{

        const div =
            document.createElement("div");

        div.className = "cagri";


        div.innerHTML = `

            <b>
                🔔 Masa ${c.masa}
            </b>

            <div>
                Müşteri garson çağırdı.
            </div>

            <button
                onclick="cagriTamamla('${c.id}')">

                ✅ Çağrıyı Kapat

            </button>

        `;


        alan.appendChild(div);

    });

}


/* =====================================================
   ÇAĞRI TAMAMLA
===================================================== */

window.cagriTamamla = async function(id){

    try{

        await updateDoc(
            doc(db,"garsonCagrilari",id),
            {
                durum:"tamamlandi",
                tamamlanmaZamani:serverTimestamp()
            }
        );

    }
    catch(e){

        alert(
            "❌ Çağrı kapatılamadı:\n" +
            e.message
        );

    }

};


/* =====================================================
   FIREBASE - OTURUMLAR
===================================================== */

onSnapshot(
    collection(db,"oturumlar"),
    snap=>{

        oturumlar =
            snap.docs.map(
                x=>({
                    id:x.id,
                    ...x.data()
                })
            );

        masalariGoster();

    },
    error=>{

        console.error(
            "OTURUM HATASI",
            error
        );

    }
);


/* =====================================================
   FIREBASE - SİPARİŞLER
===================================================== */

onSnapshot(
    collection(db,"siparisler"),
    snap=>{

        siparisler =
            snap.docs.map(
                x=>({
                    id:x.id,
                    ...x.data()
                })
            );

        masalariGoster();

    },
    error=>{

        console.error(
            "SİPARİŞ HATASI",
            error
        );

    }
);


/* =====================================================
   FIREBASE - GARSON ÇAĞRILARI
===================================================== */

onSnapshot(
    collection(db,"garsonCagrilari"),
    snap=>{

        cagrilar =
            snap.docs.map(
                x=>({
                    id:x.id,
                    ...x.data()
                })
            );

        cagrilariGoster();

    },
    error=>{

        console.error(
            "ÇAĞRI HATASI",
            error
        );

    }
);


/* =====================================================
   İLK ÇİZİM
===================================================== */

masalariGoster();
cagrilariGoster();

</script>

</body>
</html>
