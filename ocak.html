<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dijital Kahvem - Menü</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f1ed;
    color:#33231e;
}

/* HEADER */

header{
    background:#4e342e;
    color:white;
    text-align:center;
    padding:20px 12px;
}

header h1{
    margin:0;
    font-size:30px;
}

header p{
    margin:7px 0 0;
}

/* MASA */

.masa-sec{
    max-width:700px;
    margin:15px auto;
    padding:0 12px;
}

.masa-sec label{
    display:block;
    font-weight:bold;
    margin-bottom:6px;
}

.masa-sec select{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:9px;
    background:white;
    font-size:16px;
}

/* MENÜ */

.container{
    max-width:700px;
    margin:auto;
    padding:0 12px 30px;
}

.menu{
    background:white;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 2px 10px #0001;
}

.menu-baslik{
    padding:16px;
    background:#6d4c41;
    color:white;
}

.menu-baslik h2{
    margin:0;
}

/* ÜRÜN */

.urun{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:15px;
    border-bottom:1px solid #eee;
}

.urun-bilgi{
    flex:1;
}

.urun-ad{
    font-size:19px;
    font-weight:bold;
}

.urun-fiyat{
    color:#777;
    margin-top:4px;
}

/* ADET */

.adet{
    display:flex;
    align-items:center;
    gap:8px;
}

.adet button{
    width:42px;
    height:42px;
    border:0;
    border-radius:9px;
    background:#ddd;
    font-size:25px;
    font-weight:bold;
    cursor:pointer;
}

.adet button:hover{
    background:#c7c7c7;
}

.adet-sayi{
    width:30px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
}

/* ALT */

.alt{
    margin-top:15px;
    background:white;
    padding:15px;
    border-radius:13px;
    box-shadow:0 2px 8px #0001;
}

.toplam{
    display:flex;
    justify-content:space-between;
    font-size:22px;
    font-weight:bold;
    margin-bottom:12px;
}

.gonder{
    width:100%;
    border:0;
    border-radius:10px;
    background:#2e7d32;
    color:white;
    padding:15px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

/* SİPARİŞ GEÇMİŞİ */

.gecmis{
    margin-top:20px;
}

.gecmis-baslik{
    font-size:22px;
    font-weight:bold;
    margin-bottom:10px;
}

.siparis{
    background:white;
    border-radius:12px;
    padding:13px;
    margin-bottom:12px;
    border:1px solid #ddd;
}

/* NORMAL MÜŞTERİ */

.siparis.musteri{
    border-left:5px solid #1565c0;
}

/* GARSON */

.siparis.garson{
    border:2px solid #ef6c00;
    border-left:7px solid #ef6c00;
    background:#fff8ed;
    box-shadow:0 3px 12px #ef6c0025;
}

/* SİPARİŞ BAŞLIK */

.siparis-baslik{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
}

.siparis-no{
    font-weight:bold;
    font-size:16px;
}

/* GARSON ETİKETİ */

.garson-etiket{
    display:block;
    background:#ef6c00;
    color:white;
    padding:9px 11px;
    border-radius:8px;
    font-weight:bold;
    font-size:15px;
    margin-bottom:9px;
    text-align:center;
}

.garson-aciklama{
    background:#fff3cd;
    color:#8a4b00;
    padding:8px;
    border-radius:7px;
    font-size:13px;
    font-weight:bold;
    margin-bottom:10px;
}

/* MÜŞTERİ ETİKETİ */

.musteri-etiket{
    display:block;
    background:#e3f2fd;
    color:#1565c0;
    padding:8px 10px;
    border-radius:8px;
    font-weight:bold;
    font-size:14px;
    margin-bottom:9px;
}

/* SİPARİŞ ÜRÜN */

.siparis-urun{
    display:flex;
    justify-content:space-between;
    padding:7px 0;
    border-bottom:1px solid #eee;
}

.siparis-toplam{
    text-align:right;
    font-size:18px;
    font-weight:bold;
    margin-top:10px;
}

.siparis-durum{
    margin-top:8px;
    color:#ef6c00;
    font-weight:bold;
    font-size:13px;
}

/* BOŞ */

.bos{
    text-align:center;
    color:#888;
    background:white;
    padding:20px;
    border-radius:10px;
}

/* MOBİL */

@media(max-width:500px){

    header h1{
        font-size:25px;
    }

    .urun-ad{
        font-size:17px;
    }

    .urun-fiyat{
        font-size:14px;
    }

}

</style>
</head>

<body>

<header>

    <h1>☕ DİJİTAL KAHVEM</h1>

    <p>Menümüze hoş geldiniz</p>

</header>


<!-- MASA -->

<div class="masa-sec">

    <label>
        🪑 Masa Numaranız
    </label>

    <select id="masa">

        <option value="">
            Masa seçiniz
        </option>

    </select>

</div>


<div class="container">

    <!-- MENÜ -->

    <div class="menu">

        <div class="menu-baslik">

            <h2>
                ☕ Menü
            </h2>

        </div>

        <div id="urunler"></div>

    </div>


    <!-- SEPET -->

    <div class="alt">

        <div class="toplam">

            <span>
                Toplam
            </span>

            <span id="toplam">
                0 ₺
            </span>

        </div>

        <button
        class="gonder"
        onclick="siparisGonder()">

            🛎️ Siparişi Gönder

        </button>

    </div>


    <!-- GEÇMİŞ -->

    <div class="gecmis">

        <div class="gecmis-baslik">

            📋 Siparişlerim

        </div>

        <div id="siparisler">

            <div class="bos">
                Henüz sipariş yok.
            </div>

        </div>

    </div>

</div>


<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    query,
    where,
    orderBy,
    onSnapshot,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* ================================
   FIREBASE
================================ */

const firebaseConfig={

    apiKey:
    "AIzaSyC05yXQzAlF2AYzzeaJrDdMUYKwohKOsWM",

    authDomain:
    "dijitalkahve-67f0a.firebaseapp.com",

    databaseURL:
    "https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
    "dijitalkahve-67f0a",

    storageBucket:
    "dijitalkahve-67f0a.firebasestorage.app",

    messagingSenderId:
    "326476599239",

    appId:
    "1:326476599239:web:143f39583a3478118853e2",

    measurementId:
    "G-WM65PC4648"

};


const app=
initializeApp(
    firebaseConfig
);

const db=
getFirestore(app);


/* ================================
   50 MASA
================================ */

const masaSelect=
document.getElementById(
    "masa"
);


for(
    let i=1;
    i<=50;
    i++
){

    const option=
    document.createElement(
        "option"
    );

    option.value=i;

    option.textContent=
    "Masa "+i;

    masaSelect.appendChild(
        option
    );

}


/* ================================
   ÜRÜNLER
================================ */

const urunler=[

    {
        ad:"Çay",
        fiyat:25
    },

    {
        ad:"Nescafe",
        fiyat:60
    },

    {
        ad:"Türk Kahvesi",
        fiyat:70
    },

    {
        ad:"Su",
        fiyat:15
    },

    {
        ad:"Kola",
        fiyat:50
    },

    {
        ad:"Fanta",
        fiyat:50
    },

    {
        ad:"Tost",
        fiyat:100
    }

];


let sepet={};


urunler.forEach(
    u=>{
        sepet[u.ad]=0;
    }
);


/* ================================
   MENÜ OLUŞTUR
================================ */

function menuOlustur(){

    const alan=
    document.getElementById(
        "urunler"
    );

    alan.innerHTML="";


    urunler.forEach(
        (u,index)=>{

            alan.innerHTML+=`

                <div class="urun">

                    <div class="urun-bilgi">

                        <div class="urun-ad">
                            ${u.ad}
                        </div>

                        <div class="urun-fiyat">
                            ${u.fiyat} ₺
                        </div>

                    </div>

                    <div class="adet">

                        <button
                        onclick="
                            adetDegistir(
                                ${index},
                                -1
                            )
                        ">
                            −
                        </button>

                        <span
                        class="adet-sayi"
                        id="adet-${index}">
                            0
                        </span>

                        <button
                        onclick="
                            adetDegistir(
                                ${index},
                                1
                            )
                        ">
                            +
                        </button>

                    </div>

                </div>

            `;

        }
    );

}


menuOlustur();


/* ================================
   ADET
================================ */

window.adetDegistir=
function(index,miktar){

    const u=
    urunler[index];

    sepet[u.ad]=
    Math.max(
        0,
        sepet[u.ad]+miktar
    );


    document.getElementById(
        "adet-"+index
    ).textContent=
    sepet[u.ad];


    toplamGuncelle();

};


/* ================================
   TOPLAM
================================ */

function toplamGuncelle(){

    let toplam=0;


    urunler.forEach(
        u=>{

            toplam+=
            sepet[u.ad]*
            u.fiyat;

        }
    );


    document.getElementById(
        "toplam"
    ).textContent=
    toplam+
    " ₺";

}


/* ================================
   SİPARİŞ GÖNDER
================================ */

window.siparisGonder=
async function(){

    const masa=
    masaSelect.value;


    if(!masa){

        alert(
            "⚠️ Lütfen masa seçin."
        );

        return;

    }


    const secilen=[];


    urunler.forEach(
        u=>{

            const adet=
            sepet[u.ad];


            if(adet>0){

                secilen.push({

                    urun:u.ad,

                    adet:adet,

                    fiyat:u.fiyat,

                    tutar:
                    adet*u.fiyat

                });

            }

        }
    );


    if(
        secilen.length===0
    ){

        alert(
            "⚠️ Önce ürün seçin."
        );

        return;

    }


    const toplam=
    secilen.reduce(
        (a,b)=>
        a+b.tutar,
        0
    );


    try{

        await addDoc(

            collection(
                db,
                "siparisler"
            ),

            {

                masa:
                Number(masa),

                urunler:
                secilen,

                toplam:
                toplam,

                durum:
                "Bekleyen",

                kaynak:
                "musteri",

                garsonSiparisi:
                false,

                olusturmaZamani:
                serverTimestamp()

            }

        );


        alert(
            "✅ Siparişiniz gönderildi."
        );


        sepetiSifirla();

    }
    catch(error){

        console.error(error);

        alert(
            "❌ Sipariş gönderilemedi:\n"+
            error.message
        );

    }

};


/* ================================
   SEPET SIFIRLA
================================ */

function sepetiSifirla(){

    urunler.forEach(
        (u,index)=>{

            sepet[u.ad]=0;

            const el=
            document.getElementById(
                "adet-"+index
            );

            if(el){

                el.textContent="0";

            }

        }
    );


    toplamGuncelle();

}


/* ================================
   SİPARİŞLERİ GETİR
================================ */

function siparisleriGetir(masa){

    const alan=
    document.getElementById(
        "siparisler"
    );


    if(!masa){

        alan.innerHTML=`

            <div class="bos">

                Masa seçtiğinizde
                siparişleriniz burada görünür.

            </div>

        `;

        return;

    }


    const q=
    query(

        collection(
            db,
            "siparisler"
        ),

        where(
            "masa",
            "==",
            Number(masa)
        ),

        orderBy(
            "olusturmaZamani",
            "desc"
        )

    );


    onSnapshot(
        q,
        snapshot=>{

            alan.innerHTML="";


            if(
                snapshot.empty
            ){

                alan.innerHTML=`

                    <div class="bos">
                        Henüz sipariş yok.
                    </div>

                `;

                return;

            }


            snapshot.forEach(
                (item,index)=>{

                    const s=
                    item.data();


                    let urunHTML="";


                    (
                        s.urunler||[]
                    ).forEach(
                        u=>{

                            urunHTML+=`

                                <div
                                class="siparis-urun">

                                    <span>

                                        ${u.urun}
                                        × ${u.adet}

                                    </span>

                                    <b>

                                        ${
                                            Number(
                                                u.fiyat||0
                                            )*
                                            Number(
                                                u.adet||0
                                            )
                                        } ₺

                                    </b>

                                </div>

                            `;

                        }
                    );


                    /*
                       GARSON MU?
                    */

                    const garson=
                    s.kaynak ===
                    "garson"
                    ||
                    s.garsonSiparisi ===
                    true;


                    const kartClass=
                    garson
                    ?
                    "siparis garson"
                    :
                    "siparis musteri";


                    let etiket="";


                    if(garson){

                        etiket=`

                            <div class="garson-etiket">

                                👨‍🍳 GARSON SİPARİŞİ

                            </div>

                            <div class="garson-aciklama">

                                Bu sipariş
                                <b>garson tarafından</b>
                                oluşturuldu.

                            </div>

                        `;

                    }
                    else{

                        etiket=`

                            <div class="musteri-etiket">

                                👤 MÜŞTERİ SİPARİŞİ

                            </div>

                        `;

                    }


                    alan.innerHTML+=`

                        <div
                        class="${kartClass}">

                            <div
                            class="siparis-baslik">

                                <span
                                class="siparis-no">

                                    Sipariş #${index+1}

                                </span>

                                <span>

                                    ${
                                        s.durum ||
                                        "Bekleyen"
                                    }

                                </span>

                            </div>


                            ${etiket}


                            ${urunHTML}


                            <div
                            class="siparis-toplam">

                                Toplam:
                                ${
                                    Number(
                                        s.toplam||0
                                    )
                                } ₺

                            </div>


                            <div
                            class="siparis-durum">

                                ${
                                    s.durum ===
                                    "Onaylandı"
                                    ?
                                    "🟢 Sipariş onaylandı"
                                    :
                                    "🟡 Sipariş bekliyor"

                                }

                            </div>

                        </div>

                    `;

                }
            );

        },

        error=>{

            console.error(
                error
            );

            alan.innerHTML=`

                <div class="bos">

                    Siparişler yüklenemedi.

                </div>

            `;

        }
    );

}


/* ================================
   MASA DEĞİŞTİ
================================ */

masaSelect.addEventListener(
    "change",
    ()=>{

        siparisleriGetir(
            masaSelect.value
        );

    }
);

</script>

</body>
</html>
