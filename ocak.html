<body>

<div class="header">
    <h2 style="margin:0;">☕ OCAK & GARSON BİLDİRİM PANELİ</h2>
    <small>Gelen Çağrılar ve Siparişler Anlık Olarak Aşağıya Düşer</small>
</div>

<!-- GARSON ÇAĞRILARI -->
<h3 class="baslik">🔔 Garson Çağrıları</h3>
<div id="bildirimListesi">
    Çağrılar Yükleniyor...
</div>

<!-- BEKLEYEN SİPARİŞLER -->
<h3 class="baslik">🕐 Bekleyen Siparişler</h3>
<div id="bekleyenListesi">
    Yükleniyor...
</div>

<!-- ONAYLANAN SİPARİŞLER -->
<h3 class="baslik">✅ Onaylanan Siparişler</h3>
<div id="onaylananListesi">
    Yükleniyor...
</div>


<script>

    /* =========================================================
       FIREBASE
    ========================================================= */

    const firebaseConfig = {
        databaseURL: "https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "dijitalkahve-67f0a",
        storageBucket: "dijitalkahve-67f0a.appspot.com",
        messagingSenderId: "326476599239"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }

    const db = firebase.app().database(
        "https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app"
    );


    /* =========================================================
       GARSON ÇAĞRILARI
    ========================================================= */

    db.ref('bildirimler').on('value', (snapshot) => {

        const data = snapshot.val();

        const container =
            document.getElementById('bildirimListesi');

        container.innerHTML = '';

        if (data) {

            Object.keys(data).forEach(key => {

                const item = data[key];

                container.innerHTML += `

                    <div class="ocak-card">

                        <div>
                            <strong>MASA ${item.masa}</strong>
                            <br>

                            <span style="font-size:14px;color:#ccc;">
                                Saat: ${item.zaman}
                            </span>
                        </div>

                        <button
                            class="btn-tamam"
                            style="width:auto;"
                            onclick="bildirimSil('${key}')">

                            GİDİLDİ

                        </button>

                    </div>

                `;

            });

        } else {

            container.innerHTML =
                '<p class="bos-mesaj">Şu an bekleyen çağrı yok.</p>';

        }

    }, (error) => {

        document.getElementById('bildirimListesi').innerHTML =
            '<p style="color:red;text-align:center;">Bağlantı Hatası: '
            + error.message +
            '</p>';

    });


    /* =========================================================
       SİPARİŞLERİ DİNLE
    ========================================================= */

    db.ref('siparisler').on('value', (snapshot) => {

        const data = snapshot.val();

        const bekleyenContainer =
            document.getElementById('bekleyenListesi');

        const onaylananContainer =
            document.getElementById('onaylananListesi');

        bekleyenContainer.innerHTML = '';
        onaylananContainer.innerHTML = '';

        let bekleyenVar = false;

        /*
            ONAYLANAN SİPARİŞLERİ MASAYA GÖRE BİRLEŞTİRİYORUZ.

            Örnek:

            Masa 1
            3 Çay

            Masa 1
            4 Çay

            SONUÇ:

            Masa 1
            7 Çay
        */

        const birlesikMasalar = {};


        if (data) {

            Object.keys(data).forEach(key => {

                const siparis = data[key];

                const urunler = siparis.urunler || {};


                /* ==========================================
                   BEKLEYEN SİPARİŞ
                   ========================================== */

                if (siparis.durum !== 'onaylandi') {

                    bekleyenVar = true;

                    let urunHtml = '';

                    Object.values(urunler).forEach(u => {

                        const tutar =
                            (parseFloat(u.fiyat) || 0) *
                            u.adet;

                        urunHtml += `

                            <div class="siparis-urun">

                                <span>
                                    ${u.ad} x${u.adet}
                                </span>

                                <span>
                                    ${tutar} TL
                                </span>

                            </div>

                        `;

                    });


                    bekleyenContainer.innerHTML += `

                        <div class="siparis-card">

                            <div class="masa-baslik">

                                <strong>
                                    MASA ${siparis.masa}
                                </strong>

                                <span style="font-size:14px;color:#ccc;">
                                    Saat: ${siparis.zaman}
                                </span>

                            </div>

                            <div style="margin-top:8px;">
                                ${urunHtml}
                            </div>

                            <div class="siparis-toplam">
                                Toplam: ${siparis.toplam} TL
                            </div>

                            <button
                                class="btn-tamam"
                                onclick="siparisOnayla('${key}')">

                                ✅ ONAYLA
                                (Malzemeler Götürüldü)

                            </button>

                        </div>

                    `;

                }


                /* ==========================================
                   ONAYLANAN SİPARİŞ
                   ========================================== */

                else {

                    const masaNo = String(siparis.masa);

                    if (!birlesikMasalar[masaNo]) {

                        birlesikMasalar[masaNo] = {

                            urunler: {},

                            toplam: 0,

                            siparisler: [],

                            sonSaat: siparis.zaman

                        };

                    }


                    const masaData =
                        birlesikMasalar[masaNo];


                    masaData.toplam +=
                        parseFloat(siparis.toplam) || 0;


                    masaData.siparisler.push(key);

                    masaData.sonSaat = siparis.zaman;


                    Object.keys(urunler).forEach(productKey => {

                        const u = urunler[productKey];

                        /*
                            Aynı ürün key'i ise direkt birleştir.
                        */

                        if (!masaData.urunler[productKey]) {

                            masaData.urunler[productKey] = {

                                ad: u.ad,

                                fiyat: parseFloat(u.fiyat) || 0,

                                adet: 0

                            };

                        }

                        masaData.urunler[productKey].adet +=
                            parseInt(u.adet) || 0;

                    });

                }

            });

        }


        /* =====================================================
           BEKLEYEN YOK
        ===================================================== */

        if (!bekleyenVar) {

            bekleyenContainer.innerHTML =
                '<p class="bos-mesaj">Bekleyen sipariş yok.</p>';

        }


        /* =====================================================
           BİRLEŞTİRİLMİŞ ONAYLI SİPARİŞLERİ GÖSTER
        ===================================================== */

        const masaKeys =
            Object.keys(birlesikMasalar);


        if (masaKeys.length === 0) {

            onaylananContainer.innerHTML =
                '<p class="bos-mesaj">Onaylanan sipariş yok.</p>';

        } else {

            masaKeys.forEach(masaNo => {

                const masaData =
                    birlesikMasalar[masaNo];

                let urunHtml = '';


                Object.keys(masaData.urunler).forEach(productKey => {

                    const u =
                        masaData.urunler[productKey];

                    const tutar =
                        u.fiyat * u.adet;


                    urunHtml += `

                        <div class="siparis-urun">

                            <span>
                                ${u.ad} x${u.adet}
                            </span>

                            <span>
                                ${tutar} TL
                            </span>

                        </div>

                    `;

                });


                onaylananContainer.innerHTML += `

                    <div class="siparis-card onayli">

                        <div class="masa-baslik">

                            <strong>
                                MASA ${masaNo}
                            </strong>

                            <span style="font-size:14px;color:#ccc;">
                                Son: ${masaData.sonSaat}
                            </span>

                        </div>


                        <div class="birlesik-bilgi">

                            Bu masanın onaylanan siparişleri
                            otomatik olarak birleştirildi.

                        </div>


                        <div>

                            ${urunHtml}

                        </div>


                        <div class="siparis-toplam">

                            TOPLAM:
                            ${masaData.toplam} TL

                        </div>


                        <button
                            class="btn-duzenle"
                            onclick='duzenleBaslat(
                                ${JSON.stringify(masaNo)},
                                ${JSON.stringify(masaData)}
                            )'>

                            ✏️ DÜZENLE

                        </button>


                        <div
                            id="duzenle-${masaNo}"
                            style="display:none;">
                        </div>

                    </div>

                `;

            });

        }

    }, (error) => {

        document.getElementById('bekleyenListesi').innerHTML =
            '<p style="color:red;text-align:center;">Bağlantı Hatası: '
            + error.message +
            '</p>';

    });


    /* =========================================================
       BİLDİRİM SİL
    ========================================================= */

    function bildirimSil(id) {

        db.ref('bildirimler/' + id).remove();

    }


    /* =========================================================
       SİPARİŞ ONAYLA
    ========================================================= */

    function siparisOnayla(id) {

        db.ref('siparisler/' + id + '/durum')
            .set('onaylandi');

    }


    /* =========================================================
       DÜZENLEMEYİ BAŞLAT
    ========================================================= */

    function duzenleBaslat(masaNo, masaData) {

        const alan =
            document.getElementById('duzenle-' + masaNo);

        if (!alan) return;


        if (alan.style.display === 'block') {

            alan.style.display = 'none';

            return;

        }


        let html = `

            <div class="duzenle-alan">

                <strong style="color:#90caf9;">
                    ✏️ MASA ${masaNo} DÜZENLE
                </strong>

                <div style="font-size:13px;color:#aaa;margin:8px 0 12px;">
                    Ürün adetlerini değiştirebilirsiniz.
                </div>

        `;


        Object.keys(masaData.urunler).forEach(productKey => {

            const u =
                masaData.urunler[productKey];


            html += `

                <div
                    class="duzenle-satir"
                    data-product="${productKey}">

                    <div>

                        <strong>
                            ${u.ad}
                        </strong>

                        <br>

                        <small style="color:#aaa;">
                            ${u.fiyat} TL
                        </small>

                    </div>


                    <div>

                        <button
                            class="adet-btn eksi"
                            onclick="duzenleAdet(
                                '${masaNo}',
                                '${productKey}',
                                -1
                            )">

                            −

                        </button>


                        <span
                            class="adet-sayi"
                            id="adet-${masaNo}-${productKey}">

                            ${u.adet}

                        </span>


                        <button
                            class="adet-btn arti"
                            onclick="duzenleAdet(
                                '${masaNo}',
                                '${productKey}',
                                1
                            )">

                            +

                        </button>

                    </div>

                </div>

            `;

        });


        html += `

                <button
                    class="btn-kaydet"
                    onclick="duzenleKaydet(
                        '${masaNo}'
                    )">

                    💾 DEĞİŞİKLİKLERİ KAYDET

                </button>


                <button
                    class="btn-vazgec"
                    onclick="duzenleKapat(
                        '${masaNo}'
                    )">

                    Vazgeç

                </button>

            </div>

        `;


        alan.innerHTML = html;

        alan.style.display = 'block';


        /*
            Düzenleme verisini geçici olarak sayfada tutuyoruz.
        */

        if (!window.duzenlemeData) {

            window.duzenlemeData = {};

        }


        window.duzenlemeData[masaNo] =
            JSON.parse(
                JSON.stringify(masaData)
            );

    }


    /* =========================================================
       ADET DEĞİŞTİR
    ========================================================= */

    function duzenleAdet(
        masaNo,
        productKey,
        delta
    ) {

        if (!window.duzenlemeData) return;

        const masaData =
            window.duzenlemeData[masaNo];

        if (!masaData) return;

        const urun =
            masaData.urunler[productKey];

        if (!urun) return;


        const yeniAdet =
            Math.max(
                0,
                parseInt(urun.adet) + delta
            );


        /*
            Ürün adedi 0 olursa listeden kaldır.
        */

        if (yeniAdet === 0) {

            delete masaData.urunler[productKey];

        } else {

            urun.adet = yeniAdet;

        }


        duzenlemeEkraniYenile(masaNo);

    }


    /* =========================================================
       DÜZENLEME EKRANINI YENİLE
    ========================================================= */

    function duzenlemeEkraniYenile(masaNo) {

        const alan =
            document.getElementById(
                'duzenle-' + masaNo
            );

        const masaData =
            window.duzenlemeData[masaNo];

        if (!alan || !masaData) return;


        let html = `

            <div class="duzenle-alan">

                <strong style="color:#90caf9;">
                    ✏️ MASA ${masaNo} DÜZENLE
                </strong>

                <div style="font-size:13px;color:#aaa;margin:8px 0 12px;">
                    Ürün adetlerini değiştirebilirsiniz.
                </div>

        `;


        const keys =
            Object.keys(masaData.urunler);


        if (keys.length === 0) {

            html += `

                <p style="color:#aaa;text-align:center;">
                    Bu masada ürün kalmadı.
                </p>

            `;

        } else {

            keys.forEach(productKey => {

                const u =
                    masaData.urunler[productKey];


                html += `

                    <div
                        class="duzenle-satir">

                        <div>

                            <strong>
                                ${u.ad}
                            </strong>

                            <br>

                            <small style="color:#aaa;">
                                ${u.fiyat} TL
                            </small>

                        </div>


                        <div>

                            <button
                                class="adet-btn eksi"
                                onclick="duzenleAdet(
                                    '${masaNo}',
                                    '${productKey}',
                                    -1
                                )">

                                −

                            </button>


                            <span class="adet-sayi">

                                ${u.adet}

                            </span>


                            <button
                                class="adet-btn arti"
                                onclick="duzenleAdet(
                                    '${masaNo}',
                                    '${productKey}',
                                    1
                                )">

                                +

                            </button>

                        </div>

                    </div>

                `;

            });

        }


        html += `

                <button
                    class="btn-kaydet"
                    onclick="duzenleKaydet(
                        '${masaNo}'
                    )">

                    💾 DEĞİŞİKLİKLERİ KAYDET

                </button>


                <button
                    class="btn-vazgec"
                    onclick="duzenleKapat(
                        '${masaNo}'
                    )">

                    Vazgeç

                </button>

            </div>

        `;


        alan.innerHTML = html;

    }


    /* =========================================================
       DÜZENLEMEYİ KAPAT
    ========================================================= */

    function duzenleKapat(masaNo) {

        const alan =
            document.getElementById(
                'duzenle-' + masaNo
            );

        if (alan) {

            alan.style.display = 'none';

        }

    }


    /* =========================================================
       DÜZENLENMİŞ SİPARİŞİ KAYDET
    ========================================================= */

    async function duzenleKaydet(masaNo) {

        if (!window.duzenlemeData) return;

        const masaData =
            window.duzenlemeData[masaNo];

        if (!masaData) return;


        /*
            Bu masaya ait ONAYLANMIŞ siparişleri
            buluyoruz.
        */

        const snapshot =
            await db.ref('siparisler')
                .orderByChild('masa')
                .equalTo(masaNo)
                .once('value');


        const data =
            snapshot.val();


        if (!data) {

            alert('Sipariş bulunamadı.');

            return;

        }


        const onayliSiparisler = [];


        Object.keys(data).forEach(key => {

            if (
                data[key].durum === 'onaylandi'
            ) {

                onayliSiparisler.push({
                    key: key,
                    data: data[key]
                });

            }

        });


        if (onayliSiparisler.length === 0) {

            alert('Onaylanmış sipariş bulunamadı.');

            return;

        }


        /*
            Mevcut birleşik ürünleri siparişlere
            yeniden dağıtmak yerine güvenli şekilde
            ilk sipariş üzerinde topluyoruz.
        */

        const ilkSiparis =
            onayliSiparisler[0].key;


        const updates = {};


        /*
            İlk siparişin ürünlerini yeni birleşik
            listeyle değiştiriyoruz.
        */

        updates[
            'siparisler/' +
            ilkSiparis +
            '/urunler'
        ] = masaData.urunler;


        /*
            Yeni toplam hesapla.
        */

        let yeniToplam = 0;


        Object.values(
            masaData.urunler
        ).forEach(u => {

            yeniToplam +=
                (parseFloat(u.fiyat) || 0) *
                (parseInt(u.adet) || 0);

        });


        updates[
            'siparisler/' +
            ilkSiparis +
            '/toplam'
        ] = yeniToplam;


        /*
            Eğer birden fazla onaylanmış sipariş varsa,
            onları silmek yerine ürünlerini 0'layarak
            sistemden kaldırmak yerine burada
            güvenli bir birleştirme yapıyoruz.

            Ancak eski siparişlerin tekrar toplamda
            görünmemesi için diğer onaylı siparişleri
            "birlesmis" durumuna getiriyoruz.
        */

        for (
            let i = 1;
            i < onayliSiparisler.length;
            i++
        ) {

            const eskiKey =
                onayliSiparisler[i].key;


            updates[
                'siparisler/' +
                eskiKey +
                '/durum'
            ] = 'birlesmis';


            updates[
                'siparisler/' +
                eskiKey +
                '/birlesikMasa'
            ] = masaNo;

        }


        await db.ref().update(updates);


        alert(
            'Masa ' +
            masaNo +
            ' siparişi güncellendi.'
        );


        duzenleKapat(masaNo);


        delete window.duzenlemeData[masaNo];

    }

</script>

</body>
</html>
