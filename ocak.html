<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Garson Paneli</title>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;padding:15px;
 font-family:Arial;background:#171313;color:white
}
.header{
 background:linear-gradient(135deg,#b71c1c,#e53935);
 padding:20px;border-radius:15px;
 text-align:center;margin-bottom:18px;
 box-shadow:0 6px 18px #0006
}
.section{
 margin-top:22px
}
.section h3{
 border-bottom:1px solid #444;padding-bottom:8px
}
.card{
 background:#272020;border-radius:14px;
 padding:15px;margin-bottom:12px;
 border-left:6px solid #ff9800;
 box-shadow:0 4px 12px #0005
}
.card.onay{border-left-color:#4caf50}
.masa{
 font-size:20px;font-weight:bold;color:#ffeb3b
}
.satir{
 display:flex;justify-content:space-between;
 padding:5px 0;border-bottom:1px dashed #444
}
.toplam{
 text-align:right;color:#ffeb3b;
 font-weight:bold;margin-top:8px
}
button{
 border:0;border-radius:9px;
 padding:11px;font-weight:bold;cursor:pointer
}
.onayla{
 width:100%;background:#43a047;color:#fff;margin-top:10px
}
.duzenle{
 width:100%;background:#1565c0;color:#fff;margin-top:8px
}
.cagri{
 display:flex;justify-content:space-between;
 align-items:center;background:#302525;
 border-left:6px solid #ffeb3b;
 padding:14px;border-radius:12px;margin-bottom:10px
}
.cagri button{
 background:#43a047;color:white
}
.empty{
 text-align:center;color:#888;padding:20px
}
</style>
</head>

<body>

<div class="header">
<h2>☕ OCAK & GARSON</h2>
<small>Sipariş ve çağrılar canlı olarak güncellenir</small>
</div>

<div class="section">
<h3>🔔 Garson Çağrıları</h3>
<div id="bildirimListesi"></div>
</div>

<div class="section">
<h3>🕐 Bekleyen Siparişler</h3>
<div id="bekleyenListesi"></div>
</div>

<div class="section">
<h3>✅ Onaylanan Siparişler</h3>
<div id="onaylananListesi"></div>
</div>

<script>
const firebaseConfig={
 databaseURL:"https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app",
 projectId:"dijitalkahve-67f0a",
 storageBucket:"dijitalkahve-67f0a.appspot.com",
 messagingSenderId:"326476599239"
};

if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);

const db=firebase.app().database(
"https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app"
);

db.ref("bildirimler").on("value",s=>{
 let data=s.val();
 let el=document.getElementById("bildirimListesi");
 el.innerHTML="";

 if(!data){
  el.innerHTML='<div class="empty">Bekleyen çağrı yok.</div>';
  return;
 }

 Object.keys(data).forEach(k=>{
  let x=data[k];

  el.innerHTML+=`
  <div class="cagri">
   <div>
    <div class="masa">MASA ${x.masa}</div>
    <small>Saat: ${x.zaman}</small>
   </div>
   <button onclick="bildirimSil('${k}')">GİDİLDİ</button>
  </div>`;
 });
});

db.ref("siparisler").on("value",s=>{
 let data=s.val();
 let bekleyen=document.getElementById("bekleyenListesi");
 let onaylanan=document.getElementById("onaylananListesi");

 bekleyen.innerHTML="";
 onaylanan.innerHTML="";

 let b=false;

 if(data){
  Object.keys(data).forEach(k=>{
   let sip=data[k];

   let urunler={};

   Object.values(sip.urunler||{}).forEach(u=>{
    let key=u.ad+"|"+u.fiyat;

    if(!urunler[key])
     urunler[key]={ad:u.ad,fiyat:u.fiyat,adet:0};

    urunler[key].adet+=Number(u.adet)||0;
   });

   let html="";

   Object.values(urunler).forEach(u=>{
    html+=`
    <div class="satir">
     <span>${u.ad} × ${u.adet}</span>
     <span>${u.fiyat*u.adet} TL</span>
    </div>`;
   });

   if(sip.durum==="onaylandi"){
    onaylanan.innerHTML+=`
    <div class="card onay">
     <div class="masa">MASA ${sip.masa}</div>
     <small>Saat: ${sip.zaman}</small>
     <div style="margin-top:10px">${html}</div>
     <div class="toplam">Toplam: ${sip.toplam} TL</div>
    </div>`;
   }else{
    b=true;

    bekleyen.innerHTML+=`
    <div class="card">
     <div class="masa">MASA ${sip.masa}</div>
     <small>Saat: ${sip.zaman}</small>
     <div style="margin-top:10px">${html}</div>
     <div class="toplam">Toplam: ${sip.toplam} TL</div>

     <button class="onayla"
      onclick="siparisOnayla('${k}')">
      ✅ ONAYLA / MALZEMELER GÖTÜRÜLDÜ
     </button>

     <button class="duzenle"
      onclick="siparisDuzenle('${k}')">
      ✏️ DÜZENLE
     </button>
    </div>`;
   }
  });
 }

 if(!b)
  bekleyen.innerHTML='<div class="empty">Bekleyen sipariş yok.</div>';
});

function bildirimSil(id){
 db.ref("bildirimler/"+id).remove();
}

function siparisOnayla(id){
 let ref=db.ref("siparisler/"+id);

 ref.once("value").then(s=>{
  let sip=s.val();
  if(!sip)return;

  ref.update({
   durum:"onaylandi",
   onayZamani:new Date().toLocaleTimeString("tr-TR"),
   onayTarihi:new Date().toISOString().slice(0,10)
  });
 });
}

function siparisDuzenle(id){
 let yeni=prompt(
 "Sipariş üzerinde garson düzenleme yapabilir.\n\nYeni sipariş yapısını değiştirmek için ürünü ve adedi yazabilirsiniz."
 );

 if(yeni!==null)
  alert("Düzenleme özelliği için sipariş satırlarını birlikte düzenleyebiliriz.");
}
</script>
</body>
</html>
