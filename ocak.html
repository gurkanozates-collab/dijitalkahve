<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getFirestore,
    collection,
    query,
    where,
    onSnapshot,
    addDoc,
    updateDoc,
    doc,
    serverTimestamp,
    getDocs
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyC05yXQzAlF2AYzzeaJrDdMUYKwohKOsWM",

    authDomain:
    "dijitalkahve-67f0a.firebaseapp.com",

    databaseURL:
    "https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
    "dijitalkahve-67f0a",

    storageBucket:
    "dijitalkahve-67f0a.firebasestorage.app",

    messagingSenderId:
    "326476599239",

    appId:
    "1:326476599239:web:143f39583a3478118853e2",

    measurementId:
    "G-WM65PC4648"

};

const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);


/* =========================
   MENÜ
========================= */

const urunler = [

    {ad:"Çay",fiyat:25},
    {ad:"Nescafe",fiyat:60},
    {ad:"Türk Kahvesi",fiyat:70},
    {ad:"Su",fiyat:15},
    {ad:"Kola",fiyat:50},
    {ad:"Fanta",fiyat:50},
    {ad:"Tost",fiyat:100}

];


let seciliMasa = null;
let seciliOturumId = null;
let sepet = {};
let siparisler = [];
let oturumlar = {};
let duzenSepet = {};


/* =========================
   SEPET
========================= */

function sepetSifirla(){

    sepet = {};

    urunler.forEach(u=>{
        sepet[u.ad]=0;
    });

}


/* =========================
   OTURUM BUL
========================= */

function acikOturumBul(masa){

    const bulunan =
        Object.entries(oturumlar).find(
            ([id,o]) =>
                Number(o.masa) === Number(masa) &&
                o.durum === "acik"
        );

    if(!bulunan)
        return null;

    return {
        id:bulunan[0],
        ...bulunan[1]
    };

}


/* =========================
   MASA OTURUMU AÇ
========================= */

window.masaOturumuAc =
async function(masa){

    const mevcut =
        acikOturumBul(masa);

    if(mevcut){

        alert(
            "🟢 Masa "+masa+
            " zaten açık."
        );

        return;
    }

    try{

        await addDoc(

            collection(
                db,
                "oturumlar"
            ),

            {
                masa:Number(masa),
                durum:"acik",
                odemeDurumu:"bekliyor",
                acilisZamani:
                    serverTimestamp()
            }

        );

        alert(
            "✅ Masa "+masa+
            " oturumu açıldı.\n\n"+
            "Müşteri artık QR kodu okutarak masaya girebilir."
        );

    }
    catch(error){

        console.error(error);

        alert(
            "❌ Masa açılamadı.\n\n"+
            error.message
        );

    }

};


/* =========================
   OTURUM KAPAT
========================= */

window.masaOturumuKapat =
async function(id,masa){

    if(
        !confirm(
            "Masa "+masa+
            " oturumu kapatılsın mı?"
        )
    )
        return;

    try{

        await updateDoc(

            doc(
                db,
                "oturumlar",
                id
            ),

            {
                durum:"kapali",
                kapanisZamani:
                    serverTimestamp()
            }

        );

        alert(
            "🔴 Masa "+masa+
            " oturumu kapatıldı."
        );

    }
    catch(error){

        alert(
            "❌ Oturum kapatılamadı.\n\n"+
            error.message
        );

    }

};


/* =========================
   GARSON MENÜ
========================= */

window.garsonMenusuAc =
function(masa){

    const oturum =
        acikOturumBul(masa);

    if(!oturum){

        alert(
            "⚠️ Önce bu masanın oturumunu açmalısınız."
        );

        return;
    }

    seciliMasa = masa;
    seciliOturumId = oturum.id;

    sepetSifirla();

    document.getElementById(
        "modalBaslik"
    ).textContent =
        "👨‍🍳 Garson Siparişi - Masa "+masa;

    menuOlustur();

    document.getElementById(
        "menuModal"
    ).classList.add("acik");

};


/* =========================
   MENÜ KAPAT
========================= */

window.menuKapat =
function(){

    document.getElementById(
        "menuModal"
    ).classList.remove("acik");

    seciliMasa=null;
    seciliOturumId=null;

};


/* =========================
   MENÜ
========================= */

function menuOlustur(){

    const menu =
        document.getElementById("menu");

    menu.innerHTML="";

    urunler.forEach(
        (u,index)=>{

            menu.innerHTML += `

                <div class="menu-urun">

                    <div class="menu-bilgi">

                        <div class="menu-ad">
                            ${u.ad}
                        </div>

                        <div class="menu-fiyat">
                            ${u.fiyat} ₺
                        </div>

                    </div>

                    <div class="adet">

                        <button
                            onclick="
                            adetDegistir(${index},-1)
                            ">
                            −
                        </button>

                        <span id="adet-${index}">
                            0
                        </span>

                        <button
                            onclick="
                            adetDegistir(${index},1)
                            ">
                            +
                        </button>

                    </div>

                </div>

            `;

        }
    );

    toplamGuncelle();

}


/* =========================
   ADET
========================= */

window.adetDegistir =
function(index,miktar){

    const u =
        urunler[index];

    sepet[u.ad] =
        Math.max(
            0,
            (sepet[u.ad]||0)+miktar
        );

    const el =
        document.getElementById(
            "adet-"+index
        );

    if(el)
        el.textContent =
            sepet[u.ad];

    toplamGuncelle();

};


/* =========================
   TOPLAM
========================= */

function toplamHesapla(){

    return urunler.reduce(
        (toplam,u)=>
            toplam+
            (sepet[u.ad]||0)*
            u.fiyat,
        0
    );

}

function toplamGuncelle(){

    document.getElementById(
        "menuToplam"
    ).textContent =
        toplamHesapla()+" ₺";

}


/* =========================
   GARSON SİPARİŞ GÖNDER
========================= */

window.garsonSiparisGonder =
async function(){

    if(!seciliMasa)
        return;

    const oturum =
        acikOturumBul(
            seciliMasa
        );

    if(!oturum){

        alert(
            "❌ Masa oturumu kapanmış."
        );

        menuKapat();

        return;
    }

    const liste=[];

    urunler.forEach(u=>{

        const adet =
            Number(
                sepet[u.ad]||0
            );

        if(adet>0){

            liste.push({

                urun:u.ad,
                adet:adet,
                fiyat:u.fiyat,
                tutar:adet*u.fiyat

            });

        }

    });

    if(!liste.length){

        alert(
            "⚠️ Önce ürün seçmelisin."
        );

        return;
    }

    const toplam =
        liste.reduce(
            (a,b)=>a+b.tutar,
            0
        );

    try{

        await addDoc(

            collection(
                db,
                "siparisler"
            ),

            {
                masa:String(seciliMasa),
                oturumId:oturum.id,
                urunler:liste,
                toplam:toplam,
                durum:"Bekleyen",
                kaynak:"garson",
                garsonSiparisi:true,
                olusturmaZamani:
                    serverTimestamp()
            }

        );

        alert(
            "✅ Garson siparişi gönderildi."
        );

        menuKapat();

    }
    catch(error){

        alert(
            "❌ Sipariş gönderilemedi.\n\n"+
            error.message
        );

    }

};


/* =========================
   ZAMAN
========================= */

function zaman(s){

    return s.olusturmaZamani &&
        typeof s.olusturmaZamani.toMillis==="function"
        ?
        s.olusturmaZamani.toMillis()
        :
        0;

}

function saat(s){

    if(
        s.olusturmaZamani &&
        typeof s.olusturmaZamani.toDate==="function"
    ){

        return s.olusturmaZamani
            .toDate()
            .toLocaleTimeString(
                "tr-TR",
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            );

    }

    return "--:--";

}


/* =========================
   DÜZENLE HTML
========================= */

function duzenHTML(s){

    const liste =
        duzenSepet[s.id] ||
        s.urunler ||
        [];

    let html="";

    liste.forEach(
        (u,i)=>{

            html += `

                <div class="duzen-satir">

                    <div class="duzen-urun">

                        ${u.urun}

                        <div class="duzen-fiyat">
                            ${u.fiyat} ₺ / adet
                        </div>

                    </div>

                    <div class="adet">

                        <button
                            onclick="
                            duzenAdet(
                                '${s.id}',
                                ${i},
                                -1
                            )
                            ">
                            −
                        </button>

                        <span
                            id="duzen-${s.id}-${i}">
                            ${u.adet}
                        </span>

                        <button
                            onclick="
                            duzenAdet(
                                '${s.id}',
                                ${i},
                                1
                            )
                            ">
                            +
                        </button>

                    </div>

                </div>

            `;

        }
    );

    const toplam =
        liste.reduce(
            (a,u)=>
                a+
                Number(u.adet||0)*
                Number(u.fiyat||0),
            0
        );

    html += `

        <div
            class="duzen-toplam"
            id="duzen-toplam-${s.id}">

            Yeni Toplam:
            ${toplam} ₺

        </div>

        <button
            class="kaydet"
            onclick="
            duzenKaydet('${s.id}')
            ">

            💾 Değişiklikleri Kaydet

        </button>

    `;

    return html;

}


/* =========================
   SİPARİŞ HTML
========================= */

function siparisHTML(s,index){

    const garson =
        s.kaynak==="garson" ||
        s.garsonSiparisi===true;

    let html="";

    (s.urunler||[]).forEach(u=>{

        html += `

            <div class="urun">

                <span>
                    ${u.urun} × ${u.adet}
                </span>

                <b>
                    ${Number(u.tutar||0)} ₺
                </b>

            </div>

        `;

    });

    return `

        <div class="siparis ${garson?"garson":""}">

            <div class="siparis-baslik">

                <span class="siparis-no">
                    Sipariş #${index+1}
                </span>

                <span class="siparis-durum">
                    🟡 Bekleyen
                </span>

            </div>

            <div class="
                kaynak
                ${garson?"":"musteri"}
            ">

                ${
                    garson
                    ?
                    "👨‍🍳 GARSON SİPARİŞİ"
                    :
                    "👤 MÜŞTERİ SİPARİŞİ"
                }

            </div>

            <div class="zaman">
                🕐 ${saat(s)}
            </div>

            ${html}

            <div class="toplam">

                Toplam:
                ${Number(s.toplam||0)} ₺

            </div>

            <div class="butons">

                <button
                    class="btn duzenle"
                    onclick="
                    duzenle('${s.id}')
                    ">

                    ✏️ Düzenle

                </button>

                <button
                    class="btn onayla"
                    onclick="
                    onayla('${s.id}')
                    ">

                    🟢 Onayla

                </button>

                <button
                    class="btn iptal"
                    onclick="
                    iptalEt('${s.id}')
                    ">

                    ❌ İptal Et

                </button>

            </div>

            <div
                id="duzen-${s.id}"
                class="duzenleme">

                ${duzenHTML(s)}

            </div>

        </div>

    `;

}


/* =========================
   DÜZENLE
========================= */

window.duzenle =
function(id){

    const s =
        siparisler.find(
            x=>x.id===id
        );

    if(!s)
        return;

    if(s.durum!=="Bekleyen"){

        alert(
            "⚠️ Sadece bekleyen siparişler düzenlenebilir."
        );

        return;

    }

    if(!duzenSepet[id]){

        duzenSepet[id] =
            JSON.parse(
                JSON.stringify(
                    s.urunler||[]
                )
            );

    }

    const el =
        document.getElementById(
            "duzen-"+id
        );

    if(el)
        el.classList.toggle("acik");

};


/* =========================
   DÜZEN ADET
========================= */

window.duzenAdet =
function(id,index,miktar){

    const liste =
        duzenSepet[id];

    if(!liste)
        return;

    const u =
        liste[index];

    if(!u)
        return;

    u.adet =
        Math.max(
            0,
            Number(u.adet||0)+miktar
        );

    const el =
        document.getElementById(
            `duzen-${id}-${index}`
        );

    if(el)
        el.textContent =
            u.adet;

    const toplam =
        liste.reduce(
            (a,x)=>
                a+
                Number(x.adet||0)*
                Number(x.fiyat||0),
            0
        );

    const toplamEl =
        document.getElementById(
            "duzen-toplam-"+id
        );

    if(toplamEl){

        toplamEl.textContent =
            "Yeni Toplam: "+
            toplam+
            " ₺";

    }

};


/* =========================
   DÜZEN KAYDET
========================= */

window.duzenKaydet =
async function(id){

    const liste =
        (duzenSepet[id]||[])
        .filter(
            u =>
                Number(u.adet||0)>0
        );

    if(!liste.length){

        alert(
            "⚠️ Siparişte en az bir ürün kalmalı."
        );

        return;

    }

    let toplam=0;

    liste.forEach(u=>{

        u.adet =
            Number(u.adet||0);

        u.fiyat =
            Number(u.fiyat||0);

        u.tutar =
            u.adet*u.fiyat;

        toplam +=
            u.tutar;

    });

    try{

        await updateDoc(

            doc(
                db,
                "siparisler",
                id
            ),

            {
                urunler:liste,
                toplam:toplam,
                duzenlendi:true,
                duzenlenmeZamani:
                    serverTimestamp()
            }

        );

        delete duzenSepet[id];

        alert(
            "✅ Sipariş düzenlendi.\n\n"+
            "Yeni toplam: "+
            toplam+
            " ₺"
        );

    }
    catch(error){

        alert(
            "❌ Düzenleme başarısız.\n\n"+
            error.message
        );

    }

};


/* =========================
   ONAYLA
========================= */

        );

};

/* =========================
   MASALARI GÖSTER
========================= */

function masalariGoster(){

    const grid =
        document.getElementById(
            "masaGrid"
        );

    grid.innerHTML="";

    const bekleyen =
        siparisler.filter(
            s=>s.durum==="Bekleyen"
        );

    document.getElementById(
        "bilgi"
    ).textContent =
        bekleyen.length+
        " bekleyen sipariş";

    const masaSonSiparis={};

    bekleyen.forEach(s=>{

        const masa =
            Number(s.masa);

        const z =
            zaman(s);

        if(
            !masaSonSiparis[masa] ||
            z>masaSonSiparis[masa]
        ){

            masaSonSiparis[masa]=z;

        }

    });

    const masalar =
        Array.from(
            {length:50},
            (_,i)=>i+1
        );

    masalar.sort(
        (a,b)=>{

            const aZ =
                masaSonSiparis[a]||0;

            const bZ =
                masaSonSiparis[b]||0;

            if(aZ===0&&bZ===0)
                return a-b;

            if(aZ===0)
                return 1;

            if(bZ===0)
                return -1;

            return bZ-aZ;

        }
    );


    masalar.forEach(
        (masa,index)=>{

            const siparislerMasa =
                bekleyen.filter(
                    s =>
                        Number(s.masa)===masa
                );

            const oturum =
                acikOturumBul(masa);

            const div =
                document.createElement("div");

            div.className="masa";

            if(oturum)
                div.classList.add("oturum");

            if(siparislerMasa.length)
                div.classList.add("bekleyen");

            if(
                index===0 &&
                siparislerMasa.length
            )
                div.classList.add("yeni");


            let html=`

                <div class="masa-baslik">

                    <h3>
                        🪑 Masa ${masa}
                    </h3>

                    <span class="
                        durum
                        ${
                            siparislerMasa.length
                            ?
                            "bekleyen"
                            :
                            oturum
                            ?
                            "acik"
                            :
                            "kapali"
                        }
                    ">

                        ${
                            siparislerMasa.length
                            ?
                            "🟡 "+
                            siparislerMasa.length+
                            " Bekleyen"
                            :
                            oturum
                            ?
                            "🟢 Oturum Açık"
                            :
                            "⚪ Kapalı"
                        }

                    </span>

                </div>

            `;


            if(!oturum){

                html += `

                    <button
                        class="oturum-btn"
                        onclick="
                        masaOturumuAc(${masa})
                        ">

                        🟢 MASA OTURUMUNU AÇ

                    </button>

                    <div class="oturum-kapali">

                        ⚪ Müşteri QR ile
                        sipariş veremez

                    </div>

                `;

            }
            else{

                html += `

                    <div class="oturum-bilgi">

                        🟢 Müşteri QR ile
                        giriş yapabilir

                    </div>

                    <button
                        class="garson-btn"
                        onclick="
                        garsonMenusuAc(${masa})
                        ">

                        👨‍🍳 GARSON SİPARİŞİ

                    </button>

                    <button
                        class="oturum-kapat-btn"
                        onclick="
                        masaOturumuKapat(
                            '${oturum.id}',
                            ${masa}
                        )
                        ">

                        🔴 OTURUMU KAPAT

                    </button>

                `;

            }


            siparislerMasa.forEach(
                (s,i)=>{

                    html +=
                        siparisHTML(
                            s,
                            i
                        );

                }
            );


            if(
                siparislerMasa.length===0 &&
                oturum
            ){

                html += `

                    <div class="bos">

                        Henüz bekleyen sipariş yok.

                    </div>

                `;

            }


            div.innerHTML=html;

            grid.appendChild(div);

        }
    );

}


/* =========================
   OTURUMLARI DİNLE
========================= */

onSnapshot(

    collection(
        db,
        "oturumlar"
    ),

    snapshot=>{

        oturumlar={};

        snapshot.forEach(
            item=>{

                oturumlar[item.id]=
                    item.data();

            }
        );

        masalariGoster();

    },

    error=>{

        console.error(error);

        document.getElementById(
            "baglanti"
        ).textContent =
            "🔴 Firebase bağlantı hatası";

    }

);


/* =========================
   SİPARİŞLERİ DİNLE
========================= */

onSnapshot(

    collection(
        db,
        "siparisler"
    ),

    snapshot=>{

        siparisler=[];

        snapshot.forEach(
            item=>{

                const data =
                    item.data();

                if(
                    data.durum==="Bekleyen"
                ){

                    siparisler.push({

                        id:item.id,
                        ...data

                    });

                }

            }
        );

        siparisler.sort(
            (a,b)=>
                zaman(a)-zaman(b)
        );

        document.getElementById(
            "baglanti"
        ).textContent =
            "🟢 Firebase bağlantısı aktif";

        masalariGoster();

    },

    error=>{

        console.error(error);

        document.getElementById(
            "baglanti"
        ).textContent =
            "🔴 Firebase bağlantı hatası";

        document.getElementById(
            "bilgi"
        ).textContent =
            "Siparişler okunamadı: "+
            error.message;

    }

);
