<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garson / Ocak Ekranı</title>
    <style>
        body { font-family: Arial, sans-serif; background: #222; color: white; margin: 0; padding: 15px; }
        .header { background: #d32f2f; padding: 15px; text-align: center; border-radius: 8px; margin-bottom: 20px; }
        .ocak-card { background: #333; color: white; padding: 15px; margin-bottom: 12px; border-left: 8px solid #ffeb3b; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        .ocak-card strong { font-size: 20px; color: #ffeb3b; }
        .btn-tamam { background: #388e3c; color: white; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .btn-tamam:active { background: #1b5e20; }
    </style>
</head>
<body>

<div class="header">
    <h2 style="margin:0;">☕ OCAK & GARSON BİLDİRİM PANELİ</h2>
    <small>Gelen Çağrılar Anlık Olarak Aşağıya Düşer</small>
</div>

<div id="bildirimListesi">Çağrılar Yükleniyor...</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "dijitalkahve-67f0a.firebaseapp.com",
        databaseURL: "https://dijitalkahve-67f0a-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "dijitalkahve-67f0a",
        storageBucket: "dijitalkahve-67f0a.appspot.com",
        messagingSenderId: "326476599239",
        appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Bildirimleri Dinle
    onValue(ref(db, 'bildirimler'), (snapshot) => {
        const data = snapshot.val();
        const container = document.getElementById('bildirimListesi');
        container.innerHTML = '';

        if(data) {
            Object.keys(data).forEach(key => {
                const item = data[key];
                container.innerHTML += `
                    <div class="ocak-card">
                        <div>
                            <strong>MASA ${item.masa}</strong> <br>
                            <span style="font-size:14px; color:#ccc;">Saat: ${item.zaman}</span>
                        </div>
                        <button class="btn-tamam" onclick="bildirimSil('${key}')">GİDİLDİ / SİL</button>
                    </div>`;
            });
        } else {
            container.innerHTML = '<p style="text-align:center; color:#888; margin-top:30px;">Şu an bekleyen çağrı yok.</p>';
        }
    });

    window.bildirimSil = (id) => remove(ref(db, 'bildirimler/' + id));
</script>
</body>
</html>
