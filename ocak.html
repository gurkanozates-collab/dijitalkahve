<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dijital Kahvem - Garson Paneli</title>

<style>

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f0ed;
    color:#33231e;
}


/* ==============================
   HEADER
============================== */

header{
    background:#4e342e;
    color:white;
    padding:18px 12px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:28px;
}

header p{
    margin:6px 0 0;
}


/* ==============================
   ÜST BİLGİ
============================== */

.ust-bilgi{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:12px;
    background:white;
    box-shadow:0 2px 8px #0001;

    position:sticky;
    top:0;
    z-index:1000;
}

.durum{
    font-weight:bold;
    color:#2e7d32;
}

.yenile{
    border:0;
    background:#1565c0;
    color:white;
    padding:10px 15px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}


/* ==============================
   ANA BAŞLIK
============================== */

.ana-baslik{
    max-width:1500px;
    margin:auto;
    padding:15px 12px 5px;
}

.ana-baslik h2{
    margin:0;
    font-size:24px;
}

.ana-baslik p{
    margin:6px 0;
    color:#777;
}


/* ==============================
   MASA ALANI
============================== */

.container{
    max-width:1500px;
    margin:auto;
    padding:12px;
}

.masa-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:14px;
    align-items:start;
}


/* ==============================
   MASA
============================== */

.masa{
    background:white;
    border-radius:14px;
    padding:14px;

    box-shadow:0 2px 9px #0001;

    border:2px solid #e4dfdc;

    min-height:150px;

    position:relative;

    transition:
        transform .30s ease,
        box-shadow .30s ease,
        opacity .30s ease,
        filter .30s ease;

    cursor:pointer;

    z-index:1;
}


/* ==============================
   BEKLEYEN MASA
============================== */

.masa.bekleyen{
    border-color:#ef6c00;

    box-shadow:
        0 3px 14px #ef6c0035;
}


/* ==============================
   EN SON SİPARİŞ GELEN MASA
============================== */

.masa.en-yeni{
    border-color:#d84315;

    box-shadow:
        0 0 0 3px #ff980030,
        0 5px 18px #ef6c0040;
}


/* ==============================
   AKTİF MASA
============================== */

.masa.aktif-masa{
    transform:scale(1.10);

    box-shadow:
        0 18px 45px #0005;

    z-index:100;

    border-color:#7b1fa2;
}


/* ==============================
   DİĞER MASALAR
============================== */

.masa.pasif-masa{
    transform:scale(.94);

    opacity:.65;

    filter:saturate(.75);
}


/* ==============================
   MASA BAŞLIK
============================== */

.masa-baslik{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:6px;
    margin-bottom:10px;
}

.masa-baslik h2{
    margin:0;
    font-size:20px;
}

.masa-durum{
    font-size:12px;
    font-weight:bold;

    padding:6px 9px;

    border-radius:20px;

    white-space:nowrap;

    background:#eee;
    color:#777;
}

.masa-durum.bekleyen{
    background:#fff3cd;
    color:#ef6c00;
}


/* ==============================
   YENİ SİPARİŞ ETİKETİ
============================== */

.yeni-etiket{
    display:inline-block;

    margin-bottom:7px;

    padding:4px 8px;

    border-radius:15px;

    background:#ef6c00;

    color:white;

    font-size:11px;

    font-weight:bold;
}


/* ==============================
   BOŞ MASA
============================== */

.bos{
    text-align:center;

    padding:22px 5px;

    color:#999;

    font-size:14px;
}


/* ==============================
   SİPARİŞ
============================== */

.siparis{
    border:1px solid #ddd;

    border-left:5px solid #ef6c00;

    border-radius:10px;

    padding:11px;

    margin-top:10px;

    background:#fffdfa;
}


/* ==============================
   SİPARİŞ BAŞLIK
============================== */

.siparis-baslik{
    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:5px;

    margin-bottom:7px;
}

.siparis-no{
    font-weight:bold;
    color:#4e342e;
}

.siparis-durum{
    font-size:12px;
    font-weight:bold;
    color:#ef6c00;
}


/* ==============================
   SİPARİŞ SAATİ
============================== */

.siparis-zaman{
    font-size:13px;

    color:#666;

    margin-bottom:8px;
}


/* ==============================
   ÜRÜNLER
============================== */

.urun{
    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:8px;

    padding:7px 0;

    border-bottom:1px solid #eee;
}

.urun:last-child{
    border-bottom:0;
}

.urun-ad{
    font-weight:bold;
}

.urun-fiyat{
    color:#777;

    font-size:12px;

    margin-top:2px;
}


/* ==============================
   TOPLAM
============================== */

.siparis-toplam{
    text-align:right;

    font-size:17px;

    font-weight:bold;

    margin-top:9px;

    color:#33231e;
}


/* ==============================
   BUTONLAR
============================== */

.butons{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:7px;

    margin-top:10px;
}

.btn{
    border:0;

    border-radius:8px;

    padding:11px 5px;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;
}

.duzenle{
    background:#ffb300;
    color:#33231e;
}

.onayla{
    background:#2e7d32;
    color:white;
}


/* ==============================
   DÜZENLEME
============================== */

.duzenleme{
    display:none;

    margin-top:10px;

    padding:10px;

    background:#fafafa;

    border-radius:9px;
}

.duzenleme.acik{
    display:block;
}

.duzen-urun{
    display:grid;

    grid-template-columns:1fr auto;

    gap:8px;

    align-items:center;

    padding:8px 0;

    border-bottom:1px solid #ddd;
}

.adet-kontrol{
    display:flex;

    align-items:center;

    gap:5px;
}

.adet-kontrol button{
    width:34px;
    height:34px;

    border:0;

    border-radius:6px;

    background:#ddd;

    font-size:20px;

    font-weight:bold;

    cursor:pointer;
}

.adet-sayi{
    width:30px;

    text-align:center;

    font-weight:bold;
}

.duzen-alt{
    margin-top:10px;
}

.kaydet{
    width:100%;

    border:0;

    background:#1565c0;

    color:white;

    padding:11px;

    border-radius:7px;

    font-weight:bold;

    cursor:pointer;
}


/* ==============================
   YENİ SİPARİŞ ANİMASYONU
============================== */

.masa.yeni-siparis{
    animation:
        yeniSiparis 1s ease-in-out 3;
}

@keyframes yeniSiparis{

    0%{
        box-shadow:
            0 0 0 #ef6c0000;
    }

    50%{
        box-shadow:
            0 0 28px #ef6c0070;
    }

    100%{
        box-shadow:
            0 0 0 #ef6c0000;
    }

}


/* ==============================
   MOBİL
============================== */

@media(max-width:1100px){

    .masa-grid{
        grid-template-columns:
            repeat(3,1fr);
    }

}

@media(max-width:750px){

    .masa-grid{
        grid-template-columns:
            repeat(2,1fr);
    }

}

@media(max-width:500px){

    .masa-grid{
        grid-template-columns:
            1fr;
    }

    .ust-bilgi{
        position:relative;
    }

    .masa.aktif-masa{
        transform:
            scale(1.03);
    }

    .masa.pasif-masa{
        transform:
            scale(.98);

        opacity:.85;
    }

}

</style>
</head>


<body>


<!-- ==============================
     HEADER
============================== -->

<header>

    <h1>
        ☕ DİJİTAL KAHVEM
    </h1>

    <p>
        Garson Paneli
    </p>

</header>


<!-- ==============================
     ÜST BİLGİ
============================== -->

<div class="ust-bilgi">

    <div
    class="durum"
    id="baglantiDurumu">

        🟡 Firebase bağlantısı kuruluyor...

    </div>


    <button
    class="yenile"
    onclick="location.reload()">

        🔄 Yenile

    </button>

</div>


<!-- ==============================
     ANA BAŞLIK
============================== -->

<div class="ana-baslik">

    <h2>
        🪑 Masalar
    </h2>

    <p id="bekleyenBilgi">

        Bekleyen siparişler yükleniyor...

    </p>

</div>


<!-- ==============================
     MASALAR
============================== -->

<div class="container">

    <div
    id="masaGrid"
    class="masa-grid">
    </div>

</div>


<script type="module">


/* ==================================================
   FIREBASE
================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getFirestore,
    collection,
    query,
    onSnapshot,
    doc,
    updateDoc,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* ==================================================
   FIREBASE CONFIG
================================================== */

const firebaseConfig={

    apiKey:
    "AIzaSyC05yXQzAlF2AYzzeaJrDdMUYKwohKOsWM",

    authDomain:
    "dijitalkahve-67f0a.firebaseapp.com",

    databaseURL:
    "https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
    "dijitalkahve-67f0a",

    storageBucket:
    "dijitalkahve-67f0a.firebasestorage.app",

    messagingSenderId:
    "326476599239",

    appId:
    "1:326476599239:web:143f39583a3478118853e2",

    measurementId:
    "G-WM65PC4648"

};


const app=
initializeApp(
    firebaseConfig
);


const db=
getFirestore(app);


/* ==================================================
   FİYATLAR
================================================== */

const fiyatlar={

    "Çay":25,

    "Nescafe":60,

    "Türk Kahvesi":70,

    "Su":15,

    "Kola":50,

    "Fanta":50,

    "Tost":100

};


/* ==================================================
   50 MASA
================================================== */

const masaSayisi=50;


/* ==================================================
   DEĞİŞKENLER
================================================== */

let tumSiparisler=[];

const duzenlemeler={};


/* ==================================================
   FIREBASE SİPARİŞLERİ DİNLE
================================================== */

const siparisQuery=
query(
    collection(
        db,
        "siparisler"
    )
);


onSnapshot(

    siparisQuery,

    snapshot=>{

        tumSiparisler=[];


        snapshot.forEach(
            item=>{

                tumSiparisler.push({

                    id:item.id,

                    ...item.data()

                });

            }
        );


        /*
           SADECE BEKLEYEN SİPARİŞLER
        */

        const bekleyen=
        tumSiparisler.filter(
            s=>
            s.durum==="Bekleyen"
        );


        /*
           ESKİDEN YENİYE SIRALA
        */

        bekleyen.sort(
            (a,b)=>{

                const ta=
                zamanDegeri(a);

                const tb=
                zamanDegeri(b);

                return ta-tb;

            }
        );


        /*
           FIREBASE AKTİF
        */

        document.getElementById(
            "baglantiDurumu"
        ).textContent=
        "🟢 Firebase bağlantısı aktif";


        /*
           BEKLEYEN SAYISI
        */

        document.getElementById(
            "bekleyenBilgi"
        ).textContent=
        bekleyen.length+
        " adet bekleyen sipariş var";


        /*
           MASALARI OLUŞTUR
        */

        masalariGoster();

    },

    error=>{

        console.error(error);


        document.getElementById(
            "baglantiDurumu"
        ).textContent=
        "🔴 Firebase bağlantı hatası";


        document.getElementById(
            "bekleyenBilgi"
        ).textContent=
        "Firebase bağlantısı kurulamadı";

    }

);


/* ==================================================
   ZAMAN DEĞERİ
================================================== */

function zamanDegeri(
    siparis
){

    if(
        siparis.olusturmaZamani
    ){

        if(
            typeof
            siparis.olusturmaZamani
            .toMillis===
            "function"
        ){

            return siparis
            .olusturmaZamani
            .toMillis();

        }

    }


    /*
       Alternatif alanlar
    */

    if(
        siparis.zaman
    ){

        const t=
        new Date(
            siparis.zaman
        ).getTime();


        if(
            !isNaN(t)
        ){

            return t;

        }

    }


    return 0;

}


/* ==================================================
   MASALARI GÖSTER
================================================== */

function masalariGoster(){

    const grid=
    document.getElementById(
        "masaGrid"
    );


    grid.innerHTML="";


    /*
       SADECE BEKLEYENLER
    */

    const bekleyenSiparisler=
    tumSiparisler.filter(
        s=>
        s.durum==="Bekleyen"
    );


    /*
       =============================================
       BEKLEYEN MASALARI BUL
       =============================================
    */

    const bekleyenMasalar=[];


    bekleyenSiparisler.forEach(
        siparis=>{

            const masa=
            String(
                siparis.masa
            );


            /*
               Aynı masayı sadece bir kez ekle
            */

            if(
                !bekleyenMasalar.includes(
                    masa
                )
            ){

                bekleyenMasalar.push(
                    masa
                );

            }

        }
    );


    /*
       =============================================
       HER MASANIN SON SİPARİŞ ZAMANI
       =============================================
    */

    const masaSonZaman={};


    bekleyenMasalar.forEach(
        masa=>{

            const siparisler=
            bekleyenSiparisler.filter(
                s=>
                String(s.masa)===
                masa
            );


            masaSonZaman[masa]=
            Math.max(
                ...siparisler.map(
                    s=>
                    zamanDegeri(s)
                )
            );

        }
    );


    /*
       =============================================
       BEKLEYEN MASALARI
       EN YENİDEN ESKİYE SIRALA
       =============================================
    */

    bekleyenMasalar.sort(
        (a,b)=>
        masaSonZaman[b]-
        masaSonZaman[a]
    );


    /*
       =============================================
       BOŞ MASALAR
       =============================================
    */

    const bosMasalar=[];


    for(
        let masa=1;
        masa<=masaSayisi;
        masa++
    ){

        const no=
        String(masa);


        if(
            !bekleyenMasalar.includes(
                no
            )
        ){

            bosMasalar.push(
                no
            );

        }

    }


    /*
       =============================================
       SIRALAMA
       
       1. Bekleyen masalar
       2. Boş masalar
       =============================================
    */

    const siraliMasalar=[
        ...bekleyenMasalar,
        ...bosMasalar
    ];


    /*
       =============================================
       MASALARI OLUŞTUR
       =============================================
    */

    siraliMasalar.forEach(
        (masaNo,masaSirasi)=>{


            const siparisler=
            bekleyenSiparisler.filter(
                s=>
                String(s.masa)===
                String(masaNo)
            );


            const masaDiv=
            document.createElement(
                "div"
            );


            masaDiv.className=
            "masa";


            masaDiv.dataset.masa=
            masaNo;


            /*
               BEKLEYEN VAR
            */

            if(
                siparisler.length>0
            ){

                masaDiv.classList.add(
                    "bekleyen"
                );

            }


            /*
               İLK MASA =
               EN YENİ SİPARİŞ
            */

            if(
                masaSirasi===0 &&
                siparisler.length>0
            ){

                masaDiv.classList.add(
                    "en-yeni"
                );

            }


            /*
               SON SİPARİŞ ZAMANI
            */

            let sonSiparisText="";


            if(
                siparisler.length>0
            ){

                const sonSiparis=
                [...siparisler]
                .sort(
                    (a,b)=>
                    zamanDegeri(b)-
                    zamanDegeri(a)
                )[0];


                sonSiparisText=
                saatGoster(
                    sonSiparis
                );

            }


            masaDiv.innerHTML=`

                <div class="masa-baslik">

                    <h2>
                        🪑 Masa ${masaNo}
                    </h2>


                    <span
                    class="masa-durum ${
                        siparisler.length>0
                        ?
                        "bekleyen"
                        :
                        ""
                    }">

                        ${
                            siparisler.length>0
                            ?
                            "🟡 "+
                            siparisler.length+
                            " Bekleyen"
                            :
                            "Boş"
                        }

                    </span>

                </div>

            `;


            /*
               YENİ MASA BİLGİSİ
            */

            if(
                siparisler.length>0
            ){

                masaDiv.innerHTML+=`

                    <div class="yeni-etiket">

                        🔔 Son sipariş:
                        ${sonSiparisText}

                    </div>

                `;

            }


            /*
               BOŞ MASA
            */

            if(
                siparisler.length===0
            ){

                masaDiv.innerHTML+=`

                    <div class="bos">

                        Bekleyen sipariş yok.

                    </div>

                `;

            }


            /*
               BEKLEYEN SİPARİŞLER
               
               HER BİRİ AYRI
            */

            else{

                siparisler.forEach(
                    (siparis,index)=>{

                        masaDiv.innerHTML+=
                        siparisHTML(
                            siparis,
                            index
                        );

                    }
                );

            }


            grid.appendChild(
                masaDiv
            );

        }
    );


    /*
       HOVER
    */

    hoverSistemi();

}


/* ==================================================
   SAAT GÖSTER
================================================== */

function saatGoster(
    siparis
){

    if(
        siparis.olusturmaZamani
    ){

        if(
            typeof
            siparis.olusturmaZamani
            .toDate===
            "function"
        ){

            const tarih=
            siparis
            .olusturmaZamani
            .toDate();


            return tarih.toLocaleTimeString(
                "tr-TR",
                {

                    hour:"2-digit",

                    minute:"2-digit",

                    second:"2-digit"

                }
            );

        }

    }


    if(
        siparis.zaman
    ){

        const tarih=
        new Date(
            siparis.zaman
        );


        if(
            !isNaN(
                tarih.getTime()
            )
        ){

            return tarih.toLocaleTimeString(
                "tr-TR",
                {

                    hour:"2-digit",

                    minute:"2-digit",

                    second:"2-digit"

                }
            );

        }

    }


    return "--:--:--";

}


/* ==================================================
   HOVER SİSTEMİ
================================================== */

function hoverSistemi(){

    const masalar=
    document.querySelectorAll(
        ".masa"
    );


    masalar.forEach(
        masa=>{

            masa.addEventListener(
                "mouseenter",
                ()=>{

                    if(
                        window.innerWidth<=500
                    ){

                        return;

                    }


                    /*
                       DİĞER MASALARI PASİF
                    */

                    masalar.forEach(
                        m=>{

                            if(
                                m!==masa
                            ){

                                m.classList.add(
                                    "pasif-masa"
                                );

                                m.classList.remove(
                                    "aktif-masa"
                                );

                            }

                        }
                    );


                    /*
                       AKTİF
                    */

                    masa.classList.remove(
                        "pasif-masa"
                    );

                    masa.classList.add(
                        "aktif-masa"
                    );


                    /*
                       MASAYI EKRANIN
                       ORTASINA YAKLAŞTIR
                    */

                    setTimeout(
                        ()=>{

                            const rect=
                            masa.getBoundingClientRect();


                            const masaX=
                            rect.left+
                            rect.width/2;


                            const masaY=
                            rect.top+
                            rect.height/2;


                            const ekranX=
                            window.innerWidth/2;


                            const ekranY=
                            window.innerHeight/2;


                            const farkX=
                            masaX-ekranX;


                            const farkY=
                            masaY-ekranY;


                            window.scrollBy({

                                left:farkX,

                                top:farkY,

                                behavior:"smooth"

                            });

                        },
                        50
                    );

                }
            );


            masa.addEventListener(
                "mouseleave",
                ()=>{

                    setTimeout(
                        ()=>{

                            if(
                                document.querySelector(
                                    ".masa:hover"
                                )
                            ){

                                return;

                            }


                            masalar.forEach(
                                m=>{

                                    m.classList.remove(
                                        "aktif-masa"
                                    );

                                    m.classList.remove(
                                        "pasif-masa"
                                    );

                                }
                            );

                        },
                        100
                    );

                }
            );

        }
    );

}


/* ==================================================
   SİPARİŞ HTML
================================================== */

function siparisHTML(
    siparis,
    index
){

    const zaman=
    saatGoster(
        siparis
    );


    let urunler="";


    (
        siparis.urunler||[]
    ).forEach(
        u=>{

            const fiyat=
            Number(
                u.fiyat||
                fiyatlar[u.urun]||
                0
            );


            const adet=
            Number(
                u.adet||0
            );


            urunler+=`

                <div class="urun">

                    <div>

                        <div class="urun-ad">

                            ${u.urun}

                        </div>


                        <div class="urun-fiyat">

                            ${fiyat} ₺ × ${adet}

                        </div>

                    </div>


                    <b>

                        ${fiyat*adet} ₺

                    </b>

                </div>

            `;

        }
    );


    return `

        <div
        class="siparis"
        id="siparis-${siparis.id}"
        >

            <div class="siparis-baslik">

                <span class="siparis-no">

                    Sipariş #${index+1}

                </span>


                <span class="siparis-durum">

                    🟡 Bekleyen

                </span>

            </div>


            <div class="siparis-zaman">

                🕐 ${zaman}

            </div>


            ${urunler}


            <div class="siparis-toplam">

                Toplam:
                ${Number(
                    siparis.toplam||0
                )} ₺

            </div>


            <div class="butons">

                <button
                class="btn duzenle"
                onclick="
                    duzenleAc('${siparis.id}')
                "
                >

                    ✏️ Düzenle

                </button>


                <button
                class="btn onayla"
                onclick="
                    siparisOnayla('${siparis.id}')
                "
                >

                    🟢 Onayla

                </button>

            </div>


            <div
            id="duzen-${siparis.id}"
            class="duzenleme"
            >

                ${duzenHTML(siparis)}

            </div>

        </div>

    `;

}


/* ==================================================
   DÜZENLEME HTML
================================================== */

function duzenHTML(
    siparis
){

    let html="";


    (
        siparis.urunler||[]
    ).forEach(
        (u,index)=>{

            const adet=
            Number(
                u.adet||0
            );


            const fiyat=
            Number(
                u.fiyat||
                fiyatlar[u.urun]||
                0
            );


            html+=`

                <div class="duzen-urun">

                    <div>

                        <b>

                            ${u.urun}

                        </b>

                        <br>

                        <small>

                            ${fiyat} ₺

                        </small>

                    </div>


                    <div class="adet-kontrol">

                        <button
                        onclick="
                            duzenAdet(
                                '${siparis.id}',
                                ${index},
                                -1
                            )
                        "
                        >

                            −

                        </button>


                        <span
                        class="adet-sayi"
                        id="
                            adet-${siparis.id}-${index}
                        "
                        >

                            ${adet}

                        </span>


                        <button
                        onclick="
                            duzenAdet(
                                '${siparis.id}',
                                ${index},
                                1
                            )
                        "
                        >

                            +

                        </button>

                    </div>

                </div>

            `;

        }
    );


    html+=`

        <div class="duzen-alt">

            <button
            class="kaydet"
            onclick="
                duzenKaydet('${siparis.id}')
            "
            >

                💾 Değişiklikleri Kaydet

            </button>

        </div>

    `;


    return html;

}


/* ==================================================
   DÜZENLE AÇ
================================================== */

window.duzenleAc=
function(id){

    const el=
    document.getElementById(
        "duzen-"+id
    );


    if(!el)
    return;


    el.classList.toggle(
        "acik"
    );

};


/* ==================================================
   ADET DEĞİŞTİR
================================================== */

window.duzenAdet=
function(
    siparisId,
    urunIndex,
    degisim
){

    const siparis=
    tumSiparisler.find(
        s=>
        s.id===
        siparisId
    );


    if(!siparis)
    return;


    if(
        !duzenlemeler[siparisId]
    ){

        duzenlemeler[siparisId]=
        JSON.parse(
            JSON.stringify(
                siparis.urunler||[]
            )
        );

    }


    const urun=
    duzenlemeler[siparisId]
    [urunIndex];


    if(!urun)
    return;


    urun.adet=
    Math.max(
        0,
        Number(
            urun.adet||0
        )+
        degisim
    );


    const span=
    document.getElementById(
        `adet-${siparisId}-${urunIndex}`
    );


    if(span){

        span.textContent=
        urun.adet;

    }

};


/* ==================================================
   DÜZENLEMEYİ KAYDET
================================================== */

window.duzenKaydet=
async function(id){

    const siparis=
    tumSiparisler.find(
        s=>
        s.id===
        id
    );


    if(!siparis)
    return;


    const yeniUrunler=
    duzenlemeler[id]||
    siparis.urunler||
    [];


    const temizUrunler=
    yeniUrunler.filter(
        u=>
        Number(
            u.adet||0
        )>0
    );


    let yeniToplam=0;


    temizUrunler.forEach(
        u=>{

            const fiyat=
            Number(
                u.fiyat||
                fiyatlar[u.urun]||
                0
            );


            u.fiyat=
            fiyat;


            u.tutar=
            fiyat*
            Number(
                u.adet||0
            );


            yeniToplam+=
            u.tutar;

        }
    );


    try{

        await updateDoc(

            doc(
                db,
                "siparisler",
                id
            ),

            {

                urunler:
                temizUrunler,

                toplam:
                yeniToplam,

                duzenlendi:
                true,

                duzenlenmeZamani:
                serverTimestamp()

            }

        );


        delete duzenlemeler[id];


        alert(
            "✅ Sipariş düzenlendi."
        );

    }
    catch(error){

        console.error(error);


        alert(
            "❌ Sipariş düzenlenemedi.\n\n"+
            error.message
        );

    }

};


/* ==================================================
   SİPARİŞ ONAYLA
================================================== */

window.siparisOnayla=
async function(id){

    const siparis=
    tumSiparisler.find(
        s=>
        s.id===
        id
    );


    if(!siparis)
    return;


    if(
        siparis.durum!==
        "Bekleyen"
    ){

        return;

    }


    const onay=
    confirm(
        "Masa "+
        siparis.masa+
        " siparişini onaylamak istiyor musunuz?"
    );


    if(!onay)
    return;


    try{

        await updateDoc(

            doc(
                db,
                "siparisler",
                id
            ),

            {

                durum:
                "Onaylandı",

                onaylanmaZamani:
                serverTimestamp()

            }

        );


        /*
           ÖNEMLİ:
           Burada sipariş silinmiyor.

           Sadece durum:
           Bekleyen → Onaylandı

           yapılıyor.

           Böylece müşteri panelindeki
           sipariş geçmişi korunuyor.

           Firebase onSnapshot tekrar
           çalışıyor ve bu sipariş
           garson ekranından otomatik
           olarak çıkıyor.
        */

    }
    catch(error){

        console.error(error);


        alert(
            "❌ Sipariş onaylanamadı.\n\n"+
            error.message
        );

    }

};


/* ==================================================
   MOBİL / EKRAN BOYUTU
================================================== */

window.addEventListener(
    "resize",
    ()=>{

        if(
            window.innerWidth<=500
        ){

            document
            .querySelectorAll(".masa")
            .forEach(
                m=>{

                    m.classList.remove(
                        "aktif-masa"
                    );

                    m.classList.remove(
                        "pasif-masa"
                    );

                }
            );

        }

    }
);

</script>
