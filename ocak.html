<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dijital Kahvem - Garson Paneli</title>

<style>

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f0ed;
    color:#33231e;
}


/* ==================================================
   HEADER
================================================== */

header{
    background:#4e342e;
    color:white;
    padding:18px 12px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:28px;
}

header p{
    margin:6px 0 0;
}


/* ==================================================
   ÜST BİLGİ
================================================== */

.ust-bilgi{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:12px;
    background:white;
    box-shadow:0 2px 8px #0001;

    position:sticky;
    top:0;
    z-index:1000;
}

.durum{
    font-weight:bold;
    color:#2e7d32;
}

.ust-butonlar{
    display:flex;
    gap:8px;
}

.yenile,
.garson-siparis-btn{
    border:0;
    color:white;
    padding:10px 15px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.yenile{
    background:#1565c0;
}

.garson-siparis-btn{
    background:#ef6c00;
}


/* ==================================================
   BAŞLIK
================================================== */

.ana-baslik{
    max-width:1500px;
    margin:auto;
    padding:15px 12px 5px;
}

.ana-baslik h2{
    margin:0;
    font-size:24px;
}

.ana-baslik p{
    margin:6px 0;
    color:#777;
}


/* ==================================================
   MASALAR
================================================== */

.container{
    max-width:1500px;
    margin:auto;
    padding:12px;
}

.masa-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:14px;
    align-items:start;
}

.masa{
    background:white;
    border-radius:14px;
    padding:14px;

    box-shadow:0 2px 9px #0001;

    border:2px solid #e4dfdc;

    min-height:150px;

    position:relative;

    transition:
        transform .30s ease,
        box-shadow .30s ease,
        opacity .30s ease,
        filter .30s ease;

    cursor:pointer;

    z-index:1;
}

.masa.bekleyen{
    border-color:#ef6c00;

    box-shadow:
        0 3px 14px #ef6c0035;
}

.masa.en-yeni{
    border-color:#d84315;

    box-shadow:
        0 0 0 3px #ff980030,
        0 5px 18px #ef6c0040;
}

.masa.aktif-masa{
    transform:scale(1.10);

    box-shadow:
        0 18px 45px #0005;

    z-index:100;

    border-color:#7b1fa2;
}

.masa.pasif-masa{
    transform:scale(.94);
    opacity:.65;
    filter:saturate(.75);
}


/* ==================================================
   MASA BAŞLIK
================================================== */

.masa-baslik{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:6px;
    margin-bottom:10px;
}

.masa-baslik h2{
    margin:0;
    font-size:20px;
}

.masa-durum{
    font-size:12px;
    font-weight:bold;

    padding:6px 9px;

    border-radius:20px;

    white-space:nowrap;

    background:#eee;
    color:#777;
}

.masa-durum.bekleyen{
    background:#fff3cd;
    color:#ef6c00;
}


/* ==================================================
   YENİ ETİKET
================================================== */

.yeni-etiket{
    display:inline-block;

    margin-bottom:7px;

    padding:4px 8px;

    border-radius:15px;

    background:#ef6c00;

    color:white;

    font-size:11px;

    font-weight:bold;
}


/* ==================================================
   BOŞ MASA
================================================== */

.bos{
    text-align:center;

    padding:22px 5px;

    color:#999;

    font-size:14px;
}


/* ==================================================
   SİPARİŞ
================================================== */

.siparis{
    border:1px solid #ddd;

    border-left:5px solid #ef6c00;

    border-radius:10px;

    padding:11px;

    margin-top:10px;

    background:#fffdfa;
}

.siparis-baslik{
    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:5px;

    margin-bottom:7px;
}

.siparis-no{
    font-weight:bold;
    color:#4e342e;
}

.siparis-durum{
    font-size:12px;
    font-weight:bold;
    color:#ef6c00;
}

.siparis-kaynak{
    display:inline-block;

    margin-bottom:7px;

    padding:4px 7px;

    border-radius:12px;

    background:#e3f2fd;

    color:#1565c0;

    font-size:11px;

    font-weight:bold;
}

.siparis-zaman{
    font-size:13px;

    color:#666;

    margin-bottom:8px;
}


/* ==================================================
   ÜRÜNLER
================================================== */

.urun{
    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:8px;

    padding:7px 0;

    border-bottom:1px solid #eee;
}

.urun:last-child{
    border-bottom:0;
}

.urun-ad{
    font-weight:bold;
}

.urun-fiyat{
    color:#777;

    font-size:12px;

    margin-top:2px;
}


/* ==================================================
   TOPLAM
================================================== */

.siparis-toplam{
    text-align:right;

    font-size:17px;

    font-weight:bold;

    margin-top:9px;
}


/* ==================================================
   BUTONLAR
================================================== */

.butons{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:7px;

    margin-top:10px;
}

.btn{
    border:0;

    border-radius:8px;

    padding:11px 5px;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;
}

.duzenle{
    background:#ffb300;
    color:#33231e;
}

.onayla{
    background:#2e7d32;
    color:white;
}


/* ==================================================
   DÜZENLEME
================================================== */

.duzenleme{
    display:none;

    margin-top:10px;

    padding:10px;

    background:#fafafa;

    border-radius:9px;
}

.duzenleme.acik{
    display:block;
}

.duzen-urun{
    display:grid;

    grid-template-columns:1fr auto;

    gap:8px;

    align-items:center;

    padding:8px 0;

    border-bottom:1px solid #ddd;
}

.adet-kontrol{
    display:flex;

    align-items:center;

    gap:5px;
}

.adet-kontrol button{
    width:34px;
    height:34px;

    border:0;

    border-radius:6px;

    background:#ddd;

    font-size:20px;

    font-weight:bold;

    cursor:pointer;
}

.adet-sayi{
    width:30px;

    text-align:center;

    font-weight:bold;
}

.duzen-alt{
    margin-top:10px;
}

.kaydet{
    width:100%;

    border:0;

    background:#1565c0;

    color:white;

    padding:11px;

    border-radius:7px;

    font-weight:bold;

    cursor:pointer;
}


/* ==================================================
   GARSON SİPARİŞ MODAL
================================================== */

.modal{
    display:none;

    position:fixed;

    inset:0;

    background:#0008;

    z-index:5000;

    padding:20px;

    overflow-y:auto;
}

.modal.acik{
    display:flex;

    align-items:center;

    justify-content:center;
}

.modal-kutu{
    width:100%;

    max-width:600px;

    max-height:90vh;

    overflow-y:auto;

    background:white;

    border-radius:18px;

    padding:20px;

    box-shadow:
        0 20px 60px #0006;
}

.modal-baslik{
    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:10px;

    margin-bottom:15px;
}

.modal-baslik h2{
    margin:0;
}

.kapat{
    width:40px;
    height:40px;

    border:0;

    border-radius:50%;

    background:#eee;

    font-size:22px;

    cursor:pointer;
}


/* ==================================================
   MASA SEÇ
================================================== */

.masa-secim-baslik{
    font-weight:bold;

    margin-bottom:8px;
}

.masa-select{
    width:100%;

    padding:13px;

    border:2px solid #ddd;

    border-radius:10px;

    font-size:17px;

    background:white;

    margin-bottom:18px;
}


/* ==================================================
   ÜRÜN SEÇİMİ
================================================== */

.urun-listesi{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:10px;
}

.garson-urun{
    border:2px solid #ddd;

    background:white;

    border-radius:12px;

    padding:13px;

    cursor:pointer;

    transition:.2s;
}

.garson-urun:hover{
    border-color:#ef6c00;
}

.garson-urun.secili{
    border-color:#ef6c00;

    background:#fff3e0;
}

.garson-urun-ust{
    display:flex;

    justify-content:space-between;

    gap:5px;

    font-weight:bold;
}

.garson-urun-fiyat{
    color:#777;

    font-size:13px;

    margin-top:5px;
}

.garson-adet{
    display:flex;

    justify-content:center;

    align-items:center;

    gap:12px;

    margin-top:10px;
}

.garson-adet button{
    width:35px;
    height:35px;

    border:0;

    border-radius:8px;

    background:#ddd;

    font-size:20px;

    font-weight:bold;

    cursor:pointer;
}

.garson-adet span{
    min-width:25px;

    text-align:center;

    font-weight:bold;

    font-size:18px;
}


/* ==================================================
   GARSON SİPARİŞ ÖZETİ
================================================== */

.garson-ozet{
    margin-top:18px;

    padding:14px;

    background:#f8f5f3;

    border-radius:12px;
}

.garson-ozet h3{
    margin-top:0;
}

.ozet-satir{
    display:flex;

    justify-content:space-between;

    padding:6px 0;

    border-bottom:1px solid #ddd;
}

.ozet-toplam{
    display:flex;

    justify-content:space-between;

    margin-top:10px;

    font-size:20px;

    font-weight:bold;
}


/* ==================================================
   GÖNDER
================================================== */

.gonder{
    width:100%;

    margin-top:15px;

    border:0;

    background:#2e7d32;

    color:white;

    padding:15px;

    border-radius:10px;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;
}

.gonder:disabled{
    background:#aaa;

    cursor:not-allowed;
}


/* ==================================================
   YENİ SİPARİŞ ANİMASYONU
================================================== */

.masa.yeni-siparis{
    animation:
        yeniSiparis 1s ease-in-out 3;
}

@keyframes yeniSiparis{

    0%{
        box-shadow:0 0 0 #ef6c0000;
    }

    50%{
        box-shadow:0 0 28px #ef6c0070;
    }

    100%{
        box-shadow:0 0 0 #ef6c0000;
    }

}


/* ==================================================
   MOBİL
================================================== */

@media(max-width:1100px){

    .masa-grid{
        grid-template-columns:
            repeat(3,1fr);
    }

}

@media(max-width:750px){

    .masa-grid{
        grid-template-columns:
            repeat(2,1fr);
    }

}

@media(max-width:600px){

    .urun-listesi{
        grid-template-columns:1fr;
    }

}

@media(max-width:500px){

    .masa-grid{
        grid-template-columns:1fr;
    }

    .ust-bilgi{
        position:relative;
    }

    .ust-bilgi{
        flex-direction:column;
        align-items:stretch;
    }

    .ust-butonlar{
        width:100%;
    }

    .yenile,
    .garson-siparis-btn{
        flex:1;
    }

    .masa.aktif-masa{
        transform:scale(1.03);
    }

    .masa.pasif-masa{
        transform:scale(.98);
        opacity:.85;
    }

}

</style>
</head>


<body>


<!-- ==================================================
   HEADER
================================================== -->

<header>

    <h1>
        ☕ DİJİTAL KAHVEM
    </h1>

    <p>
        Garson Paneli
    </p>

</header>


<!-- ==================================================
   ÜST BİLGİ
================================================== -->

<div class="ust-bilgi">

    <div
    class="durum"
    id="baglantiDurumu">

        🟡 Firebase bağlantısı kuruluyor...

    </div>


    <div class="ust-butonlar">

        <button
        class="garson-siparis-btn"
        onclick="garsonSiparisAc()">

            ➕ Garson Siparişi

        </button>


        <button
        class="yenile"
        onclick="location.reload()">

            🔄 Yenile

        </button>

    </div>

</div>


<!-- ==================================================
   ANA BAŞLIK
================================================== -->

<div class="ana-baslik">

    <h2>
        🪑 Masalar
    </h2>

    <p id="bekleyenBilgi">

        Bekleyen siparişler yükleniyor...

    </p>

</div>


<!-- ==================================================
   MASALAR
================================================== -->

<div class="container">

    <div
    id="masaGrid"
    class="masa-grid">
    </div>

</div>


<!-- ==================================================
   GARSON SİPARİŞ MODALI
================================================== -->

<div
id="garsonModal"
class="modal">

    <div class="modal-kutu">


        <div class="modal-baslik">

            <h2>
                ➕ Garson Siparişi
            </h2>


            <button
            class="kapat"
            onclick="garsonSiparisKapat()">

                ×

            </button>

        </div>


        <!-- MASA -->

        <div class="masa-secim-baslik">

            Masa Seç

        </div>


        <select
        id="garsonMasa"
        class="masa-select">

            <option value="">

                Masa seçiniz

            </option>

        </select>


        <!-- ÜRÜNLER -->

        <div class="masa-secim-baslik">

            Ürünler

        </div>


        <div
        id="garsonUrunListesi"
        class="urun-listesi">
        </div>


        <!-- ÖZET -->

        <div
        id="garsonOzet"
        class="garson-ozet">

            <h3>
                Sipariş Özeti
            </h3>

            <div
            id="ozetIcerik">

                Henüz ürün seçilmedi.

            </div>

        </div>


        <button
        id="garsonGonderBtn"
        class="gonder"
        onclick="garsonSiparisGonder()"
        disabled>

            🛎️ Siparişi Gönder

        </button>

    </div>

</div>


<script type="module">


/* ==================================================
   FIREBASE
================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getFirestore,
    collection,
    query,
    onSnapshot,
    doc,
    updateDoc,
    addDoc,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* ==================================================
   FIREBASE CONFIG
================================================== */

const firebaseConfig={

    apiKey:
    "AIzaSyC05yXQzAlF2AYzzeaJrDdMUYKwohKOsWM",

    authDomain:
    "dijitalkahve-67f0a.firebaseapp.com",

    databaseURL:
    "https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
    "dijitalkahve-67f0a",

    storageBucket:
    "dijitalkahve-67f0a.firebasestorage.app",

    messagingSenderId:
    "326476599239",

    appId:
    "1:326476599239:web:143f39583a3478118853e2",

    measurementId:
    "G-WM65PC4648"

};


const app=
initializeApp(
    firebaseConfig
);


const db=
getFirestore(app);


/* ==================================================
   ÜRÜNLER
================================================== */

const fiyatlar={

    "Çay":25,

    "Nescafe":60,

    "Türk Kahvesi":70,

    "Su":15,

    "Kola":50,

    "Fanta":50,

    "Tost":100

};


/* ==================================================
   50 MASA
================================================== */

const masaSayisi=50;


/* ==================================================
   DEĞİŞKENLER
================================================== */

let tumSiparisler=[];

const duzenlemeler={};


/*
   Garson tarafından oluşturulacak
   sipariş sepeti
*/

let garsonSepet={};


/* ==================================================
   GARSON ÜRÜNLERİNİ OLUŞTUR
================================================== */

function garsonUrunleriniOlustur(){

    const alan=
    document.getElementById(
        "garsonUrunListesi"
    );


    alan.innerHTML="";


    Object.keys(fiyatlar)
    .forEach(
        urun=>{

            alan.innerHTML+=`

                <div
                class="garson-urun"
                data-urun="${urun}"
                onclick="
                    garsonUrunSec('${urun}')
                ">

                    <div
                    class="garson-urun-ust">

                        <span>

                            ${urun}

                        </span>


                        <span>

                            ${fiyatlar[urun]} ₺

                        </span>

                    </div>


                    <div
                    class="garson-urun-fiyat">

                        Adet seçmek için dokunun

                    </div>


                    <div class="garson-adet">

                        <button
                        onclick="
                            event.stopPropagation();
                            garsonAdetDegistir(
                                '${urun}',
                                -1
                            )
                        ">

                            −

                        </button>


                        <span
                        id="
                            garson-adet-${urun}
                        ">

                            0

                        </span>


                        <button
                        onclick="
                            event.stopPropagation();
                            garsonAdetDegistir(
                                '${urun}',
                                1
                            )
                        ">

                            +

                        </button>

                    </div>

                </div>

            `;

        }
    );

}


/* ==================================================
   GARSON MASALARINI OLUŞTUR
================================================== */

function garsonMasalariniOlustur(){

    const select=
    document.getElementById(
        "garsonMasa"
    );


    select.innerHTML=`

        <option value="">

            Masa seçiniz

        </option>

    `;


    for(
        let i=1;
        i<=masaSayisi;
        i++
    ){

        select.innerHTML+=`

            <option value="${i}">

                Masa ${i}

            </option>

        `;

    }

}


/* ==================================================
   MODALI AÇ
================================================== */

window.garsonSiparisAc=
function(
    masaNo=""
){

    garsonSepet={};


    garsonMasalariniOlustur();

    garsonUrunleriniOlustur();


    document.getElementById(
        "garsonMasa"
    ).value=
    masaNo;


    document.getElementById(
        "garsonModal"
    ).classList.add(
        "acik"
    );


    ozetGuncelle();

};


/* ==================================================
   MODALI KAPAT
================================================== */

window.garsonSiparisKapat=
function(){

    document.getElementById(
        "garsonModal"
    ).classList.remove(
        "acik"
    );

};


/* ==================================================
   ÜRÜN SEÇ
================================================== */

window.garsonUrunSec=
function(urun){

    if(
        !garsonSepet[urun]
    ){

        garsonSepet[urun]=1;

    }
    else{

        garsonSepet[urun]++;

    }


    adetleriGuncelle();


    ozetGuncelle();

};


/* ==================================================
   ADET DEĞİŞTİR
================================================== */

window.garsonAdetDegistir=
function(
    urun,
    miktar
){

    const mevcut=
    Number(
        garsonSepet[urun]||0
    );


    const yeni=
    Math.max(
        0,
        mevcut+miktar
    );


    if(
        yeni===0
    ){

        delete garsonSepet[urun];

    }
    else{

        garsonSepet[urun]=
        yeni;

    }


    adetleriGuncelle();


    ozetGuncelle();

};


/* ==================================================
   ADET EKRANLARINI GÜNCELLE
================================================== */

function adetleriGuncelle(){

    Object.keys(fiyatlar)
    .forEach(
        urun=>{

            const el=
            document.getElementById(
                `garson-adet-${urun}`
            );


            if(el){

                el.textContent=
                garsonSepet[urun]||0;

            }


            const kart=
            document.querySelector(
                `.garson-urun[data-urun="${urun}"]`
            );


            if(kart){

                if(
                    garsonSepet[urun]
                ){

                    kart.classList.add(
                        "secili"
                    );

                }
                else{

                    kart.classList.remove(
                        "secili"
                    );

                }

            }

        }
    );

}


/* ==================================================
   ÖZET GÜNCELLE
================================================== */

function ozetGuncelle(){

    const alan=
    document.getElementById(
        "ozetIcerik"
    );


    const gonder=
    document.getElementById(
        "garsonGonderBtn"
    );


    const secilenler=
    Object.keys(garsonSepet)
    .filter(
        urun=>
        garsonSepet[urun]>0
    );


    if(
        secilenler.length===0
    ){

        alan.innerHTML=
        "Henüz ürün seçilmedi.";


        gonder.disabled=
        true;

        return;

    }


    let html="";

    let toplam=0;


    secilenler.forEach(
        urun=>{

            const adet=
            garsonSepet[urun];


            const fiyat=
            fiyatlar[urun];


            const tutar=
            adet*fiyat;


            toplam+=tutar;


            html+=`

                <div class="ozet-satir">

                    <span>

                        ${urun}
                        × ${adet}

                    </span>


                    <b>

                        ${tutar} ₺

                    </b>

                </div>

            `;

        }
    );


    html+=`

        <div class="ozet-toplam">

            <span>
                Toplam
            </span>

            <span>
                ${toplam} ₺
            </span>

        </div>

    `;


    alan.innerHTML=
    html;


    const masa=
    document.getElementById(
        "garsonMasa"
    ).value;


    gonder.disabled=
    !masa;

}


/* ==================================================
   MASA DEĞİŞİNCE
================================================== */

document.getElementById(
    "garsonMasa"
).addEventListener(
    "change",
    ()=>{
        ozetGuncelle();
    }
);


/* ==================================================
   GARSON SİPARİŞ GÖNDER
================================================== */

window.garsonSiparisGonder=
async function(){

    const masa=
    document.getElementById(
        "garsonMasa"
    ).value;


    if(!masa){

        alert(
            "⚠️ Önce masa seçin."
        );

        return;

    }


    const secilenler=
    Object.keys(garsonSepet)
    .filter(
        urun=>
        garsonSepet[urun]>0
    );


    if(
        secilenler.length===0
    ){

        alert(
            "⚠️ En az bir ürün seçin."
        );

        return;

    }


    const urunler=
    secilenler.map(
        urun=>({

            urun:urun,

            adet:
            garsonSepet[urun],

            fiyat:
            fiyatlar[urun],

            tutar:
            garsonSepet[urun]*
            fiyatlar[urun]

        })
    );


    const toplam=
    urunler.reduce(
        (toplam,urun)=>
        toplam+
        urun.tutar,
        0
    );


    try{

        await addDoc(

            collection(
                db,
                "siparisler"
            ),

            {

                /*
                   MASA
                */

                masa:
                Number(masa),


                /*
                   ÜRÜNLER
                */

                urunler:
                urunler,


                /*
                   TOPLAM
                */

                toplam:
                toplam,


                /*
                   BEKLEYEN
                */

                durum:
                "Bekleyen",


                /*
                   BU SİPARİŞ
                   GARSON TARAFINDAN
                   OLUŞTURULDU
                */

                kaynak:
                "garson",


                /*
                   TARİH
                */

                olusturmaZamani:
                serverTimestamp()

            }

        );


        alert(
            "✅ Sipariş Masa "+
            masa+
            " için gönderildi."
        );


        garsonSepet={};


        garsonSiparisKapat();


    }
    catch(error){

        console.error(error);


        alert(
            "❌ Sipariş gönderilemedi.\n\n"+
            error.message
        );

    }

};


/* ==================================================
   FIREBASE SİPARİŞLER
================================================== */

const siparisQuery=
query(
    collection(
        db,
        "siparisler"
    )
);


onSnapshot(

    siparisQuery,

    snapshot=>{

        tumSiparisler=[];


        snapshot.forEach(
            item=>{

                tumSiparisler.push({

                    id:item.id,

                    ...item.data()

                });

            }
        );


        const bekleyen=
        tumSiparisler.filter(
            s=>
            s.durum==="Bekleyen"
        );


        bekleyen.sort(
            (a,b)=>
            zamanDegeri(a)-
            zamanDegeri(b)
        );


        document.getElementById(
            "baglantiDurumu"
        ).textContent=
        "🟢 Firebase bağlantısı aktif";


        document.getElementById(
            "bekleyenBilgi"
        ).textContent=
        bekleyen.length+
        " adet bekleyen sipariş var";


        masalariGoster();

    },

    error=>{

        console.error(error);


        document.getElementById(
            "baglantiDurumu"
        ).textContent=
        "🔴 Firebase bağlantı hatası";


        document.getElementById(
            "bekleyenBilgi"
        ).textContent=
        "Firebase bağlantısı kurulamadı";

    }

);


/* ==================================================
   ZAMAN DEĞERİ
================================================== */

function zamanDegeri(
    siparis
){

    if(
        siparis.olusturmaZamani &&
        typeof
        siparis.olusturmaZamani.toMillis===
        "function"
    ){

        return siparis
        .olusturmaZamani
        .toMillis();

    }


    if(
        siparis.zaman
    ){

        const t=
        new Date(
            siparis.zaman
        ).getTime();


        if(
            !isNaN(t)
        ){

            return t;

        }

    }


    return 0;

}


/* ==================================================
   MASALARI GÖSTER
================================================== */

function masalariGoster(){

    const grid=
    document.getElementById(
        "masaGrid"
    );


    grid.innerHTML="";


    const bekleyenSiparisler=
    tumSiparisler.filter(
        s=>
        s.durum==="Bekleyen"
    );


    const bekleyenMasalar=[];


    bekleyenSiparisler.forEach(
        siparis=>{

            const masa=
            String(
                siparis.masa
            );


            if(
                !bekleyenMasalar.includes(
                    masa
                )
            ){

                bekleyenMasalar.push(
                    masa
                );

            }

        }
    );


    const masaSonZaman={};


    bekleyenMasalar.forEach(
        masa=>{

            const siparisler=
            bekleyenSiparisler.filter(
                s=>
                String(s.masa)===
                masa
            );


            masaSonZaman[masa]=
            Math.max(
                ...siparisler.map(
                    s=>
                    zamanDegeri(s)
                )
            );

        }
    );


    /*
       EN SON SİPARİŞ GELEN
       MASA EN ÜSTE
    */

    bekleyenMasalar.sort(
        (a,b)=>
        masaSonZaman[b]-
        masaSonZaman[a]
    );


    const bosMasalar=[];


    for(
        let masa=1;
        masa<=masaSayisi;
        masa++
    ){

        const no=
        String(masa);


        if(
            !bekleyenMasalar.includes(
                no
            )
        ){

            bosMasalar.push(
                no
            );

        }

    }


    const siraliMasalar=[
        ...bekleyenMasalar,
        ...bosMasalar
    ];


    siraliMasalar.forEach(
        (masaNo,masaSirasi)=>{

            const siparisler=
            bekleyenSiparisler.filter(
                s=>
                String(s.masa)===
                String(masaNo)
            );


            const masaDiv=
            document.createElement(
                "div"
            );


            masaDiv.className=
            "masa";


            masaDiv.dataset.masa=
            masaNo;


            if(
                siparisler.length>0
            ){

                masaDiv.classList.add(
                    "bekleyen"
                );

            }


            /*
               EN ÜSTTEKİ MASA
            */

            if(
                masaSirasi===0 &&
                siparisler.length>0
            ){

                masaDiv.classList.add(
                    "en-yeni"
                );

            }


            let sonSiparisText="";


            if(
                siparisler.length>0
            ){

                const sonSiparis=
                [...siparisler]
                .sort(
                    (a,b)=>
                    zamanDegeri(b)-
                    zamanDegeri(a)
                )[0];


                sonSiparisText=
                saatGoster(
                    sonSiparis
                );

            }


            masaDiv.innerHTML=`

                <div class="masa-baslik">

                    <h2>

                        🪑 Masa ${masaNo}

                    </h2>


                    <span
                    class="masa-durum ${
                        siparisler.length>0
                        ?
                        "bekleyen"
                        :
                        ""
                    }">

                        ${
                            siparisler.length>0
                            ?
                            "🟡 "+
                            siparisler.length+
                            " Bekleyen"
                            :
                            "Boş"
                        }

                    </span>

                </div>

            `;


            if(
                siparisler.length>0
            ){

                masaDiv.innerHTML+=`

                    <div class="yeni-etiket">

                        🔔 Son sipariş:
                        ${sonSiparisText}

                    </div>

                `;

            }


            if(
                siparisler.length===0
            ){

                masaDiv.innerHTML+=`

                    <div class="bos">

                        Bekleyen sipariş yok.

                    </div>

                `;

            }
            else{

                siparisler.forEach(
                    (siparis,index)=>{

                        masaDiv.innerHTML+=
                        siparisHTML(
                            siparis,
                            index
                        );

                    }
                );

            }


            /*
               MASAYA TIKLAYINCA
               O MASAYA GARSON SİPARİŞİ
               AÇILABİLSİN
            */

            masaDiv.addEventListener(
                "dblclick",
                ()=>{

                    garsonSiparisAc(
                        masaNo
                    );

                }
            );


            grid.appendChild(
                masaDiv
            );

        }
    );


    hoverSistemi();

}


/* ==================================================
   SAAT
================================================== */

function saatGoster(
    siparis
){

    if(
        siparis.olusturmaZamani &&
        typeof
        siparis.olusturmaZamani.toDate===
        "function"
    ){

        return siparis
        .olusturmaZamani
        .toDate()
        .toLocaleTimeString(
            "tr-TR",
            {

                hour:"2-digit",

                minute:"2-digit",

                second:"2-digit"

            }
        );

    }


    if(
        siparis.zaman
    ){

        const tarih=
        new Date(
            siparis.zaman
        );


        if(
            !isNaN(
                tarih.getTime()
            )
        ){

            return tarih.toLocaleTimeString(
                "tr-TR",
                {

                    hour:"2-digit",

                    minute:"2-digit",

                    second:"2-digit"

                }
            );

        }

    }


    return "--:--:--";

}


/* ==================================================
   SİPARİŞ HTML
================================================== */

function siparisHTML(
    siparis,
    index
){

    const zaman=
    saatGoster(
        siparis
    );


    let urunler="";


    (
        siparis.urunler||[]
    ).forEach(
        u=>{

            const fiyat=
            Number(
                u.fiyat||
                fiyatlar[u.urun]||
                0
            );


            const adet=
            Number(
                u.adet||0
            );


            urunler+=`

                <div class="urun">

                    <div>

                        <div class="urun-ad">

                            ${u.urun}

                        </div>


                        <div class="urun-fiyat">

                            ${fiyat} ₺ × ${adet}

                        </div>

                    </div>


                    <b>

                        ${fiyat*adet} ₺

                    </b>

                </div>

            `;

        }
    );


    const kaynak=
    siparis.kaynak==="garson"
    ?
    `<div class="siparis-kaynak">
        👨‍🍳 Garson tarafından oluşturuldu
    </div>`
    :
    "";


    return `

        <div
        class="siparis"
        id="siparis-${siparis.id}"
        >

            <div class="siparis-baslik">

                <span class="siparis-no">

                    Sipariş #${index+1}

                </span>


                <span class="siparis-durum">

                    🟡 Bekleyen

                </span>

            </div>


            ${kaynak}


            <div class="siparis-zaman">

                🕐 ${zaman}

            </div>


            ${urunler}


            <div class="siparis-toplam">

                Toplam:
                ${Number(
                    siparis.toplam||0
                )} ₺

            </div>


            <div class="butons">

                <button
                class="btn duzenle"
                onclick="
                    duzenleAc('${siparis.id}')
                ">

                    ✏️ Düzenle

                </button>


                <button
                class="btn onayla"
                onclick="
                    siparisOnayla('${siparis.id}')
                ">

                    🟢 Onayla

                </button>

            </div>


            <div
            id="duzen-${siparis.id}"
            class="duzenleme">

                ${duzenHTML(siparis)}

            </div>

        </div>

    `;

}


/* ==================================================
   DÜZENLEME
================================================== */

function duzenHTML(
    siparis
){

    let html="";


    (
        siparis.urunler||[]
    ).forEach(
        (u,index)=>{

            const adet=
            Number(
                u.adet||0
            );


            const fiyat=
            Number(
                u.fiyat||
                fiyatlar[u.urun]||
                0
            );


            html+=`

                <div class="duzen-urun">

                    <div>

                        <b>

                            ${u.urun}

                        </b>

                        <br>

                        <small>

                            ${fiyat} ₺

                        </small>

                    </div>


                    <div class="adet-kontrol">

                        <button
                        onclick="
                            duzenAdet(
                                '${siparis.id}',
                                ${index},
                                -1
                            )
                        ">

                            −

                        </button>


                        <span
                        class="adet-sayi"
                        id="
                            adet-${siparis.id}-${index}
                        ">

                            ${adet}

                        </span>


                        <button
                        onclick="
                            duzenAdet(
                                '${siparis.id}',
                                ${index},
                                1
                            )
                        ">

                            +

                        </button>

                    </div>

                </div>

            `;

        }
    );


    html+=`

        <div class="duzen-alt">

            <button
            class="kaydet"
            onclick="
                duzenKaydet('${siparis.id}')
            ">

                💾 Değişiklikleri Kaydet

            </button>

        </div>

    `;


    return html;

}


/* ==================================================
   DÜZENLE AÇ
================================================== */

window.duzenleAc=
function(id){

    const el=
    document.getElementById(
        "duzen-"+id
    );


    if(!el)
    return;


    el.classList.toggle(
        "acik"
    );

};


/* ==================================================
   ADET DEĞİŞTİR
================================================== */

window.duzenAdet=
function(
    siparisId,
    urunIndex,
    degisim
){

    const siparis=
    tumSiparisler.find(
        s=>
        s.id===
        siparisId
    );


    if(!siparis)
    return;


    if(
        !duzenlemeler[siparisId]
    ){

        duzenlemeler[siparisId]=
        JSON.parse(
            JSON.stringify(
                siparis.urunler||[]
            )
        );

    }


    const urun=
    duzenlemeler[siparisId]
    [urunIndex];


    if(!urun)
    return;


    urun.adet=
    Math.max(
        0,
        Number(
            urun.adet||0
        )+
        degisim
    );


    const span=
    document.getElementById(
        `adet-${siparisId}-${urunIndex}`
    );


    if(span){

        span.textContent=
        urun.adet;

    }

};


/* ==================================================
   DÜZENLEME KAYDET
================================================== */

window.duzenKaydet=
async function(id){

    const siparis=
    tumSiparisler.find(
        s=>
        s.id===
        id
    );


    if(!siparis)
    return;


    const yeniUrunler=
    duzenlemeler[id]||
    siparis.urunler||
    [];


    const temizUrunler=
    yeniUrunler.filter(
        u=>
        Number(
            u.adet||0
        )>0
    );


    let yeniToplam=0;


    temizUrunler.forEach(
        u=>{

            const fiyat=
            Number(
                u.fiyat||
                fiyatlar[u.urun]||
                0
            );


            u.fiyat=
            fiyat;


            u.tutar=
            fiyat*
            Number(
                u.adet||0
            );


            yeniToplam+=
            u.tutar;

        }
    );


    try{

        await updateDoc(

            doc(
                db,
                "siparisler",
                id
            ),

            {

                urunler:
                temizUrunler,

                toplam:
                yeniToplam,

                duzenlendi:
                true,

                duzenlenmeZamani:
                serverTimestamp()

            }

        );


        delete duzenlemeler[id];


        alert(
            "✅ Sipariş düzenlendi."
        );

    }
    catch(error){

        console.error(error);


        alert(
            "❌ Sipariş düzenlenemedi.\n\n"+
            error.message
        );

    }

};


/* ==================================================
   SİPARİŞ ONAYLA
================================================== */

window.siparisOnayla=
async function(id){

    const siparis=
    tumSiparisler.find(
        s=>
        s.id===
        id
    );


    if(!siparis)
    return;


    if(
        siparis.durum!==
        "Bekleyen"
    ){

        return;

    }


    const onay=
    confirm(
        "Masa "+
        siparis.masa+
        " siparişini onaylamak istiyor musunuz?"
    );


    if(!onay)
    return;


    try{

        await updateDoc(

            doc(
                db,
                "siparisler",
                id
            ),

            {

                durum:
                "Onaylandı",

                onaylanmaZamani:
                serverTimestamp()

            }

        );

    }
    catch(error){

        console.error(error);


        alert(
            "❌ Sipariş onaylanamadı.\n\n"+
            error.message
        );

    }

};


/* ==================================================
   HOVER
================================================== */

function hoverSistemi(){

    const masalar=
    document.querySelectorAll(
        ".masa"
    );


    masalar.forEach(
        masa=>{

            masa.addEventListener(
                "mouseenter",
                ()=>{

                    if(
                        window.innerWidth<=500
                    ){

                        return;

                    }


                    masalar.forEach(
                        m=>{

                            if(
                                m!==masa
                            ){

                                m.classList.add(
                                    "pasif-masa"
                                );

                                m.classList.remove(
                                    "aktif-masa"
                                );

                            }

                        }
                    );


                    masa.classList.remove(
                        "pasif-masa"
                    );


                    masa.classList.add(
                        "aktif-masa"
                    );


                    setTimeout(
                        ()=>{

                            const rect=
                            masa.getBoundingClientRect();


                            const masaX=
                            rect.left+
                            rect.width/2;


                            const masaY=
                            rect.top+
                            rect.height/2;


                            const ekranX=
                            window.innerWidth/2;


                            const ekranY=
                            window.innerHeight/2;


                            window.scrollBy({

                                left:
                                masaX-ekranX,

                                top:
                                masaY-ekranY,

                                behavior:"smooth"

                            });

                        },
                        50
                    );

                }
            );


            masa.addEventListener(
                "mouseleave",
                ()=>{

                    setTimeout(
                        ()=>{

                            if(
                                document.querySelector(
                                    ".masa:hover"
                                )
                            ){

                                return;

                            }


                            masalar.forEach(
                                m=>{

                                    m.classList.remove(
                                        "aktif-masa"
                                    );

                                    m.classList.remove(
                                        "pasif-masa"
                                    );

                                }
                            );

                        },
                        100
                    );

                }
            );

        }
    );

}

garsonUrunleriniOlustur();

</script>
