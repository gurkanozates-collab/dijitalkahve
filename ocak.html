<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Garson Paneli</title>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f4f6f8;
    font-family:Arial,Helvetica,sans-serif;
    color:#263238;
}

.header{
    background:linear-gradient(135deg,#3e2723,#795548);
    color:white;
    text-align:center;
    padding:22px 15px;
}

.header h2{
    margin:0;
}

.header p{
    margin:6px 0 0;
    font-size:13px;
    opacity:.85;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:15px;
}

.section{
    margin-bottom:25px;
}

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.badge{
    background:#795548;
    color:white;
    min-width:30px;
    height:30px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.empty{
    background:white;
    border-radius:12px;
    padding:22px;
    text-align:center;
    color:#999;
}

.card{
    background:white;
    border-radius:14px;
    padding:16px;
    margin:10px 0;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    border-left:6px solid #fb8c00;
}

.card.onayli{
    border-left-color:#43a047;
}

.card-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.masa{
    font-size:20px;
    font-weight:bold;
    color:#5d4037;
}

.zaman{
    color:#999;
    font-size:12px;
}

.urun{
    display:flex;
    justify-content:space-between;
    padding:9px 0;
    border-bottom:1px dashed #ddd;
}

.toplam{
    text-align:right;
    font-size:18px;
    font-weight:bold;
    color:#e65100;
    margin-top:12px;
}

.btn{
    width:100%;
    border:0;
    padding:12px;
    border-radius:9px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

.btn-onay{
    background:#2e7d32;
    color:white;
}

.btn-duzen{
    background:#1565c0;
    color:white;
}

.btn-garson{
    background:#ffb300;
    color:#222;
}

.bilgi{
    background:#e8f5e9;
    color:#2e7d32;
    padding:9px;
    border-radius:8px;
    font-size:12px;
    margin-bottom:10px;
}

.duzen-box{
    background:#f5f5f5;
    padding:12px;
    margin-top:10px;
    border-radius:10px;
    display:none;
}

.duzen-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:9px 0;
    border-bottom:1px solid #ddd;
}

.miktar{
    display:flex;
    align-items:center;
    gap:7px;
}

.miktar button{
    width:30px;
    height:30px;
    border:0;
    border-radius:50%;
    background:#ddd;
    font-size:18px;
    cursor:pointer;
}

</style>

</head>

<body>

<header class="header">

    <h2>☕ GARSON PANELİ</h2>

    <p>
        Canlı sipariş ve garson çağrı yönetimi
    </p>

</header>


<div class="container">


<!-- ================= GARSON ÇAĞRILARI ================= -->

<section class="section">

    <div class="section-title">

        <h3>
            🔔 Garson Çağrıları
        </h3>

        <span
            class="badge"
            id="cagriSayisi">

            0

        </span>

    </div>


    <div id="cagriListesi">

        <div class="empty">
            Bekleyen garson çağrısı yok.
        </div>

    </div>

</section>


<!-- ================= BEKLEYEN ================= -->

<section class="section">

    <div class="section-title">

        <h3>
            🕐 Bekleyen Siparişler
        </h3>

        <span
            class="badge"
            id="bekleyenSayisi">

            0

        </span>

    </div>


    <div id="bekleyenListesi">

        <div class="empty">
            Bekleyen sipariş yok.
        </div>

    </div>

</section>


<!-- ================= ONAYLANAN ================= -->

<section class="section">

    <div class="section-title">

        <h3>
            ✅ Onaylanan Siparişler
        </h3>

    </div>


    <div id="onaylananListesi">

        <div class="empty">
            Onaylanan sipariş yok.
        </div>

    </div>

</section>


</div>


<script>

/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig={

    databaseURL:
    "https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
    "dijitalkahve-67f0a",

    storageBucket:
    "dijitalkahve-67f0a.appspot.com",

    messagingSenderId:
    "326476599239"

};


if(!firebase.apps.length){

    firebase.initializeApp(
        firebaseConfig
    );

}


const db =
    firebase.database();


/* =====================================================
   GARSON ÇAĞRILARI
===================================================== */

db.ref("bildirimler")
.on("value",snapshot=>{

    const data =
        snapshot.val() || {};

    const keys =
        Object.keys(data);


    document.getElementById(
        "cagriSayisi"
    ).innerText =
        keys.length;


    const liste =
        document.getElementById(
            "cagriListesi"
        );


    if(!keys.length){

        liste.innerHTML=`

            <div class="empty">
                Bekleyen garson çağrısı yok.
            </div>

        `;

        return;

    }


    liste.innerHTML="";


    keys.forEach(key=>{

        const item =
            data[key];


        liste.innerHTML += `

            <div class="card">

                <div class="card-header">

                    <span class="masa">
                        🔔 MASA ${item.masa}
                    </span>

                    <span class="zaman">
                        ${item.zaman || "-"}
                    </span>

                </div>


                <button
                    class="btn btn-garson"
                    onclick="garsonCagrisiTamamla(
                        '${key}'
                    )">

                    ✓ GİDİLDİ

                </button>

            </div>

        `;

    });

});


/* =====================================================
   SİPARİŞLER
===================================================== */

db.ref("siparisler")
.on("value",snapshot=>{

    const data =
        snapshot.val() || {};


    const bekleyen=[];

    const onaylanan=[];


    Object.entries(data)
    .forEach(([key,siparis])=>{

        if(!siparis) return;


        if(
            siparis.durum ===
            "onaylandi"
        ){

            onaylanan.push(
                [key,siparis]
            );

        }else{

            bekleyen.push(
                [key,siparis]
            );

        }

    });


    document.getElementById(
        "bekleyenSayisi"
    ).innerText =
        bekleyen.length;


    bekleyenGoster(
        bekleyen
    );


    onaylananGoster(
        onaylanan
    );

});


/* =====================================================
   BEKLEYENLER
===================================================== */

function bekleyenGoster(
    siparisler
){

    const liste =
        document.getElementById(
            "bekleyenListesi"
        );


    if(!siparisler.length){

        liste.innerHTML=`

            <div class="empty">
                Bekleyen sipariş yok.
            </div>

        `;

        return;

    }


    liste.innerHTML="";


    siparisler.forEach(
        ([id,siparis])=>{

            liste.innerHTML +=
                bekleyenKart(
                    id,
                    siparis
                );

        }
    );

}


/* =====================================================
   BEKLEYEN KART
===================================================== */

function bekleyenKart(
    id,
    siparis
){

    const urunler =
        siparis.urunler || {};


    let html="";

    let toplam=0;


    Object.entries(urunler)
    .forEach(([key,u])=>{

        const adet =
            parseInt(u.adet)||0;

        const fiyat =
            parseFloat(u.fiyat)||0;

        const tutar =
            adet*fiyat;


        toplam += tutar;


        html += `

            <div class="urun">

                <span>

                    ${u.ad}

                    <b>
                        × ${adet}
                    </b>

                </span>

                <b>
                    ${tutar.toFixed(2)}
                    TL
                </b>

            </div>

        `;

    });


    return `

        <div class="card">

            <div class="card-header">

                <span class="masa">
                    MASA ${siparis.masa}
                </span>

                <span class="zaman">
                    ${siparis.zaman || "-"}
                </span>

            </div>


            ${html}


            <div class="toplam">

                ${toplam.toFixed(2)}
                TL

            </div>


            <button
                class="btn btn-duzen"
                onclick="duzenleAc(
                    '${id}'
                )">

                ✏️ SİPARİŞİ DÜZENLE

            </button>


            <button
                class="btn btn-onay"
                onclick="siparisOnayla(
                    '${id}'
                )">

                ✓ SİPARİŞİ ONAYLA

            </button>


            <div
                id="duzen-${id}"
                class="duzen-box">

            </div>

        </div>

    `;

}


/* =====================================================
   DÜZENLE
===================================================== */

function duzenleAc(id){

    db.ref(
        "siparisler/"+id
    )
    .once("value")
    .then(snapshot=>{

        const siparis =
            snapshot.val();


        if(!siparis) return;


        const box =
            document.getElementById(
                "duzen-"+id
            );


        const urunler =
            siparis.urunler || {};


        let html="";


        Object.entries(urunler)
        .forEach(([key,u])=>{

            html += `

                <div class="duzen-row">

                    <span>
                        ${u.ad}
                    </span>

                    <div class="miktar">

                        <button
                            onclick="adetDegistir(
                                '${id}',
                                '${key}',
                                -1
                            )">

                            −

                        </button>


                        <b>
                            ${u.adet}
                        </b>


                        <button
                            onclick="adetDegistir(
                                '${id}',
                                '${key}',
                                1
                            )">

                            +

                        </button>

                    </div>

                </div>

            `;

        });


        html += `

            <button
                class="btn btn-onay"
                onclick="duzenKapat('${id}')">

                ✓ TAMAM

            </button>

        `;


        box.innerHTML=html;

        box.style.display="block";

    });

}


/* =====================================================
   ADET DEĞİŞTİR
===================================================== */

function adetDegistir(
    siparisId,
    urunId,
    fark
){

    const ref =
        db.ref(
            "siparisler/"
            +siparisId
            +"/urunler/"
            +urunId
        );


    ref.once("value")
    .then(snapshot=>{

        const urun =
            snapshot.val();


        if(!urun) return;


        let yeniAdet =
            (
                parseInt(
                    urun.adet
                ) || 0
            )
            + fark;


        if(yeniAdet <= 0){

            ref.remove();

        }else{

            ref.update({

                adet:yeniAdet

            });

        }


        siparisToplamGuncelle(
            siparisId
        );

    });

}


/* =====================================================
   TOPLAM GÜNCELLE
===================================================== */

function siparisToplamGuncelle(
    id
){

    db.ref(
        "siparisler/"
        +id
        +"/urunler"
    )
    .once("value")
    .then(snapshot=>{

        const urunler =
            snapshot.val() || {};

        let toplam=0;


        Object.values(urunler)
        .forEach(u=>{

            toplam +=
                (
                    parseFloat(
                        u.fiyat
                    ) || 0
                )
                *
                (
                    parseInt(
                        u.adet
                    ) || 0
                );

        });


        db.ref(
            "siparisler/"
            +id
            +"/toplam"
        )
        .set(toplam);

    });

}


/* =====================================================
   DÜZEN KAPAT
===================================================== */

function duzenKapat(id){

    const box =
        document.getElementById(
            "duzen-"+id
        );


    if(box){

        box.style.display =
            "none";

    }

}


/* =====================================================
   ONAYLA
===================================================== */

function siparisOnayla(id){

    if(
        !confirm(
            "Bu sipariş onaylansın mı?"
        )
    ){

        return;

    }


    db.ref(
        "siparisler/"
        +id
        +"/durum"
    )
    .set("onaylandi")
    .catch(error=>{

        alert(
            "Sipariş onaylanamadı:\n"
            +error.message
        );

    });

}


/* =====================================================
   GARSON ÇAĞRISI TAMAMLA
===================================================== */

function garsonCagrisiTamamla(id){

    db.ref(
        "bildirimler/"+id
    )
    .remove();

}

</script>

</body>
</html>
