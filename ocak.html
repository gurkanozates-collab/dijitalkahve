<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dijital Kahvem - Garson Paneli</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f1ee;
    color:#33231e;
}

header{
    background:#4e342e;
    color:#fff;
    padding:18px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:28px;
}

header p{
    margin:6px 0 0;
}

.topbar{
    position:sticky;
    top:0;
    z-index:100;
    background:#fff;
    padding:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 2px 8px #0002;
}

.connection{
    font-weight:bold;
}

.refresh{
    border:0;
    background:#1565c0;
    color:white;
    padding:10px 15px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.container{
    max-width:1500px;
    margin:auto;
    padding:15px;
}

.title{
    margin-bottom:15px;
}

.title h2{
    margin:0 0 5px;
}

.title p{
    margin:0;
    color:#777;
}

.masa-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:14px;
}

.masa{
    background:#fff;
    border:2px solid #ddd;
    border-radius:14px;
    padding:14px;
    box-shadow:0 2px 8px #0001;
    transition:.25s;
}

.masa.bekleyen{
    border-color:#ef6c00;
    box-shadow:0 0 0 3px #ef6c0020;
}

.masa.yeni{
    order:-1;
}

.masa:hover{
    transform:scale(1.04);
    box-shadow:0 12px 30px #0003;
}

.masa-baslik{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
}

.masa-baslik h3{
    margin:0;
    font-size:22px;
}

.durum{
    padding:6px 9px;
    border-radius:15px;
    background:#eee;
    color:#777;
    font-size:12px;
    font-weight:bold;
}

.durum.bekleyen{
    background:#fff3cd;
    color:#ef6c00;
}

.garson-btn{
    width:100%;
    border:0;
    background:#6d4c41;
    color:white;
    padding:13px 10px;
    border-radius:9px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.garson-btn:hover{
    background:#4e342e;
}

/* =========================
   SİPARİŞ
========================= */

.siparis{
    margin-top:12px;
    padding:11px;
    background:#fffaf5;
    border:1px solid #ddd;
    border-left:5px solid #ef6c00;
    border-radius:9px;
}

/* GARSON SİPARİŞİ */
.siparis.garson-siparis{
    border-left-color:#ef6c00;
    background:#fff8ef;
}

/* MÜŞTERİ SİPARİŞİ */
.siparis.musteri-siparis{
    border-left-color:#1565c0;
    background:#f4f9ff;
}

.siparis-baslik{
    display:flex;
    justify-content:space-between;
    gap:5px;
    margin-bottom:7px;
}

.siparis-no{
    font-weight:bold;
}

.siparis-durum{
    color:#ef6c00;
    font-size:12px;
    font-weight:bold;
}

/* KAYNAK ETİKETLERİ */

.kaynak{
    display:block;
    padding:8px 9px;
    border-radius:8px;
    font-size:12px;
    font-weight:bold;
    margin-bottom:8px;
    text-align:center;
}

/* GARSON */
.kaynak.garson{
    background:#fff3e0;
    color:#e65100;
    border:1px solid #ffcc80;
}

/* MÜŞTERİ */
.kaynak.musteri{
    background:#e3f2fd;
    color:#1565c0;
    border:1px solid #90caf9;
}

.zaman{
    color:#777;
    font-size:12px;
    margin-bottom:7px;
}

.urun{
    display:flex;
    justify-content:space-between;
    padding:5px 0;
    border-bottom:1px solid #eee;
}

.toplam{
    text-align:right;
    margin-top:8px;
    font-weight:bold;
    font-size:17px;
}

.butons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    margin-top:10px;
}

.btn{
    border:0;
    border-radius:8px;
    padding:10px;
    font-weight:bold;
    cursor:pointer;
}

.duzenle{
    background:#ffb300;
}

.onayla{
    background:#2e7d32;
    color:white;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:1000;
    background:#0008;
    overflow-y:auto;
    padding:20px;
}

.modal.acik{
    display:block;
}

.modal-kutu{
    max-width:650px;
    margin:20px auto;
    background:white;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 20px 60px #0007;
}

.modal-header{
    background:#4e342e;
    color:white;
    padding:16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.modal-header h2{
    margin:0;
}

.kapat{
    background:transparent;
    color:white;
    border:0;
    font-size:28px;
    cursor:pointer;
}

.menu{
    padding:15px;
}

.menu-urun{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:13px 4px;
    border-bottom:1px solid #e5e0dc;
}

.menu-bilgi{
    flex:1;
}

.menu-ad{
    font-size:18px;
    font-weight:bold;
}

.menu-fiyat{
    margin-top:4px;
    color:#777;
}

.adet{
    display:flex;
    align-items:center;
    gap:8px;
}

.adet button{
    width:42px;
    height:42px;
    border:0;
    border-radius:9px;
    background:#ddd;
    font-size:24px;
    font-weight:bold;
    cursor:pointer;
}

.adet button:hover{
    background:#c8c8c8;
}

.adet span{
    width:32px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
}

.menu-alt{
    padding:15px;
    border-top:1px solid #ddd;
    background:#faf8f6;
}

.menu-toplam{
    display:flex;
    justify-content:space-between;
    font-size:22px;
    font-weight:bold;
    margin-bottom:12px;
}

.gonder{
    width:100%;
    border:0;
    border-radius:10px;
    background:#2e7d32;
    color:white;
    padding:15px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

/* DÜZENLEME */

.duzenleme{
    display:none;
    margin-top:10px;
    padding:10px;
    background:#f8f8f8;
    border-radius:8px;
}

.duzenleme.acik{
    display:block;
}

.duzen-satir{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:7px 0;
    border-bottom:1px solid #ddd;
}

.kaydet{
    width:100%;
    margin-top:10px;
    border:0;
    padding:11px;
    border-radius:8px;
    background:#1565c0;
    color:white;
    font-weight:bold;
}

/* MOBİL */

@media(max-width:1100px){
    .masa-grid{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:750px){
    .masa-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:520px){
    .masa-grid{
        grid-template-columns:1fr;
    }

    .modal{
        padding:8px;
    }

    .modal-kutu{
        margin:5px auto;
    }
}
</style>
</head>

<body>

<header>
    <h1>☕ DİJİTAL KAHVEM</h1>
    <p>Garson Paneli</p>
</header>

<div class="topbar">

    <div id="baglanti" class="connection">
        🟡 Firebase bağlanıyor...
    </div>

    <button class="refresh" onclick="location.reload()">
        🔄 Yenile
    </button>

</div>

<div class="container">

    <div class="title">

        <h2>🪑 Masalar</h2>

        <p id="bilgi">
            Siparişler yükleniyor...
        </p>

    </div>

    <div id="masaGrid" class="masa-grid"></div>

</div>


<!-- =========================
     GARSON MENÜ MODALI
========================= -->

<div id="menuModal" class="modal">

    <div class="modal-kutu">

        <div class="modal-header">

            <h2 id="modalBaslik">
                👨‍🍳 Garson Siparişi
            </h2>

            <button
                class="kapat"
                onclick="menuKapat()">

                ×

            </button>

        </div>

        <div id="menu" class="menu"></div>

        <div class="menu-alt">

            <div class="menu-toplam">

                <span>
                    Toplam
                </span>

                <span id="menuToplam">
                    0 ₺
                </span>

            </div>

            <button
                class="gonder"
                onclick="garsonSiparisGonder()">

                👨‍🍳 Garson Siparişini Gönder

            </button>

        </div>

    </div>

</div>


<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getFirestore,
    collection,
    query,
    onSnapshot,
    addDoc,
    updateDoc,
    doc,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyC05yXQzAlF2AYzzeaJrDdMUYKwohKOsWM",

    authDomain:
    "dijitalkahve-67f0a.firebaseapp.com",

    databaseURL:
    "https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
    "dijitalkahve-67f0a",

    storageBucket:
    "dijitalkahve-67f0a.firebasestorage.app",

    messagingSenderId:
    "326476599239",

    appId:
    "1:326476599239:web:143f39583a3478118853e2",

    measurementId:
    "G-WM65PC4648"

};


const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);


/* =========================
   MENÜ
========================= */

const urunler = [

    {
        ad:"Çay",
        fiyat:25
    },

    {
        ad:"Nescafe",
        fiyat:60
    },

    {
        ad:"Türk Kahvesi",
        fiyat:70
    },

    {
        ad:"Su",
        fiyat:15
    },

    {
        ad:"Kola",
        fiyat:50
    },

    {
        ad:"Fanta",
        fiyat:50
    },

    {
        ad:"Tost",
        fiyat:100
    }

];


let seciliMasa = null;

let sepet = {};

let siparisler = [];


/* =========================
   SEPET SIFIRLA
========================= */

function sepetSifirla(){

    sepet = {};

    urunler.forEach(
        urun => {

            sepet[urun.ad] = 0;

        }
    );

}


/* =========================
   GARSON MENÜSÜ
========================= */

window.garsonMenusuAc =
function(masa){

    seciliMasa = masa;

    sepetSifirla();

    document.getElementById(
        "modalBaslik"
    ).textContent =
    "👨‍🍳 Garson Siparişi - Masa " +
    masa;

    menuOlustur();

    document.getElementById(
        "menuModal"
    ).classList.add("acik");

};


/* =========================
   MENÜ KAPAT
========================= */

window.menuKapat =
function(){

    document.getElementById(
        "menuModal"
    ).classList.remove("acik");

    seciliMasa = null;

};


/* =========================
   MENÜ OLUŞTUR
========================= */

function menuOlustur(){

    const menu =
    document.getElementById("menu");

    menu.innerHTML = "";

    urunler.forEach(
        (urun,index) => {

            menu.innerHTML += `

                <div class="menu-urun">

                    <div class="menu-bilgi">

                        <div class="menu-ad">
                            ${urun.ad}
                        </div>

                        <div class="menu-fiyat">
                            ${urun.fiyat} ₺
                        </div>

                    </div>

                    <div class="adet">

                        <button
                        onclick="
                            adetDegistir(
                                ${index},
                                -1
                            )
                        ">

                            −

                        </button>

                        <span
                        id="adet-${index}">
                            0
                        </span>

                        <button
                        onclick="
                            adetDegistir(
                                ${index},
                                1
                            )
                        ">

                            +

                        </button>

                    </div>

                </div>

            `;

        }
    );

    toplamGuncelle();

}


/* =========================
   ADET
========================= */

window.adetDegistir =
function(index,miktar){

    const urun =
    urunler[index];

    sepet[urun.ad] =
    Math.max(
        0,
        (sepet[urun.ad] || 0) +
        miktar
    );

    const el =
    document.getElementById(
        "adet-"+index
    );

    if(el){

        el.textContent =
        sepet[urun.ad];

    }

    toplamGuncelle();

};


/* =========================
   TOPLAM
========================= */

function toplamHesapla(){

    let toplam = 0;

    urunler.forEach(
        urun => {

            toplam +=
            (sepet[urun.ad] || 0) *
            urun.fiyat;

        }
    );

    return toplam;

}


function toplamGuncelle(){

    document.getElementById(
        "menuToplam"
    ).textContent =
    toplamHesapla() +
    " ₺";

}


/* =========================
   GARSON SİPARİŞİ GÖNDER
========================= */

window.garsonSiparisGonder =
async function(){

    if(!seciliMasa){

        return;

    }


    const secilenUrunler = [];


    urunler.forEach(
        urun => {

            const adet =
            Number(
                sepet[urun.ad] || 0
            );

            if(adet > 0){

                secilenUrunler.push({

                    urun:urun.ad,

                    adet:adet,

                    fiyat:urun.fiyat,

                    tutar:
                    adet * urun.fiyat

                });

            }

        }
    );


    if(
        secilenUrunler.length === 0
    ){

        alert(
            "⚠️ Önce ürün seçmelisin."
        );

        return;

    }


    const toplam =
    secilenUrunler.reduce(
        (a,b) =>
        a + b.tutar,
        0
    );


    try{

        await addDoc(

            collection(
                db,
                "siparisler"
            ),

            {

                /* =====================
                   ÖNEMLİ:
                   BU SİPARİŞ GARSONDAN
                   GELDİĞİNİ BELİRTİR
                ===================== */

                masa:
                String(seciliMasa),

                urunler:
                secilenUrunler,

                toplam:
                toplam,

                durum:
                "Bekleyen",

                kaynak:
                "garson",

                garsonSiparisi:
                true,

                olusturmaZamani:
                serverTimestamp()

            }

        );


        alert(
            "✅ GARSON SİPARİŞİ GÖNDERİLDİ!\n\n"+
            "Masa: " +
            seciliMasa +
            "\n"+
            "Toplam: " +
            toplam +
            " ₺"
        );


        menuKapat();

    }
    catch(error){

        console.error(error);

        alert(
            "❌ Sipariş gönderilemedi:\n\n" +
            error.message
        );

    }

};


/* =========================
   ZAMAN
========================= */

function zaman(s){

    if(
        s.olusturmaZamani &&
        typeof
        s.olusturmaZamani.toMillis ===
        "function"
    ){

        return s.olusturmaZamani.toMillis();

    }

    return 0;

}


function saat(s){

    if(
        s.olusturmaZamani &&
        typeof
        s.olusturmaZamani.toDate ===
        "function"
    ){

        return s.olusturmaZamani
        .toDate()
        .toLocaleTimeString(
            "tr-TR",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    }

    return "--:--";

}


/* =========================
   SİPARİŞ HTML
========================= */

function siparisHTML(s,index){

    let html = "";


    (s.urunler || []).forEach(
        u => {

            const fiyat =
            Number(
                u.fiyat || 0
            );

            const adet =
            Number(
                u.adet || 0
            );

            html += `

                <div class="urun">

                    <span>
                        ${u.urun}
                        × ${adet}
                    </span>

                    <b>
                        ${fiyat * adet} ₺
                    </b>

                </div>

            `;

        }
    );


    /*
       SİPARİŞ KAYNAĞINI BELİRLE
    */

    const garsonSiparisi =
        s.kaynak === "garson" ||
        s.garsonSiparisi === true;


    const kaynakClass =
        garsonSiparisi
        ? "garson"
        : "musteri";


    const kaynakHTML =
        garsonSiparisi

        ?

        `
        <div class="kaynak garson">
            👨‍🍳 GARSON SİPARİŞİ
            <br>
            <small>
                Bu sipariş garson tarafından girildi.
            </small>
        </div>
        `

        :

        `
        <div class="kaynak musteri">
            👤 MÜŞTERİ SİPARİŞİ
            <br>
            <small>
                Bu sipariş müşteri tarafından gönderildi.
            </small>
        </div>
        `;


    return `

        <div class="
            siparis
            ${
                garsonSiparisi
                ?
                "garson-siparis"
                :
                "musteri-siparis"
            }
        ">

            <div class="siparis-baslik">

                <span class="siparis-no">
                    Sipariş #${index+1}
                </span>

                <span class="siparis-durum">
                    🟡 Bekleyen
                </span>

            </div>


            ${kaynakHTML}


            <div class="zaman">
                🕐 ${saat(s)}
            </div>


            ${html}


            <div class="toplam">
                Toplam:
                ${Number(s.toplam || 0)}
                ₺
            </div>


            <div class="butons">

                <button
                class="btn duzenle"
                onclick="
                    duzenle(
                        '${s.id}'
                    )
                ">

                    ✏️ Düzenle

                </button>


                <button
                class="btn onayla"
                onclick="
                    onayla(
                        '${s.id}'
                    )
                ">

                    🟢 Onayla

                </button>

            </div>


            <div
            id="duzen-${s.id}"
            class="duzenleme">

                ${duzenHTML(s)}

            </div>

        </div>

    `;

}


/* =========================
   DÜZENLE HTML
========================= */

function duzenHTML(s){

    let html = "";


    (s.urunler || []).forEach(
        (u,i) => {

            html += `

                <div class="duzen-satir">

                    <span>
                        ${u.urun}
                    </span>

                    <div class="adet">

                        <button
                        onclick="
                            duzenAdet(
                                '${s.id}',
                                ${i},
                                -1
                            )
                        ">

                            −

                        </button>

                        <span
                        id="duzen-${s.id}-${i}">
                            ${u.adet}
                        </span>

                        <button
                        onclick="
                            duzenAdet(
                                '${s.id}',
                                ${i},
                                1
                            )
                        ">

                            +

                        </button>

                    </div>

                </div>

            `;

        }
    );


    return `

        <button
        class="kaydet"
        onclick="
            duzenKaydet(
                '${s.id}'
            )
        ">

            💾 Kaydet

        </button>

    `;

}


let duzenSepet = {};


/* =========================
   DÜZENLE
========================= */

window.duzenle =
function(id){

    const el =
    document.getElementById(
        "duzen-"+id
    );

    if(el){

        el.classList.toggle(
            "acik"
        );

    }


    const s =
    siparisler.find(
        x => x.id === id
    );


    if(s){

        duzenSepet[id] =
        JSON.parse(
            JSON.stringify(
                s.urunler || []
            )
        );

    }

};


/* =========================
   DÜZENLE ADET
========================= */

window.duzenAdet =
function(id,index,miktar){

    if(!duzenSepet[id])
    return;


    const u =
    duzenSepet[id][index];


    if(!u)
    return;


    u.adet =
    Math.max(
        0,
        Number(u.adet || 0) +
        miktar
    );


    const el =
    document.getElementById(
        `duzen-${id}-${index}`
    );


    if(el){

        el.textContent =
        u.adet;

    }

};


/* =========================
   DÜZENLE KAYDET
========================= */

window.duzenKaydet =
async function(id){

    const liste =
    (duzenSepet[id] || [])
    .filter(
        u =>
        Number(u.adet || 0) > 0
    );


    let toplam = 0;


    liste.forEach(
        u => {

            u.tutar =
            Number(u.fiyat || 0) *
            Number(u.adet || 0);

            toplam += u.tutar;

        }
    );


    try{

        await updateDoc(

            doc(
                db,
                "siparisler",
                id
            ),

            {

                urunler:liste,

                toplam:toplam,

                duzenlendi:true,

                duzenlenmeZamani:
                serverTimestamp()

            }

        );


        alert(
            "✅ Sipariş düzenlendi."
        );

    }
    catch(error){

        alert(
            "❌ Düzenleme başarısız:\n" +
            error.message
        );

    }

};


/* =========================
   ONAYLA
========================= */

window.onayla =
async function(id){

    const s =
    siparisler.find(
        x => x.id === id
    );


    if(!s)
    return;


    const garson =
        s.kaynak === "garson" ||
        s.garsonSiparisi === true;


    const kaynak =
        garson
        ?
        "👨‍🍳 GARSON SİPARİŞİ"
        :
        "👤 MÜŞTERİ SİPARİŞİ";


    if(
        !confirm(
            kaynak +
            "\n\n"+
            "Masa " +
            s.masa +
            " siparişi onaylansın mı?"
        )
    ){

        return;

    }


    try{

        await updateDoc(

            doc(
                db,
                "siparisler",
                id
            ),

            {

                durum:
                "Onaylandı",

                onaylanmaZamani:
                serverTimestamp()

            }

        );

    }
    catch(error){

        alert(
            "❌ Onaylama başarısız:\n" +
            error.message
        );

    }

};


/* =========================
   MASALARI GÖSTER
========================= */

function masalariGoster(){

    const grid =
    document.getElementById(
        "masaGrid"
    );

    grid.innerHTML = "";


    const bekleyen =
    siparisler.filter(
        s =>
        s.durum === "Bekleyen"
    );


    document.getElementById(
        "bilgi"
    ).textContent =
    bekleyen.length +
    " bekleyen sipariş";


    const masaSonSiparis = {};


    bekleyen.forEach(
        s => {

            const masa =
            Number(s.masa);

            const z =
            zaman(s);


            if(
                !masaSonSiparis[masa] ||
                z > masaSonSiparis[masa]
            ){

                masaSonSiparis[masa] = z;

            }

        }
    );


    const masalar =
    Array.from(
        {length:50},
        (_,i) => i+1
    );


    masalar.sort(
        (a,b) => {

            const aZ =
            masaSonSiparis[a] || 0;

            const bZ =
            masaSonSiparis[b] || 0;


            if(aZ === 0 && bZ === 0)
                return a-b;


            if(aZ === 0)
                return 1;


            if(bZ === 0)
                return -1;


            return bZ-aZ;

        }
    );


    masalar.forEach(
        (masa,index) => {

            const siparislerMasa =
            bekleyen.filter(
                s =>
                Number(s.masa) === masa
            );


            const div =
            document.createElement(
                "div"
            );


            div.className =
            "masa";


            if(
                siparislerMasa.length
            ){

                div.classList.add(
                    "bekleyen"
                );

            }


            if(
                index === 0 &&
                siparislerMasa.length
            ){

                div.classList.add(
                    "yeni"
                );

            }


            let html = `

                <div class="masa-baslik">

                    <h3>
                        🪑 Masa ${masa}
                    </h3>

                    <span
                    class="
                    durum
                    ${
                        siparislerMasa.length
                        ?
                        "bekleyen"
                        :
                        ""
                    }
                    ">

                        ${
                            siparislerMasa.length
                            ?
                            "🟡 " +
                            siparislerMasa.length +
                            " Bekleyen"
                            :
                            "Boş"
                        }

                    </span>

                </div>


                <button
                class="garson-btn"
                onclick="
                    garsonMenusuAc(
                        ${masa}
                    )
                ">

                    👨‍🍳 Garson Siparişi

                </button>

            `;


            siparislerMasa.forEach(
                (s,i) => {

                    html +=
                    siparisHTML(
                        s,
                        i
                    );

                }
            );


            div.innerHTML =
            html;


            grid.appendChild(
                div
            );

        }
    );

}


/* =========================
   FIREBASE DİNLE
========================= */

const q =
query(
    collection(
        db,
        "siparisler"
    )
);


onSnapshot(

    q,

    snapshot => {

        siparisler = [];


        snapshot.forEach(
            item => {

                siparisler.push({

                    id:item.id,

                    ...item.data()

                });

            }
        );


        /*
           SADECE BEKLEYENLER
        */

        siparisler =
        siparisler.filter(
            s =>
            s.durum ===
            "Bekleyen"
        );


        siparisler.sort(
            (a,b) =>
            zaman(a)-zaman(b)
        );


        document.getElementById(
            "baglanti"
        ).textContent =
        "🟢 Firebase bağlantısı aktif";


        masalariGoster();

    },


    error => {

        console.error(error);


        document.getElementById(
            "baglanti"
        ).textContent =
        "🔴 Firebase bağlantı hatası";

    }

);
