<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Garson / Ocak</title>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    padding:15px;
    font-family:Arial,sans-serif;
    background:#171717;
    color:white;
}
.header{
    background:linear-gradient(135deg,#b71c1c,#e53935);
    padding:20px;
    border-radius:16px;
    text-align:center;
    margin-bottom:18px;
    box-shadow:0 5px 20px #0006;
}
.header h2{margin:0 0 5px}
.section-title{
    margin:24px 0 10px;
    padding-bottom:7px;
    border-bottom:1px solid #444;
}
.call-card{
    background:#292929;
    border-left:7px solid #ffeb3b;
    padding:15px;
    border-radius:13px;
    margin-bottom:10px;
    box-shadow:0 3px 10px #0006;
}
.call-card strong{
    color:#ffeb3b;
    font-size:20px;
}
.order-card{
    background:#252f27;
    border-left:7px solid #ff9800;
    padding:15px;
    border-radius:13px;
    margin-bottom:12px;
    box-shadow:0 3px 10px #0006;
}
.order-card.approved{
    border-left-color:#66bb6a;
}
.order-title{
    display:flex;
    justify-content:space-between;
    gap:10px;
}
.order-title strong{
    color:#a5d6a7;
    font-size:20px;
}
.product-line{
    display:flex;
    justify-content:space-between;
    padding:6px 0;
    border-bottom:1px dashed #555;
}
.total{
    text-align:right;
    color:#ffeb3b;
    font-weight:bold;
    margin-top:8px;
}
button{
    border:0;
    border-radius:9px;
    padding:12px;
    font-weight:bold;
    cursor:pointer;
}
.approve{
    width:100%;
    margin-top:10px;
    background:#388e3c;
    color:white;
}
.edit{
    width:100%;
    margin-top:8px;
    background:#1565c0;
    color:white;
}
.done{
    width:100%;
    margin-top:8px;
    background:#555;
    color:white;
}
.empty{
    text-align:center;
    color:#777;
    padding:15px;
}
.edit-box{
    background:#171717;
    padding:10px;
    border-radius:10px;
    margin-top:10px;
}
.edit-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:7px 0;
}
.edit-row button{
    padding:6px 12px;
    background:#555;
    color:white;
}
</style>
</head>

<body>

<div class="header">
<h2>☕ OCAK & GARSON</h2>
<small>Gelen çağrılar ve siparişler anlık olarak görünür</small>
</div>

<h3 class="section-title">🔔 Garson Çağrıları</h3>
<div id="bildirimListesi"></div>

<h3 class="section-title">🕐 Bekleyen Siparişler</h3>
<div id="bekleyenListesi"></div>

<h3 class="section-title">✅ Onaylanan Siparişler</h3>
<div id="onaylananListesi"></div>

<script>
const firebaseConfig={
    databaseURL:"https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId:"dijitalkahve-67f0a",
    storageBucket:"dijitalkahve-67f0a.appspot.com",
    messagingSenderId:"326476599239"
};

if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);

const db=firebase.app().database(
    "https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app"
);

let siparisData={};
let duzenleme={};

db.ref("bildirimler").on("value",snap=>{
    const data=snap.val();
    const box=document.getElementById("bildirimListesi");

    box.innerHTML="";

    if(!data){
        box.innerHTML='<div class="empty">Bekleyen çağrı yok.</div>';
        return;
    }

    Object.keys(data).forEach(key=>{
        const x=data[key];

        box.innerHTML+=`
        <div class="call-card">
            <strong>MASA ${x.masa}</strong>
            <div style="color:#bbb;margin-top:5px">Saat: ${x.zaman}</div>
            <button class="done"
                onclick="bildirimSil('${key}')">
                GİDİLDİ / ÇAĞRIYI KAPAT
            </button>
        </div>`;
    });
});

db.ref("siparisler").on("value",snap=>{
    siparisData=snap.val()||{};
    renderSiparisler();
});

function renderSiparisler(){
    const bekleyen=document.getElementById("bekleyenListesi");
    const onay=document.getElementById("onaylananListesi");

    bekleyen.innerHTML="";
    onay.innerHTML="";

    let b=false,o=false;

    Object.keys(siparisData).forEach(key=>{
        const sip=siparisData[key];

        let urunHtml="";

        Object.values(sip.urunler||{}).forEach(u=>{
            urunHtml+=`
            <div class="product-line">
                <span>${u.ad} x${u.adet}</span>
                <span>${(parseFloat(u.fiyat)||0)*u.adet} TL</span>
            </div>`;
        });

        if(sip.durum==="onaylandi"){
            o=true;

            onay.innerHTML+=`
            <div class="order-card approved">
                <div class="order-title">
                    <strong>MASA ${sip.masa}</strong>
                    <span>${sip.zaman}</span>
                </div>

                <div style="margin-top:10px">
                    ${urunHtml}
                </div>

                <div class="total">
                    ${sip.toplam} TL
                </div>
            </div>`;
        }else{
            b=true;

            bekleyen.innerHTML+=`
            <div class="order-card">
                <div class="order-title">
                    <strong>MASA ${sip.masa}</strong>
                    <span>${sip.zaman}</span>
                </div>

                <div style="margin-top:10px">
                    ${urunHtml}
                </div>

                <div class="total">
                    ${sip.toplam} TL
                </div>

                <button class="approve"
                    onclick="siparisOnayla('${key}')">
                    ✅ SİPARİŞİ ONAYLA
                </button>

                <button class="edit"
                    onclick="duzenle('${key}')">
                    ✏️ SİPARİŞİ DÜZENLE
                </button>

                <div id="edit-${key}"></div>
            </div>`;
        }
    });

    if(!b)bekleyen.innerHTML='<div class="empty">Bekleyen sipariş yok.</div>';
    if(!o)onay.innerHTML='<div class="empty">Onaylanan sipariş yok.</div>';
}

function siparisOnayla(id){
    db.ref("siparisler/"+id+"/durum").set("onaylandi");
}

function bildirimSil(id){
    db.ref("bildirimler/"+id).remove();
}

/* SİPARİŞ DÜZENLEME */
function duzenle(id){
    const sip=siparisData[id];
    if(!sip)return;

    if(duzenleme[id]){
        duzenleme[id]=false;
        renderSiparisler();
        return;
    }

    duzenleme[id]=true;

    const alan=document.getElementById("edit-"+id);

    let html='<div class="edit-box">';

    Object.keys(sip.urunler||{}).forEach(key=>{
        const u=sip.urunler[key];

        html+=`
        <div class="edit-row">
            <span>${u.ad}</span>

            <div>
                <button onclick="adetDegistir('${id}','${key}',-1)">−</button>
                <b style="padding:0 10px">${u.adet}</b>
                <button onclick="adetDegistir('${id}','${key}',1)">+</button>
            </div>
        </div>`;
    });

    html+=`</div>`;

    alan.innerHTML=html;
}

function adetDegistir(orderId,productId,delta){
    const ref=db.ref(
        "siparisler/"+orderId+"/urunler/"+productId
    );

    ref.once("value").then(snap=>{
        const u=snap.val();
        if(!u)return;

        const yeni=Math.max(0,(u.adet||0)+delta);

        if(yeni===0){
            ref.remove().then(()=>toplamGuncelle(orderId));
        }else{
            ref.update({adet:yeni})
            .then(()=>toplamGuncelle(orderId));
        }
    });
}

function toplamGuncelle(id){
    db.ref("siparisler/"+id+"/urunler")
    .once("value")
    .then(snap=>{
        const urunler=snap.val()||{};

        if(!Object.keys(urunler).length){
            db.ref("siparisler/"+id).remove();
            return;
        }

        let toplam=0;

        Object.values(urunler).forEach(u=>{
            toplam+=(parseFloat(u.fiyat)||0)*u.adet;
        });

        db.ref("siparisler/"+id+"/toplam").set(toplam);
    });
}
</script>

</body>
</html>
