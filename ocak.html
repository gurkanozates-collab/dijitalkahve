<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garson & Mutfak Paneli</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f1ee;color:#33231e;padding:15px;}
h2{margin-top:0;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;}
.kutu{background:white;padding:15px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.05);}
.kart{background:#fff8e1;border:1px solid #ffe082;border-radius:10px;padding:12px;margin-bottom:10px;}
.kart.cagri{background:#ffebee;border-color:#ffcdd2;}
.kart-header{display:flex;justify-content:space-between;font-weight:bold;margin-bottom:8px;}
.btn{border:none;padding:8px 12px;border-radius:6px;font-weight:bold;cursor:pointer;}
.onay-btn{background:#2e7d32;color:white;}
.tamam-btn{background:#1565c0;color:white;}
@media(max-width:700px){.grid{grid-template-columns:1fr;}}
</style>
</head>
<body>

<div class="grid">
    <div class="kutu">
        <h2>🔔 Garson Çağrıları</h2>
        <div id="cagriListe"></div>
    </div>
    <div class="kutu">
        <h2>👨‍🍳 Bekleyen Siparişler</h2>
        <div id="siparisListe"></div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyC05yXQzAlF2AYzzeaJrDdMUYKwohKOsWM",
    authDomain: "dijitalkahve-67f0a.firebaseapp.com",
    projectId: "dijitalkahve-67f0a",
    storageBucket: "dijitalkahve-67f0a.firebasestorage.app",
    messagingSenderId: "326476599239",
    appId: "1:326476599239:web:143f39583a3478118853e2",
    measurementId: "G-WM65PC4648"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// GARSON ÇAĞRILARINI DİNLE
onSnapshot(collection(db, "garsonCagrilar"), snap => {
    const alan = document.getElementById("cagriListe");
    alan.innerHTML = "";
    const bekleyenler = snap.docs.map(d => ({id: d.id, ...d.data()})).filter(c => c.durum === "bekliyor");

    if(!bekleyenler.length){ alan.innerHTML = "<p style='color:#777;'>Bekleyen çağrı yok.</p>"; return; }

    bekleyenler.forEach(c => {
        alan.innerHTML += `
            <div class="kart cagri">
                <div class="kart-header">
                    <span>🪑 Masa ${c.masa}</span>
                    <button class="btn tamam-btn" onclick="cagriKapat('${c.id}')">Tamamlandı</button>
                </div>
                <small>Garson çağrıldı</small>
            </div>
        `;
    });
});

// SİPARİŞLERİ DİNLE
onSnapshot(collection(db, "siparisler"), snap => {
    const alan = document.getElementById("siparisListe");
    alan.innerHTML = "";
    const bekleyenler = snap.docs.map(d => ({id: d.id, ...d.data()})).filter(s => s.durum === "Bekleyen");

    if(!bekleyenler.length){ alan.innerHTML = "<p style='color:#777;'>Bekleyen sipariş yok.</p>"; return; }

    bekleyenler.forEach(s => {
        let urunDetay = (s.urunler || []).map(u => `${u.adet}x ${u.urun}`).join(", ");
        alan.innerHTML += `
            <div class="kart">
                <div class="kart-header">
                    <span>🪑 Masa ${s.masa} - ${s.toplam} ₺</span>
                    <button class="btn onay-btn" onclick="siparisOnayla('${s.id}')">Onayla & Hazırla</button>
                </div>
                <div>${urunDetay}</div>
            </div>
        `;
    });
});

window.cagriKapat = async (id) => {
    await updateDoc(doc(db, "garsonCagrilar", id), { durum: "tamamlandi" });
};

window.siparisOnayla = async (id) => {
    await updateDoc(doc(db, "siparisler", id), { durum: "Onaylandı" });
};
</script>
</body>
</html>
