<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Dijital Kahvem - Garson</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f1ee;
    color:#33231e;
}

/* ================= HEADER ================= */

header{
    background:#4e342e;
    color:white;
    text-align:center;
    padding:18px 10px;
}

header h1{
    margin:0;
    font-size:28px;
}

header p{
    margin:6px 0 0;
}

/* ================= ÜST BİLGİ ================= */

.ust-bilgi{
    max-width:1400px;
    margin:auto;
    padding:12px 15px 0;
}

.durum-bilgi{
    background:white;
    border-radius:12px;
    padding:14px;
    box-shadow:0 2px 8px #0001;
    font-weight:bold;
}

/* ================= CONTAINER ================= */

.container{
    max-width:1400px;
    margin:auto;
    padding:15px;
}

/* ================= BAŞLIK ================= */

.sayfa-baslik{
    background:white;
    border-radius:14px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:0 2px 8px #0001;
}

.sayfa-baslik h2{
    margin:0 0 5px;
}

.sayfa-baslik p{
    margin:0;
    color:#777;
}

/* ================= MASA GRID ================= */

.masa-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

/* ================= MASA ================= */

.masa{
    background:white;
    border-radius:16px;
    padding:16px;

    border:2px solid #ddd;

    box-shadow:0 2px 8px #0001;

    transition:
        transform .20s ease,
        box-shadow .20s ease,
        border-color .20s ease;

    position:relative;
}

/*
FAREYLE HANGİ MASANIN ÜZERİNE GELİRSEN
SADECE O MASA BÜYÜR
*/

.masa:hover{
    transform:scale(1.06);
    box-shadow:0 10px 28px #0003;
    z-index:20;
}

/* Bekleyen siparişli masa */

.masa.bekleyen{
    border-color:#ef6c00;
    box-shadow:0 3px 12px #ef6c0033;
}

/* Bekleyen masa üzerine gelince daha fazla büyüsün */

.masa.bekleyen:hover{
    transform:scale(1.09);
    box-shadow:0 12px 32px #ef6c0055;
    z-index:30;
}

/* ================= MASA BAŞLIK ================= */

.masa-baslik{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.masa-baslik h3{
    margin:0;
    font-size:21px;
}

.durum{
    padding:5px 9px;
    border-radius:15px;
    font-size:12px;
    font-weight:bold;
}

.durum.acik{
    background:#e8f5e9;
    color:#2e7d32;
}

.durum.kapali{
    background:#eee;
    color:#777;
}

/* ================= BEKLEYEN UYARI ================= */

.bekleyen-uyari{
    background:#fff3cd;
    color:#ef6c00;

    border-radius:10px;

    padding:10px;

    margin:12px 0;

    text-align:center;

    font-weight:bold;

    animation:
        yanipsonme 1.2s infinite alternate;
}

@keyframes yanipsonme{

    from{
        box-shadow:0 0 0 #ef6c0000;
    }

    to{
        box-shadow:0 0 12px #ef6c0066;
    }

}

/* ================= TOPLAM ================= */

.masa-toplam{
    font-size:24px;
    font-weight:bold;
    margin:15px 0 5px;
}

.masa-alt{
    color:#777;
    font-size:13px;
}

/* ================= SİPARİŞ ================= */

.siparis-kart{
    margin-top:12px;

    border-top:1px solid #eee;

    padding-top:10px;
}

.siparis-baslik{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:8px;

    font-weight:bold;
}

.kaynak{
    display:inline-block;

    padding:5px 8px;

    border-radius:12px;

    font-size:11px;

    font-weight:bold;

    margin-bottom:8px;
}

.kaynak.musteri{
    background:#e3f2fd;
    color:#1565c0;
}

.kaynak.garson{
    background:#fff3e0;
    color:#ef6c00;
}

/* ================= ÜRÜNLER ================= */

.urun-satir{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:7px 0;

    border-bottom:1px solid #eee;
}

.urun-sol{
    display:flex;
    align-items:center;
    gap:7px;
}

.urun-adet{
    font-weight:bold;
}

/* ================= DÜZENLEME ================= */

.duzenleme{
    display:none;

    margin-top:10px;

    background:#f8f8f8;

    padding:10px;

    border-radius:10px;
}

.duzenleme.acik{
    display:block;
}

.duzen-urun{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:8px;

    margin-bottom:8px;
}

.duzen-urun:last-child{
    margin-bottom:0;
}

.duzen-ad{
    flex:1;
    font-weight:bold;
}

.adet-kontrol{
    display:flex;
    align-items:center;
    gap:5px;
}

.adet-kontrol button{
    width:32px;
    height:32px;

    border:0;
    border-radius:7px;

    background:#ddd;

    font-size:20px;
    font-weight:bold;

    cursor:pointer;
}

.adet-kontrol span{
    width:30px;
    text-align:center;
    font-weight:bold;
}

/* ================= BUTONLAR ================= */

.butonlar{
    display:grid;
    grid-template-columns:1fr 1fr;

    gap:8px;

    margin-top:12px;
}

.btn{
    border:0;
    border-radius:9px;

    padding:11px 8px;

    font-size:14px;
    font-weight:bold;

    cursor:pointer;
}

.btn-duzenle{
    background:#1565c0;
    color:white;
}

.btn-onay{
    background:#2e7d32;
    color:white;
}

.btn-iptal{
    background:#ffebee;
    color:#c62828;
}

.btn-kaydet{
    background:#7b1fa2;
    color:white;
}

.btn-kapat{
    background:#eee;
    color:#333;
}

/* ================= KAPALI MASA ================= */

.masa.kapali{
    opacity:.75;
}

/* ================= BOŞ ================= */

.bos{
    background:white;

    padding:35px;

    border-radius:14px;

    text-align:center;

    color:#777;

    grid-column:1/-1;
}

/* ================= MOBİL ================= */

@media(max-width:1100px){

    .masa-grid{
        grid-template-columns:repeat(3,1fr);
    }

}

@media(max-width:800px){

    .masa-grid{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:550px){

    .masa-grid{
        grid-template-columns:1fr;
    }

    .masa:hover{
        transform:none;
    }

    .masa.bekleyen:hover{
        transform:none;
    }

}

</style>
</head>

<body>

<header>

<h1>☕ DİJİTAL KAHVEM</h1>

<p>Garson Paneli</p>

</header>


<div class="ust-bilgi">

<div
id="durumBilgi"
class="durum-bilgi">

⏳ Siparişler yükleniyor...

</div>

</div>


<div class="container">

<div class="sayfa-baslik">

<h2>🪑 Masalar</h2>

<p>
Bekleyen siparişli masalar otomatik olarak en üstte görünür.
</p>

</div>


<div
id="masaGrid"
class="masa-grid">

</div>

</div>


<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getFirestore,
    collection,
    onSnapshot,
    doc,
    updateDoc,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig={

    apiKey:
    "AIzaSyC05yXQzAlF2AYzzeaJrDdMUYKwohKOsWM",

    authDomain:
    "dijitalkahve-67f0a.firebaseapp.com",

    databaseURL:
    "https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
    "dijitalkahve-67f0a",

    storageBucket:
    "dijitalkahve-67f0a.firebasestorage.app",

    messagingSenderId:
    "326476599239",

    appId:
    "1:326476599239:web:143f39583a3478118853e2",

    measurementId:
    "G-WM65PC4648"

};


const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);


/* =====================================================
   VERİLER
===================================================== */

let oturumlar=[];
let siparisler=[];


/*
Düzenleme modunda geçici olarak
değiştirilen siparişler.
*/

let duzenlenen={};


/* =====================================================
   PARA
===================================================== */

function para(n){

    return Number(n||0)
    .toLocaleString("tr-TR")
    +" ₺";

}


/* =====================================================
   TARİH
===================================================== */

function zaman(s){

    if(
        s.olusturmaZamani &&
        typeof s.olusturmaZamani.toDate==="function"
    ){

        return s.olusturmaZamani
        .toDate()
        .toLocaleTimeString(
            "tr-TR",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    }

    return "";

}


/* =====================================================
   SİPARİŞ TARİH SIRASI
===================================================== */

function zamanDegeri(s){

    if(
        s.olusturmaZamani &&
        typeof s.olusturmaZamani.toMillis==="function"
    ){

        return s.olusturmaZamani.toMillis();

    }

    return 0;

}


/* =====================================================
   MASALARI GÖSTER
===================================================== */

function masalariGoster(){

    const grid=
    document.getElementById(
        "masaGrid"
    );

    grid.innerHTML="";


    const masalar=[];


    /*
    Önce bütün 50 masayı oluşturuyoruz.
    */

    for(
        let masa=1;
        masa<=50;
        masa++
    ){

        const oturum=
        oturumlar.find(
            o=>
            Number(o.masa)===masa &&
            o.durum==="acik"
        );


        const siparislerMasa=
        oturum
        ?
        siparisler.filter(
            s=>
            s.oturumId===oturum.id
        )
        :
        [];


        const bekleyenler=
        siparislerMasa.filter(
            s=>
            s.durum==="Bekleyen"
        );


        const onaylananlar=
        siparislerMasa.filter(
            s=>
            s.durum==="Onaylandı"
        );


        const toplam=
        onaylananlar.reduce(
            (toplam,s)=>
            toplam+
            Number(s.toplam||0),
            0
        );


        masalar.push({

            masa,

            oturum,

            siparislerMasa,

            bekleyenler,

            onaylananlar,

            toplam

        });

    }


    /*
    ÖNEMLİ:

    Bekleyen sipariş olan masalar
    en üste çıkar.

    Aynı grupta en yeni sipariş
    önce gelir.
    */

    masalar.sort(
        (a,b)=>{

            const aBek=
            a.bekleyenler.length>0;

            const bBek=
            b.bekleyenler.length>0;


            if(aBek && !bBek){
                return -1;
            }

            if(!aBek && bBek){
                return 1;
            }


            if(aBek && bBek){

                const aZaman=
                Math.max(
                    ...a.bekleyenler.map(
                        zamanDegeri
                    ),
                    0
                );

                const bZaman=
                Math.max(
                    ...b.bekleyenler.map(
                        zamanDegeri
                    ),
                    0
                );


                if(bZaman!==aZaman){

                    return bZaman-aZaman;

                }

            }


            /*
            Bekleyen yoksa normal masa sırası
            */

            return a.masa-b.masa;

        }
    );


    /*
    MASALARI OLUŞTUR
    */

    masalar.forEach(
        bilgi=>{

            const {

                masa,
                oturum,
                siparislerMasa,
                bekleyenler,
                onaylananlar,
                toplam

            }=bilgi;


            const div=
            document.createElement(
                "div"
            );


            div.className=
            "masa"+
            (oturum?"":" kapali")+
            (bekleyenler.length?" bekleyen":"");


            let siparisHTML="";


            /*
            Bekleyen siparişleri önce göster
            */

            const siraliSiparisler=
            [
                ...bekleyenler,
                ...onaylananlar
            ];


            /*
            Siparişleri göster
            */

            siraliSiparisler.forEach(
                s=>{

                    siparisHTML+=
                    siparisHTMLOlustur(s);

                }
            );


            div.innerHTML=`

                <div class="masa-baslik">

                    <h3>
                        🪑 Masa ${masa}
                    </h3>

                    <span class="
                        durum
                        ${oturum?"acik":"kapali"}
                    ">

                        ${
                            oturum
                            ?
                            "🟢 Açık"
                            :
                            "⚪ Kapalı"
                        }

                    </span>

                </div>


                ${
                    bekleyenler.length
                    ?
                    `

                    <div class="bekleyen-uyari">

                        🔔
                        ${bekleyenler.length}
                        BEKLEYEN SİPARİŞ

                    </div>

                    `
                    :
                    ""
                }


                <div class="masa-toplam">

                    ${para(toplam)}

                </div>


                <div class="masa-alt">

                    Onaylı sipariş:
                    <b>${onaylananlar.length}</b>

                    ${
                        bekleyenler.length
                        ?
                        `
                        · Bekleyen:
                        <b>${bekleyenler.length}</b>
                        `
                        :
                        ""
                    }

                </div>


                ${
                    siparisHTML
                    ||
                    `
                    <div
                    style="
                    margin-top:15px;
                    color:#777;
                    text-align:center;
                    ">

                    Henüz sipariş yok.

                    </div>
                    `
                }

            `;


            grid.appendChild(div);

        }
    );


    /*
    Bilgi yazısı
    */

    const bekleyenToplam=
    siparisler.filter(
        s=>s.durum==="Bekleyen"
    ).length;


    const aktifMasa=
    oturumlar.filter(
        o=>o.durum==="acik"
    ).length;


    document.getElementById(
        "durumBilgi"
    ).innerHTML=

    bekleyenToplam
    ?

    `🔔 <b>${bekleyenToplam}</b> bekleyen sipariş var · 🟢 ${aktifMasa} aktif masa`

    :

    `🟢 Bekleyen sipariş yok · ${aktifMasa} aktif masa`;

}


/* =====================================================
   SİPARİŞ HTML
===================================================== */

function siparisHTMLOlustur(s){

    const bekleyen=
    s.durum==="Bekleyen";


    const garson=
    s.kaynak==="garson" ||
    s.garsonSiparisi===true;


    let urunHTML="";


    (s.urunler||[]).forEach(
        (u,index)=>{

            urunHTML+=`

                <div class="urun-satir">

                    <div class="urun-sol">

                        <span class="urun-adet">

                            ${u.adet}×

                        </span>

                        <span>

                            ${u.urun}

                        </span>

                    </div>

                    <b>

                        ${para(u.tutar)}

                    </b>

                </div>

            `;

        }
    );


    /*
    Düzenleme alanı
    */

    let duzenHTML="";


    if(
        bekleyen &&
        duzenlenen[s.id]
    ){

        duzenHTML=`

            <div
            class="duzenleme acik"
            id="duzen-${s.id}">

                ${(s.urunler||[]).map(
                    (u,index)=>`

                    <div class="duzen-urun">

                        <div class="duzen-ad">

                            ${u.urun}

                        </div>


                        <div class="adet-kontrol">

                            <button
                            onclick="
                            adetDegistir(
                                '${s.id}',
                                ${index},
                                -1
                            )">

                                −

                            </button>


                            <span>

                                ${u.adet}

                            </span>


                            <button
                            onclick="
                            adetDegistir(
                                '${s.id}',
                                ${index},
                                1
                            )">

                                +

                            </button>

                        </div>

                    </div>

                    `
                ).join("")}


                <button
                class="btn btn-kaydet"
                style="
                width:100%;
                margin-top:8px;
                "
                onclick="
                duzenlemeyiKaydet(
                    '${s.id}'
                )">

                    💾 Değişiklikleri Kaydet

                </button>


                <button
                class="btn btn-kapat"
                style="
                width:100%;
                margin-top:6px;
                "
                onclick="
                duzenlemeyiKapat(
                    '${s.id}'
                )">

                    ✖ Kapat

                </button>

            </div>

        `;

    }


    return `

        <div class="siparis-kart">

            <div class="siparis-baslik">

                <span>

                    ${
                        bekleyen
                        ?
                        "🟡 BEKLEYEN"
                        :
                        "🟢 ONAYLANDI"
                    }

                </span>

                <span>

                    ${zaman(s)}

                </span>

            </div>


            <span class="
                kaynak
                ${garson?"garson":"musteri"}
            ">

                ${
                    garson
                    ?
                    "👨‍🍳 GARSON SİPARİŞİ"
                    :
                    "👤 MÜŞTERİ SİPARİŞİ"
                }

            </span>


            ${urunHTML}


            <div class="sip-toplam">

                ${para(s.toplam)}

            </div>


            ${
                bekleyen
                ?
                `

                <div class="butonlar">

                    <button
                    class="btn btn-duzenle"
                    onclick="
                    duzenleAc(
                        '${s.id}'
                    )">

                        ✏️ Düzenle

                    </button>


                    <button
                    class="btn btn-onay"
                    onclick="
                    siparisOnayla(
                        '${s.id}'
                    )">

                        🟢 Onayla

                    </button>

                </div>


                <button
                class="btn btn-iptal"
                style="
                width:100%;
                margin-top:7px;
                "
                onclick="
                siparisIptal(
                    '${s.id}'
                )">

                    ❌ Siparişi İptal Et

                </button>


                ${duzenHTML}

                `
                :
                ""
            }

        </div>

    `;

}


/* =====================================================
   DÜZENLEME AÇ
===================================================== */

window.duzenleAc=
function(id){

    duzenlenen[id]=true;

    masalariGoster();

};


/* =====================================================
   DÜZENLEME KAPAT
===================================================== */

window.duzenlemeyiKapat=
function(id){

    delete duzenlenen[id];

    masalariGoster();

};


/* =====================================================
   ADET DEĞİŞTİR
===================================================== */

window.adetDegistir=
function(
    id,
    index,
    fark
){

    const siparis=
    siparisler.find(
        s=>s.id===id
    );


    if(!siparis){
        return;
    }


    if(!siparis.urunler){
        return;
    }


    const urun=
    siparis.urunler[index];


    if(!urun){
        return;
    }


    let yeniAdet=
    Number(urun.adet||0)+fark;


    /*
    0'ın altına düşmesin
    */

    if(yeniAdet<0){
        yeniAdet=0;
    }


    urun.adet=yeniAdet;


    urun.tutar=
    yeniAdet*
    Number(urun.fiyat||0);


    /*
    0 adet olan ürünü kaldır
    */

    siparis.urunler=
    siparis.urunler.filter(
        x=>Number(x.adet)>0
    );


    /*
    Yeni toplam
    */

    siparis.toplam=
    siparis.urunler.reduce(
        (toplam,u)=>
        toplam+
        Number(u.tutar||0),
        0
    );


    masalariGoster();

};


/* =====================================================
   DÜZENLEMEYİ FIREBASE'E KAYDET
===================================================== */

window.duzenlemeyiKaydet=
async function(id){

    const siparis=
    siparisler.find(
        s=>s.id===id
    );


    if(!siparis){
        return;
    }


    if(
        !siparis.urunler ||
        !siparis.urunler.length
    ){

        alert(
            "❌ Siparişte ürün kalmadı."
        );

        return;

    }


    try{

        await updateDoc(
            doc(
                db,
                "siparisler",
                id
            ),
            {

                urunler:
                siparis.urunler,

                toplam:
                siparis.toplam,

                duzenlenmeZamani:
                serverTimestamp()

            }
        );


        delete duzenlenen[id];


        alert(
            "✅ Sipariş güncellendi."
        );


        masalariGoster();

    }
    catch(e){

        alert(
            "❌ Sipariş güncellenemedi:\n"+
            e.message
        );

    }

};


/* =====================================================
   SİPARİŞ ONAYLA
===================================================== */

window.siparisOnayla=
async function(id){

    const siparis=
    siparisler.find(
        s=>s.id===id
    );


    if(!siparis){
        return;
    }


    if(
        !confirm(
            "Bu sipariş onaylansın mı?\n\n"+
            "Sipariş toplamı: "+
            para(siparis.toplam)
        )
    ){

        return;

    }


    try{

        await updateDoc(
            doc(
                db,
                "siparisler",
                id
            ),
            {

                durum:
                "Onaylandı",

                onaylanmaZamani:
                serverTimestamp()

            }
        );


        delete duzenlenen[id];


        /*
        Firebase güncellendikten sonra
        masa otomatik olarak normal sırasına
        dönecek.
        */

    }
    catch(e){

        alert(
            "❌ Sipariş onaylanamadı:\n"+
            e.message
        );

    }

};


/* =====================================================
   SİPARİŞ İPTAL
===================================================== */

window.siparisIptal=
async function(id){

    const siparis=
    siparisler.find(
        s=>s.id===id
    );


    if(!siparis){
        return;
    }


    if(
        !confirm(
            "Bu sipariş iptal edilsin mi?"
        )
    ){

        return;

    }


    try{

        await updateDoc(
            doc(
                db,
                "siparisler",
                id
            ),
            {

                durum:
                "İptal",

                iptalZamani:
                serverTimestamp()

            }
        );


        delete duzenlenen[id];

    }
    catch(e){

        alert(
            "❌ Sipariş iptal edilemedi:\n"+
            e.message
        );

    }

};
