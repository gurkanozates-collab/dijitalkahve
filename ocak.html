<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Garson Paneli</title>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f4f6f8;color:#263238}
.header{
 background:linear-gradient(135deg,#3e2723,#795548);
 color:white;padding:22px;text-align:center
}
.header h2{margin:0}
.container{max-width:900px;margin:auto;padding:15px}
.section{margin-bottom:25px}
.section-title{
 display:flex;justify-content:space-between;align-items:center
}
.badge{
 background:#795548;color:white;min-width:28px;height:28px;
 border-radius:50%;display:flex;align-items:center;
 justify-content:center;font-weight:bold
}
.empty{
 background:white;padding:22px;border-radius:12px;
 text-align:center;color:#999
}
.card{
 background:white;padding:16px;margin:10px 0;
 border-radius:14px;box-shadow:0 3px 12px #0001;
 border-left:6px solid #fb8c00
}
.card.onayli{border-left-color:#43a047}
.header-row{
 display:flex;justify-content:space-between;
 margin-bottom:10px
}
.masa{font-size:20px;font-weight:bold;color:#5d4037}
.urun{
 display:flex;justify-content:space-between;
 padding:9px 0;border-bottom:1px dashed #ddd
}
.toplam{
 text-align:right;font-size:18px;font-weight:bold;
 margin-top:12px
}
button{
 width:100%;border:0;padding:12px;
 border-radius:9px;font-weight:bold;cursor:pointer;
 margin-top:9px
}
.onay{background:#2e7d32;color:white}
.cagri{
 background:#ffb300;
 display:flex;justify-content:space-between;
 align-items:center;padding:14px;border-radius:12px;
 margin:8px 0
}
.cagri button{width:auto;background:#fff;margin:0}
</style>
</head>

<body>

<div class="header">
<h2>☕ GARSON PANELİ</h2>
<p>Dijital Kahve • Canlı Sipariş Yönetimi</p>
</div>

<div class="container">

<div class="section">
<div class="section-title">
<h3>🔔 Garson Çağrıları</h3>
<span class="badge" id="cagriSayisi">0</span>
</div>
<div id="bildirimListesi"></div>
</div>

<div class="section">
<div class="section-title">
<h3>🕐 Bekleyen Siparişler</h3>
<span class="badge" id="bekleyenSayisi">0</span>
</div>
<div id="bekleyenListesi"></div>
</div>

<div class="section">
<h3>✅ Onaylanan Siparişler</h3>
<div id="onaylananListesi"></div>
</div>

</div>

<script>
const firebaseConfig={
 databaseURL:"https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app",
 projectId:"dijitalkahve-67f0a",
 storageBucket:"dijitalkahve-67f0a.appspot.com",
 messagingSenderId:"326476599239"
};

if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);

const db=firebase.app().database(
 "https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app"
);

db.ref("bildirimler").on("value",snap=>{

 const data=snap.val()||{};
 const liste=document.getElementById("bildirimListesi");

 document.getElementById("cagriSayisi").innerText=
 Object.keys(data).length;

 liste.innerHTML="";

 if(Object.keys(data).length===0){
  liste.innerHTML='<div class="empty">Bekleyen garson çağrısı yok.</div>';
  return;
 }

 Object.keys(data).forEach(id=>{
  const x=data[id];

  liste.innerHTML+=`
  <div class="cagri">
   <div>
    <b>🔔 MASA ${x.masa}</b><br>
    <small>${x.zaman||"-"}</small>
   </div>
   <button onclick="cagriSil('${id}')">✓ GİDİLDİ</button>
  </div>`;
 });
});

function cagriSil(id){
 db.ref("bildirimler/"+id).remove();
}

db.ref("siparisler").on("value",snap=>{

 const data=snap.val()||{};

 const bekleyen=document.getElementById("bekleyenListesi");
 const onaylanan=document.getElementById("onaylananListesi");

 bekleyen.innerHTML="";
 onaylanan.innerHTML="";

 let bekleyenSayisi=0;

 Object.keys(data).forEach(id=>{

  const s=data[id];
  if(!s)return;

  let urunHtml="";

  Object.values(s.urunler||{}).forEach(u=>{
   const tutar=(parseFloat(u.fiyat)||0)*(parseInt(u.adet)||0);

   urunHtml+=`
   <div class="urun">
    <span>${u.ad} × ${u.adet}</span>
    <b>${tutar.toFixed(2)} TL</b>
   </div>`;
  });

  const toplam=parseFloat(s.toplam)||0;

  if(s.durum!=="onaylandi"){

   bekleyenSayisi++;

   bekleyen.innerHTML+=`
   <div class="card">
    <div class="header-row">
     <span class="masa">MASA ${s.masa}</span>
     <small>${s.zaman||"-"}</small>
    </div>

    ${urunHtml}

    <div class="toplam">
     Toplam: ${toplam.toFixed(2)} TL
    </div>

    <button class="onay" onclick="onayla('${id}')">
     ✓ SİPARİŞİ ONAYLA
    </button>
   </div>`;
  }
 });

 document.getElementById("bekleyenSayisi").innerText=
  bekleyenSayisi;

 if(bekleyenSayisi===0)
  bekleyen.innerHTML='<div class="empty">Bekleyen sipariş yok.</div>';

 /*
   ONAYLANANLAR MASA BAZINDA
 */
 const masalar={};

 Object.values(data).forEach(s=>{

  if(!s || s.durum!=="onaylandi")return;

  const masa=s.masa;

  if(!masalar[masa]){
   masalar[masa]={
    urunler:{},
    toplam:0
   };
  }

  Object.values(s.urunler||{}).forEach(u=>{

   const key=String(u.ad).toLowerCase();

   if(!masalar[masa].urunler[key]){
    masalar[masa].urunler[key]={
     ad:u.ad,
     adet:0,
     fiyat:parseFloat(u.fiyat)||0
    };
   }

   masalar[masa].urunler[key].adet+=
    parseInt(u.adet)||0;

   masalar[masa].toplam+=
    (parseFloat(u.fiyat)||0)*(parseInt(u.adet)||0);
  });
 });

 if(Object.keys(masalar).length===0){
  onaylanan.innerHTML=
   '<div class="empty">Henüz onaylanan sipariş yok.</div>';
  return;
 }

 Object.keys(masalar).forEach(masa=>{

  const m=masalar[masa];
  let html="";

  Object.values(m.urunler).forEach(u=>{
   html+=`
   <div class="urun">
    <span>${u.ad} × ${u.adet}</span>
    <b>${(u.adet*u.fiyat).toFixed(2)} TL</b>
   </div>`;
  });

  onaylanan.innerHTML+=`
  <div class="card onayli">
   <div class="header-row">
    <span class="masa">MASA ${masa}</span>
    <span>✓ ONAYLANDI</span>
   </div>

   ${html}

   <div class="toplam">
    Masa Toplamı: ${m.toplam.toFixed(2)} TL
   </div>
  </div>`;
 });
});

function onayla(id){

 db.ref("siparisler/"+id+"/durum")
 .set("onaylandi")
 .catch(e=>alert("Hata: "+e.message));
}
</script>

</body>
</html>
