<script type="module">


/* ==================================================
   FIREBASE
================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getFirestore,
    collection,
    query,
    onSnapshot,
    doc,
    updateDoc,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* ==================================================
   FIREBASE CONFIG
================================================== */

const firebaseConfig={

    apiKey:
    "AIzaSyC05yXQzAlF2AYzzeaJrDdMUYKwohKOsWM",

    authDomain:
    "dijitalkahve-67f0a.firebaseapp.com",

    databaseURL:
    "https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
    "dijitalkahve-67f0a",

    storageBucket:
    "dijitalkahve-67f0a.firebasestorage.app",

    messagingSenderId:
    "326476599239",

    appId:
    "1:326476599239:web:143f39583a3478118853e2",

    measurementId:
    "G-WM65PC4648"

};


const app=
initializeApp(
    firebaseConfig
);


const db=
getFirestore(app);


/* ==================================================
   ÜRÜN FİYATLARI
================================================== */

const fiyatlar={

    "Çay":25,

    "Nescafe":60,

    "Türk Kahvesi":70,

    "Su":15,

    "Kola":50,

    "Fanta":50,

    "Tost":100

};


/* ==================================================
   MASA SAYISI
================================================== */

const masaSayisi=50;


/* ==================================================
   DEĞİŞKENLER
================================================== */

let tumSiparisler=[];

const duzenlemeler={};


/* ==================================================
   FIREBASE DİNLE
================================================== */

const siparisQuery=
query(
    collection(
        db,
        "siparisler"
    )
);


onSnapshot(

    siparisQuery,

    snapshot=>{

        tumSiparisler=[];


        snapshot.forEach(
            item=>{

                tumSiparisler.push({

                    id:item.id,

                    ...item.data()

                });

            }
        );


        /* ==========================================
           SADECE BEKLEYENLER
        ========================================== */

        const bekleyenSiparisler=
        tumSiparisler.filter(
            s=>
            s.durum==="Bekleyen"
        );


        bekleyenSiparisler.sort(
            (a,b)=>{

                const ta=
                a.olusturmaZamani
                ?.toMillis?.()||0;

                const tb=
                b.olusturmaZamani
                ?.toMillis?.()||0;

                return ta-tb;

            }
        );


        document.getElementById(
            "baglantiDurumu"
        ).textContent=
        "🟢 Firebase bağlantısı aktif";


        document.getElementById(
            "bekleyenBilgi"
        ).textContent=
        bekleyenSiparisler.length+
        " adet bekleyen sipariş var";


        masalariGoster();

    },

    error=>{

        console.error(error);


        document.getElementById(
            "baglantiDurumu"
        ).textContent=
        "🔴 Firebase bağlantı hatası";


        document.getElementById(
            "bekleyenBilgi"
        ).textContent=
        "Firebase bağlantısı kurulamadı";

    }

);


/* ==================================================
   MASALARI GÖSTER
================================================== */

function masalariGoster(){

    const grid=
    document.getElementById(
        "masaGrid"
    );


    grid.innerHTML="";


    /*
       SADECE BEKLEYENLER
    */

    const bekleyenSiparisler=
    tumSiparisler.filter(
        s=>
        s.durum==="Bekleyen"
    );


    for(
        let masa=1;
        masa<=masaSayisi;
        masa++
    ){

        const siparisler=
        bekleyenSiparisler.filter(
            s=>
            String(s.masa)===
            String(masa)
        );


        const masaDiv=
        document.createElement(
            "div"
        );


        masaDiv.className=
        "masa";


        masaDiv.dataset.masa=
        masa;


        /*
           BEKLEYEN VARSA
        */

        if(
            siparisler.length>0
        ){

            masaDiv.classList.add(
                "bekleyen"
            );

        }


        masaDiv.innerHTML=`

            <div class="masa-baslik">

                <h2>
                    🪑 Masa ${masa}
                </h2>


                <span
                class="masa-durum ${
                    siparisler.length>0
                    ?
                    "bekleyen"
                    :
                    ""
                }">

                    ${
                        siparisler.length>0
                        ?
                        "🟡 "+
                        siparisler.length+
                        " Bekleyen"
                        :
                        "Boş"
                    }

                </span>

            </div>

        `;


        /*
           BOŞ MASA
        */

        if(
            siparisler.length===0
        ){

            masaDiv.innerHTML+=`

                <div class="bos">

                    Bekleyen sipariş yok.

                </div>

            `;

        }


        /*
           BEKLEYENLERİN HER BİRİ
           AYRI KART
        */

        else{

            siparisler.forEach(
                (siparis,index)=>{

                    masaDiv.innerHTML+=
                    siparisHTML(
                        siparis,
                        index
                    );

                }
            );

        }


        grid.appendChild(
            masaDiv
        );

    }


    /*
       HOVER SİSTEMİ
    */

    hoverSistemi();

}


/* ==================================================
   HOVER SİSTEMİ
================================================== */

function hoverSistemi(){

    const masalar=
    document.querySelectorAll(
        ".masa"
    );


    masalar.forEach(
        masa=>{


        masa.addEventListener(
            "mouseenter",
            ()=>{

                /*
                   MOBİLDE HOVER YOK
                */

                if(
                    window.innerWidth<=500
                ){

                    return;

                }


                /*
                   DİĞERLERİ PASİF
                */

                masalar.forEach(
                    m=>{

                        if(m!==masa){

                            m.classList.add(
                                "pasif-masa"
                            );

                            m.classList.remove(
                                "aktif-masa"
                            );

                        }

                    }
                );


                /*
                   AKTİF MASA
                */

                masa.classList.remove(
                    "pasif-masa"
                );

                masa.classList.add(
                    "aktif-masa"
                );


                /*
                   MASAYI EKRAN MERKEZİNE
                   YAKLAŞTIR
                */

                setTimeout(
                    ()=>{

                        const rect=
                        masa.getBoundingClientRect();


                        const masaX=
                        rect.left+
                        rect.width/2;


                        const masaY=
                        rect.top+
                        rect.height/2;


                        const ekranX=
                        window.innerWidth/2;


                        const ekranY=
                        window.innerHeight/2;


                        const farkX=
                        masaX-ekranX;


                        const farkY=
                        masaY-ekranY;


                        window.scrollBy({

                            left:farkX,

                            top:farkY,

                            behavior:"smooth"

                        });

                    },

                    50
                );

            }
        );


        masa.addEventListener(
            "mouseleave",
            ()=>{

                setTimeout(
                    ()=>{

                        /*
                           Başka masa üzerinde
                           değilsek sıfırla
                        */

                        if(
                            document.querySelector(
                                ".masa:hover"
                            )
                        ){

                            return;

                        }


                        masalar.forEach(
                            m=>{

                                m.classList.remove(
                                    "aktif-masa"
                                );

                                m.classList.remove(
                                    "pasif-masa"
                                );

                            }
                        );

                    },

                    100
                );

            }
        );

    });

}


/* ==================================================
   SİPARİŞ HTML
================================================== */

function siparisHTML(
    siparis,
    index
){

    let zaman=
    "Saat bekleniyor";


    /*
       SAAT
    */

    if(
        siparis.olusturmaZamani
    ){

        const tarih=
        siparis.olusturmaZamani
        .toDate();


        zaman=
        tarih.toLocaleString(
            "tr-TR",
            {

                day:"2-digit",

                month:"2-digit",

                year:"numeric",

                hour:"2-digit",

                minute:"2-digit",

                second:"2-digit"

            }
        );

    }


    let urunler="";


    /*
       ÜRÜNLER
    */

    (
        siparis.urunler||[]
    ).forEach(
        u=>{

            const fiyat=
            Number(
                u.fiyat||
                fiyatlar[u.urun]||
                0
            );


            const adet=
            Number(
                u.adet||0
            );


            urunler+=`

                <div class="urun">

                    <div>

                        <div class="urun-ad">

                            ${u.urun}

                        </div>


                        <div class="urun-fiyat">

                            ${fiyat} ₺ × ${adet}

                        </div>

                    </div>


                    <b>

                        ${fiyat*adet} ₺

                    </b>

                </div>

            `;

        }
    );


    return `

        <div
        class="siparis"
        id="siparis-${siparis.id}"
        >

            <div class="siparis-baslik">

                <span class="siparis-no">

                    Sipariş #${index+1}

                </span>


                <span class="siparis-durum">

                    🟡 Bekleyen

                </span>

            </div>


            <div class="siparis-zaman">

                🕐 ${zaman}

            </div>


            ${urunler}


            <div class="siparis-toplam">

                Toplam:
                ${Number(
                    siparis.toplam||0
                )} ₺

            </div>


            <div class="butons">

                <button
                class="btn duzenle"
                onclick="
                    duzenleAc('${siparis.id}')
                "
                >

                    ✏️ Düzenle

                </button>


                <button
                class="btn onayla"
                onclick="
                    siparisOnayla('${siparis.id}')
                "
                >

                    🟢 Onayla

                </button>

            </div>


            <div
            id="duzen-${siparis.id}"
            class="duzenleme"
            >

                ${duzenHTML(siparis)}

            </div>

        </div>

    `;

}


/* ==================================================
   DÜZENLEME HTML
================================================== */

function duzenHTML(
    siparis
){

    let html="";


    (
        siparis.urunler||[]
    ).forEach(
        (u,index)=>{

            const adet=
            Number(
                u.adet||0
            );


            const fiyat=
            Number(
                u.fiyat||
                fiyatlar[u.urun]||
                0
            );


            html+=`

                <div class="duzen-urun">

                    <div>

                        <b>

                            ${u.urun}

                        </b>

                        <br>

                        <small>

                            ${fiyat} ₺

                        </small>

                    </div>


                    <div class="adet-kontrol">

                        <button
                        onclick="
                            duzenAdet(
                                '${siparis.id}',
                                ${index},
                                -1
                            )
                        "
                        >

                            −

                        </button>


                        <span
                        class="adet-sayi"
                        id="
                            adet-${siparis.id}-${index}
                        "
                        >

                            ${adet}

                        </span>


                        <button
                        onclick="
                            duzenAdet(
                                '${siparis.id}',
                                ${index},
                                1
                            )
                        "
                        >

                            +

                        </button>

                    </div>

                </div>

            `;

        }
    );


    html+=`

        <div class="duzen-alt">

            <button
            class="kaydet"
            onclick="
                duzenKaydet('${siparis.id}')
            "
            >

                💾 Değişiklikleri Kaydet

            </button>

        </div>

    `;


    return html;

}


/* ==================================================
   DÜZENLE AÇ / KAPAT
================================================== */

window.duzenleAc=
function(id){

    const el=
    document.getElementById(
        "duzen-"+id
    );


    if(!el)
    return;


    el.classList.toggle(
        "acik"
    );

};


/* ==================================================
   ADET DEĞİŞTİR
================================================== */

window.duzenAdet=
function(
    siparisId,
    urunIndex,
    degisim
){

    const siparis=
    tumSiparisler.find(
        s=>
        s.id===
        siparisId
    );


    if(!siparis)
    return;


    /*
       KOPYA OLUŞTUR
    */

    if(
        !duzenlemeler[siparisId]
    ){

        duzenlemeler[siparisId]=
        JSON.parse(
            JSON.stringify(
                siparis.urunler||[]
            )
        );

    }


    const urun=
    duzenlemeler[siparisId]
    [urunIndex];


    if(!urun)
    return;


    urun.adet=
    Math.max(
        0,
        Number(
            urun.adet||0
        )+
        degisim
    );


    const span=
    document.getElementById(
        `adet-${siparisId}-${urunIndex}`
    );


    if(span){

        span.textContent=
        urun.adet;

    }

};


/* ==================================================
   DÜZENLEMEYİ KAYDET
================================================== */

window.duzenKaydet=
async function(id){

    const siparis=
    tumSiparisler.find(
        s=>
        s.id===
        id
    );


    if(!siparis)
    return;


    const yeniUrunler=
    duzenlemeler[id]||
    siparis.urunler||
    [];


    const temizUrunler=
    yeniUrunler.filter(
        u=>
        Number(
            u.adet||0
        )>0
    );


    let yeniToplam=0;


    temizUrunler.forEach(
        u=>{

            const fiyat=
            Number(
                u.fiyat||
                fiyatlar[u.urun]||
                0
            );


            u.fiyat=
            fiyat;


            u.tutar=
            fiyat*
            Number(
                u.adet||0
            );


            yeniToplam+=
            u.tutar;

        }
    );


    try{

        await updateDoc(

            doc(
                db,
                "siparisler",
                id
            ),

            {

                urunler:
                temizUrunler,

                toplam:
                yeniToplam,

                duzenlendi:
                true,

                duzenlenmeZamani:
                serverTimestamp()

            }

        );


        delete duzenlemeler[id];


        alert(
            "✅ Sipariş düzenlendi."
        );

    }
    catch(error){

        console.error(error);


        alert(
            "❌ Sipariş düzenlenemedi.\n\n"+
            error.message
        );

    }

};
