<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Dijital Kahvem - Garson</title>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
      import {
        getFirestore,
        doc,
        getDoc,
      } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
      const c = {
          apiKey: "AIzaSyC05yXQzAlF2AYzzeaJrDdMUYKwohKOsWM",
          authDomain: "dijitalkahve-67f0a.firebaseapp.com",
          projectId: "dijitalkahve-67f0a",
          appId: "1:326476599239:web:143f39583a3478118853e2",
        },
        dbs = getFirestore(initializeApp(c, "garsonPinApp"));
      function goster(v) {
        document.querySelector("header").style.display = v ? "block" : "none";
        document.querySelector("main").style.display = v ? "block" : "none";
        document.getElementById("garsonKilit").style.display = v
          ? "none"
          : "flex";
      }
      function kur() {
        const s = document.createElement("style");
        s.textContent =
          ".garson-kilit{position:fixed;inset:0;background:#f4f1ee;z-index:9999;display:flex;align-items:center;justify-content:center;padding:18px}.garson-kilit>div{background:#fff;width:min(94%,390px);padding:24px;border-radius:18px;text-align:center;box-shadow:0 12px 40px #0003}.garson-kilit input{width:100%;padding:13px;text-align:center;font-size:24px;letter-spacing:6px;border:1px solid #bbb;border-radius:10px}.garson-kilit button{width:100%;padding:12px;margin-top:9px;border:0;border-radius:9px;background:#4e342e;color:#fff;font-weight:bold}";
        document.head.appendChild(s);
        document.body.insertAdjacentHTML(
          "afterbegin",
          '<div id="garsonKilit" class="garson-kilit"><div><h2>🔐 Garson Girişi</h2><p>6 haneli ortak garson PIN’ini girin.</p><input id="pinGiris" inputmode="numeric" maxlength="6" placeholder="000000"><button onclick="garsonPinGiris()">Giriş Yap</button></div></div>',
        );
      }
      async function hash(x) {
        const b = await crypto.subtle.digest(
          "SHA-256",
          new TextEncoder().encode(x),
        );
        return [...new Uint8Array(b)]
          .map((v) => v.toString(16).padStart(2, "0"))
          .join("");
      }
      window.garsonPinGiris = async () => {
        try {
          const s = await getDoc(doc(dbs, "ayarlar", "guvenlik"));
          if (!s.exists() || !s.data().garsonPinHash)
            return alert("Önce yönetici panelinden garson PIN’i oluşturun.");
          if ((await hash(pinGiris.value.trim())) !== s.data().garsonPinHash)
            return alert("Garson PIN’i yanlış.");
          sessionStorage.setItem("dk_garson_giris", "ok");
          goster(true);
        } catch (e) {
          alert("Giriş kontrol edilemedi: " + e.message);
        }
      };
      kur();
      let yoneticiIcindenAcildi = false;
      try {
        const yonlendiren = new URL(document.referrer);
        yoneticiIcindenAcildi =
          window.self !== window.top &&
          yonlendiren.origin === location.origin &&
          yonlendiren.pathname.endsWith("/yonetici.html");
      } catch (_) {}
      goster(
        yoneticiIcindenAcildi ||
          sessionStorage.getItem("dk_garson_giris") === "ok",
      );
      if (window.self !== window.top) {
        ["pointerdown", "mousemove", "keydown", "touchstart", "scroll"].forEach(
          (olay) =>
            document.addEventListener(
              olay,
              () =>
                window.parent.postMessage(
                  { type: "dk-hareket" },
                  location.origin,
                ),
              { passive: true },
            ),
        );
      }
    </script>
    <style>
      .masa {
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
        position: relative;
      }
      .masa:hover {
        transform: scale(1.08);
        box-shadow: 0 12px 28px #0003;
        z-index: 3;
      }
    </style>
    <style>
      :root {
        --k: #4e342e;
        --bg: #f4f1ee;
        --y: #2e7d32;
        --r: #c62828;
        --t: #ef6c00;
        --m: #1565c0;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Arial;
        background: var(--bg);
        color: #33231e;
      }
      header {
        background: var(--k);
        color: #fff;
        padding: 20px;
      }
      header > div,
      main {
        max-width: 1250px;
        margin: auto;
      }
      h1 {
        margin: 0;
      }
      .alt {
        opacity: 0.8;
        margin-top: 5px;
      }
      main {
        padding: 15px;
      }
      .bar {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        background: #fff;
        padding: 13px;
        border-radius: 13px;
      }
      .canli {
        color: var(--y);
        font-weight: bold;
      }
      button {
        border: 0;
        border-radius: 9px;
        padding: 10px;
        font-weight: bold;
        cursor: pointer;
      }
      .yenile {
        background: var(--k);
        color: #fff;
      }
      h2 {
        font-size: 21px;
        margin: 24px 0 11px;
      }
      .masalar {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 11px;
      }
      .masa {
        background: #fff;
        border: 2px solid #ddd;
        border-radius: 15px;
        padding: 14px;
        text-align: center;
        box-shadow: 0 4px 14px #0001;
      }
      .masa.acik {
        border-color: var(--y);
        background: #f1f8f2;
      }
      .no {
        font-size: 23px;
        font-weight: 800;
      }
      .md {
        margin: 8px 0 12px;
        font-weight: bold;
      }
      .acik .md {
        color: var(--y);
      }
      .kapali .md {
        color: var(--r);
      }
      .masa button {
        width: 100%;
        color: #fff;
      }
      .ac {
        background: var(--y);
      }
      .kapat {
        background: var(--r);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
      .kart {
        background: #fff;
        border-radius: 14px;
        padding: 14px;
        box-shadow: 0 4px 14px #0001;
        border-top: 5px solid var(--t);
      }
      .kart.cagri {
        border-color: var(--r);
      }
      .ku {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }
      .ku b {
        font-size: 20px;
      }
      .zaman {
        font-size: 12px;
        color: #6d625d;
      }
      .urun {
        display: flex;
        justify-content: space-between;
        padding: 6px 0;
        border-bottom: 1px solid #eee;
      }
      .toplam {
        text-align: right;
        font-size: 18px;
        font-weight: bold;
        margin: 11px 0;
      }
      .sip-butonlar {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 7px;
      }
      .duzenle {
        background: #fff3e0;
        color: #8a4b00;
      }
      .onay {
        background: var(--y);
        color: #fff;
      }
      .ct {
        background: var(--m);
        color: #fff;
        width: 100%;
      }
      .bos {
        grid-column: 1/-1;
        text-align: center;
        background: #fff;
        color: #736965;
        border-radius: 13px;
        padding: 25px;
      }
      .hazirlik-ozet {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }
      .hazirlik-urun {
        background: #fff;
        border-left: 6px solid var(--t);
        border-radius: 12px;
        padding: 13px;
        box-shadow: 0 4px 14px #0001;
      }
      .hazirlik-urun b {
        display: block;
        font-size: 22px;
        margin-top: 6px;
        color: var(--k);
      }
      .hazirlik-masalar {
        margin-top: 6px;
        color: #6d625d;
        font-size: 12px;
      }
      .toast {
        position: fixed;
        top: 15px;
        left: 50%;
        transform: translate(-50%, -100px);
        background: #263238;
        color: #fff;
        padding: 12px 18px;
        border-radius: 10px;
        z-index: 20;
        transition: 0.25s;
      }
      .toast.goster {
        transform: translate(-50%, 0);
      }
      dialog {
        border: 0;
        border-radius: 17px;
        padding: 0;
        width: min(94%, 520px);
        box-shadow: 0 20px 60px #0007;
      }
      dialog::backdrop {
        background: #0009;
      }
      .pencere {
        padding: 19px;
      }
      .pencere h2 {
        margin-top: 0;
      }
      .duzenleme-satir {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid #eee;
      }
      .adet-sec {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .adet-sec button {
        width: 32px;
        height: 32px;
        padding: 0;
      }
      .pencere-alt {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 15px;
      }
      .iptal {
        background: #eee;
      }
      .kaydet {
        background: var(--k);
        color: #fff;
      }
      @media (max-width: 950px) {
        .masalar {
          grid-template-columns: repeat(3, 1fr);
        }
        .grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .hazirlik-ozet {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 580px) {
        .masalar {
          grid-template-columns: repeat(2, 1fr);
        }
        .grid {
          grid-template-columns: 1fr;
        }
        .hazirlik-ozet {
          grid-template-columns: repeat(2, 1fr);
        }
        .bar {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div id="toast" class="toast"></div>
    <header>
      <div>
        <h1>☕ DİJİTAL KAHVEM</h1>
        <div class="alt">Garson Paneli</div>
      </div>
    </header>
    <main>
      <div class="bar">
        <div>
          <span class="canli">● Firebase canlı</span> ·
          <b id="acikSayisi">0</b> açık masa ·
          <b id="siparisSayisi">0</b> bekleyen sipariş
        </div>
        <button class="yenile" onclick="location.reload()">↻ Yenile</button>
      </div>
      <h2>🔔 Garson Çağrıları</h2>
      <section id="cagrilar" class="grid">
        <div class="bos">Yükleniyor…</div>
      </section>
      <h2>☕ Hazırlanacak Ürünler</h2>
      <section id="hazirlikOzeti" class="hazirlik-ozet">
        <div class="bos">Bekleyen ürünler yükleniyor…</div>
      </section>
      <h2>🧾 Siparişler</h2>
      <section id="siparisler" class="grid">
        <div class="bos">Yükleniyor…</div>
      </section>
      <h2>🪑 Masalar</h2>
      <section id="masalar" class="masalar"></section>
    </main>
    <dialog id="duzenlePencere">
      <div class="pencere">
        <h2 id="duzenleBaslik">Siparişi Düzenle</h2>
        <div id="duzenleListe"></div>
        <div class="toplam">
          Yeni toplam: <span id="duzenleToplam">₺0</span>
        </div>
        <div class="pencere-alt">
          <button class="iptal" onclick="duzenlePencere.close()">Vazgeç</button
          ><button class="kaydet" onclick="duzenlemeyiKaydet()">
            Değişiklikleri Kaydet
          </button>
        </div>
      </div>
    </dialog>
    <dialog id="masaPencere">
      <div class="pencere">
        <h2 id="masaBaslik">Masaya Sipariş Gir</h2>
        <div id="masaMenu"></div>
        <div class="toplam">Toplam: <span id="masaToplam">₺0</span></div>
        <div class="pencere-alt">
          <button class="iptal" onclick="masaPencere.close()">Vazgeç</button
          ><button class="kaydet" onclick="garsonSiparisGonder()">
            Siparişi Gönder
          </button>
        </div>
      </div>
    </dialog>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
      import {
        getFirestore,
        collection,
        addDoc,
        query,
        where,
        onSnapshot,
        serverTimestamp,
        doc,
        updateDoc,
        getDocs,
      } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
      const cfg = {
          apiKey: "AIzaSyC05yXQzAlF2AYzzeaJrDdMUYKwohKOsWM",
          authDomain: "dijitalkahve-67f0a.firebaseapp.com",
          databaseURL:
            "https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "dijitalkahve-67f0a",
          storageBucket: "dijitalkahve-67f0a.firebasestorage.app",
          messagingSenderId: "326476599239",
          appId: "1:326476599239:web:143f39583a3478118853e2",
          measurementId: "G-WM65PC4648",
        },
        db = getFirestore(initializeApp(cfg));
      let oturumlar = {};
      const para = (n) =>
          new Intl.NumberFormat("tr-TR", {
            style: "currency",
            currency: "TRY",
            maximumFractionDigits: 2,
          }).format(Number(n || 0)),
        zaman = (t) =>
          t?.toDate?.().toLocaleTimeString("tr-TR", {
            hour: "2-digit",
            minute: "2-digit",
          }) || "Şimdi";
      function mesaj(m) {
        const e = document.getElementById("toast");
        e.textContent = m;
        e.classList.add("goster");
        setTimeout(() => e.classList.remove("goster"), 2200);
      }
      let garsonMenu = {};
      let aktifMasa = null,
        garsonSepet = {};
      onSnapshot(collection(db, "menu"), (snap) => {
        garsonMenu = {};
        const yeniSepet = {};
        snap.docs
          .map((d) => d.data())
          .filter((x) => x.aktif !== false && x.ad)
          .forEach((x) => {
            garsonMenu[x.ad] = Number(x.fiyat || 0);
            yeniSepet[x.ad] = garsonSepet[x.ad] || 0;
          });
        garsonSepet = yeniSepet;
        if (document.getElementById("masaPencere").open) masaMenuCiz();
      });
      function masalariCiz() {
        document.getElementById("masalar").innerHTML = Array.from(
          { length: 10 },
          (_, i) => i + 1,
        )
          .map((no) => {
            const o = oturumlar[no];
            return `<article class="masa ${o ? "acik" : "kapali"}"><div class="no">Masa ${no}</div><div class="md">${o ? "🟢 OTURUM AÇIK" : "🔴 KAPALI"}</div>${o ? `<div style="margin:8px 0;font-weight:bold;color:#7b1fa2">${o.masaKodu ? "Masa Kodu: " + o.masaKodu : "Müşteri kodu bekleniyor"}</div><button style="background:var(--m)" onclick="masayaGir(${no})">Masaya Gir</button>` : `<button class="ac" onclick="masaAc(${no},this)">Masayı Aç</button>`}</article>`;
          })
          .join("");
        document.getElementById("acikSayisi").textContent =
          Object.keys(oturumlar).length;
      }
      window.masaAc = async (no, buton) => {
        if (oturumlar[no] || buton.disabled) return;
        const kart = buton.closest(".masa"),
          durum = kart.querySelector(".md");
        buton.disabled = true;
        kart.className = "masa acik";
        durum.textContent = "🟢 OTURUM AÇILIYOR";
        buton.textContent = "Açılıyor…";
        try {
          const yeni = await addDoc(collection(db, "oturumlar"), {
            masa: no,
            durum: "acik",
            masaKodu: null,
            musteriGirisiAktif: false,
            acilisZamani: serverTimestamp(),
          });
          oturumlar[no] = {
            id: yeni.id,
            masa: no,
            durum: "acik",
            masaKodu: null,
            musteriGirisiAktif: false,
          };
          masalariCiz();
          mesaj(`Masa ${no} açıldı`);
        } catch (e) {
          kart.className = "masa kapali";
          durum.textContent = "🔴 KAPALI";
          buton.disabled = false;
          buton.textContent = "Masayı Aç";
          alert("Masa açılamadı: " + e.message);
        }
      };
      window.masaKapat = async (no) => {
        const o = oturumlar[no];
        if (!o || !confirm(`Masa ${no} kapatılsın mı?`)) return;
        try {
          await updateDoc(doc(db, "oturumlar", o.id), {
            durum: "kapali",
            kapanisZamani: serverTimestamp(),
          });
          mesaj(`Masa ${no} kapatıldı`);
        } catch (e) {
          alert("Masa kapatılamadı: " + e.message);
        }
      };
      onSnapshot(
        collection(db, "oturumlar"),
        (s) => {
          oturumlar = {};
          s.docs.forEach((d) => {
            const x = d.data(),
              n = Number(x.masa);
            if (x.durum === "acik" && n >= 1 && n <= 10)
              oturumlar[n] = { id: d.id, ...x };
          });
          masalariCiz();
        },
        (e) => alert("Masalar yüklenemedi: " + e.message),
      );
      onSnapshot(
        collection(db, "garsonCagrilari"),
        (s) => {
          const l = s.docs
            .map((d) => ({ id: d.id, ...d.data() }))
            .filter((x) => x.durum === "bekliyor");
          document.getElementById("cagrilar").innerHTML = l.length
            ? l
                .map(
                  (c) =>
                    `<article class="kart cagri"><div class="ku"><b>🔔 Masa ${c.masa}</b><span class="zaman">${zaman(c.zaman)}</span></div><p>Garson bekliyor.</p><button class="ct" onclick="cagriTamam('${c.id}')">Çağrıyı Tamamla</button></article>`,
                )
                .join("")
            : '<div class="bos">Bekleyen çağrı yok.</div>';
        },
        (e) =>
          (document.getElementById("cagrilar").innerHTML =
            `<div class="bos">${e.message}</div>`),
      );
      window.cagriTamam = async (id) => {
        try {
          await updateDoc(doc(db, "garsonCagrilari", id), {
            durum: "tamamlandi",
            tamamlanmaZamani: serverTimestamp(),
          });
          mesaj("Çağrı tamamlandı");
        } catch (e) {
          alert(e.message);
        }
      };
      window.masayaGir = (no) => {
        if (!oturumlar[no]) return mesaj("Önce masayı açın");
        window.open(`index.html?masa=${no}&kaynak=garson`, "_blank");
      };
      function masaMenuCiz() {
        document.getElementById("masaMenu").innerHTML = Object.entries(
          garsonMenu,
        )
          .map(
            ([u, f]) =>
              `<div class="duzenleme-satir"><div><b>${u}</b><br><small>${para(f)}</small></div><div class="adet-sec"><button onclick="garsonAdet(decodeURIComponent('${encodeURIComponent(u)}'),-1)">−</button><b>${garsonSepet[u]}</b><button onclick="garsonAdet(decodeURIComponent('${encodeURIComponent(u)}'),1)">+</button></div></div>`,
          )
          .join("");
        document.getElementById("masaToplam").textContent = para(
          Object.entries(garsonSepet).reduce(
            (t, [u, a]) => t + garsonMenu[u] * a,
            0,
          ),
        );
      }
      window.garsonAdet = (u, f) => {
        garsonSepet[u] = Math.max(0, garsonSepet[u] + f);
        masaMenuCiz();
      };
      window.garsonSiparisGonder = async () => {
        const urunler = Object.entries(garsonSepet)
          .filter(([, a]) => a > 0)
          .map(([urun, adet]) => ({
            urun,
            adet,
            fiyat: garsonMenu[urun],
            tutar: garsonMenu[urun] * adet,
          }));
        if (!urunler.length) return alert("En az bir ürün seçin.");
        const o = oturumlar[aktifMasa];
        if (!o) return alert("Masa oturumu kapanmış.");
        try {
          const toplam = urunler.reduce((t, u) => t + u.tutar, 0);
          await addDoc(collection(db, "siparisler"), {
            masa: String(aktifMasa),
            oturumId: o.id,
            urunler,
            toplam,
            durum: "Bekleyen",
            kaynak: "garson",
            garsonSiparisi: true,
            olusturmaZamani: serverTimestamp(),
          });
          masaPencere.close();
          mesaj(`Masa ${aktifMasa} siparişi onay bekliyor`);
        } catch (e) {
          alert("Sipariş gönderilemedi: " + e.message);
        }
      };
      let siparisler = [],
        duzenlenen = null;
      onSnapshot(
        collection(db, "siparisler"),
        (s) => {
          siparisler = s.docs
            .map((d) => ({ id: d.id, ...d.data() }))
            .filter((x) => x.durum === "Bekleyen")
            .sort(
              (a, b) =>
                (b.olusturmaZamani?.toMillis?.() || 0) -
                (a.olusturmaZamani?.toMillis?.() || 0),
            );
          document.getElementById("siparisSayisi").textContent =
            siparisler.length;
          const urunOzeti = {};
          siparisler.forEach((siparis) =>
            (siparis.urunler || []).forEach((u) => {
              const x =
                urunOzeti[u.urun] ||
                (urunOzeti[u.urun] = { adet: 0, masalar: {} });
              x.adet += Number(u.adet || 0);
              x.masalar[siparis.masa] =
                (x.masalar[siparis.masa] || 0) + Number(u.adet || 0);
            }),
          );
          document.getElementById("hazirlikOzeti").innerHTML = Object.keys(
            urunOzeti,
          ).length
            ? Object.entries(urunOzeti)
                .sort((a, b) => b[1].adet - a[1].adet)
                .map(
                  ([ad, v]) =>
                    `<article class="hazirlik-urun"><span>${ad}</span><b>${v.adet} adet</b><div class="hazirlik-masalar">${Object.entries(
                      v.masalar,
                    )
                      .map(([m, adet]) => `Masa ${m}: ${adet}`)
                      .join(" · ")}</div></article>`,
                )
                .join("")
            : '<div class="bos">Hazırlanacak bekleyen ürün yok.</div>';
          document.getElementById("siparisler").innerHTML = siparisler.length
            ? siparisler
                .map(
                  (x) =>
                    `<article class="kart"><div class="ku"><b>Masa ${x.masa}</b><span class="zaman">${zaman(x.olusturmaZamani)}</span></div>${(x.urunler || []).map((u) => `<div class="urun"><span>${u.adet} × ${u.urun}</span><b>${para(u.tutar)}</b></div>`).join("")}<div class="toplam">${para(x.toplam)}</div><div class="sip-butonlar"><button class="duzenle" onclick="siparisDuzenle('${x.id}')">✏️ Düzenle</button><button class="onay" onclick="siparisOnayla('${x.id}')">✓ Onayla</button></div></article>`,
                )
                .join("")
            : '<div class="bos">Bekleyen sipariş yok.</div>';
        },
        (e) => {
          document.getElementById("siparisler").innerHTML =
            `<div class="bos">${e.message}</div>`;
          document.getElementById("hazirlikOzeti").innerHTML =
            `<div class="bos">Ürün özeti yüklenemedi.</div>`;
        },
      );
      window.siparisDuzenle = (id) => {
        const s = siparisler.find((x) => x.id === id);
        if (!s) return;
        duzenlenen = {
          id: s.id,
          masa: s.masa,
          urunler: (s.urunler || []).map((u) => ({ ...u })),
        };
        document.getElementById("duzenleBaslik").textContent =
          `Masa ${s.masa} Siparişini Düzenle`;
        duzenlemeCiz();
        duzenlePencere.showModal();
      };
      function duzenlemeCiz() {
        duzenlenen.urunler = duzenlenen.urunler.filter(
          (u) => Number(u.adet) > 0,
        );
        document.getElementById("duzenleListe").innerHTML = duzenlenen.urunler
          .length
          ? duzenlenen.urunler
              .map(
                (u, i) =>
                  `<div class="duzenleme-satir"><div><b>${u.urun}</b><br><small>${para(u.fiyat)} × ${u.adet}</small></div><div class="adet-sec"><button onclick="adetDegistir(${i},-1)">−</button><b>${u.adet}</b><button onclick="adetDegistir(${i},1)">+</button></div></div>`,
              )
              .join("")
          : '<div class="bos">Siparişte ürün kalmadı.</div>';
        document.getElementById("duzenleToplam").textContent = para(
          duzenlenen.urunler.reduce(
            (a, u) => a + Number(u.fiyat) * Number(u.adet),
            0,
          ),
        );
      }
      window.adetDegistir = (i, fark) => {
        duzenlenen.urunler[i].adet = Number(duzenlenen.urunler[i].adet) + fark;
        duzenlenen.urunler[i].tutar =
          Number(duzenlenen.urunler[i].fiyat) * duzenlenen.urunler[i].adet;
        duzenlemeCiz();
      };
      window.duzenlemeyiKaydet = async () => {
        if (!duzenlenen.urunler.length)
          return alert("Siparişte en az bir ürün kalmalıdır.");
        try {
          const urunler = duzenlenen.urunler.map((u) => ({
              ...u,
              adet: Number(u.adet),
              tutar: Number(u.fiyat) * Number(u.adet),
            })),
            toplam = urunler.reduce((a, u) => a + u.tutar, 0);
          await updateDoc(doc(db, "siparisler", duzenlenen.id), {
            urunler,
            toplam,
            garsonTarafindanDuzenlendi: true,
            guncellemeZamani: serverTimestamp(),
          });
          duzenlePencere.close();
          mesaj("Sipariş düzenlendi");
        } catch (e) {
          alert("Kaydedilemedi: " + e.message);
        }
      };
      window.siparisOnayla = async (id) => {
        try {
          await updateDoc(doc(db, "siparisler", id), {
            durum: "Onaylandı",
            onayZamani: serverTimestamp(),
          });
          mesaj("Sipariş onaylandı");
        } catch (e) {
          alert("Onaylanamadı: " + e.message);
        }
      };
      masalariCiz();
    </script>
  </body>
</html>
