<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dijital Kahvem - Garson</title>
<style>:root{--k:#4e342e;--bg:#f4f1ee;--y:#2e7d32;--r:#c62828;--t:#ef6c00;--m:#1565c0}*{box-sizing:border-box}body{margin:0;font-family:Arial;background:var(--bg);color:#33231e}header{background:var(--k);color:#fff;padding:20px}header>div,main{max-width:1250px;margin:auto}h1{margin:0}.alt{opacity:.8;margin-top:5px}main{padding:15px}.bar{display:flex;justify-content:space-between;gap:10px;background:#fff;padding:13px;border-radius:13px}.canli{color:var(--y);font-weight:bold}button{border:0;border-radius:9px;padding:10px;font-weight:bold;cursor:pointer}.yenile{background:var(--k);color:#fff}h2{font-size:21px;margin:24px 0 11px}.masalar{display:grid;grid-template-columns:repeat(5,1fr);gap:11px}.masa{background:#fff;border:2px solid #ddd;border-radius:15px;padding:14px;text-align:center;box-shadow:0 4px 14px #0001}.masa.acik{border-color:var(--y);background:#f1f8f2}.no{font-size:23px;font-weight:800}.md{margin:8px 0 12px;font-weight:bold}.acik .md{color:var(--y)}.kapali .md{color:var(--r)}.masa button{width:100%;color:#fff}.ac{background:var(--y)}.kapat{background:var(--r)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.kart{background:#fff;border-radius:14px;padding:14px;box-shadow:0 4px 14px #0001;border-top:5px solid var(--t)}.kart.cagri{border-color:var(--r)}.ku{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.ku b{font-size:20px}.zaman{font-size:12px;color:#6d625d}.urun{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee}.toplam{text-align:right;font-size:18px;font-weight:bold;margin:11px 0}.kart button,.kart select{width:100%;padding:10px;border-radius:9px;font-weight:bold}.kart select{border:1px solid #d5cac5;background:#fff;margin-bottom:7px}.onay{background:var(--y);color:#fff}.ct{background:var(--m);color:#fff}.bos{grid-column:1/-1;text-align:center;background:#fff;color:#736965;border-radius:13px;padding:25px}.toast{position:fixed;top:15px;left:50%;transform:translate(-50%,-100px);background:#263238;color:#fff;padding:12px 18px;border-radius:10px;z-index:20;transition:.25s}.toast.goster{transform:translate(-50%,0)}@media(max-width:950px){.masalar{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:580px){.masalar{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.bar{flex-direction:column}}</style></head>
<body><div id="toast" class="toast"></div><header><div><h1>☕ DİJİTAL KAHVEM</h1><div class="alt">Garson Paneli</div></div></header><main><div class="bar"><div><span class="canli">● Firebase canlı</span> · <b id="acikSayisi">0</b> açık masa · <b id="siparisSayisi">0</b> bekleyen sipariş</div><button class="yenile" onclick="location.reload()">↻ Yenile</button></div><h2>🪑 Masalar</h2><section id="masalar" class="masalar"></section><h2>🔔 Garson Çağrıları</h2><section id="cagrilar" class="grid"><div class="bos">Yükleniyor…</div></section><h2>🧾 Siparişler</h2><section id="siparisler" class="grid"><div class="bos">Yükleniyor…</div></section></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";import{getFirestore,collection,addDoc,query,where,onSnapshot,serverTimestamp,doc,updateDoc,getDocs}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyC05yXQzAlF2AYzzeaJrDdMUYKwohKOsWM",authDomain:"dijitalkahve-67f0a.firebaseapp.com",databaseURL:"https://dijitalkahve-67f0a-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"dijitalkahve-67f0a",storageBucket:"dijitalkahve-67f0a.firebasestorage.app",messagingSenderId:"326476599239",appId:"1:326476599239:web:143f39583a3478118853e2",measurementId:"G-WM65PC4648"},db=getFirestore(initializeApp(cfg));let oturumlar={};
const para=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:2}).format(Number(n||0)),zaman=t=>t?.toDate?.().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})||'Şimdi';function mesaj(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('goster');setTimeout(()=>e.classList.remove('goster'),2200)}
function masalariCiz(){document.getElementById('masalar').innerHTML=Array.from({length:10},(_,i)=>i+1).map(no=>{const o=oturumlar[no];return `<article class="masa ${o?'acik':'kapali'}"><div class="no">Masa ${no}</div><div class="md">${o?'🟢 OTURUM AÇIK':'🔴 KAPALI'}</div><button class="${o?'kapat':'ac'}" onclick="${o?`masaKapat(${no})`:`masaAc(${no})`}">${o?'Masayı Kapat':'Masayı Aç'}</button></article>`}).join('');document.getElementById('acikSayisi').textContent=Object.keys(oturumlar).length}
window.masaAc=async no=>{try{const q=query(collection(db,'oturumlar'),where('masa','==',no),where('durum','==','acik')),s=await getDocs(q);if(!s.empty)return mesaj(`Masa ${no} zaten açık`);await addDoc(collection(db,'oturumlar'),{masa:no,durum:'acik',acilisZamani:serverTimestamp()});mesaj(`Masa ${no} açıldı`)}catch(e){alert('Masa açılamadı: '+e.message)}};
window.masaKapat=async no=>{const o=oturumlar[no];if(!o||!confirm(`Masa ${no} kapatılsın mı?`))return;try{await updateDoc(doc(db,'oturumlar',o.id),{durum:'kapali',kapanisZamani:serverTimestamp()});mesaj(`Masa ${no} kapatıldı`)}catch(e){alert('Masa kapatılamadı: '+e.message)}};
onSnapshot(collection(db,'oturumlar'),s=>{oturumlar={};s.docs.forEach(d=>{const x=d.data(),n=Number(x.masa);if(x.durum==='acik'&&n>=1&&n<=10)oturumlar[n]={id:d.id,...x}});masalariCiz()},e=>alert('Masalar yüklenemedi: '+e.message));
onSnapshot(collection(db,'garsonCagrilari'),s=>{const l=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.durum==='bekliyor');document.getElementById('cagrilar').innerHTML=l.length?l.map(c=>`<article class="kart cagri"><div class="ku"><b>🔔 Masa ${c.masa}</b><span class="zaman">${zaman(c.zaman)}</span></div><p>Garson bekliyor.</p><button class="ct" onclick="cagriTamam('${c.id}')">Çağrıyı Tamamla</button></article>`).join(''):'<div class="bos">Bekleyen çağrı yok.</div>'},e=>document.getElementById('cagrilar').innerHTML=`<div class="bos">${e.message}</div>`);
window.cagriTamam=async id=>{try{await updateDoc(doc(db,'garsonCagrilari',id),{durum:'tamamlandi',tamamlanmaZamani:serverTimestamp()});mesaj('Çağrı tamamlandı')}catch(e){alert(e.message)}};
onSnapshot(collection(db,'siparisler'),s=>{const l=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>!['Tamamlandı','Iptal'].includes(x.durum));document.getElementById('siparisSayisi').textContent=l.filter(x=>x.durum==='Bekleyen').length;document.getElementById('siparisler').innerHTML=l.length?l.map(x=>`<article class="kart"><div class="ku"><b>Masa ${x.masa}</b><span class="zaman">${zaman(x.olusturmaZamani)}</span></div>${(x.urunler||[]).map(u=>`<div class="urun"><span>${u.adet} × ${u.urun}</span><b>${para(u.tutar)}</b></div>`).join('')}<div class="toplam">${para(x.toplam)}</div><select id="d_${x.id}">${['Bekleyen','Onaylandı','Hazırlanıyor','Hazır','Teslim Edildi','Tamamlandı'].map(d=>`<option ${x.durum===d?'selected':''}>${d}</option>`).join('')}</select><button class="onay" onclick="durumKaydet('${x.id}')">Durumu Kaydet</button></article>`).join(''):'<div class="bos">Açık sipariş yok.</div>'},e=>document.getElementById('siparisler').innerHTML=`<div class="bos">${e.message}</div>`);
window.durumKaydet=async id=>{try{await updateDoc(doc(db,'siparisler',id),{durum:document.getElementById('d_'+id).value,guncellemeZamani:serverTimestamp()});mesaj('Sipariş güncellendi')}catch(e){alert(e.message)}};masalariCiz();
</script></body></html>
